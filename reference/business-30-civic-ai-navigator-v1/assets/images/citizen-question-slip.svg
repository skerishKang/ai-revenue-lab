<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d"><title id="t">시민 질문 쪽지</title><desc id="d">주소 변경과 생활요금 정리를 묻는 합성 질문 쪽지</desc><rect x="14" y="14" width="732" height="332" fill="#fffaf0" stroke="#18364a" stroke-width="4"/><path d="M40 72H720M40 132H720M40 192H720M40 252H720" stroke="#b9c9c7" stroke-width="2"/><text x="46" y="56" fill="#d85b43" font-family="Arial,sans-serif" font-size="18" font-weight="700">CITIZEN QUESTION · SYNTHETIC</text><text x="46" y="116" fill="#18364a" font-family="Arial,sans-serif" font-size="25">부모님이 다른 지역으로 이사한 뒤</text><text x="46" y="176" fill="#18364a" font-family="Arial,sans-serif" font-size="25">주소 변경과 생활요금 정리를</text><text x="46" y="236" fill="#18364a" font-family="Arial,sans-serif" font-size="25">어디서부터 해야 하나요?</text><text x="46" y="320" fill="#67757d" font-family="Arial,sans-serif" font-size="16">질문을 상황·관할·준비물·예외로 분해합니다.</text></svg>
