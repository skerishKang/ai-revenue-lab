<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="t d"><title id="t">절차 경로표</title><desc id="d">합성 시민 절차의 세 단계를 보여주는 경로표</desc><rect width="760" height="500" fill="#fffaf0"/><path d="M110 94V408" stroke="#18364a" stroke-width="8"/><circle cx="110" cy="110" r="32" fill="#f4c95d" stroke="#18364a" stroke-width="5"/><circle cx="110" cy="250" r="32" fill="#f4c95d" stroke="#18364a" stroke-width="5"/><circle cx="110" cy="390" r="32" fill="#f4c95d" stroke="#18364a" stroke-width="5"/><text x="100" y="120" text-anchor="middle" fill="#18364a" font-family="Arial,sans-serif" font-size="26" font-weight="700">1</text><text x="100" y="260" text-anchor="middle" fill="#18364a" font-family="Arial,sans-serif" font-size="26" font-weight="700">2</text><text x="100" y="400" text-anchor="middle" fill="#18364a" font-family="Arial,sans-serif" font-size="26" font-weight="700">3</text><text x="180" y="110" fill="#18364a" font-family="Arial,sans-serif" font-size="28" font-weight="700">전입신고 확인</text><text x="180" y="150" fill="#66747a" font-family="Arial,sans-serif" font-size="17">관할·처리 상태부터 확인</text><text x="180" y="250" fill="#18364a" font-family="Arial,sans-serif" font-size="28" font-weight="700">공공요금 변경</text><text x="180" y="290" fill="#66747a" font-family="Arial,sans-serif" font-size="17">명의와 주소 변경을 분리</text><text x="180" y="390" fill="#18364a" font-family="Arial,sans-serif" font-size="28" font-weight="700">차량·복지·우편 분기</text><text x="180" y="430" fill="#66747a" font-family="Arial,sans-serif" font-size="17">상황별 담당 확인 필요</text></svg>
