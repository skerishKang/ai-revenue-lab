<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>고전문학 번역실 · UX Demo</title><style>:root{--paper:#f3efe6;--ink:#201d19;--line:#c8c0b2;--blue:#415f6c;--green:#526b57;--red:#99564b;--gold:#9c7a43}*{box-sizing:border-box}body{margin:0;background:#d8d2c7;color:var(--ink);font-family:Georgia,"Noto Serif KR",serif}.app{max-width:1080px;margin:auto;background:var(--paper);min-height:100vh}.head{padding:22px 25px;background:#1b1916;color:#fff;display:flex;justify-content:space-between}.nav{display:flex;overflow:auto;border-bottom:1px solid var(--ink)}.nav button{border:0;border-right:1px solid var(--line);background:none;padding:12px 15px;cursor:pointer;white-space:nowrap}.nav button[aria-current=page]{background:var(--blue);color:#fff}.view{display:none;padding:30px 26px 60px}.view.active{display:block}h1{font-size:clamp(38px,6vw,60px);line-height:1.05;margin:5px 0 22px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card,.sheet{background:#fff;border:1px solid var(--line);padding:18px}.choice{cursor:pointer;text-align:left}.choice.active{box-shadow:inset 0 0 0 2px var(--blue);border-color:var(--blue)}.source{font-size:18px;line-height:1.8}.translation{line-height:1.8}.label{display:inline-block;border:1px solid currentColor;padding:3px 7px;font-size:12px}.fidelity{color:var(--green)}.modern{color:var(--gold)}.loss{color:var(--red)}.ledger{display:grid;gap:9px}.ledger button{padding:12px;text-align:left;border:1px solid var(--line);background:#fff;cursor:pointer}.ledger button.active{background:var(--green);color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.actions button{padding:10px 13px;border:1px solid var(--ink);background:none;cursor:pointer}.actions .primary{background:var(--ink);color:#fff}.status{min-height:22px;color:var(--red);font-size:13px;margin-top:10px}@media(max-width:720px){.grid{grid-template-columns:1fr}h1{font-size:43px}}</style></head><body><main class="app"><header class="head"><b>고전문학 번역실</b><small>PUBLIC DOMAIN · REVIEW DEMO</small></header><nav class="nav"><button data-view="library" aria-current="page">서가</button><button data-view="compare">원문·번역</button><button data-view="ledger">판단 기록</button><button data-view="edition">판본 검토</button></nav><section class="view active" id="library"><h1>읽을 작품보다 먼저<br>어떤 판본을 만들지 정합니다.</h1><div class="grid"><button class="card choice" data-work="Frankenstein · 1818" data-kind="prose"><b>Frankenstein · 1818</b><p>원전 보존 번역과 현대 읽기판 비교</p></button><button class="card choice" data-work="The Sick Rose" data-kind="poetry"><b>The Sick Rose</b><p>시행·이미지·압축을 유지하는 고전시 검토</p></button></div><div class="actions"><button id="openWork" class="primary">선택 작품 번역 검토</button></div><div class="status" id="libStatus" role="status"></div></section><section class="view" id="compare"><h1>번역문보다<br>무엇을 보존하고 잃었는지 봅니다.</h1><div class="grid"><article class="sheet"><span class="label">SOURCE</span><p class="source" id="sourceText"></p></article><article class="sheet"><span class="label fidelity">ORIGINAL-FIDELITY</span><p class="translation" id="faithful"></p><hr><span class="label modern">MODERN-READING</span><p class="translation" id="modern"></p><p class="loss" id="loss"></p></article></div><div class="actions"><button data-go="library">서가로</button><button class="primary" data-go="ledger">번역 판단 표시</button></div></section><section class="view" id="ledger"><h1>좋아 보이는 문장 대신<br>판단 이유를 남깁니다.</h1><div class="ledger"><button data-ledger="syntax"><b>문장 구조</b> · 원문의 호흡을 우선 보존</button><button data-ledger="image"><b>이미지/비유</b> · 해설로 치환하지 않음</button><button data-ledger="register"><b>문체 높낮이</b> · 현대화판에서만 완화</button><button data-ledger="loss"><b>손실 공개</b> · 단순화한 부분은 별도 표시</button></div><div class="actions"><button data-go="compare">비교로</button><button id="editionBtn" class="primary">판본 검토로</button></div><div class="status" id="ledgerStatus" role="status"></div></section><section class="view" id="edition"><h1>승인하는 것은 번역이 아니라<br>검토용 판본입니다.</h1><div class="grid"><button class="card choice" data-edition="fidelity"><b>원전 보존본</b><p>기본 판본. 구조·이미지·모호성 유지 우선.</p></button><button class="card choice" data-edition="modern"><b>현대 읽기본</b><p>부가 판본. 단순화·해석·손실을 명시.</p></button></div><div class="sheet" id="summary" style="margin-top:14px"><b>아직 판본을 선택하지 않았습니다.</b></div><div class="actions"><button data-go="ledger">판단 기록으로</button><button id="finish" class="primary">검토 완료 표시</button></div><div class="status" id="editionStatus" role="status"></div></section></main><script>(()=>{let work='',kind='',edition='';const marks=new Set(),views=[...document.querySelectorAll('.view')],tabs=[...document.querySelectorAll('.nav button')];const data={prose:{source:'“It was on a dreary night of November, that I beheld the accomplishment of my toils.”',faithful:'“황량한 11월의 어느 밤, 나는 마침내 내 노고가 완성된 모습을 바라보았다.”',modern:'“쓸쓸한 11월 밤, 마침내 내가 해온 일이 완성됐다.”',loss:'현대 읽기본: beheld의 응시감과 toils의 무게가 단순화됨.'},poetry:{source:'“O Rose, thou art sick.”',faithful:'“오 장미여, 너는 병들었구나.”',modern:'“장미야, 너는 병들었어.”',loss:'현대 읽기본: 호격의 고전적 높임과 리듬이 약화됨.'}};function open(id,push=true){views.forEach(v=>v.classList.toggle('active',v.id===id));tabs.forEach(t=>t.setAttribute('aria-current',t.dataset.view===id?'page':'false'));if(push)history.pushState({id},'',`#${id}`)}tabs.forEach(b=>b.onclick=()=>open(b.dataset.view));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>open(b.dataset.go));document.querySelectorAll('[data-work]').forEach(b=>b.onclick=()=>{work=b.dataset.work;kind=b.dataset.kind;document.querySelectorAll('[data-work]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#libStatus').textContent=`선택: ${work}`});document.querySelector('#openWork').onclick=()=>{if(!work){document.querySelector('#libStatus').textContent='작품을 하나 선택하세요.';return}const d=data[kind];sourceText.textContent=d.source;faithful.textContent=d.faithful;modern.textContent=d.modern;loss.textContent=d.loss;open('compare')};document.querySelectorAll('[data-ledger]').forEach(b=>b.onclick=()=>{const k=b.dataset.ledger;marks.has(k)?marks.delete(k):marks.add(k);b.classList.toggle('active',marks.has(k));ledgerStatus.textContent=`판단 기록 ${marks.size}/4`});editionBtn.onclick=()=>marks.size>=3?open('edition'):ledgerStatus.textContent='최소 세 가지 판단 기준을 확인하세요.';document.querySelectorAll('[data-edition]').forEach(b=>b.onclick=()=>{edition=b.dataset.edition;document.querySelectorAll('[data-edition]').forEach(x=>x.classList.toggle('active',x===b));summary.innerHTML=`<b>${work} · ${edition==='fidelity'?'원전 보존본':'현대 읽기본'} 검토 선택</b><br>선택된 판단 기준 ${marks.size}/4. ${edition==='modern'?'단순화·해석·손실 공개가 필수입니다.':'원문의 구조·이미지·모호성을 기본값으로 유지합니다.'}`});finish.onclick=()=>edition?editionStatus.textContent='검토용 판본 선택을 기록했습니다. 출판·모델 호출·저장·배포는 없습니다.':editionStatus.textContent='판본을 선택하세요.';window.onpopstate=e=>open(e.state?.id||location.hash.slice(1)||'library',false)})();</script></body></html>
