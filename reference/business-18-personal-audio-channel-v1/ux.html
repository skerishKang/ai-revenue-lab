<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 오디오 채널 · UX Demo</title><style>:root{--d:#18201f;--p:#eee9dd;--c:#d7774a;--g:#6f8d80;--l:#bdb8ad}*{box-sizing:border-box}body{margin:0;background:var(--d);font-family:Arial,"Noto Sans KR",sans-serif;color:var(--d)}.app{width:100%;max-width:1060px;margin:auto;background:var(--p);min-height:100vh}.head{padding:20px 24px;background:#101615;color:white;display:flex;justify-content:space-between;align-items:center;gap:18px}.head>*{min-width:0}.head b{font-size:24px;overflow-wrap:anywhere}.head small{overflow-wrap:anywhere}.nav{display:flex;overflow:auto;border-bottom:1px solid var(--d);max-width:100%}.nav button{border:0;border-right:1px solid var(--l);background:none;padding:12px 16px;cursor:pointer;white-space:nowrap}.nav button[aria-current=page]{background:var(--c);color:white}.view{display:none;padding:28px 24px 55px;min-width:0}.view.active{display:block}.hero{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:24px}.hero>*{min-width:0}.cover{min-height:360px;background:linear-gradient(145deg,#344a45,#d7774a);color:white;padding:24px;display:flex;align-items:end}.cover h1{font-size:clamp(42px,6vw,70px);line-height:.95;margin:0}.hero h1,.view>h1{overflow-wrap:anywhere}.queue{border-top:4px solid var(--d)}.track{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;padding:15px 0;border-bottom:1px solid var(--l);align-items:center;min-width:0}.track>*{min-width:0}.track b{overflow-wrap:anywhere}.play,.track button,.actions button{border:1px solid var(--d);background:none;padding:9px 11px;cursor:pointer;max-width:100%;white-space:normal}.play{width:42px;height:42px;border-radius:50%;padding:0}.track.active{background:#fff7;padding-left:10px;padding-right:10px}.progress{height:5px;background:#d1ccc1;margin-top:10px}.progress i{display:block;height:100%;background:var(--c);width:0}.notes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}.note{border-top:4px solid var(--g);padding:16px;background:white;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;min-width:0}.actions .primary{background:var(--d);color:white}.status{font-size:13px;color:var(--c);min-height:22px;margin-top:10px;overflow-wrap:anywhere}@media(max-width:720px){.head{flex-direction:column;align-items:flex-start;gap:6px;padding:18px 20px}.head b{font-size:21px}.hero,.notes{grid-template-columns:minmax(0,1fr)}.view{padding:24px 20px 48px}.hero h1,.view>h1{font-size:40px!important;line-height:1.04!important}.track{grid-template-columns:48px minmax(0,1fr);gap:9px}.track>button:last-child{grid-column:2;justify-self:start}.cover{min-height:270px}.nav button{padding:11px 13px}}</style></head><body><main class="app"><header class="head"><b>나의 오디오 채널</b><small>합성 오디오 큐</small></header><nav class="nav"><button data-view="listen" aria-current="page">오늘 듣기</button><button data-view="queue">재생 큐</button><button data-view="notes">남긴 장면</button></nav><section class="view active" id="listen"><div class="hero"><div class="cover"><h1>오늘의<br>15분</h1></div><div><small>PERSONAL AUDIO EDITION</small><h1 style="font-size:52px">걷는 동안 듣는 세 가지 이야기</h1><p style="font-size:18px;line-height:1.7">긴 팟캐스트가 아니라, 오늘 관심사에서 고른 짧은 합성 오디오 세그먼트를 한 흐름으로 묶습니다.</p><div class="actions"><button class="primary" data-go="queue">재생 큐 열기</button></div></div></div></section><section class="view" id="queue"><h1 style="font-size:52px">재생 큐</h1><div id="tracks"><article class="track" data-track="산책길의 작은 건축"><button class="play" aria-label="산책길의 작은 건축 합성 재생 상태 전환">▶</button><div><b>산책길의 작은 건축</b><small> · 04:20</small><div class="progress"><i></i></div></div><button data-save>장면 남기기</button></article><article class="track" data-track="이번 주 AI 한 가지"><button class="play" aria-label="이번 주 AI 한 가지 합성 재생 상태 전환">▶</button><div><b>이번 주 AI 한 가지</b><small> · 05:10</small><div class="progress"><i></i></div></div><button data-save>장면 남기기</button></article><article class="track" data-track="오래된 노래를 다시 듣는 이유"><button class="play" aria-label="오래된 노래를 다시 듣는 이유 합성 재생 상태 전환">▶</button><div><b>오래된 노래를 다시 듣는 이유</b><small> · 05:30</small><div class="progress"><i></i></div></div><button data-save>장면 남기기</button></article></div><div class="actions"><button data-go="listen">오늘 듣기로</button><button class="primary" data-go="notes">남긴 장면 보기</button></div><div class="status" id="queueStatus" role="status"></div></section><section class="view" id="notes"><h1 style="font-size:52px">남긴 장면</h1><div class="notes" id="noteList"><p>아직 남긴 장면이 없습니다.</p></div><div class="actions"><button data-go="queue">재생 큐로</button><button id="clear">모두 지우기</button><button class="primary" id="finish">오늘 듣기 완료</button></div><div class="status" id="noteStatus" role="status"></div></section></main><script>(()=>{const saved=new Set(),views=[...document.querySelectorAll('.view')],tabs=[...document.querySelectorAll('.nav button')];let active=null;function open(id){views.forEach(v=>v.classList.toggle('active',v.id===id));tabs.forEach(t=>t.setAttribute('aria-current',t.dataset.view===id?'page':'false'));if(id==='notes')render();history.pushState({id},'',`#${id}`)}function render(){const el=document.querySelector('#noteList');el.innerHTML=saved.size?[...saved].map(x=>`<article class="note"><b>${x}</b><p>다시 듣고 싶은 이유를 다음 큐 편집에 쓰는 브라우저 메모입니다.</p></article>`).join(''):'<p>아직 남긴 장면이 없습니다.</p>'}tabs.forEach(b=>b.onclick=()=>open(b.dataset.view));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>open(b.dataset.go));document.querySelectorAll('.play').forEach(b=>b.onclick=()=>{const row=b.closest('.track');if(active&&active!==row){active.classList.remove('active');active.querySelector('.play').textContent='▶';active.querySelector('i').style.width='0'}const same=active===row&&row.classList.contains('active');row.classList.toggle('active',!same);b.textContent=same?'▶':'Ⅱ';row.querySelector('i').style.width=same?'0':'62%';active=same?null:row;document.querySelector('#queueStatus').textContent=same?'재생을 멈췄습니다.':`${row.dataset.track} 합성 재생 상태입니다.`});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const k=b.closest('.track').dataset.track;saved.has(k)?saved.delete(k):saved.add(k);b.textContent=saved.has(k)?'남김 · 취소':'장면 남기기';document.querySelector('#queueStatus').textContent=`${saved.size}개 장면을 남겼습니다.`});document.querySelector('#clear').onclick=()=>{saved.clear();render();document.querySelectorAll('[data-save]').forEach(b=>b.textContent='장면 남기기');document.querySelector('#noteStatus').textContent='남긴 장면을 모두 지웠습니다.'};document.querySelector('#finish').onclick=()=>document.querySelector('#noteStatus').textContent='오늘 듣기를 완료했습니다. 실제 오디오 파일·계정·재생 기록은 사용하지 않습니다.';window.onpopstate=e=>{const id=e.state?.id||location.hash.slice(1)||'listen';views.forEach(v=>v.classList.toggle('active',v.id===id));tabs.forEach(t=>t.setAttribute('aria-current',t.dataset.view===id?'page':'false'));if(id==='notes')render()}})();</script></body></html>
