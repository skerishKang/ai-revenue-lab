<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>크리에이터 미니미디어 · UX Demo</title><style>
:root{--bg:#171918;--panel:#f4efe4;--ink:#1b211d;--lime:#b8d451;--orange:#e57747;--line:#bdb8aa;--muted:#6d716e}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}button,textarea{font:inherit}.shell{max-width:1180px;margin:22px auto;background:var(--panel);min-height:calc(100vh - 44px);display:grid;grid-template-columns:220px 1fr}.rail{background:#212521;color:#f3efe5;padding:24px}.rail h1{font-size:26px;line-height:1.05;margin:0 0 28px}.rail button{width:100%;text-align:left;border:0;border-bottom:1px solid #ffffff2c;background:none;color:inherit;padding:13px 0;cursor:pointer}.rail button[aria-current=step]{color:var(--lime);font-weight:700}.main{padding:30px}.step{display:none}.step.active{display:block}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--orange)}h2{font-size:clamp(38px,5vw,66px);line-height:1;margin:8px 0 22px;letter-spacing:-.04em}.source{border-top:4px solid var(--ink);padding-top:18px}.source textarea{width:100%;min-height:190px;padding:18px;background:#fffaf0;border:1px solid var(--line);line-height:1.7;resize:vertical}.formats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.format{padding:18px;border:1px solid var(--ink);background:transparent;text-align:left;cursor:pointer;min-height:150px}.format.selected{background:var(--ink);color:white}.format b{font-size:22px}.format small{display:block;margin-top:12px;color:inherit;opacity:.72}.previews{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.preview{background:white;border-top:5px solid var(--lime);padding:18px;min-height:280px}.preview h3{font-size:24px}.preview p{line-height:1.65}.preview[data-kind=short]{border-color:var(--orange)}.preview[data-kind=mail]{border-color:#6b8fa0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.actions button{padding:11px 14px;border:1px solid var(--ink);background:transparent;cursor:pointer}.actions .primary{background:var(--ink);color:white}.intent{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.intent button{border:1px solid var(--line);background:white;padding:8px 11px;cursor:pointer}.intent button.active{background:var(--lime);border-color:var(--ink)}.package{border:2px solid var(--ink);padding:24px;background:#fffaf0}.package li{margin:10px 0}.status{font-size:13px;color:var(--orange);min-height:24px;margin-top:12px}@media(max-width:800px){.shell{margin:0;grid-template-columns:1fr}.rail{padding:14px 18px}.rail h1{font-size:20px;margin-bottom:10px}.rail nav{display:flex;overflow:auto}.rail button{width:auto;white-space:nowrap;border-bottom:0;border-right:1px solid #ffffff2c;padding:10px 14px}.main{padding:26px 20px}.formats,.previews{grid-template-columns:1fr}h2{font-size:44px}}</style></head><body><main class="shell"><aside class="rail"><h1>크리에이터<br>미니미디어</h1><nav><button data-step="source" aria-current="step">1 원본</button><button data-step="formats">2 포맷</button><button data-step="preview">3 미리보기</button><button data-step="package">4 패키지</button></nav></aside><section class="main"><div class="step active" id="source"><div class="eyebrow">SOURCE NOTE · SYNTHETIC</div><h2>하나의 원본을<br>여러 미디어로.</h2><div class="source"><textarea id="sourceText" aria-label="원본 메모">작은 지역 전시를 준비하면서 가장 오래 걸린 일은 작품을 만드는 일이 아니라, 관람객에게 이 전시가 왜 필요한지 한 문장으로 설명하는 일이었다. 그래서 이번에는 제작 과정에서 나온 짧은 메모를 모아 전시의 시작과 사람들의 반응을 함께 기록하려고 한다.</textarea></div><div class="actions"><button class="primary" data-next="formats">이 원본으로 시작</button></div></div><div class="step" id="formats"><div class="eyebrow">OUTPUT MIX</div><h2>어디에 쓸까요?</h2><div class="formats"><button class="format selected" data-format="article"><b>짧은 기사</b><small>맥락과 장면을 읽기 좋은 글로</small></button><button class="format selected" data-format="short"><b>숏폼 대본</b><small>20–30초 장면 중심 스크립트</small></button><button class="format" data-format="mail"><b>뉴스레터</b><small>구독자에게 보내는 편집형 요약</small></button></div><div class="actions"><button data-back="source">원본 수정</button><button class="primary" id="make">선택 포맷 미리보기</button></div><div class="status" id="formatStatus" role="status"></div></div><div class="step" id="preview"><div class="eyebrow">EDITORIAL PREVIEW</div><h2>같은 원본,<br>다른 리듬.</h2><div class="intent"><button data-intent="calm" class="active">차분하게</button><button data-intent="scene">장면 중심</button><button data-intent="direct">더 직접적으로</button></div><div class="previews" id="previews"></div><div class="actions"><button data-back="formats">포맷 다시 고르기</button><button class="primary" data-next="package">이 구성으로 묶기</button></div><div class="status" id="previewStatus" role="status"></div></div><div class="step" id="package"><div class="eyebrow">HUMAN REVIEW PACKAGE</div><h2>발행 전 묶음</h2><div class="package"><b>선택한 미디어 패키지</b><ul id="packageList"></ul><p>모든 결과는 원본의 합성 문장을 바탕으로 만든 브라우저 미리보기입니다. 실제 게시·예약·전송은 하지 않으며, 사람의 수정과 확인 전에는 발행본으로 간주하지 않습니다.</p></div><div class="actions"><button data-back="preview">미리보기로</button><button id="approve" class="primary">검토 완료 표시</button><button id="reset">처음부터</button></div><div class="status" id="packageStatus" role="status"></div></div></section></main><script>
(()=>{const selected=new Set(['article','short']),steps=[...document.querySelectorAll('.step')],nav=[...document.querySelectorAll('[data-step]')];let intent='calm';const labels={article:'짧은 기사',short:'숏폼 대본',mail:'뉴스레터'};function open(id){steps.forEach(s=>s.classList.toggle('active',s.id===id));nav.forEach(n=>n.setAttribute('aria-current',n.dataset.step===id?'step':'false'));history.pushState({id},'',`#${id}`);if(id==='package')renderPackage()}function copy(kind){const src=document.querySelector('#sourceText').value.trim().split(/[.!?]/)[0];const tone=intent==='scene'?'장면에서 시작합니다.':intent==='direct'?'핵심부터 말하면,':'천천히 돌아보면,';if(kind==='article')return `<h3>전시를 설명하는 한 문장을 찾는 일</h3><p>${tone} ${src}. 제작보다 설명이 어려웠던 순간을 중심으로 짧게 정리한 기사형 초안입니다.</p>`;if(kind==='short')return `<h3>20초 숏폼 대본</h3><p>“전시 만들기보다 어려웠던 것? 왜 필요한지 한 문장으로 말하는 일이었습니다.”<br>→ 제작 메모<br>→ 관람객 반응<br>→ 마지막 한 문장</p>`;return `<h3>이번 주 편지</h3><p>${tone} 이번 전시는 작품보다 ‘왜 필요한가’를 설명하는 과정에서 시작됐습니다. 제작 메모와 첫 반응을 짧게 전합니다.</p>`}function renderPreview(){const box=document.querySelector('#previews');box.innerHTML=[...selected].map(k=>`<article class="preview" data-kind="${k}"><span class="eyebrow">${labels[k]}</span>${copy(k)}</article>`).join('');document.querySelector('#previewStatus').textContent=`${selected.size}개 포맷을 ${intent==='calm'?'차분한':intent==='scene'?'장면 중심':'직접적인'} 톤으로 미리봅니다.`}function renderPackage(){document.querySelector('#packageList').innerHTML=[...selected].map(k=>`<li>${labels[k]} — 검토 필요</li>`).join('')||'<li>선택 없음</li>'}document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>open(b.dataset.next));document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>open(b.dataset.back));nav.forEach(b=>b.onclick=()=>open(b.dataset.step));document.querySelectorAll('.format').forEach(b=>b.onclick=()=>{const k=b.dataset.format;selected.has(k)?selected.delete(k):selected.add(k);b.classList.toggle('selected',selected.has(k));document.querySelector('#formatStatus').textContent=`${selected.size}개 포맷을 선택했습니다.`});document.querySelector('#make').onclick=()=>{if(!selected.size){document.querySelector('#formatStatus').textContent='한 개 이상 포맷을 선택하세요.';return}renderPreview();open('preview')};document.querySelectorAll('[data-intent]').forEach(b=>b.onclick=()=>{intent=b.dataset.intent;document.querySelectorAll('[data-intent]').forEach(x=>x.classList.toggle('active',x===b));renderPreview()});document.querySelector('#approve').onclick=()=>document.querySelector('#packageStatus').textContent='이 브라우저 세션에서 검토 완료로 표시했습니다. 게시·저장은 하지 않습니다.';document.querySelector('#reset').onclick=()=>location.href=location.pathname;window.onpopstate=e=>{const id=e.state?.id||location.hash.slice(1)||'source';steps.forEach(s=>s.classList.toggle('active',s.id===id));nav.forEach(n=>n.setAttribute('aria-current',n.dataset.step===id?'step':'false'))}})();
</script></body></html>
