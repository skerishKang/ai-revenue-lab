<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 개발 관제실 · UX Demo</title><style>:root{--p:#eef0ed;--i:#17201c;--b:#395f70;--g:#52705f;--r:#a45148;--l:#bcc2bd}*{box-sizing:border-box}body{margin:0;background:#ccd3cf;color:var(--i);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.app{max-width:1140px;margin:auto;background:var(--p);min-height:100vh}.head{padding:20px 24px;background:#111b18;color:white;display:flex;justify-content:space-between}.head b{font-size:23px}.nav{display:flex;overflow:auto;border-bottom:1px solid var(--i)}.nav button{border:0;border-right:1px solid var(--l);background:none;padding:12px 15px;cursor:pointer;white-space:nowrap}.nav button[aria-current=page]{background:var(--b);color:white}.view{display:none;padding:28px 24px 56px}.view.active{display:block}h1{font-size:clamp(38px,6vw,62px);line-height:1;margin:8px 0 22px}.queue,.evidence,.decision{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{padding:16px;border:1px solid var(--l);background:white}.job{cursor:pointer;text-align:left}.job.active{border-color:var(--b);box-shadow:inset 0 0 0 2px var(--b)}.pill{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--b)}.evidence .card{border-top:5px solid var(--g)}.evidence .bad{border-top-color:var(--r)}.decision button,.actions button{padding:10px 12px;border:1px solid var(--i);background:none;cursor:pointer}.decision button.active{background:var(--g);color:white}.summary{padding:20px;border-left:6px solid var(--b);background:white;line-height:1.7}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.actions .primary{background:var(--i);color:white}.status{min-height:22px;color:var(--r);font-size:13px;margin-top:10px}@media(max-width:760px){.queue,.evidence,.decision{grid-template-columns:1fr}h1{font-size:44px}}</style></head><body><main class="app"><header class="head"><b>AI 개발 관제실</b><small>SYNTHETIC WORKER CONTROL PLANE</small></header><nav class="nav"><button data-view="queue" aria-current="page">작업 큐</button><button data-view="evidence">증거</button><button data-view="decision">판단</button><button data-view="summary">운영 요약</button></nav><section class="view active" id="queue"><h1>모델 이름보다<br>작업 상태와 증거를 봅니다.</h1><div class="queue"><button class="card job" data-job="B17 UX"><span class="pill">REVIEW READY</span><h3>B17 UX</h3><p>1 file · synthetic browser flow · tests pending</p></button><button class="card job" data-job="B42 docs"><span class="pill">IN PROGRESS</span><h3>B42 운영문서</h3><p>2 files · source review incomplete</p></button><button class="card job" data-job="B55 UI"><span class="pill">BLOCKED</span><h3>B55 UI</h3><p>dependency authority unresolved · do not run</p></button></div><div class="actions"><button class="primary" id="inspect">선택 작업 증거 보기</button></div><div class="status" id="queueStatus" role="status"></div></section><section class="view" id="evidence"><h1>작업자가 말한 것과<br>실제 증거를 분리합니다.</h1><div class="evidence"><article class="card"><b>Scope</b><p>허용된 Business 경로 1개만 변경됐다는 합성 기록.</p></article><article class="card"><b>Checks</b><p>정적 문법 검사 4/4 통과라는 합성 기록.</p></article><article class="card bad"><b>Missing</b><p>실제 브라우저 검증은 아직 수행되지 않음.</p></article></div><div class="summary" style="margin-top:16px"><b>관제 원칙</b><br>“테스트 통과”와 “사용자에게 충분한 품질”은 같은 판정이 아닙니다. 누락된 검증을 그대로 남깁니다.</div><div class="actions"><button data-go="queue">큐로</button><button class="primary" data-go="decision">운영자 판단</button></div></section><section class="view" id="decision"><h1>자동 병합이 아니라<br>명시적 운영자 판단.</h1><div class="decision"><button data-decision="추가 검증 요청"><b>추가 검증 요청</b><p>브라우저 증거를 더 요구.</p></button><button data-decision="수정 요청"><b>수정 요청</b><p>현재 산출물의 결함을 돌려보냄.</p></button><button data-decision="검토 통과"><b>검토 통과</b><p>이 데모 내부에서만 통과 표시. 실제 merge 없음.</p></button></div><div class="actions"><button data-go="evidence">증거로</button><button class="primary" id="record">판단 기록</button></div><div class="status" id="decisionStatus" role="status"></div></section><section class="view" id="summary"><h1>운영 요약</h1><div class="summary" id="summaryText"></div><div class="actions"><button data-go="decision">판단 수정</button><button class="primary" id="finish">관제 세션 완료</button></div><div class="status" id="finishStatus" role="status"></div></section></main><script>(()=>{let job='',decision='';const views=[...document.querySelectorAll('.view')],tabs=[...document.querySelectorAll('.nav button')];function open(id){views.forEach(v=>v.classList.toggle('active',v.id===id));tabs.forEach(t=>t.setAttribute('aria-current',t.dataset.view===id?'page':'false'));history.pushState({id},'',`#${id}`)}tabs.forEach(b=>b.onclick=()=>open(b.dataset.view));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>open(b.dataset.go));document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>{job=b.dataset.job;document.querySelectorAll('[data-job]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#queueStatus').textContent=`${job} 선택`});document.querySelector('#inspect').onclick=()=>job?open('evidence'):document.querySelector('#queueStatus').textContent='작업을 하나 선택하세요.';document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>{decision=b.dataset.decision;document.querySelectorAll('[data-decision]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#decisionStatus').textContent=`운영자 판단: ${decision}`});document.querySelector('#record').onclick=()=>{if(!decision){document.querySelector('#decisionStatus').textContent='판단을 하나 선택하세요.';return}document.querySelector('#summaryText').innerHTML=`<b>${job||'선택 작업'} · ${decision}</b><br><br>확인된 증거와 누락된 브라우저 검증을 함께 기록했습니다. 이 데모는 실제 브랜치 변경, merge, 배포, worker 중단을 실행하지 않습니다.`;open('summary')};document.querySelector('#finish').onclick=()=>document.querySelector('#finishStatus').textContent='합성 관제 세션을 완료했습니다. 실제 Git/CI/배포 상태는 변경되지 않습니다.';window.onpopstate=e=>{const id=e.state?.id||location.hash.slice(1)||'queue';views.forEach(v=>v.classList.toggle('active',v.id===id));tabs.forEach(t=>t.setAttribute('aria-current',t.dataset.view===id?'page':'false'))}})();</script></body></html>
