<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t"><title id="t">권한 요청과 사람 확인을 분리한 합성 gate</title><rect width="780" height="540" fill="#e6e1d3"/><rect x="60" y="55" width="660" height="430" fill="#fffaf0" stroke="#172126" stroke-width="5"/><rect x="60" y="55" width="660" height="65" fill="#172126"/><text x="95" y="96" fill="#fff" font-family="Arial" font-size="20" font-weight="700">HOST ACTION GATE</text><circle cx="190" cy="260" r="76" fill="#f7ddd4" stroke="#b74830" stroke-width="6"/><text x="190" y="245" text-anchor="middle" fill="#b74830" font-family="Arial" font-size="13" font-weight="700">PERMISSION</text><text x="190" y="270" text-anchor="middle" fill="#b74830" font-family="Arial" font-size="13" font-weight="700">NOT GRANTED</text><path d="M285 260H430" stroke="#8a9693" stroke-width="7" stroke-dasharray="10 8"/><path d="m415 240 28 20-28 20" fill="none" stroke="#8a9693" stroke-width="7"/><rect x="455" y="175" width="205" height="170" fill="#fff2c2" stroke="#d7b84f" stroke-width="5"/><text x="558" y="225" text-anchor="middle" fill="#172126" font-family="Arial" font-size="14" font-weight="700">HUMAN CONFIRMATION</text><text x="558" y="258" text-anchor="middle" fill="#172126" font-family="Arial" font-size="13">required before save</text><text x="558" y="305" text-anchor="middle" fill="#b74830" font-family="Arial" font-size="12" font-weight="700">NOT EXECUTED</text><text x="390" y="425" text-anchor="middle" fill="#172126" font-family="Arial" font-size="13" letter-spacing="1">ACTION ELIGIBLE ≠ ACTION EXECUTED</text></svg>
