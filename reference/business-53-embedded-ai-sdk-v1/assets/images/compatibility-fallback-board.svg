<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t"><title id="t">호환성 검토와 fail-closed fallback 보드</title><rect width="1000" height="620" fill="#1d2d32"/><rect x="55" y="50" width="890" height="520" fill="#f5eedc" stroke="#6fc4c8" stroke-width="5"/><text x="90" y="105" fill="#172126" font-family="Arial" font-size="23" font-weight="700">COMPATIBILITY + FALLBACK BOARD</text><rect x="90" y="150" width="380" height="330" fill="#e0ece6" stroke="#34775f" stroke-width="4"/><text x="125" y="200" fill="#34775f" font-family="Arial" font-size="15" font-weight="700">REVIEW REQUIRED</text><g fill="#172126" font-family="Arial" font-size="18"><text x="125" y="252">React 19 target — synthetic</text><text x="125" y="296">theme token bridge</text><text x="125" y="340">focus return</text><text x="125" y="384">screen-reader naming</text></g><text x="125" y="440" fill="#34775f" font-family="Arial" font-size="12">NOT VERIFIED BY THIS REFERENCE</text><rect x="530" y="150" width="380" height="330" fill="#f6ded5" stroke="#b74830" stroke-width="4"/><text x="565" y="200" fill="#b74830" font-family="Arial" font-size="15" font-weight="700">FAIL CLOSED</text><g fill="#172126" font-family="Arial" font-size="18"><text x="565" y="252">no context → no output</text><text x="565" y="296">no permission → no action</text><text x="565" y="340">runtime unavailable → unmount</text><text x="565" y="384">host UI remains usable</text></g><text x="565" y="440" fill="#b74830" font-family="Arial" font-size="12">FALLBACK TO HOST UI</text><text x="500" y="535" text-anchor="middle" fill="#172126" font-family="Arial" font-size="13" letter-spacing="2">VERSION · ACCESSIBILITY · THEME · FAILURE BOUNDARIES</text></svg>
