<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 700" role="img" aria-labelledby="t"><title id="t">Three-part assistance output card</title><rect width="540" height="700" fill="#142b36"/><rect x="42" y="40" width="456" height="620" fill="#fff9ec" stroke="#d0aa55" stroke-width="5"/><text x="72" y="86" fill="#142b36" font-family="Arial" font-size="20" font-weight="700">PLAIN-LANGUAGE ASSISTANCE</text><text x="72" y="115" fill="#315c68" font-family="Arial" font-size="12">OUTPUT CONTRACT · SYNTHETIC</text><g font-family="Arial"><rect x="72" y="155" width="396" height="125" fill="#e4eee8" stroke="#789c8c" stroke-width="3"/><text x="94" y="190" fill="#315c68" font-size="13" font-weight="700">1 · SUMMARY</text><text x="94" y="228" fill="#142b36" font-size="18" font-weight="700">야간 민원실 시간이 바뀝니다.</text><rect x="72" y="305" width="396" height="125" fill="#f5e8c6" stroke="#d0aa55" stroke-width="3"/><text x="94" y="340" fill="#8a6a25" font-size="13" font-weight="700">2 · REQUIRED ACTION</text><text x="94" y="378" fill="#142b36" font-size="18" font-weight="700">8월 12일 전 방문시간 확인</text><rect x="72" y="455" width="396" height="125" fill="#fff0ec" stroke="#a73c37" stroke-width="3"/><text x="94" y="490" fill="#a73c37" font-size="13" font-weight="700">3 · UNRESOLVED LIMITATION</text><text x="94" y="528" fill="#142b36" font-size="17" font-weight="700">공휴일 적용 여부는 원문 확인</text></g><text x="270" y="625" fill="#a73c37" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700">EXECUTION NOT PERFORMED</text></svg>
