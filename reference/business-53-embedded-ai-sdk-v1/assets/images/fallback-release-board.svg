<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="t"><title id="t">Fail-closed fallback and release board</title><rect width="1000" height="720" fill="#ded5c4"/><rect x="60" y="50" width="880" height="620" fill="#fff9ec" stroke="#142b36" stroke-width="5"/><rect x="60" y="50" width="880" height="78" fill="#142b36"/><text x="98" y="99" fill="#fff" font-family="Arial" font-size="22" font-weight="700">FAIL-CLOSED + HUMAN RELEASE INSPECTION</text><g font-family="Arial"><rect x="100" y="170" width="365" height="150" fill="#fff0ec" stroke="#a73c37" stroke-width="4"/><text x="130" y="211" fill="#a73c37" font-size="15" font-weight="700">TIMEOUT</text><text x="130" y="258" fill="#142b36" font-size="25" font-weight="700">NO HOST MUTATION</text><text x="130" y="290" fill="#59635f" font-size="13">original notice remains authoritative</text><rect x="535" y="170" width="365" height="150" fill="#e4eee8" stroke="#789c8c" stroke-width="4"/><text x="565" y="211" fill="#315c68" font-size="15" font-weight="700">FALLBACK</text><text x="565" y="258" fill="#142b36" font-size="25" font-weight="700">ORIGINAL AVAILABLE</text><text x="565" y="290" fill="#59635f" font-size="13">no empty card is persisted</text><rect x="100" y="370" width="800" height="185" fill="#f5e8c6" stroke="#d0aa55" stroke-width="5"/><text x="135" y="416" fill="#8a6a25" font-size="15" font-weight="700">HUMAN RELEASE AUTHORITY</text><text x="135" y="475" fill="#142b36" font-size="34" font-weight="700">RELEASE WITHHELD</text><text x="135" y="520" fill="#59635f" font-size="16">permission absent · installation absent · model absent</text></g><rect x="650" y="410" width="190" height="96" fill="#fff9ec" stroke="#a73c37" stroke-width="5"/><text x="745" y="450" fill="#a73c37" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700">NOT INSTALLED</text><text x="745" y="480" fill="#a73c37" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700">NOT EXECUTED</text><text x="500" y="625" fill="#142b36" text-anchor="middle" font-family="Arial" font-size="12" letter-spacing="3">FAIL CLOSED · PRESERVE HOST · REQUIRE HUMAN DECISION</text></svg>
