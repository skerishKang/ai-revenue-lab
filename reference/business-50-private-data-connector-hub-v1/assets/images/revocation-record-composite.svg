<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1050" viewBox="0 0 900 1050" role="img" aria-labelledby="t d"><title id="t">Revocable access record</title><desc id="d">Access is time-limited, auditable, deletable, and revocable by the data owner.</desc><defs><pattern id="grain" width="26" height="26" patternUnits="userSpaceOnUse"><image href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z4xQAAAAASUVORK5CYII=" width="26" height="26" opacity=".04"/></pattern></defs><rect width="900" height="1050" fill="#eee5d5"/><rect width="900" height="1050" fill="url(#grain)"/><rect x="42" y="38" width="816" height="970" fill="#fffdf7" stroke="#1f3348" stroke-width="5"/><rect x="42" y="38" width="816" height="92" fill="#1f3348"/><text x="78" y="92" fill="#fff" font-family="ui-monospace,monospace" font-size="26" font-weight="900">ACCESS REVOCATION RECORD</text><text x="78" y="170" fill="#65717a" font-family="ui-monospace,monospace" font-size="16">SPEC HW-REN-042 · HANEUL WORKS · FICTIONAL</text><g font-family="ui-monospace,monospace"><g transform="translate(78 210)"><rect width="744" height="112" fill="#edf6f0" stroke="#506f60" stroke-width="4"/><text x="26" y="38" fill="#506f60" font-size="17" font-weight="900">APPROVED SCOPE</text><text x="26" y="74" fill="#17212b" font-size="16">supplier metadata + selected renewal dates</text><text x="565" y="72" fill="#506f60" font-size="15" font-weight="900">OWNER-LIMITED</text></g><g transform="translate(78 342)"><rect width="744" height="112" fill="#fff8e8" stroke="#a97533" stroke-width="4"/><text x="26" y="38" fill="#a97533" font-size="17" font-weight="900">RETENTION LIMIT</text><text x="26" y="74" fill="#17212b" font-size="16">30 days after evidence-packet approval</text><text x="586" y="72" fill="#a97533" font-size="15" font-weight="900">TIME-BOUND</text></g><g transform="translate(78 474)"><rect width="744" height="112" fill="#fff0ed" stroke="#a13b32" stroke-width="4"/><text x="26" y="38" fill="#a13b32" font-size="17" font-weight="900">DELETION REQUIREMENT</text><text x="26" y="74" fill="#17212b" font-size="16">delete packet copy and invalidate access reference</text><text x="581" y="72" fill="#a13b32" font-size="15" font-weight="900">MANDATORY</text></g><g transform="translate(78 606)"><rect width="744" height="112" fill="#eef2f5" stroke="#1f3348" stroke-width="4"/><text x="26" y="38" fill="#1f3348" font-size="17" font-weight="900">AUDIT EVIDENCE — NOT EMPLOYEE MONITORING</text><text x="26" y="74" fill="#17212b" font-size="16">owner decision · scope change · revocation event</text><text x="575" y="72" fill="#1f3348" font-size="15" font-weight="900">NO SCORING</text></g></g><path d="M78 770h744" stroke="#a13b32" stroke-width="7"/><rect x="78" y="798" width="744" height="140" fill="#a13b32"/><text x="106" y="848" fill="#fff" font-family="ui-monospace,monospace" font-size="23" font-weight="900">ACCESS REVOCABLE</text><text x="106" y="888" fill="#fff" font-family="Georgia,serif" font-size="29" font-weight="800">Owner may suspend at any time.</text><text x="106" y="920" fill="#f5d3ce" font-family="ui-monospace,monospace" font-size="14">INCIDENT HANDOFF → PAUSE → OWNER REVIEW → DELETE / RESUME</text><rect x="594" y="174" width="220" height="74" fill="none" stroke="#a13b32" stroke-width="5" transform="rotate(-4 704 211)"/><text x="625" y="218" fill="#a13b32" font-family="ui-monospace,monospace" font-size="19" font-weight="900" transform="rotate(-4 704 211)">NOT PERMANENT</text><text x="78" y="976" fill="#a13b32" font-family="ui-monospace,monospace" font-size="15" font-weight="900">CONNECTOR READINESS — NOT CONNECTED</text></svg>