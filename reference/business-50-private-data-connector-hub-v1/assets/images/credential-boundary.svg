<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" role="img" aria-labelledby="t d"><title id="t">Credential boundary</title><desc id="d">Credential reference is retained without storing or displaying the secret value.</desc><rect width="420" height="420" fill="#f4efe4"/><rect x="30" y="30" width="360" height="360" fill="#fffdf7" stroke="#a13b32" stroke-width="4"/><text x="58" y="78" fill="#a13b32" font-family="ui-monospace,monospace" font-size="18" font-weight="900">CREDENTIAL BOUNDARY</text><rect x="60" y="120" width="130" height="155" fill="#eef2f5" stroke="#1f3348" stroke-width="3"/><text x="78" y="154" fill="#1f3348" font-family="ui-monospace,monospace" font-size="14" font-weight="800">REFERENCE</text><text x="78" y="188" fill="#17212b" font-family="ui-monospace,monospace" font-size="12">secret://</text><text x="78" y="210" fill="#17212b" font-family="ui-monospace,monospace" font-size="12">haneul/</text><text x="78" y="232" fill="#17212b" font-family="ui-monospace,monospace" font-size="12">connector</text><path d="M205 198h65" stroke="#a13b32" stroke-width="6"/><path d="M238 170v56" stroke="#a13b32" stroke-width="6"/><rect x="270" y="120" width="90" height="155" fill="#fff0ed" stroke="#a13b32" stroke-width="3"/><text x="291" y="154" fill="#a13b32" font-family="ui-monospace,monospace" font-size="14" font-weight="900">VALUE</text><text x="288" y="208" fill="#a13b32" font-family="ui-monospace,monospace" font-size="35" font-weight="900">••••</text><text x="74" y="325" fill="#a13b32" font-family="ui-monospace,monospace" font-size="17" font-weight="900">VALUE NOT STORED</text><text x="93" y="354" fill="#a13b32" font-family="ui-monospace,monospace" font-size="17" font-weight="900">NO SECRET DISPLAY</text></svg>