<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Owner authority dossier</title><desc id="d">Requester, data owner, and connector operator authority are separated.</desc><defs><pattern id="grain" width="26" height="26" patternUnits="userSpaceOnUse"><image href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z4xQAAAAASUVORK5CYII=" width="26" height="26" opacity=".04"/></pattern></defs><rect width="1400" height="760" fill="#eee5d5"/><rect width="1400" height="760" fill="url(#grain)"/><rect x="42" y="38" width="1316" height="684" fill="#fffdf7" stroke="#1f3348" stroke-width="5"/><rect x="42" y="38" width="1316" height="86" fill="#1f3348"/><text x="78" y="91" fill="#fff" font-family="ui-monospace,monospace" font-size="28" font-weight="900">OWNER AUTHORITY DOSSIER · HW-REN-042</text><text x="78" y="157" fill="#65717a" font-family="ui-monospace,monospace" font-size="16">HANEUL WORKS · FICTIONAL · CONNECTOR READINESS ONLY</text><g font-family="ui-monospace,monospace"><g transform="translate(78 202)"><rect width="360" height="390" fill="#fff8e8" stroke="#a97533" stroke-width="5"/><text x="28" y="48" fill="#a97533" font-size="19" font-weight="900">REQUESTER</text><circle cx="78" cy="120" r="45" fill="#1f3348"/><text x="52" y="135" fill="#fff" font-family="Georgia,serif" font-size="39">OA</text><text x="145" y="110" fill="#17212b" font-family="Georgia,serif" font-size="28" font-weight="800">Operations</text><text x="145" y="143" fill="#17212b" font-family="Georgia,serif" font-size="28" font-weight="800">Analyst</text><path d="M28 190h304M28 250h304M28 310h304" stroke="#b8afa0" stroke-width="3"/><text x="28" y="220" fill="#65717a" font-size="15">PROPOSES PURPOSE</text><text x="28" y="280" fill="#65717a" font-size="15">REQUESTS SCOPE</text><text x="28" y="340" fill="#a13b32" font-size="15" font-weight="900">CANNOT SELF-APPROVE</text></g><g transform="translate(520 178)"><rect width="360" height="438" fill="#fff0ed" stroke="#a13b32" stroke-width="8"/><text x="28" y="50" fill="#a13b32" font-size="20" font-weight="900">DATA OWNER</text><circle cx="78" cy="125" r="48" fill="#a13b32"/><text x="51" y="141" fill="#fff" font-family="Georgia,serif" font-size="39">LO</text><text x="145" y="111" fill="#17212b" font-family="Georgia,serif" font-size="27" font-weight="800">Legal Operations</text><text x="145" y="145" fill="#17212b" font-family="Georgia,serif" font-size="27" font-weight="800">Lead</text><path d="M28 202h304M28 266h304M28 330h304" stroke="#c99791" stroke-width="3"/><text x="28" y="236" fill="#17212b" font-size="15">APPROVES / NARROWS</text><text x="28" y="300" fill="#17212b" font-size="15">EXCLUDES / REVOKES</text><text x="28" y="364" fill="#a13b32" font-size="15" font-weight="900">FINAL SCOPE AUTHORITY</text><rect x="204" y="373" width="128" height="42" fill="none" stroke="#a13b32" stroke-width="3" transform="rotate(-4 268 394)"/><text x="219" y="400" fill="#a13b32" font-size="14" font-weight="900" transform="rotate(-4 268 394)">OWNER REVIEW</text></g><g transform="translate(962 202)"><rect width="360" height="390" fill="#edf6f0" stroke="#506f60" stroke-width="5"/><text x="28" y="48" fill="#506f60" font-size="19" font-weight="900">CONNECTOR OPERATOR</text><circle cx="78" cy="120" r="45" fill="#506f60"/><text x="49" y="135" fill="#fff" font-family="Georgia,serif" font-size="39">CO</text><text x="145" y="110" fill="#17212b" font-family="Georgia,serif" font-size="28" font-weight="800">Integration</text><text x="145" y="143" fill="#17212b" font-family="Georgia,serif" font-size="28" font-weight="800">Steward</text><path d="M28 190h304M28 250h304M28 310h304" stroke="#a9bcb2" stroke-width="3"/><text x="28" y="220" fill="#65717a" font-size="15">PREPARES READINESS</text><text x="28" y="280" fill="#65717a" font-size="15">FOLLOWS APPROVED SPEC</text><text x="28" y="340" fill="#a13b32" font-size="15" font-weight="900">NO SECRET / NO EXTRACTION</text></g></g><path d="M438 397h82M880 397h82" stroke="#a13b32" stroke-width="5" stroke-dasharray="10 8"/><text x="78" y="676" fill="#a13b32" font-family="ui-monospace,monospace" font-size="18" font-weight="900">REQUEST AUTHORITY ≠ OWNER AUTHORITY ≠ OPERATOR AUTHORITY</text><text x="923" y="676" fill="#1f3348" font-family="ui-monospace,monospace" font-size="16" font-weight="900">ACCESS APPROVAL ≠ DATA-USE APPROVAL</text></svg>