<svg xmlns="http://www.w3.org/2000/svg" width="620" height="320" viewBox="0 0 620 320" role="img" aria-labelledby="t d"><title id="t">Incident handoff</title><desc id="d">Pause connector readiness, notify the data owner, and preserve decision evidence.</desc><rect width="620" height="320" fill="#f4efe4"/><rect x="28" y="25" width="564" height="270" fill="#fffdf7" stroke="#a13b32" stroke-width="4"/><text x="55" y="67" fill="#a13b32" font-family="ui-monospace,monospace" font-size="19" font-weight="900">INCIDENT HANDOFF</text><g font-family="ui-monospace,monospace" font-size="14" font-weight="800"><rect x="55" y="110" width="135" height="72" fill="#fff0ed" stroke="#a13b32"/><text x="78" y="141" fill="#a13b32">PAUSE</text><text x="70" y="164" fill="#a13b32">READINESS</text><path d="M190 146h45" stroke="#17212b" stroke-width="4"/><path d="M235 146l-14-9v18z" fill="#17212b"/><rect x="235" y="110" width="135" height="72" fill="#fff8e8" stroke="#a97533"/><text x="261" y="141" fill="#a97533">NOTIFY</text><text x="267" y="164" fill="#a97533">OWNER</text><path d="M370 146h45" stroke="#17212b" stroke-width="4"/><path d="M415 146l-14-9v18z" fill="#17212b"/><rect x="415" y="110" width="145" height="72" fill="#edf6f0" stroke="#506f60"/><text x="442" y="141" fill="#506f60">PRESERVE</text><text x="438" y="164" fill="#506f60">EVIDENCE</text></g><text x="55" y="236" fill="#65717a" font-family="ui-monospace,monospace" font-size="13">No autonomous scope expansion. No live extraction.</text><text x="55" y="264" fill="#a13b32" font-family="ui-monospace,monospace" font-size="13" font-weight="900">OWNER DECISION REQUIRED BEFORE RESUME</text></svg>