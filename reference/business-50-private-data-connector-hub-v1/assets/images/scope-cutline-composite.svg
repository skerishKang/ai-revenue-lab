<svg xmlns="http://www.w3.org/2000/svg" width="980" height="760" viewBox="0 0 980 760" role="img" aria-labelledby="t d"><title id="t">Approved versus prohibited scope</title><desc id="d">Requested scope contains a smaller approved scope while prohibited paths remain outside the permission cut-line.</desc><defs><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><image href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z4xQAAAAASUVORK5CYII=" width="24" height="24" opacity=".04"/></pattern></defs><rect width="980" height="760" fill="#eee5d5"/><rect width="980" height="760" fill="url(#grain)"/><rect x="38" y="36" width="904" height="688" fill="#fffdf7" stroke="#1f3348" stroke-width="5"/><text x="74" y="84" fill="#1f3348" font-family="ui-monospace,monospace" font-size="25" font-weight="900">PERMISSION CUT-LINE · HW-REN-042</text><rect x="74" y="126" width="830" height="522" fill="#fff8e8" stroke="#a97533" stroke-width="5" stroke-dasharray="15 9"/><text x="96" y="160" fill="#a97533" font-family="ui-monospace,monospace" font-size="18" font-weight="900">REQUESTED SCOPE — NOT APPROVED</text><rect x="106" y="198" width="500" height="396" fill="#edf6f0" stroke="#506f60" stroke-width="7"/><text x="132" y="238" fill="#506f60" font-family="ui-monospace,monospace" font-size="19" font-weight="900">LEAST-PRIVILEGE APPROVED SCOPE</text><g fill="#17212b" font-family="ui-monospace,monospace" font-size="15"><text x="132" y="290">✓ Contract Ledger metadata</text><text x="158" y="322">supplier_id</text><text x="158" y="350">contract_status</text><text x="158" y="378">renewal_date</text><text x="132" y="430">✓ Team Drive selected content</text><text x="158" y="462">/Legal/Supplier-Renewals/Approved</text><text x="132" y="520">METADATA PERMISSION ≠ CONTENT PERMISSION</text><text x="132" y="555">PERMITTED PATH ONLY</text></g><path d="M632 182v430" stroke="#a13b32" stroke-width="9"/><text x="646" y="204" fill="#a13b32" font-family="ui-monospace,monospace" font-size="15" font-weight="900">PERMISSION CUT-LINE</text><rect x="662" y="236" width="210" height="325" fill="#fff0ed" stroke="#a13b32" stroke-width="5"/><text x="685" y="276" fill="#a13b32" font-family="ui-monospace,monospace" font-size="18" font-weight="900">PROHIBITED PATH</text><g fill="#a13b32" font-family="ui-monospace,monospace" font-size="15"><text x="685" y="326">× personal mail</text><text x="685" y="366">× HR folders</text><text x="685" y="406">× payment credential</text><text x="685" y="446">× privileged notes</text><text x="685" y="500" font-weight="900">SENSITIVE FIELD</text><text x="685" y="526" font-weight="900">— EXCLUDED</text></g><text x="75" y="688" fill="#a13b32" font-family="ui-monospace,monospace" font-size="17" font-weight="900">REQUESTED ≠ APPROVED · EXCLUDED DATA CANNOT BE ACCESSED OR MAPPED</text></svg>