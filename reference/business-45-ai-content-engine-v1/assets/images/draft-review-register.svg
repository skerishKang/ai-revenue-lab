<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d"><title id="t">초안과 사람 검토 변형 비교 등록지</title><desc id="d">합성 초안의 문제와 사람이 검토한 수정 사항을 나란히 표시</desc><rect width="900" height="560" fill="#f0eadf"/><rect x="32" y="32" width="392" height="496" fill="#fbf6ec" stroke="#48463f" stroke-width="2"/><rect x="476" y="32" width="392" height="496" fill="#fbf6ec" stroke="#48463f" stroke-width="2"/><text x="62" y="78" font-family="monospace" font-size="20" fill="#a14e39">DRAFT VARIANT</text><text x="506" y="78" font-family="monospace" font-size="20" fill="#476b5a">HUMAN-REVIEWED VARIANT</text><text x="62" y="132" font-family="serif" font-size="28" font-weight="700">모두가 기다린 축제의 밤</text><text x="506" y="132" font-family="serif" font-size="28" font-weight="700">함께 만드는 등불 워크숍</text><g font-family="sans-serif" font-size="20" fill="#504c45"><text x="62" y="184">“모두가 기다린”은 근거 없음</text><text x="62" y="224">“축제”는 source terminology 아님</text><text x="62" y="264">참여 규모를 암시함</text><text x="506" y="184">source terminology 유지</text><text x="506" y="224">참여 규모 미표현</text><text x="506" y="264">가족·자원봉사자 독자 명시</text></g><path d="M92 340L360 340" stroke="#a14e39" stroke-width="5" stroke-dasharray="12 10"/><path d="M536 340L804 340" stroke="#476b5a" stroke-width="5"/><text x="62" y="398" font-family="monospace" font-size="17" fill="#a14e39">GENERATED DRAFT — SYNTHETIC</text><text x="506" y="398" font-family="monospace" font-size="17" fill="#476b5a">REVIEW NOTE RETAINED</text><text x="62" y="458" font-family="monospace" font-size="16" fill="#6f685f">NOT PUBLISHED</text><text x="506" y="458" font-family="monospace" font-size="16" fill="#6f685f">NOT PUBLISHED</text></svg>