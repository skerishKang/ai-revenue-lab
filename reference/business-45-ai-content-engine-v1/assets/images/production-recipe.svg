<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="t d"><title id="t">재사용 콘텐츠 제작 레시피</title><desc id="d">입력, 구조, 포맷, 검토, 품질 제한을 고정한 사람 승인 레시피</desc><rect width="900" height="650" fill="#f0eadc"/><rect x="35" y="35" width="830" height="580" fill="#fffaf0" stroke="#363a36" stroke-width="3"/><text x="72" y="90" font-family="serif" font-size="38" font-weight="700" fill="#282d29">NCL / LANTERN CONTENT RECIPE</text><text x="72" y="127" font-family="monospace" font-size="18" fill="#8d553b">HUMAN APPROVED · REUSABLE · NOT AUTONOMOUS</text><g font-family="monospace" font-size="18" fill="#3f403b"><text x="72" y="190">01  INPUT</text><text x="280" y="190">authorized synthetic source brief</text><text x="72" y="242">02  SPINE</text><text x="280" y="242">opening → context → action → detail → close</text><text x="72" y="294">03  FORMATS</text><text x="280" y="294">article / letter / learning / magazine</text><text x="72" y="346">04  TONE</text><text x="280" y="346">warm, concrete, non-promotional</text><text x="72" y="398">05  HOLDS</text><text x="280" y="398">unsupported facts / living-person style</text><text x="72" y="450">06  REVIEW</text><text x="280" y="450">human editor retains comments</text><text x="72" y="502">07  OUTPUT</text><text x="280" y="502">production kit, publication withheld</text></g><rect x="72" y="548" width="756" height="38" fill="#af543c"/><text x="450" y="574" text-anchor="middle" font-family="monospace" font-size="19" fill="#fffaf0">PUBLICATION AUTHORITY WITHHELD · NOT PUBLISHED</text></svg>