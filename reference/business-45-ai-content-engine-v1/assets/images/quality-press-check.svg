<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" role="img" aria-labelledby="t d"><title id="t">품질 press check</title><desc id="d">구조 일관성, source rights, fact check, unsupported claim, style imitation, publication authority를 분리한 대형 검수표</desc><rect width="1400" height="980" fill="#f2ecde"/><rect x="50" y="50" width="1300" height="880" fill="none" stroke="#3d3e39" stroke-width="3"/><text x="85" y="125" font-family="Georgia,serif" font-size="56" font-weight="700">QUALITY PRESS CHECK</text><text x="88" y="174" font-family="sans-serif" font-size="30" fill="#87523b">구조 변환의 품질과 사실 검증 권한을 분리한다</text><g font-family="monospace"><g transform="translate(85 225)"><rect width="1230" height="102" fill="#fffaf0" stroke="#6b665d"/><text x="25" y="36" font-size="18" fill="#8e533a">01</text><text x="90" y="36" font-size="21">STRUCTURE CONSISTENCY</text><rect x="685" y="15" width="230" height="36" fill="#507763"/><text x="700" y="40" font-size="16" fill="#fffaf0">PASS</text><text x="90" y="78" font-family="sans-serif" font-size="19">4 formats retain 5-part content spine</text></g><g transform="translate(85 338)"><rect width="1230" height="102" fill="#fffaf0" stroke="#6b665d"/><text x="25" y="36" font-size="18" fill="#8e533a">02</text><text x="90" y="36" font-size="21">SOURCE RIGHTS</text><rect x="685" y="15" width="230" height="36" fill="#507763"/><text x="700" y="40" font-size="16" fill="#fffaf0">PASS</text><text x="90" y="78" font-family="sans-serif" font-size="19">repository-created synthetic brief</text></g><g transform="translate(85 451)"><rect width="1230" height="102" fill="#fffaf0" stroke="#6b665d"/><text x="25" y="36" font-size="18" fill="#8e533a">03</text><text x="90" y="36" font-size="21">FACTUAL VERIFICATION</text><rect x="685" y="15" width="230" height="36" fill="#a44b36"/><text x="700" y="40" font-size="16" fill="#fffaf0">NOT PERFORMED</text><text x="90" y="78" font-family="sans-serif" font-size="19">no external facts authorized</text></g><g transform="translate(85 564)"><rect width="1230" height="102" fill="#fffaf0" stroke="#6b665d"/><text x="25" y="36" font-size="18" fill="#8e533a">04</text><text x="90" y="36" font-size="21">UNSUPPORTED CLAIM</text><rect x="685" y="15" width="230" height="36" fill="#a44b36"/><text x="700" y="40" font-size="16" fill="#fffaf0">HOLD</text><text x="90" y="78" font-family="sans-serif" font-size="19">attendance estimate removed</text></g><g transform="translate(85 677)"><rect width="1230" height="102" fill="#fffaf0" stroke="#6b665d"/><text x="25" y="36" font-size="18" fill="#8e533a">05</text><text x="90" y="36" font-size="21">STYLE IMITATION</text><rect x="685" y="15" width="230" height="36" fill="#a44b36"/><text x="700" y="40" font-size="16" fill="#fffaf0">PROHIBITED</text><text x="90" y="78" font-family="sans-serif" font-size="19">no living-person voice target</text></g><g transform="translate(85 790)"><rect width="1230" height="102" fill="#fffaf0" stroke="#6b665d"/><text x="25" y="36" font-size="18" fill="#8e533a">06</text><text x="90" y="36" font-size="21">PUBLICATION</text><rect x="685" y="15" width="230" height="36" fill="#a44b36"/><text x="700" y="40" font-size="16" fill="#fffaf0">WITHHELD</text><text x="90" y="78" font-family="sans-serif" font-size="19">human approval is not publishing authority</text></g></g><text x="85" y="920" font-family="monospace" font-size="24" fill="#a44b36">NOT PUBLISHED</text></svg>