<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">포맷 변형 proof sheet</title><desc id="d">기사 서문, 행사 편지, 학습 카드와 잡지 모듈을 한 판에 비교하는 대형 편집 proof sheet</desc><rect width="1600" height="1000" fill="#e8e4d8"/><rect x="42" y="42" width="1516" height="916" fill="none" stroke="#3c3d39" stroke-width="3"/><text x="78" y="88" font-family="monospace" font-size="22" fill="#8f543b">FORMAT PROOF SHEET / NCL-LANTERN-01</text><g font-family="sans-serif"><g transform="translate(75 130)"><rect width="690" height="380" fill="#f8f3e5" stroke="#44443f" stroke-width="2"/><rect width="18" height="380" fill="#b65336"/><text x="42" y="55" font-family="monospace" font-size="20">ARTICLE OPENING</text><text x="42" y="110" font-family="Georgia,serif" font-size="34" font-weight="700">등불이 켜지는 순간,</text><text x="42" y="164" font-size="23">합성 문화 워크숍의 장면을</text><text x="42" y="198" font-size="23">짧은 현장 서문으로 구조화합니다.</text><path d="M42 285h610" stroke="#81796f" stroke-width="2"/><text x="42" y="326" font-family="monospace" font-size="15" fill="#984b38">DRAFT → REVIEW NOTES → HUMAN-REVIEWED</text></g><g transform="translate(835 130)"><rect width="690" height="380" fill="#faf6eb" stroke="#44443f" stroke-width="2"/><rect width="18" height="380" fill="#587d6f"/><text x="42" y="55" font-family="monospace" font-size="20">EVENT LETTER</text><text x="42" y="110" font-family="Georgia,serif" font-size="34" font-weight="700">가족과 자원봉사자 여러분,</text><text x="42" y="164" font-size="23">일시·장소를 단정하지 않고</text><text x="42" y="198" font-size="23">참여 준비 항목만 안내합니다.</text><path d="M42 285h610" stroke="#81796f" stroke-width="2"/><text x="42" y="326" font-family="monospace" font-size="15" fill="#984b38">DRAFT → REVIEW NOTES → HUMAN-REVIEWED</text></g><g transform="translate(75 550)"><rect width="690" height="375" fill="#f1f0e4" stroke="#44443f" stroke-width="2"/><rect width="18" height="375" fill="#a77b39"/><text x="42" y="55" font-family="monospace" font-size="20">LEARNING CARD</text><text x="42" y="110" font-size="34" font-weight="700">오늘의 질문</text><text x="42" y="164" font-size="23">종이와 빛은 어떻게</text><text x="42" y="198" font-size="23">하나의 공동 작업이 될까요?</text><path d="M42 280h610" stroke="#81796f" stroke-width="2"/><text x="42" y="321" font-family="monospace" font-size="15" fill="#984b38">DRAFT → REVIEW NOTES → HUMAN-REVIEWED</text></g><g transform="translate(835 550)"><rect width="690" height="375" fill="#f7eedf" stroke="#44443f" stroke-width="2"/><rect width="18" height="375" fill="#756184"/><text x="42" y="55" font-family="monospace" font-size="20">MAGAZINE MODULE</text><text x="42" y="110" font-family="Georgia,serif" font-size="34" font-weight="700">빛을 만드는 손</text><text x="42" y="164" font-size="23">재료, 손의 움직임,</text><text x="42" y="198" font-size="23">함께 만드는 리듬을 보여줍니다.</text><path d="M42 280h610" stroke="#81796f" stroke-width="2"/><text x="42" y="321" font-family="monospace" font-size="15" fill="#984b38">DRAFT → REVIEW NOTES → HUMAN-REVIEWED</text></g></g></svg>
