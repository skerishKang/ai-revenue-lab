<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 콘텐츠 엔진 · UX Demo</title><style>:root{--p:#f1eee5;--i:#18201c;--b:#466779;--o:#c87345;--g:#56715e;--l:#bfc0b8}*{box-sizing:border-box}body{margin:0;background:#d0d2cc;color:var(--i);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.app{max-width:1100px;margin:auto;background:var(--p);min-height:100vh}.head{padding:20px 24px;background:#131c18;color:#fff;display:flex;justify-content:space-between}.head b{font-size:23px}.nav{display:flex;overflow:auto;border-bottom:1px solid var(--i)}.nav button{border:0;border-right:1px solid var(--l);background:none;padding:12px 15px;cursor:pointer;white-space:nowrap}.nav button[aria-current=page]{background:var(--b);color:white}.view{display:none;padding:30px 26px 58px}.view.active{display:block}h1{font-size:clamp(40px,6vw,64px);line-height:1;margin:8px 0 22px}.source textarea{width:100%;min-height:170px;padding:16px;border:1px solid var(--l);background:white;font:16px/1.65 inherit}.formats,.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.format,.check{padding:17px;border:1px solid var(--l);background:white}.format{cursor:pointer;text-align:left}.format.active{border-color:var(--b);box-shadow:inset 0 0 0 2px var(--b)}.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:18px;background:white;border-top:5px solid var(--b);line-height:1.65}.card:nth-child(2){border-color:var(--o)}.card:nth-child(3){border-color:var(--g)}.check.ok{border-color:var(--g);box-shadow:inset 0 0 0 2px var(--g)}.check button,.actions button{padding:10px 12px;border:1px solid var(--i);background:none;cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.actions .primary{background:var(--i);color:white}.status{min-height:22px;color:var(--o);font-size:13px;margin-top:10px}@media(max-width:740px){.formats,.checks,.preview{grid-template-columns:1fr}h1{font-size:45px}}</style></head><body><main class="app"><header class="head"><b>AI 콘텐츠 엔진</b><small>SYNTHETIC · HUMAN REVIEW FIRST</small></header><nav class="nav"><button data-view="source" aria-current="page">원본</button><button data-view="format">포맷</button><button data-view="preview">초안</button><button data-view="review">검토</button></nav><section class="view active" id="source"><h1>한 원본에서 시작하되<br>원본을 잃지 않습니다.</h1><div class="source"><textarea id="sourceText">지역 창작자 12명이 참여한 작은 전시가 열렸다. 기획자는 작품 수보다 관람객이 제작 과정을 이해하도록 설명하는 데 더 많은 시간을 썼다고 말했다.</textarea></div><p>실제 기사·고객 문서가 아닌 합성 원본입니다.</p><div class="actions"><button class="primary" data-go="format">출력 포맷 고르기</button></div></section><section class="view" id="format"><h1>같은 원본을<br>목적별로 다르게 편집합니다.</h1><div class="formats"><button class="format active" data-format="article"><b>기사</b><p>맥락과 인용을 보존한 500자 요약</p></button><button class="format active" data-format="social"><b>소셜 카드</b><p>핵심 장면 2개와 짧은 카피</p></button><button class="format" data-format="mail"><b>뉴스레터</b><p>독자에게 설명하는 편지형 요약</p></button></div><div class="actions"><button data-go="source">원본으로</button><button class="primary" id="make">선택 포맷 초안</button></div><div class="status" id="formatStatus" role="status"></div></section><section class="view" id="preview"><h1>초안은 결과가 아니라<br>검토 대상입니다.</h1><div class="preview" id="previewGrid"></div><div class="actions"><button data-go="format">포맷 수정</button><button class="primary" data-go="review">사람 검토</button></div></section><section class="view" id="review"><h1>발행 전 세 가지를<br>반드시 확인합니다.</h1><div class="checks"><article class="check"><b>원본 사실</b><p>새로운 숫자·인물·성과를 만들지 않았는가.</p><button data-check="fact">확인</button></article><article class="check"><b>인용 경계</b><p>합성 기획자 발언을 실제 인터뷰처럼 확대하지 않았는가.</p><button data-check="quote">확인</button></article><article class="check"><b>포맷 차이</b><p>각 채널에 맞게 편집했지만 의미를 왜곡하지 않았는가.</p><button data-check="format">확인</button></article></div><div class="actions"><button data-go="preview">초안으로</button><button id="finish" class="primary">검토 완료 표시</button></div><div class="status" id="reviewStatus" role="status"></div></section></main><script>(()=>{const formats=new Set(['article','social']),checks=new Set(),views=[...document.querySelectorAll('.view')],tabs=[...document.querySelectorAll('.nav button')];const names={article:'기사',social:'소셜 카드',mail:'뉴스레터'};function open(id){views.forEach(v=>v.classList.toggle('active',v.id===id));tabs.forEach(t=>t.setAttribute('aria-current',t.dataset.view===id?'page':'false'));history.pushState({id},'',`#${id}`)}function render(){const s=document.querySelector('#sourceText').value.trim();document.querySelector('#previewGrid').innerHTML=[...formats].map((k,i)=>`<article class="card"><b>${names[k]}</b><p>${k==='article'?`작은 전시는 작품 수보다 제작 과정을 설명하는 경험에 초점을 맞췄다. ${s.slice(0,70)}…`:k==='social'?'작품을 보여주는 것에서 끝나지 않고, 만드는 과정을 이해하게 하는 전시. · 합성 카피':'이번 전시는 무엇을 만들었는가보다 어떻게 설명했는가를 다시 보게 합니다. · 합성 뉴스레터'}</p></article>`).join('')}tabs.forEach(b=>b.onclick=()=>open(b.dataset.view));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>open(b.dataset.go));document.querySelectorAll('[data-format]').forEach(b=>b.onclick=()=>{const k=b.dataset.format;formats.has(k)?formats.delete(k):formats.add(k);b.classList.toggle('active',formats.has(k));document.querySelector('#formatStatus').textContent=`${formats.size}개 포맷 선택`});document.querySelector('#make').onclick=()=>{if(!formats.size){document.querySelector('#formatStatus').textContent='포맷을 하나 이상 선택하세요.';return}render();open('preview')};document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{checks.add(b.dataset.check);b.closest('.check').classList.add('ok');b.textContent='확인됨';b.disabled=true;document.querySelector('#reviewStatus').textContent=`${checks.size}/3 검토`});document.querySelector('#finish').onclick=()=>document.querySelector('#reviewStatus').textContent=checks.size===3?'합성 콘텐츠 패키지를 검토 완료로 표시했습니다. 실제 게시·저장·모델 호출은 없습니다.':'세 검토 항목을 모두 확인하세요.';window.onpopstate=e=>{const id=e.state?.id||location.hash.slice(1)||'source';views.forEach(v=>v.classList.toggle('active',v.id===id));tabs.forEach(t=>t.setAttribute('aria-current',t.dataset.view===id?'page':'false'))}})();</script></body></html>
