<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000"><rect width="800" height="1000" fill="#eee8db"/><text x="60" y="75" font-family="monospace" font-size="25">MSG-12 · SYNTHETIC EXCERPT</text><path d="M60 110h680" stroke="#2b302b" stroke-width="4"/><g font-family="sans-serif" font-size="30" fill="#20241f"><text x="80" y="190">[17:42] 제작·배송 담당자</text><text x="120" y="240">“현관 앞 인계 완료했습니다.”</text><text x="80" y="340">[18:26] 주문자</text><text x="120" y="390">“포장 풀고 보니 모서리가 갈라졌어요.”</text><text x="80" y="510">[18:31] 제작·배송 담당자</text><text x="120" y="560">“인계 때는 외관 손상이 보이지 않았습니다.”</text></g><rect x="70" y="690" width="660" height="130" fill="#252a26"/><rect x="110" y="720" width="390" height="24" fill="#eee8db"/><rect x="110" y="765" width="530" height="24" fill="#eee8db"/><text x="70" y="905" font-family="monospace" font-size="22">REDACTED CONTACT DATA · DISPLAY ONLY</text></svg>