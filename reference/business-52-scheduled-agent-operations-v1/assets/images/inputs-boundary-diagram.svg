-ui">Digest composition · text classification · risk scoring</text><text x="46" y="287" fill="#9ea8a2" font-size="10" font-family="system-ui">PERMISSION NOT GRANTED: live reading, writing, executing or accessing</text><line x1="30" y1="320" x2="570" y2="320" stroke="#63736c" stroke-width=".5" opacity=".3"/><text x="30" y="350" fill="#e7b75c" font-size="10" font-weight="800" font-family="system-ui">CONDITION WATCH</text><rect x="30" y="362" width="540" height="28" fill="#121917" rx="3" stroke="#d86b55" stroke-width=".5"/><text x="46" y="380" fill="#d86b55" font-size="10" font-family="system-ui">Notify only when a material unresolved risk appears · no email or message sent</text></svg>