<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none"><rect width="600" height="400" fill="#1c2926" rx="4"/><text x="30" y="40" fill="#e7b75c" font-size="10" font-weight="800" font-family="system-ui">EXCEPTION LEDGER</text><rect x="30" y="62" width="255" height="75" fill="#121917" rx="3" stroke="#e7b75c" stroke-width="1"/><text x="157" y="85" text-anchor="middle" fill="#e7b75c" font-size="10" font-weight="800" font-family="system-ui">BOUNDED RETRY</text><text x="46" y="105" fill="#ede7d7" font-size="11" font-family="system-ui">Retry allowance: 1 / 1</text><text x="46" y="123" fill="#9ea8a2" font-size="10" font-family="system-ui">Same idempotency key only</text><rect x="315" y="62" width="255" height="75" fill="#121917" rx="3" stroke="#d86b55" stroke-width="1"/><text x="442" y="85" text-anchor="middle" fill="#d86b55" font-size="10" font-weight="800" font-family="system-ui">DUPLICATE PROHIBITED</text><text x="330" y="105" fill="#ede7d7" font-size="11" font-family="system-ui">Same key cannot execute twice</text><text x="330" y="123" fill="#9ea8a2" font-size="10" font-family="system-ui">Retry preserves identity</text><line x1="30" y1="156" x2="570" y2="156" stroke="#63736c" stroke-width=".5" opacity=".3"/><rect x="30" y="175" width="255" height="75" fill="#121917" rx="3" stroke="#63736c" stroke-width="1"/><text x="157" y="198" text-anchor="middle" fill="#63736c" font-size="10" font-weight="800" font-family="system-ui">STALE EVIDENCE</text><text x="46" y="218" fill="#9ea8a2" font-size="10" font-family="system-ui">Run #2 evidence marked stale</text><text x="46" y="236" fill="#9ea8a2" font-size="10" font-family="system-ui">DO NOT USE for retry</text><rect x="315" y="175" width="255" height="75" fill="#121917" rx="3" stroke="#63736c" stroke-width="1"/><text x="442" y="198" text-anchor="middle" fill="#63736c" font-size="10" font-weight="800" font-family="system-ui">CONDITION NOT MET</text><text x="330" y="218" fill="#ede7d7" font-size="11" font-family="system-ui">No material unresolved risk</text><text x="330" y="236" fill="#9ea8a2" font-size="10" font-family="system-ui">Not a failure · Skip, not pass</text><line x1="30" y1="270" x2="570" y2="270" stroke="#63736c" stroke-width=".5" opacity=".3"/><rect x="30" y="290" width="255" height="75" fill="#121917" rx="3" stroke="#e7b75c" stroke-width="1"/><text x="157" y="313" text-anchor="middle" fill="#e7b75c" font-size="10" font-weight="800" font-family="system-ui">PAUSE RECOMMENDED</text><text x="46" y="333" fill="#9ea8a2" font-size="10" font-family="system-ui">Recommended after 2nd failure</text><text x="46" y="351" fill="#d86b55" font-size="10" font-family="system-ui">AUTHORITY: HUMAN ONLY</text><rect x="315" y="290" width="255" height="75" fill="#121917" rx="3" stroke="#e7b75c" stroke-width="1"/><text x="442" y="313" text-anchor="middle" fill="#e7b75c" font-size="10" font-weight="800" font-family="system-ui">MANUAL OVERRIDE</text><text x="330" y="333" fill="#ede7d7" font-size="11" font-family="system-ui">Override requires human authority</text><text x="330" y="351" fill="#9ea8a2" font-size="10" font-family="system-ui">No autonomous continuation</text></svg>