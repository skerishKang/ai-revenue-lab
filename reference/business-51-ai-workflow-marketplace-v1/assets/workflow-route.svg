<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="t d"><title id="t">Ordered workflow route poster</title><desc id="d">Five ordered steps from authorized quotation files to a reviewed recommendation memo with a human checkpoint.</desc><rect width="1400" height="720" fill="#efe6d2"/><text x="64" y="82" font-family="Georgia,serif" font-size="52" font-weight="700" fill="#162522">TASK ROUTE POSTER · ORDERED STEPS</text><path d="M110 360C250 180 420 180 540 360S830 540 950 360s250-180 340 0" fill="none" stroke="#1f4945" stroke-width="18" stroke-linecap="round"/><g font-family="Arial" text-anchor="middle" font-weight="700"><g transform="translate(130 350)"><circle r="72" fill="#f0df70" stroke="#162522" stroke-width="7"/><text y="-8" font-size="32">01</text><text y="28" font-size="18">AUTHORIZE</text></g><g transform="translate(380 228)"><circle r="72" fill="#fffaf0" stroke="#162522" stroke-width="7"/><text y="-8" font-size="32">02</text><text y="28" font-size="18">NORMALIZE</text></g><g transform="translate(660 440)"><circle r="72" fill="#d8e0ce" stroke="#162522" stroke-width="7"/><text y="-8" font-size="32">03</text><text y="28" font-size="18">COMPARE</text></g><g transform="translate(955 318)"><circle r="72" fill="#fffaf0" stroke="#162522" stroke-width="7"/><text y="-8" font-size="32">04</text><text y="28" font-size="18">DRAFT</text></g><g transform="translate(1245 358)"><rect x="-105" y="-72" width="210" height="144" rx="12" fill="#a53227" stroke="#162522" stroke-width="7"/><text y="-10" font-size="30" fill="#fff">05</text><text y="28" font-size="18" fill="#fff">HUMAN CHECK</text></g></g><g font-family="Arial" font-size="20" fill="#162522"><text x="66" y="650">Input: 3 synthetic spreadsheet quotations</text><text x="850" y="650">Output: reviewed recommendation memo · execution not performed</text></g></svg>