<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="t d"><title id="t">Compatibility and permission boundary</title><desc id="d">Limited spreadsheet-to-document compatibility with local file read permission required but not granted.</desc><rect width="1200" height="780" fill="#173e3a"/><text x="60" y="80" font-family="Georgia,serif" font-size="52" fill="#fff7e6" font-weight="700">COMPATIBILITY — LIMITED SCOPE</text><g transform="translate(70 150)"><rect width="360" height="420" rx="16" fill="#eef0df" stroke="#0d211f" stroke-width="7"/><text x="32" y="66" font-family="Arial" font-size="22" font-weight="700">SUPPORTED INPUT</text><rect x="55" y="112" width="250" height="170" fill="#fff" stroke="#173e3a" stroke-width="5"/><path d="M95 160h170M95 205h170M95 250h170M150 130v145M215 130v145" stroke="#78928b" stroke-width="4"/><text x="180" y="350" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">SPREADSHEET</text></g><path d="M455 360h170" stroke="#f0df70" stroke-width="16" stroke-linecap="round"/><path d="M600 330l40 30-40 30" fill="none" stroke="#f0df70" stroke-width="16"/><g transform="translate(665 150)"><rect width="460" height="420" rx="16" fill="#fff7e6" stroke="#0d211f" stroke-width="7"/><text x="32" y="66" font-family="Arial" font-size="22" font-weight="700">EXPECTED OUTPUT</text><rect x="88" y="110" width="284" height="190" fill="#fff" stroke="#173e3a" stroke-width="5"/><path d="M125 155h210M125 195h180M125 235h220" stroke="#78928b" stroke-width="5"/><text x="230" y="360" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">DOCUMENT MEMO</text></g><g transform="translate(120 625)"><rect width="960" height="105" rx="12" fill="#a53227"/><path d="M50 52h90" stroke="#fff" stroke-width="12"/><rect x="72" y="22" width="46" height="55" rx="8" fill="none" stroke="#fff" stroke-width="8"/><text x="175" y="43" font-family="Arial" font-size="24" font-weight="700" fill="#fff">PERMISSION REQUIRED — NOT GRANTED</text><text x="175" y="76" font-family="Arial" font-size="19" fill="#fff">local file read only · no account connection · no installation</text></g></svg>