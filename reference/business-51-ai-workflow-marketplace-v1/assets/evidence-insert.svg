<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Publisher claim and independent evidence insert</title><desc id="d">Split evidence insert separating an unverified publisher claim from independent synthetic validation.</desc><rect width="1200" height="720" fill="#f3ead6"/><rect x="60" y="75" width="500" height="560" fill="#fff8e8" stroke="#162522" stroke-width="7"/><rect x="640" y="75" width="500" height="560" fill="#dbe5d4" stroke="#162522" stroke-width="7"/><text x="105" y="145" font-family="Arial" font-size="26" font-weight="700" fill="#a53227">PUBLISHER CLAIM — UNVERIFIED</text><text x="685" y="145" font-family="Arial" font-size="26" font-weight="700" fill="#173e3a">INDEPENDENT VALIDATION</text><g font-family="Georgia" font-size="31" fill="#162522"><text x="105" y="230">“Cuts review time by 40%”</text><text x="105" y="285">No execution evidence supplied.</text><text x="685" y="230">Structure inspected.</text><text x="685" y="285">Inputs and outputs bounded.</text><text x="685" y="340">Permission remains withheld.</text></g><g transform="translate(105 420)"><rect width="390" height="130" fill="#f0df70" stroke="#162522" stroke-width="5"/><text x="26" y="54" font-family="Arial" font-size="22" font-weight="700">UNRESOLVED CONDITION</text><text x="26" y="92" font-family="Arial" font-size="18">supplier tax-column variance not tested</text></g><g transform="translate(685 430)"><circle cx="180" cy="55" r="50" fill="none" stroke="#173e3a" stroke-width="10"/><path d="M154 56l20 20 38-48" fill="none" stroke="#173e3a" stroke-width="10"/><text x="250" y="65" font-family="Arial" font-size="20" font-weight="700">SYNTHETIC EVIDENCE</text></g></svg>