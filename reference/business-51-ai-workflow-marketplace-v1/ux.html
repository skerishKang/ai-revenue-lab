<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 워크플로우 마켓 · UX Demo</title><style>:root{--p:#f1efe8;--i:#18211d;--b:#45677a;--g:#557260;--o:#c77a47;--l:#bec1ba}*{box-sizing:border-box}body{margin:0;background:#d0d3ce;color:var(--i);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.app{max-width:1080px;margin:auto;background:var(--p);min-height:100vh}.head{padding:20px 24px;background:#131c18;color:white;display:flex;justify-content:space-between}.head b{font-size:23px}.nav{display:flex;overflow:auto;border-bottom:1px solid var(--i)}.nav button{border:0;border-right:1px solid var(--l);background:none;padding:12px 15px;cursor:pointer;white-space:nowrap}.nav button[aria-current=page]{background:var(--b);color:white}.view{display:none;padding:30px 26px 58px}.view.active{display:block}h1{font-size:clamp(40px,6vw,64px);line-height:1;margin:8px 0 22px}.items,.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{padding:17px;border:1px solid var(--l);background:white}.item{cursor:pointer;text-align:left}.item.active{border-color:var(--b);box-shadow:inset 0 0 0 2px var(--b)}.spec{padding:20px;border-left:6px solid var(--b);background:white;line-height:1.7}.check.ok{border-color:var(--g);box-shadow:inset 0 0 0 2px var(--g)}.check button,.actions button{padding:10px 12px;border:1px solid var(--i);background:none;cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.actions .primary{background:var(--i);color:white}.status{min-height:22px;color:var(--o);font-size:13px;margin-top:10px}@media(max-width:720px){.items,.checks{grid-template-columns:1fr}h1{font-size:45px}}</style></head><body><main class="app"><header class="head"><b>AI 워크플로우 마켓</b><small>SYNTHETIC PACKAGES · NO INSTALL</small></header><nav class="nav"><button data-view="browse" aria-current="page">찾기</button><button data-view="detail">상세</button><button data-view="checks">설치 전 확인</button><button data-view="plan">적용 계획</button></nav><section class="view active" id="browse"><h1>워크플로우 이름보다<br>무엇을 읽고 쓰는지 먼저 봅니다.</h1><div class="items"><button class="card item" data-item="회의요약"><b>회의요약 → 결정사항</b><p>입력: 합성 회의록 · 출력: 결정/할일</p></button><button class="card item" data-item="문서검토"><b>문서 검토 보조</b><p>입력: 선택 문서 · 출력: 누락/충돌 후보</p></button><button class="card item" data-item="콘텐츠변환"><b>콘텐츠 변환</b><p>입력: 원본 메모 · 출력: 채널별 초안</p></button></div><div class="actions"><button id="detailBtn" class="primary">선택 워크플로우 보기</button></div><div class="status" id="browseStatus" role="status"></div></section><section class="view" id="detail"><h1>설치하기 전에<br>권한과 실패방식을 읽습니다.</h1><div class="spec" id="spec"></div><div class="actions"><button data-go="browse">목록으로</button><button class="primary" data-go="checks">설치 전 확인</button></div></section><section class="view" id="checks"><h1>세 조건이 맞아야<br>적용 계획으로 넘어갑니다.</h1><div class="checks"><article class="card check"><b>입력 범위</b><p>사용자가 선택한 문서만 읽는지.</p><button data-check="input">확인</button></article><article class="card check"><b>쓰기 권한</b><p>원문을 덮어쓰지 않고 초안만 만드는지.</p><button data-check="write">확인</button></article><article class="card check"><b>외부 연결</b><p>이 합성 데모에서는 네트워크/키가 없는지.</p><button data-check="network">확인</button></article></div><div class="actions"><button data-go="detail">상세로</button><button id="planBtn" class="primary">적용 계획 만들기</button></div><div class="status" id="checkStatus" role="status"></div></section><section class="view" id="plan"><h1>설치가 아니라<br>검토 가능한 적용 계획.</h1><div class="spec" id="planText"></div><div class="actions"><button data-go="checks">확인 수정</button><button id="cancel">계획 취소</button><button class="primary" id="finish">검토 완료 표시</button></div><div class="status" id="planStatus" role="status"></div></section></main><script>(()=>{let item='';const checks=new Set(),views=[...document.querySelectorAll('.view')],tabs=[...document.querySelectorAll('.nav button')];function open(id){views.forEach(v=>v.classList.toggle('active',v.id===id));tabs.forEach(t=>t.setAttribute('aria-current',t.dataset.view===id?'page':'false'));history.pushState({id},'',`#${id}`)}document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{item=b.dataset.item;document.querySelectorAll('[data-item]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#browseStatus').textContent=`${item} 선택`});document.querySelector('#detailBtn').onclick=()=>{if(!item){document.querySelector('#browseStatus').textContent='워크플로우를 하나 선택하세요.';return}document.querySelector('#spec').innerHTML=`<b>${item}</b><br><br>버전 0.9 · 합성 패키지<br>입력은 사용자가 선택한 자료만 · 원문 수정 없음 · 결과는 검토 전 초안 · 외부 실행 없음 · 실패 시 원자료 유지.`;open('detail')};document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>open(b.dataset.go));tabs.forEach(b=>b.onclick=()=>open(b.dataset.view));document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{checks.add(b.dataset.check);b.closest('.check').classList.add('ok');b.textContent='확인됨';b.disabled=true;document.querySelector('#checkStatus').textContent=`${checks.size}/3 확인`});document.querySelector('#planBtn').onclick=()=>{if(checks.size<3){document.querySelector('#checkStatus').textContent='세 조건을 모두 확인하세요.';return}document.querySelector('#planText').innerHTML=`<b>${item} 적용 계획</b><br><br>합성 샘플 1건으로 미리보기 → 사람 검토 → 결과 폐기 또는 별도 승인. 이 단계에서는 실제 설치·패키지 다운로드·권한 부여가 없습니다.`;open('plan')};document.querySelector('#cancel').onclick=()=>{document.querySelector('#planText').innerHTML='<b>적용 계획 취소됨</b><br>아무 설치도 수행되지 않았습니다.';document.querySelector('#planStatus').textContent='계획을 취소했습니다.'};document.querySelector('#finish').onclick=()=>document.querySelector('#planStatus').textContent='워크플로우 검토를 완료했습니다. 실제 설치·실행·결제는 없습니다.';window.onpopstate=e=>{const id=e.state?.id||location.hash.slice(1)||'browse';views.forEach(v=>v.classList.toggle('active',v.id===id));tabs.forEach(t=>t.setAttribute('aria-current',t.dataset.view===id?'page':'false'))}})();</script></body></html>
