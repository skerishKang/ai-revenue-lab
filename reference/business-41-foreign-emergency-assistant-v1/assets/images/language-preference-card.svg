<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="t d"><title id="t">Language preference card</title><desc id="d">Synthetic Spanish preference with Korean and English support labels.</desc><rect width="720" height="500" fill="#f8f4ea"/><rect x="35" y="35" width="650" height="430" rx="16" fill="#ebe4d6" stroke="#17343c" stroke-width="3"/><rect x="35" y="35" width="650" height="70" rx="16" fill="#17343c"/><text x="65" y="78" fill="#fff" font-family="Arial" font-size="16" font-weight="700">PREFERRED LANGUAGE — SYNTHETIC</text><text x="66" y="185" fill="#17343c" font-family="Georgia" font-size="78" font-weight="700">Español</text><text x="68" y="230" fill="#557d8b" font-family="Arial" font-size="18" font-weight="700">spoken preference / 말하기 선호</text><line x1="65" y1="266" x2="655" y2="266" stroke="#17343c"/><text x="68" y="309" fill="#17343c" font-family="Arial" font-size="16" font-weight="700">KOREAN INTERFACE</text><text x="68" y="342" fill="#17343c" font-family="Arial" font-size="16">English support labels</text><rect x="68" y="372" width="300" height="52" rx="26" fill="#bdd4c7"/><text x="91" y="404" fill="#17343c" font-family="Arial" font-size="14" font-weight="700">SHORT SENTENCES · REPEAT BACK</text><circle cx="610" cy="360" r="45" fill="#c45a39"/><text x="610" y="368" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17" font-weight="700">ES</text></svg>