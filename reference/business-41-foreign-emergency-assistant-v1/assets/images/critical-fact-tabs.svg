<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t d"><title id="t">Critical fact tabs</title><desc id="d">Original tabbed folio for critical fact, immediate need, unknown and support.</desc><rect width="720" height="520" fill="#e8e1d3"/><rect x="54" y="55" width="590" height="410" fill="#faf7ef" stroke="#17343c" stroke-width="3"/><g font-family="Arial" font-size="12" font-weight="700"><rect x="80" y="34" width="150" height="45" fill="#2f6f6d"/><text x="155" y="62" text-anchor="middle" fill="#fff">CRITICAL FACT</text><rect x="236" y="34" width="165" height="45" fill="#bf8432"/><text x="318" y="62" text-anchor="middle" fill="#fff">IMMEDIATE NEED</text><rect x="407" y="34" width="120" height="45" fill="#704757"/><text x="467" y="62" text-anchor="middle" fill="#fff">UNKNOWN</text><rect x="533" y="34" width="120" height="45" fill="#557d8b"/><text x="593" y="62" text-anchor="middle" fill="#fff">SUPPORT</text></g><text x="92" y="137" font-family="Georgia" font-size="44" font-weight="700" fill="#17343c">Smoke visible.</text><text x="92" y="181" font-family="Arial" font-size="20" fill="#17343c">Grey smoke above a closed service door.</text><line x1="92" y1="219" x2="605" y2="219" stroke="#17343c"/><text x="92" y="264" font-family="Arial" font-size="13" font-weight="700" fill="#704757">PEOPLE STATUS — UNKNOWN / UNCONFIRMED</text><text x="92" y="310" font-family="Arial" font-size="13" font-weight="700" fill="#557d8b">SPANISH · SHORT SENTENCES · REPEAT BACK</text><rect x="92" y="350" width="470" height="70" fill="#17343c"/><text x="112" y="380" font-family="Arial" font-size="11" font-weight="700" fill="#fff">OFFICIAL EMERGENCY-SERVICE HANDOFF REQUIRED</text><text x="112" y="403" font-family="Arial" font-size="10" fill="#fff">This folio does not call, dispatch, classify or advise.</text></svg>