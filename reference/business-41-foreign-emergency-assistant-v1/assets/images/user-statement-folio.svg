<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="t d"><title id="t">User statement folio</title><desc id="d">Synthetic Spanish statement preserved as unverified user speech.</desc><rect width="760" height="520" fill="#17343c"/><rect x="42" y="38" width="676" height="444" fill="#faf7ef"/><rect x="42" y="38" width="18" height="444" fill="#c45a39"/><text x="88" y="86" font-family="Arial" font-size="14" font-weight="700" fill="#704757">USER STATEMENT — UNVERIFIED</text><text x="88" y="142" font-family="Georgia" font-size="29" font-weight="700" fill="#17343c">“Veo humo cerca de una sala</text><text x="88" y="181" font-family="Georgia" font-size="29" font-weight="700" fill="#17343c">de mantenimiento cerrada.”</text><text x="88" y="244" font-family="Georgia" font-size="25" fill="#17343c">“No sé si hay personas dentro.”</text><line x1="88" y1="285" x2="670" y2="285" stroke="#17343c"/><text x="88" y="326" font-family="Arial" font-size="12" font-weight="700" fill="#2f6f6d">KOREAN SUPPORT TEXT</text><text x="88" y="363" font-family="Arial" font-size="21" fill="#17343c">폐쇄된 maintenance room 근처에서 연기가 보입니다.</text><text x="88" y="397" font-family="Arial" font-size="21" fill="#17343c">안에 사람이 있는지는 모릅니다.</text><rect x="88" y="429" width="330" height="25" fill="#e8d9ca"/></svg>