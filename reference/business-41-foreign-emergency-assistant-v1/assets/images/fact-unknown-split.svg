<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 410" role="img" aria-labelledby="t d"><title id="t">Fact and unknown split</title><desc id="d">Two-column sheet keeping observable synthetic facts separate from unknown information.</desc><rect width="840" height="410" fill="#e8e1d3"/><rect x="32" y="32" width="370" height="346" fill="#faf7ef" stroke="#17343c" stroke-width="2"/><rect x="438" y="32" width="370" height="346" fill="#f2e8e5" stroke="#17343c" stroke-width="2"/><rect x="32" y="32" width="370" height="58" fill="#2f6f6d"/><rect x="438" y="32" width="370" height="58" fill="#704757"/><text x="52" y="68" fill="#fff" font-family="Arial" font-size="13" font-weight="700">OBSERVABLE FACT — SYNTHETIC</text><text x="458" y="68" fill="#fff" font-family="Arial" font-size="13" font-weight="700">UNKNOWN / UNCONFIRMED</text><g fill="none" stroke="#17343c" stroke-width="3"><circle cx="64" cy="133" r="12"/><path d="M58 133l5 5 9-11"/><circle cx="64" cy="200" r="12"/><path d="M58 200l5 5 9-11"/><circle cx="64" cy="267" r="12"/><path d="M58 267l5 5 9-11"/></g><g stroke="#557d8b" stroke-width="9"><path d="M94 133h260M94 200h225M94 267h244"/></g><g fill="none" stroke="#704757" stroke-width="3"><circle cx="470" cy="133" r="12"/><path d="M464 127l12 12M476 127l-12 12"/><circle cx="470" cy="200" r="12"/><path d="M464 194l12 12M476 194l-12 12"/><circle cx="470" cy="267" r="12"/><path d="M464 261l12 12M476 261l-12 12"/></g><g stroke="#704757" stroke-width="9"><path d="M500 133h260M500 200h225M500 267h244"/></g><text x="420" y="355" text-anchor="middle" fill="#17343c" font-family="Arial" font-size="11" font-weight="700">UNKNOWN IS NOT A NEGATIVE FACT</text></svg>