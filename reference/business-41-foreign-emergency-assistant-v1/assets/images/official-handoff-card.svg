<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" role="img" aria-labelledby="t d"><title id="t">Official service handoff card</title><desc id="d">A synthetic card showing the boundary between preparation and official human emergency service handoff.</desc><rect width="700" height="470" fill="#e8e1d3"/><rect x="38" y="38" width="624" height="394" fill="#faf7ef" stroke="#17343c" stroke-width="3"/><rect x="38" y="38" width="624" height="74" fill="#17343c"/><text x="350" y="81" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">OFFICIAL EMERGENCY-SERVICE HANDOFF REQUIRED</text><path d="M120 222h365" stroke="#557d8b" stroke-width="14" stroke-linecap="round"/><path d="M470 185l75 37-75 37" fill="none" stroke="#c45a39" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><rect x="84" y="158" width="164" height="130" rx="12" fill="#bdd4c7"/><text x="166" y="207" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#17343c">PREPARED</text><text x="166" y="234" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#17343c">REPORTING</text><text x="166" y="261" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#17343c">BRIEF</text><rect x="530" y="158" width="88" height="130" rx="12" fill="#c45a39"/><circle cx="574" cy="200" r="20" fill="#fff"/><path d="M544 263q30-45 60 0" fill="#fff"/><text x="350" y="340" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#704757">NO LIVE CONNECTION · NO AUTONOMOUS DISPATCH</text><text x="350" y="376" text-anchor="middle" font-family="Arial" font-size="12" fill="#17343c">Prepared information must be handed to an official human service.</text></svg>