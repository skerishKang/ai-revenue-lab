<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Padiem Quote · 파디엠 견적</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --paper: #ffffff;
      --ink: #17202a;
      --muted: #6b7280;
      --line: #dfe4ea;
      --accent: #111827;
      --soft: #eef2f7;
      --danger: #b42318;
      --radius: 18px;
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .shell { max-width: 1460px; margin: 0 auto; padding: 28px; }
    .topbar { display: flex; justify-content: space-between; gap: 18px; align-items: center; margin-bottom: 22px; }
    .brand h1 { margin: 0; font-size: 27px; letter-spacing: -0.04em; }
    .brand p { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
    .badge { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 8px 12px; font-size: 12px; color: var(--muted); }
    .modebar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .mode { border: 1px solid var(--line); background: var(--paper); padding: 10px 14px; border-radius: 12px; }
    .mode.active { background: var(--accent); color: white; border-color: var(--accent); }
    .mode.future { color: var(--muted); }
    .future-note { display: none; margin: 0 0 16px; padding: 12px 14px; border: 1px dashed #aeb7c4; border-radius: 12px; background: #fbfcfd; color: #475467; font-size: 13px; }
    .future-note.show { display: block; }
    .grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(420px, .95fr); gap: 20px; align-items: start; }
    .panel, .preview-wrap { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(17,24,39,.05); }
    .panel { padding: 22px; }
    .section { padding: 18px 0; border-bottom: 1px solid var(--line); }
    .section:first-child { padding-top: 0; }
    .section:last-child { border-bottom: 0; padding-bottom: 0; }
    .section h2 { margin: 0 0 14px; font-size: 16px; letter-spacing: -.02em; }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .fields.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
    label { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
    input, select, textarea { width: 100%; border: 1px solid var(--line); background: white; border-radius: 10px; padding: 11px 12px; color: var(--ink); outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #98a2b3; box-shadow: 0 0 0 3px rgba(152,162,179,.12); }
    textarea { min-height: 82px; resize: vertical; }
    .row-head, .item-row { display: grid; grid-template-columns: minmax(170px, 1.8fr) 90px 130px 120px 42px; gap: 8px; align-items: center; }
    .row-head { color: var(--muted); font-size: 11px; padding: 0 0 7px; }
    .item-row { margin-bottom: 8px; }
    .item-row .amount { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
    .icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: white; color: var(--danger); }
    .button-row { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 10px; }
    .btn { border: 1px solid var(--line); background: white; color: var(--ink); border-radius: 11px; padding: 11px 15px; font-weight: 650; }
    .btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
    .btn.soft { background: var(--soft); }
    .summary { margin-left: auto; width: min(100%, 360px); display: grid; gap: 7px; padding-top: 12px; }
    .summary-line { display: flex; justify-content: space-between; font-size: 13px; }
    .summary-line.total { margin-top: 4px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 18px; font-weight: 800; }
    .vat-toggle { display: flex; gap: 8px; align-items: center; margin-top: 10px; color: var(--muted); font-size: 13px; }
    .vat-toggle input { width: auto; }
    .preview-wrap { position: sticky; top: 18px; overflow: hidden; }
    .preview-toolbar { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .preview-toolbar strong { font-size: 13px; }
    .quote-paper { background: white; padding: 40px 42px 44px; min-height: 820px; }
    .quote-title { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; padding-bottom: 22px; border-bottom: 2px solid #111827; }
    .quote-title h2 { font-size: 31px; margin: 0; letter-spacing: .12em; }
    .quote-title .meta { text-align: right; color: #475467; font-size: 12px; line-height: 1.8; }
    .parties { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 26px 0; }
    .party { border-top: 1px solid #cfd5dd; padding-top: 10px; }
    .party .eyebrow { font-size: 11px; color: #667085; margin-bottom: 8px; }
    .party strong { display: block; font-size: 16px; margin-bottom: 5px; }
    .party p { margin: 2px 0; font-size: 12px; color: #475467; line-height: 1.55; }
    .quote-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .quote-table th { border-bottom: 1px solid #111827; padding: 10px 7px; font-size: 11px; text-align: left; color: #475467; }
    .quote-table td { border-bottom: 1px solid #e4e7ec; padding: 12px 7px; font-size: 12px; vertical-align: top; }
    .quote-table th:nth-child(n+2), .quote-table td:nth-child(n+2) { text-align: right; }
    .quote-totals { margin: 18px 0 0 auto; width: 310px; }
    .quote-totals div { display: flex; justify-content: space-between; padding: 5px 0; font-size: 12px; }
    .quote-totals .grand { border-top: 2px solid #111827; margin-top: 6px; padding-top: 10px; font-size: 18px; font-weight: 800; }
    .memo { margin-top: 28px; padding-top: 14px; border-top: 1px solid #d0d5dd; color: #475467; font-size: 11px; line-height: 1.7; white-space: pre-wrap; }
    .demo-mark { margin-top: 28px; text-align: right; color: #98a2b3; font-size: 10px; }
    .empty { color: #98a2b3; }
    .toast { position: fixed; right: 24px; bottom: 24px; background: #111827; color: white; padding: 12px 15px; border-radius: 11px; font-size: 13px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: .18s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 1040px) {
      .grid { grid-template-columns: 1fr; }
      .preview-wrap { position: static; }
    }
    @media (max-width: 680px) {
      .shell { padding: 16px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .fields, .fields.three { grid-template-columns: 1fr; }
      .row-head { display: none; }
      .item-row { grid-template-columns: 1fr 72px 1fr 1fr 40px; }
      .quote-paper { padding: 28px 22px; }
      .parties { grid-template-columns: 1fr; }
      .quote-title h2 { font-size: 25px; }
    }
    @media print {
      @page { size: A4; margin: 10mm; }
      body { background: white; }
      body * { visibility: hidden !important; }
      #quotePaper, #quotePaper * { visibility: visible !important; }
      #quotePaper { position: absolute; inset: 0; width: 100%; min-height: 0; padding: 0; }
      .demo-mark { display: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <h1>Padiem Quote <span style="font-weight:500;color:#667085">· 파디엠 견적</span></h1>
        <p>B66 rapid demo · 입력부터 PDF 저장까지 한 화면에서</p>
      </div>
      <div class="badge">DEMO · 로컬 브라우저에서만 동작</div>
    </header>

    <nav class="modebar" aria-label="견적 생성 방식">
      <button class="mode active" data-mode="manual">직접 입력</button>
      <button class="mode future" data-mode="upload">파일 올리기 · 다음 단계</button>
      <button class="mode future" data-mode="chat">채팅으로 만들기 · 다음 단계</button>
    </nav>
    <div class="future-note" id="futureNote"></div>

    <div class="grid">
      <section class="panel" aria-label="견적 입력">
        <div class="section">
          <h2>1. 보내는 사람</h2>
          <div class="fields">
            <label>저장된 발신자
              <select id="senderPreset">
                <option value="padiem">파디엠 데모</option>
                <option value="custom">직접 입력</option>
              </select>
            </label>
            <label>상호
              <input id="senderCompany" value="주식회사 파디엠">
            </label>
            <label>대표자
              <input id="senderRep" value="대표자명">
            </label>
            <label>사업자등록번호
              <input id="senderBizNo" value="000-00-00000">
            </label>
            <label>연락처
              <input id="senderPhone" value="000-0000-0000">
            </label>
            <label>이메일
              <input id="senderEmail" value="hello@example.com">
            </label>
          </div>
          <div class="button-row">
            <button class="btn soft" id="saveSender">이 발신자 저장</button>
          </div>
        </div>

        <div class="section">
          <h2>2. 받는 사람과 날짜</h2>
          <div class="fields three">
            <label>고객 / 업체명
              <input id="recipientCompany" value="고객사">
            </label>
            <label>담당자
              <input id="recipientPerson" value="담당자님">
            </label>
            <label>이메일
              <input id="recipientEmail" value="">
            </label>
            <label>견적일
              <input id="quoteDate" type="date">
            </label>
            <label>유효기간
              <select id="validity">
                <option value="7">7일</option>
                <option value="14">14일</option>
                <option value="30" selected>30일</option>
              </select>
            </label>
            <label>견적번호
              <input id="quoteNo">
            </label>
          </div>
        </div>

        <div class="section">
          <h2>3. 품목과 가격</h2>
          <div class="row-head" aria-hidden="true">
            <span>품목</span><span>수량</span><span>단가</span><span style="text-align:right">금액</span><span></span>
          </div>
          <div id="items"></div>
          <div class="button-row">
            <button class="btn" id="addItem">+ 품목 추가</button>
          </div>
          <label class="vat-toggle">
            <input type="checkbox" id="vatEnabled" checked>
            부가가치세 10% 적용
          </label>
          <div class="summary">
            <div class="summary-line"><span>공급가액</span><strong id="subtotalText">0원</strong></div>
            <div class="summary-line"><span>부가세</span><strong id="vatText">0원</strong></div>
            <div class="summary-line total"><span>합계</span><span id="grandText">0원</span></div>
          </div>
        </div>

        <div class="section">
          <h2>4. 비고</h2>
          <label>결제 / 납기 / 추가 안내
            <textarea id="memo">견적 유효기간 내 발주 시 상기 금액을 적용합니다.
세부 일정은 협의 후 확정합니다.</textarea>
          </label>
          <div class="button-row">
            <button class="btn primary" id="printPdf">PDF로 저장 / 인쇄</button>
            <button class="btn" id="emailFuture">이메일 보내기 · 다음 단계</button>
          </div>
        </div>
      </section>

      <aside class="preview-wrap" aria-label="견적서 미리보기">
        <div class="preview-toolbar">
          <strong>견적서 미리보기</strong>
          <span style="font-size:11px;color:#667085">A4 PDF 출력용</span>
        </div>
        <article class="quote-paper" id="quotePaper">
          <div class="quote-title">
            <h2>견 적 서</h2>
            <div class="meta">
              <div id="pvQuoteNo"></div>
              <div id="pvDate"></div>
              <div id="pvValidity"></div>
            </div>
          </div>
          <div class="parties">
            <div class="party">
              <div class="eyebrow">공급자</div>
              <strong id="pvSenderCompany"></strong>
              <p id="pvSenderRep"></p>
              <p id="pvSenderBizNo"></p>
              <p id="pvSenderContact"></p>
            </div>
            <div class="party">
              <div class="eyebrow">공급받는 자</div>
              <strong id="pvRecipientCompany"></strong>
              <p id="pvRecipientPerson"></p>
              <p id="pvRecipientEmail"></p>
            </div>
          </div>
          <table class="quote-table">
            <thead><tr><th style="width:42%">품목</th><th>수량</th><th>단가</th><th>금액</th></tr></thead>
            <tbody id="pvItems"></tbody>
          </table>
          <div class="quote-totals">
            <div><span>공급가액</span><strong id="pvSubtotal"></strong></div>
            <div><span>부가세</span><strong id="pvVat"></strong></div>
            <div class="grand"><span>합계</span><span id="pvGrand"></span></div>
          </div>
          <div class="memo" id="pvMemo"></div>
          <div class="demo-mark">Padiem Quote · B66 DEMO</div>
        </article>
      </aside>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const won = new Intl.NumberFormat("ko-KR", { style: "currency", currency: "KRW", maximumFractionDigits: 0 });
  const fields = [
    "senderCompany","senderRep","senderBizNo","senderPhone","senderEmail",
    "recipientCompany","recipientPerson","recipientEmail","quoteDate","validity","quoteNo","memo"
  ];

  const demoSender = {
    company: "주식회사 파디엠",
    rep: "대표자명",
    bizNo: "000-00-00000",
    phone: "000-0000-0000",
    email: "hello@example.com"
  };

  function todayISO() {
    const d = new Date();
    return [d.getFullYear(), String(d.getMonth()+1).padStart(2,"0"), String(d.getDate()).padStart(2,"0")].join("-");
  }

  function defaultQuoteNo() {
    return "PQ-" + todayISO().replaceAll("-","") + "-001";
  }

  function safeNumber(value) {
    const n = Number(String(value ?? "").replaceAll(",", ""));
    return Number.isFinite(n) && n >= 0 ? n : 0;
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }

  function toast(message) {
    $("toast").textContent = message;
    $("toast").classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => $("toast").classList.remove("show"), 1800);
  }

  function createItemRow(name = "", qty = 1, unitPrice = 0) {
    const row = document.createElement("div");
    row.className = "item-row";
    row.innerHTML = `
      <input class="item-name" aria-label="품목명" value="${escapeHtml(name)}" placeholder="품목명">
      <input class="item-qty" aria-label="수량" type="number" min="0" step="1" value="${safeNumber(qty)}">
      <input class="item-price" aria-label="단가" type="number" min="0" step="1000" value="${safeNumber(unitPrice)}">
      <div class="amount">0원</div>
      <button class="icon-btn remove-item" aria-label="품목 삭제" title="품목 삭제">×</button>
    `;
    row.querySelectorAll("input").forEach((el) => el.addEventListener("input", render));
    row.querySelector(".remove-item").addEventListener("click", () => {
      if ($("items").children.length === 1) {
        row.querySelector(".item-name").value = "";
        row.querySelector(".item-qty").value = "1";
        row.querySelector(".item-price").value = "0";
      } else {
        row.remove();
      }
      render();
    });
    $("items").appendChild(row);
    render();
  }

  function readItems() {
    return [...document.querySelectorAll(".item-row")].map((row) => {
      const name = row.querySelector(".item-name").value.trim();
      const qty = safeNumber(row.querySelector(".item-qty").value);
      const price = safeNumber(row.querySelector(".item-price").value);
      const amount = Math.round(qty * price);
      row.querySelector(".amount").textContent = won.format(amount);
      return { name, qty, price, amount };
    });
  }

  function textOrDash(value) {
    const v = String(value ?? "").trim();
    return v || "-";
  }

  function render() {
    const items = readItems();
    const subtotal = items.reduce((sum, item) => sum + item.amount, 0);
    const vat = $("vatEnabled").checked ? Math.round(subtotal * 0.10) : 0;
    const grand = subtotal + vat;

    $("subtotalText").textContent = won.format(subtotal);
    $("vatText").textContent = won.format(vat);
    $("grandText").textContent = won.format(grand);

    $("pvQuoteNo").textContent = "견적번호  " + textOrDash($("quoteNo").value);
    $("pvDate").textContent = "견적일  " + textOrDash($("quoteDate").value);
    $("pvValidity").textContent = "유효기간  " + $("validity").value + "일";

    $("pvSenderCompany").textContent = textOrDash($("senderCompany").value);
    $("pvSenderRep").textContent = "대표자  " + textOrDash($("senderRep").value);
    $("pvSenderBizNo").textContent = "사업자번호  " + textOrDash($("senderBizNo").value);
    $("pvSenderContact").textContent = [ $("senderPhone").value.trim(), $("senderEmail").value.trim() ].filter(Boolean).join(" · ") || "-";

    $("pvRecipientCompany").textContent = textOrDash($("recipientCompany").value);
    $("pvRecipientPerson").textContent = "담당자  " + textOrDash($("recipientPerson").value);
    $("pvRecipientEmail").textContent = $("recipientEmail").value.trim() || "-";

    $("pvItems").innerHTML = items.map((item) => `
      <tr>
        <td class="${item.name ? "" : "empty"}">${escapeHtml(item.name || "품목을 입력하세요")}</td>
        <td>${item.qty}</td>
        <td>${won.format(item.price)}</td>
        <td>${won.format(item.amount)}</td>
      </tr>`
    ).join("");

    $("pvSubtotal").textContent = won.format(subtotal);
    $("pvVat").textContent = won.format(vat);
    $("pvGrand").textContent = won.format(grand);
    $("pvMemo").textContent = $("memo").value.trim() || "비고 없음";
  }

  function applySender(sender) {
    $("senderCompany").value = sender.company || "";
    $("senderRep").value = sender.rep || "";
    $("senderBizNo").value = sender.bizNo || "";
    $("senderPhone").value = sender.phone || "";
    $("senderEmail").value = sender.email || "";
    render();
  }

  function loadCustomSender() {
    try {
      const saved = JSON.parse(localStorage.getItem("padiemQuote.sender") || "null");
      return saved && typeof saved === "object" ? saved : null;
    } catch {
      return null;
    }
  }

  $("senderPreset").addEventListener("change", () => {
    if ($("senderPreset").value === "padiem") {
      applySender(demoSender);
      return;
    }
    applySender(loadCustomSender() || { company:"", rep:"", bizNo:"", phone:"", email:"" });
  });

  $("saveSender").addEventListener("click", () => {
    const sender = {
      company: $("senderCompany").value.trim(),
      rep: $("senderRep").value.trim(),
      bizNo: $("senderBizNo").value.trim(),
      phone: $("senderPhone").value.trim(),
      email: $("senderEmail").value.trim()
    };
    localStorage.setItem("padiemQuote.sender", JSON.stringify(sender));
    $("senderPreset").value = "custom";
    toast("이 브라우저에 발신자를 저장했습니다.");
  });

  $("addItem").addEventListener("click", () => createItemRow("", 1, 0));
  $("vatEnabled").addEventListener("change", render);
  fields.forEach((id) => $(id).addEventListener("input", render));
  $("validity").addEventListener("change", render);

  $("printPdf").addEventListener("click", () => {
    render();
    window.print();
  });

  $("emailFuture").addEventListener("click", () => {
    toast("이메일 전송은 다음 단계에서 Gmail/메일 연동으로 붙입니다.");
  });

  document.querySelectorAll(".mode").forEach((button) => {
    button.addEventListener("click", () => {
      document.querySelectorAll(".mode").forEach((b) => b.classList.remove("active"));
      button.classList.add("active");
      if (button.dataset.mode === "manual") {
        $("futureNote").className = "future-note";
        $("futureNote").textContent = "";
        return;
      }
      $("futureNote").className = "future-note show";
      $("futureNote").textContent = button.dataset.mode === "upload"
        ? "파일 업로드 → 견적서 필드 자동 추출은 다음 단계에서 AI/OCR Skill로 연결합니다. 이 데모에서는 파일을 외부로 전송하지 않습니다."
        : "자연어 채팅 → QuoteDraft 자동 입력은 다음 단계에서 연결합니다. 금액 계산은 AI가 아니라 현재와 같은 결정적 계산 코드가 담당합니다.";
    });
  });

  $("quoteDate").value = todayISO();
  $("quoteNo").value = defaultQuoteNo();
  createItemRow("서비스 구축", 1, 1000000);
  createItemRow("운영 지원", 1, 300000);
  render();
})();
</script>
</body>
</html>
