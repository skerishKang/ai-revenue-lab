<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 스포츠 채널 · UX Demo</title><style>:root{--n:#13211c;--p:#f0ebdd;--g:#8ab86b;--y:#e5c75c;--l:#b8b4a8}*{box-sizing:border-box}body{margin:0;background:var(--n);color:var(--n);font-family:Arial,"Noto Sans KR",sans-serif}.wrap{max-width:1080px;margin:auto;background:var(--p);min-height:100vh}.top{padding:20px 24px;background:var(--n);color:white;display:flex;justify-content:space-between;align-items:center}.top b{font-size:24px}.top small{color:#c9d5cf}.nav{display:flex;overflow:auto;border-bottom:1px solid var(--n)}.nav button{padding:12px 16px;border:0;border-right:1px solid var(--l);background:none;cursor:pointer;white-space:nowrap}.nav button[aria-current=page]{background:var(--g);font-weight:700}main{padding:28px 24px}.view{display:none}.view.active{display:block}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:24px}.score{background:var(--n);color:white;padding:26px;min-height:330px;display:flex;flex-direction:column;justify-content:space-between}.score h1{font-size:clamp(44px,7vw,84px);margin:0}.scoreline{font-size:50px;font-weight:900}.focus{border-top:5px solid var(--g);padding-top:16px}.focus article{padding:12px 0;border-bottom:1px solid var(--l)}.focus button,.actions button,.team{border:1px solid var(--n);background:none;padding:10px 13px;cursor:pointer}.teams{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.team{text-align:left;min-height:130px}.team.active{background:var(--n);color:white}.timeline{border-top:1px solid var(--n)}.event{display:grid;grid-template-columns:80px 1fr auto;gap:16px;padding:15px 0;border-bottom:1px solid var(--l)}.event button{border:1px solid var(--n);background:none;cursor:pointer}.event.saved button{background:var(--y)}.saved{display:grid;gap:12px}.saved article{border-top:4px solid var(--g);padding:14px;background:white}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.actions .primary{background:var(--n);color:white}.status{min-height:22px;margin-top:10px;color:#58661f;font-size:13px}@media(max-width:720px){.hero,.teams{grid-template-columns:1fr}.event{grid-template-columns:60px 1fr}.event button{grid-column:2}.score h1{font-size:48px}}</style></head><body><div class="wrap"><header class="top"><b>나의 스포츠 채널</b><small>합성 경기·팀 데이터</small></header><nav class="nav"><button data-view="today" aria-current="page">오늘</button><button data-view="teams">관심 팀</button><button data-view="match">경기 흐름</button><button data-view="saved">내 장면</button></nav><main><section class="view active" id="today"><div class="hero"><div class="score"><div><small>오늘 내가 보기로 한 경기</small><h1>SEOUL<br>vs BUSAN</h1></div><div class="scoreline">2 — 1</div><small>78' · 합성 스코어</small></div><aside class="focus"><h2>오늘은 이것만</h2><article><b>핵심 장면 3개</b><p>득점보다 경기 흐름을 바꾼 순간을 중심으로 봅니다.</p></article><article><b>내 관심 선수 1명</b><p>합성 선수 '민준 K.'의 움직임만 짧게 모읍니다.</p></article><div class="actions"><button class="primary" data-go="match">경기 흐름 보기</button></div></aside></div></section><section class="view" id="teams"><h1 style="font-size:52px">관심 팀 조정</h1><div class="teams"><button class="team active" data-team="Seoul"><b>SEOUL</b><p>주 경기로 보기</p></button><button class="team" data-team="Busan"><b>BUSAN</b><p>상대 팀 소식 포함</p></button><button class="team" data-team="Gwangju"><b>GWANGJU</b><p>다음 경기 알림 대신 일정만</p></button></div><div class="actions"><button data-go="today">오늘로</button><button class="primary" data-go="match">선택 반영해 경기 보기</button></div><div class="status" id="teamStatus" role="status"></div></section><section class="view" id="match"><h1 style="font-size:52px">경기 흐름</h1><div class="timeline"><article class="event"><b>12'</b><div><strong>첫 압박 전환</strong><br><small>내 관심 포인트: 수비→공격 전환</small></div><button data-save="첫 압박 전환">장면 저장</button></article><article class="event"><b>37'</b><div><strong>동점 전 결정적 패스</strong><br><small>민준 K. · 합성 선수</small></div><button data-save="결정적 패스">장면 저장</button></article><article class="event"><b>71'</b><div><strong>역전 득점</strong><br><small>스코어보다 이전 20초 움직임 함께 보기</small></div><button data-save="역전 득점 전 20초">장면 저장</button></article></div><div class="actions"><button data-go="today">오늘로</button><button class="primary" data-go="saved">내 장면 보기</button></div><div class="status" id="matchStatus" role="status"></div></section><section class="view" id="saved"><h1 style="font-size:52px">내 장면</h1><div class="saved" id="savedList"><p>저장한 장면이 없습니다.</p></div><div class="actions"><button data-go="match">경기로</button><button id="clear">모두 지우기</button><button class="primary" id="finish">오늘 경기 요약 완료</button></div><div class="status" id="savedStatus" role="status"></div></section></main></div><script>(()=>{const saved=new Set(),views=[...document.querySelectorAll('.view')],tabs=[...document.querySelectorAll('.nav button')];function open(id){views.forEach(v=>v.classList.toggle('active',v.id===id));tabs.forEach(t=>t.setAttribute('aria-current',t.dataset.view===id?'page':'false'));if(id==='saved')render();history.pushState({id},'',`#${id}`)}function render(){const e=document.querySelector('#savedList');e.innerHTML=saved.size?[...saved].map(x=>`<article><b>${x}</b><p>오늘 내가 다시 보고 싶은 이유를 남기는 합성 장면입니다.</p></article>`).join(''):'<p>저장한 장면이 없습니다.</p>'}tabs.forEach(b=>b.onclick=()=>open(b.dataset.view));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>open(b.dataset.go));document.querySelectorAll('.team').forEach(b=>b.onclick=()=>{b.classList.toggle('active');document.querySelector('#teamStatus').textContent=`${document.querySelectorAll('.team.active').length}개 팀을 관심 범위에 포함했습니다.`});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const k=b.dataset.save;saved.has(k)?saved.delete(k):saved.add(k);b.closest('.event').classList.toggle('saved',saved.has(k));b.textContent=saved.has(k)?'저장됨 · 취소':'장면 저장';document.querySelector('#matchStatus').textContent=`${saved.size}개 장면을 골랐습니다.`});document.querySelector('#clear').onclick=()=>{saved.clear();render();document.querySelectorAll('.event').forEach(e=>e.classList.remove('saved'));document.querySelector('#savedStatus').textContent='선택한 장면을 모두 지웠습니다.'};document.querySelector('#finish').onclick=()=>document.querySelector('#savedStatus').textContent='오늘 경기 요약을 마쳤습니다. 실제 경기·알림·계정 데이터는 사용하지 않습니다.';window.onpopstate=e=>{const id=e.state?.id||location.hash.slice(1)||'today';views.forEach(v=>v.classList.toggle('active',v.id===id));tabs.forEach(t=>t.setAttribute('aria-current',t.dataset.view===id?'page':'false'));if(id==='saved')render()}})();</script></body></html>
