<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580"><rect width="900" height="580" fill="#ddd5c6"/><rect x="70" y="45" width="760" height="490" fill="#fbf6eb" stroke="#203047" stroke-width="4"/><text x="110" y="105" font-family="serif" font-size="32" fill="#203047">EQUATION CONTEXT · SYNTHETIC</text><text x="160" y="235" font-family="serif" font-size="58" fill="#203047">R = α·S + β·H − γ·D</text><text x="120" y="315" font-family="sans-serif" font-size="20" fill="#4f5659">R: 위험 가시거리 신호 후보 · S: 산란 지표 · H: 습도 · D: 염분 침착 보정</text><rect x="115" y="365" width="620" height="95" fill="#efe4d2" stroke="#a44f3f" stroke-width="3"/><text x="140" y="410" font-family="sans-serif" font-size="19" fill="#a44f3f">UNRESOLVED: γ 보정값이 계절 간 안정적인가?</text></svg>