<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900"><rect width="720" height="900" fill="#efe6d9"/><text x="55" y="70" font-family="monospace" font-size="18" fill="#132734">DECISION-2024-HBR-PAUSE</text><text x="55" y="140" font-family="serif" font-size="38" fill="#132734">Project HARBOR 중단 결정</text><path d="M55 185h610" stroke="#132734" stroke-width="2"/><g font-family="sans-serif" font-size="19" fill="#26353b"><text x="70" y="250">결정: 2024년 3분기 이후 신규 실증 확대를 중단한다.</text><text x="70" y="305">사유: 계약 옵션 철회, 조직 비용 증가, 제품 원칙 재검토.</text><text x="70" y="360">보존: 조향 모듈, 통제권 설계, 현장 운영 기록.</text><text x="70" y="415">폐기: 광역 자율경로, 기존 영업 확대 계획.</text></g><rect x="130" y="520" width="460" height="150" fill="none" stroke="#a33d37" stroke-width="8"/><text x="210" y="610" font-family="monospace" font-size="56" fill="#a33d37">ARCHIVE HOLD</text><text x="55" y="790" font-family="serif" font-size="24" fill="#132734">중단은 기억의 종료가 아니라 계승 범위의 재설정으로 기록한다.</text></svg>