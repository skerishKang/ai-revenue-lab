<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900"><rect width="720" height="900" fill="#f6f0e2"/><rect x="45" y="45" width="630" height="810" fill="none" stroke="#132734" stroke-width="2"/><text x="80" y="110" font-family="serif" font-size="38" fill="#132734">현장 실증 제안 및 계약 부속</text><text x="80" y="150" font-family="monospace" font-size="18" fill="#9a5f3b">PILOT-2021-DSR-04 / SYNTHETIC</text><g font-family="sans-serif" font-size="18" fill="#26353b"><text x="80" y="225">제4조 운행 범위</text><text x="100" y="270">1. HARBOR 시험기 3대를 B동 2구역에서 운행한다.</text><text x="100" y="310">2. 운행 중 작업자 우선 통행을 보장한다.</text><text x="80" y="385">제7조 중단 및 통제</text><text x="100" y="430">1. 중단 요청 절차는 별도 운영 합의서에 따른다.</text><text x="100" y="470">2. 수동 정지 권한의 담당 주체는 추후 확정한다.</text></g><rect x="92" y="486" width="520" height="38" fill="#a33d37" opacity=".17"/><path d="M100 510h500" stroke="#a33d37" stroke-width="3"/><text x="80" y="610" font-family="monospace" font-size="17" fill="#a33d37">ANNOTATION 2022-04-21: 담당 주체 미정의가 사고 검토에서 재확인됨</text><circle cx="560" cy="740" r="68" fill="none" stroke="#9a5f3b" stroke-width="5"/><text x="518" y="735" font-family="monospace" font-size="18" fill="#9a5f3b">ARCHIVE</text><text x="520" y="765" font-family="monospace" font-size="14" fill="#9a5f3b">VERIFIED</text></svg>