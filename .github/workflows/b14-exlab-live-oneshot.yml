name: B14 ExLab Live One-Shot (Qwen3.8 exact ID only)

# ExLab-only bounded acceptance gate for the single exact model (#4516):
#
# * experiential/qwen3.8-flash-next-uncensored
#
# Historical note (dated, not re-measured): #4220 recorded direct same-
# upstream HTTP 200 while B14 attempts returned 429/504; #4252 recorded a
# B14 synthetic 429 (vendor route_unavailable) and a later B14 HTTP 200.
# Intermittent admission/capacity, not proof of health.
#
# This workflow performs NO live provider call unless a human explicitly
# dispatches it with the exact main SHA, the one exact model id, the exact
# B14 Worker version, and the confirmation marker.
#
# It never merges, deploys, mutates Production, assigns member/site routes,
# or changes product tiers. It must NOT be used for any other model:
# those ids are rejected before any provider call.

on:
  pull_request:
    paths:
      - '.github/scripts/b14_exlab_live_oneshot.py'
      - '.github/tests/test_b14_exlab_live_oneshot.py'
      - '.github/workflows/b14-exlab-live-oneshot.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact current main SHA authorized for this one-shot ExLab live run'
        required: true
      model_id:
        description: 'Exact model id (experiential/qwen3.8-flash-next-uncensored only)'
        required: true
      expected_b14_version:
        description: 'Exact B14 Worker version that must still be serving 100%'
        required: true
      confirmation:
        description: 'Type RUN_B14_EXLAB_LIVE_ONESHOT_ONCE'
        required: true

permissions:
  contents: read

concurrency:
  group: b14-exlab-live-oneshot
  cancel-in-progress: false

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source under review
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_sha || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Exact-main dispatch preflight
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.inputs.target_sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.event.inputs.target_sha }}"
          echo 'PREFLIGHT_EXACT_MAIN=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run bounded ExLab one-shot contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest
          python -m pytest -q .github/tests/test_b14_exlab_live_oneshot.py

      - name: Pin the ExLab one-shot source contract
        shell: bash
        run: |
          set -euo pipefail
          script=.github/scripts/b14_exlab_live_oneshot.py
          grep -Fq 'MAX_PROVIDER_CALLS = 1' "${script}"
          grep -Fq 'RETRY = 0' "${script}"
          grep -Fq 'FALLBACK = 0' "${script}"
          grep -Fq 'AUTO_MODEL_ID = "b14/auto"' "${script}"
          grep -Fq 'DEFAULT_LIVE_EXECUTION = "BLOCKED"' "${script}"
          grep -Fq 'PRIVATE_PAYLOAD_OUTPUT = 0' "${script}"
          grep -Fq 'SECRET_VALUE_OUTPUT = 0' "${script}"
          grep -Fq 'PRODUCTION_MUTATION = 0' "${script}"
          grep -Fq 'RAW_RESPONSE_CONTENT_OUTPUT = 0' "${script}"
          grep -Fq 'EXLAB_MODEL_ID = "experiential/qwen3.8-flash-next-uncensored"' "${script}"
          grep -Fq 'EXLAB_EXCLUDED_MODEL_IDS' "${script}"
          grep -Fq 'google/gemini-3.1-flash-lite' "${script}"
          grep -Fq 'PROVIDER_PROTOCOL = "OpenAI-compatible"' "${script}"
          grep -Fq 'SYNTHETIC_MAX_TOKENS = 32' "${script}"
          grep -Fq '"allow_external_fallback": False' "${script}"
          grep -Fq '"max_attempts": 1' "${script}"
          grep -Fq '"max_retries": 0' "${script}"
          grep -Fq 'admission_or_quota_unknown' "${script}"
          grep -Fq 'capacity_or_transport_unknown' "${script}"
          echo 'EXLAB_ONESHOT_SOURCE_CONTRACT=PASS'

      - name: Pin canonical served-version reuse
        shell: bash
        run: |
          set -euo pipefail
          script=.github/scripts/b14_exlab_live_oneshot.py
          wf=.github/workflows/b14-exlab-live-oneshot.yml
          grep -Fq 'from cloudflare_served_version import' "${script}"
          grep -Fq 'resolve_served_version_id' "${script}"
          grep -Fq 'resolve_served_version_id(payload)' "${wf}"
          grep -Fq 'CANONICAL_SERVED_VERSION_REUSED=YES' "${wf}"
          grep -Fq 'HISTORICAL_DEPLOYMENT_ACCEPTED=NO' "${wf}"
          if grep -Fq 'for deployment in deployments' "${script}"; then
            echo 'LOCAL_DEPLOYMENT_SCAN=1'
            exit 1
          fi
          echo 'CANONICAL_SERVED_VERSION_REUSE_CONTRACT=PASS'

      - name: Pin closed safe error-code vocabulary
        shell: bash
        run: |
          set -euo pipefail
          script=.github/scripts/b14_exlab_live_oneshot.py
          grep -Fq 'SAFE_ENGINE_ERROR_CODES' "${script}"
          grep -Fq 'return code if code in SAFE_ENGINE_ERROR_CODES else "unknown"' "${script}"
          echo 'CLOSED_ERROR_CODE_VOCABULARY_CONTRACT=PASS'

      - name: Pin sibling allowlists are not widened
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'qwen3.8-flash-next-uncensored' .github/workflows/b14-gemini-live-oneshot.yml; then
            echo 'GEMINI_ALLOWLIST_WIDENED=1'
            exit 1
          fi
          if grep -Fq 'qwen3.8-flash-next-uncensored' .github/workflows/b14-candidate-live-smoke.yml; then
            echo 'GENERIC_ALLOWLIST_WIDENED=1'
            exit 1
          fi
          if grep -Fq 'qwen3.8-flash-next-uncensored' .github/scripts/b14_candidate_live_smoke.py; then
            echo 'GENERIC_SCRIPT_WIDENED=1'
            exit 1
          fi
          echo 'SIBLING_ALLOWLISTS_UNTOUCHED=PASS'

  live-exlab-oneshot:
    needs: source-contract
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirmation == 'RUN_B14_EXLAB_LIVE_ONESHOT_ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_B14_VERSION: ${{ github.event.inputs.expected_b14_version }}
      MODEL_ID: ${{ github.event.inputs.model_id }}
    steps:
      - name: Checkout exact authorized main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_sha }}
          persist-credentials: false

      - name: Re-check exact current main before live call
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.inputs.target_sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.event.inputs.target_sha }}"
          echo 'LIVE_EXACT_MAIN=PASS'

      - name: Reject any model id outside the one exact ExLab id
        shell: bash
        run: |
          set -euo pipefail
          case "${MODEL_ID}" in
            experiential/qwen3.8-flash-next-uncensored) ;;
            *) echo 'MODEL_NOT_ALLOWLISTED=1'; exit 1 ;;
          esac
          echo "MODEL_ID_ALLOWLISTED=${MODEL_ID}"

      - name: GET-only B14 served-version guard (canonical resolver)
        shell: bash
        run: |
          set -euo pipefail
          echo "${EXPECTED_B14_VERSION}" | grep -Eq '^[A-Za-z0-9._-]{1,64}$'
          deployments="${RUNNER_TEMP}/b14-deployments.json"
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/ai-revenue-korean-ai-platform/deployments" \
            -o "${deployments}"
          # The active-served-version rules are NOT reimplemented here. The whole
          # envelope is handed to the shared canonical resolver, which requires
          # result.deployments[0] to be the active deployment carrying exactly
          # one version at 100 percent with a safe version_id.
          python3 - "${deployments}" "${EXPECTED_B14_VERSION}" <<'PY'
          import json
          import sys
          from pathlib import Path

          scripts_dir = Path(".github/scripts").resolve()
          sys.path.insert(0, str(scripts_dir))

          from cloudflare_served_version import (  # noqa: E402
              ServedVersionReason,
              ServedVersionResolutionError,
              resolve_served_version_id,
          )

          payload_path, expected = sys.argv[1:3]
          print(f"B14_EXPECTED_VERSION={expected}")
          with open(payload_path, encoding="utf-8") as fh:
              payload = json.load(fh)

          try:
              served = resolve_served_version_id(payload)
          except ServedVersionResolutionError as exc:
              print("CANONICAL_SERVED_VERSION_RESOLVED=NO")
              print(f"CANONICAL_SERVED_VERSION_REASON={exc.reason}")
              raise SystemExit(f"served-version guard failed closed: {exc.reason}")

          if served != expected:
              print("CANONICAL_SERVED_VERSION_RESOLVED=NO")
              print(f"CANONICAL_SERVED_VERSION_REASON={ServedVersionReason.VERSION_ID}")
              print("B14_SERVED_VERSION_MISMATCH=YES")
              raise SystemExit("active served version does not match expected version")

          print(f"CANONICAL_SERVED_VERSION_RESOLVED={served}")
          print("CANONICAL_SERVED_VERSION_REUSED=YES")
          print("HISTORICAL_DEPLOYMENT_ACCEPTED=NO")
          print("B14_EXPECTED_VERSION_AT_100=PASS")
          print('PRODUCTION_MUTATION=0')
          PY

      - name: Execute exactly one bounded ExLab live request
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/exlab-live-oneshot.log"
          python .github/scripts/b14_exlab_live_oneshot.py "${MODEL_ID}" --authorized-live-run | tee "${log}"
          grep -qx 'EXLAB_QWEN38_PRODUCTION_SMOKE=PASS' "${log}"
          grep -qx 'EXLAB_QWEN38_SOURCE_ON=YES' "${log}"
          grep -qx 'EXLAB_QWEN38_CREDENTIAL_READY=YES' "${log}"
          grep -qx 'EXLAB_QWEN38_ROUTE_REGISTERED=YES' "${log}"
          grep -qx 'EXLAB_QWEN38_EXACT_MODEL_IDENTITY=PASS' "${log}"
          grep -qx 'EXLAB_QWEN38_ACTUAL_RESPONSE_MODEL_EVIDENCE=PASS' "${log}"
          grep -qx 'EXLAB_QWEN38_MODEL_ID_MATCH=YES' "${log}"
          grep -qx 'EXLAB_QWEN38_PROVIDER_MATCH=YES' "${log}"
          grep -qx 'EXLAB_QWEN38_FALLBACK_USED=NO' "${log}"
          grep -qx 'EXLAB_QWEN38_ATTEMPT_COUNT=1' "${log}"
          grep -qx 'B14_CHAT_POST_COUNT=1' "${log}"
          grep -qx 'NETWORK_RETRY_COUNT=0' "${log}"
          grep -qx 'MAX_PROVIDER_CALLS=1' "${log}"
          grep -qx 'RETRY=0' "${log}"
          grep -qx 'FALLBACK=0' "${log}"
          grep -qx 'FALLBACK_CALL_COUNT=0' "${log}"
          grep -qx 'AUTO_ROUTE_USED=0' "${log}"
          grep -qx 'RAW_RESPONSE_CONTENT_OUTPUT=0' "${log}"
          grep -qx 'PRIVATE_PAYLOAD_OUTPUT=0' "${log}"
          grep -qx 'SECRET_VALUE_OUTPUT=0' "${log}"

      - name: Record immutable execution locks
        if: always()
        shell: bash
        run: |
          echo 'WORKFLOW_INTERNAL_RERUN=0'
          echo 'B14_DEPLOY=0'
          echo 'ENGINE_DEPLOY=0'
          echo 'SECRET_MUTATION=0'
          echo 'SECRET_VALUE_OUTPUT=0'
          echo 'D1_MUTATION=0'
          echo 'GMAIL_MUTATION=0'
          echo 'ROUTING_MUTATION=0'
          echo 'PRODUCT_TIER_MUTATION=0'
          echo 'PRODUCTION_MUTATION=0'
