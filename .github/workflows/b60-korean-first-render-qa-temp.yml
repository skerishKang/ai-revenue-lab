name: B60 Korean First Render QA Temp

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  korean-render:
    if: github.event.pull_request.number == 680
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout carrier
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact product head
        uses: actions/checkout@v4
        with:
          ref: 46e64becd67671e2e5cdd90df39a81c1634e9033
          path: product
          persist-credentials: false

      - name: Static contract checks
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "46e64becd67671e2e5cdd90df39a81c1634e9033"
          node --check apps/portfolio-console/ai-api/korean-v1.js
          cmp apps/portfolio-console/ai-api/index.html reference/business-60-ai-api-v1/index.html
          cmp apps/portfolio-console/ai-api/korean-v1.js reference/business-60-ai-api-v1/korean-v1.js
          cmp apps/portfolio-console/ai-api/korean-v1.css reference/business-60-ai-api-v1/korean-v1.css
          cmp apps/portfolio-console/ai-api/data/deals.js reference/business-60-ai-api-v1/data/deals.js
          cmp apps/portfolio-console/ai-api/data/snapshots.js reference/business-60-ai-api-v1/data/snapshots.js
          grep -F 'korean-v1.css' apps/portfolio-console/ai-api/index.html >/dev/null
          grep -F 'korean-v1.js' apps/portfolio-console/ai-api/index.html >/dev/null
          ! grep -R -F '$1.40/M input · $4.40/M output' apps/portfolio-console/ai-api/data/deals.js apps/portfolio-console/ai-api/data/snapshots.js
          grep -F 'Varies by routed provider' apps/portfolio-console/ai-api/data/deals.js >/dev/null
          grep -F 'VERIFIED_OFFICIAL_WEB' apps/portfolio-console/ai-api/data/access-signals.js >/dev/null
          grep -F 'openrouter:openrouter/free' apps/portfolio-console/ai-api/data/execution-handoff-v10.js >/dev/null
          echo 'STATIC_CONTRACTS=PASS'

      - name: Install Chromium harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b60qa
          cd /tmp/b60qa
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Render Korean desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          python3 -m http.server 4173 --directory "$GITHUB_WORKSPACE/product/apps/portfolio-console/ai-api" >/tmp/b60-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          cd /tmp/b60qa
          GITHUB_WORKSPACE="$GITHUB_WORKSPACE" node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          const evidence = path.join(process.env.GITHUB_WORKSPACE, 'evidence');
          const cases = [
            { name:'desktop', viewport:{width:1440,height:1000} },
            { name:'mobile', viewport:{width:390,height:844} }
          ];
          (async()=>{
            const browser = await chromium.launch({headless:true});
            for (const c of cases) {
              const page = await browser.newPage({ viewport:c.viewport });
              const consoleErrors=[]; const requestFailures=[];
              page.on('console', m => { if (m.type()==='error') consoleErrors.push(m.text()); });
              page.on('requestfailed', r => requestFailures.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
              await page.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle'});
              await page.waitForSelector('#explore');
              await page.evaluate(()=>document.getElementById('signal').scrollIntoView({block:'start'}));
              await page.waitForTimeout(250);

              const signalTitle = (await page.locator('#signal-title').innerText()).replace(/\s+/g,' ').trim();
              assert(signalTitle.includes('확실한 것과') && signalTitle.includes('확인 중인 것을 섞지 않습니다'), `signal title not Korean: ${signalTitle}`);
              const deal = await page.locator('#deal-card').innerText();
              assert(deal.includes('추가 확인 필요'), 'pending label not Korean');
              assert(deal.includes('GLM 5.2 접근 정보'), 'deal headline not Korean');
              assert(deal.includes('라우팅 제공사별 상이') || deal.includes('요금은 제공사별로 다릅니다'), 'provider-dependent price copy missing');
              assert(!deal.includes('$1.40/M input') && !deal.includes('$4.40/M output'), 'stale fixed price is visible');

              const sourceText = await page.locator('#source').innerText();
              assert(sourceText.includes('출처 신뢰도'), 'source confidence not Korean');
              assert(sourceText.includes('공식 확인 완료'), 'verified source state not Korean');
              assert(sourceText.includes('추가 확인 필요'), 'pending source state not Korean');
              assert(!sourceText.includes('VERIFIED_OFFICIAL_WEB') && !sourceText.includes('PENDING_WEB_VERIFICATION'), 'raw source enums visible');

              const ratio = await page.locator('#signal-title').evaluate(el => {
                const s=getComputedStyle(el); return parseFloat(s.lineHeight)/parseFloat(s.fontSize);
              });
              const sourceRatio = await page.locator('#source-title').evaluate(el => {
                const s=getComputedStyle(el); return parseFloat(s.lineHeight)/parseFloat(s.fontSize);
              });
              assert(ratio >= 1.07, `signal Korean line-height too tight: ${ratio}`);
              assert(sourceRatio >= 1.07, `source Korean line-height too tight: ${sourceRatio}`);

              await page.evaluate(()=>document.getElementById('explore').scrollIntoView({block:'start'}));
              await page.waitForTimeout(250);
              const nav = (await page.locator('.ia-primary').innerText()).replace(/\s+/g,' ');
              assert(nav.includes('탐색') && nav.includes('제공사') && nav.includes('모델') && nav.includes('연결') && nav.includes('관심 목록'), `primary nav mixed language: ${nav}`);

              await page.locator('[data-ia-view="providers"]').first().click();
              await page.waitForTimeout(120);
              const providerText = await page.locator('#explore').innerText();
              assert(providerText.includes('제공사') && !providerText.includes('VIEW PROVIDER'), 'provider surface not fully localized');

              await page.locator('[data-ia-view="discover"]').first().click();
              await page.waitForTimeout(120);
              await page.locator('[data-id="vercel-glm52"]').first().click();
              await page.waitForSelector('.ux3-route-detail.is-open');
              await page.waitForTimeout(120);
              const detailText = await page.locator('.ux3-route-detail.is-open').innerText();
              assert(detailText.includes('현재 이용 조건') && detailText.includes('출처 신뢰도'), 'route detail labels not Korean');
              assert(detailText.includes('정보만 제공') || detailText.includes('실행 경로 연결됨'), 'execution state not Korean');
              assert(!detailText.includes('VERIFIED_OFFICIAL_WEB'), 'raw verification enum visible in route detail');
              await page.keyboard.press('Escape');

              const width = await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth}));
              assert(width.scroll <= width.client + 1, `horizontal overflow ${width.scroll}/${width.client}`);
              assert(consoleErrors.length===0, `console errors: ${consoleErrors.join(' | ')}`);
              assert(requestFailures.length===0, `request failures: ${requestFailures.join(' | ')}`);

              await page.evaluate(()=>document.getElementById('signal').scrollIntoView({block:'start'}));
              await page.waitForTimeout(150);
              await page.screenshot({path:path.join(evidence,`${c.name}-signal.png`),fullPage:false});
              await page.evaluate(()=>document.getElementById('source').scrollIntoView({block:'start'}));
              await page.waitForTimeout(150);
              await page.screenshot({path:path.join(evidence,`${c.name}-source.png`),fullPage:false});
              await page.close();
              console.log(`${c.name.toUpperCase()}_KOREAN_RENDER=PASS lineHeight=${ratio.toFixed(3)} sourceLineHeight=${sourceRatio.toFixed(3)} overflow=${width.scroll}/${width.client}`);
            }
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b60-korean-first-render-evidence
          path: evidence/
          if-no-files-found: error
