name: B60 Editorial Radar QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'reference/business-60-ai-api-v1/**'
      - '.github/workflows/b60-editorial-radar-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$expected" = "$actual"

      - name: Prepare Korean fonts and raster candidates
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk webp
          mkdir -p "$GITHUB_WORKSPACE/b60-raster-source"

          curl -fL --retry 3 --retry-delay 1 'https://images.unsplash.com/photo-1778146476147-5f8d4bd03c79?auto=format&fit=crop&fm=jpg&ixlib=rb-4.1.0&q=82&w=2200' -o /tmp/vercel.jpg
          curl -fL --retry 3 --retry-delay 1 'https://images.unsplash.com/photo-1743796055651-41c743ff2465?auto=format&fit=crop&fm=jpg&ixlib=rb-4.1.0&q=82&w=1800' -o /tmp/gemini.jpg
          curl -fL --retry 3 --retry-delay 1 'https://images.unsplash.com/photo-1584169417032-d34e8d805e8b?auto=format&fit=crop&fm=jpg&q=82&w=1800' -o /tmp/cloudflare.jpg
          curl -fL --retry 3 --retry-delay 1 'https://images.unsplash.com/photo-1763568258320-c954a19683e3?auto=format&fit=crop&fm=jpg&ixlib=rb-4.1.0&q=82&w=1800' -o /tmp/groq.jpg
          curl -fL --retry 3 --retry-delay 1 'https://images.unsplash.com/photo-1782012505157-aca188bd6921?auto=format&fit=crop&fm=jpg&ixlib=rb-4.1.0&q=82&w=1800' -o /tmp/openrouter.jpg

          cwebp -quiet -q 80 -resize 1600 0 /tmp/vercel.jpg -o "$GITHUB_WORKSPACE/b60-raster-source/editorial-vercel.webp"
          cwebp -quiet -q 80 -resize 1400 0 /tmp/gemini.jpg -o "$GITHUB_WORKSPACE/b60-raster-source/editorial-gemini.webp"
          cwebp -quiet -q 80 -resize 1400 0 /tmp/cloudflare.jpg -o "$GITHUB_WORKSPACE/b60-raster-source/editorial-cloudflare.webp"
          cwebp -quiet -q 80 -resize 1400 0 /tmp/groq.jpg -o "$GITHUB_WORKSPACE/b60-raster-source/editorial-groq.webp"
          cwebp -quiet -q 80 -resize 1400 0 /tmp/openrouter.jpg -o "$GITHUB_WORKSPACE/b60-raster-source/editorial-openrouter.webp"

          test "$(find "$GITHUB_WORKSPACE/b60-raster-source" -name '*.webp' -type f | wc -l)" -eq 5
          du -h "$GITHUB_WORKSPACE/b60-raster-source"/*.webp

      - name: Vendor raster assets when absent
        shell: bash
        run: |
          set -euo pipefail
          asset_dir='reference/business-60-ai-api-v1/assets'
          mkdir -p "$asset_dir"
          cp "$GITHUB_WORKSPACE"/b60-raster-source/*.webp "$asset_dir"/
          git add "$asset_dir"/editorial-*.webp
          if git diff --cached --quiet; then
            echo 'Raster assets already match the PR branch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets(b60): vendor editorial raster photography'
          head_branch='${{ github.event.pull_request.head.ref }}'
          git push origin HEAD:"$head_branch"

      - name: Run B60 contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test reference/business-60-ai-api-v1/*.test.cjs reference/business-60-ai-api-v1/collector/*.test.cjs

      - name: Render desktop and mobile screenshots
        shell: bash
        run: |
          set -euo pipefail
          cd reference/business-60-ai-api-v1
          python3 -m http.server 4173 >/tmp/b60-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          curl -fsS http://127.0.0.1:4173/ >/tmp/b60-home.html

          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo 'No Chromium-compatible browser found on ubuntu-24.04 runner.' >&2
            exit 1
          fi
          echo "browser=$browser"

          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=6000 --window-size=1440,2200 \
            --screenshot="$GITHUB_WORKSPACE/b60-editorial-desktop.png" \
            http://127.0.0.1:4173/

          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --force-device-scale-factor=1 --virtual-time-budget=6000 --window-size=390,1800 \
            --screenshot="$GITHUB_WORKSPACE/b60-editorial-mobile.png" \
            http://127.0.0.1:4173/

          "$browser" --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=4000 --dump-dom http://127.0.0.1:4173/ \
            > "$GITHUB_WORKSPACE/b60-editorial-dom.html"

          test -s "$GITHUB_WORKSPACE/b60-editorial-desktop.png"
          test -s "$GITHUB_WORKSPACE/b60-editorial-mobile.png"
          test -s "$GITHUB_WORKSPACE/b60-editorial-dom.html"
          grep -q 'id="radar"' "$GITHUB_WORKSPACE/b60-editorial-dom.html"
          grep -q 'id="always-free"' "$GITHUB_WORKSPACE/b60-editorial-dom.html"
          grep -q 'id="just-checked"' "$GITHUB_WORKSPACE/b60-editorial-dom.html"
          grep -q 'data-b60-v13="editorial"' "$GITHUB_WORKSPACE/b60-editorial-dom.html"

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b60-editorial-radar-visual-evidence
          path: |
            b60-editorial-desktop.png
            b60-editorial-mobile.png
            b60-editorial-dom.html
          if-no-files-found: warn
          retention-days: 7

      - name: Upload raster candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b60-editorial-raster-candidates
          path: b60-raster-source/*.webp
          if-no-files-found: error
          retention-days: 7
