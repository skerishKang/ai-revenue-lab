name: B66 CGI Partial Live Canary

on:
  pull_request:
    paths:
      - ".github/scripts/b66_cgi_partial_live_canary.py"
      - ".github/tests/test_b66_cgi_partial_live_canary.py"
      - ".github/workflows/b66-cgi-partial-live-canary.yml"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact current main SHA authorized for this one-shot B66 CGI Production partial canary"
        required: true
        type: string
      selected_tier:
        description: "Operator-selected B66 grade key (free|plus|pro|max); defaults to one paid grade"
        required: false
        default: "plus"
        type: string
      quote_case:
        description: "Explicit one-call quote probe: partial or approximate quantity confirmation"
        required: true
        type: choice
        options:
          - partial
          - approx_qty
      confirmation:
        description: "Type RUN_B66_CGI_PARTIAL_LIVE_CANARY_ONCE"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: b66-cgi-partial-live-canary
  cancel-in-progress: false

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Require exact current main for dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.target_sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ inputs.target_sha }}"
          echo 'PREFLIGHT_EXACT_MAIN=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Network-free canary contract tests
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/b66_cgi_partial_live_canary.py --self-test
          python .github/tests/test_b66_cgi_partial_live_canary.py

      - name: Pin bounded live-call contract
        shell: bash
        run: |
          set -euo pipefail
          script=.github/scripts/b66_cgi_partial_live_canary.py
          grep -Fq 'MAX_INTERPRET_POSTS = 1' "$script"
          grep -Fq 'SELECTED_TIER_ENV = "B66_CGI_CANARY_SELECTED_TIER"' "$script"
          grep -Fq 'DEFAULT_SELECTED_TIER = "plus"' "$script"
          grep -Fq 'CASE_ENV = "B66_CGI_CANARY_CASE"' "$script"
          grep -Fq 'APPROX_QUANTITY_TEXT = ' "$script"
          grep -Fq '"tier": chosen_tier' "$script"
          grep -Fq 'def grade_options_contract' "$script"
          # Evidence must be emitted, not merely computed: every marker the live
          # flow sets has to be listed in the printed summary order, and the
          # retired model-catalog markers must stay gone.
          grep -Fq '"GRADE_OPTIONS_HTTP",' "$script"
          grep -Fq '"SELECTED_TIER",' "$script"
          grep -Fq '"INTERPRET_FAILURE_STAGE",' "$script"
          grep -Fq '"INTERPRET_EXCEPTION_FAMILY",' "$script"
          grep -Fq 'def sanitize_interpret_stage' "$script"
          grep -Fq 'def public_error_code' "$script"
          if grep -Eq 'SELECTED_MODEL_ID|MODEL_OPTIONS_HTTP|MODEL_SELECTION_RESULT' "$script"; then
            echo 'B66_CGI_PARTIAL_SOURCE_CONTRACT=RETIRED_MODEL_MARKER_RETURNED'
            exit 1
          fi
          grep -Fq 'padiem-b66-cgi-partial-canary/1.0 (+github-actions)' "$script"
          grep -Fq 'RETRY = 0' "$script"
          grep -Fq 'FALLBACK = 0' "$script"
          grep -Fq 'DEFAULT_LIVE_EXECUTION=BLOCKED' "$script"
          grep -Fq 'SECRET_VALUE_OUTPUT=0' "$script"
          grep -Fq 'RAW_RESPONSE_OUTPUT=0' "$script"
          grep -Fq 'PRODUCTION_DATA_MUTATION=0' "$script"
          echo 'B66_CGI_PARTIAL_SOURCE_CONTRACT=PASS'
          echo 'PRODUCTION_MUTATION=0'
          echo 'LIVE_PROVIDER_CALLS=0'

  live-partial:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirmation == 'RUN_B66_CGI_PARTIAL_LIVE_CANARY_ONCE'
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      QA_MANUAL_USERNAME: ${{ secrets.QA_MANUAL_USERNAME }}
      B66_CGI_CANARY_SELECTED_TIER: ${{ inputs.selected_tier }}
      B66_CGI_CANARY_CASE: ${{ inputs.quote_case }}
      QA_MANUAL_PASSWORD: ${{ secrets.QA_MANUAL_PASSWORD }}
    steps:
      - name: Checkout exact approved main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Reconfirm exact current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          test -n "${QA_MANUAL_USERNAME}"
          test -n "${B66_CGI_CANARY_SELECTED_TIER}"
          test -n "${QA_MANUAL_PASSWORD}"
          echo 'PRECALL_EXACT_MAIN=PASS'
          echo 'CGI_CREDENTIAL_PRESENT=YES'
          echo 'SECRET_VALUE_OUTPUT=0'

      - name: Run exactly one authenticated B66 partial interpret request
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/b66_cgi_partial_live_canary.py --authorized-live-run
