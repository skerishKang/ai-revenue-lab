name: B14 Deploy Gate Contract Tests

# #1955 — CI for the B14 production deploy gate itself. The gate workflow
# (b14-production-deploy-gate.yml) stays workflow_dispatch-only by contract,
# so its static contract tests run here on pull requests that touch the
# gate, its tests, or the canonical deploy.sh. This workflow never deploys:
# it only parses YAML and runs pytest.

on:
  pull_request:
    paths:
      - ".github/workflows/b14-production-deploy-gate.yml"
      - ".github/workflows/b14-deploy-gate-contract-tests.yml"
      - ".github/tests/test_b14_production_deploy_gate.py"
      - "apps/korean-ai-platform/deploy.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-contract-tests:
    name: Gate contract (parse + bash -n, no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --quiet pyyaml pytest

      - name: Run gate contract tests
        run: python -m pytest -q .github/tests/test_b14_production_deploy_gate.py

      - name: Record no production deployment
        run: |
          echo 'B14_GATE_CONTRACT_TESTS=PASS'
          echo 'PRODUCTION_DEPLOYMENT=0'
