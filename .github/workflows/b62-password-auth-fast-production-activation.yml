name: B62 Password Auth Fast Production Activation

on:
  pull_request:
    paths:
      - ".github/workflows/b62-password-auth-fast-production-activation.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/b62-password-auth-fast-production-activation.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: b62-password-auth-fast-production-activation
  cancel-in-progress: false

env:
  B62_WORKER: padiem-chat
  B62_PUBLIC_BASE_URL: https://chat.padiem.net

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate bounded activation contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          text = Path(".github/workflows/b62-password-auth-fast-production-activation.yml").read_text(encoding="utf-8")
          required = [
              "B62 Auth D1 Migration 012 Gate",
              "b62-auth-d1-migration-012-gate.yml",
              "APPLY_B62_AUTH_D1_MIGRATION_012_FROM_EXACT_MAIN",
              "B62 Production Code Deploy Gate",
              "b62-production-code-deploy-gate.yml",
              "DEPLOY_B62_PRODUCTION_CODE_FROM_EXACT_MAIN",
              '"PADIEM_CHAT_AUTH_MODE"',
              '"hybrid"',
              'version_id": "latest"',
              "/api/auth/status",
              ".methods.password == true",
              ".methods.google == true",
              "environment: production",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f"missing activation invariant: {token}")
          forbidden = [
              "PADIEM_CHAT_GOOGLE_CLIENT_SECRET=",
              "PADIEM_CHAT_SESSION_SECRET=",
              "force-push",
              "git rebase",
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f"forbidden activation token: {token}")
          print("B62_PASSWORD_AUTH_FAST_ACTIVATION_SOURCE=PASS")
          print("GOOGLE_AUTH_DISABLE=0")
          print("SECRET_ROTATION=0")
          print("LEGACY_MIGRATION_REAPPLY=0")
          print("PRODUCTION_MUTATION=0")
          PY

  activate-production:
    needs: source-contract
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact merged main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact current main and Production credentials
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          echo "FAST_ACTIVATION_EXACT_MAIN=PASS"

      - name: Apply migration 012 through canonical gate
        shell: bash
        run: |
          set -euo pipefail
          workflow="b62-auth-d1-migration-012-gate.yml"
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run "${workflow}" --ref main \
            -f mode=apply_migration_012 \
            -f target_sha="${GITHUB_SHA}" \
            -f confirmation=APPLY_B62_AUTH_D1_MIGRATION_012_FROM_EXACT_MAIN

          run_id=""
          for _ in $(seq 1 40); do
            run_id="$(gh run list --workflow "${workflow}" --branch main --event workflow_dispatch --limit 30 \
              --json databaseId,headSha,createdAt \
              --jq '.[] | select(.headSha == env.GITHUB_SHA and .createdAt >= env.started) | .databaseId' \
              --repo "${GITHUB_REPOSITORY}" 2>/dev/null | head -n1 || true)"
            if [ -n "${run_id}" ]; then break; fi
            sleep 2
          done
          if [ -z "${run_id}" ]; then
            # gh --jq cannot see shell vars as jq env on some runner versions; use bounded fallback.
            for _ in $(seq 1 20); do
              run_id="$(gh run list --workflow "${workflow}" --branch main --event workflow_dispatch --limit 10 \
                --json databaseId,headSha \
                --repo "${GITHUB_REPOSITORY}" \
                | python -c 'import json,os,sys; d=json.load(sys.stdin); print(next((str(x["databaseId"]) for x in d if x.get("headSha")==os.environ["GITHUB_SHA"]), ""))')"
              if [ -n "${run_id}" ]; then break; fi
              sleep 2
            done
          fi
          test -n "${run_id}"
          echo "MIGRATION_012_RUN_ID=${run_id}"
          gh run watch "${run_id}" --repo "${GITHUB_REPOSITORY}" --exit-status
          echo "MIGRATION_012_GATE=PASS"

      - name: Deploy merged B62 code through canonical gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"

          workflow="b62-production-code-deploy-gate.yml"
          gh workflow run "${workflow}" --ref main \
            -f mode=deploy_production_code \
            -f target_sha="${GITHUB_SHA}" \
            -f confirmation=DEPLOY_B62_PRODUCTION_CODE_FROM_EXACT_MAIN

          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --workflow "${workflow}" --branch main --event workflow_dispatch --limit 10 \
              --json databaseId,headSha \
              --repo "${GITHUB_REPOSITORY}" \
              | python -c 'import json,os,sys; d=json.load(sys.stdin); print(next((str(x["databaseId"]) for x in d if x.get("headSha")==os.environ["GITHUB_SHA"]), ""))')"
            if [ -n "${run_id}" ]; then break; fi
            sleep 2
          done
          test -n "${run_id}"
          echo "B62_DEPLOY_RUN_ID=${run_id}"
          gh run watch "${run_id}" --repo "${GITHUB_REPOSITORY}" --exit-status
          echo "B62_CODE_DEPLOY_GATE=PASS"

      - name: Switch only auth mode from Google to hybrid
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"

          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          settings_before="${RUNNER_TEMP}/b62-auth-before.json"
          deployments_before="${RUNNER_TEMP}/b62-deployments-before.json"
          patch="${RUNNER_TEMP}/b62-auth-hybrid-patch.json"

          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" \
            -o "${settings_before}"
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/deployments" \
            -o "${deployments_before}"

          jq -e '.success == true and (.result.bindings | type == "array")' "${settings_before}" >/dev/null
          jq -e '.success == true and (.result.deployments[0].versions | length) == 1 and .result.deployments[0].versions[0].percentage == 100' "${deployments_before}" >/dev/null
          before_version="$(jq -r '.result.deployments[0].versions[0].version_id' "${deployments_before}")"
          test -n "${before_version}" && test "${before_version}" != "null"

          python - "${settings_before}" "${patch}" "${GITHUB_SHA}" <<'PY'
          import json, sys

          source_path, output_path, sha = sys.argv[1:]
          payload = json.load(open(source_path, encoding="utf-8"))
          bindings = payload["result"]["bindings"]
          names = [b.get("name") for b in bindings]
          if len(names) != len(set(names)) or any(not isinstance(n, str) or not n for n in names):
              raise SystemExit("live binding names are ambiguous")

          by_name = {b["name"]: b for b in bindings}
          required = {
              "PADIEM_CHAT_DB": "d1",
              "PADIEM_CHAT_PUBLIC_BASE_URL": "plain_text",
              "PADIEM_CHAT_GOOGLE_CLIENT_ID": "plain_text",
              "PADIEM_CHAT_GOOGLE_CLIENT_SECRET": "secret_text",
              "PADIEM_CHAT_SESSION_SECRET": "secret_text",
          }
          for name, kind in required.items():
              b = by_name.get(name)
              if not b or b.get("type") != kind:
                  raise SystemExit(f"required auth prerequisite missing or wrong type: {name}")

          if str(by_name["PADIEM_CHAT_PUBLIC_BASE_URL"].get("text", "")).strip() != "https://chat.padiem.net":
              raise SystemExit("canonical public base URL drift")

          mode = by_name.get("PADIEM_CHAT_AUTH_MODE")
          if mode is not None and mode.get("type") != "plain_text":
              raise SystemExit("auth mode has wrong binding type")
          current = str(mode.get("text", "")).strip().lower() if mode else ""
          if current not in {"google", "hybrid"}:
              raise SystemExit(f"unexpected auth mode prestate: {current or 'missing'}")

          patch_bindings = [
              {"name": b["name"], "type": "inherit", "version_id": "latest"}
              for b in bindings
              if b["name"] != "PADIEM_CHAT_AUTH_MODE"
          ]
          patch_bindings.append(
              {"name": "PADIEM_CHAT_AUTH_MODE", "type": "plain_text", "text": "hybrid"}
          )
          patch_payload = {
              "bindings": patch_bindings,
              "annotations": {
                  "workers/message": f"B62 password auth hybrid activation {sha}",
                  "workers/tag": f"password-auth-{sha[:12]}",
              },
          }
          json.dump(patch_payload, open(output_path, "w", encoding="utf-8"), separators=(",", ":"))
          print(f"AUTH_MODE_PRESTATE={current}")
          print("AUTH_MODE_TARGET=hybrid")
          print("SECRET_VALUE_READ_OR_OUTPUT=0")
          PY

          current_mode="$(jq -r '.result.bindings[]? | select(.name == "PADIEM_CHAT_AUTH_MODE") | .text // empty' "${settings_before}" | head -n1 | tr '[:upper:]' '[:lower:]')"
          if [ "${current_mode}" = "hybrid" ]; then
            echo "AUTH_MODE_ALREADY_HYBRID=YES"
          else
            response="${RUNNER_TEMP}/b62-auth-hybrid-patch-response.json"
            status="$(curl -sS -X PATCH \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -F "settings=<${patch};type=application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" \
              -o "${response}" -w '%{http_code}')"
            echo "AUTH_MODE_PATCH_HTTP_STATUS=${status}"
            test "${status}" -ge 200 && test "${status}" -lt 300
            jq -e '.success == true' "${response}" >/dev/null

            ready=no
            for _ in $(seq 1 40); do
              deployments="${RUNNER_TEMP}/b62-deployments-after.json"
              curl -fsS "${auth[@]}" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/deployments" \
                -o "${deployments}"
              active="$(jq -r '.result.deployments[0].versions[0].version_id // empty' "${deployments}")"
              if [ -n "${active}" ] && [ "${active}" != "${before_version}" ] && \
                 jq -e '.result.deployments[0].versions | length == 1 and .[0].percentage == 100' "${deployments}" >/dev/null 2>&1; then
                ready=yes
                break
              fi
              sleep 2
            done
            test "${ready}" = yes
          fi

          settings_after="${RUNNER_TEMP}/b62-auth-after.json"
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" \
            -o "${settings_after}"
          jq -e '.success == true' "${settings_after}" >/dev/null
          jq -e '[.result.bindings[] | select(.name == "PADIEM_CHAT_AUTH_MODE" and .type == "plain_text" and (.text | ascii_downcase) == "hybrid")] | length == 1' "${settings_after}" >/dev/null

          python - "${settings_before}" "${settings_after}" <<'PY'
          import json, sys
          before = json.load(open(sys.argv[1], encoding="utf-8"))["result"]["bindings"]
          after = json.load(open(sys.argv[2], encoding="utf-8"))["result"]["bindings"]
          before_names = sorted(b["name"] for b in before)
          after_names = sorted(b["name"] for b in after)
          if before_names != after_names:
              raise SystemExit("binding name set changed")
          before_types = {b["name"]: b["type"] for b in before}
          after_types = {b["name"]: b["type"] for b in after}
          for name in before_types:
              if name == "PADIEM_CHAT_AUTH_MODE":
                  continue
              if after_types.get(name) not in {before_types[name], "inherit"}:
                  raise SystemExit(f"binding type changed unexpectedly: {name}")
          print("UNRELATED_BINDING_NAMES_PRESERVED=PASS")
          print("GOOGLE_AUTH_BINDINGS_PRESERVED=PASS")
          print("SECRET_ROTATION=0")
          PY

          echo "AUTH_MODE_HYBRID=PASS"

      - name: Verify public password signup readiness
        shell: bash
        run: |
          set -euo pipefail
          status_file="${RUNNER_TEMP}/auth-status.json"
          http="$(curl -sS -o "${status_file}" -w '%{http_code}' \
            -H 'Accept: application/json' \
            "${B62_PUBLIC_BASE_URL}/api/auth/status")"
          echo "AUTH_STATUS_HTTP=${http}"
          test "${http}" = "200"
          jq -e '.ready == true and .methods.password == true and .methods.google == true' "${status_file}" >/dev/null
          echo "PASSWORD_SIGNUP_READY=YES"
          echo "PASSWORD_LOGIN_READY=YES"
          echo "GOOGLE_LOGIN_PRESERVED=YES"
          echo "FAST_ACTIVATION=PASS"
