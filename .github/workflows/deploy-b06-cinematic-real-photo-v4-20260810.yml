name: Deploy B06 Cinematic Real Photo V4 20260810

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/deploy-b06-cinematic-real-photo-v4-20260810.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.pull_request.head.ref == 'ops/deploy-b06-cinematic-real-photo-v4-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      EXPECTED_SHA: f6cbf65aea92ab5d104365f313054ad12eed1755
      PROJECT: 06-world-feed
      URL: https://06-world-feed.pages.dev/
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Assert exact current main and V4 source markers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          grep -q 'signature-scene-v4.css' reference/business-06-world-feed-v1/index.html
          grep -q 'signature-scene-v4.js' reference/business-06-world-feed-v1/index.html
          ! grep -q 'signature-scene-v3.css' reference/business-06-world-feed-v1/index.html
          ! grep -q 'signature-scene-v3.js' reference/business-06-world-feed-v1/index.html
          grep -q '전 세계 소식 중' reference/business-06-world-feed-v1/scripts/signature-scene-v4.js
          grep -q 'YOUR WORLD, EDITED' reference/business-06-world-feed-v1/scripts/signature-scene-v4.js
          grep -q 'Paperlogy' reference/business-06-world-feed-v1/styles/signature-scene-v4.css
          grep -q 'prefers-reduced-motion' reference/business-06-world-feed-v1/styles/signature-scene-v4.css
          node --check reference/business-06-world-feed-v1/scripts/signature-scene-v4.js

      - name: Deploy exact main B06
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy reference/business-06-world-feed-v1 \
            --project-name "$PROJECT" --branch main \
            --commit-hash "$EXPECTED_SHA" \
            --commit-message 'B06 World Feed Cinematic Real Photo V4 exact main'

      - name: Verify public canonical bytes
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            html=$(curl -L -sS --max-time 20 "$URL" || true)
            css=$(curl -L -sS --max-time 20 "${URL}styles/signature-scene-v4.css" || true)
            js=$(curl -L -sS --max-time 20 "${URL}scripts/signature-scene-v4.js" || true)
            if grep -q 'signature-scene-v4.css' <<<"$html" \
              && grep -q 'signature-scene-v4.js' <<<"$html" \
              && ! grep -q 'signature-scene-v3.css' <<<"$html" \
              && grep -q 'wf-v4-entry' <<<"$css" \
              && grep -q 'YOUR WORLD, EDITED' <<<"$js"; then
              echo 'B06_CINEMATIC_REAL_PHOTO_V4_PUBLIC_BYTES_PASS=1'
              exit 0
            fi
            sleep 4
          done
          exit 1

      - name: Install isolated Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b06-prod-pw
          cd /tmp/b06-prod-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Canonical Production browser QA and screenshots
        env:
          NODE_PATH: /tmp/b06-prod-pw/node_modules
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/b06-prod-evidence
          mkdir -p /tmp/b06-prod-evidence
          cat >/tmp/b06-prod-qa.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const assert = require('assert');
          const url = process.env.URL;

          async function waitImage(page, selector) {
            await page.waitForFunction((sel) => {
              const img = document.querySelector(sel);
              return Boolean(img && img.complete && img.naturalWidth > 300 && img.naturalHeight > 300);
            }, selector, { timeout: 20000 });
          }

          async function shot(page, name) {
            await page.screenshot({ path: `/tmp/b06-prod-evidence/${name}.png`, fullPage: false });
          }

          async function inspect(browser, name, viewport, reducedMotion = 'no-preference') {
            const context = await browser.newContext({ viewport, reducedMotion });
            const page = await context.newPage();
            const errors = [];
            const badResponses = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
            page.on('console', msg => { if (msg.type() === 'error') errors.push(`console: ${msg.text()}`); });
            page.on('response', response => { if (response.status() >= 400) badResponses.push(`${response.status()} ${response.url()}`); });

            await page.goto(`${url}#feed`, { waitUntil: 'networkidle', timeout: 45000 });
            await page.waitForSelector('#view-feed:not([hidden]) .wf-cinema-v4', { state: 'visible', timeout: 12000 });
            await page.evaluate(() => document.fonts.ready);
            await waitImage(page, '.wf-v4-entry-photo');

            const initial = await page.evaluate(() => {
              const stage = document.querySelector('.wf-cinema-v4');
              const title = document.querySelector('#wf-v4-title');
              const promise = document.querySelector('.wf-v4-promise');
              return {
                route: document.querySelector('.review-shell')?.dataset.route,
                activeRoutes: [...document.querySelectorAll('[data-route-view]')].filter(node => !node.hidden).length,
                overflow: document.documentElement.scrollWidth - innerWidth,
                title: title?.innerText || '',
                promise: promise?.innerText || '',
                titleFamily: getComputedStyle(title).fontFamily,
                bodyFamily: getComputedStyle(promise).fontFamily,
                paperlogyReady: document.fonts.check('700 32px Paperlogy'),
                suitReady: document.fonts.check('400 16px "SUIT Variable"'),
                reduced: matchMedia('(prefers-reduced-motion: reduce)').matches,
                scene: stage?.dataset.scene || null,
                stageWidth: stage?.getBoundingClientRect().width || 0
              };
            });
            assert.equal(initial.route, 'feed');
            assert.equal(initial.activeRoutes, 1);
            assert.ok(initial.overflow <= 1, `${name}: overflow ${initial.overflow}`);
            assert.match(initial.title, /전 세계 소식 중/);
            assert.match(initial.title, /오늘의 한 편으로/);
            assert.match(initial.promise, /개인 브리프/);
            assert.match(initial.titleFamily, /Paperlogy/i);
            assert.match(initial.bodyFamily, /SUIT/i);
            assert.equal(initial.paperlogyReady, true);
            assert.equal(initial.suitReady, true);
            assert.ok(initial.stageWidth > 300);
            await shot(page, `${name}-01-entry`);

            if (reducedMotion === 'no-preference') {
              const scenes = await page.evaluate(() => {
                const el = document.querySelector('.wf-v4-scenes');
                const rect = el.getBoundingClientRect();
                return { top: rect.top + scrollY, travel: Math.max(1, el.offsetHeight - innerHeight) };
              });
              const targets = [
                { p: .08, scene: '0', file: '02-discover' },
                { p: .45, scene: '1', file: '03-select' },
                { p: .82, scene: '2', file: '04-explain' }
              ];
              for (const target of targets) {
                await page.evaluate(({ top, travel, p }) => scrollTo(0, top + travel * p), { ...scenes, p: target.p });
                await page.waitForTimeout(650);
                assert.equal(await page.locator('.wf-cinema-v4').getAttribute('data-scene'), target.scene);
                await waitImage(page, `.wf-v4-scene[data-v4-scene="${target.scene}"] img`);
                const stickyVisible = await page.locator('.wf-v4-sticky').evaluate(el => {
                  const r = el.getBoundingClientRect();
                  return r.bottom > 0 && r.top < innerHeight && r.width > 300 && r.height > 500;
                });
                assert.equal(stickyVisible, true, `${name}: sticky scene ${target.scene} not visible`);
                await shot(page, `${name}-${target.file}`);
              }
            } else {
              assert.equal(initial.scene, '2');
              await page.locator('.wf-v4-scenes').scrollIntoViewIfNeeded();
              await waitImage(page, '.wf-v4-scene[data-v4-scene="2"] img');
              await shot(page, `${name}-02-reduced-static`);
            }

            await page.locator('.wf-v4-brief').scrollIntoViewIfNeeded();
            await waitImage(page, '.wf-v4-brief-photo img');
            await page.waitForTimeout(250);
            await shot(page, `${name}-05-brief`);
            const brief = await page.evaluate(() => ({
              title: document.querySelector('#wf-v4-brief-title')?.innerText || '',
              overflow: document.documentElement.scrollWidth - innerWidth,
              ctaDisabled: document.querySelector('.wf-v4-brief [data-open-story][data-story-id="harbor"]')?.disabled || false
            }));
            assert.match(brief.title, /오늘 당신이/);
            assert.ok(brief.overflow <= 1);
            assert.equal(brief.ctaDisabled, false);

            if (reducedMotion === 'no-preference') {
              await page.click('[data-v4-replay]');
              await page.waitForTimeout(900);
              assert.equal(await page.locator('.wf-cinema-v4').getAttribute('data-scene'), '0');
              await page.locator('.wf-v4-brief').scrollIntoViewIfNeeded();
            }

            await page.click('.wf-v4-brief [data-open-story][data-story-id="harbor"]');
            await page.waitForFunction(() => location.hash === '#story' && !document.querySelector('#view-story')?.hidden, null, { timeout: 5000 });
            assert.equal(await page.evaluate(() => document.querySelector('.review-shell')?.dataset.storyId), 'harbor');
            assert.deepEqual(errors, [], `${name}: browser errors ${errors.join(' | ')}`);
            assert.deepEqual(badResponses, [], `${name}: bad responses ${badResponses.join(' | ')}`);
            await context.close();
            return { initial, brief, errors, badResponses };
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const result = {};
            result.desktop = await inspect(browser, 'production-desktop-1440x1100', { width: 1440, height: 1100 });
            result.mobile = await inspect(browser, 'production-mobile-390x844', { width: 390, height: 844 });
            result.reduced = await inspect(browser, 'production-reduced-motion-1440x1100', { width: 1440, height: 1100 }, 'reduce');
            fs.writeFileSync('/tmp/b06-prod-evidence/results.json', JSON.stringify(result, null, 2));
            await browser.close();
            console.log(JSON.stringify(result, null, 2));
          })().catch(error => {
            fs.writeFileSync('/tmp/b06-prod-evidence/error.txt', `${error.stack || error}\n`);
            console.error(error);
            process.exit(1);
          });
          NODE
          node /tmp/b06-prod-qa.cjs

      - name: Re-assert main stayed exact after deploy and QA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          echo "B06_V4_EXACT_MAIN_STILL_CURRENT=$EXPECTED_SHA"

      - name: Upload canonical Production visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b06-cinematic-real-photo-v4-production-evidence-${{ github.run_number }}
          path: /tmp/b06-prod-evidence
          if-no-files-found: error
