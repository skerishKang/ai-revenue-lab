name: B62 Production D1 Metadata Read-Only Audit

on:
  push:
    branches:
      - ops/b62-prod-rollout-20260901

permissions:
  contents: read

concurrency:
  group: b62-production-rollout
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f563b270990a831e25388276095a85b6dd3fcc0b
      - name: Read existing Worker-bound D1 metadata only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          api='https://api.cloudflare.com/client/v4'
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/json','User-Agent':'b62-d1-metadata-audit/1.0'}

          req=Request(f'{api}/accounts/{account}/workers/scripts/padiem-chat/settings',headers=headers)
          with urlopen(req,timeout=20) as r:
              settings=json.loads(r.read(524288).decode())
          bindings=(settings.get('result') or {}).get('bindings') or []
          d1=[b for b in bindings if b.get('name')=='PADIEM_CHAT_DB' and b.get('type')=='d1']
          if len(d1)!=1 or not d1[0].get('database_id'):
              raise SystemExit('exact D1 binding not found')
          database_id=d1[0]['database_id']
          print('WORKER_D1_BINDING_COUNT=1')
          print('D1_ID_LOGGED=false')

          for endpoint,label in [
              (f'{api}/accounts/{account}/d1/database/{database_id}','GET_BY_ID'),
              (f'{api}/accounts/{account}/d1/database/{database_id}/query','QUERY_BY_ID'),
          ]:
              try:
                  if label=='QUERY_BY_ID':
                      body=json.dumps({'sql':'SELECT 1 AS ok'}).encode()
                      rq=Request(endpoint,data=body,method='POST',headers={**headers,'Content-Type':'application/json'})
                  else:
                      rq=Request(endpoint,headers=headers)
                  with urlopen(rq,timeout=20) as r:
                      payload=json.loads(r.read(524288).decode())
                  result=payload.get('result')
                  print(f'{label}_HTTP=200')
                  print(f'{label}_SUCCESS={str(payload.get("success") is True).lower()}')
                  if label=='GET_BY_ID' and isinstance(result,dict):
                      name=result.get('name')
                      if isinstance(name,str) and name.strip():
                          print(f'D1_DATABASE_NAME={name}')
                          print('D1_DATABASE_NAME_RECOVERED=true')
                  if label=='QUERY_BY_ID':
                      print('D1_READ_QUERY_AVAILABLE=true')
              except HTTPError as e:
                  print(f'{label}_HTTP={e.code}')
                  print(f'{label}_SUCCESS=false')
              except Exception as e:
                  print(f'{label}_ERROR={type(e).__name__}')
          print('PRODUCTION_MUTATION=NONE')
          PY
