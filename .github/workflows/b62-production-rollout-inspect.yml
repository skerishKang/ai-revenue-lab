name: B62 Production Rollout Inspect

on:
  push:
    branches:
      - ops/b62-prod-rollout-20260901

permissions:
  contents: read

jobs:
  inspect-production-bindings:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f563b270990a831e25388276095a85b6dd3fcc0b
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect binding metadata without values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          base = "https://api.cloudflare.com/client/v4"
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/json", "User-Agent": "b62-prod-inspect/1.0"}

          def get(url):
              req = Request(url, headers=headers, method="GET")
              try:
                  with urlopen(req, timeout=20) as r:
                      raw = r.read(262144)
                      return r.status, json.loads(raw.decode("utf-8"))
              except HTTPError as e:
                  raw = e.read(262144)
                  try:
                      payload = json.loads(raw.decode("utf-8")) if raw else {}
                  except Exception:
                      payload = {}
                  return e.code, payload

          status, payload = get(f"{base}/accounts/{account}/workers/scripts/padiem-chat/settings")
          print(f"WORKER_SETTINGS_HTTP={status}")
          if status != 200 or payload.get("success") is not True:
              raise SystemExit(1)
          result = payload.get("result") or {}
          bindings = result.get("bindings") or []
          print(f"BINDING_COUNT={len(bindings)}")
          d1_id = None
          for item in bindings:
              if not isinstance(item, dict):
                  continue
              name = item.get("name", "?")
              kind = item.get("type", "?")
              print(
                  "BINDING=" + str(name)
                  + ";TYPE=" + str(kind)
                  + ";HAS_TEXT=" + str(isinstance(item.get("text"), str)).lower()
                  + ";HAS_DATABASE_ID=" + str(isinstance(item.get("database_id"), str)).lower()
                  + ";HAS_DATABASE_NAME=" + str(isinstance(item.get("database_name"), str)).lower()
                  + ";HAS_SERVICE=" + str(isinstance(item.get("service"), str)).lower()
                  + ";HAS_ENVIRONMENT=" + str(isinstance(item.get("environment"), str)).lower()
              )
              if name == "PADIEM_CHAT_DB" and kind == "d1" and isinstance(item.get("database_id"), str):
                  d1_id = item["database_id"]

          if d1_id:
              d1_status, d1_payload = get(f"{base}/accounts/{account}/d1/database/{d1_id}")
              d1_result = d1_payload.get("result") if isinstance(d1_payload, dict) else None
              print(f"D1_METADATA_HTTP={d1_status}")
              print(f"D1_METADATA_HAS_NAME={str(isinstance(d1_result, dict) and isinstance(d1_result.get('name'), str)).lower()}")
          else:
              print("D1_METADATA_HTTP=not_attempted")
              print("D1_METADATA_HAS_NAME=false")
          PY
