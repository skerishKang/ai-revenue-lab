name: B62 Pywrangler Bundle Read-Only Audit

on:
  push:
    branches:
      - ops/b62-prod-rollout-20260901

permissions:
  contents: read

concurrency:
  group: b62-production-rollout
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f563b270990a831e25388276095a85b6dd3fcc0b
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.5"
      - name: Exact source gate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f563b270990a831e25388276095a85b6dd3fcc0b"
          echo 'EXACT_SOURCE=f563b270990a831e25388276095a85b6dd3fcc0b'
          echo 'PRODUCTION_MUTATION=NONE'
      - name: Build mutation-free pywrangler dry-run outdir
        working-directory: apps/padiem-chat
        run: |
          set -euo pipefail
          rm -rf /tmp/b62-out
          mkdir -p /tmp/b62-out
          uvx --from 'workers-py>=1.16.2,<2' pywrangler deploy --dry-run --outdir /tmp/b62-out 2>&1 | tee /tmp/pywrangler-dryrun.log
          echo 'PYWRANGLER_DRY_RUN=PASS'
          echo 'PRODUCTION_MUTATION=NONE'
      - name: Inventory generated upload bundle without contents
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/b62-out')
          files=sorted(p for p in root.rglob('*') if p.is_file())
          print(f'OUTDIR_FILE_COUNT={len(files)}')
          print(f'OUTDIR_TOTAL_BYTES={sum(p.stat().st_size for p in files)}')
          for p in files:
              rel=p.relative_to(root).as_posix()
              suffix=p.suffix.lower() or '<none>'
              print(f'BUNDLE_FILE path={rel} bytes={p.stat().st_size} suffix={suffix}')
          app=Path('apps/padiem-chat')
          pyroot=app/'python_modules'
          if pyroot.exists():
              pyfiles=sorted(p for p in pyroot.rglob('*') if p.is_file())
              print(f'PYTHON_MODULES_GENERATED=true')
              print(f'PYTHON_MODULE_FILE_COUNT={len(pyfiles)}')
              print(f'PYTHON_MODULE_TOTAL_BYTES={sum(p.stat().st_size for p in pyfiles)}')
              for p in pyfiles[:200]:
                  print('PYMODULE_FILE='+p.relative_to(app).as_posix())
          else:
              print('PYTHON_MODULES_GENERATED=false')
          deploy_cfg=app/'.wrangler/deploy/config.json'
          print(f'WRANGLER_DEPLOY_REDIRECT_PRESENT={str(deploy_cfg.exists()).lower()}')
          print('SOURCE_CONTENT_LOGGED=false')
          print('SECRET_EXPOSED=false')
          PY
