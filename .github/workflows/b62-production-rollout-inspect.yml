name: B62 Production Post-Failure Read-Only Inspect

on:
  push:
    branches:
      - ops/b62-prod-rollout-20260901

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f563b270990a831e25388276095a85b6dd3fcc0b
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fresh production read-only state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          B62_BASE_URL: https://padiem-chat.charliekant.workers.dev
          B14_BASE_URL: https://ai-revenue-korean-ai-platform.charliekant.workers.dev
        run: |
          set -euo pipefail
          python .github/scripts/b62_cloudflare_preflight.py
          python .github/scripts/b62_cloudflare_live_readiness.py
          python .github/scripts/b62_cloudflare_deployed_parity.py
          python - <<'PY'
          import json, os, re
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          req=Request(f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/padiem-chat/settings',headers={'Authorization':f'Bearer {token}','Accept':'application/json'},method='GET')
          try:
              with urlopen(req,timeout=20) as r: payload=json.loads(r.read(524288).decode())
          except HTTPError as e: raise SystemExit(f'settings HTTP {e.code}')
          items=(payload.get('result') or {}).get('bindings') or []
          valid=re.compile(r'^[A-Za-z0-9_]+$')
          invalid=[i for i in items if isinstance(i,dict) and isinstance(i.get('name'),str) and not valid.fullmatch(i['name'])]
          correct=[i for i in items if isinstance(i,dict) and i.get('name')=='PADIEM_CHAT_TEST_GUARD_DIGEST']
          alias=[i for i in invalid if i.get('type')=='plain_text' and i.get('name','').startswith('PADIEM_CHAT_TEST_GUARD_DIGEST=')]
          print(f'BINDING_COUNT={len(items)}')
          print(f'INVALID_BINDING_NAME_COUNT={len(invalid)}')
          print(f'MALFORMED_GUARD_ALIAS_COUNT={len(alias)}')
          print(f'VALID_GUARD_BINDING_COUNT={len(correct)}')
          print('BINDING_VALUES_LOGGED=false')
          if len(invalid)!=1 or len(alias)!=1 or len(correct)!=1:
              raise SystemExit('Unexpected invalid binding shape; refusing cleanup assumption')
          PY
