name: Prepare B13 Complete 465
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/prepare-b13-complete-465.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'ops/prepare-b13-complete-465'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_MAIN: 064561674a39c45dd17b5d03192c56670d301913
      AUTHORITY: 1578da82352d8a9a8d69b939ad7dffb81ce9cf8d
      TARGET_BRANCH: feat/b13-personal-video-archive-complete-465
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - name: Materialize approved B13 visual authority on current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          git fetch origin "$AUTHORITY"
          git switch -c "$TARGET_BRANCH"
          git checkout "$AUTHORITY" -- apps/personal-video-archive
          changed=$(git status --short | awk '{print $2}')
          test -n "$changed"
          if echo "$changed" | grep -Ev '^apps/personal-video-archive/' ; then echo OUT_OF_SCOPE; exit 1; fi
          test -f apps/personal-video-archive/static/final-refinement.css
          grep -q 'Private Cinema Archive' apps/personal-video-archive/docs/VISUAL_REFINEMENT_118.md
          grep -q 'final-refinement.css' apps/personal-video-archive/templates/base.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/personal-video-archive
          git commit -m 'feat(b13): integrate approved Private Cinema Archive UI'
          git push --force-with-lease origin "$TARGET_BRANCH"
          echo "B13_PREPARED_HEAD=$(git rev-parse HEAD)"
