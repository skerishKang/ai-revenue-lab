name: Deploy B07 Type Polish 20260810

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/deploy-b07-type-polish-20260810.yml'

permissions:
  contents: read

jobs:
  deploy-and-qa:
    if: github.event.pull_request.head.ref == 'ops/deploy-b07-type-polish-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_SHA: 297c9295d6c0d1ca79baf03fb5c0f3a3bfc98f18
      PROJECT: 07-personal-meaning-map
      URL: https://07-personal-meaning-map.pages.dev
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Assert exact main and source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          for f in index.html guide.html ux.html; do grep -q 'meaning-field-v2-type-polish.css' "reference/business-07-personal-meaning-map-v1/$f"; done
          test -f reference/business-07-personal-meaning-map-v1/styles/meaning-field-v2-type-polish.css
      - name: Deploy exact main B07
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy reference/business-07-personal-meaning-map-v1 \
            --project-name "$PROJECT" --branch main --commit-hash "$EXPECTED_SHA" \
            --commit-message 'B07 Korean display rhythm exact main'
      - name: Wait for canonical Production bytes
        run: |
          set -euo pipefail
          routes=(/ /guide.html /ux.html)
          for attempt in $(seq 1 40); do
            missing=0
            for route in "${routes[@]}"; do
              body=$(curl -L -sS --max-time 20 -H 'Cache-Control: no-cache' "$URL$route" || true)
              if ! grep -q 'meaning-field-v2-type-polish.css' <<<"$body"; then missing=1; echo "attempt=$attempt stale=$route"; fi
            done
            css=$(curl -L -sS --max-time 20 -H 'Cache-Control: no-cache' "$URL/styles/meaning-field-v2-type-polish.css" || true)
            if [ "$missing" -eq 0 ] && grep -q 'Korean display rhythm polish' <<<"$css"; then echo 'B07_TYPE_PUBLIC_BYTES_PASS=1'; exit 0; fi
            sleep 4
          done
          exit 1
      - name: Install Chromium and Korean fonts
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p /tmp/b07-prod && cd /tmp/b07-prod
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
      - name: Canonical Production browser QA
        run: |
          set -euo pipefail
          mkdir -p /tmp/b07-prod-evidence
          cd /tmp/b07-prod
          node <<'JS'
          const {chromium}=require('playwright'); const fs=require('fs'),path=require('path');
          const base='https://07-personal-meaning-map.pages.dev'; const vps=[{name:'desktop',width:1440,height:1100},{name:'mobile',width:390,height:844}];
          (async()=>{const browser=await chromium.launch({headless:true}); const results=[];
            for(const vp of vps){
              for(const [name,route] of [['root','/'],['guide','/guide.html']]){
                const context=await browser.newContext({viewport:vp,extraHTTPHeaders:{'Cache-Control':'no-cache','Pragma':'no-cache'}}); const page=await context.newPage(); const errors=[],failed=[];
                page.on('console',m=>{if(m.type()==='error')errors.push(m.text())}); page.on('pageerror',e=>errors.push(e.message)); page.on('response',r=>{if(r.status()>=400)failed.push(`${r.status()} ${r.url()}`)});
                const response=await page.goto(base+route,{waitUntil:'networkidle',timeout:45000}); await page.evaluate(()=>document.fonts.ready); await page.waitForTimeout(300);
                const m=await page.evaluate(()=>{const h=document.querySelector('h1'),c=getComputedStyle(h);return{overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,font:parseFloat(c.fontSize),line:parseFloat(c.lineHeight),ratio:parseFloat(c.lineHeight)/parseFloat(c.fontSize),polish:[...document.styleSheets].some(s=>String(s.href||'').includes('meaning-field-v2-type-polish.css'))}});
                const problems=[]; if(response.status()!==200)problems.push('status'); if(m.overflow>1)problems.push('overflow'); if(errors.length||failed.length)problems.push('runtime'); if(!m.polish)problems.push('polish missing'); if(m.ratio<1)problems.push(`tight ${m.ratio}`); if(vp.name==='mobile'&&m.font>52)problems.push(`mobile too large ${m.font}`);
                await page.screenshot({path:path.join('/tmp/b07-prod-evidence',`${vp.name}-${name}.png`),fullPage:false}); results.push({viewport:vp.name,name,status:response.status(),errors,failed,problems,...m}); await context.close();
              }
              const context=await browser.newContext({viewport:vp,extraHTTPHeaders:{'Cache-Control':'no-cache','Pragma':'no-cache'}}); const page=await context.newPage(); const errors=[],failed=[]; page.on('console',m=>{if(m.type()==='error')errors.push(m.text())}); page.on('pageerror',e=>errors.push(e.message)); page.on('response',r=>{if(r.status()>=400)failed.push(`${r.status()} ${r.url()}`)});
              const response=await page.goto(base+'/ux.html',{waitUntil:'networkidle',timeout:45000}); await page.locator('.pm-memory').nth(0).click(); await page.locator('.pm-memory').nth(3).click(); const enabled=!(await page.locator('#connect').isDisabled()); await page.locator('#connect').click(); await page.waitForTimeout(180); const summary=await page.locator('#summary').evaluate(e=>e.classList.contains('show')); const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth); const polish=await page.evaluate(()=>[...document.styleSheets].some(s=>String(s.href||'').includes('meaning-field-v2-type-polish.css'))); const problems=[...(response.status()===200?[]:['status']),...(enabled?[]:['connect disabled']),...(summary?[]:['summary hidden']),...(overflow<=1?[]:[`overflow ${overflow}`]),...(polish?[]:['polish missing']),...(errors.length||failed.length?['runtime']:[])]; await page.screenshot({path:path.join('/tmp/b07-prod-evidence',`${vp.name}-workspace-connected.png`),fullPage:false}); results.push({viewport:vp.name,name:'workspace-connected',status:response.status(),errors,failed,problems,overflow,enabled,summary,polish}); await context.close();
            }
            await browser.close(); const bad=results.filter(x=>x.problems.length); fs.writeFileSync('/tmp/b07-prod-evidence/results.json',JSON.stringify({results,bad},null,2)); console.log(JSON.stringify({count:results.length,bad},null,2)); if(bad.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Reassert exact main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
      - name: Upload Production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b07-type-polish-production-evidence-${{ github.run_number }}
          path: /tmp/b07-prod-evidence
          if-no-files-found: error
          retention-days: 7
