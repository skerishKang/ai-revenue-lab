name: Verify B44 Alignment 438

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: [.github/workflows/verify-b44-alignment-438.yml]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/verify-b44-alignment-438'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PROJECT: ai-revenue-portfolio-console
      EXPECTED_SHA: 059ee3f2553032e7569e601abfa6ffb3659a9865
      PRODUCTION_URL: https://ai-revenue-portfolio-console.pages.dev/
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Capture current Production deployment state
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PROJECT}"
          curl --fail-with-body -sS -H "Authorization: Bearer ${CF_API_TOKEN}" "$base/deployments" > /tmp/d.json
          python3 - "$EXPECTED_SHA" <<'PY'
          import json,sys
          expected=sys.argv[1]
          rows=[x for x in json.load(open('/tmp/d.json')).get('result',[]) if x.get('environment')=='production']
          rows.sort(key=lambda x:x.get('created_on') or '', reverse=True)
          d=rows[0]
          meta=(d.get('deployment_trigger') or {}).get('metadata') or {}
          stage=d.get('latest_stage') or {}
          sha=meta.get('commit_hash') or ''
          print(f"deployment_id={d.get('id')} source_sha={sha} branch={meta.get('branch')} created={d.get('created_on')} modified={d.get('modified_on')} stage={stage.get('name')}/{stage.get('status')}")
          print('stages='+','.join(f"{s.get('name')}:{s.get('status')}" for s in d.get('stages',[])))
          if sha != expected: raise SystemExit('latest Production SHA mismatch')
          print('B44_ALIGNMENT_EXPECTED_SOURCE_PRESENT=1')
          if stage.get('name') == 'deploy' and stage.get('status') == 'success':
              print('B44_ALIGNMENT_PRODUCTION_ACCEPTED=1')
          else:
              print('B44_ALIGNMENT_PRODUCTION_STILL_PENDING=1')
          PY

      - name: Verify Access boundary
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 20 -o /tmp/body -D /tmp/headers -w '%{http_code}' "$PRODUCTION_URL")
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,""); print substr($0,index($0,":")+2); exit}' /tmp/headers)
          host=$(python3 - "$location" <<'PY'
          import sys,urllib.parse
          print(urllib.parse.urlsplit(sys.argv[1]).hostname or '')
          PY
          )
          echo "production_http=$code redirect_host=$host"
          [[ "$code" == "302" ]]
          [[ "$host" == "limoneai.cloudflareaccess.com" ]]
          echo "B44_ALIGNMENT_ACCESS_BOUNDARY_VERIFIED=1"
