name: Deploy portfolio canonical previews 2026-08-16

on:
  push:
    branches:
      - portfolio/first-complete-20260816
    paths:
      - .github/workflows/deploy-portfolio-canonical-previews-20260816.yml
      - portfolio/first-complete/canonical-preview-authority.js
      - portfolio/first-complete/canonical-preview-scale.css
      - portfolio/first-complete/canonical-previews/**

permissions:
  contents: read

concurrency:
  group: portfolio-canonical-previews-20260816
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: ai-revenue-final-portfolio
      SOURCE_DIR: portfolio/first-complete
      PUBLIC_URL: https://ai-revenue-final-portfolio.pages.dev
    steps:
      - uses: actions/checkout@v4

      - name: Build corrected preview bundle
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path('portfolio/first-complete')
          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          style = '<link rel="stylesheet" href="./canonical-preview-scale.css?v=20260816-6" />'
          script = '<script src="./canonical-preview-authority.js?v=20260816-6"></script>'
          if 'canonical-preview-scale.css' not in text:
              if '</head>' not in text:
                  raise SystemExit('index.html has no </head>')
              text = text.replace('</head>', style + '\n</head>')
          if 'canonical-preview-authority.js' not in text:
              if '</body>' not in text:
                  raise SystemExit('index.html has no </body>')
              text = text.replace('</body>', script + '\n</body>')
          text = re.sub(r'canonical-preview-scale\.css\?v=[^"\']+', 'canonical-preview-scale.css?v=20260816-6', text)
          text = re.sub(r'canonical-preview-authority\.js\?v=[^"\']+', 'canonical-preview-authority.js?v=20260816-6', text)
          index.write_text(text, encoding='utf-8')

          required = ['b01','b02','b04','b06','b07','b08','b10','b11','b12','b13','b15']
          missing = [bid for bid in required if not (root / 'canonical-previews' / f'{bid}.jpg').is_file()]
          if missing:
              raise SystemExit(f'missing approved card previews: {missing}')

          js = (root / 'canonical-preview-authority.js').read_text(encoding='utf-8')
          required_js = [
              'drive-canonical-highres-20260816',
              'B09 · INTEGRATION BLOCKER',
              'drive.google.com/thumbnail',
              '원본 승인본 열기',
              'Do NOT change .viewport position',
          ]
          for marker in required_js:
              if marker not in js:
                  raise SystemExit(f'missing corrected authority marker: {marker}')
          forbidden_js = ["host.style.position = 'relative'", 'b03: { card:', 'b14: { card:']
          for marker in forbidden_js:
              if marker in js:
                  raise SystemExit(f'forbidden preview override remains: {marker}')

          css = (root / 'canonical-preview-scale.css').read_text(encoding='utf-8')
          required_css = ['Preserve the portfolio layout', 'object-fit: cover', 'object-position: center top', 'transform: none']
          for marker in required_css:
              if marker not in css:
                  raise SystemExit(f'missing original-layout marker: {marker}')
          forbidden_css = ['scale(2.08)', 'scale(1.72)', 'grid-template-columns: minmax(260px, 290px)', 'min-height: clamp(720px, 50vw, 860px)']
          for marker in forbidden_css:
              if marker in css:
                  raise SystemExit(f'old broken scaling/layout marker remains: {marker}')
          print('PREVIEW_GEOMETRY_AND_HIGHRES_LINKS=PASS')

      - name: Deploy portfolio only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy "${SOURCE_DIR}" \
            --project-name "${PROJECT_NAME}" \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "Portfolio preview geometry and high-res evidence correction" \
            --commit-dirty=true

      - name: Verify production bundle
        shell: python
        run: |
          import time, urllib.request
          base = 'https://ai-revenue-final-portfolio.pages.dev'
          cache = '?canonical=20260816-6'

          def get(path):
              req = urllib.request.Request(base + path, headers={
                  'User-Agent':'portfolio-canonical-qa/5.0',
                  'Cache-Control':'no-cache',
                  'Pragma':'no-cache'
              })
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.status, r.headers.get('content-type',''), r.read()

          def wait_for(label, check, attempts=30):
              last = 'not-run'
              for i in range(attempts):
                  try:
                      ok, detail = check()
                      last = detail
                      print(f'{label} attempt={i+1} {detail}')
                      if ok:
                          return
                  except Exception as e:
                      last = repr(e)
                      print(f'{label} attempt={i+1} error={last}')
                  time.sleep(2)
              print(f'::error title=Portfolio production QA::{label} failed: {last}')
              raise SystemExit(1)

          def index_check():
              status, ctype, body = get('/' + cache)
              js_marker = b'canonical-preview-authority.js?v=20260816-6'
              css_marker = b'canonical-preview-scale.css?v=20260816-6'
              ok = js_marker in body and css_marker in body
              return ok, f'status={status} bytes={len(body)} js={js_marker in body} css={css_marker in body}'
          wait_for('INDEX', index_check)

          def loader_check():
              status, ctype, body = get('/canonical-preview-authority.js' + cache)
              text = body.decode('utf-8','replace')
              required = ['drive-canonical-highres-20260816','drive.google.com/thumbnail','Do NOT change .viewport position','1MKU3xRACFclsOIMEeXJx5hqPbPKLfUYk']
              forbidden = ["host.style.position = 'relative'", 'b03: { card:', 'b14: { card:']
              ok = status == 200 and all(m in text for m in required) and not any(m in text for m in forbidden)
              return ok, f'status={status} bytes={len(body)} required={[(m,m in text) for m in required]} forbidden={[(m,m in text) for m in forbidden]}'
          wait_for('LOADER', loader_check)

          def css_check():
              status, ctype, body = get('/canonical-preview-scale.css' + cache)
              text = body.decode('utf-8','replace')
              required = ['object-fit: cover','object-position: center top','transform: none']
              forbidden = ['scale(2.08)','scale(1.72)','grid-template-columns: minmax(260px, 290px)']
              ok = status == 200 and all(m in text for m in required) and not any(m in text for m in forbidden)
              return ok, f'status={status} bytes={len(body)} required={[(m,m in text) for m in required]} forbidden={[(m,m in text) for m in forbidden]}'
          wait_for('CELL-FILL', css_check)

          for bid in ['b01','b02','b04','b06','b07','b08','b10','b11','b12','b13','b15']:
              def asset_check(bid=bid):
                  status, ctype, body = get(f'/canonical-previews/{bid}.jpg' + cache)
                  jpg = body.startswith(b'\xff\xd8')
                  ok = status == 200 and len(body) >= 2000 and jpg
                  return ok, f'{bid} status={status} bytes={len(body)} jpg={jpg}'
              wait_for(f'CARD-{bid}', asset_check, attempts=15)

          print('PRODUCTION_PREVIEW_GEOMETRY=PASS')
