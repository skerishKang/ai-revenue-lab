name: Deploy portfolio canonical previews 2026-08-16

on:
  push:
    branches:
      - portfolio/first-complete-20260816
    paths:
      - .github/workflows/deploy-portfolio-canonical-previews-20260816.yml
      - portfolio/first-complete/canonical-preview-authority.js
      - portfolio/first-complete/canonical-previews/**

permissions:
  contents: read

concurrency:
  group: portfolio-canonical-previews-20260816
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: ai-revenue-final-portfolio
      SOURCE_DIR: portfolio/first-complete
      PUBLIC_URL: https://ai-revenue-final-portfolio.pages.dev
    steps:
      - uses: actions/checkout@v4

      - name: Build canonical-authority deployment bundle
        shell: python
        run: |
          from pathlib import Path
          root = Path('portfolio/first-complete')
          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          script = '<script src="./canonical-preview-authority.js?v=20260816-3"></script>'
          if 'canonical-preview-authority.js' not in text:
              if '</body>' not in text:
                  raise SystemExit('index.html has no </body>')
              text = text.replace('</body>', script + '\n</body>')
              index.write_text(text, encoding='utf-8')
          required = ['b01','b02','b03','b04','b06','b07','b08','b10','b11','b12','b13','b14','b15']
          missing = [bid for bid in required if not (root / 'canonical-previews' / f'{bid}.jpg').is_file()]
          if missing:
              raise SystemExit(f'missing canonical previews: {missing}')
          js = (root / 'canonical-preview-authority.js').read_text(encoding='utf-8')
          for marker in ['drive-canonical-20260816', 'B09 · INTEGRATION BLOCKER', '승인본 크게 보기']:
              if marker not in js:
                  raise SystemExit(f'missing authority marker: {marker}')
          print('CANONICAL_AUTHORITY_BUNDLE=PASS')

      - name: Deploy portfolio only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy "${SOURCE_DIR}" \
            --project-name "${PROJECT_NAME}" \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "Portfolio canonical preview authority correction" \
            --commit-dirty=true

      - name: Verify production assets and authority loader
        shell: python
        run: |
          import time, urllib.request, urllib.error
          base = 'https://ai-revenue-final-portfolio.pages.dev'
          cache = '?canonical=20260816-3'

          def get(path):
              url = base + path
              req = urllib.request.Request(url, headers={
                  'User-Agent':'portfolio-canonical-qa/2.0',
                  'Cache-Control':'no-cache',
                  'Pragma':'no-cache'
              })
              with urllib.request.urlopen(req, timeout=20) as r:
                  body = r.read()
                  return r.status, r.headers.get('content-type',''), body

          def wait_for(label, check, attempts=30):
              last = 'not-run'
              for i in range(attempts):
                  try:
                      ok, detail = check()
                      last = detail
                      print(f'{label} attempt={i+1} {detail}')
                      if ok:
                          return
                  except Exception as e:
                      last = repr(e)
                      print(f'{label} attempt={i+1} error={last}')
                  time.sleep(2)
              print(f'::error title=Portfolio production QA::{label} failed: {last}')
              raise SystemExit(1)

          def index_check():
              status, ctype, body = get('/' + cache)
              marker = b'canonical-preview-authority.js?v=20260816-3'
              return marker in body, f'status={status} type={ctype} bytes={len(body)} marker={marker in body}'
          wait_for('INDEX', index_check)

          def loader_check():
              status, ctype, body = get('/canonical-preview-authority.js' + cache)
              text = body.decode('utf-8','replace')
              markers = ['drive-canonical-20260816','B09 · INTEGRATION BLOCKER','canonical-previews/b02.jpg']
              ok = status == 200 and all(m in text for m in markers)
              return ok, f'status={status} type={ctype} bytes={len(body)} markers={[(m, m in text) for m in markers]}'
          wait_for('LOADER', loader_check)

          for bid in ['b02','b08','b10','b11','b13','b14','b15']:
              def asset_check(bid=bid):
                  status, ctype, body = get(f'/canonical-previews/{bid}.jpg' + cache)
                  jpg = body.startswith(b'\xff\xd8')
                  ok = status == 200 and len(body) >= 2000 and jpg
                  return ok, f'{bid} status={status} type={ctype} bytes={len(body)} jpg={jpg}'
              wait_for(f'ASSET-{bid}', asset_check, attempts=15)

          print('CANONICAL_PRODUCTION_QA=PASS')
