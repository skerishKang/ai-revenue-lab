name: B60 UX667 Settled Visual Temp

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  visual:
    if: github.event.pull_request.number == 668
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install Chromium
        run: |
          mkdir -p "${RUNNER_TEMP}/pw"
          npm install --prefix "${RUNNER_TEMP}/pw" playwright@1.55.0 >/dev/null
          "${RUNNER_TEMP}/pw/node_modules/.bin/playwright" install --with-deps chromium >/dev/null
      - name: Start server
        run: |
          python3 -m http.server 4173 --directory apps/portfolio-console >"${RUNNER_TEMP}/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ai-api/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Capture settled states
        env:
          PW: ${{ runner.temp }}/pw/node_modules/playwright
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/settled"
          cat > "${RUNNER_TEMP}/settled/run.cjs" <<'NODE'
          const { chromium } = require(process.env.PW);
          const fs = require('fs');
          const path = require('path');
          const out = process.env.RUNNER_TEMP + '/settled';
          const failures=[]; const evidence=[];
          const assert=(c,m)=>{if(!c) failures.push(m)};
          async function run(viewport,prefix){
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport});
            const errors=[]; const failed=[];
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
            page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
            await page.goto('http://127.0.0.1:4173/ai-api/',{waitUntil:'networkidle'});
            await page.locator('#explore').scrollIntoViewIfNeeded();
            await page.waitForSelector('.ux2-card-compare');
            const buttons=page.locator('.access-card [data-compare-id]');
            const openrouter=page.locator('.access-card[data-id="openrouter-free-router"] [data-compare-id]');
            await buttons.nth(0).click();
            await openrouter.click();
            await page.locator('[data-open-compare]').click();
            await page.waitForSelector('.ux2-sheet.is-open');
            await page.waitForTimeout(350);
            assert(await page.locator('.ux2-compare-card').count()===2,`${prefix}: compare card count`);
            assert(await page.locator('.ux2-compare-card .ux2-exec-state.is-mapped').count()===1,`${prefix}: exactly one mapped compare route required`);
            const compareText=await page.locator('.ux2-sheet-panel').innerText();
            assert(compareText.includes('openrouter/free'),`${prefix}: OpenRouter missing from comparison`);
            await page.screenshot({path:path.join(out,`${prefix}-01-compare-settled.png`),fullPage:false});
            await page.locator('[data-close-sheet]').click();
            await page.waitForTimeout(280);

            await page.locator('.ia-primary [data-ia-view="connect"]').click();
            await page.waitForSelector('.ia-connect-boundary');
            await page.waitForTimeout(180);
            const mapped=page.locator('.ia-connect-routes article[data-route-id="openrouter-free-router"]');
            assert(await page.locator('.ia-connect-routes [data-runtime-state="CONNECTABLE"]').count()===1,`${prefix}: connectable count`);
            assert(await page.locator('.ia-connect-routes [data-runtime-state="DISCOVERABLE_ONLY"]').count()===4,`${prefix}: info-only count`);
            await page.screenshot({path:path.join(out,`${prefix}-02-connect-settled.png`),fullPage:false});
            await mapped.locator('[data-handoff-id]').click();
            await page.waitForSelector('.ux2-handoff.is-open');
            await page.waitForTimeout(350);
            const handoffText=await page.locator('.ux2-handoff-panel').innerText();
            assert(!handoffText.includes('Business 14'),`${prefix}: internal Business 14 label leaked`);
            assert(!handoffText.includes('B14 MODEL'),`${prefix}: internal B14 MODEL label leaked`);
            assert(handoffText.includes('MODEL ID'),`${prefix}: model id label missing`);
            assert(handoffText.includes('ROUTE ID'),`${prefix}: route id label missing`);
            assert(handoffText.includes('openrouter:openrouter/free'),`${prefix}: exact route missing`);
            assert(handoffText.includes('NOT BOUND'),`${prefix}: unbound execution target missing`);
            assert(handoffText.includes('이 사이트에 저장하지 않음'),`${prefix}: key-storage boundary missing`);
            const rect=await page.locator('.ux2-handoff-panel').boundingBox();
            const actual=await page.evaluate(()=>({innerWidth,scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth}));
            assert(rect && rect.x>=-1 && rect.x+rect.width<=actual.innerWidth+1,`${prefix}: handoff width overflow ${JSON.stringify(rect)}`);
            assert(actual.scrollWidth<=actual.clientWidth+1,`${prefix}: page overflow ${JSON.stringify(actual)}`);
            await page.screenshot({path:path.join(out,`${prefix}-03-handoff-settled.png`),fullPage:false});
            assert(errors.length===0,`${prefix}: console ${errors.join('|')}`);
            assert(failed.length===0,`${prefix}: requests ${failed.join('|')}`);
            evidence.push({prefix,actual,errors,failed});
            await browser.close();
          }
          (async()=>{await run({width:1440,height:1000},'desktop');await run({width:390,height:844},'mobile');const result={pass:!failures.length,failures,evidence};fs.writeFileSync(path.join(out,'result.json'),JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2));if(failures.length)process.exit(1)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node "${RUNNER_TEMP}/settled/run.cjs"
      - name: Upload settled evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b60-ux667-settled-evidence
          path: ${{ runner.temp }}/settled
          if-no-files-found: error
