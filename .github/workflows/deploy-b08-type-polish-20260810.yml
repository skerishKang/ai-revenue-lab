name: Deploy B08 Type Polish 20260810
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/deploy-b08-type-polish-20260810.yml']
permissions:
  contents: read
jobs:
  deploy-and-qa:
    if: github.event.pull_request.head.ref == 'ops/deploy-b08-type-polish-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_SHA: b876df6d9ada41e47df5d3294de5d6ad625451e9
      PROJECT: 08-family-newspaper
      URL: https://08-family-newspaper.pages.dev
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.EXPECTED_SHA }}', persist-credentials: false}
      - name: Assert exact main/source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          for f in index.html guide.html ux.html; do grep -q 'pressroom-v2-type-polish.css' "reference/business-08-family-newspaper-v1/$f"; done
      - name: Deploy exact main B08
        run: npx --yes wrangler@latest pages deploy reference/business-08-family-newspaper-v1 --project-name "$PROJECT" --branch main --commit-hash "$EXPECTED_SHA" --commit-message 'B08 Korean publication rhythm exact main'
      - name: Wait for canonical bytes
        run: |
          set -euo pipefail
          for n in $(seq 1 40); do
            ok=1
            for r in / /guide.html /ux.html; do b=$(curl -L -sS --max-time 20 -H 'Cache-Control: no-cache' "$URL$r" || true); grep -q 'pressroom-v2-type-polish.css' <<<"$b" || ok=0; done
            c=$(curl -L -sS --max-time 20 -H 'Cache-Control: no-cache' "$URL/styles/pressroom-v2-type-polish.css" || true)
            if [ "$ok" = 1 ] && grep -q 'Korean publication rhythm polish' <<<"$c"; then exit 0; fi
            sleep 4
          done
          exit 1
      - name: Install Chromium/Korean fonts
        run: |
          sudo apt-get update -y && sudo apt-get install -y fonts-noto-cjk
          mkdir -p /tmp/b08-prod && cd /tmp/b08-prod && npm init -y >/dev/null 2>&1 && npm install --silent playwright@1.55.0 && npx playwright install chromium
      - name: Production browser QA
        run: |
          set -euo pipefail
          mkdir -p /tmp/b08-prod-evidence && cd /tmp/b08-prod
          node <<'JS'
          const {chromium}=require('playwright'),fs=require('fs'),path=require('path'); const base='https://08-family-newspaper.pages.dev',vps=[{name:'desktop',width:1440,height:1100},{name:'mobile',width:390,height:844}];
          (async()=>{const b=await chromium.launch({headless:true}),R=[];for(const vp of vps){for(const [n,r,s] of [['root','/','.fp-lead h2'],['guide','/guide.html','.fp-guide-copy h1']]){const c=await b.newContext({viewport:vp,extraHTTPHeaders:{'Cache-Control':'no-cache'}}),p=await c.newPage(),E=[],F=[];p.on('console',m=>{if(m.type()==='error')E.push(m.text())});p.on('pageerror',e=>E.push(e.message));p.on('response',x=>{if(x.status()>=400)F.push(`${x.status()} ${x.url()}`)});const q=await p.goto(base+r,{waitUntil:'networkidle'});const m=await p.locator(s).evaluate(h=>{const c=getComputedStyle(h);return{font:parseFloat(c.fontSize),line:parseFloat(c.lineHeight),ratio:parseFloat(c.lineHeight)/parseFloat(c.fontSize),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,polish:[...document.styleSheets].some(s=>String(s.href||'').includes('pressroom-v2-type-polish.css'))}});const P=[...(q.status()===200?[]:['status']),...(m.ratio>=1?[]:['tight']),...(m.overflow<=1?[]:['overflow']),...(m.polish?[]:['missing']),...(E.length||F.length?['runtime']:[])];await p.screenshot({path:path.join('/tmp/b08-prod-evidence',`${vp.name}-${n}.png`),fullPage:false});R.push({viewport:vp.name,name:n,errors:E,failed:F,problems:P,...m});await c.close()}
          const c=await b.newContext({viewport:vp,extraHTTPHeaders:{'Cache-Control':'no-cache'}}),p=await c.newPage();await p.goto(base+'/ux.html',{waitUntil:'networkidle'});await p.locator('[data-bookmark]').click();for(const id of ['news','photos','calendar','sources'])await p.locator(`.fp-reader-nav [data-page="${id}"]`).click();const active=await p.locator('.fp-page.active').getAttribute('id'),book=await p.locator('[data-bookmark]').getAttribute('data-on');const m=await p.locator('.fp-page.active .fp-page-title').evaluate(h=>{const c=getComputedStyle(h);return{font:parseFloat(c.fontSize),line:parseFloat(c.lineHeight),ratio:parseFloat(c.lineHeight)/parseFloat(c.fontSize),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,polish:[...document.styleSheets].some(s=>String(s.href||'').includes('pressroom-v2-type-polish.css'))}});const P=[...(active==='sources'?[]:['nav']),...(book==='1'?[]:['bookmark']),...(m.ratio>=1?[]:['tight']),...(m.overflow<=1?[]:['overflow']),...(m.polish?[]:['missing'])];await p.screenshot({path:path.join('/tmp/b08-prod-evidence',`${vp.name}-reader-sources.png`),fullPage:false});R.push({viewport:vp.name,name:'reader-sources',active,book,problems:P,...m});await c.close()}
          await b.close();const bad=R.filter(x=>x.problems.length);fs.writeFileSync('/tmp/b08-prod-evidence/results.json',JSON.stringify({results:R,bad},null,2));if(bad.length){console.log(bad);process.exit(1)}})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Reassert exact main
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'b08-type-polish-production-evidence-${{ github.run_number }}', path: /tmp/b08-prod-evidence, if-no-files-found: error, retention-days: 7}
