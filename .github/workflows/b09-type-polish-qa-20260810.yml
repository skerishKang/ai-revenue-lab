name: B09 Type Polish QA 20260810

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/b09-type-polish-qa-20260810.yml'
      - 'reference/business-09-personalized-childrens-story-v1/**'

permissions:
  contents: read

jobs:
  qa:
    if: github.event.pull_request.head.ref == 'fix/b09-korean-story-rhythm-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Chromium and Korean fonts
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p /tmp/b09-polish && cd /tmp/b09-polish
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
      - name: Serve B09
        run: |
          cd reference/business-09-personalized-childrens-story-v1
          python3 -m http.server 4179 --bind 127.0.0.1 >/tmp/b09-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4179/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/b09-http.log
          exit 1
      - name: Screenshot and interaction QA
        run: |
          set -euo pipefail
          mkdir -p /tmp/b09-polish-evidence
          cd /tmp/b09-polish
          node <<'JS'
          const {chromium}=require('playwright');const fs=require('fs'),path=require('path');const base='http://127.0.0.1:4179';const vps=[{name:'desktop',width:1440,height:1100},{name:'mobile',width:390,height:844}];
          (async()=>{const browser=await chromium.launch({headless:true});const results=[];
            for(const vp of vps){
              for(const [name,route,sel] of [['root','/','.sb-copy h1'],['guide','/guide.html','.sb-guide-copy h1']]){
                const page=await browser.newPage({viewport:vp});const errors=[],failed=[];page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});page.on('pageerror',e=>errors.push(e.message));page.on('response',r=>{if(r.status()>=400)failed.push(`${r.status()} ${r.url()}`)});
                const response=await page.goto(base+route,{waitUntil:'networkidle'});await page.evaluate(()=>document.fonts.ready);await page.waitForTimeout(220);const m=await page.locator(sel).evaluate(h=>{const c=getComputedStyle(h),r=h.getBoundingClientRect();return{font:parseFloat(c.fontSize),line:parseFloat(c.lineHeight),ratio:parseFloat(c.lineHeight)/parseFloat(c.fontSize),width:r.width,height:r.height,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,polish:[...document.styleSheets].some(s=>String(s.href||'').includes('story-bloom-v2-type-polish.css'))}});const problems=[];if(response.status()!==200)problems.push('status');if(m.overflow>1)problems.push('overflow');if(errors.length||failed.length)problems.push('runtime');if(!m.polish)problems.push('polish missing');if(m.ratio<1.02)problems.push(`tight ${m.ratio}`);if(vp.name==='mobile'&&m.font>50)problems.push(`mobile display too large ${m.font}`);await page.screenshot({path:path.join('/tmp/b09-polish-evidence',`${vp.name}-${name}.png`),fullPage:false});results.push({viewport:vp.name,name,status:response.status(),errors,failed,problems,...m});await page.close();
              }
              for(const choice of ['river','shop']){
                const page=await browser.newPage({viewport:vp});const errors=[],failed=[];page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});page.on('pageerror',e=>errors.push(e.message));page.on('response',r=>{if(r.status()>=400)failed.push(`${r.status()} ${r.url()}`)});const response=await page.goto(base+'/ux.html',{waitUntil:'networkidle'});await page.locator(`.sb-choice[data-choice="${choice}"]`).click();await page.waitForTimeout(160);const branch=await page.locator('#nextTitle').evaluate(h=>{const c=getComputedStyle(h);return{font:parseFloat(c.fontSize),line:parseFloat(c.lineHeight),ratio:parseFloat(c.lineHeight)/parseFloat(c.fontSize),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,polish:[...document.styleSheets].some(s=>String(s.href||'').includes('story-bloom-v2-type-polish.css'))}});await page.locator('#whyButton').click();const whyVisible=!(await page.locator('#whyText').evaluate(e=>e.hidden));await page.locator('#back').click();const backVisible=!(await page.locator('#spread').evaluate(e=>e.hidden));await page.locator(`.sb-choice[data-choice="${choice}"]`).click();await page.locator('#continue').click();const ended=await page.locator('#continue').isDisabled();const problems=[];if(response.status()!==200)problems.push('status');if(branch.overflow>1)problems.push('overflow');if(errors.length||failed.length)problems.push('runtime');if(!branch.polish)problems.push('polish missing');if(branch.ratio<1.03)problems.push(`branch tight ${branch.ratio}`);if(vp.name==='mobile'&&branch.font>47)problems.push(`mobile branch too large ${branch.font}`);if(!whyVisible)problems.push('why hidden');if(!backVisible)problems.push('back failed');if(!ended)problems.push('end failed');await page.screenshot({path:path.join('/tmp/b09-polish-evidence',`${vp.name}-${choice}-end.png`),fullPage:false});results.push({viewport:vp.name,name:`${choice}-journey`,status:response.status(),errors,failed,problems,whyVisible,backVisible,ended,...branch});await page.close();
              }
            }
            await browser.close();const bad=results.filter(x=>x.problems.length);fs.writeFileSync('/tmp/b09-polish-evidence/results.json',JSON.stringify({results,bad},null,2));console.log(JSON.stringify({count:results.length,bad},null,2));if(bad.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Source scope check
        run: |
          set -euo pipefail
          for f in index.html guide.html ux.html; do grep -q 'story-bloom-v2-type-polish.css' "reference/business-09-personalized-childrens-story-v1/$f"; done
          git diff --check origin/main...HEAD
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b09-type-polish-evidence-${{ github.run_number }}
          path: /tmp/b09-polish-evidence
          if-no-files-found: error
          retention-days: 7
