name: B60 UX669 Render QA Temp

on:
  push:
    branches: [feat/b60-ux3-route-detail-669]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pw"
          npm install --prefix "${RUNNER_TEMP}/pw" playwright@1.55.0 >/dev/null
          "${RUNNER_TEMP}/pw/node_modules/.bin/playwright" install --with-deps chromium >/dev/null

      - name: Start static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory apps/portfolio-console >"${RUNNER_TEMP}/server.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ai-api/ >/dev/null && exit 0
            sleep 1
          done
          cat "${RUNNER_TEMP}/server.log"
          exit 1

      - name: Run route-detail interaction gate
        shell: bash
        env:
          PW: ${{ runner.temp }}/pw/node_modules/playwright
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ux3"
          cat > "${RUNNER_TEMP}/ux3/run.cjs" <<'NODE'
          const { chromium } = require(process.env.PW);
          const fs = require('fs');
          const path = require('path');
          const out = process.env.RUNNER_TEMP + '/ux3';
          const failures=[]; const evidence=[];
          const assert=(c,m)=>{if(!c) failures.push(m)};
          const shot=(page,name)=>page.screenshot({path:path.join(out,name),fullPage:false});

          async function exercise(viewport,prefix){
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport});
            const errors=[]; const failed=[];
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
            page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
            await page.goto('http://127.0.0.1:4173/ai-api/',{waitUntil:'networkidle'});
            await page.locator('#explore').scrollIntoViewIfNeeded();
            await page.waitForSelector('.ux3-route-detail');
            const actual=await page.evaluate(()=>({innerWidth,innerHeight,scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth}));
            assert(actual.innerWidth===viewport.width,`${prefix}: viewport mismatch ${JSON.stringify(actual)}`);
            const legacy=page.locator('.signal-drawer-v6');
            assert(await legacy.count()===1,`${prefix}: legacy drawer missing from compatibility layer`);
            assert(await legacy.evaluate(el=>el.hidden && getComputedStyle(el).display==='none'),`${prefix}: legacy drawer not hard hidden`);

            const vercel=page.locator('.access-card[data-id="vercel-glm52"]');
            await vercel.locator('h3').click();
            await page.waitForSelector('.ux3-route-detail.is-open');
            await page.waitForTimeout(320);
            assert(!(await legacy.isVisible()),`${prefix}: legacy drawer became visible`);
            assert(!(await legacy.evaluate(el=>el.classList.contains('is-open'))),`${prefix}: legacy drawer received old open event`);
            const url1=new URL(page.url());
            assert(url1.searchParams.get('route')==='vercel-glm52',`${prefix}: route query missing ${page.url()}`);
            assert([...url1.searchParams.keys()].join(',')==='route',`${prefix}: unexpected URL params ${[...url1.searchParams.keys()]}`);
            assert(url1.hash==='#explore',`${prefix}: explore hash missing`);
            const detail=page.locator('.ux3-route-panel');
            const text=await detail.innerText();
            assert(text.includes('Vercel AI Gateway'),`${prefix}: provider missing in route detail`);
            assert(text.includes('zai/glm-5.2'),`${prefix}: model missing in route detail`);
            assert(text.includes('$5 credits / 30 days'),`${prefix}: verified recurring credit missing`);
            assert(text.includes('PENDING_WEB_VERIFICATION'),`${prefix}: pending state missing`);
            assert(text.includes('Free on fx through Aug 27'),`${prefix}: pending promo label missing`);
            assert(!text.includes('VERIFIED END DATE'),`${prefix}: unverified expiry promoted to verified`);
            assert(await detail.locator('.ux3-sources a').count()>=1,`${prefix}: official source missing`);
            assert((await detail.locator('.ux3-exec').textContent()).includes('INFO ONLY'),`${prefix}: Vercel execution state must be info-only`);
            await shot(page,`${prefix}-01-vercel-route.png`);

            const save=detail.locator('.ux3-actions [data-save-id="vercel-glm52"]');
            assert((await save.getAttribute('aria-pressed'))==='false',`${prefix}: initial save state should be false in fresh context`);
            await save.click();
            await page.waitForTimeout(80);
            assert((await save.getAttribute('aria-pressed'))==='true',`${prefix}: detail save aria state not synchronized`);
            assert((await save.textContent()).trim()==='SAVED',`${prefix}: detail save label not synchronized`);
            const stored=await page.evaluate(()=>JSON.parse(localStorage.getItem('b60.ai-api.watchlist.v1')||'[]'));
            assert(stored.includes('vercel-glm52'),`${prefix}: Watch storage missing saved route`);

            const compare=detail.locator('.ux3-actions [data-compare-id="vercel-glm52"]');
            await compare.click();
            await page.waitForTimeout(80);
            assert((await page.locator('[data-compare-count]').textContent()).trim()==='1 / 3',`${prefix}: compare tray count not updated`);
            assert((await compare.getAttribute('aria-pressed'))==='true',`${prefix}: detail compare state not updated`);
            assert(await page.locator('.ux3-route-detail.is-open').count()===1,`${prefix}: compare unexpectedly closed route detail`);

            await page.locator('[data-close-route]').click();
            await page.waitForTimeout(280);
            assert(await page.locator('.ux3-route-detail.is-open').count()===0,`${prefix}: route detail did not close`);
            assert(!(new URL(page.url()).searchParams.has('route')),`${prefix}: route query not cleared`);
            await vercel.locator('h3').click();
            await page.waitForSelector('.ux3-route-detail.is-open');
            await page.waitForTimeout(280);
            const reopenedSave=page.locator('.ux3-route-panel .ux3-actions [data-save-id="vercel-glm52"]');
            assert((await reopenedSave.getAttribute('aria-pressed'))==='true' && (await reopenedSave.textContent()).trim()==='SAVED',`${prefix}: saved state lost on reopen`);

            await page.locator('.ux3-route-panel [data-provider-open="Vercel AI Gateway"]').click();
            await page.waitForTimeout(220);
            assert(await page.locator('.ux3-route-detail.is-open').count()===0,`${prefix}: provider jump did not close route detail`);
            assert(await page.locator('.ia-entity-detail').count()===1,`${prefix}: provider detail not rendered after jump`);
            assert((await page.locator('.ia-entity-hero').innerText()).includes('Vercel AI Gateway'),`${prefix}: wrong provider detail after jump`);

            await page.locator('.ia-primary [data-ia-view="discover"]').click();
            await page.waitForSelector('.access-card[data-id="openrouter-free-router"]');
            await page.locator('.access-card[data-id="openrouter-free-router"] h3').click();
            await page.waitForSelector('.ux3-route-detail.is-open');
            await page.waitForTimeout(300);
            const mapped=page.locator('.ux3-route-panel');
            const mappedText=await mapped.innerText();
            assert(mappedText.includes('openrouter/free'),`${prefix}: mapped model absent`);
            assert((await mapped.locator('.ux3-exec').textContent()).includes('ROUTER MAPPED'),`${prefix}: mapped state absent`);
            assert(await mapped.locator('[data-handoff-id="openrouter-free-router"]').count()===1,`${prefix}: mapped handoff action absent`);
            await shot(page,`${prefix}-02-openrouter-route.png`);
            await mapped.locator('[data-handoff-id="openrouter-free-router"]').click();
            await page.waitForSelector('.ux2-handoff.is-open');
            await page.waitForTimeout(320);
            const handoffText=await page.locator('.ux2-handoff-panel').innerText();
            assert(handoffText.includes('openrouter:openrouter/free'),`${prefix}: exact handoff route absent`);
            assert(handoffText.includes('NOT BOUND'),`${prefix}: unbound live target not explicit`);
            assert(await page.locator('.ux2-handoff-panel a[href^="http"]').count()===0,`${prefix}: guessed execution link present`);
            await shot(page,`${prefix}-03-handoff.png`);
            await page.locator('[data-close-handoff]').click();
            await page.waitForTimeout(280);
            await page.locator('[data-close-route]').click();

            const keyCard=page.locator('.access-card[data-id="google-gemini-free"]');
            await keyCard.focus();
            await page.keyboard.press('Enter');
            await page.waitForSelector('.ux3-route-detail.is-open');
            await page.waitForTimeout(280);
            assert(!(await legacy.isVisible()),`${prefix}: legacy drawer visible after keyboard activation`);
            await page.keyboard.press('Escape');
            await page.waitForTimeout(280);
            assert(await page.locator('.ux3-route-detail.is-open').count()===0,`${prefix}: Escape did not close route detail`);

            const deep=await browser.newPage({viewport});
            const deepErrors=[]; deep.on('console',m=>{if(m.type()==='error')deepErrors.push(m.text())});
            await deep.goto('http://127.0.0.1:4173/ai-api/?route=openrouter-free-router#explore',{waitUntil:'networkidle'});
            await deep.waitForSelector('.ux3-route-detail.is-open');
            await deep.waitForTimeout(320);
            const deepUrl=new URL(deep.url());
            assert([...deepUrl.searchParams.keys()].join(',')==='route',`${prefix}: deep-link has non-public params`);
            assert(deepUrl.searchParams.get('route')==='openrouter-free-router',`${prefix}: deep-link route mismatch`);
            const exploreTop=await deep.locator('#explore').evaluate(el=>Math.abs(el.getBoundingClientRect().top));
            assert(exploreTop<10,`${prefix}: deep-link did not land in information layer top=${exploreTop}`);
            assert((await deep.locator('.ux3-route-panel').innerText()).includes('openrouter/free'),`${prefix}: deep-link did not reopen route`);
            assert(deepErrors.length===0,`${prefix}: deep-link console errors ${deepErrors.join('|')}`);
            await shot(deep,`${prefix}-04-deeplink.png`);
            await deep.close();

            const rect=await page.locator('.ux3-route-panel').boundingBox().catch(()=>null);
            const finalMetrics=await page.evaluate(()=>({innerWidth,scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth}));
            assert(finalMetrics.scrollWidth<=finalMetrics.clientWidth+1,`${prefix}: page horizontal overflow ${JSON.stringify(finalMetrics)}`);
            assert(errors.length===0,`${prefix}: console errors ${errors.join('|')}`);
            assert(failed.length===0,`${prefix}: failed requests ${failed.join('|')}`);
            evidence.push({prefix,actual,finalMetrics,errors,failed});
            await browser.close();
          }

          (async()=>{
            await exercise({width:1440,height:1000},'desktop');
            await exercise({width:390,height:844},'mobile');
            const result={pass:failures.length===0,failures,evidence};
            fs.writeFileSync(path.join(out,'result.json'),JSON.stringify(result,null,2));
            console.log(JSON.stringify(result,null,2));
            if(failures.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node "${RUNNER_TEMP}/ux3/run.cjs"

      - name: Upload UX3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b60-ux669-render-evidence
          path: ${{ runner.temp }}/ux3
          if-no-files-found: error
