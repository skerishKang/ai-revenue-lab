name: B64 Session Secret Activation Gate

# Issue #987 — registers PADIEM_SESSION_SECRET on the b64-ai-reward-router
# worker with the SAME value as the chat product's PADIEM_CHAT_SESSION_SECRET
# (Plan A, confirmed in #5849: B64 verifies the signed padiem_session cookie
# locally and blocks revoked sessions through the liveness relay).
#
# WHY THIS SHAPE: the live Cloudflare secret value cannot be read back through
# any API (secret_text bindings are write-only), and the repo has NO stored
# source for the chat session secret (measured: `gh secret list` has no
# PADIEM_CHAT_SESSION_SECRET). Therefore the value MUST come from the
# approved secret store through the Owner/operator: they register it ONCE as
# the repo secret named below (GitHub masks secret values automatically), and
# this dispatch-only gate copies it onto the worker without printing it.
#
# OWNER STEPS BEFORE DISPATCH:
# 1. Take the chat session secret value from the approved private store.
# 2. Register it as the repository secret `PADIEM_SESSION_SECRET_SOURCE`
#    (GitHub → Settings → Secrets and variables → Actions).
# 3. Dispatch this gate with confirmation = B64_ACTIVATE_SESSION_SECRET
#    after PR merge, targeting the exact merged main SHA.
#
# DISPATCHING THIS GATE TWICE IS HARMLESS (idempotent overwrite with the same
# value), but dispatching it with a DIFFERENT value than chat's current
# secret invalidates every live B64 verification — the value must be the
# same one chat currently uses.

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact main SHA to activate from'
        required: true
      confirmation:
        description: 'Type B64_ACTIVATE_SESSION_SECRET to authorize'
        required: true

permissions:
  contents: read

concurrency:
  group: b64-session-secret-activation
  cancel-in-progress: false

env:
  B64_WORKER: b64-ai-reward-router

jobs:
  activate-secret:
    if: github.event.inputs.confirmation == 'B64_ACTIVATE_SESSION_SECRET'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_sha }}
          persist-credentials: false

      - name: Premutation exact-main and account assertions
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.inputs.target_sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.event.inputs.target_sha }}"
          test "${CLOUDFLARE_ACCOUNT_ID}" = '9be14bb7b8974e65d0afba647ab16932'
          echo 'PREMUTATION_EXACT_MAIN_SHA=PASS'
          echo 'PREMUTATION_TARGET_ACCOUNT=PASS'

      - name: Require the source secret to be present (never printed)
        shell: bash
        env:
          PADIEM_SESSION_SECRET_SOURCE: ${{ secrets.PADIEM_SESSION_SECRET_SOURCE }}
        run: |
          set -euo pipefail
          if [ -z "${PADIEM_SESSION_SECRET_SOURCE}" ]; then
            echo 'SECRET_SOURCE_MISSING=YES — register the repository secret'
            echo 'PADIEM_SESSION_SECRET_SOURCE from the approved private store first.'
            echo 'BINDING_BASELINE=NOT_UPDATED'
            exit 1
          fi
          test "${#PADIEM_SESSION_SECRET_SOURCE}" -ge 32 || {
            echo 'SECRET_SOURCE_TOO_SHORT=YES — the chat session secret is at least 32 chars'
            exit 1
          }
          echo 'SECRET_SOURCE_PRESENT=YES (value masked by GitHub, never logged)'

      - name: Register PADIEM_SESSION_SECRET on the B64 worker
        shell: bash
        env:
          PADIEM_SESSION_SECRET_SOURCE: ${{ secrets.PADIEM_SESSION_SECRET_SOURCE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # CENTRAL review fix (#5853): steps do not inherit env retroactively —
          # without the token here, wrangler would fail auth or prompt for OAuth
          # on a clean runner. Fail closed on missing credentials and pin the
          # expected Charliekant account.
          test -n "${CLOUDFLARE_API_TOKEN}" || {
            echo 'CLOUDFLARE_API_TOKEN_MISSING=YES'
            exit 1
          }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || {
            echo 'CLOUDFLARE_ACCOUNT_ID_MISSING=YES'
            exit 1
          }
          test "${CLOUDFLARE_ACCOUNT_ID}" = '9be14bb7b8974e65d0afba647ab16932' || {
            echo 'ACCOUNT_SCOPE_MISMATCH=YES - expected Charliekant'
            exit 1
          }
          printf '%s' "${PADIEM_SESSION_SECRET_SOURCE}" | npx --yes wrangler@4 secret put PADIEM_SESSION_SECRET --name "${B64_WORKER}"
          echo 'B64_SESSION_SECRET_REGISTERED=PASS'

      - name: Verify the binding exists on the live worker (type only, never the value)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          auth=( -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" )
          settings="${RUNNER_TEMP}/b64-settings.json"
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B64_WORKER}/settings" \
            -o "${settings}"
          jq -e '.success == true' "${settings}" >/dev/null
          python - "${settings}" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          bindings = {b.get('name'): b for b in payload['result'].get('bindings', [])}
          session = bindings.get('PADIEM_SESSION_SECRET')
          assert session is not None and session.get('type') == 'secret_text', \
              f'PADIEM_SESSION_SECRET missing or wrong type: {session}'
          names = sorted(bindings)
          print('LIVE_BINDINGS=' + ','.join(names))
          print('B64_SESSION_SECRET_BINDING_EXISTS=PASS (existence and type only)')
          # CENTRAL review fix (#5853): existence is NOT parity. Cloudflare
          # secret values are write-only, so equality with the chat product's
          # PADIEM_CHAT_SESSION_SECRET can only be proven by the live signed-
          # session E2E (a chat-issued cookie must verify in B64 AND a revoked
          # session must be denied). Until that passes:
          print('SECRET_MATCH_WITH_CHAT_VERIFIED=NO (requires live signed-session E2E)')
          PY
          # Binding-baseline contract (docs/operations/
          # CLOUDFLARE_CREDENTIAL_OPERATIONS.md section 8): this readback is
          # EVIDENCE for the reviewed baseline PR — printing it does not itself
          # amend .github/binding_baselines/. The baseline amendment travels
          # with the same reviewed PR per section 8 (owner decision recorded
          # first, baseline PR attached, run logged without values).
          echo 'BINDING_BASELINE=EVIDENCE_ONLY (amendment follows the section-8 reviewed-PR procedure)'
