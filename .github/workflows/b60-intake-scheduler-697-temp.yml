name: B60 Intake Scheduler 697 Temp

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  scheduler-contract:
    if: github.event.pull_request.number == 699
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRODUCT_SHA: 8e4c9a3625a1e4d2d704a3cb7a879039bdd6d063
    steps:
      - name: Checkout carrier
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact product head
        uses: actions/checkout@v4
        with:
          ref: 8e4c9a3625a1e4d2d704a3cb7a879039bdd6d063
          path: product
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate permanent workflow safety contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "${PRODUCT_SHA}"
          f=product/.github/workflows/b60-official-source-intake.yml
          test -f "$f"
          grep -F "cron: '17 0 * * *'" "$f"
          grep -F 'workflow_dispatch:' "$f"
          grep -F 'contents: read' "$f"
          grep -F 'cancel-in-progress: false' "$f"
          grep -F 'retention-days: 14' "$f"
          ! grep -E 'contents: write|pull-requests: write|issues: write|deploy|wrangler|snapshots\.js|git push' "$f"
          echo 'WORKFLOW_SAFETY_CONTRACT=PASS'

      - name: Run deterministic collector and scheduler contract tests
        working-directory: product/reference/business-60-ai-api-v1
        run: >-
          node --test
          collector/intake-core.test.cjs
          collector/review-promotion.test.cjs
          collector/audit-intake-output.test.cjs

      - name: Run live read-only official-source intake
        working-directory: product/reference/business-60-ai-api-v1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/b60-intake-697"
          node collector/run-intake.cjs \
            --out "${RUNNER_TEMP}/b60-intake-697/candidates.json"

      - name: Audit live result as review-only
        working-directory: product/reference/business-60-ai-api-v1
        shell: bash
        run: |
          set -euo pipefail
          node collector/audit-intake-output.cjs \
            --input "${RUNNER_TEMP}/b60-intake-697/candidates.json" \
            --summary "${RUNNER_TEMP}/b60-intake-697/summary.md" \
            --sha "${PRODUCT_SHA}"
          cat "${RUNNER_TEMP}/b60-intake-697/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          grep -F 'Publication authority: `REVIEW_REQUIRED`' "${RUNNER_TEMP}/b60-intake-697/summary.md"
          grep -F 'AUTO_APPROVAL=0' "${RUNNER_TEMP}/b60-intake-697/summary.md"
          echo 'LIVE_REVIEW_ONLY_CONTRACT=PASS'

      - name: Upload QA review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: b60-intake-697-qa-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/b60-intake-697/candidates.json
            ${{ runner.temp }}/b60-intake-697/summary.md
          if-no-files-found: error
          retention-days: 7
