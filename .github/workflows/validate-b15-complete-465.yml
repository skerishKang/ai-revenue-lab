name: Validate B15 Complete 465
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'reference/business-15-global-ai-newsroom-v1/**'
      - '.github/workflows/validate-b15-complete-465.yml'
permissions:
  contents: read
jobs:
  validate:
    if: github.event.pull_request.head.ref == 'feat/b15-global-ai-newsroom-complete-465'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static contract
        shell: bash
        run: |
          set -euo pipefail
          node --check reference/business-15-global-ai-newsroom-v1/scripts/review-state.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          base=Path('reference/business-15-global-ai-newsroom-v1')
          for name in ('index.html','ux.html','guide.html'):
              HTMLParser().feed((base/name).read_text(encoding='utf-8'))
          index=(base/'index.html').read_text(encoding='utf-8')
          ux=(base/'ux.html').read_text(encoding='utf-8')
          guide=(base/'guide.html').read_text(encoding='utf-8')
          js=(base/'scripts/review-state.js').read_text(encoding='utf-8')
          for marker in ('Verification Atlas','data-state-target="global"','data-state-target="signals"','data-state-target="verification"','HUMAN REVIEWED'):
              assert marker in index, marker
          for marker in ('data-view="desk"','data-view="sources"','data-view="claims"','data-view="brief"','id="compareBtn"','id="finish"','checked.size<2'):
              assert marker in ux, marker
          for marker in ('Guide · 30 seconds','DESK · 오늘의 데스크','SOURCES · 출처 확인','COMPARE · 주장 비교','BRIEF · 내 브리핑','REVIEW · 검토 완료','./ux.html#desk'):
              assert marker in guide, marker
          assert './guide.html' in js and 'dataset.firstUseGuide' in js
          for forbidden in ('fetch(', 'XMLHttpRequest', 'localStorage', 'document.cookie', 'serviceWorker'):
              assert forbidden not in ux+'\n'+guide+'\n'+js, forbidden
          for html in ('index.html','guide.html'):
              text=(base/html).read_text(encoding='utf-8')
              for rel in re.findall(r'(?:href|src)="(\./[^"?#]+)', text):
                  assert (base/rel[2:]).exists(), (html, rel)
          print('B15_STATIC_CONTRACT_PASS=1')
          PY
          git diff --check origin/main...HEAD -- 'reference/business-15-global-ai-newsroom-v1/**'
      - name: Install Chromium smoke harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b15-browser && cd /tmp/b15-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.54.1
          npx playwright install chromium
      - name: Browser journey desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory reference/business-15-global-ai-newsroom-v1 >/tmp/b15-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 0.5; done
          cd /tmp/b15-browser
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for (const vp of [{width:1440,height:1100,name:'desktop'},{width:390,height:844,name:'mobile'}]) {
              const page=await browser.newPage({viewport:{width:vp.width,height:vp.height}});
              const errors=[];
              page.on('console',m=>{ if(m.type()==='error') errors.push(`console:${m.text()}`); });
              page.on('pageerror',e=>errors.push(`page:${e.message}`));
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
              await page.locator('[data-first-use-guide]').waitFor({state:'visible'});
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth);
              if(overflow) throw new Error(`${vp.name}: index horizontal overflow`);
              await page.locator('[data-first-use-guide]').click();
              await page.waitForURL(/guide\.html/);
              const guideOverflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth);
              if(guideOverflow) throw new Error(`${vp.name}: guide horizontal overflow`);
              await page.getByRole('link',{name:'브리핑 체험 시작'}).click();
              await page.waitForURL(/ux\.html#desk/);
              await page.locator('[data-go="sources"]').click();
              const sourceButtons=page.locator('[data-check]');
              await sourceButtons.nth(0).click();
              await sourceButtons.nth(1).click();
              await page.locator('#compareBtn').click();
              if(!(await page.locator('#claims').evaluate(el=>el.classList.contains('active')))) throw new Error(`${vp.name}: claims did not open`);
              await page.locator('[data-go="brief"]').click();
              await page.locator('#finish').click();
              const status=await page.locator('#finishStatus').textContent();
              if(!status || !status.includes('검토 완료')) throw new Error(`${vp.name}: finish status missing`);
              const uxOverflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth);
              if(uxOverflow) throw new Error(`${vp.name}: ux horizontal overflow`);
              if(errors.length) throw new Error(`${vp.name}: ${errors.join(' | ')}`);
              await page.close();
            }
            await browser.close();
            console.log('B15_BROWSER_JOURNEY_PASS=1');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
