name: Prepare B9 Complete 465
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/prepare-b9-complete-465.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'ops/deploy-b1-b2-guides-465'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_MAIN: 03db134d61f054f53b096104e83ba1342337ae9e
      B9_AUTHORITY: 26bdf6e5c8d44921cecedafa3a8568ceb81ebf72
      TARGET_BRANCH: feat/b9-personalized-childrens-story-complete-465
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - name: Materialize approved B9 UI plus validated UX
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          git fetch origin "$B9_AUTHORITY"
          git switch -c "$TARGET_BRANCH"
          git checkout "$B9_AUTHORITY" -- reference/business-09-personalized-childrens-story-v1
          changed=$(git status --short | awk '{print $2}')
          test -n "$changed"
          if echo "$changed" | grep -Ev '^reference/business-09-personalized-childrens-story-v1/' ; then exit 1; fi
          test -f reference/business-09-personalized-childrens-story-v1/index.html
          test -f reference/business-09-personalized-childrens-story-v1/ux.html
          grep -q 'Story Bloom\|STORY BLOOM\|이야기' reference/business-09-personalized-childrens-story-v1/index.html
          grep -q '선택\|choice\|Choice' reference/business-09-personalized-childrens-story-v1/ux.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reference/business-09-personalized-childrens-story-v1
          git commit -m 'feat(b9): integrate approved storybook UI and branching UX'
          git push --force-with-lease origin "$TARGET_BRANCH"
          echo "B9_PREPARED_HEAD=$(git rev-parse HEAD)"
