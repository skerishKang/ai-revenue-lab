name: B62 Claw D1 Migration 054 Gate

# #5015: the merged B62 selection restore reads and writes
# ``claw_pc_device_selection``. This gate proves the canonical live private D1
# carries exactly that additive table before the dependent B62 code is
# uploaded, and can create ONLY that table under a separate owner-authorized
# dispatch. It never deploys a Worker, never mutates a binding, never applies
# another migration and never reads row data.

on:
  pull_request:
    paths:
      - ".github/workflows/b62-claw-d1-migration-054-gate.yml"
      - ".github/scripts/b62_d1_migration_054_schema.py"
      - ".github/tests/test_b62_d1_migration_054_gate.py"
      - "apps/padiem-chat/migrations/054_claw_pc_device_selection.sql"
  workflow_dispatch:
    inputs:
      mode:
        description: "Migration 054 gate mode"
        required: true
        type: choice
        default: repository_preflight
        options:
          - repository_preflight
          - cloudflare_readonly
          - apply_migration_054
      target_sha:
        description: "Exact current main SHA"
        required: true
        type: string
      confirmation:
        description: "Exact mutation confirmation phrase"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: b62-claw-d1-migration-054-gate
  cancel-in-progress: false

env:
  B62_WORKER: padiem-chat
  D1_BINDING: PADIEM_CHAT_DB
  TARGET_SHA: ${{ inputs.target_sha }}

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR exact head
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact dispatch SHA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact current main for dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'PREMUTATION_EXACT_MAIN_SHA=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run migration gate contract tests
        run: |
          python -m pip install --disable-pip-version-check --quiet pytest
          python -m pytest .github/tests/test_b62_d1_migration_054_gate.py -q

      - name: Source-only evidence
        run: |
          echo 'B62_D1_MIGRATION_054_SOURCE_CONTRACT=PASS'
          echo 'PRODUCTION_MUTATION=0'

  cloudflare-readonly:
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'repository_preflight' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      schema_state: ${{ steps.schema.outputs.schema_state }}
      db_fingerprint: ${{ steps.binding.outputs.db_fingerprint }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconfirm exact main before live readback
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'READONLY_EXACT_MAIN_SHA=PASS'

      - name: Resolve live PADIEM_CHAT_DB binding without emitting identifiers
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          settings="${RUNNER_TEMP}/b62-settings-d1-054.json"
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" \
            -o "${settings}"
          DB_ID="$(python - "${settings}" "${D1_BINDING}" <<'PY'
          import json, re, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          if payload.get('success') is not True:
              raise SystemExit('worker settings read failed')
          bindings = payload.get('result', {}).get('bindings', [])
          hits = [b for b in bindings if b.get('type') == 'd1' and b.get('name') == sys.argv[2]]
          if len(hits) != 1:
              raise SystemExit('expected exactly one live PADIEM_CHAT_DB binding')
          database_id = hits[0].get('id')
          if not isinstance(database_id, str) or not re.fullmatch(r'[0-9a-fA-F-]{32,36}', database_id):
              raise SystemExit('live PADIEM_CHAT_DB binding has invalid database id')
          print(database_id)
          PY
          )"
          test -n "${DB_ID}"
          echo "::add-mask::${DB_ID}"
          echo "DB_ID=${DB_ID}" >> "${GITHUB_ENV}"
          fingerprint="$(printf %s "${DB_ID}" | sha256sum | cut -d' ' -f1)"
          test -n "${fingerprint}"
          echo "db_fingerprint=${fingerprint}" >> "${GITHUB_OUTPUT}"
          echo 'LIVE_PADIEM_CHAT_DB_DERIVED=PASS'
          echo 'D1_IDENTIFIER_OUTPUT=0'

      - name: Read only migration 054 schema
        id: schema
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          query="${RUNNER_TEMP}/b62-d1-054-schema-query.json"
          response="${RUNNER_TEMP}/b62-d1-054-schema-before.json"
          python3 .github/scripts/b62_d1_migration_054_schema.py query "${query}"
          curl -fsS -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${query}" -o "${response}"
          evidence="$(python3 .github/scripts/b62_d1_migration_054_schema.py classify "${response}")"
          echo "${evidence}"
          state="$(printf '%s\n' "${evidence}" | sed -n 's/^B62_D1_MIGRATION_054_SCHEMA=//p' | tr '[:upper:]' '[:lower:]')"
          case "${state}" in missing|exact|drift) ;; *) echo 'invalid schema classifier state' >&2; exit 1;; esac
          echo "schema_state=${state}" >> "${GITHUB_OUTPUT}"
          echo 'D1_SCHEMA_QUERY=READ_ONLY'
          echo 'ROW_DATA_READ=0'
          echo 'PRODUCTION_MUTATION=0'

      - name: Read only D1 Time Travel recovery availability
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          response="${RUNNER_TEMP}/b62-d1-054-time-travel-readonly.json"
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/time_travel/bookmark" \
            -o "${response}"
          python - "${response}" <<'PY'
          import json, re, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          result = payload.get('result') if payload.get('success') is True else None
          mark = result.get('bookmark') if isinstance(result, dict) else None
          if not isinstance(mark, str) or re.fullmatch(r'[A-Za-z0-9_-]{12,130}', mark) is None:
              raise SystemExit('D1_RECOVERY_BOOKMARK_UNAVAILABLE')
          print('D1_RECOVERY_AVAILABLE=PASS')
          PY
          echo 'D1_RECOVERY_BOOKMARK_PRESENT=PASS'
          echo 'D1_SCHEMA_QUERY=READ_ONLY'
          echo 'D1_IDENTIFIER_OUTPUT=0'
          echo 'PRODUCTION_MUTATION=0'

  apply-migration-054:
    needs: [source-contract, cloudflare-readonly]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply_migration_054' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRMATION: ${{ inputs.confirmation }}
      READONLY_SCHEMA_STATE: ${{ needs.cloudflare-readonly.outputs.schema_state }}
      READONLY_DB_FINGERPRINT: ${{ needs.cloudflare-readonly.outputs.db_fingerprint }}
    steps:
      - name: Require explicit migration authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${CONFIRMATION}" = "APPLY_B62_CLAW_D1_MIGRATION_054_FROM_EXACT_MAIN"
          case "${READONLY_SCHEMA_STATE}" in
            missing|exact) ;;
            drift)
              echo 'Refusing mutation: the existing selection table is structurally different.' >&2
              exit 1
              ;;
            *)
              echo 'Refusing mutation: no trustworthy readonly schema disposition.' >&2
              exit 1
              ;;
          esac
          echo 'B62_D1_MIGRATION_054_AUTHORIZATION=PASS'

      - name: Checkout exact approved main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconfirm exact main immediately before mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'PREMUTATION_EXACT_MAIN_SHA=PASS'

      - name: Re-resolve the live D1 binding immediately before mutation
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          settings="${RUNNER_TEMP}/b62-settings-d1-054-premutation.json"
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" \
            -o "${settings}"
          DB_ID="$(python - "${settings}" "${D1_BINDING}" <<'PY'
          import json, re, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          bindings = payload.get('result', {}).get('bindings', []) if payload.get('success') is True else []
          hits = [b for b in bindings if b.get('type') == 'd1' and b.get('name') == sys.argv[2]]
          if len(hits) != 1:
              raise SystemExit('expected exactly one live PADIEM_CHAT_DB binding')
          database_id = hits[0].get('id')
          if not isinstance(database_id, str) or not re.fullmatch(r'[0-9a-fA-F-]{32,36}', database_id):
              raise SystemExit('live PADIEM_CHAT_DB binding has invalid database id')
          print(database_id)
          PY
          )"
          test -n "${DB_ID}"
          echo "::add-mask::${DB_ID}"
          echo "DB_ID=${DB_ID}" >> "${GITHUB_ENV}"
          fingerprint="$(printf %s "${DB_ID}" | sha256sum | cut -d' ' -f1)"
          test -n "${READONLY_DB_FINGERPRINT}"
          if [ "${fingerprint}" != "${READONLY_DB_FINGERPRINT}" ]; then
            echo 'D1_BINDING_CHANGED_AFTER_READONLY=STOP' >&2
            exit 1
          fi
          echo 'D1_BINDING_IDENTITY_STABLE=PASS'

      - name: Recheck identical schema immediately before SQL mutation
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          query="${RUNNER_TEMP}/b62-d1-054-schema-premutation-query.json"
          response="${RUNNER_TEMP}/b62-d1-054-schema-premutation.json"
          python3 .github/scripts/b62_d1_migration_054_schema.py query "${query}"
          curl -fsS -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${query}" -o "${response}"
          evidence="$(python3 .github/scripts/b62_d1_migration_054_schema.py classify "${response}")"
          echo "${evidence}"
          state="$(printf '%s\n' "${evidence}" | sed -n 's/^B62_D1_MIGRATION_054_SCHEMA=//p' | tr '[:upper:]' '[:lower:]')"
          case "${state}" in missing|exact) ;; *)
            echo 'Refusing mutation: schema changed after readonly proof.' >&2
            exit 1
            ;;
          esac

      - name: Apply exactly migration 054 once
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          apply="${RUNNER_TEMP}/b62-d1-054-apply.json"
          response="${RUNNER_TEMP}/b62-d1-054-apply-response.json"
          python3 .github/scripts/b62_d1_migration_054_schema.py apply "${apply}"
          curl -fsS -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${apply}" -o "${response}"
          python3 .github/scripts/b62_d1_migration_054_schema.py check-apply "${response}"

      - name: Post-apply exact schema readback
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          query="${RUNNER_TEMP}/b62-d1-054-post-query.json"
          response="${RUNNER_TEMP}/b62-d1-054-post.json"
          python3 .github/scripts/b62_d1_migration_054_schema.py query "${query}"
          curl -fsS -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${query}" -o "${response}"
          python3 .github/scripts/b62_d1_migration_054_schema.py classify "${response}" \
            | tee "${RUNNER_TEMP}/b62-d1-054-post-verdict.txt"
          grep -qx 'B62_D1_MIGRATION_054_SCHEMA=EXACT' "${RUNNER_TEMP}/b62-d1-054-post-verdict.txt"
          echo 'B62_D1_MIGRATION_054_POST_APPLY=EXACT'
          echo 'ROW_DATA_READ=0'
          echo 'D1_IDENTIFIER_OUTPUT=0'
