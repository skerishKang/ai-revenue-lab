name: Validate COM2 boot recovery
on:
  pull_request:
    paths:
      - 'deploy/host-com2/boot-recovery/**'
      - '.github/workflows/validate-boot-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-boot-recovery-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  boot-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verdict units (normal, inactive, health, tunnel)
        run: python -m unittest deploy/host-com2/boot-recovery/tests/test_boot_recovery.py -q
      - name: Packaging (dry-run gates, unit order, notifier names)
        run: python -m unittest deploy/host-com2/boot-recovery/tests/test_packaging.py -q
