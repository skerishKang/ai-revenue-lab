name: B66 Space Bunny Image Canary

# #3212 — one-shot live capability proof for the exact B66 Space Bunny image
# route. Pull requests run source tests only. A live provider call is impossible
# unless a human explicitly dispatches this workflow with exact current main,
# exact currently-served B14 version, and the confirmation marker.

on:
  pull_request:
    paths:
      - '.github/scripts/b66_space_bunny_image_canary.py'
      - '.github/tests/test_b66_space_bunny_image_canary.py'
      - '.github/workflows/b66-space-bunny-image-canary.yml'
      - 'packages/padiem-ai-core/tests/fixtures/b66_e2e_corpus/f02-scanned-quotation.png'
      - 'packages/padiem-ai-core/tests/fixtures/b66_e2e_corpus/manifest.json'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact current main SHA authorized for this one-shot B66 image canary'
        required: true
      expected_b14_version:
        description: 'Exact B14 Worker version currently serving 100%'
        required: true
      confirmation:
        description: 'Type RUN_B66_SPACE_BUNNY_IMAGE_CANARY_ONCE'
        required: true

permissions:
  contents: read

concurrency:
  group: b66-space-bunny-image-canary
  cancel-in-progress: false

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_sha || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Exact-main dispatch preflight
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.inputs.target_sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.event.inputs.target_sha }}"
          echo 'PREFLIGHT_EXACT_MAIN=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run B66 image canary source tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest
          python -m pytest -q .github/tests/test_b66_space_bunny_image_canary.py

      - name: Pin one-shot safety locks
        shell: bash
        run: |
          set -euo pipefail
          script=.github/scripts/b66_space_bunny_image_canary.py
          grep -Fq 'MODEL_ID = "kilo/stealth-space-bunny-alpha"' "$script"
          grep -Fq 'MAX_PROVIDER_CALLS = 1' "$script"
          grep -Fq 'RETRY = 0' "$script"
          grep -Fq 'FALLBACK = 0' "$script"
          grep -Fq 'allow_external_fallback": False' "$script"
          grep -Fq '"max_attempts": 1' "$script"
          grep -Fq 'DEFAULT_LIVE_EXECUTION=BLOCKED' "$script"
          grep -Fq 'RAW_RESPONSE_CONTENT_OUTPUT=0' "$script"
          grep -Fq 'PRIVATE_PAYLOAD_OUTPUT=0' "$script"
          grep -Fq 'SECRET_VALUE_OUTPUT=0' "$script"
          echo 'B66_IMAGE_CANARY_SOURCE_CONTRACT=PASS'

  live-image-canary:
    needs: source-contract
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirmation == 'RUN_B66_SPACE_BUNNY_IMAGE_CANARY_ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_SHA: ${{ github.event.inputs.target_sha }}
      EXPECTED_B14_VERSION: ${{ github.event.inputs.expected_b14_version }}
    steps:
      - name: Checkout exact authorized main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_sha }}
          persist-credentials: false

      - name: Re-check exact current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          echo 'LIVE_EXACT_MAIN=PASS'

      - name: GET-only B14 served-version guard
        shell: bash
        run: |
          set -euo pipefail
          echo "$EXPECTED_B14_VERSION" | grep -Eq '^[A-Za-z0-9._-]{1,64}$'
          deployments="${RUNNER_TEMP}/b14-deployments.json"
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/ai-revenue-korean-ai-platform/deployments" \
            -o "$deployments"
          python3 - "$deployments" "$EXPECTED_B14_VERSION" <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path(".github/scripts").resolve()))
          from cloudflare_served_version import resolve_served_version_id

          path, expected = sys.argv[1:3]
          with open(path, encoding="utf-8") as fh:
              payload = json.load(fh)
          served = resolve_served_version_id(payload)
          if served != expected:
              raise SystemExit("active served B14 version does not match expected version")
          print("CANONICAL_SERVED_VERSION_REUSED=YES")
          print("HISTORICAL_DEPLOYMENT_ACCEPTED=NO")
          print("B14_EXPECTED_VERSION_AT_100=PASS")
          PY

      - name: Execute exactly one synthetic F02 image canary
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/b66-space-bunny-image-canary.log"
          python .github/scripts/b66_space_bunny_image_canary.py --authorized-live-run | tee "$log"
          grep -qx 'B66_SPACE_BUNNY_IMAGE_CANARY=PASS' "$log"
          grep -qx 'EXACT_MODEL_ROUTE=PASS' "$log"
          grep -qx 'IMAGE_CAPABILITY=PASS' "$log"
          grep -qx 'ACTUAL_RESPONSE_MODEL_EVIDENCE=PASS' "$log"
          grep -qx 'FALLBACK_USED=NO' "$log"
          grep -qx 'ATTEMPT_COUNT=1' "$log"
          grep -qx 'F02_VISUAL_FACTS=PASS' "$log"
          grep -qx 'B14_CHAT_POST_COUNT=1' "$log"
          grep -qx 'NETWORK_RETRY_COUNT=0' "$log"
          grep -qx 'MAX_PROVIDER_CALLS=1' "$log"
          grep -qx 'RETRY=0' "$log"
          grep -qx 'FALLBACK=0' "$log"
          grep -qx 'RAW_RESPONSE_CONTENT_OUTPUT=0' "$log"
          grep -qx 'PRIVATE_PAYLOAD_OUTPUT=0' "$log"
          grep -qx 'SECRET_VALUE_OUTPUT=0' "$log"
          grep -qx 'PRODUCTION_MUTATION=0' "$log"

      - name: Record immutable non-mutation locks
        if: always()
        shell: bash
        run: |
          echo 'WORKFLOW_INTERNAL_RERUN=0'
          echo 'B14_DEPLOY=0'
          echo 'ENGINE_DEPLOY=0'
          echo 'SECRET_MUTATION=0'
          echo 'SECRET_VALUE_OUTPUT=0'
          echo 'D1_MUTATION=0'
          echo 'ROUTING_MUTATION=0'
          echo 'PRODUCT_TIER_MUTATION=0'
          echo 'PRODUCTION_MUTATION=0'
