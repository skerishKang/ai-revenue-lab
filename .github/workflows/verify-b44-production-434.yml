name: Verify B44 Production 434

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: [.github/workflows/verify-b44-production-434.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: 07ab5fddd59e886f530fe39c441c372c34c14d8c
      PROJECT: ai-revenue-portfolio-console
      PRODUCTION_URL: https://ai-revenue-portfolio-console.pages.dev/
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Capture Cloudflare project and deployment state
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT_ID"
          test -n "$CF_API_TOKEN"
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json")
          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PROJECT}"
          curl --fail-with-body -sS "${auth[@]}" "$base" > /tmp/project.json
          curl --fail-with-body -sS "${auth[@]}" "$base/deployments" > /tmp/deployments.json
          python3 - <<'PY' > /tmp/state.env
          import json, shlex
          p=json.load(open('/tmp/project.json', encoding='utf-8')).get('result') or {}
          data=json.load(open('/tmp/deployments.json', encoding='utf-8'))
          rows=[x for x in (data.get('result') or []) if x.get('environment')=='production']
          rows.sort(key=lambda x: x.get('created_on') or '', reverse=True)
          d=rows[0] if rows else {}
          trig=d.get('deployment_trigger') or {}; meta=trig.get('metadata') or {}; stage=d.get('latest_stage') or {}
          src=p.get('source') or {}; cfg=src.get('config') or {}; build=p.get('build_config') or {}
          vals={
            'DEPLOYMENT_ID': d.get('id') or '', 'DEPLOYMENT_URL': d.get('url') or '',
            'CREATED_ON': d.get('created_on') or '', 'MODIFIED_ON': d.get('modified_on') or '',
            'SOURCE_SHA': meta.get('commit_hash') or meta.get('commit') or d.get('source_commit_hash') or '',
            'SOURCE_BRANCH': meta.get('branch') or '', 'STAGE_NAME': stage.get('name') or '', 'STAGE_STATUS': stage.get('status') or '',
            'PRODUCTION_BRANCH': cfg.get('production_branch') or '',
            'PRODUCTION_DEPLOYS_ENABLED': cfg.get('production_deployments_enabled'),
            'REPO_NAME': cfg.get('repo_name') or '', 'SOURCE_TYPE': src.get('type') or '',
            'ROOT_DIR': build.get('root_dir') or '', 'DESTINATION_DIR': build.get('destination_dir') or '',
          }
          for k,v in vals.items(): print(k+'='+shlex.quote(str(v)))
          print('STAGES='+shlex.quote(','.join(f"{s.get('name')}:{s.get('status')}" for s in (d.get('stages') or []))))
          PY
          source /tmp/state.env
          echo "project=$PROJECT source_type=$SOURCE_TYPE repo=$REPO_NAME production_branch=$PRODUCTION_BRANCH production_deploys_enabled=$PRODUCTION_DEPLOYS_ENABLED root_dir=$ROOT_DIR destination_dir=$DESTINATION_DIR"
          echo "deployment_id=$DEPLOYMENT_ID created_on=$CREATED_ON modified_on=$MODIFIED_ON source_sha=$SOURCE_SHA source_branch=$SOURCE_BRANCH latest_stage=$STAGE_NAME/$STAGE_STATUS stages=$STAGES"
          [[ "$SOURCE_SHA" == "$EXPECTED_SHA" ]]
          echo "B44_AUTOMATIC_DEPLOYMENT_TRIGGER_VERIFIED=1"
          curl --fail-with-body -sS "${auth[@]}" "$base/deployments/$DEPLOYMENT_ID" > /tmp/deployment.json
          curl -sS "${auth[@]}" "$base/deployments/$DEPLOYMENT_ID/history/logs" > /tmp/history.json || true
          python3 - <<'PY'
          import json
          try:
              h=json.load(open('/tmp/history.json', encoding='utf-8'))
          except Exception:
              print('history_logs=unavailable'); raise SystemExit
          r=h.get('result') or {}
          lines=r.get('data') if isinstance(r,dict) else []
          print('history_log_lines='+str(len(lines or [])))
          if lines:
              for item in lines[-8:]:
                  line=str(item.get('line') or '').replace('\n',' ')[:500]
                  print('build_log_tail='+line)
          PY

      - name: Verify anonymous Production boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 20 -o /tmp/root.html -D /tmp/root.headers -w '%{http_code}' "$PRODUCTION_URL" || true)
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,""); print substr($0,index($0,":")+2); exit}' /tmp/root.headers || true)
          echo "production_http=$code"
          if [[ "$code" == "200" ]]; then
            grep -q 'Portfolio Console' /tmp/root.html
            echo "B44_ANONYMOUS_BOUNDARY=PUBLIC_200_CONTENT_PRESENT"
          elif [[ "$code" =~ ^30[12378]$ ]]; then
            python3 - "$location" <<'PY'
          import sys, urllib.parse
          print('redirect_host='+str(urllib.parse.urlsplit(sys.argv[1]).hostname or ''))
          PY
            echo "B44_ANONYMOUS_BOUNDARY=REDIRECT_PROTECTED"
          else
            echo "B44_ANONYMOUS_BOUNDARY=UNEXPECTED_$code"
            exit 1
          fi
