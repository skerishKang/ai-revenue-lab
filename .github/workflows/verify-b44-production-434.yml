name: Verify B44 Production 434

on:
  push:
    branches:
      - ops/verify-b44-production-434
    paths:
      - .github/workflows/verify-b44-production-434.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_SHA: 07ab5fddd59e886f530fe39c441c372c34c14d8c
      PROJECT: ai-revenue-portfolio-console
      PRODUCTION_URL: https://ai-revenue-portfolio-console.pages.dev/
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify Cloudflare Production deployment source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT_ID"
          test -n "$CF_API_TOKEN"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PROJECT}/deployments"
          matched=0
          for attempt in $(seq 1 12); do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "$endpoint" > /tmp/deployments.json
            python3 - <<'PY' > /tmp/state.env
          import json, os, shlex
          data=json.load(open('/tmp/deployments.json', encoding='utf-8'))
          if not data.get('success'):
              raise SystemExit('Cloudflare API success=false')
          rows=[x for x in (data.get('result') or []) if x.get('environment')=='production']
          rows.sort(key=lambda x: x.get('created_on') or '', reverse=True)
          if not rows:
              raise SystemExit('No production deployment found')
          d=rows[0]
          trig=d.get('deployment_trigger') or {}
          meta=trig.get('metadata') or {}
          stage=d.get('latest_stage') or {}
          sha=meta.get('commit_hash') or meta.get('commit') or d.get('source_commit_hash') or ''
          branch=meta.get('branch') or ''
          status=stage.get('status') or d.get('status') or ''
          print('DEPLOYMENT_ID='+shlex.quote(str(d.get('id') or '')))
          print('DEPLOYMENT_URL='+shlex.quote(str(d.get('url') or '')))
          print('CREATED_ON='+shlex.quote(str(d.get('created_on') or '')))
          print('SOURCE_SHA='+shlex.quote(str(sha)))
          print('SOURCE_BRANCH='+shlex.quote(str(branch)))
          print('STAGE_NAME='+shlex.quote(str(stage.get('name') or '')))
          print('STAGE_STATUS='+shlex.quote(str(status)))
          PY
            source /tmp/state.env
            echo "attempt=$attempt environment=production stage=${STAGE_NAME:-unknown}/${STAGE_STATUS:-unknown} branch=${SOURCE_BRANCH:-unknown} source_sha=${SOURCE_SHA:-unknown} deployment_id=${DEPLOYMENT_ID:-unknown} created_on=${CREATED_ON:-unknown}"
            if [[ "$SOURCE_SHA" == "$EXPECTED_SHA" && "$STAGE_STATUS" == "success" ]]; then
              matched=1
              break
            fi
            sleep 15
          done
          if [[ "$matched" != 1 ]]; then
            echo "Expected successful Production deployment for $EXPECTED_SHA was not observed." >&2
            exit 1
          fi
          echo "B44_PRODUCTION_SOURCE_VERIFIED sha=$SOURCE_SHA deployment_id=$DEPLOYMENT_ID"

      - name: Verify anonymous Production boundary
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 20 --output /tmp/root.html --dump-header /tmp/root.headers --write-out '%{http_code}' "$PRODUCTION_URL" || true)
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,""); print substr($0,index($0,":")+2); exit}' /tmp/root.headers || true)
          echo "production_http=$code"
          if [[ "$code" == "200" ]]; then
            grep -q 'Portfolio Console' /tmp/root.html
            grep -q 'business-launcher' /tmp/root.html || true
            echo "B44_ANONYMOUS_BOUNDARY=PUBLIC_200_CONTENT_PRESENT"
          elif [[ "$code" =~ ^30[12378]$ ]]; then
            echo "redirect_host=$(python3 - "$location" <<'PY'
          import sys, urllib.parse
          print(urllib.parse.urlsplit(sys.argv[1]).hostname or '')
          PY
          )"
            echo "B44_ANONYMOUS_BOUNDARY=REDIRECT_PROTECTED"
          else
            echo "Unexpected Production HTTP status: $code" >&2
            exit 1
          fi
