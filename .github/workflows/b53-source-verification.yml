name: B53 Source Verification

on:
  pull_request:
    paths:
      - 'reference/business-53-embedded-ai-sdk-v1/**'
      - '.github/workflows/b53-source-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-b53-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect B53 source
        id: source
        shell: bash
        run: |
          if [ -d reference/business-53-embedded-ai-sdk-v1 ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'B53 source is absent; this is a workflow-only validation run.'
          fi

      - name: Static source contracts
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          python reference/business-53-embedded-ai-sdk-v1/tests/validate_reference.py
          node --check reference/business-53-embedded-ai-sdk-v1/scripts/review.js

      - name: Install browser harness
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          BROWSER_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          p = sync_playwright().start()
          print(p.chromium.executable_path)
          p.stop()
          PY
          )"
          sudo ln -sf "$BROWSER_PATH" /usr/bin/chromium
          /usr/bin/chromium --version

      - name: Browser exact-head self-check
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          python reference/business-53-embedded-ai-sdk-v1/tests/browser_self_check.py

      - name: Evidence summary
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('reference/business-53-embedded-ai-sdk-v1/evidence')
          static = json.loads((root / 'static-self-check.json').read_text(encoding='utf-8'))
          browser = json.loads((root / 'browser-self-check.json').read_text(encoding='utf-8'))

          assert static['status'] == 'PASS', static
          assert all(static['checks'].values()), static
          assert browser['status'] == 'PASS', browser
          assert browser['combinations'] == 21, browser
          assert browser['failures'] == [], browser
          assert browser['http_all_200_nonempty'] is True, browser
          assert browser['console_errors'] == [], browser
          assert browser['page_errors'] == [], browser
          assert browser['external_runtime_requests'] == [], browser
          assert all(browser['keyboard'].values()), browser
          motion = browser['motion']
          assert motion['animation_name'] == 'integrationSpecComplete', browser
          assert 700 <= motion['computed_end_ms'] <= 800, browser
          assert motion['actual_final_animationend'] is True, browser
          assert motion['replay_equal'] is True, browser
          assert motion['focus_stable'] is True, browser
          assert motion['scroll_stable'] is True, browser
          assert motion['geometry_stable'] is True, browser
          reduced = browser['reduced_motion']
          assert reduced['state'] == 'complete', browser
          assert reduced['visible'] is True, browser
          assert reduced['persistent'] is True, browser
          mobile = browser['mobile']
          assert mobile['required'] is True, browser
          assert mobile['left'] >= -0.5, browser
          assert mobile['right'] <= 390.5, browser

          print('B53_EXACT_HEAD_SOURCE_VERIFICATION_PASS')
          print('static=', static['status'])
          print('browser=', browser['status'])
          print('matrix=', browser['combinations'])
          PY
