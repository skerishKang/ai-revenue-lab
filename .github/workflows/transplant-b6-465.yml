name: Transplant B6 UX 465

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/transplant-b6-465.yml'

permissions:
  contents: write

jobs:
  transplant:
    if: github.event.pull_request.head.ref == 'ops/transplant-b6-465'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_MAIN: 7bc81e7a5a21d772449a4f94466fd88f855f0c4d
      OLD_BASE: 48807067a261d8f1ca3814b4b26758dd6947788a
      OLD_HEAD: fbfd7e47c319d4493bc25f0c18b3961bf5fd3122
      TARGET_BRANCH: feat/b6-world-feed-complete-465
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Transplant validated World Feed UX onto current main
        shell: bash
        run: |
          set -euo pipefail
          remote_main=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "remote_main=$remote_main"
          test "$remote_main" = "$EXPECTED_MAIN"
          git fetch origin "$OLD_HEAD" "$OLD_BASE"
          git checkout -B "$TARGET_BRANCH" "$EXPECTED_MAIN"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mapfile -t commits < <(git rev-list --reverse "$OLD_BASE..$OLD_HEAD")
          printf 'transplant_commits=%s\n' "${#commits[@]}"
          test "${#commits[@]}" = 3
          for commit in "${commits[@]}"; do
            git cherry-pick "$commit"
          done
          changed=$(git diff --name-only "$EXPECTED_MAIN...HEAD")
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -v '^reference/business-06-world-feed-v1/' | grep -q .; then
            echo 'out-of-scope file detected'
            exit 1
          fi
          grep -q 'world-feed-20260726-5' reference/business-06-world-feed-v1/index.html
          test -f reference/business-06-world-feed-v1/scripts/state-matrix.js
          test -f reference/business-06-world-feed-v1/evidence/ux-slice2-validation.json
          grep -q '"pass": true' reference/business-06-world-feed-v1/evidence/ux-slice2-source-audit.json
          git diff --check "$EXPECTED_MAIN...HEAD"
          git push --force-with-lease origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "B6_TRANSPLANT_HEAD=$(git rev-parse HEAD)"
          echo 'B6_TRANSPLANT_PASS=1'
