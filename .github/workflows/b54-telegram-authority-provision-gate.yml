name: B54 Telegram Authority Provision Gate

# Owner-authorized Production provision of the two Engine Telegram authorities
# (bot token + owner-derived paired-chat allowlist) for #2712.
#
# The gate never calls the Telegram provider, never writes D1, never deploys
# Worker code, and never emits a secret value. Secret values live only in the
# repository secrets B54_TELEGRAM_BOT_TOKEN / B54_TELEGRAM_PAIRED_CHAT_IDS and
# are pushed to the Engine Worker through the same Cloudflare secrets API the
# repository already uses for other Worker secrets.
#
# The default dispatch mode is repository_preflight: it runs only the source
# contract, so an accidental dispatch mutates nothing.

on:
  pull_request:
    paths:
      - '.github/workflows/b54-telegram-authority-provision-gate.yml'
      - '.github/tests/test_b54_telegram_authority_provision_gate.py'
  workflow_dispatch:
    inputs:
      mode:
        description: 'repository_preflight | provision_telegram_authority'
        required: true
        default: 'repository_preflight'
      target_sha:
        description: 'Exact current main SHA authorized for provisioning (required for provision mode)'
        required: false
      confirmation:
        description: 'Type CONFIRM_PROVISION_TELEGRAM_AUTHORITY to authorize exactly one provision run'
        required: false

permissions:
  contents: read

concurrency:
  group: b54-telegram-authority-provision
  cancel-in-progress: false

env:
  ENGINE_WORKER: padiem-ai-engine
  TELEGRAM_BOT_TOKEN_BINDING: ENGINE_TELEGRAM_BOT_TOKEN
  TELEGRAM_PAIRED_CHAT_BINDING: ENGINE_TELEGRAM_PAIRED_CHAT_IDS
  MAX_PAIRED_CHAT_ENTRIES: 16

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.target_sha || github.sha) || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install contract test dependencies
        run: python -m pip install --disable-pip-version-check --quiet 'pyyaml>=6,<7' 'pytest>=8,<10'

      - name: Run Telegram authority provision gate contract tests
        run: python -m pytest -q .github/tests/test_b54_telegram_authority_provision_gate.py

      - name: Record source-only evidence
        shell: bash
        run: |
          echo 'B54_TELEGRAM_AUTHORITY_PROVISION_SOURCE_CONTRACT=PASS'
          echo 'SECRET_MUTATION=0'
          echo 'D1_MUTATION=0'
          echo 'TELEGRAM_PROVIDER_CALLS=0'
          echo 'ENGINE_CODE_DEPLOY=0'
          echo 'PRODUCTION_MUTATION=0'

  provision-authority:
    needs: source-contract
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.mode == 'provision_telegram_authority' &&
      github.event.inputs.confirmation == 'CONFIRM_PROVISION_TELEGRAM_AUTHORITY'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN_SOURCE: ${{ secrets.B54_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PAIRED_CHAT_IDS_SOURCE: ${{ secrets.B54_TELEGRAM_PAIRED_CHAT_IDS }}
    steps:
      - name: Checkout exact authorized revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact current main
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.inputs.target_sha }}"
          test -n "${expected}"
          test "$(git rev-parse HEAD)" = "${expected}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${expected}"
          echo 'PROVISION_EXACT_MAIN_SHA=PASS'
          echo 'RAW_TARGET_SHA_OUTPUT=0'

      - name: Require owner-supplied authority and bound its shape
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${TELEGRAM_BOT_TOKEN_SOURCE}"
          test -n "${TELEGRAM_PAIRED_CHAT_IDS_SOURCE}"
          python - <<'PY'
          import os
          import re

          token_source = os.environ["TELEGRAM_BOT_TOKEN_SOURCE"]
          allowlist_raw = os.environ["TELEGRAM_PAIRED_CHAT_IDS_SOURCE"].strip()

          if token_source != token_source.strip():
              raise SystemExit("TELEGRAM_BOT_TOKEN_SOURCE_SHAPE=FAIL")
          token = token_source
          if re.fullmatch(r"[0-9]{6,64}:[A-Za-z0-9_-]{20,128}", token) is None:
              raise SystemExit("TELEGRAM_BOT_TOKEN_SOURCE_SHAPE=FAIL")

          entries = [part.strip() for part in allowlist_raw.split(",")]
          if not entries or any(not part for part in entries):
              raise SystemExit("TELEGRAM_PAIRED_CHAT_ID_SHAPE=FAIL")
          parsed = []
          for part in entries:
              if re.fullmatch(r"-?[0-9]{1,20}", part) is None:
                  raise SystemExit("TELEGRAM_PAIRED_CHAT_ID_SHAPE=FAIL")
              chat_id = int(part)
              if chat_id == 0 or not -(2**63) < chat_id < 2**63:
                  raise SystemExit("TELEGRAM_PAIRED_CHAT_ID_SHAPE=FAIL")
              parsed.append(chat_id)
          if len(entries) > int(os.environ["MAX_PAIRED_CHAT_ENTRIES"]):
              raise SystemExit("TELEGRAM_PAIRED_CHAT_ID_COUNT=FAIL")
          if len(set(parsed)) != len(parsed):
              raise SystemExit("TELEGRAM_PAIRED_CHAT_ID_DUPLICATE=FAIL")

          print("TELEGRAM_BOT_TOKEN_SOURCE_PRESENT=YES")
          print("TELEGRAM_BOT_TOKEN_SOURCE_SHAPE=PASS")
          print(f"TELEGRAM_PAIRED_CHAT_ENTRY_COUNT_BOUNDED=YES:{len(entries)}")
          print("RAW_BOT_TOKEN_OUTPUT=0")
          print("RAW_CHAT_ID_OUTPUT=0")
          print("SECRET_VALUE_OUTPUT=0")
          PY

      - name: Snapshot the pre-mutation deployment anchor
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${ENGINE_WORKER}"
          anchor="${RUNNER_TEMP}/telegram-provision-pre-anchor.json"
          curl -fsS "${auth[@]}" "${base}/deployments" -o "${anchor}"
          python - "${anchor}" <<'PY'
          import json, sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("success") is not True:
              raise SystemExit("TELEGRAM_PRE_ANCHOR=FAIL")
          deployments = payload.get("result", {}).get("deployments")
          if not isinstance(deployments, list) or not deployments:
              raise SystemExit("TELEGRAM_PRE_ANCHOR_DEPLOYMENTS=FAIL")
          versions = deployments[0].get("versions")
          if not isinstance(versions, list) or len(versions) != 1:
              raise SystemExit("TELEGRAM_PRE_ANCHOR_VERSION_SHAPE=FAIL")
          print("TELEGRAM_PRE_MUTATION_ANCHOR=RECORDED")
          print("ENGINE_VERSION_ID_OUTPUT=0")
          PY

      - name: Require create-only Telegram target state immediately before mutation
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${ENGINE_WORKER}"
          settings="${RUNNER_TEMP}/telegram-authority-pre-settings.json"
          curl -fsS "${auth[@]}" "${base}/settings" -o "${settings}"
          python - "${settings}" <<'PY'
          import json, os, sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("success") is not True:
              raise SystemExit("TELEGRAM_PREMUTATION_SETTINGS=FAIL")
          bindings = payload.get("result", {}).get("bindings")
          if not isinstance(bindings, list):
              raise SystemExit("TELEGRAM_PREMUTATION_BINDINGS=FAIL")

          def classify(name):
              hits = [b for b in bindings if isinstance(b, dict) and b.get("name") == name]
              if len(hits) > 1:
                  raise SystemExit("duplicate Telegram target binding")
              if not hits:
                  return "ABSENT"
              kind = hits[0].get("type")
              if not isinstance(kind, str):
                  raise SystemExit("Telegram target binding type invalid")
              return f"PRESENT:{kind}"

          token = classify(os.environ["TELEGRAM_BOT_TOKEN_BINDING"])
          allowlist = classify(os.environ["TELEGRAM_PAIRED_CHAT_BINDING"])
          print(f"TELEGRAM_BOT_TOKEN_PREMUTATION_BINDING={token}")
          print(f"TELEGRAM_PAIRED_CHAT_PREMUTATION_BINDING={allowlist}")
          if token != "ABSENT" or allowlist != "ABSENT":
              print("TELEGRAM_PROVISION_MODE=CREATE_ONLY_REFUSE_EXISTING")
              raise SystemExit(1)
          print("TELEGRAM_PREMUTATION_TARGETS_ABSENT=PASS")
          print("SECRET_VALUES_READBACK=0")
          print("RAW_BOT_TOKEN_OUTPUT=0")
          print("RAW_CHAT_ID_OUTPUT=0")
          PY

      - name: Push the two Telegram Engine secrets
        id: push
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${ENGINE_WORKER}"
          token_payload="${RUNNER_TEMP}/telegram-bot-token-payload.json"
          allowlist_payload="${RUNNER_TEMP}/telegram-paired-chat-payload.json"
          python - "${token_payload}" "${allowlist_payload}" <<'PY'
          import json, os, sys

          entries = (
              (
                  sys.argv[1],
                  os.environ["TELEGRAM_BOT_TOKEN_BINDING"],
                  os.environ["TELEGRAM_BOT_TOKEN_SOURCE"],
              ),
              (
                  sys.argv[2],
                  os.environ["TELEGRAM_PAIRED_CHAT_BINDING"],
                  os.environ["TELEGRAM_PAIRED_CHAT_IDS_SOURCE"],
              ),
          )
          for path, name, value in entries:
              with open(path, "w", encoding="utf-8") as handle:
                  json.dump(
                      {"name": name, "type": "secret_text", "text": value},
                      handle,
                      separators=(",", ":"),
                  )
          print("TELEGRAM_SECRET_PAYLOADS=BOUNDED")
          print("SECRET_VALUE_OUTPUT=0")
          PY

          push_one() {
            local binding_name="$1"
            local payload="$2"
            local response="${RUNNER_TEMP}/telegram-push-${binding_name}.json"
            local status
            status="$(curl -sS -X PUT "${auth[@]}" -H "Content-Type: application/json" --data-binary "@${payload}" "${base}/secrets" -o "${response}" -w '%{http_code}')"
            rm -f "${payload}"
            if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
              echo "${binding_name}_PUT=FAIL"
              echo 'CLOUDFLARE_ERROR_BODY_OUTPUT=0'
              return 1
            fi
            if ! jq -e '.success == true' "${response}" >/dev/null; then
              echo "${binding_name}_PUT=FAIL"
              echo 'CLOUDFLARE_API_SUCCESS=FAIL'
              echo 'CLOUDFLARE_ERROR_BODY_OUTPUT=0'
              return 1
            fi
            echo "${binding_name}_PUT=PASS"
            return 0
          }

          if ! push_one "${TELEGRAM_BOT_TOKEN_BINDING}" "${token_payload}"; then
            rm -f "${allowlist_payload}"
            echo 'TELEGRAM_AUTHORITY_PUT=FAIL'
            echo 'PARTIAL_PROVISION=NO'
            echo 'SECRET_VALUE_EMITTED=0'
            echo 'RAW_BOT_TOKEN_OUTPUT=0'
            echo 'RAW_CHAT_ID_OUTPUT=0'
            exit 1
          fi
          if ! push_one "${TELEGRAM_PAIRED_CHAT_BINDING}" "${allowlist_payload}"; then
            rm -f "${token_payload}" "${allowlist_payload}"
            echo 'TELEGRAM_AUTHORITY_PUT=FAIL'
            echo 'PARTIAL_PROVISION=YES'
            echo 'SECRET_VALUE_EMITTED=0'
            echo 'RAW_BOT_TOKEN_OUTPUT=0'
            echo 'RAW_CHAT_ID_OUTPUT=0'
            exit 1
          fi

          rm -f "${token_payload}" "${allowlist_payload}"
          echo 'TELEGRAM_AUTHORITY_PUT=PASS'
          echo 'PARTIAL_PROVISION=NO'
          echo 'SECRET_VALUE_EMITTED=0'
          echo 'RAW_BOT_TOKEN_OUTPUT=0'
          echo 'RAW_CHAT_ID_OUTPUT=0'
          echo 'RAW_BINDING_VALUE_OUTPUT=0'

      - name: Read back Telegram binding NAME/TYPE only
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${ENGINE_WORKER}"
          settings="${RUNNER_TEMP}/telegram-authority-settings.json"
          curl -fsS "${auth[@]}" "${base}/settings" -o "${settings}"
          python - "${settings}" <<'PY'
          import json, os, sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("success") is not True:
              raise SystemExit("TELEGRAM_AUTHORITY_SETTINGS=FAIL")
          bindings = payload.get("result", {}).get("bindings")
          if not isinstance(bindings, list):
              raise SystemExit("TELEGRAM_AUTHORITY_SETTINGS_BINDINGS=FAIL")

          def classify(name):
              hits = [b for b in bindings if isinstance(b, dict) and b.get("name") == name]
              if not hits:
                  return "ABSENT"
              if len(hits) != 1:
                  raise SystemExit("duplicate served binding entry")
              if hits[0].get("type") != "secret_text":
                  raise SystemExit("served binding type invalid")
              return "PRESENT:secret_text"

          token = classify(os.environ["TELEGRAM_BOT_TOKEN_BINDING"])
          allowlist = classify(os.environ["TELEGRAM_PAIRED_CHAT_BINDING"])
          print(f"TELEGRAM_BOT_TOKEN_SERVED_BINDING={token}")
          print(f"TELEGRAM_PAIRED_CHAT_ALLOWLIST_SERVED_BINDING={allowlist}")
          if token == "PRESENT:secret_text" and allowlist == "PRESENT:secret_text":
              print("TELEGRAM_AUTHORITY_SETTINGS_READBACK=PASS")
          else:
              print("TELEGRAM_AUTHORITY_SETTINGS_READBACK=FAIL")
              raise SystemExit(1)
          print("SECRET_VALUES_READBACK=0")
          print("RAW_BOT_TOKEN_OUTPUT=0")
          print("RAW_CHAT_ID_OUTPUT=0")
          print("RAW_BINDING_VALUE_OUTPUT=0")
          PY

      - name: Confirm served active Engine version converges to both Telegram bindings
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${ENGINE_WORKER}"
          verified=no
          for _ in $(seq 1 30); do
            deployments="${RUNNER_TEMP}/telegram-authority-after-deployments.json"
            if ! curl -fsS "${auth[@]}" "${base}/deployments" -o "${deployments}"; then
              sleep 2
              continue
            fi
            if ! resolve_out="$(python3 .github/scripts/b54_engine_served_version_guard.py resolve-active --deployments "${deployments}" 2>/dev/null)"; then
              sleep 2
              continue
            fi
            active_version="$(printf '%s\n' "${resolve_out}" | sed -n 's/^ENGINE_ACTIVE_VERSION_ID=//p')"
            if [ -z "${active_version}" ]; then
              sleep 2
              continue
            fi
            echo "::add-mask::${active_version}"
            detail="${RUNNER_TEMP}/telegram-authority-version.json"
            if ! curl -fsS "${auth[@]}" "${base}/versions/${active_version}" -o "${detail}"; then
              sleep 2
              continue
            fi
            if python - "${detail}" "${active_version}" <<'PY'
          import json, os, sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          active_version = sys.argv[2]
          result = payload.get("result") if payload.get("success") is True else None
          if not isinstance(result, dict) or result.get("id") != active_version:
              raise SystemExit(1)
          resources = result.get("resources")
          raw = resources.get("bindings") if isinstance(resources, dict) else None
          if isinstance(raw, dict):
              bindings = [
                  {**value, "name": name}
                  for name, value in raw.items()
                  if isinstance(value, dict)
              ]
          elif isinstance(raw, list):
              bindings = raw
          else:
              raise SystemExit(1)

          def classify(name):
              hits = [b for b in bindings if isinstance(b, dict) and b.get("name") == name]
              if len(hits) != 1:
                  return "ABSENT_OR_DUPLICATE"
              return hits[0].get("type")

          token = classify(os.environ["TELEGRAM_BOT_TOKEN_BINDING"])
          allowlist = classify(os.environ["TELEGRAM_PAIRED_CHAT_BINDING"])
          if token != "secret_text" or allowlist != "secret_text":
              raise SystemExit(2)
          PY
            then
              verified=yes
              break
            fi
            sleep 2
          done

          echo 'TELEGRAM_SERVED_VERSION_CONVERGENCE_MAX_ATTEMPTS=30'
          echo 'TELEGRAM_SERVED_VERSION_CONVERGENCE_SLEEP_SECONDS=2'
          if [ "${verified}" = yes ]; then
            echo 'TELEGRAM_ACTIVE_VERSION_BOT_TOKEN_BINDING=PRESENT:secret_text'
            echo 'TELEGRAM_ACTIVE_VERSION_PAIRED_CHAT_BINDING=PRESENT:secret_text'
            echo 'TELEGRAM_RUNTIME_AUTHORITY=PROVISIONED'
            echo 'TELEGRAM_ACTIVE_VERSION_OWNS_AUTHORITY=PASS'
          else
            echo 'TELEGRAM_RUNTIME_AUTHORITY=PROVISIONED_PENDING_VERSION_ACTIVATION'
            echo 'TELEGRAM_ACTIVE_VERSION_OWNS_AUTHORITY=FAIL'
            echo 'ENGINE_VERSION_ID_OUTPUT=0'
            echo 'RAW_BOT_TOKEN_OUTPUT=0'
            echo 'RAW_CHAT_ID_OUTPUT=0'
            echo 'RAW_BINDING_VALUE_OUTPUT=0'
            echo 'SECRET_VALUE_OUTPUT=0'
            exit 1
          fi
          echo 'ENGINE_VERSION_ID_OUTPUT=0'
          echo 'RAW_BOT_TOKEN_OUTPUT=0'
          echo 'RAW_CHAT_ID_OUTPUT=0'
          echo 'RAW_BINDING_VALUE_OUTPUT=0'
          echo 'SECRET_VALUE_OUTPUT=0'

      - name: Roll back a partial Telegram provision
        if: ${{ failure() && steps.push.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${ENGINE_WORKER}"
          settings="${RUNNER_TEMP}/telegram-rollback-settings.json"
          if ! curl -fsS "${auth[@]}" "${base}/settings" -o "${settings}"; then
            echo 'ROLLBACK_ATTEMPTED=NO'
            echo 'ROLLBACK_REASON=SETTINGS_UNAVAILABLE'
            exit 0
          fi
          pushed="$(python - "${settings}" "${TELEGRAM_BOT_TOKEN_BINDING}" "${TELEGRAM_PAIRED_CHAT_BINDING}" <<'PY'
          import json, sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          result = payload.get("result") if payload.get("success") is True else None
          bindings = result.get("bindings") if isinstance(result, dict) else None
          if not isinstance(bindings, list):
              print("")
              raise SystemExit(0)
          names = {b.get("name") for b in bindings if isinstance(b, dict)}
          print(",".join(name for name in sys.argv[2:4] if name in names))
          PY
          )"
          if [ -z "${pushed}" ]; then
            echo 'ROLLBACK_ATTEMPTED=NO'
            echo 'ROLLBACK_REASON=NOTHING_PUSHED'
            echo 'ROLLBACK_SCOPE=CREATE_ONLY_PARTIAL_PUT'
            exit 0
          fi
          IFS=',' read -ra pushed_names <<< "${pushed}"
          for name in "${pushed_names[@]}"; do
            curl -sS -X DELETE "${auth[@]}" "${base}/secrets/${name}" \
              -o "${RUNNER_TEMP}/telegram-rollback-response.json" >/dev/null 2>&1 || true
          done
          echo 'ROLLBACK_ATTEMPTED=YES'
          echo 'ROLLBACK_SCOPE=PARTIAL_PUT_ONLY'
          echo 'ROLLBACK_SECRET_VALUE_OUTPUT=0'

      - name: Record immutable execution locks
        if: always()
        shell: bash
        run: |
          echo 'PRODUCTION_MUTATION=SCOPED_TELEGRAM_AUTHORITY_SECRETS'
          echo 'WORKFLOW_INTERNAL_RERUN=0'
          echo 'SECRET_VALUE_EMITTED=0'
          echo 'SECRET_VALUES_READBACK=0'
          echo 'RAW_BOT_TOKEN_OUTPUT=0'
          echo 'RAW_CHAT_ID_OUTPUT=0'
          echo 'RAW_BINDING_VALUE_OUTPUT=0'
          echo 'TELEGRAM_PROVIDER_CALLS=0'
          echo 'TELEGRAM_SEND=0'
          echo 'TELEGRAM_EDIT=0'
          echo 'TELEGRAM_CALLBACK_WRITE=0'
          echo 'WEBHOOK_MUTATION=0'
          echo 'D1_MUTATION=0'
          echo 'ENGINE_CODE_DEPLOY=0'
          echo 'ENGINE_DEPLOY=0'
          echo 'ROLLBACK_SCOPE=CREATE_ONLY_PARTIAL_PUT'
          echo 'VERSION_ACTIVATION=SEPARATE_AUTHORITY_IF_CONVERGENCE_EXHAUSTED'

      - name: Publish bounded provision evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## B54 Telegram authority provision gate"
            echo
            echo "- mutation scope: two Engine secrets only"
            echo "- binding inspection: NAME/TYPE only; secret values never read back"
            echo "- Telegram provider calls: 0"
            echo "- D1 writes: 0 | Worker code deploy: 0"
            echo "- rollback scope: partial PUT only"
            echo "- next step: bounded live getMe READ canary under a separate authority"
          } >> "${GITHUB_STEP_SUMMARY}"
