name: B16 Deep Visual Audit 20260810 V2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/b16-deep-visual-audit-20260810-v2.yml'

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'ops/b16-deep-visual-audit-20260810-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: 575dfaa25d3829f79d754c49e9628ff9fd50d97d
      APP_DIR: reference/business-16-personal-sports-v1
      URL: https://16-personal-sports.pages.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Assert exact main and current Production bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b16-evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          verify(){
            url="$1"; source="$2"; label="$3"; expected=$(sha256sum "$source"|cut -d' ' -f1); streak=0
            for i in $(seq 1 20); do
              code=$(curl -L -sS --max-time 20 -o /tmp/b16-public -w '%{http_code}' "$url" || true)
              actual=$(sha256sum /tmp/b16-public 2>/dev/null|cut -d' ' -f1||true)
              if [[ "$code" == 200 && "$actual" == "$expected" ]]; then streak=$((streak+1)); else streak=0; fi
              echo "$label poll=$i streak=$streak http=$code expected=$expected actual=$actual"
              [[ "$streak" -ge 2 ]] && return 0
              sleep 2
            done
            return 1
          }
          verify "$URL/index.html" "$APP_DIR/index.html" B16_ROOT
          verify "$URL/ux.html" "$APP_DIR/ux.html" B16_UX
          verify "$URL/guide.html" "$APP_DIR/guide.html" B16_GUIDE
          echo B16_CURRENT_MAIN_BYTES_MATCH_PRODUCTION=1

      - name: Install browser audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p /tmp/b16-browser
          cd /tmp/b16-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium

      - name: Capture root UX Guide desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/b16-browser
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs'), path = require('path');
          const base = process.env.URL;
          const surfaces = [['root','/index.html'],['ux','/ux.html'],['guide','/guide.html']];
          const viewports = [{name:'desktop',width:1440,height:1100},{name:'mobile',width:390,height:844}];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const results=[];
            for(const vp of viewports){
              for(const [name,route] of surfaces){
                const ctx=await browser.newContext({viewport:{width:vp.width,height:vp.height}});
                const page=await ctx.newPage();
                const consoleErrors=[], pageErrors=[], failed=[];
                page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
                page.on('pageerror',e=>pageErrors.push(e.message));
                page.on('response',r=>{if(r.status()>=400) failed.push(`${r.status()} ${r.url()}`)});
                const resp=await page.goto(base+route,{waitUntil:'networkidle',timeout:60000});
                await page.evaluate(()=>document.fonts.ready); await page.waitForTimeout(400);
                const m=await page.evaluate(()=>{
                  const root=document.documentElement;
                  const h1=document.querySelector('h1');
                  let hm=null;
                  if(h1){const cs=getComputedStyle(h1),r=h1.getBoundingClientRect();hm={text:h1.textContent.replace(/\s+/g,' ').trim(),font:parseFloat(cs.fontSize),line:parseFloat(cs.lineHeight),ratio:parseFloat(cs.lineHeight)/parseFloat(cs.fontSize),top:r.top,bottom:r.bottom,height:r.height};}
                  const fixedSticky=[...document.querySelectorAll('body *')].filter(el=>['fixed','sticky'].includes(getComputedStyle(el).position)).map(el=>{const r=el.getBoundingClientRect();return{tag:el.tagName,cls:String(el.className||'').slice(0,120),position:getComputedStyle(el).position,top:r.top,bottom:r.bottom,height:r.height,width:r.width};}).filter(x=>x.bottom>0&&x.top<innerHeight&&x.width>20&&x.height>20);
                  const buttons=[...document.querySelectorAll('button,a')].slice(0,80).map(el=>{const r=el.getBoundingClientRect();return{text:(el.textContent||'').replace(/\s+/g,' ').trim().slice(0,80),tag:el.tagName,top:r.top,bottom:r.bottom,left:r.left,right:r.right,width:r.width,height:r.height};}).filter(x=>x.width>0&&x.height>0&&x.bottom>0&&x.top<innerHeight);
                  return {overflow:root.scrollWidth-root.clientWidth,scrollHeight:root.scrollHeight,h1:hm,fixedSticky,buttons,bodyText:(document.body.innerText||'').replace(/\s+/g,' ').trim().slice(0,1800)};
                });
                const problems=[];
                if(!resp||resp.status()!==200) problems.push('status');
                if(m.overflow>1) problems.push(`overflow ${m.overflow}`);
                if(m.h1 && /[가-힣]/.test(m.h1.text) && m.h1.ratio<1) problems.push(`tight Korean h1 ${m.h1.ratio}`);
                if(consoleErrors.length||pageErrors.length||failed.length) problems.push('runtime');
                await page.screenshot({path:path.join('/tmp/b16-evidence',`${vp.name}-${name}.png`),fullPage:false});
                await page.screenshot({path:path.join('/tmp/b16-evidence',`${vp.name}-${name}-full.png`),fullPage:true});
                results.push({viewport:vp.name,name,status:resp?resp.status():0,consoleErrors,pageErrors,failed,problems,...m});
                await ctx.close();
              }
            }
            await browser.close();
            const bad=results.filter(x=>x.problems.length);
            fs.writeFileSync('/tmp/b16-evidence/results.json',JSON.stringify({expectedSha:process.env.EXPECTED_SHA,results,bad},null,2));
            console.log(JSON.stringify({count:results.length,bad},null,2));
            if(bad.length) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b16-deep-visual-audit-${{ github.run_number }}
          path: /tmp/b16-evidence
          if-no-files-found: error
          retention-days: 7
