name: B66 Private Customer Template Boundary

on:
  pull_request:
    paths:
      - 'reference/b66-public-standard-templates/**'
      - 'apps/b66-sol61-multipage/**'
      - 'reference/business-66-padiem-quote-v1/quote-sol-pdf-outputs.js'
      - 'reference/business-66-padiem-quote-v1/quote-sol-pdf-runtime-bridge.js'
      - 'reference/business-66-padiem-quote-v1/tests/quote-sol-pdf-outputs.test.cjs'
      - 'reference/business-66-padiem-quote-v1/tests/quote-sol-pdf-runtime-bridge.test.cjs'
      - 'docs/products/b66/TEMPLATE_CUSTODY_POLICY.md'
      - '.github/workflows/b66-public-standard-template-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'reference/b66-public-standard-templates/**'
      - 'apps/b66-sol61-multipage/**'
      - 'reference/business-66-padiem-quote-v1/quote-sol-pdf-outputs.js'
      - 'reference/business-66-padiem-quote-v1/quote-sol-pdf-runtime-bridge.js'
      - 'reference/business-66-padiem-quote-v1/tests/quote-sol-pdf-outputs.test.cjs'
      - 'reference/business-66-padiem-quote-v1/tests/quote-sol-pdf-runtime-bridge.test.cjs'
      - '.github/workflows/b66-public-standard-template-contract.yml'

permissions:
  contents: read

jobs:
  owner-private-template-source-contract:
    name: owner-private-template-source-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify one original Sol PDF feeds preview download and Drive (#4117)
        run: |
          node reference/business-66-padiem-quote-v1/tests/quote-sol-pdf-outputs.test.cjs
          node reference/business-66-padiem-quote-v1/tests/quote-sol-pdf-runtime-bridge.test.cjs
      - name: Verify revoked public release cannot expose customer source
        run: python3 reference/b66-public-standard-templates/cgi/v1/tests/test_public_bundle_contract.py
      - name: Install pinned native PDF test dependencies
        run: python -m pip install -r apps/b66-sol61-multipage/requirements-test.txt
      - name: Guard absence of legacy public CGI artifacts (#4117)
        run: python -B -m pytest -q -p no:cacheprovider apps/b66-sol61-multipage/tests/test_native_server_adapter_4117.py::test_4117_public_manifest_cannot_inherit_historical_private_certificate
      # The former raster/oracle suite needs the customer-owned CGI PDF and
      # compiled slots. It cannot run on public GitHub checkout after withdrawal.
      # This does NOT mark those private-fidelity cases PASS; run them in an
      # authorized private fixture environment before a new renderer release.
      - name: Verify public checkout cannot load private fixture but renderer code parses
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -m py_compile apps/b66-sol61-multipage/sol61_multipage.py
          python -B -m py_compile apps/b66-sol61-multipage/native_server_adapter.py
          python -B -m pytest -q -p no:cacheprovider apps/b66-sol61-multipage/tests/test_native_server_adapter_4117.py::test_4117_public_manifest_cannot_inherit_historical_private_certificate
          python3 reference/b66-public-standard-templates/cgi/v1/tests/test_public_bundle_contract.py
