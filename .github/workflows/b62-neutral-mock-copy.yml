name: B62 Neutral Mock Copy

on:
  pull_request:
    paths:
      - 'apps/padiem-chat/app/b14_client.py'
      - 'apps/padiem-chat/static/app.js'
      - 'apps/padiem-chat/tests/test_neutral_mock_copy.py'
      - '.github/scripts/b62_neutral_mock_copy_audit.py'
      - '.github/workflows/b62-neutral-mock-copy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neutral-mock-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: apps/padiem-chat/pyproject.toml
      - name: Audit user-facing model-selection copy
        run: python .github/scripts/b62_neutral_mock_copy_audit.py
      - name: Install Padiem Chat test dependencies
        working-directory: apps/padiem-chat
        run: pip install -e '.[test]'
      - name: Verify deferred-model mock copy remains neutral
        working-directory: apps/padiem-chat
        run: pytest -q tests/test_model_policy.py tests/test_unassigned_profile_gate.py tests/test_neutral_mock_copy.py
