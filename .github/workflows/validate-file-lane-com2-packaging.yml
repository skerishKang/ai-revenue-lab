name: Validate COM2 File Lane Packaging
on:
  pull_request:
    paths:
      - 'deploy/host-com2/file-lane/**'
      - 'docs/operations/FILE_LANE_COM2_RUNBOOK.md'
      - 'apps/padiem-file-lane/**'
      # #6265 retroactive guard: the file lane declares the shared Core as a
      # file:// dependency, so any Core source change is a packaging surface
      # change too.
      - 'packages/padiem-ai-core/**'
      - '.github/workflows/validate-file-lane-com2-packaging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.5'
      - name: Offline installer, systemd syntax, health and lock contracts
        run: python -m unittest discover -s deploy/host-com2/file-lane/tests -q
