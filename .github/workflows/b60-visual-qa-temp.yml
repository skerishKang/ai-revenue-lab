name: B60 Visual QA Temp

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  b60-visual-qa:
    if: github.event.pull_request.number == 662
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Chromium harness
        shell: bash
        run: |
          mkdir -p /tmp/b60qa
          cd /tmp/b60qa
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start exact-head static server
        shell: bash
        run: |
          cd apps/portfolio-console/ai-api
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/b60-http.log 2>&1 &
          echo $! >/tmp/b60-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/b60-http.log
          exit 1

      - name: Render desktop and mobile cinematic gates
        shell: bash
        run: |
          mkdir -p qa-output
          cat > /tmp/b60qa/qa.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('/tmp/b60qa/node_modules/playwright');
          const out = 'qa-output';
          const url = 'http://127.0.0.1:4173/';
          const failures = [];
          const consoleErrors = [];
          const failedRequests = [];

          function attach(page) {
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('requestfailed', req => failedRequests.push(`${req.url()} :: ${req.failure()?.errorText || 'failed'}`));
          }

          async function assetState(page) {
            return page.evaluate(() => Array.from(document.querySelectorAll('.shot img, .gesture-hand img')).map(img => ({
              src: img.getAttribute('src'), naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight, complete: img.complete
            })));
          }

          async function stageState(page) {
            return page.evaluate(() => {
              const stage = document.querySelector('#stage');
              const alone = document.querySelector('.shot-alone');
              const close = document.querySelector('.shot-close');
              const hand = document.querySelector('.gesture-hand');
              const connect = document.querySelector('#connect');
              const vision = document.querySelector('.vision-ring');
              const opacity = el => el ? Number(getComputedStyle(el).opacity || 0) : null;
              return {
                scrollY: window.scrollY,
                progress: getComputedStyle(document.documentElement).getPropertyValue('--progress').trim(),
                stageClass: stage?.className || '',
                connected: stage?.classList.contains('connected') || false,
                aloneOpacity: opacity(alone),
                closeOpacity: opacity(close),
                handOpacity: opacity(hand),
                connectOpacity: opacity(connect),
                visionOpacity: opacity(vision),
                bodyWidth: document.body.scrollWidth,
                viewportWidth: innerWidth
              };
            });
          }

          async function waitConnect(page) {
            await page.waitForFunction(() => Number(getComputedStyle(document.querySelector('#connect')).opacity) > .8, null, { timeout: 12000 });
          }

          async function scrollProgress(page, p) {
            await page.evaluate((p) => {
              const c = document.querySelector('#cinematic');
              const max = Math.max(1, c.offsetHeight - innerHeight);
              window.scrollTo({ top: max * p, behavior: 'instant' });
            }, p);
            await page.waitForTimeout(700);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const result = { url, desktop: {}, mobile: {}, consoleErrors, failedRequests };

            const desktop = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
            attach(desktop);
            await desktop.goto(url, { waitUntil: 'networkidle' });
            await desktop.waitForTimeout(250);
            result.desktop.initialAssets = await assetState(desktop);
            result.desktop.initial = await stageState(desktop);
            await desktop.screenshot({ path: `${out}/desktop-00-initial.png`, fullPage: false });
            await desktop.waitForTimeout(1700);
            result.desktop.approach = await stageState(desktop);
            await desktop.screenshot({ path: `${out}/desktop-01-approach.png`, fullPage: false });
            await waitConnect(desktop);
            result.desktop.connect = await stageState(desktop);
            await desktop.screenshot({ path: `${out}/desktop-02-connect.png`, fullPage: false });
            await desktop.locator('#connect').click();
            await desktop.waitForTimeout(800);
            result.desktop.postConnect = await stageState(desktop);
            await desktop.screenshot({ path: `${out}/desktop-03-post-connect.png`, fullPage: false });
            await scrollProgress(desktop, .58);
            result.desktop.vision = await stageState(desktop);
            await desktop.screenshot({ path: `${out}/desktop-04-vision.png`, fullPage: false });
            await scrollProgress(desktop, .75);
            result.desktop.spatial = await stageState(desktop);
            await desktop.screenshot({ path: `${out}/desktop-05-spatial.png`, fullPage: false });

            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            attach(mobile);
            await mobile.goto(url, { waitUntil: 'networkidle' });
            await mobile.waitForTimeout(1800);
            result.mobile.approachAssets = await assetState(mobile);
            result.mobile.approach = await stageState(mobile);
            await mobile.screenshot({ path: `${out}/mobile-00-approach.png`, fullPage: false });
            await waitConnect(mobile);
            result.mobile.connect = await stageState(mobile);
            await mobile.screenshot({ path: `${out}/mobile-01-connect.png`, fullPage: false });
            await mobile.locator('#connect').click();
            await mobile.waitForTimeout(800);
            await scrollProgress(mobile, .58);
            result.mobile.vision = await stageState(mobile);
            await mobile.screenshot({ path: `${out}/mobile-02-vision.png`, fullPage: false });
            await scrollProgress(mobile, .75);
            result.mobile.spatial = await stageState(mobile);
            await mobile.screenshot({ path: `${out}/mobile-03-spatial.png`, fullPage: false });

            const allAssets = [...result.desktop.initialAssets, ...result.mobile.approachAssets];
            if (allAssets.some(x => !x.complete || x.naturalWidth <= 0 || x.naturalHeight <= 0)) failures.push('IMAGE_DECODE');
            if (result.desktop.approach.aloneOpacity < .45) failures.push('DESKTOP_PROTAGONIST_VISIBILITY');
            if (result.desktop.connect.handOpacity < .45) failures.push('DESKTOP_HAND_VISIBILITY');
            if (!result.desktop.postConnect.connected) failures.push('DESKTOP_CONNECT_STATE');
            if (result.mobile.approach.aloneOpacity < .45) failures.push('MOBILE_PROTAGONIST_VISIBILITY');
            if (result.mobile.connect.handOpacity < .45) failures.push('MOBILE_HAND_VISIBILITY');
            if (result.mobile.spatial.bodyWidth > result.mobile.spatial.viewportWidth + 1) failures.push('MOBILE_HORIZONTAL_OVERFLOW');
            if (consoleErrors.length) failures.push('CONSOLE_ERRORS');
            if (failedRequests.length) failures.push('FAILED_REQUESTS');

            result.failures = [...new Set(failures)];
            result.pass = result.failures.length === 0;
            fs.writeFileSync(`${out}/result.json`, JSON.stringify(result, null, 2));
            console.log(JSON.stringify(result, null, 2));
            await browser.close();
            if (!result.pass) process.exit(1);
          })().catch(err => {
            fs.writeFileSync(`${out}/fatal.txt`, String(err && err.stack || err));
            console.error(err);
            process.exit(1);
          });
          NODE
          node /tmp/b60qa/qa.cjs

      - name: Upload rendered QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b60-visual-qa-${{ github.event.pull_request.head.sha }}
          path: qa-output/
          if-no-files-found: warn
