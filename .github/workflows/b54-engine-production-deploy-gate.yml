name: B54 Engine Production Deploy Gate

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact main SHA to deploy'
        required: true
      confirmation:
        description: 'Type DEPLOY_B54_ENGINE_FROM_EXACT_MAIN to authorize the deploy'
        required: true
      # #2748: rollback must name its target. Optional at the schema level so
      # deploy dispatches are not forced to supply it, but the rollback branch
      # refuses to run without it, so Wrangler can never implicitly select a
      # "previous upload" version that no evidence names.
      rollback_version_id:
        description: 'Exact Worker version id to roll back to (required for the rollback branch)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy-production-engine:
    if: github.event.inputs.confirmation == 'DEPLOY_B54_ENGINE_FROM_EXACT_MAIN'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_sha }}
          persist-credentials: false

      - name: Premutation exact-main and account assertions
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.inputs.target_sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.event.inputs.target_sha }}"
          test "$CLOUDFLARE_ACCOUNT_ID" = '9be14bb7b8974e65d0afba647ab16932'
          echo 'PREMUTATION_EXACT_MAIN_SHA=PASS'
          echo 'PREMUTATION_TARGET_ACCOUNT=PASS'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'

      - name: Resolve engine environment with dev tools
        working-directory: apps/padiem-ai-engine
        run: uv sync --extra dev

      - name: Sync engine worker bundle
        working-directory: apps/padiem-ai-engine
        run: uv run pywrangler sync --force

      # ISSUE #2414: validate the caller-registry secrets on the ACTUALLY SERVED
      # version (deployments API -> versions/{active} detail), not the mutable
      # settings plane. GET-only, NAME/TYPE-only, fail-closed before any mutation.
      - name: Pre-deploy served-version secret guard
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          auth=( -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" )
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/padiem-ai-engine"
          deployments="${RUNNER_TEMP}/deployments-pre.json"
          curl -fsS "${auth[@]}" "${base}/deployments" -o "${deployments}"
          resolve_out="$(python3 .github/scripts/b54_engine_served_version_guard.py resolve-active --deployments "${deployments}")"
          printf '%s\n' "${resolve_out}"
          active_version="$(printf '%s\n' "${resolve_out}" | sed -n 's/^ENGINE_ACTIVE_VERSION_ID=//p')"
          test -n "${active_version}"
          version_detail="${RUNNER_TEMP}/version-pre.json"
          curl -fsS "${auth[@]}" "${base}/versions/${active_version}" -o "${version_detail}"
          verify_out="$(python3 .github/scripts/b54_engine_served_version_guard.py verify --version-settings "${version_detail}" --active-version "${active_version}" --require-drive-runtime-bindings)"
          printf '%s\n' "${verify_out}"
          overlay_expected="$(printf '%s\n' "${verify_out}" | sed -n 's/^B54_ENGINE_OVERLAY_EXPECTED=//p')"
          test "${overlay_expected}" = 'YES' || test "${overlay_expected}" = 'NO'
          {
            echo "B54_ENGINE_ACTIVE_VERSION=${active_version}"
            echo "B54_ENGINE_OVERLAY_EXPECTED=${overlay_expected}"
          } >> "${GITHUB_ENV}"
          echo 'PREMUTATION_SERVED_VERSION_GUARD=PASS'

      - name: Pre-deploy A7 Control Plane admission readiness
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          auth=( -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" )
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/padiem-control-plane-engine-admission"
          settings="${RUNNER_TEMP}/a7-cp-admission-predeploy-settings.json"
          subdomain="${RUNNER_TEMP}/a7-cp-admission-predeploy-subdomain.json"
          deployments="${RUNNER_TEMP}/a7-cp-admission-predeploy-deployments.json"

          curl -fsS "${auth[@]}" "${base}/settings" -o "${settings}"
          curl -fsS "${auth[@]}" "${base}/subdomain" -o "${subdomain}"
          curl -fsS "${auth[@]}" "${base}/deployments" -o "${deployments}"

          jq -e '.success == true and (.result.bindings | type == "array")' "${settings}" >/dev/null
          jq -e '.result.bindings | any(.name == "CONTROL_PLANE_IDENTITY" and .type == "service" and .service == "padiem-control-plane-identity")' "${settings}" >/dev/null
          jq -e '.success == true and .result.enabled == false and .result.previews_enabled == false' "${subdomain}" >/dev/null
          active_version="$(python3 .github/scripts/cloudflare_served_version_cli.py resolve-active --deployments "${deployments}")"
          test -n "${active_version}"
          echo 'CP_ADMISSION_SERVED_VERSION_RESOLVER=CANONICAL'

          echo 'PREDEPLOY_CP_ADMISSION_READINESS=PASS'
          echo 'PRIVATE_INGRESS=PASS'
          echo 'CP_MUTATION=0'
          echo 'ENGINE_MUTATION_BEFORE_GUARD=0'
          echo 'PROVIDER_CALLS=0'
          echo 'REAL_USER_DATA=0'

      # #3758: durable pre-mutation rollback anchor for the Engine deploy path.
      #
      # #3742 closed this gap for B14: the pre-deploy served version existed
      # only as a run-log line / GITHUB_ENV value (here B54_ENGINE_ACTIVE_VERSION)
      # that no artifact carried. When the deploy command starts and fails --
      # exactly the run that creates the need to roll back -- the version an
      # operator must return to was recoverable from nothing durable, while the
      # rollback branch (#3737 / PR #3744) demands an explicit target. This
      # step is read-only, mutates no Worker state, and does not reinterpret
      # the pre/post served-version guards around it.
      #
      # Position is the contract. After the served-version secret guard and the
      # A7 Control Plane admission readiness step, so the anchor names the
      # version serving the code this dispatch is about to replace; and
      # immediately before the mutating command, so the read is as fresh as
      # the gate can make it. A refused read ends the job here, which is what
      # makes DEPLOY_EXECUTED=NO true rather than merely printed.
      - name: Pre-deploy canonical served-version rollback anchor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          B54_TARGET_SHA: ${{ github.event.inputs.target_sha }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/padiem-ai-engine"

          # Durable, bounded evidence: version ids and verdict tokens only.
          # Never a token, an account id, a header or a response envelope,
          # which is why the raw deployments file stays out of the published
          # artifact path. Two files, two phases:
          #   b54-engine-anchor.txt        -> PRE-MUTATION anchor artifact,
          #                                   uploaded as a hard precondition
          #                                   of the deploy command below
          #   b54-engine-deploy-evidence.txt -> final outcome artifact,
          #                                   published after the job settles
          evidence="${RUNNER_TEMP}/b54-engine-deploy-evidence.txt"
          anchor="${RUNNER_TEMP}/b54-engine-anchor.txt"
          : > "${evidence}"
          : > "${anchor}"
          record() {
            printf '%s\n' "$1"
            printf '%s\n' "$1" >> "${evidence}"
          }
          anchor_record() {
            printf '%s\n' "$1"
            printf '%s\n' "$1" >> "${anchor}"
          }
          anchor_fail() {
            echo 'B54_PRE_DEPLOY_ANCHOR=FAIL' >&2
            echo "REASON=$1" >&2
            # The refusal is itself durable evidence, and DEPLOY_EXECUTED=NO is
            # the one fact a failed anchor may still assert truthfully: the
            # deploy command below is never reached. No version id and no PASS
            # token is recorded for a version that was not actually confirmed.
            record "DEPLOY_EXECUTED=NO"
            exit 1
          }
          anchor_record "MUTATION_CLASS=DEPLOY"
          anchor_record "B54_ENGINE_WORKER_SCRIPT=padiem-ai-engine"
          anchor_record "RAW_DEPLOYMENTS_ENVELOPE_INCLUDED=NO"
          anchor_record "SECRET_VALUES_INCLUDED=NO"
          anchor_record "ACCOUNT_ID_INCLUDED=NO"
          record "MUTATION_CLASS=DEPLOY"
          record "RAW_DEPLOYMENTS_ENVELOPE_INCLUDED=NO"
          record "SECRET_VALUES_INCLUDED=NO"
          record "ACCOUNT_ID_INCLUDED=NO"

          # (1) Canonical pre-mutation read. GET-only. The whole envelope is
          # handed to the shared resolver (#3656); no shell-side envelope rule
          # and no second served-version authority exist here.
          pre_deployments="${RUNNER_TEMP}/deployments-anchor-pre.json"
          if ! curl -fsS --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${base}/deployments" -o "${pre_deployments}"; then
            anchor_fail "pre-deploy deployments read failed"
          fi

          # (2) Only a successful canonical resolution is an anchor: a real
          # active deployment, a single version, 100% traffic and a safe id.
          # Malformed, split, ambiguous and unreadable envelopes all reach
          # anchor_fail. The CLI prints the safe id on stdout and a bounded
          # REASON on stderr, and never echoes a rejected candidate.
          if ! pre_version="$(python3 .github/scripts/cloudflare_served_version_cli.py resolve-active --deployments="${pre_deployments}")"; then
            anchor_fail "canonical resolver refused the pre-deploy deployments read"
          fi
          if [ -z "${pre_version}" ]; then
            anchor_fail "canonical resolver returned no served version id"
          fi

          anchor_record "PRE_DEPLOY_SERVED_VERSION_ID=${pre_version}"
          anchor_record "PRE_MUTATION_VERSION_CAPTURED=YES"
          anchor_record "SOURCE_MAIN_SHA=${B54_TARGET_SHA}"
          anchor_record "ROLLBACK_ANCHOR_AVAILABLE=YES"
          anchor_record "ANCHOR_PREPARED_BEFORE_DEPLOY=YES"
          # Mirror the anchor into the final outcome evidence as well, so the
          # post-run artifact can stand alone if the run survives to publish.
          record "PRE_DEPLOY_SERVED_VERSION_ID=${pre_version}"
          record "PRE_MUTATION_VERSION_CAPTURED=YES"
          record "SOURCE_MAIN_SHA=${B54_TARGET_SHA}"
          record "ROLLBACK_ANCHOR_AVAILABLE=YES"
          record "ANCHOR_PREPARED_BEFORE_DEPLOY=YES"
          echo 'B54_PRE_DEPLOY_ANCHOR=PASS'

      # #3758 round 2 (CENTRAL review): the anchor is only a rollback anchor if
      # it is OUTSIDE the runner before the mutating command starts. A
      # RUNNER_TEMP file plus an after-the-fact always() upload loses the
      # anchor when the runner dies during the deploy. So the pre-mutation
      # anchor artifact is uploaded HERE, and its success is a hard
      # precondition: no upload, no deploy. `if: always()` is meaningless on
      # this step -- it runs in the middle of the job and must fail the job on
      # any refusal. The final outcome evidence is a SEPARATE artifact
      # published at the end of the job; a missing final artifact then means
      # the run died mid-flight and the deploy outcome is UNKNOWN -- never a
      # silent success, never a claimed non-deploy.
      - name: Publish the pre-mutation rollback anchor artifact (hard deploy precondition)
        uses: actions/upload-artifact@v4
        with:
          name: b54-engine-rollback-anchor-${{ github.run_id }}
          path: ${{ runner.temp }}/b54-engine-anchor.txt
          if-no-files-found: error
          retention-days: 90

      - name: Deploy engine to production
        working-directory: apps/padiem-ai-engine
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # f88 lesson: exit 0 (or wrangler's "No targets deployed" version
          # report) proves only that the deploy COMMAND ran, never that the
          # served deployment is healthy. This step therefore emits command
          # evidence only; the final production PASS marker is emitted by the
          # post-deploy served-version guard below, after served-version
          # evidence exists.
          #
          # #3758: the ATTEMPT is recorded BEFORE the mutating command, not
          # after it. Under `set -euo pipefail` anything written after a
          # failed command is lost exactly when it matters most -- a deploy
          # that started and failed can still have mutated Production, and an
          # artifact carrying no attempt line would read identically to one
          # where the anchor refused and nothing ever happened. On failure
          # DEPLOY_EXECUTED is recorded as UNKNOWN, never NO: whether
          # Production actually changed is not knowable from an exit code.
          printf 'DEPLOY_ATTEMPTED=YES\n' >> "${RUNNER_TEMP}/b54-engine-deploy-evidence.txt"
          echo 'DEPLOY_ATTEMPTED=YES'
          # pywrangler deploy itself is unchanged and stays the single deploy
          # authority; only the evidence around it is recorded.
          if uv run pywrangler deploy 2>&1 | tee "${RUNNER_TEMP}/b54-engine-deploy.log"; then
            # Reached only on success, so DEPLOY_EXECUTED=YES can never be
            # recorded for a deploy that did not complete.
            printf 'DEPLOY_EXECUTED=YES\n' >> "${RUNNER_TEMP}/b54-engine-deploy-evidence.txt"
            echo 'B54_ENGINE_DEPLOY_COMMAND=EXIT_ZERO'
          else
            printf 'DEPLOY_EXECUTED=UNKNOWN\n' >> "${RUNNER_TEMP}/b54-engine-deploy-evidence.txt"
            echo 'DEPLOY_EXECUTED=UNKNOWN'
            echo 'B54_ENGINE_DEPLOY_COMMAND=FAIL' >&2
            exit 1
          fi

      # f88 lesson: the post-deploy served-version guard runs BEFORE the
      # health smoke, so the exact served version is recorded as evidence even
      # when the smoke fails (previously the guard was skipped on smoke
      # failure and CENTRAL could not tell what version was served).
      # ISSUE #2414: re-resolve the served version AFTER the deploy and require
      # the caller-registry secrets on that exact new version. If the overlay
      # existed on the pre-deploy served version it must survive the deploy.
      - name: Post-deploy served-version secret guard
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          auth=( -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" )
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/padiem-ai-engine"
          # #2742: one immediate read is not convergence evidence. During
          # propagation the deployments endpoint can still name the PRE-deploy
          # version, and the version-detail verify below would then PASS
          # legitimately against that stale version -- emitting the final
          # deploy PASS marker for code that is not actually serving traffic.
          # Converge instead: re-read on a bounded window and accept only a
          # canonical served version that differs from the version recorded
          # before the mutation. Resolution stays in the canonical shared
          # resolver; no shape rule is re-implemented here.
          pre_version="${B54_ENGINE_ACTIVE_VERSION:-}"
          if [ -z "${pre_version}" ]; then
            echo 'POST_DEPLOY_SERVED_VERSION_CONVERGED=FAIL' >&2
            echo 'REASON=pre-deploy served version was not recorded' >&2
            exit 1
          fi
          convergence_reads=0
          active_version=''
          for attempt in $(seq 1 30); do
            convergence_reads="${attempt}"
            deployments="${RUNNER_TEMP}/deployments-post-${attempt}.json"
            curl -fsS "${auth[@]}" "${base}/deployments" -o "${deployments}"
            # Single textual invocation inside the poll loop (#2742 contract).
            resolve_out="$(python3 .github/scripts/b54_engine_served_version_guard.py resolve-active --deployments "${deployments}")"
            candidate="$(printf '%s\n' "${resolve_out}" | sed -n 's/^ENGINE_ACTIVE_VERSION_ID=//p')"
            if [ -z "${candidate}" ]; then
              echo 'POST_DEPLOY_SERVED_VERSION_CONVERGED=FAIL' >&2
              echo 'REASON=canonical resolver returned no served version id' >&2
              exit 1
            fi
            if [ "${candidate}" != "${pre_version}" ]; then
              active_version="${candidate}"
              break
            fi
            # Still serving the pre-deploy version: not a failure yet, and not
            # evidence of success either. Keep the window open.
            sleep 2
          done
          if [ -z "${active_version}" ]; then
            echo 'POST_DEPLOY_SERVED_VERSION_CONVERGED=FAIL' >&2
            echo "REASON=served version still equals the pre-deploy version after ${convergence_reads} bounded canonical reads" >&2
            echo "PRE_DEPLOY_SERVED_VERSION_ID=${pre_version}" >&2
            exit 1
          fi
          echo "PRE_DEPLOY_SERVED_VERSION_ID=${pre_version}"
          echo "POST_DEPLOY_SERVED_VERSION_ID=${active_version}"
          echo 'SERVED_VERSION_CHANGED_BY_CODE_DEPLOY=YES'
          echo "POST_DEPLOY_CONVERGENCE_READS=${convergence_reads}"
          echo 'POST_DEPLOY_SERVED_VERSION_CONVERGED=PASS'
          version_detail="${RUNNER_TEMP}/version-post.json"
          curl -fsS "${auth[@]}" "${base}/versions/${active_version}" -o "${version_detail}"
          overlay_args=()
          if [ "${B54_ENGINE_OVERLAY_EXPECTED}" = 'YES' ]; then
            overlay_args+=( --expect-overlay )
          fi
          verify_out="$(python3 .github/scripts/b54_engine_served_version_guard.py verify \
            --version-settings "${version_detail}" \
            --active-version "${active_version}" \
            --require-drive-runtime-bindings \
            --inspect-engine-admission-binding \
            "${overlay_args[@]}")"
          printf '%s\n' "${verify_out}"
          printf '%s\n' "${verify_out}" | grep -q '^CONTROL_PLANE_ENGINE_ADMISSION_SERVED_BINDING=PRESENT:service$'
          printf '%s\n' "${verify_out}" | grep -q '^ENGINE_ADMISSION_BINDING_TARGET_VALIDATED=YES$'
          echo 'POST_DEPLOY_A7_ADMISSION_BINDING=PASS'
          echo 'POST_DEPLOY_SERVED_VERSION_GUARD=PASS'
          # Final deploy PASS only after served-version evidence above: the
          # deploy command's exit 0 alone never proves a healthy production
          # deployment (f88). Liveness is still proven separately by the
          # health smoke that follows.
          echo 'B54_ENGINE_PRODUCTION_DEPLOY=PASS'

      - name: Post-deploy smoke
        run: |
          set -euo pipefail
          sleep 15
          # Bounded non-secret diagnostic: always emit the numeric HTTP status
          # (curl transport failure normalizes to 000 via the case guard), never
          # dump the response body, and still fail closed on non-200.
          CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 20 'https://engine.padiem.net/internal/v1/health' || true)
          case "${CODE}" in ''|*[!0-9]*) CODE=000 ;; esac
          echo "HEALTH_HTTP_STATUS=${CODE}"
          if [ "${CODE}" != '200' ]; then
            echo 'B54_ENGINE_PRODUCTION_SMOKE=FAIL'
            exit 1
          fi
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"b14_service_bound":true' /tmp/health.json
          grep -q 'orchestration_run' /tmp/health.json
          echo 'B54_ENGINE_PRODUCTION_SMOKE=PASS'

      # #3758 round 2 (CENTRAL review): publish the bounded run-outcome
      # evidence. `if: always()` is the #3704/#3742 precedent -- a run that
      # stopped before deploying is exactly the case the anchor is needed
      # for -- and `if-no-files-found: error` keeps a missing artifact from
      # reading as a silent PASS. This artifact is deliberately SEPARATE from
      # the pre-mutation anchor artifact above: if the runner dies during the
      # deploy, this final artifact never appears, and the rollback anchor is
      # already safe in its own upload from before the mutation. A run with a
      # pre-mutation anchor but no final outcome artifact is read as
      # DEPLOY_EXECUTED=UNKNOWN, never as a success or a non-deploy.
      - name: Publish the bounded run-outcome evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b54-engine-production-deploy-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/b54-engine-deploy-evidence.txt
          if-no-files-found: error
          retention-days: 90

  smoke-idempotency:
    # A7 activation reconciliation (#3340): authenticated-user entitlement is now
    # mandatory for orchestration, so the legacy A9 account-level success probe
    # is no longer a valid post-deploy expectation. This job first proves the
    # unscoped request is rejected before provider dispatch, then keeps A10/A11
    # and A12 as their existing bounded runtime evidence. Authenticated-user
    # orchestration is proven separately by the owner-gated A7 live canary.
    needs: deploy-production-engine
    if: github.event.inputs.confirmation == 'DEPLOY_B54_ENGINE_FROM_EXACT_MAIN'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      # ISSUE #2484 Goal A: the smoke evidence path is bound to the single
      # canonical B62 -> Engine authority. CALLER_ID is the fixed non-secret
      # identifier of the dedicated overlay-only Claw caller (#2520:
      # b54-p01-overlay-20260914-a1, replacing the legacy shared Claw id)
      # and the credential is the SAME secret the B62
      # worker uses (B62_P01_ENGINE_CREDENTIAL). The former independent
      # PADIEM_ENGINE_SMOKE_CALLER_ID/_SECRET secrets are removed so the smoke
      # authority can no longer drift from the runtime authority. A10 reads only
      # the legacy env NAMES, so those names are re-pointed at the same canonical
      # source; no independent smoke credential secret remains.
      CALLER_ID: b54-p01-overlay-20260914-a1
      CALLER_SECRET: ${{ secrets.B62_P01_ENGINE_CREDENTIAL }}
      PADIEM_ENGINE_SMOKE_CALLER_ID: b54-p01-overlay-20260914-a1
      PADIEM_ENGINE_SMOKE_CALLER_SECRET: ${{ secrets.B62_P01_ENGINE_CREDENTIAL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ENGINE_BASE_URL: https://engine.padiem.net
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install padiem-ai-core
        run: python -m pip install --quiet -e packages/padiem-ai-core

      - name: Fail honestly when smoke secrets are missing
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CALLER_ID:-}" ] || [ -z "${CALLER_SECRET:-}" ]; then
            echo 'SMOKE=SKIPPED_MISSING_SECRET'
            exit 1
          fi
          echo 'SMOKE_SECRETS_PRESENT=1'

      - name: Run A7 unscoped admission fail-closed smoke
        shell: bash
        run: |
          set -euo pipefail
          python apps/padiem-ai-engine/scripts/a7_unscoped_admission_production_smoke.py | tee /tmp/a7_unscoped_smoke.log
          grep -q '^A7_UNSCOPED_ADMISSION_SMOKE=PASS$' /tmp/a7_unscoped_smoke.log
          grep -q '^REAL_PROVIDER_CALLS=0$' /tmp/a7_unscoped_smoke.log
          grep -q '^AUTHENTICATED_USER_LIVE_PROOF=NOT_CLAIMED$' /tmp/a7_unscoped_smoke.log

      - name: Run A10 continuation fail-closed smoke
        shell: bash
        run: |
          set -euo pipefail
          python apps/padiem-ai-engine/scripts/a10_continuation_production_smoke.py | tee /tmp/a10_smoke.log
          grep -q 'A10_CONTINUATION_SMOKE=PASS' /tmp/a10_smoke.log
          grep 'A10_CONTINUATION_SMOKE=PASS' /tmp/a10_smoke.log | tail -1

      # WO-10 ACT-1/ACT-2 (#2010): A11 proves the Gmail tool_runtime route
      # state honestly. It NEVER fakes a PASS. Since the ACT-2 route
      # activation the Tool routes are admitted in Engine source, so the
      # former DEFERRED REASON=ROUTE_NOT_WIRED tolerance is removed: a 404
      # now FAILs as a stale-deploy contradiction. Accepted non-blocking
      # verdicts: A11_GMAIL_TOOL_RUNTIME_SMOKE=PASS (tool contract live:
      # route wired, runtime bound, Agent authorized, Gmail tool registered,
      # provider never called) or DEFERRED REASON=TOOL_RUNTIME_UNAVAILABLE /
      # TOOL_NOT_ALLOWED (route admitted, credential/authorization gate D43
      # still pending). A11_GMAIL_TOOL_RUNTIME_SMOKE=FAIL means
      # contradictory/unexpected production behaviour and fails the gate.
      - name: Run A11 Gmail tool_runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          python apps/padiem-ai-engine/scripts/a11_gmail_tool_runtime_smoke.py | tee /tmp/a11_smoke.log
          grep -qE 'A11_GMAIL_TOOL_RUNTIME_SMOKE=(PASS|DEFERRED)' /tmp/a11_smoke.log
          if grep -q 'A11_GMAIL_TOOL_RUNTIME_SMOKE=FAIL' /tmp/a11_smoke.log; then
            echo 'A11_GMAIL_TOOL_RUNTIME_SMOKE=FAIL' >&2
            exit 1
          fi
          grep 'A11_GMAIL_TOOL_RUNTIME_SMOKE=' /tmp/a11_smoke.log | tail -1

      - name: Run A12 streaming idempotency replay smoke
        shell: bash
        run: |
          set -euo pipefail
          # An OWNER-selected per-request model does not change the canonical
          # Padiem text-primary HOLD. An A12 primary-model smoke must not
          # initiate a provider call without a declared primary (#3554/#3566).
          # Import/invalid-declaration failures are fatal, never a silent skip.
          a12_primary_state="$(python - <<'PY'
          from padiem_ai_core.model_primary import TEXT_PRIMARY_MODEL_ID
          if TEXT_PRIMARY_MODEL_ID is None:
              print("HOLD")
          elif isinstance(TEXT_PRIMARY_MODEL_ID, str) and TEXT_PRIMARY_MODEL_ID.strip():
              print("ACTIVE")
          else:
              raise SystemExit("invalid canonical text primary")
          PY
          )"
          if [ "$a12_primary_state" = 'HOLD' ]; then
            echo 'A12_STREAM_REPLAY_SMOKE=SKIPPED_NO_PRIMARY_MODEL'
            echo 'A12_PROVIDER_CALLS=0'
            echo 'A12_SKIP_REASON=CANONICAL_TEXT_PRIMARY_HOLD'
            exit 0
          fi
          test "$a12_primary_state" = 'ACTIVE'
          python apps/padiem-ai-engine/scripts/a12_stream_replay_production_smoke.py | tee /tmp/a12_smoke.log
          # An external provider 5xx is recorded as SKIPPED_UPSTREAM, never as a
          # pass: the mandatory Engine-side stages (S0 manifest, S3 conflict)
          # still had to hold for that verdict. FAIL stays a hard gate failure.
          grep -qE 'A12_STREAM_REPLAY_SMOKE=(PASS|SKIPPED_UPSTREAM)' /tmp/a12_smoke.log
          if grep -q 'A12_STREAM_REPLAY_SMOKE=FAIL' /tmp/a12_smoke.log; then
            echo 'A12_STREAM_REPLAY_SMOKE=FAIL' >&2
            exit 1
          fi
          A12_REPLAY_EVIDENCE="$(grep 'A12_STREAM_REPLAY_SMOKE=' /tmp/a12_smoke.log | tail -1 | cut -d= -f2-)"
          echo "A12_REPLAY_EVIDENCE=${A12_REPLAY_EVIDENCE}"

  rollback-production-engine:
    if: github.event.inputs.confirmation == 'ROLLBACK_B54_ENGINE_TO_PREVIOUS_VERSION'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'

      # #3737: this step runs from the workspace root, which is what its own
      # `cd apps/padiem-ai-engine` / `cd "$GITHUB_WORKSPACE"` pair already assumes.
      # A step-level working-directory made the two contradict each other: the
      # body's `.github/scripts/...` adapter calls could not resolve and the step
      # aborted before any mutation, so the Engine rollback could never execute.
      - name: Rollback engine worker to previous version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_TARGET: ${{ github.event.inputs.rollback_version_id }}
        run: |
          set -euo pipefail
          auth=( -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" )
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/padiem-ai-engine"
          # #2748: rollback names its own target. #2752: what that target proves
          # is decided by the shared mutation-class evidence primitive, not by
          # shell string comparison. A code deploy must prove the served version
          # CHANGED; a rollback must prove it EQUALS the named target.
          if [ -z "${ROLLBACK_TARGET:-}" ]; then
            echo 'B54_ENGINE_PRODUCTION_ROLLBACK=FAIL' >&2
            echo 'REASON=rollback_version_id is required; implicit previous-version selection is refused' >&2
            echo 'ROLLBACK_TARGET_EXPLICIT=NO' >&2
            exit 1
          fi
          # Canonical safe-version-id contract (same charset rule the resolver
          # uses) so an owner typo or a hostile string never reaches the CLI.
          # The =FORM is load-bearing: the canonical grammar accepts a leading
          # hyphen, and a separate token would be read by argparse as an option
          # and refused before the predicate is ever consulted.
          python3 .github/scripts/b54_engine_served_version_guard.py \
            validate-version-id --version-id="${ROLLBACK_TARGET}"
          echo "ROLLBACK_TARGET_VERSION_ID=${ROLLBACK_TARGET}"
          echo 'ROLLBACK_TARGET_EXPLICIT=YES'
          echo 'IMPLICIT_PREVIOUS_VERSION_SELECTION=NO'
          # Baseline the served version BEFORE mutating, so the evidence has a
          # pre-state and a rollback is never attempted blind.
          pre_deployments="${RUNNER_TEMP}/deployments-rollback-baseline.json"
          curl -fsS "${auth[@]}" "${base}/deployments" -o "${pre_deployments}"
          pre_resolve="$(python3 .github/scripts/b54_engine_served_version_guard.py resolve-active --deployments "${pre_deployments}")"
          pre_version="$(printf '%s\n' "${pre_resolve}" | sed -n 's/^ENGINE_ACTIVE_VERSION_ID=//p')"
          if [ -z "${pre_version}" ]; then
            echo 'B54_ENGINE_PRODUCTION_ROLLBACK=FAIL' >&2
            echo 'REASON=canonical resolver returned no pre-rollback served version' >&2
            exit 1
          fi
          echo "PRE_ROLLBACK_SERVED_VERSION_ID=${pre_version}"
          cd apps/padiem-ai-engine
          npx wrangler@4 rollback "${ROLLBACK_TARGET}" \
            --message "B54 engine production rollback to explicit target (owner-authorized gate)"
          echo 'B54_ENGINE_ROLLBACK_COMMAND=EXIT_ZERO'
          cd "$GITHUB_WORKSPACE"
          # Bounded readback. Each attempt resolves through the canonical
          # resolver and is recorded as one observation; a rejected read is
          # recorded too and never finalizes anything either way (#2453
          # provenance). No envelope rule is evaluated in this shell.
          observations="${RUNNER_TEMP}/rollback-observations.txt"
          : > "${observations}"
          rollback_reads=0
          for attempt in $(seq 1 30); do
            rollback_reads="${attempt}"
            deployments="${RUNNER_TEMP}/deployments-rollback-${attempt}.json"
            if curl -fsS "${auth[@]}" "${base}/deployments" -o "${deployments}" \
              && resolve_out="$(python3 .github/scripts/b54_engine_served_version_guard.py resolve-active --deployments "${deployments}")"; then
              candidate="$(printf '%s\n' "${resolve_out}" | sed -n 's/^ENGINE_ACTIVE_VERSION_ID=//p')"
              if [ -n "${candidate}" ]; then
                printf 'ok %s\n' "${candidate}" >> "${observations}"
              else
                printf 'reject -\n' >> "${observations}"
              fi
            else
              printf 'reject -\n' >> "${observations}"
            fi
            if evidence_out="$(python3 .github/scripts/cloudflare_mutation_evidence.py evaluate \
              --class ROLLBACK --pre-version="${pre_version}" --target-version="${ROLLBACK_TARGET}" \
              --observations "${observations}" --window-open)"; then
              evidence_rc=0
            else
              evidence_rc=$?
            fi
            # 3 means "not final yet, the window is still open"; anything else
            # stops polling and the closed-window decision below settles it.
            if [ "${evidence_rc}" -ne 3 ]; then
              break
            fi
            sleep 2
          done
          echo "POST_ROLLBACK_CONVERGENCE_READS=${rollback_reads}"
          # Re-decide with the window CLOSED: the verdict that ends this step
          # must be one the primitive itself considers final.
          if ! final_out="$(python3 .github/scripts/cloudflare_mutation_evidence.py evaluate \
            --class ROLLBACK --pre-version="${pre_version}" --target-version="${ROLLBACK_TARGET}" \
            --observations "${observations}")"; then
            echo 'POST_ROLLBACK_SERVED_EQUALS_TARGET=FAIL' >&2
            printf '%s\n' "${final_out}" >&2
            echo "ROLLBACK_TARGET_VERSION_ID=${ROLLBACK_TARGET}" >&2
            exit 1
          fi
          printf '%s\n' "${final_out}"
          served_version="$(printf '%s\n' "${final_out}" | sed -n 's/^POST_MUTATION_SERVED_VERSION_ID=//p')"
          echo "POST_ROLLBACK_SERVED_VERSION_ID=${served_version}"
          echo 'POST_ROLLBACK_SERVED_EQUALS_TARGET=PASS'
          echo 'ROLLBACK_COMMAND_EXIT_ZERO_AS_FINAL_PASS=NO'
          echo 'B54_ENGINE_PRODUCTION_ROLLBACK=PASS'
