name: Validate B6 Complete 465

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'reference/business-06-world-feed-v1/**'
      - '.github/workflows/validate-b6-complete-465.yml'

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'feat/b6-world-feed-complete-465'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate World Feed integrated UX and guide
        shell: bash
        run: |
          set -euo pipefail
          base=reference/business-06-world-feed-v1
          for f in "$base"/scripts/*.js "$base"/scripts/views/*.js; do node --check "$f"; done
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          base=Path('reference/business-06-world-feed-v1')
          for name in ('index.html','guide.html'):
              text=(base/name).read_text(encoding='utf-8')
              HTMLParser().feed(text)
          index=(base/'index.html').read_text(encoding='utf-8')
          guide=(base/'guide.html').read_text(encoding='utf-8')
          shell=(base/'scripts/views/shell-loading-view.js').read_text(encoding='utf-8')
          assert 'world-feed-20260810-6' in index
          assert 'world-feed-20260726-5' not in index
          assert './guide.html' in shell and '30초 사용법' in shell
          for marker in ('GUIDE · 30 SECONDS','SCAN · 나의 피드','WHY · 설명 가능한 개인화','ADJUST · 관심 조정','RETURN · 맥락 보존'):
              assert marker in guide, marker
          refs=[]
          for html in (index,guide):
              refs += re.findall(r'(?:src|href)="(\./[^"?#]+)', html)
          for rel in refs:
              p=base/rel[2:]
              assert p.exists(), f'missing local asset: {rel}'
          all_source='\n'.join(p.read_text(encoding='utf-8') for p in list((base/'scripts').glob('*.js'))+list((base/'scripts/views').glob('*.js')))
          for forbidden in ('fetch(', 'XMLHttpRequest', 'localStorage', 'document.cookie', 'serviceWorker'):
              assert forbidden not in all_source, forbidden
          print('B6_STATIC_AUDIT_PASS=1')
          PY
          grep -q '"pass": true' "$base/evidence/ux-slice2-source-audit.json"
          test -f "$base/evidence/ux-slice2-validation.json"
          git diff --check origin/main...HEAD
          echo 'B6_INTEGRATED_UX_GUIDE_VALIDATION_PASS=1'
