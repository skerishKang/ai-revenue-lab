name: Prepare B20 Complete 465
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/prepare-b20-complete-465.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'ops/prepare-b20-complete-465'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize approved B20 UI plus existing UX on exact main
        shell: bash
        env:
          EXPECTED_MAIN: 5f788ecb1e69bb77a437000460e9889971608366
          TARGET_BRANCH: feat/b20-personal-memory-novel-complete-465
          UI_BRANCH: feat/business-20-personal-memory-novel-ui
          UX_BRANCH: feat/business-20-personal-memory-novel-ux-396
          SCOPE: reference/business-20-personal-memory-novel-v1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          git fetch origin "$UI_BRANCH" "$UX_BRANCH"
          test "$(git rev-parse origin/$UI_BRANCH)" = 12ead3c03a7355fcc364648bf0a6169ee86153a1
          test "$(git rev-parse origin/$UX_BRANCH)" = 55ba9e9b4d63494428addf13e644b57581228aeb
          if git ls-tree -r --name-only HEAD -- "$SCOPE" | grep -q .; then
            echo 'B20 scope unexpectedly exists on current main; refusing overwrite' >&2
            exit 1
          fi
          git switch -c "$TARGET_BRANCH"
          git checkout "origin/$UI_BRANCH" -- "$SCOPE"
          git checkout "origin/$UX_BRANCH" -- "$SCOPE/ux.html"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$SCOPE"
          git diff --cached --check
          git commit -m 'feat(b20): integrate approved memory-novel UI and narrative UX'
          git push origin "$TARGET_BRANCH"
          echo B20_PREPARE_PASS=1
