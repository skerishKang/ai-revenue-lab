name: B62 Claw Live Config Activation Gate

on:
  pull_request:
    paths:
      - ".github/workflows/b62-claw-live-config-activation-gate.yml"
      - ".github/scripts/b62_claw_live_config_activation.py"
      - ".github/scripts/b62_binding_state_guard.py"
      - ".github/tests/test_b62_claw_live_config_activation.py"
      - ".github/tests/test_b62_deploy_prereq_rollback_contracts.py"
  workflow_dispatch:
    inputs:
      mode:
        description: "Live config gate mode"
        required: true
        type: choice
        default: repository_preflight
        options:
          - repository_preflight
          - cloudflare_readonly
          - activate_config
          - replace_p01_engine_credential
          - rollback_config
      target_sha:
        description: "Exact current main SHA"
        required: true
        type: string
      confirmation:
        description: "Exact mutation confirmation phrase"
        required: false
        default: ""
        type: string
      engine_service_name:
        description: "Canonical Engine Worker service name for P01_ENGINE_SERVICE"
        required: false
        default: ""
        type: string
      r2_bucket_name:
        description: "Existing private R2 bucket name for PADIEM_WORKSPACE_FILES"
        required: false
        default: ""
        type: string
      rollback_version_id:
        description: "Recorded pre-activation version id to restore"
        required: false
        default: ""
        type: string
      premutation_run_id:
        description: "Run id that recorded the pre-mutation settings snapshot artifact"
        required: false
        default: ""
        type: string
      credential_created_by_activation:
        description: "Whether the recorded activation run created P01_ENGINE_CREDENTIAL"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: b62-claw-live-config-activation-gate
  cancel-in-progress: false

env:
  B62_WORKER: padiem-chat
  TARGET_SHA: ${{ inputs.target_sha }}
  ENGINE_SERVICE_NAME: ${{ inputs.engine_service_name }}
  R2_BUCKET_NAME: ${{ inputs.r2_bucket_name }}

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR exact head
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact dispatch SHA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact current main for dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'PREMUTATION_EXACT_MAIN_SHA=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run live config activation gate contract tests
        run: python .github/tests/test_b62_claw_live_config_activation.py

      - name: Run deploy prereq and config rollback contract tests
        run: python .github/tests/test_b62_deploy_prereq_rollback_contracts.py

      - name: Source-only evidence
        run: |
          echo 'B62_CLAW_LIVE_CONFIG_SOURCE_CONTRACT=PASS'
          echo 'PRODUCTION_MUTATION=0'

  cloudflare-readonly:
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'repository_preflight' && inputs.mode != 'replace_p01_engine_credential' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      disposition: ${{ steps.classify.outputs.disposition }}
      r2_bucket_existence: ${{ steps.r2_bucket.outputs.r2_bucket_existence }}
      r2_bucket_http_status: ${{ steps.r2_bucket.outputs.r2_bucket_http_status }}
      r2_bucket_response_shape: ${{ steps.r2_bucket.outputs.r2_bucket_response_shape }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconfirm exact main before live readback
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'READONLY_EXACT_MAIN_SHA=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read live Worker settings and classify activation targets
        id: classify
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${ENGINE_SERVICE_NAME}"
          test -n "${R2_BUCKET_NAME}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          settings="${RUNNER_TEMP}/b62-settings-readonly.json"
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" \
            -o "${settings}"
          jq -e '.success == true' "${settings}" >/dev/null
          jq -c '[.result.bindings[] | {name, type}]' "${settings}"
          evidence="$(python .github/scripts/b62_claw_live_config_activation.py classify \
            --settings "${settings}" --engine-service "${ENGINE_SERVICE_NAME}" --r2-bucket "${R2_BUCKET_NAME}")"
          echo "${evidence}"
          disposition="$(printf '%s\n' "${evidence}" | sed -n 's/^B62_CLAW_LIVE_CONFIG_DISPOSITION=//p')"
          case "${disposition}" in
            ALREADY_EXACT|ACTIVATION_REQUIRED) ;;
            *) echo 'Refusing: live config requires human review before any mutation.' >&2; exit 1;;
          esac
          echo "disposition=${disposition}" >> "${GITHUB_OUTPUT}"
          echo 'BINDING_NAME_AND_TYPE_ONLY=YES'
          echo 'SECRET_VALUES_READ=0'
          echo 'PRODUCTION_MUTATION=0'

      - name: Read-only R2 bucket existence check
        id: r2_bucket
        shell: bash
        env:
          R2_READONLY_API_TOKEN: ${{ secrets.B62_R2_READONLY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${R2_BUCKET_NAME}"
          if [ -z "${R2_READONLY_API_TOKEN:-}" ]; then
            echo 'B62_R2_READONLY_CREDENTIAL=MISSING' >&2
            echo 'R2_BUCKET_PROBE=NOT_ATTEMPTED' >&2
            echo 'SECRET_VALUE_EMITTED=0' >&2
            echo 'PRODUCTION_MUTATION=0' >&2
            exit 1
          fi
          auth=(-H "Authorization: Bearer ${R2_READONLY_API_TOKEN}" -H "Content-Type: application/json")
          bucket="${RUNNER_TEMP}/b62-r2-bucket-readonly.json"
          http_status="$(curl -sS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${R2_BUCKET_NAME}" \
            -o "${bucket}" -w '%{http_code}')"
          case "${http_status}" in
            200)
              if jq -e --arg name "${R2_BUCKET_NAME}" '.success == true and .result.name == $name' "${bucket}" >/dev/null; then
                echo "r2_bucket_existence=EXISTS" >> "${GITHUB_OUTPUT}"
                echo "r2_bucket_http_status=200" >> "${GITHUB_OUTPUT}"
                echo "r2_bucket_response_shape=EXACT" >> "${GITHUB_OUTPUT}"
                echo 'R2_BUCKET_EXISTENCE=EXISTS'
                echo 'R2_BUCKET_HTTP_STATUS=200'
                echo 'R2_BUCKET_RESPONSE_SHAPE=EXACT'
              else
                echo "r2_bucket_existence=ERROR_OR_DRIFT" >> "${GITHUB_OUTPUT}"
                echo "r2_bucket_http_status=200" >> "${GITHUB_OUTPUT}"
                echo "r2_bucket_response_shape=DRIFT" >> "${GITHUB_OUTPUT}"
                echo 'R2_BUCKET_EXISTENCE=ERROR_OR_DRIFT'
                echo 'R2_BUCKET_HTTP_STATUS=200'
                echo 'R2_BUCKET_RESPONSE_SHAPE=DRIFT'
              fi
              ;;
            404)
              echo "r2_bucket_existence=ABSENT" >> "${GITHUB_OUTPUT}"
              echo "r2_bucket_http_status=404" >> "${GITHUB_OUTPUT}"
              echo "r2_bucket_response_shape=NOT_APPLICABLE" >> "${GITHUB_OUTPUT}"
              echo 'R2_BUCKET_EXISTENCE=ABSENT'
              echo 'R2_BUCKET_HTTP_STATUS=404'
              echo 'R2_BUCKET_RESPONSE_SHAPE=NOT_APPLICABLE'
              ;;
            401)
              echo "r2_bucket_existence=ERROR_OR_DRIFT" >> "${GITHUB_OUTPUT}"
              echo "r2_bucket_http_status=401" >> "${GITHUB_OUTPUT}"
              echo "r2_bucket_response_shape=NOT_APPLICABLE" >> "${GITHUB_OUTPUT}"
              echo 'R2_BUCKET_EXISTENCE=ERROR_OR_DRIFT'
              echo 'R2_BUCKET_HTTP_STATUS=401'
              echo 'R2_BUCKET_RESPONSE_SHAPE=NOT_APPLICABLE'
              ;;
            403)
              echo "r2_bucket_existence=ERROR_OR_DRIFT" >> "${GITHUB_OUTPUT}"
              echo "r2_bucket_http_status=403" >> "${GITHUB_OUTPUT}"
              echo "r2_bucket_response_shape=NOT_APPLICABLE" >> "${GITHUB_OUTPUT}"
              echo 'R2_BUCKET_EXISTENCE=ERROR_OR_DRIFT'
              echo 'R2_BUCKET_HTTP_STATUS=403'
              echo 'R2_BUCKET_RESPONSE_SHAPE=NOT_APPLICABLE'
              ;;
            *)
              echo "r2_bucket_existence=ERROR_OR_DRIFT" >> "${GITHUB_OUTPUT}"
              echo "r2_bucket_http_status=OTHER" >> "${GITHUB_OUTPUT}"
              echo "r2_bucket_response_shape=NOT_APPLICABLE" >> "${GITHUB_OUTPUT}"
              echo 'R2_BUCKET_EXISTENCE=ERROR_OR_DRIFT'
              echo 'R2_BUCKET_HTTP_STATUS=OTHER'
              echo 'R2_BUCKET_RESPONSE_SHAPE=NOT_APPLICABLE'
              ;;
          esac
          echo "R2_OBJECT_READ=0" >> "${GITHUB_OUTPUT}"
          echo "R2_OBJECT_WRITE=0" >> "${GITHUB_OUTPUT}"
          echo "PRODUCTION_MUTATION=0" >> "${GITHUB_OUTPUT}"

  activate-config:
    needs: [source-contract, cloudflare-readonly]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'activate_config' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      actions: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRMATION: ${{ inputs.confirmation }}
      READONLY_DISPOSITION: ${{ needs.cloudflare-readonly.outputs.disposition }}
    steps:
      - name: Require explicit activation authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${CONFIRMATION}" = "CONFIRM_ACTIVATE_B62_CLAW_LIVE_CONFIG"
          case "${READONLY_DISPOSITION}" in
            ALREADY_EXACT|ACTIVATION_REQUIRED) ;;
            *)
              echo 'Refusing mutation: no trustworthy readonly disposition.' >&2
              exit 1
              ;;
          esac
          echo 'B62_CLAW_LIVE_CONFIG_AUTHORIZATION=PASS'

      - name: Checkout exact approved main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconfirm exact main immediately before mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'PREMUTATION_EXACT_MAIN_SHA=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record rollback anchor and pre-mutation settings snapshot
        id: before
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          settings="${RUNNER_TEMP}/b62-settings-premutation.json"
          deployments="${RUNNER_TEMP}/b62-deployments-premutation.json"
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" \
            -o "${settings}"
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/deployments" \
            -o "${deployments}"
          jq -e '.success == true and (.result.deployments | length) > 0 and (.result.deployments[0].versions | length) == 1 and .result.deployments[0].versions[0].percentage == 100' \
            "${deployments}" >/dev/null
          active="$(jq -r '.result.deployments[0].versions[0].version_id' "${deployments}")"
          test -n "${active}"
          echo "B62_CLAW_CONFIG_PREMUTATION_VERSION_ID=${active}"
          echo "active_version=${active}" >> "${GITHUB_OUTPUT}"
          jq -c '.result.bindings | map({name, type})' "${settings}"
          echo 'PREMUTATION_SETTINGS_SNAPSHOT=RECORDED'
          echo 'D1_IDENTIFIER_OUTPUT=0'
          echo 'SECRET_VALUES_READ=0'

      - name: Publish the pre-mutation settings snapshot for bounded config rollback
        uses: actions/upload-artifact@v4
        with:
          name: b62-claw-config-premutation-settings
          path: ${{ runner.temp }}/b62-settings-premutation.json
          if-no-files-found: error
          retention-days: 90

      - name: Rebuild the activation patch against the pre-mutation snapshot
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/b62-config-patch.json"
          evidence="$(python .github/scripts/b62_claw_live_config_activation.py plan \
            --settings "${RUNNER_TEMP}/b62-settings-premutation.json" \
            --engine-service "${ENGINE_SERVICE_NAME}" \
            --r2-bucket "${R2_BUCKET_NAME}" \
            --target-sha "${TARGET_SHA}" \
            --output "${RUNNER_TEMP}/b62-config-patch.json")"
          echo "${evidence}"
          no_op="$(printf '%s\n' "${evidence}" | sed -n 's/^B62_CLAW_CONFIG_NO_OP=//p')"
          credential="$(printf '%s\n' "${evidence}" | sed -n 's/^B62_CLAW_CONFIG_CREDENTIAL_CREATE_REQUIRED=//p')"
          test -n "${no_op}" && test -n "${credential}"
          echo "B62_CLAW_CONFIG_NO_OP=${no_op}" >> "${GITHUB_ENV}"
          echo "B62_CLAW_CONFIG_CREDENTIAL_CREATE_REQUIRED=${credential}" >> "${GITHUB_ENV}"

      - name: Confirm the private R2 bucket already exists
        if: ${{ env.B62_CLAW_CONFIG_NO_OP != '1' }}
        shell: bash
        env:
          R2_READONLY_API_TOKEN: ${{ secrets.B62_R2_READONLY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${R2_BUCKET_NAME}"
          if [ -z "${R2_READONLY_API_TOKEN:-}" ]; then
            echo 'B62_R2_READONLY_CREDENTIAL=MISSING' >&2
            echo 'R2_BUCKET_PROBE=NOT_ATTEMPTED' >&2
            echo 'SECRET_VALUE_EMITTED=0' >&2
            echo 'PRODUCTION_MUTATION=0' >&2
            exit 1
          fi
          auth=(-H "Authorization: Bearer ${R2_READONLY_API_TOKEN}" -H "Content-Type: application/json")
          bucket="${RUNNER_TEMP}/b62-r2-bucket.json"
          http_status="$(curl -sS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${R2_BUCKET_NAME}" \
            -o "${bucket}" -w '%{http_code}')"
          test "${http_status}" = "200"
          jq -e --arg name "${R2_BUCKET_NAME}" '.success == true and .result.name == $name' "${bucket}" >/dev/null
          echo 'R2_BUCKET_REUSE_EXISTING=PASS'
          echo 'R2_BUCKET_CREATED=0'

      - name: Apply the activation patch through the settings API
        if: ${{ env.B62_CLAW_CONFIG_NO_OP != '1' }}
        shell: bash
        run: |
          set -euo pipefail
          response="${RUNNER_TEMP}/b62-config-patch-response.json"
          http_status="$(
            curl -sS -X PATCH \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -F "settings=<${RUNNER_TEMP}/b62-config-patch.json;type=application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" \
              -o "${response}" \
              -w '%{http_code}'
          )"
          echo "B62_CLAW_CONFIG_PATCH_HTTP_STATUS=${http_status}"
          if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
            echo 'B62_CLAW_CONFIG_PATCH=FAIL'
            if jq -e . "${response}" >/dev/null 2>&1; then
              jq -c '{success, errors: [(.errors // [])[] | {code, message}]}' "${response}"
            else
              echo 'CLOUDFLARE_ERROR_BODY_JSON=NO'
            fi
            exit 1
          fi
          jq -e '.success == true and (.result.bindings | type == "array")' "${response}" >/dev/null
          echo 'B62_CLAW_CONFIG_PATCH=SUCCESS'
          echo 'UNRELATED_BINDINGS_PRESERVED=PASS'
          echo 'SECRET_BINDING_VALUE_READ_OR_REWRITTEN=NO'
          echo 'WORKER_CODE_REDEPLOY=0'

      - name: Create the P01 Engine credential only when it is absent
        if: ${{ env.B62_CLAW_CONFIG_CREDENTIAL_CREATE_REQUIRED == '1' }}
        shell: bash
        env:
          B62_P01_ENGINE_CREDENTIAL: ${{ secrets.B62_P01_ENGINE_CREDENTIAL }}
        run: |
          set -euo pipefail
          test -n "${B62_P01_ENGINE_CREDENTIAL}"
          payload="${RUNNER_TEMP}/b62-p01-credential.json"
          python - "${payload}" <<'PY'
          import json, os, sys
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "name": "P01_ENGINE_CREDENTIAL",
                      "type": "secret_text",
                      "text": os.environ["B62_P01_ENGINE_CREDENTIAL"],
                  },
                  handle,
                  separators=(",", ":"),
              )
          PY
          response="${RUNNER_TEMP}/b62-p01-credential-response.json"
          http_status="$(
            curl -sS -X PUT \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "@${payload}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/secrets" \
              -o "${response}" \
              -w '%{http_code}'
          )"
          rm -f "${payload}"
          echo "B62_P01_CREDENTIAL_HTTP_STATUS=${http_status}"
          if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
            echo 'B62_P01_CREDENTIAL=FAIL'
            if jq -e . "${response}" >/dev/null 2>&1; then
              jq -c '{success, errors: [(.errors // [])[] | {code, message}]}' "${response}"
            else
              echo 'CLOUDFLARE_ERROR_BODY_JSON=NO'
            fi
            exit 1
          fi
          jq -e '.success == true' "${response}" >/dev/null
          echo 'B62_P01_CREDENTIAL=CREATED'
          echo 'SECRET_VALUE_EMITTED=0'
          echo 'SECRET_REUSE_ONLY_NO_RECREATION=PASS'

      - name: Read back the fully activated live configuration
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          ready=no
          for _ in $(seq 1 30); do
            settings="${RUNNER_TEMP}/b62-settings-after.json"
            curl -fsS "${auth[@]}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" \
              -o "${settings}"
            if python .github/scripts/b62_claw_live_config_activation.py verify \
              --settings "${settings}" --engine-service "${ENGINE_SERVICE_NAME}" --r2-bucket "${R2_BUCKET_NAME}" \
              >"${RUNNER_TEMP}/b62-verify-after.log" 2>&1; then
              ready=yes
              break
            fi
            sleep 2
          done
          cat "${RUNNER_TEMP}/b62-verify-after.log"
          test "${ready}" = yes
          echo 'B62_CLAW_LIVE_CONFIG_POST_READBACK=PASS'
          if [ "${B62_CLAW_CONFIG_NO_OP}" = "1" ]; then
            echo 'B62_CLAW_LIVE_CONFIG_ACTIVATION=SKIPPED_ALREADY_EXACT'
            echo 'PRODUCTION_MUTATION=0'
          else
            echo 'B62_CLAW_LIVE_CONFIG_ACTIVATION=COMPLETE'
            echo 'PRODUCTION_MUTATION=1'
          fi
          echo 'SECRET_VALUES_READ=0'
          echo 'UNRELATED_CONFIG_MUTATED=0'

  replace-p01-credential:
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'replace_p01_engine_credential' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Require explicit credential replacement authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${CONFIRMATION}" = "CONFIRM_REPLACE_B62_P01_ENGINE_CREDENTIAL"
          echo 'B62_P01_REPLACEMENT_AUTHORIZATION=PASS'
          echo 'ACTIVATION_CONFIRMATION_PHRASE_NOT_REUSED=YES'
          echo 'PRODUCTION_MUTATION=0'

      - name: Checkout exact approved main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconfirm exact main immediately before mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'PREMUTATION_EXACT_MAIN_SHA=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate the source credential with bounded quality evidence
        shell: bash
        env:
          B62_P01_ENGINE_CREDENTIAL: ${{ secrets.B62_P01_ENGINE_CREDENTIAL }}
        run: |
          set -euo pipefail
          python .github/scripts/b62_claw_live_config_activation.py credential-quality

      - name: Record pre-mutation settings and served version
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          settings="${RUNNER_TEMP}/b62-settings-pre-replacement.json"
          deployments="${RUNNER_TEMP}/b62-deployments-pre-replacement.json"
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" \
            -o "${settings}"
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/deployments" \
            -o "${deployments}"
          jq -e '.success == true and (.result.deployments | length) > 0 and (.result.deployments[0].versions | length) == 1 and .result.deployments[0].versions[0].percentage == 100' \
            "${deployments}" >/dev/null
          served="$(jq -r '.result.deployments[0].versions[0].version_id' "${deployments}")"
          test -n "${served}"
          echo "PREMUTATION_SERVED_VERSION_ID=${served}" >> "${GITHUB_ENV}"
          jq -c '.result.bindings | map({name, type})' "${settings}"
          python .github/scripts/b62_claw_live_config_activation.py replacement-precheck --settings "${settings}"
          echo 'PREMUTATION_SETTINGS_SNAPSHOT=RECORDED'
          echo 'OLD_SECRET_VALUE_READ=NO'
          echo 'SECRET_VALUES_READ=0'

      - name: Replace the P01 Engine credential through the secrets API
        shell: bash
        env:
          B62_P01_ENGINE_CREDENTIAL: ${{ secrets.B62_P01_ENGINE_CREDENTIAL }}
        run: |
          set -euo pipefail
          test -n "${B62_P01_ENGINE_CREDENTIAL}"
          payload="${RUNNER_TEMP}/b62-p01-replacement.json"
          python - "${payload}" <<'PY'
          import json, os, sys
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "name": "P01_ENGINE_CREDENTIAL",
                      "type": "secret_text",
                      "text": os.environ["B62_P01_ENGINE_CREDENTIAL"],
                  },
                  handle,
                  separators=(",", ":"),
              )
          PY
          response="${RUNNER_TEMP}/b62-p01-replacement-response.json"
          http_status="$(
            curl -sS -X PUT \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "@${payload}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/secrets" \
              -o "${response}" \
              -w '%{http_code}'
          )"
          rm -f "${payload}"
          echo "B62_P01_CREDENTIAL_REPLACE_HTTP_STATUS=${http_status}"
          if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
            echo 'B62_P01_CREDENTIAL_REPLACE=FAIL'
            if jq -e . "${response}" >/dev/null 2>&1; then
              jq -c '{success, errors: [(.errors // [])[] | {code, message}]}' "${response}"
            else
              echo 'CLOUDFLARE_ERROR_BODY_JSON=NO'
            fi
            exit 1
          fi
          jq -e '.success == true' "${response}" >/dev/null
          echo 'B62_P01_CREDENTIAL_REPLACE=SUBMITTED'
          echo 'SETTINGS_PATCH=0'
          echo 'UNRELATED_SECRET_MUTATION=0'
          echo 'WORKER_CODE_REDEPLOY=0'
          echo 'SECRET_VALUE_EMITTED=0'
          echo 'PRODUCTION_MUTATION=1'

      - name: Record post-mutation served version evidence
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          deployments="${RUNNER_TEMP}/b62-deployments-post-replacement.json"
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/deployments" \
            -o "${deployments}"
          jq -e '.success == true and (.result.deployments | length) > 0 and (.result.deployments[0].versions | length) == 1 and .result.deployments[0].versions[0].percentage == 100' \
            "${deployments}" >/dev/null
          served="$(jq -r '.result.deployments[0].versions[0].version_id' "${deployments}")"
          test -n "${served}"
          echo "POSTMUTATION_SERVED_VERSION_ID=${served}"
          if [ "${served}" = "${PREMUTATION_SERVED_VERSION_ID}" ]; then
            echo 'SERVED_VERSION_CHANGED_BY_SECRET_PUT=NO'
          else
            echo 'SERVED_VERSION_CHANGED_BY_SECRET_PUT=YES'
          fi
          echo 'WORKER_CODE_DEPLOY_SUBMITTED=0'
          echo 'SECRET_VALUES_READ=0'

      - name: Read back the replaced credential by binding name and type only
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          verified=no
          for _ in $(seq 1 30); do
            settings="${RUNNER_TEMP}/b62-settings-after-replacement.json"
            curl -fsS "${auth[@]}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" \
              -o "${settings}"
            if python .github/scripts/b62_claw_live_config_activation.py replacement-verify \
              --settings "${settings}" \
              --pre-settings "${RUNNER_TEMP}/b62-settings-pre-replacement.json" \
              >"${RUNNER_TEMP}/b62-replacement-verify.log" 2>&1; then
              verified=yes
              break
            fi
            sleep 2
          done
          cat "${RUNNER_TEMP}/b62-replacement-verify.log"
          test "${verified}" = yes
          echo 'B62_P01_REPLACEMENT_POST_READBACK=PASS'
          echo 'RUNTIME_SUCCESS_CLAIM=NO_UNTIL_PHASE_A_RERUN'
          echo 'SECRET_VALUES_READ=0'
          echo 'UNRELATED_CONFIG_MUTATED=0'

  rollback-config:
    needs: [source-contract, cloudflare-readonly]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'rollback_config' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      actions: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRMATION: ${{ inputs.confirmation }}
      ROLLBACK_VERSION_ID: ${{ inputs.rollback_version_id }}
      PREMUTATION_RUN_ID: ${{ inputs.premutation_run_id }}
      CREDENTIAL_CREATED_BY_ACTIVATION: ${{ inputs.credential_created_by_activation }}
    steps:
      - name: Require explicit rollback authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${CONFIRMATION}" = "CONFIRM_ROLLBACK_B62_CLAW_LIVE_CONFIG"
          echo "${ROLLBACK_VERSION_ID}" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          echo "${PREMUTATION_RUN_ID}" | grep -Eq '^[0-9]+$'
          case "${CREDENTIAL_CREATED_BY_ACTIVATION}" in true|false) ;; *) exit 1;; esac
          echo 'B62_CLAW_LIVE_CONFIG_ROLLBACK_AUTHORIZATION=PASS'
          echo 'CODE_VERSION_ROLLBACK_AND_CONFIG_ROLLBACK_ARE_DISTINCT=YES'

      - name: Checkout exact approved main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconfirm exact main immediately before rollback
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'PREROLLBACK_EXACT_MAIN_SHA=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the recorded pre-activation code version (CODE_VERSION_ROLLBACK)
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          deployments="${RUNNER_TEMP}/b62-deployments-before-rollback.json"
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/deployments" \
            -o "${deployments}"
          current="$(jq -r '.result.deployments[0].versions[0].version_id // empty' "${deployments}")"
          if [ "${current}" = "${ROLLBACK_VERSION_ID}" ]; then
            echo 'CODE_VERSION_ROLLBACK=SKIPPED_ALREADY_RESTORED'
            echo 'PRODUCTION_MUTATION=0'
            exit 0
          fi
          payload="${RUNNER_TEMP}/b62-rollback-deployment.json"
          python - "${payload}" "${ROLLBACK_VERSION_ID}" "${TARGET_SHA}" <<'PY'
          import json, sys
          body = {
              "strategy": "percentage",
              "versions": [{"percentage": 100, "version_id": sys.argv[2]}],
              "annotations": {
                  "workers/message": f"B62 Claw live config rollback to {sys.argv[2]} at {sys.argv[3]}",
                  "workers/triggered_by": "b62-claw-live-config-activation-gate",
              },
          }
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(body, handle, separators=(",", ":"))
          PY
          response="${RUNNER_TEMP}/b62-rollback-response.json"
          http_status="$(
            curl -sS -X POST "${auth[@]}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/deployments" \
              --data-binary "@${payload}" \
              -o "${response}" \
              -w '%{http_code}'
          )"
          echo "B62_CLAW_CONFIG_ROLLBACK_HTTP_STATUS=${http_status}"
          if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
            echo 'B62_CLAW_LIVE_CONFIG_ROLLBACK=FAIL'
            if jq -e . "${response}" >/dev/null 2>&1; then
              jq -c '{success, errors: [(.errors // [])[] | {code, message}]}' "${response}"
            else
              echo 'CLOUDFLARE_ERROR_BODY_JSON=NO'
            fi
            exit 1
          fi
          jq -e '.success == true' "${response}" >/dev/null
          echo 'CODE_VERSION_ROLLBACK=SUBMITTED'
          echo 'PRODUCTION_MUTATION=1'
          echo 'CODE_VERSION_ROLLBACK_IS_NOT_CONFIG_ROLLBACK=YES'

      - name: Read back the restored active code version
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          restored=no
          for _ in $(seq 1 30); do
            deployments="${RUNNER_TEMP}/b62-deployments-after-rollback.json"
            curl -fsS "${auth[@]}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/deployments" \
              -o "${deployments}"
            active="$(jq -r '.result.deployments[0].versions[0].version_id // empty' "${deployments}")"
            if [ "${active}" = "${ROLLBACK_VERSION_ID}" ] && jq -e '.result.deployments[0].versions | length == 1 and .[0].percentage == 100' "${deployments}" >/dev/null 2>&1; then
              restored=yes
              break
            fi
            sleep 2
          done
          test "${restored}" = yes
          echo 'CODE_VERSION_ROLLBACK_READBACK=PASS'
          echo 'CODE_VERSION_ROLLBACK_MECHANISM=VERSION_TARGET_RESTORED'
          echo 'CONFIG_ROLLBACK=PENDING_SNAPSHOT_BOUNDED_RESTORE'

      - name: Download the bounded pre-mutation settings snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_name="$(gh run view "${PREMUTATION_RUN_ID}" --json workflowName -q .workflowName)"
          test "${workflow_name}" = "B62 Claw Live Config Activation Gate"
          gh run download "${PREMUTATION_RUN_ID}" \
            --name b62-claw-config-premutation-settings \
            --dir "${RUNNER_TEMP}/b62-rollback-snapshot"
          snapshot="${RUNNER_TEMP}/b62-rollback-snapshot/b62-settings-premutation.json"
          test -s "${snapshot}"
          jq -e '.success == true and (.result.bindings | type == "array")' "${snapshot}" >/dev/null
          echo 'CONFIG_ROLLBACK_EVIDENCE=BOUNDED_PREMUTATION_SNAPSHOT'
          echo 'SECRET_VALUES_READ=0'
          echo "CONFIG_SNAPSHOT_PATH=${snapshot}" >> "${GITHUB_ENV}"

      - name: Read current live settings for the config rollback plan
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          settings="${RUNNER_TEMP}/b62-settings-current-for-rollback.json"
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" \
            -o "${settings}"
          jq -e '.success == true and (.result.bindings | type == "array")' "${settings}" >/dev/null
          jq -c '.result.bindings | map({name, type})' "${settings}"
          echo 'BINDING_NAME_AND_TYPE_ONLY=YES'
          echo 'SECRET_VALUES_READ=0'

      - name: Plan the snapshot-bounded config restore (CONFIG_ROLLBACK)
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/b62-config-rollback-patch.json"
          plan_log="${RUNNER_TEMP}/b62-config-rollback-plan.log"
          set +e
          python .github/scripts/b62_claw_live_config_activation.py rollback-plan \
            --settings "${RUNNER_TEMP}/b62-settings-current-for-rollback.json" \
            --snapshot "${CONFIG_SNAPSHOT_PATH}" \
            --credential-created-by-activation "${CREDENTIAL_CREATED_BY_ACTIVATION}" \
            --target-sha "${TARGET_SHA}" \
            --output "${RUNNER_TEMP}/b62-config-rollback-patch.json" >"${plan_log}" 2>&1
          plan_status=$?
          set -e
          cat "${plan_log}"
          if [ "${plan_status}" -eq 3 ]; then
            echo 'CONFIG_ROLLBACK=MANUAL_CONFIG_RECOVERY_REQUIRED' >&2
            echo 'CODE_VERSION_ROLLBACK_UNAFFECTED=YES' >&2
            echo 'FULL_CONFIG_ROLLBACK_CLAIM=NO' >&2
            exit 1
          fi
          if [ "${plan_status}" -ne 0 ]; then
            echo 'CONFIG_ROLLBACK=FAIL' >&2
            exit 1
          fi
          no_op="$(sed -n 's/^B62_CLAW_CONFIG_ROLLBACK_NO_OP=//p' "${plan_log}")"
          test -n "${no_op}"
          echo "B62_CLAW_CONFIG_ROLLBACK_NO_OP=${no_op}" >> "${GITHUB_ENV}"
          echo 'CONFIG_ROLLBACK_SCOPE=SNAPSHOT_BOUNDED_SETTINGS_ONLY'
          echo 'PIECEMEAL_SECRET_RESTORE=0'
          echo 'SECRET_VALUES_READ=0'

      - name: Apply the snapshot-bounded config restore through the settings API
        if: ${{ env.B62_CLAW_CONFIG_ROLLBACK_NO_OP != '1' }}
        shell: bash
        run: |
          set -euo pipefail
          response="${RUNNER_TEMP}/b62-config-rollback-patch-response.json"
          http_status="$(
            curl -sS -X PATCH \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -F "settings=<${RUNNER_TEMP}/b62-config-rollback-patch.json;type=application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" \
              -o "${response}" \
              -w '%{http_code}'
          )"
          echo "B62_CLAW_CONFIG_ROLLBACK_PATCH_HTTP_STATUS=${http_status}"
          if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
            echo 'CONFIG_ROLLBACK=FAIL'
            if jq -e . "${response}" >/dev/null 2>&1; then
              jq -c '{success, errors: [(.errors // [])[] | {code, message}]}' "${response}"
            else
              echo 'CLOUDFLARE_ERROR_BODY_JSON=NO'
            fi
            exit 1
          fi
          jq -e '.success == true and (.result.bindings | type == "array")' "${response}" >/dev/null
          echo 'CONFIG_ROLLBACK=SUBMITTED'
          echo 'PRODUCTION_MUTATION=1'
          echo 'WORKER_CODE_REDEPLOY=0'

      - name: Read back the restored config against the pre-mutation snapshot
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          exact=no
          for _ in $(seq 1 30); do
            settings="${RUNNER_TEMP}/b62-settings-after-config-rollback.json"
            curl -fsS "${auth[@]}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" \
              -o "${settings}"
            if python .github/scripts/b62_binding_state_guard.py \
              --before "${CONFIG_SNAPSHOT_PATH}" \
              --after "${settings}" >"${RUNNER_TEMP}/b62-config-rollback-guard.log" 2>&1; then
              exact=yes
              break
            fi
            sleep 2
          done
          cat "${RUNNER_TEMP}/b62-config-rollback-guard.log"
          test "${exact}" = yes
          echo 'CONFIG_ROLLBACK_READBACK=EXACT'
          echo 'FULL_CONFIG_ROLLBACK_CLAIM=READBACK_CONFIRMED_EXACT_SNAPSHOT'
          echo 'PIECEMEAL_SECRET_RESTORE=0'
          echo 'SECRET_VALUES_READ=0'
          echo 'UNRELATED_CONFIG_MUTATED=0'
