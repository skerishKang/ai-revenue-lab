name: B14 Padiem tier benchmark remaining once

on:
  push:
    branches:
      - test/b14-1457-complete-tier-benchmark

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v5

      - name: Install exact locked dependencies
        working-directory: apps/korean-ai-platform
        run: uv sync --group dev --frozen

      - name: Run remaining 17 bounded B14 cells
        working-directory: apps/korean-ai-platform
        env:
          B14_PROVIDER_MODE: live
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from __future__ import annotations

          import asyncio
          import json
          import os
          import time
          from pathlib import Path

          import httpx

          from app.pilot.completed_response_shape import classify_completed_response_structure
          from app.pilot.errors import PilotError, MalformedUpstreamResponse
          from app.pilot.kilo_provider import (
              KILO_LAGUNA_MODEL_ID,
              KILO_LAGUNA_UPSTREAM_MODEL,
              KILO_MINIMAX_M3_MODEL_ID,
              KILO_MINIMAX_M3_UPSTREAM_MODEL,
              KILO_NEMOTRON_MODEL_ID,
              KILO_NEMOTRON_UPSTREAM_MODEL,
              KILO_PROVIDER_ID,
          )
          from app.pilot.platform import call_platform_chat_completions

          corpus = json.loads(
              Path('../padiem-chat/tests/fixtures/padiem_tier_benchmark_v1.json').read_text(encoding='utf-8')
          )
          assert corpus['version'] == 'padiem-tier-benchmark-v1'
          assert corpus['data_policy'] == 'synthetic_non_sensitive_only'
          assert corpus['provider_calls_authorized'] is False
          assert len(corpus['cases']) == 6

          candidates = [
              {
                  'tier': 'Padiem Plus candidate',
                  'model_id': KILO_LAGUNA_MODEL_ID,
                  'upstream_model': KILO_LAGUNA_UPSTREAM_MODEL,
                  'provider': 'Kilo Gateway / Poolside',
              },
              {
                  'tier': 'Padiem Pro candidate',
                  'model_id': KILO_NEMOTRON_MODEL_ID,
                  'upstream_model': KILO_NEMOTRON_UPSTREAM_MODEL,
                  'provider': 'Kilo Gateway / NVIDIA',
              },
              {
                  'tier': 'Padiem Max candidate',
                  'model_id': KILO_MINIMAX_M3_MODEL_ID,
                  'upstream_model': KILO_MINIMAX_M3_UPSTREAM_MODEL,
                  'provider': 'Kilo Gateway / MiniMax',
              },
          ]

          MAX_CALLS = 17
          results = []
          call_count = 0
          stop_reason = None
          disposition = 'BENCHMARK_COMPLETE'
          capture = {'body': b'', 'status': None}
          original_post = httpx.AsyncClient.post

          async def capture_post(self, *args, **kwargs):
              response = await original_post(self, *args, **kwargs)
              capture['body'] = response.content
              capture['status'] = response.status_code
              return response

          httpx.AsyncClient.post = capture_post

          async def execute():
              global call_count, stop_reason, disposition
              try:
                  for case_index, case in enumerate(corpus['cases']):
                      # Valid Laguna/KR-CONV-001 evidence already exists in #1435.
                      active_candidates = candidates[1:] if case_index == 0 else candidates
                      for candidate in active_candidates:
                          if stop_reason:
                              return
                          if call_count >= MAX_CALLS:
                              stop_reason = 'MAX_PROVIDER_CALLS_REACHED'
                              disposition = 'BOUNDED_PARTIAL'
                              return

                          call_count += 1
                          capture['body'] = b''
                          capture['status'] = None
                          row = {
                              'call_index': call_count,
                              'tier': candidate['tier'],
                              'model_id': candidate['model_id'],
                              'requested_model': candidate['upstream_model'],
                              'case_id': case['id'],
                              'category': case['category'],
                              'rubric': case['rubric'],
                          }
                          started = time.monotonic()
                          try:
                              completed = await call_platform_chat_completions(
                                  model_id=candidate['model_id'],
                                  upstream_model=candidate['upstream_model'],
                                  provider=candidate['provider'],
                                  platform_provider_id=KILO_PROVIDER_ID,
                                  messages=[{'role': 'user', 'content': case['prompt']}],
                                  temperature=0.2,
                                  max_tokens=500,
                              )
                              wall_ms = int((time.monotonic() - started) * 1000)
                              choices = completed.get('choices') or []
                              text = ''
                              if choices and isinstance(choices[0], dict):
                                  message = choices[0].get('message') or {}
                                  if isinstance(message, dict):
                                      text = message.get('content') or ''

                              reported_model = completed.get('model') or ''
                              visible = bool(isinstance(text, str) and text.strip())
                              row.update({
                                  'result': 'PASS',
                                  'reported_model': reported_model,
                                  'latency_ms': completed.get('_upstream_latency_ms', wall_ms),
                                  'wall_ms': wall_ms,
                                  'response_text': text,
                                  'visible_content': visible,
                                  'usage': completed.get('usage'),
                              })
                              results.append(row)

                              if completed.get('_live') is not True or completed.get('_mock') is True:
                                  stop_reason = 'LIVE_EXECUTION_NOT_PROVEN'
                              elif not visible:
                                  stop_reason = 'VISIBLE_CONTENT_MISSING'
                              elif reported_model and reported_model != candidate['upstream_model']:
                                  stop_reason = 'MODEL_ROUTE_MISMATCH'

                              print(
                                  f"call={call_count} case={case['id']} tier={candidate['tier']} "
                                  f"result=PASS latency_ms={row['latency_ms']}"
                              )

                          except MalformedUpstreamResponse:
                              shape = classify_completed_response_structure(capture['body'])
                              fields = shape.safe_log_fields()
                              row.update({
                                  'result': 'MalformedUpstreamResponse',
                                  'response_text': '',
                                  'safe_structure': fields,
                                  'http_status': capture['status'],
                              })
                              results.append(row)
                              stop_reason = 'MalformedUpstreamResponse'
                          except PilotError as exc:
                              row.update({
                                  'result': type(exc).__name__,
                                  'error_code': exc.code,
                                  'response_text': '',
                                  'http_status': capture['status'],
                              })
                              results.append(row)
                              stop_reason = exc.code

                          if stop_reason:
                              disposition = 'BOUNDED_PARTIAL'
                              print(f"STOP_REASON={stop_reason}")
                              return
                          if call_count < MAX_CALLS:
                              await asyncio.sleep(2)
              finally:
                  httpx.AsyncClient.post = original_post

          asyncio.run(execute())

          output = {
              'benchmark_version': corpus['version'],
              'execution_authority': 'GitHub issue #1457',
              'source_sha': os.environ.get('GITHUB_SHA', ''),
              'prior_preserved_cell': 'KR-CONV-001 / Padiem Plus candidate / Laguna',
              'max_provider_calls': MAX_CALLS,
              'provider_calls_attempted': call_count,
              'parallelism': 1,
              'disposition': disposition,
              'stop_reason': stop_reason,
              'results': results,
          }
          Path('../../padiem-tier-benchmark-remaining-results.json').write_text(
              json.dumps(output, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(
              f"FINAL_DISPOSITION={disposition} PROVIDER_CALLS_ATTEMPTED={call_count} "
              f"STOP_REASON={stop_reason or 'NONE'}"
          )
          print("RAW_PROVIDER_BODY_PERSISTED=NO")
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: padiem-tier-benchmark-remaining-results
          path: padiem-tier-benchmark-remaining-results.json
          if-no-files-found: error
          retention-days: 7
