name: LoveTree Authority Caller CI

on:
  pull_request:
    paths:
      - 'apps/lovetree-authority-caller/**'
      - 'apps/lovetree-auth-caller/**'
      # 발급 중계가 소비하는 표의 정의(migration 073)와 전이 규칙이 이 lane의 검증 대상이다.
      - 'apps/padiem-chat/app/lovetree_auth_store.py'
      - 'apps/padiem-chat/migrations/073_lovetree_login_handoff.sql'
      - 'apps/padiem-chat/tests/test_lovetree_login_handoff.py'
      - '.github/workflows/lovetree-authority-caller-ci.yml'
  push:
    paths:
      - 'apps/lovetree-authority-caller/**'
      - 'apps/lovetree-auth-caller/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lovetree-authority-caller-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  caller-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 두 중계 Worker 모두 의존성이 없는 순수 ESM이라 npm 설치 없이 실행한다.
      # 파일 경로를 명시하고 통과 건 수를 세어, 건너뛴 채 통과하는 일을 막는다.
      - name: Run the read-only caller worker tests
        working-directory: apps/lovetree-authority-caller
        run: |
          node --test --test-reporter=tap test/worker.test.mjs > /tmp/caller.tap 2>&1 || { cat /tmp/caller.tap; exit 1; }
          cat /tmp/caller.tap
          pass=$(awk '/^# pass /{print $3}' /tmp/caller.tap)
          fail=$(awk '/^# fail /{print $3}' /tmp/caller.tap)
          skipped=$(awk '/^# skipped /{print $3}' /tmp/caller.tap)
          echo "read-only caller: pass=$pass fail=$fail skipped=$skipped"
          [ "${fail:-1}" = "0" ] || { echo "실패: 읽기 전용 중계 테스트 실패"; exit 1; }
          [ "${skipped:-1}" = "0" ] || { echo "실패: 읽기 전용 중계 테스트 skip"; exit 1; }
          [ "${pass:-0}" -ge 11 ] || { echo "실패: 읽기 전용 중계 테스트 11건 미만 실행"; exit 1; }

      - name: Run the login handoff caller worker tests
        working-directory: apps/lovetree-auth-caller
        run: |
          node --test --test-reporter=tap test/worker.test.mjs > /tmp/auth.tap 2>&1 || { cat /tmp/auth.tap; exit 1; }
          cat /tmp/auth.tap
          pass=$(awk '/^# pass /{print $3}' /tmp/auth.tap)
          fail=$(awk '/^# fail /{print $3}' /tmp/auth.tap)
          skipped=$(awk '/^# skipped /{print $3}' /tmp/auth.tap)
          echo "login handoff caller: pass=$pass fail=$fail skipped=$skipped"
          [ "${fail:-1}" = "0" ] || { echo "실패: 발급 중계 테스트 실패"; exit 1; }
          [ "${skipped:-1}" = "0" ] || { echo "실패: 발급 중계 테스트 skip"; exit 1; }
          [ "${pass:-0}" -ge 9 ] || { echo "실패: 발급 중계 테스트 9건 미만 실행"; exit 1; }

      # migration 073과 상태 전이는 이 lane에서 sqlite3로 실제로 검증한다.
      # --noconftest: 이 파일은 app.lovetree_auth_store(표준 라이브러리만 사용)과 sqlite3만 필요하므로
      # Chat 전체 의존성을 설치하지 않는다. 전체 회귀는 apps/padiem-chat 경로를 보는 B62 CI lane이 separately 돈다.
      - name: Run the login handoff store tests against real SQL
        working-directory: apps/padiem-chat
        run: |
          python3 -m venv /tmp/handoff-venv
          /tmp/handoff-venv/bin/pip install --quiet pytest pytest-asyncio
          /tmp/handoff-venv/bin/python -m pytest --noconftest -q tests/test_lovetree_login_handoff.py > /tmp/handoff.log 2>&1 || { cat /tmp/handoff.log; exit 1; }
          cat /tmp/handoff.log
          grep -qE "6 passed" /tmp/handoff.log || { echo "실패: handoff 저장 검증 6건이 실행되지 않았습니다"; exit 1; }
