name: CI Contract Tests (workflow/script changes)

# CTO 2026-11-02: a change under .github/workflows/ or .github/scripts/ can
# rewrite the CI contract itself, but no app path moves, so the Chat CI scope
# contract never ran for that PR. This lane runs the CI contract tests for
# exactly that surface: the Chat tests-only scope contract and the repository
# CI scope policy that pins the workflow paths, events and jobs.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-contract-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ci-contract-tests:
    name: CI contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --quiet 'pytest>=8,<10' 'PyYAML>=6,<7' 'httpx>=0.27,<1' 'starlette>=0.37,<1'

      - name: QA PC token provisioning contract
        run: python -m pytest -q .github/tests/test_provision_qa_pc_token_261114.py

      - name: Chat CI contract tests
        env:
          # The Chat tests conftest imports app.model_policy and the shared
          # control-plane declaration, and its ASGI hooks need the Chat
          # runtime's own httpx/starlette. The suite stays network-free.
          PYTHONPATH: apps/padiem-chat:packages/padiem-ai-core:packages/padiem-control-plane
        run: |
          set -euo pipefail
          python -m pytest -q apps/padiem-chat/tests/test_*ci*contract*.py

      - name: Repository CI scope policy
        run: python -m pytest -q docs/operations/tests/test_ci_scope_policy.py

      - name: Record the lane
        run: |
          echo 'CI_CONTRACT_TESTS=PASS'
          echo 'PRODUCTION_MUTATION=0'