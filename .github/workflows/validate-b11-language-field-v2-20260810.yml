name: Validate B11 Language Field V2 20260810
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'reference/business-11-language-learning-magazine-v1/**'
      - '.github/workflows/validate-b11-language-field-v2-20260810.yml'
permissions: {contents: read}
jobs:
  validate:
    if: github.event.pull_request.head.ref == 'design/b11-language-field-journal-v2-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.ref }}', fetch-depth: 0}
      - name: Static product contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          base=Path('reference/business-11-language-learning-magazine-v1')
          texts={r:(base/r).read_text(encoding='utf-8') for r in ('index.html','ux.html','guide.html')}
          for r,t in texts.items():
              assert 'language-field-v2.css' in t,r
              assert '.svg' not in t.lower(),r
              assert 'Phase 1' not in t and 'reference-only' not in t and 'Visual Atlas' not in t,r
          for marker in ('30초 사용법','오늘의 읽기','문장 다듬기','피드백'):
              assert all(marker in t for t in texts.values()),marker
          css=(base/'styles/language-field-v2.css').read_text(encoding='utf-8')
          for marker in ('READ → NOTICE → REWRITE → FEEDBACK → NEXT','.lf-hero','.lf-reader','.lf-guide-hero'):
              assert marker in css,marker
          for forbidden in ('fetch(', 'XMLHttpRequest', 'localStorage', 'document.cookie', 'serviceWorker'):
              assert forbidden not in '\n'.join(texts.values()),forbidden
          print('B11_LANGUAGE_FIELD_STATIC_PASS=1')
          PY
          git diff --check origin/main...HEAD -- 'reference/business-11-language-learning-magazine-v1/**'
      - name: Install Chromium and Korean fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p /tmp/b11-browser && cd /tmp/b11-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.54.1
          npx playwright install chromium
      - name: Browser learning journey and screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b11-evidence
          python3 -m http.server 4191 --directory reference/business-11-language-learning-magazine-v1 >/tmp/b11-http.log 2>&1 &
          server=$!; trap 'kill $server || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4191/index.html >/dev/null && break; sleep .5; done
          cd /tmp/b11-browser
          node <<'JS'
          const {chromium}=require('playwright');const fs=require('fs'),path=require('path');const out='/tmp/b11-evidence';
          async function clean(page,label){const d=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,svg:[...document.images].filter(i=>/\.svg(?:[?#]|$)/i.test(i.getAttribute('src')||'')).length,text:document.body.innerText}));if(d.sw>d.cw+1)throw new Error(`${label}: overflow ${d.sw}>${d.cw}`);if(d.svg)throw new Error(`${label}: SVG remains ${d.svg}`);if(/PHASE 1|reference-only|Visual Atlas/i.test(d.text))throw new Error(`${label}: old chrome`);return d}
          (async()=>{const browser=await chromium.launch({headless:true});const manifest={};for(const vp of [{name:'desktop',width:1440,height:1100},{name:'mobile',width:390,height:844}]){
            const root=await browser.newPage({viewport:{width:vp.width,height:vp.height}});await root.goto('http://127.0.0.1:4191/index.html',{waitUntil:'networkidle'});manifest[`${vp.name}-root`]=await clean(root,`${vp.name}:root`);await root.screenshot({path:path.join(out,`b11-root-${vp.name}.png`),fullPage:true});await root.close();
            const guide=await browser.newPage({viewport:{width:vp.width,height:vp.height}});await guide.goto('http://127.0.0.1:4191/guide.html',{waitUntil:'networkidle'});if(!(await guide.locator('body').innerText()).includes('GUIDE · 30 SECONDS'))throw new Error(`${vp.name}: guide marker`);manifest[`${vp.name}-guide`]=await clean(guide,`${vp.name}:guide`);await guide.screenshot({path:path.join(out,`b11-guide-${vp.name}.png`),fullPage:true});await guide.close();
            const ux=await browser.newPage({viewport:{width:vp.width,height:vp.height}});const err=[];ux.on('console',m=>{if(m.type()==='error')err.push(m.text())});ux.on('pageerror',e=>err.push(e.message));await ux.goto('http://127.0.0.1:4191/ux.html#read',{waitUntil:'networkidle'});const phrase=ux.locator('[data-key="came-alive"]');await phrase.click();if(!(await phrase.getAttribute('class')).includes('active'))throw new Error(`${vp.name}: phrase not active`);if(!(await ux.locator('#marginText').innerText()).includes('활기를 띠다'))throw new Error(`${vp.name}: margin note missing`);for(const id of ['vocab','revise','feedback']){await ux.locator(`[data-panel="${id}"]`).click();if(!(await ux.locator(`#${id}`).getAttribute('class')).includes('active'))throw new Error(`${vp.name}:${id} inactive`)}await ux.locator('#finish').click();if(!(await ux.locator('#finishStatus').innerText()).includes('because / as / while'))throw new Error(`${vp.name}: next point missing`);manifest[`${vp.name}-ux`]=await clean(ux,`${vp.name}:ux`);if(err.length)throw new Error(err.join('|'));await ux.screenshot({path:path.join(out,`b11-ux-${vp.name}.png`),fullPage:true});await ux.close();}
            fs.writeFileSync(path.join(out,'manifest.json'),JSON.stringify(manifest,null,2));await browser.close();console.log('B11_LANGUAGE_FIELD_BROWSER_PASS=1')})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: b11-language-field-v2-20260810, path: /tmp/b11-evidence, retention-days: 7, if-no-files-found: warn}
