name: Validate B16 Complete 465
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'reference/business-16-personal-sports-v1/**'
      - '.github/workflows/validate-b16-complete-465.yml'
permissions:
  contents: read
jobs:
  validate:
    if: github.event.pull_request.head.ref == 'feat/b16-personal-sports-complete-465'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static contract
        shell: bash
        run: |
          set -euo pipefail
          node --check reference/business-16-personal-sports-v1/app.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          base=Path('reference/business-16-personal-sports-v1')
          for name in ('index.html','ux.html','guide.html'):
              HTMLParser().feed((base/name).read_text(encoding='utf-8'))
          index=(base/'index.html').read_text(encoding='utf-8')
          ux=(base/'ux.html').read_text(encoding='utf-8')
          guide=(base/'guide.html').read_text(encoding='utf-8')
          js=(base/'app.js').read_text(encoding='utf-8')
          for marker in ('나의 매치데이 노트','data-state-target="matchday"','data-state-target="review"','data-state-target="season"','합성 경기 데이터'):
              assert marker in index, marker
          for marker in ('id="today"','id="teams"','id="match"','id="saved"','data-save="첫 압박 전환"','id="finish"','window.onpopstate'):
              assert marker in ux, marker
          for marker in ('GUIDE · 30 SECONDS','01 · GAME','02 · FOCUS','03 · FLOW','04 · MOMENTS','05 · WRAP','./ux.html#today'):
              assert marker in guide, marker
          assert './guide.html' in js and 'dataset.firstUseGuide' in js
          for forbidden in ('fetch(', 'XMLHttpRequest', 'localStorage', 'document.cookie', 'serviceWorker'):
              assert forbidden not in ux+'\n'+guide+'\n'+js, forbidden
          for html in ('index.html','guide.html'):
              text=(base/html).read_text(encoding='utf-8')
              for rel in re.findall(r'(?:href|src)="(\./[^"?#]+)', text):
                  assert (base/rel[2:]).exists(), (html,rel)
          print('B16_STATIC_CONTRACT_PASS=1')
          PY
          git diff --check origin/main...HEAD -- 'reference/business-16-personal-sports-v1/**'
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b16-browser && cd /tmp/b16-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.54.1
          npx playwright install chromium
      - name: Browser journey desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --directory reference/business-16-personal-sports-v1 >/tmp/b16-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4174/index.html >/dev/null && break; sleep 0.5; done
          cd /tmp/b16-browser
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const vp of [{width:1440,height:1100,name:'desktop'},{width:390,height:844,name:'mobile'}]){
              const page=await browser.newPage({viewport:{width:vp.width,height:vp.height}});
              const errors=[];
              page.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`)});
              page.on('pageerror',e=>errors.push(`page:${e.message}`));
              await page.goto('http://127.0.0.1:4174/index.html',{waitUntil:'networkidle'});
              await page.locator('[data-first-use-guide]').waitFor({state:'visible'});
              if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth)) throw new Error(`${vp.name}: root overflow`);
              await page.locator('[data-first-use-guide]').click();
              await page.waitForURL(/guide\.html/);
              if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth)) throw new Error(`${vp.name}: guide overflow`);
              await page.getByRole('link',{name:'오늘 경기 시작'}).click();
              await page.waitForURL(/ux\.html#today/);
              await page.getByRole('button',{name:'경기 흐름 보기'}).click();
              const save=page.locator('[data-save]');
              await save.nth(0).click();
              await save.nth(1).click();
              await page.getByRole('button',{name:'내 장면 보기'}).click();
              const savedArticles=page.locator('#savedList article');
              if(await savedArticles.count()!==2) throw new Error(`${vp.name}: expected 2 saved moments`);
              await page.locator('#finish').click();
              const status=await page.locator('#savedStatus').textContent();
              if(!status || !status.includes('요약을 마쳤습니다')) throw new Error(`${vp.name}: finish status missing`);
              if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth)) throw new Error(`${vp.name}: ux overflow`);
              if(errors.length) throw new Error(`${vp.name}: ${errors.join(' | ')}`);
              await page.close();
            }
            await browser.close();
            console.log('B16_BROWSER_JOURNEY_PASS=1');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
