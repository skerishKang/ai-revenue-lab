name: B14 Candidate Live Smoke (provider-neutral)

# Provider-neutral bounded acceptance gate for B14 candidates (#2798).
#
# This workflow is the shared source/test contract that generalizes the
# Agnes-only live-smoke pattern. It performs NO live provider call unless a
# human explicitly dispatches it with the exact main SHA, the exact candidate
# id, the exact B14 Worker version, and the confirmation marker.
#
# It never merges, deploys, mutates Production, or changes product routing.
# It cannot select the AUTO lane: the candidate id must be an allowlisted
# manual-pin candidate, and `b14/auto` is explicitly rejected by the script.

on:
  pull_request:
    paths:
      - '.github/scripts/b14_candidate_live_smoke.py'
      - '.github/tests/test_b14_candidate_live_smoke.py'
      - '.github/workflows/b14-candidate-live-smoke.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact current main SHA authorized for this one-shot candidate live smoke'
        required: true
      candidate_id:
        description: 'Allowlisted candidate id (agnes|sensenova|poolside|motif|mercury|atria|luna)'
        required: true
      expected_b14_version:
        description: 'Exact B14 Worker version that must still be serving 100%'
        required: true
      confirmation:
        description: 'Type RUN_B14_CANDIDATE_LIVE_SMOKE_ONCE'
        required: true

permissions:
  contents: read

concurrency:
  group: b14-candidate-live-smoke
  cancel-in-progress: false

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source under review
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_sha || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Exact-main dispatch preflight
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.inputs.target_sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.event.inputs.target_sha }}"
          echo 'PREFLIGHT_EXACT_MAIN=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run bounded neutral smoke contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest
          python -m pytest -q .github/tests/test_b14_candidate_live_smoke.py

      - name: Pin the provider-neutral contract
        shell: bash
        run: |
          set -euo pipefail
          script=.github/scripts/b14_candidate_live_smoke.py
          grep -Fq 'MAX_PROVIDER_CALLS = 1' "${script}"
          grep -Fq 'RETRY = 0' "${script}"
          grep -Fq 'FALLBACK = 0' "${script}"
          grep -Fq 'AUTO_MODEL_ID = "b14/auto"' "${script}"
          grep -Fq 'DEFAULT_LIVE_EXECUTION=BLOCKED' "${script}"
          grep -Fq 'PRIVATE_PAYLOAD_OUTPUT=0' "${script}"
          grep -Fq 'SECRET_VALUE_OUTPUT=0' "${script}"
          grep -Fq 'PRODUCTION_MUTATION=0' "${script}"
          # Exclusion proof: B.AI Qwen3.8 must appear only as excluded.
          grep -Fq '"b-ai/qwen3.8-flash"' "${script}"
          grep -Fq 'EXCLUDED_CANDIDATE_IDS' "${script}"
          # The neutral module must never alias the AUTO lane to a candidate.
          if grep -Fq 'model_id="b14/auto"' "${script}"; then
            echo 'AUTO_LANE_ALIASED=1'
            exit 1
          fi
          echo 'CANDIDATE_SMOKE_SOURCE_CONTRACT=PASS'

      - name: Pin canonical served-version reuse (BLOCKER 1)
        shell: bash
        run: |
          set -euo pipefail
          script=.github/scripts/b14_candidate_live_smoke.py
          wf=.github/workflows/b14-candidate-live-smoke.yml
          # The canonical resolver must be imported, not reimplemented.
          grep -Fq 'from cloudflare_served_version import' "${script}"
          grep -Fq 'resolve_served_version_id' "${script}"
          grep -Fq 'resolve_served_version_id(payload)' "${wf}"
          grep -Fq 'CANONICAL_SERVED_VERSION_REUSED=YES' "${wf}"
          grep -Fq 'HISTORICAL_DEPLOYMENT_ACCEPTED=NO' "${wf}"

          # Negative pins. The embedded Python is extracted by line range so
          # this step's own guard text cannot self-match the forbidden shapes,
          # and comments/docstrings are stripped so prose describing the
          # canonical rule is not mistaken for a local reimplementation.
          python3 - <<'PY'
          import ast
          import sys
          import tokenize
          from io import StringIO
          from pathlib import Path

          def code_only_script(text: str) -> str:
              """Return script text with comments and docstrings removed."""
              out = []
              for tok in tokenize.generate_tokens(StringIO(text).readline):
                  if tok.type == tokenize.COMMENT:
                      continue
                  out.append(tok.string)
              stripped = "\n".join(out)
              docs = []
              for node in ast.walk(ast.parse(text)):
                  body = getattr(node, "body", None)
                  if not isinstance(body, list) or not body:
                      continue
                  first = body[0]
                  if isinstance(first, ast.Expr) and isinstance(first.value, ast.Constant):
                      if isinstance(first.value.value, str):
                          docs.append(first.value.value)
              for doc in docs:
                  stripped = stripped.replace(doc, "")
              return stripped

          script_src = code_only_script(
              Path(".github/scripts/b14_candidate_live_smoke.py").read_text(encoding="utf-8")
          )
          wf_lines = Path(
              ".github/workflows/b14-candidate-live-smoke.yml"
          ).read_text(encoding="utf-8").splitlines()

          # The workflow's embedded resolver Python, bounded by its heredoc.
          embedded_raw = ""
          for idx, line in enumerate(wf_lines):
              if "<<'PY'" not in line:
                  continue
              end = next(
                  (i for i in range(idx + 1, len(wf_lines)) if wf_lines[i].strip() == "PY"),
                  None,
              )
              if end is None:
                  continue
              block = "\n".join(wf_lines[idx + 1 : end])
              try:
                  dedented = "\n".join(
                      l[min(len(l) - len(l.lstrip()), 10):] for l in block.splitlines()
                  )
                  ast.parse(dedented)
              except SyntaxError:
                  continue
              if "resolve_served_version_id" in block:
                  embedded_raw = block
                  break
          if not embedded_raw:
              print("CANONICAL_DELEGATION_MISSING=1")
              sys.exit(1)

          def code_only_wf(text: str) -> str:
              keep = []
              for line in text.splitlines():
                  s = line.strip()
                  if s.startswith("#") or not s:
                      continue
                  keep.append(line)
              return "\n".join(keep)

          embedded_code = code_only_wf(embedded_raw)

          scan_loop = "for " + "deployment in deployments"
          entry_index = "deployments" + "[0]"
          reserialized = 'result"' + ', {}).get("deployments")'
          forbidden = (scan_loop, entry_index, reserialized)

          hits = []
          if any(t in script_src for t in forbidden):
              hits.append("script")
          if any(t in embedded_code for t in forbidden):
              hits.append("workflow_embedded_python")
          if hits:
              print("LOCAL_DEPLOYMENT_SCAN=1")
              print("SCAN_LOCATION=" + ",".join(hits))
              sys.exit(1)

          if "resolve_served_version_id(payload)" not in embedded_raw:
              print("CANONICAL_DELEGATION_MISSING=1")
              sys.exit(1)
          print("LOCAL_DEPLOYMENT_SCAN=0")
          print("CANONICAL_SERVED_VERSION_REUSE_CONTRACT=PASS")
          PY

      - name: Pin closed safe error-code vocabulary (BLOCKER 2)
        shell: bash
        run: |
          set -euo pipefail
          script=.github/scripts/b14_candidate_live_smoke.py
          grep -Fq 'SAFE_ENGINE_ERROR_CODES' "${script}"
          grep -Fq 'return code if code in SAFE_ENGINE_ERROR_CODES else "unknown"' "${script}"
          # The pre-fix shape echoed any bounded-length upstream string; assert
          # the legacy projection is gone without self-matching this step.
          python3 - <<'PY'
          import sys
          from pathlib import Path

          source = Path(
              ".github/scripts/b14_candidate_live_smoke.py"
          ).read_text(encoding="utf-8")
          legacy = (
              "return code if isinstance(code, str) "
              'and 1 <= len(code) <= 96 else "unknown"'
          )
          if legacy in source:
              print("ARBITRARY_ERROR_CODE_ECHO=1")
              sys.exit(1)
          print("ARBITRARY_ERROR_CODE_ECHO=0")
          print("CLOSED_ERROR_CODE_VOCABULARY_CONTRACT=PASS")
          PY

      - name: Pin the Agnes contract is unbroken
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q .github/tests/test_b14_agnes_production_smoke.py

      - name: Pin the canonical served-version resolver is unbroken
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q .github/tests/test_cloudflare_served_version.py

  live-candidate-smoke:
    needs: source-contract
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirmation == 'RUN_B14_CANDIDATE_LIVE_SMOKE_ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_B14_VERSION: ${{ github.event.inputs.expected_b14_version }}
      CANDIDATE_ID: ${{ github.event.inputs.candidate_id }}
    steps:
      - name: Checkout exact authorized main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_sha }}
          persist-credentials: false

      - name: Re-check exact current main before live call
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.inputs.target_sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.event.inputs.target_sha }}"
          echo 'LIVE_EXACT_MAIN=PASS'

      - name: Reject non-allowlisted or excluded candidate ids
        shell: bash
        run: |
          set -euo pipefail
          echo "${CANDIDATE_ID}" | grep -Eq '^[a-z0-9.-]{1,32}$'
          case "${CANDIDATE_ID}" in
            agnes|sensenova|poolside|motif|mercury|atria|luna) ;;
            *) echo 'CANDIDATE_NOT_ALLOWLISTED=1'; exit 1 ;;
          esac
          echo "CANDIDATE_ID_ALLOWLISTED=${CANDIDATE_ID}"

      - name: GET-only B14 served-version guard (canonical resolver)
        shell: bash
        run: |
          set -euo pipefail
          echo "${EXPECTED_B14_VERSION}" | grep -Eq '^[A-Za-z0-9._-]{1,64}$'
          deployments="${RUNNER_TEMP}/b14-deployments.json"
          curl -fsS             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/ai-revenue-korean-ai-platform/deployments"             -o "${deployments}"
          # The active-served-version rules are NOT reimplemented here. The whole
          # envelope is handed to the shared canonical resolver, which requires
          # result.deployments[0] to be the active deployment carrying exactly
          # one version at 100 percent with a safe version_id. Walking every
          # deployment in history would let a superseded 100 percent deployment
          # satisfy this guard, so that shape is refused by construction.
          python3 - "${deployments}" "${EXPECTED_B14_VERSION}" <<'PY'
          import json
          import sys
          from pathlib import Path

          scripts_dir = Path(".github/scripts").resolve()
          sys.path.insert(0, str(scripts_dir))

          from cloudflare_served_version import (  # noqa: E402
              ServedVersionReason,
              ServedVersionResolutionError,
              resolve_served_version_id,
          )

          payload_path, expected = sys.argv[1:3]
          print(f"B14_EXPECTED_VERSION={expected}")
          with open(payload_path, encoding="utf-8") as fh:
              payload = json.load(fh)

          try:
              served = resolve_served_version_id(payload)
          except ServedVersionResolutionError as exc:
              print(f"CANONICAL_SERVED_VERSION_RESOLVED=NO")
              print(f"CANONICAL_SERVED_VERSION_REASON={exc.reason}")
              raise SystemExit(f"served-version guard failed closed: {exc.reason}")

          if served != expected:
              print(f"CANONICAL_SERVED_VERSION_RESOLVED=NO")
              print(f"CANONICAL_SERVED_VERSION_REASON={ServedVersionReason.VERSION_ID}")
              print(f"B14_SERVED_VERSION_MISMATCH=YES")
              raise SystemExit("active served version does not match expected version")

          print(f"CANONICAL_SERVED_VERSION_RESOLVED={served}")
          print("CANONICAL_SERVED_VERSION_REUSED=YES")
          print("HISTORICAL_DEPLOYMENT_ACCEPTED=NO")
          print("B14_EXPECTED_VERSION_AT_100=PASS")
          print('PRODUCTION_MUTATION=0')
          PY

      - name: Execute exactly one bounded candidate live smoke request
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/candidate-live-smoke.log"
          upper="$(echo "${CANDIDATE_ID}" | tr '[:lower:]-' '[:upper:]_')"
          python .github/scripts/b14_candidate_live_smoke.py "${CANDIDATE_ID}" --authorized-live-run | tee "${log}"
          grep -qx "${upper}_PRODUCTION_SMOKE=PASS" "${log}"
          grep -qx "${upper}_PROVIDER_REGISTERED=YES" "${log}"
          grep -qx "${upper}_CREDENTIAL_READY=YES" "${log}"
          grep -qx "${upper}_ROUTE_REGISTERED=YES" "${log}"
          grep -qx "${upper}_EXACT_MODEL_IDENTITY=PASS" "${log}"
          grep -qx "${upper}_ACTUAL_RESPONSE_MODEL_EVIDENCE=PASS" "${log}"
          grep -qx "${upper}_PROVIDER_MATCH=YES" "${log}"
          grep -qx "${upper}_FALLBACK_USED=NO" "${log}"
          grep -qx "${upper}_ATTEMPT_COUNT=1" "${log}"
          grep -qx 'B14_CHAT_POST_COUNT=1' "${log}"
          grep -qx 'NETWORK_RETRY_COUNT=0' "${log}"
          grep -qx 'MAX_PROVIDER_CALLS=1' "${log}"
          grep -qx 'RETRY=0' "${log}"
          grep -qx 'FALLBACK=0' "${log}"
          grep -qx 'AUTO_ROUTE_USED=0' "${log}"
          grep -qx 'RAW_RESPONSE_CONTENT_OUTPUT=0' "${log}"
          grep -qx 'PRIVATE_PAYLOAD_OUTPUT=0' "${log}"
          grep -qx 'SECRET_VALUE_OUTPUT=0' "${log}"

      - name: Record immutable execution locks
        if: always()
        shell: bash
        run: |
          echo 'WORKFLOW_INTERNAL_RERUN=0'
          echo 'B14_DEPLOY=0'
          echo 'ENGINE_DEPLOY=0'
          echo 'SECRET_MUTATION=0'
          echo 'SECRET_VALUE_OUTPUT=0'
          echo 'D1_MUTATION=0'
          echo 'GMAIL_MUTATION=0'
          echo 'ROUTING_MUTATION=0'
          echo 'PRODUCT_TIER_MUTATION=0'
          echo 'PRODUCTION_MUTATION=0'
