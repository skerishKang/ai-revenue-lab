name: B62 Mobile Touch Target QA

on:
  pull_request:
    paths:
      - 'apps/padiem-chat/static/padiem-first-use.css'
      - '.github/scripts/b62_mobile_touch_target_qa.py'
      - '.github/workflows/b62-mobile-touch-target-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-touch-target-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PADIEM_CHAT_RUNTIME_MODE: mock
      PADIEM_CHAT_LIVE_ENABLED: 'false'
      PADIEM_CHAT_WEB_PROVIDER: off
      B62_TOUCH_QA_BASE_URL: http://127.0.0.1:8784
      B62_TOUCH_QA_OUT_DIR: ../../.tmp/b62-mobile-touch-target-qa
    defaults:
      run:
        working-directory: apps/padiem-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.5'
      - name: Resolve B62
        run: uv sync --extra dev
      - name: Compile touch-target QA
        run: uv run python -m py_compile ../../.github/scripts/b62_mobile_touch_target_qa.py
      - name: Install pinned Playwright
        run: uv pip install 'playwright==1.55.0'
      - name: Install Chromium runtime
        run: uv run playwright install --with-deps chromium
      - name: Start mock Padiem Chat
        run: |
          set -euo pipefail
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8784 > /tmp/b62-touch-browser-server.log 2>&1 &
          echo $! > /tmp/b62-touch-browser-server.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8784/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/b62-touch-browser-server.log
          exit 1
      - name: Verify 390x844 mobile touch targets
        run: uv run python ../../.github/scripts/b62_mobile_touch_target_qa.py
      - name: Print QA report
        if: always()
        run: |
          if [ -f ../../.tmp/b62-mobile-touch-target-qa/report.json ]; then
            cat ../../.tmp/b62-mobile-touch-target-qa/report.json
          fi
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b62-mobile-touch-target-qa
          path: .tmp/b62-mobile-touch-target-qa
          if-no-files-found: error
          retention-days: 14
