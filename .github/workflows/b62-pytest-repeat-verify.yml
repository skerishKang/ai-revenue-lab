name: B62 pytest repeat verify

# #7065: flake 판정용. 지정한 pytest 파일을 N회 연속 실행해 "실패 0"을 확인한다.
# b62-padiem-chat-ci.yml의 workflow_dispatch에는 입력이 없고 전체 회귀만 돌기
# 때문에, 단일 파일 반복 검증은 이 워크플로로 수동 실행한다. 잡은 수동 dispatch에만
# 존재하고 PR·push 경로에 끼지 않는다.
#
# 실패뿐 아니라 skip도 실패로 취급한다(--rs 요약에서 skipped를 금지). 브라우저
# 계약 시험이 runner 이미지 변화로 조용히 건너뛰어지는 것을 막는 fail-closed 장치다.

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "apps/padiem-chat 기준 pytest 파일 경로"
        required: false
        default: "tests/test_7065_session_card_browser.py"
      repeat:
        description: "연속 실행 횟수"
        required: false
        default: "10"

permissions:
  contents: read

concurrency:
  group: b62-pytest-repeat-verify-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  repeat:
    name: Repeat pytest until the count is clean
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/padiem-chat
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: apps/padiem-chat/uv.lock
      - name: Verify committed host lock is current
        run: uv lock --check
      - name: Locked B62 test dependencies
        run: uv sync --locked --extra dev
      - name: Chromium binary present (install pinned one only if the image has none)
        run: |
          if command -v chromium >/dev/null 2>&1 \
             || command -v chromium-browser >/dev/null 2>&1 \
             || command -v google-chrome >/dev/null 2>&1; then
            echo "system browser found: $(command -v chromium || command -v chromium-browser || command -v google-chrome)"
          else
            uv run playwright install --with-deps chromium
          fi
      - name: Repeat the selected tests (fail closed on failure and skip)
        env:
          TESTS: ${{ inputs.tests }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          set -euo pipefail
          test -f "$TESTS"
          case "$REPEAT" in ''|*[!0-9]*) echo "repeat must be a positive integer"; exit 1;; esac
          [ "$REPEAT" -ge 1 ]
          total=0
          for i in $(seq 1 "$REPEAT"); do
            set +e
            out="$(uv run --locked python -m pytest -q -rs "$TESTS" 2>&1)"
            status=$?
            set -e
            echo "== run $i/$REPEAT (exit $status) =="
            printf '%s\n' "$out" | tail -3
            if [ "$status" -ne 0 ]; then
              echo "::error::pytest failed on run $i"
              exit 1
            fi
            if printf '%s' "$out" | grep -qi 'skipped'; then
              echo "::error::a test was skipped; the browser must run, never skip"
              exit 1
            fi
            passes="$(printf '%s' "$out" | grep -oE '[0-9]+ passed' | head -1 | grep -oE '[0-9]+' || true)"
            if [ -z "$passes" ] || [ "$passes" -eq 0 ]; then
              echo "::error::no passing tests counted"
              exit 1
            fi
            total=$((total + passes))
          done
          echo "repeat verify: $REPEAT runs, $total passing test results, 0 failures, 0 skips"
