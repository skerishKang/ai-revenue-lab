name: Deploy B06 Signal Stage V3 20260810

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/deploy-b06-signal-stage-v3-20260810.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.pull_request.head.ref == 'ops/deploy-b06-signal-stage-v3-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA: 69ca3a58ead9692d059bb2f359ae6566aed40da5
      PROJECT: 06-world-feed
      URL: https://06-world-feed.pages.dev/
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Assert exact current main and V3 source markers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          grep -q 'signature-scene-v3.css' reference/business-06-world-feed-v1/index.html
          grep -q 'signature-scene-v3.js' reference/business-06-world-feed-v1/index.html
          node --check reference/business-06-world-feed-v1/scripts/signature-scene-v3.js

      - name: Deploy exact main B06
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy reference/business-06-world-feed-v1 \
            --project-name "$PROJECT" --branch main \
            --commit-hash "$EXPECTED_SHA" \
            --commit-message 'B06 World Feed Signal Stage V3 exact main'

      - name: Verify public canonical bytes
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 35); do
            html=$(curl -L -sS --max-time 20 "$URL" || true)
            css=$(curl -L -sS --max-time 20 "${URL}styles/signature-scene-v3.css" || true)
            js=$(curl -L -sS --max-time 20 "${URL}scripts/signature-scene-v3.js" || true)
            if grep -q 'signature-scene-v3.css' <<<"$html" \
              && grep -q 'signature-scene-v3.js' <<<"$html" \
              && grep -q 'wf-signal-stage' <<<"$css" \
              && grep -q 'THE WORLD' <<<"$js"; then
              echo 'B06_SIGNAL_STAGE_V3_PUBLIC_BYTES_PASS=1'
              exit 0
            fi
            sleep 4
          done
          exit 1

      - name: Install isolated Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b06-prod-pw
          cd /tmp/b06-prod-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Canonical Production browser smoke and screenshots
        env:
          NODE_PATH: /tmp/b06-prod-pw/node_modules
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/b06-prod-evidence
          mkdir -p /tmp/b06-prod-evidence
          cat >/tmp/b06-prod-qa.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const assert = require('assert');
          const url = process.env.URL;

          async function inspect(browser, name, viewport, reducedMotion = 'no-preference') {
            const context = await browser.newContext({ viewport, reducedMotion });
            const page = await context.newPage();
            const errors = [];
            const badResponses = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
            page.on('console', msg => { if (msg.type() === 'error') errors.push(`console: ${msg.text()}`); });
            page.on('response', response => { if (response.status() >= 400) badResponses.push(`${response.status()} ${response.url()}`); });

            await page.goto(`${url}#feed`, { waitUntil: 'networkidle' });
            await page.waitForTimeout(350);
            const pre = await page.evaluate(() => {
              const stage = document.querySelector('.wf-signal-stage');
              const feed = document.querySelector('#view-feed');
              const variant = document.querySelector('#view-feed [data-feed-variant="default"]');
              return {
                href: location.href,
                reduced: matchMedia('(prefers-reduced-motion: reduce)').matches,
                readyState: document.readyState,
                hasStage: Boolean(stage),
                stageDisplay: stage ? getComputedStyle(stage).display : null,
                stageVisibility: stage ? getComputedStyle(stage).visibility : null,
                stageRect: stage ? stage.getBoundingClientRect().toJSON() : null,
                stageStep: stage?.dataset.stageStep || null,
                feedHidden: feed?.hidden ?? null,
                feedDisplay: feed ? getComputedStyle(feed).display : null,
                variantHidden: variant?.hidden ?? null,
                variantDisplay: variant ? getComputedStyle(variant).display : null,
                shellRoute: document.querySelector('.review-shell')?.dataset.route || null,
                htmlHasScript: [...document.scripts].some(s => (s.src || '').includes('signature-scene-v3.js')),
                reducedDataset: document.documentElement.dataset.reducedMotion || null,
                errors: [...document.querySelectorAll('script')].length
              };
            });
            fs.writeFileSync(`/tmp/b06-prod-evidence/${name}-pre.json`, JSON.stringify({ pre, errors, badResponses }, null, 2));
            await page.screenshot({ path: `/tmp/b06-prod-evidence/${name}-pre.png`, fullPage: true });

            await page.waitForSelector('#view-feed:not([hidden]) .wf-signal-stage', { state: 'visible', timeout: 12000 });
            await page.waitForFunction(() => document.querySelector('.wf-signal-stage')?.dataset.stageStep === '4', null, { timeout: 9000 });
            await page.waitForFunction(() => Number(getComputedStyle(document.querySelector('.wf-stage-brief')).opacity) > 0.95, null, { timeout: 3000 });

            const state = await page.evaluate(() => ({
              route: document.querySelector('.review-shell')?.dataset.route,
              step: document.querySelector('.wf-signal-stage')?.dataset.stageStep,
              overflow: document.documentElement.scrollWidth - window.innerWidth,
              activeRoutes: [...document.querySelectorAll('[data-route-view]')].filter(node => !node.hidden).length,
              briefOpacity: Number(getComputedStyle(document.querySelector('.wf-stage-brief')).opacity),
              stageWidth: document.querySelector('.wf-signal-stage')?.getBoundingClientRect().width || 0,
              visibleSvg: [...document.images].filter(img => {
                const src = img.getAttribute('src') || '';
                const rect = img.getBoundingClientRect();
                return /\.svg(?:[?#]|$)/i.test(src) && rect.width > 0 && rect.height > 0 && getComputedStyle(img).display !== 'none' && getComputedStyle(img).visibility !== 'hidden';
              }).length
            }));

            assert.equal(state.route, 'feed');
            assert.equal(state.step, '4');
            assert.equal(state.activeRoutes, 1);
            assert.ok(state.overflow <= 1, `${name}: horizontal overflow ${state.overflow}`);
            assert.ok(state.stageWidth > 300);
            assert.ok(state.briefOpacity > 0.95);
            assert.equal(state.visibleSvg, 0);
            assert.deepEqual(errors, [], `${name}: browser errors ${errors.join(' | ')}`);
            assert.deepEqual(badResponses, [], `${name}: bad responses ${badResponses.join(' | ')}`);

            await page.screenshot({ path: `/tmp/b06-prod-evidence/${name}.png`, fullPage: true });
            await page.click('.wf-stage-brief [data-open-story][data-story-id="harbor"]');
            await page.waitForFunction(() => location.hash === '#story' && !document.querySelector('#view-story')?.hidden);
            assert.equal(await page.evaluate(() => document.querySelector('.review-shell')?.dataset.storyId), 'harbor');
            await context.close();
            return { pre, state };
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const result = {};
            result.reduced = await inspect(browser, 'production-reduced-motion-1440x1100', { width: 1440, height: 1100 }, 'reduce');
            result.desktop = await inspect(browser, 'production-desktop-1440x1100', { width: 1440, height: 1100 });
            result.mobile = await inspect(browser, 'production-mobile-390x844', { width: 390, height: 844 });
            fs.writeFileSync('/tmp/b06-prod-evidence/results.json', JSON.stringify(result, null, 2));
            await browser.close();
            console.log(JSON.stringify(result, null, 2));
          })().catch(error => {
            fs.writeFileSync('/tmp/b06-prod-evidence/error.txt', `${error.stack || error}\n`);
            console.error(error);
            process.exit(1);
          });
          NODE
          node /tmp/b06-prod-qa.cjs

      - name: Upload canonical Production visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b06-signal-stage-v3-production-evidence-${{ github.run_number }}
          path: /tmp/b06-prod-evidence
          if-no-files-found: error
