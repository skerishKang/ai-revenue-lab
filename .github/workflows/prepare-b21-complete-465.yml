name: Prepare B21 Complete 465
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/prepare-b21-complete-465.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'ops/prepare-b21-complete-465'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize approved B21 UI plus existing UX on exact main
        shell: bash
        env:
          EXPECTED_MAIN: 63bd8267ac23131275106e688aacab05f4a27c09
          TARGET_BRANCH: feat/b21-founder-strategy-letter-complete-465
          UI_BRANCH: feat/business-21-founder-strategy-letter-ui
          UX_BRANCH: feat/business-21-founder-strategy-letter-ux-396
          SCOPE: reference/business-21-founder-strategy-letter-v1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          git fetch origin "$UI_BRANCH" "$UX_BRANCH"
          test "$(git rev-parse origin/$UI_BRANCH)" = e5e6ca6a5342da30b553697f96484c35a64b22c6
          test "$(git rev-parse origin/$UX_BRANCH)" = 5f18d9a727c9fe4e1ea492657dfd72189b3f2a73
          if git ls-tree -r --name-only HEAD -- "$SCOPE" | grep -q .; then
            echo 'B21 scope unexpectedly exists on current main; refusing overwrite' >&2
            exit 1
          fi
          git switch -c "$TARGET_BRANCH"
          git checkout "origin/$UI_BRANCH" -- "$SCOPE"
          git checkout "origin/$UX_BRANCH" -- "$SCOPE/ux.html"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$SCOPE"
          git diff --cached --check
          git commit -m 'feat(b21): integrate approved strategy-letter UI and decision UX'
          git push origin "$TARGET_BRANCH"
          echo B21_PREPARE_PASS=1
