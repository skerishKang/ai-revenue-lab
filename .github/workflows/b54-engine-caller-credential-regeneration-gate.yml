name: B54 Engine Caller Credential Regeneration Gate

# P0 ACT-1 — SOURCE ONLY orchestration gate for a NEW B54 Engine caller
# credential regeneration. This file is never executed in ACT-1:
#   ADMIN_TOKEN_INSTALL=NO  GITHUB_SECRET_MUTATION=0  NEW_SECRET_GENERATION=0
#
# Why a dedicated admin authority (CENTRAL correction): the built-in
# GITHUB_TOKEN has NO secrets-write permission scope in GitHub Actions, so
# piping the built-in token into `gh secret set` is FORBIDDEN. Repository
# Actions-secret update authority must be a separate privileged credential.
# Authority split (CENTRAL blocking fix): SECRET_WRITE_TOKEN=DEDICATED_ADMIN —
# the single `gh secret set` is authenticated ONLY with the inline admin-token
# binding; WORKFLOW_DISPATCH_TOKEN=BUILTIN_GITHUB_TOKEN — every Actions
# orchestration step (`gh workflow run` / `gh run list` / `gh run watch` /
# `gh run view`) is bound to the built-in token at step level, because the
# admin token is NOT assumed to hold Actions permissions either.
# Chosen model (matches the repo's existing operating pattern of dedicated
# API-token secrets such as B62_R2_READONLY_API_TOKEN / CLOUDFLARE_API_TOKEN;
# there is no GitHub-App private-key precedent in CI):
#   explicit dedicated fine-grained PAT with repository Secrets:write,
#   stored as repository Actions secret B62_GITHUB_SECRET_ADMIN_TOKEN.
# The admin token is a DIFFERENT secret from the regeneration target
# (B62_GITHUB_SECRET_ADMIN_TOKEN != B62_P01_ENGINE_CREDENTIAL) and this
# workflow never loads ${{ secrets.B62_P01_ENGINE_CREDENTIAL }} at all.
#
# APPLY sequence (fixed at code level for a future separately-approved APPLY):
#   exact-main guard
#   -> readonly preflight (F0 admin authority, served version == expected)
#   -> generate new safe credential in-memory (exactly once; base64url, 64
#      ASCII chars, no padding, no whitespace, no non-ASCII, never on a
#      command line so no shell word splitting)
#   -> update the GitHub repository secret via the dedicated admin authority
#      (exactly once; failure => F1: stop, generated value discarded)
#   -> reuse the approved overlay rotation gate by dispatching it (exactly
#      once; failure => F2: stop, no automatic repeated rotation; recovery
#      belongs to owner/CENTRAL)
#   -> confirm a NEW served version via the canonical GET-only resolver
#      (failure => F3: stop, NO_ORACLE)
#   -> reuse the repaired credential-equivalence oracle gate dispatched
#      against the NEW served version (exactly one oracle; a 401/NEITHER
#      against the fresh value => F4: stop,
#      SYSTEMATIC_WRITE_OR_AUTH_PATH_DEFECT, no repeated generation)
#   -> reuse the B54 smoke-only gate against the NEW served version
#      (oracle pass + smoke failure => F5: CREDENTIAL_CUTOVER_SUCCESS=YES,
#      PRODUCT_SMOKE_FAIL=YES, NO credential rollback by default)
#   -> closed evidence -> STOP
# Main drift detected at any guard => F6: stop.
#
# Reuse (verified components are not duplicated): the Cloudflare overlay PUT,
# the served-version readback, the equivalence oracle, and the smoke suite are
# NOT re-implemented here. GitHub cannot invoke another workflow's job
# directly, so the orchestrator dispatches the existing gates through
# `gh workflow run` + `gh run watch --exit-status` and consumes only their
# closed evidence vocabulary from the run logs. `--ref main` (never a full
# SHA) is used because the dispatch API rejects full-SHA refs with HTTP 422;
# every dispatched gate independently re-checks the exact main SHA.
#
# Rollback contract (design only in ACT-1, no rollback code): CI can never
# read the old repository secret value, so AUTOMATIC_GITHUB_SECRET_ROLLBACK=NO.
# The rollback anchor is an owner-controlled out-of-band backup re-applied
# through the existing overlay rotation gate by owner/CENTRAL decision.
#
# Output contract: only closed YES/NO markers and non-secret run/version
# metadata. NEVER: generated credential, old credential, admin token,
# plaintext, hash, digest, length, prefix, suffix, base64/base64url value,
# encrypted secret payload, raw registry, or derived credential material.

on:
  pull_request:
    paths:
      - ".github/workflows/b54-engine-caller-credential-regeneration-gate.yml"
      - ".github/tests/test_b54_engine_caller_credential_regeneration_gate.py"
  workflow_dispatch:
    inputs:
      mode:
        description: "Regeneration gate mode (fail-closed; PLAN never mutates)"
        required: true
        type: choice
        default: PLAN
        options:
          - PLAN
          - APPLY
      target_sha:
        description: "Exact current main SHA"
        required: true
        type: string
      expected_served_version:
        description: "Served Engine version id that MUST be active before any mutation (APPLY)"
        required: false
        default: ""
        type: string
      confirmation:
        description: "Exact APPLY confirmation phrase"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: b54-engine-caller-credential-regeneration-gate
  cancel-in-progress: false

env:
  ENGINE_WORKER: padiem-ai-engine
  TARGET_SHA: ${{ inputs.target_sha }}
  GITHUB_SECRET_NAME: B62_P01_ENGINE_CREDENTIAL
  ADMIN_AUTH_SECRET_NAME: B62_GITHUB_SECRET_ADMIN_TOKEN
  ROTATION_GATE_FILE: b54-engine-caller-registry-overlay-rotation-gate.yml
  ORACLE_GATE_FILE: b54-engine-credential-equivalence-diagnostic-gate.yml
  SMOKE_GATE_FILE: b54-engine-production-smoke-only-gate.yml

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR exact head
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact dispatch SHA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact current main for dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'EXACT_MAIN_GUARD=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run credential regeneration gate contract tests
        run: python .github/tests/test_b54_engine_caller_credential_regeneration_gate.py

      - name: Source-only evidence
        run: |
          echo 'B54_CREDENTIAL_REGENERATION_SOURCE_CONTRACT=PASS'
          echo 'APPLY_EXECUTED=NO'
          echo 'NEW_SECRET_GENERATION=0'
          echo 'GITHUB_SECRET_MUTATION=0'
          echo 'CLOUDFLARE_SECRET_MUTATION=0'
          echo 'GATE_DISPATCH_ISSUED=0'
          echo 'ADMIN_TOKEN_INSTALL=NO'
          echo 'PRODUCTION_MUTATION=0'

  plan-preflight:
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'PLAN' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ADMIN_TOKEN: ${{ secrets.B62_GITHUB_SECRET_ADMIN_TOKEN }}
      EXPECTED_SERVED_VERSION: ${{ inputs.expected_served_version }}
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconfirm exact main (F6 fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          if [ "$(git rev-parse origin/main)" != "${TARGET_SHA}" ]; then
            echo 'F6=STOP_MAIN_DRIFT'
            exit 1
          fi
          echo 'PLAN_EXACT_MAIN_SHA=PASS'

      - name: Report admin authority availability (informational only)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ADMIN_TOKEN}" ]; then
            echo 'F0_ADMIN_AUTH_AVAILABLE=YES'
          else
            echo 'F0_ADMIN_AUTH_AVAILABLE=NO'
            echo 'F0_ADMIN_AUTH_UNAVAILABLE=STOP_BEFORE_GENERATION'
          fi
          echo 'ADMIN_TOKEN_OUTPUT=0'
          echo 'ADMIN_TOKEN_HASH_OUTPUT=0'
          echo 'ADMIN_TOKEN_LENGTH_OUTPUT=0'

      - name: Validate planned APPLY inputs (no secret material in inputs)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPECTED_SERVED_VERSION}"
          echo "${EXPECTED_SERVED_VERSION}" | grep -Eq '^[A-Za-z0-9._-]{1,64}$' \
            || { echo 'EXPECTED_SERVED_VERSION_UNSAFE' >&2; exit 1; }
          echo 'PLAN_INPUT_SHAPE=PASS'

      - name: PLAN evidence (zero mutation, zero dispatch)
        run: |
          echo 'PLAN_ONLY=NO_GENERATION_NO_WRITE_NO_DISPATCH'
          echo 'PLANNED_SEQUENCE=EXACT_MAIN,PREFLIGHT,GENERATE,GITHUB_WRITE,OVERLAY_ROTATION,SERVED_READBACK,ORACLE,SMOKE,CLOSED_EVIDENCE,STOP'
          echo 'BUILTIN_GITHUB_TOKEN_FOR_SECRET_WRITE=NO'
          echo 'BUILTIN_GITHUB_TOKEN_FOR_ACTIONS_ORCHESTRATION=YES'
          echo 'DEDICATED_ADMIN_TOKEN_FOR_SECRET_WRITE=YES'
          echo 'DEDICATED_ADMIN_TOKEN_FOR_ACTIONS_ORCHESTRATION=NO'
          echo 'DEDICATED_SECRET_ADMIN_AUTHORITY_REQUIRED=YES'
          echo 'AUTOMATIC_GITHUB_SECRET_ROLLBACK=NO'
          echo 'SECRET_MATERIAL_IN_WORKFLOW_INPUTS=0'
          echo 'NEW_SECRET_GENERATION=0'
          echo 'GITHUB_SECRET_MUTATION=0'
          echo 'GATE_DISPATCH_ISSUED=0'
          echo 'PRODUCTION_MUTATION=0'

  apply-preflight:
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'APPLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      active_version: ${{ steps.resolve.outputs.active_version }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_TOKEN: ${{ secrets.B62_GITHUB_SECRET_ADMIN_TOKEN }}
      EXPECTED_SERVED_VERSION: ${{ inputs.expected_served_version }}
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconfirm exact main immediately before the live read (F6)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          if [ "$(git rev-parse origin/main)" != "${TARGET_SHA}" ]; then
            echo 'F6=STOP_MAIN_DRIFT'
            exit 1
          fi
          echo 'PREFLIGHT_EXACT_MAIN_SHA=PASS'

      - name: F0 privileged GitHub secret-write authority available
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_TOKEN}" ]; then
            echo 'F0_ADMIN_AUTH_UNAVAILABLE=STOP_BEFORE_GENERATION'
            exit 1
          fi
          echo 'F0_ADMIN_AUTH_AVAILABLE=YES'
          echo 'ADMIN_TOKEN_OUTPUT=0'

      - name: GET-only served-version guard (canonical resolver, fail-closed)
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${EXPECTED_SERVED_VERSION}"
          echo "${EXPECTED_SERVED_VERSION}" | grep -Eq '^[A-Za-z0-9._-]{1,64}$' \
            || { echo 'EXPECTED_SERVED_VERSION_UNSAFE' >&2; exit 1; }
          auth=( -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" )
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          deployments="${RUNNER_TEMP}/b54-regen-deployments.json"
          curl -fsS "${auth[@]}" "${api}/workers/scripts/${ENGINE_WORKER}/deployments" -o "${deployments}"
          jq -e '.success == true' "${deployments}" >/dev/null
          jq -e '(.result.deployments | type == "array" and length > 0)' "${deployments}" >/dev/null
          jq -e '(.result.deployments[0].versions | type == "array" and length == 1)' "${deployments}" >/dev/null
          jq -e '.result.deployments[0].versions[0].percentage == 100' "${deployments}" >/dev/null
          resolve_out="$(python3 .github/scripts/b54_engine_served_version_guard.py resolve-active --deployments "${deployments}")"
          printf '%s\n' "${resolve_out}"
          active_version="$(printf '%s\n' "${resolve_out}" | sed -n 's/^ENGINE_ACTIVE_VERSION_ID=//p')"
          test -n "${active_version}"
          if [ "${active_version}" != "${EXPECTED_SERVED_VERSION}" ]; then
            echo "SERVED_VERSION_MISMATCH active=${active_version} expected=${EXPECTED_SERVED_VERSION}" >&2
            echo 'EXPECTED_SERVED_VERSION_GUARD=FAIL' >&2
            exit 1
          fi
          version_detail="${RUNNER_TEMP}/b54-regen-version.json"
          curl -fsS "${auth[@]}" "${api}/workers/scripts/${ENGINE_WORKER}/versions/${active_version}" -o "${version_detail}"
          python3 .github/scripts/b54_engine_served_version_guard.py verify \
            --version-settings "${version_detail}" \
            --active-version "${active_version}" \
            --expect-overlay
          echo "active_version=${active_version}" >> "${GITHUB_OUTPUT}"
          echo 'EXPECTED_SERVED_VERSION_GUARD=PASS'
          echo 'PREFLIGHT_V1_OVERLAY_PRESENT=PASS'
          echo 'GET_ONLY=PASS'
          echo 'SECRET_VALUES_READ=0'
          echo 'PRODUCTION_MUTATION=0'

  regenerate-and-rotate:
    needs: [source-contract, apply-preflight]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'APPLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      actions: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_TOKEN: ${{ secrets.B62_GITHUB_SECRET_ADMIN_TOKEN }}
      CONFIRMATION: ${{ inputs.confirmation }}
      PRE_MUTATION_SERVED_VERSION: ${{ needs.apply-preflight.outputs.active_version }}
    steps:
      - name: Require explicit APPLY authorization and admin authority (F0)
        shell: bash
        run: |
          set -euo pipefail
          test "${CONFIRMATION}" = "REGENERATE_B54_KAGENT_ENGINE_CREDENTIAL_FROM_EXACT_MAIN"
          if [ -z "${ADMIN_TOKEN}" ]; then
            echo 'F0_ADMIN_AUTH_UNAVAILABLE=STOP_BEFORE_GENERATION'
            exit 1
          fi
          # The privileged admin authority must not be a copy of the built-in
          # token (which cannot write secrets anyway). Separation from the
          # regeneration target is structural: this workflow never loads
          # secrets.B62_P01_ENGINE_CREDENTIAL and the names differ by contract.
          if [ "${ADMIN_TOKEN}" = "${GITHUB_TOKEN:-}" ]; then
            echo 'F0_ADMIN_AUTH_UNAVAILABLE=STOP_BEFORE_GENERATION'
            exit 1
          fi
          echo 'B54_CREDENTIAL_REGENERATION_AUTHORIZATION=PASS'
          echo 'SECRET_WRITE_TOKEN=DEDICATED_ADMIN'
          echo 'WORKFLOW_DISPATCH_TOKEN=BUILTIN_GITHUB_TOKEN'
          echo 'BUILTIN_GITHUB_TOKEN_FOR_SECRET_WRITE=NO'
          echo 'BUILTIN_GITHUB_TOKEN_FOR_ACTIONS_ORCHESTRATION=YES'
          echo 'DEDICATED_ADMIN_TOKEN_FOR_SECRET_WRITE=YES'
          echo 'DEDICATED_ADMIN_TOKEN_FOR_ACTIONS_ORCHESTRATION=NO'
          echo 'DEDICATED_SECRET_ADMIN_AUTHORITY_REQUIRED=YES'
          echo 'SECRET_MATERIAL_IN_WORKFLOW_INPUTS=0'
          echo 'ADMIN_TOKEN_OUTPUT=0'

      - name: Checkout exact approved main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconfirm exact main immediately before generation (F6)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          if [ "$(git rev-parse origin/main)" != "${TARGET_SHA}" ]; then
            echo 'F6=STOP_MAIN_DRIFT'
            exit 1
          fi
          echo 'APPLY_EXACT_MAIN_SHA=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate once, update GitHub secret once, rotate overlay once
        shell: bash
        env:
          # WORKFLOW_DISPATCH_TOKEN=BUILTIN_GITHUB_TOKEN: this step's Actions
          # orchestration commands (rotation gate dispatch/watch) run with the
          # built-in token. The single secret write below is authenticated by
          # its own inline admin-token binding, which overrides this env.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --- generate exactly one transport-safe credential (in-memory) ---
          # base64url 64 ASCII chars, no padding, no whitespace, no non-ASCII;
          # the value only ever lives in this quoted variable and is streamed
          # to gh through a pipe, never on a command line or into any log.
          NEW_CREDENTIAL="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48), end="")')"
          if [[ ! "${NEW_CREDENTIAL}" =~ ^[A-Za-z0-9_-]{64}$ ]]; then
            unset NEW_CREDENTIAL
            echo 'F1=STOP_GENERATED_VALUE_DISCARDED'
            echo 'GITHUB_SECRET_UPDATED=NO'
            exit 1
          fi
          echo 'ONE_GENERATION_MAX=YES'
          echo 'CREDENTIAL_FORMAT_VALIDATED=PASS'
          echo 'GENERATED_SECRET_OUTPUT=0'
          # --- update the GitHub repository secret exactly once, using the
          #     dedicated admin authority (SECRET_WRITE_TOKEN=DEDICATED_ADMIN;
          #     this inline binding overrides the step-level orchestration
          #     token above and never falls back to the built-in token) ---
          if ! printf '%s' "${NEW_CREDENTIAL}" | GH_TOKEN="${ADMIN_TOKEN}" gh secret set "${GITHUB_SECRET_NAME}" --repo "${GITHUB_REPOSITORY}"; then
            unset NEW_CREDENTIAL
            echo 'F1=STOP_GENERATED_VALUE_DISCARDED'
            echo 'GITHUB_SECRET_UPDATED=NO'
            exit 1
          fi
          unset NEW_CREDENTIAL
          echo 'ONE_GITHUB_SECRET_WRITE_MAX=YES'
          echo 'GITHUB_SECRET_UPDATED=YES'
          # --- reuse the approved overlay rotation gate (ONE_OVERLAY_ROTATION_MAX) ---
          # --ref main: the dispatch API rejects full-SHA refs with HTTP 422;
          # the gate re-checks exact main against its target_sha input itself.
          # The polling loop below only DISCOVERS the dispatched run id; it
          # never re-dispatches, so NO_AUTOMATIC_RETRY holds for the mutation.
          BEFORE_ROTATION_ID="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "${ROTATION_GATE_FILE}" --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || echo none)"
          gh workflow run "${ROTATION_GATE_FILE}" --repo "${GITHUB_REPOSITORY}" --ref main \
            -f mode=apply_overlay_credential_rotation \
            -f target_sha="${TARGET_SHA}" \
            -f confirmation=ROTATE_B54_KAGENT_ENGINE_OVERLAY_FROM_EXACT_MAIN
          ROTATION_RUN_ID=""
          for _ in $(seq 1 60); do
            CANDIDATE="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "${ROTATION_GATE_FILE}" --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || echo none)"
            if [ -n "${CANDIDATE}" ] && [ "${CANDIDATE}" != "null" ] && [ "${CANDIDATE}" != "${BEFORE_ROTATION_ID}" ]; then
              ROTATION_RUN_ID="${CANDIDATE}"
              break
            fi
            sleep 2
          done
          if [ -z "${ROTATION_RUN_ID}" ]; then
            echo 'F2=STOP_NO_REPEAT_ROTATION'
            echo 'ENGINE_OVERLAY_APPLIED=NO'
            exit 1
          fi
          if ! gh run watch "${ROTATION_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --exit-status >/dev/null; then
            echo 'F2=STOP_NO_REPEAT_ROTATION'
            echo 'ENGINE_OVERLAY_APPLIED=NO'
            echo "ROTATION_RUN_ID=${ROTATION_RUN_ID}"
            exit 1
          fi
          echo 'ONE_OVERLAY_ROTATION_MAX=YES'
          echo 'ENGINE_OVERLAY_APPLIED=YES'
          echo "ROTATION_RUN_ID=${ROTATION_RUN_ID}"
          echo 'NO_AUTOMATIC_RETRY=YES'

      - name: Confirm a NEW served version (GET-only canonical resolver)
        id: postflight
        shell: bash
        run: |
          set -euo pipefail
          auth=( -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" )
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          deployments="${RUNNER_TEMP}/b54-regen-post-deployments.json"
          curl -fsS "${auth[@]}" "${api}/workers/scripts/${ENGINE_WORKER}/deployments" -o "${deployments}"
          jq -e '.success == true' "${deployments}" >/dev/null
          jq -e '(.result.deployments | type == "array" and length > 0)' "${deployments}" >/dev/null
          jq -e '(.result.deployments[0].versions | type == "array" and length == 1)' "${deployments}" >/dev/null
          jq -e '.result.deployments[0].versions[0].percentage == 100' "${deployments}" >/dev/null
          resolve_out="$(python3 .github/scripts/b54_engine_served_version_guard.py resolve-active --deployments "${deployments}")"
          active_version="$(printf '%s\n' "${resolve_out}" | sed -n 's/^ENGINE_ACTIVE_VERSION_ID=//p')"
          test -n "${active_version}"
          version_detail="${RUNNER_TEMP}/b54-regen-post-version.json"
          curl -fsS "${auth[@]}" "${api}/workers/scripts/${ENGINE_WORKER}/versions/${active_version}" -o "${version_detail}"
          python3 .github/scripts/b54_engine_served_version_guard.py verify \
            --version-settings "${version_detail}" \
            --active-version "${active_version}" \
            --expect-overlay
          if [ "${active_version}" = "${PRE_MUTATION_SERVED_VERSION}" ]; then
            echo 'F3=STOP_NO_ORACLE'
            echo 'NEW_SERVED_VERSION_CREATED=NO'
            exit 1
          fi
          echo "active_version=${active_version}" >> "${GITHUB_OUTPUT}"
          echo 'NEW_SERVED_VERSION_CREATED=YES'
          echo "POST_MUTATION_SERVED_VERSION=${active_version}"
          echo 'GET_ONLY=PASS'
          echo 'SECRET_VALUES_READ=0'

      - name: Run the repaired credential-equivalence oracle once
        shell: bash
        env:
          # WORKFLOW_DISPATCH_TOKEN=BUILTIN_GITHUB_TOKEN (orchestration only)
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEW_SERVED_VERSION="${{ steps.postflight.outputs.active_version }}"
          test -n "${NEW_SERVED_VERSION}"
          BEFORE_ORACLE_ID="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "${ORACLE_GATE_FILE}" --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || echo none)"
          gh workflow run "${ORACLE_GATE_FILE}" --repo "${GITHUB_REPOSITORY}" --ref main \
            -f mode=credential_equivalence_probe \
            -f target_sha="${TARGET_SHA}" \
            -f expected_served_version="${NEW_SERVED_VERSION}" \
            -f confirmation=RUN_B54_ENGINE_CREDENTIAL_EQUIVALENCE_PROBE
          ORACLE_RUN_ID=""
          for _ in $(seq 1 60); do
            CANDIDATE="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "${ORACLE_GATE_FILE}" --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || echo none)"
            if [ -n "${CANDIDATE}" ] && [ "${CANDIDATE}" != "null" ] && [ "${CANDIDATE}" != "${BEFORE_ORACLE_ID}" ]; then
              ORACLE_RUN_ID="${CANDIDATE}"
              break
            fi
            sleep 2
          done
          if [ -z "${ORACLE_RUN_ID}" ]; then
            echo 'F4=STOP_SYSTEMATIC_WRITE_OR_AUTH_PATH_DEFECT'
            echo 'RAW_ORACLE_ACCEPTED=NO'
            exit 1
          fi
          gh run watch "${ORACLE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --exit-status >/dev/null || true
          ORACLE_LOG="${RUNNER_TEMP}/b54-regen-oracle.log"
          gh run view "${ORACLE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --log > "${ORACLE_LOG}"
          RAW_ACCEPTED="$(sed -n 's/.*RAW_ACCEPTED=\(YES\|NO\).*/\1/p' "${ORACLE_LOG}" | tail -n 1)"
          DISPOSITION="$(sed -n 's/.*DISPOSITION=\([A-Z_]\{1,\}\).*/\1/p' "${ORACLE_LOG}" | tail -n 1)"
          rm -f "${ORACLE_LOG}"
          if [ "${RAW_ACCEPTED}" != "YES" ] || [ "${DISPOSITION}" != "RAW_MATCH" ]; then
            echo 'F4=STOP_SYSTEMATIC_WRITE_OR_AUTH_PATH_DEFECT'
            echo 'RAW_ORACLE_ACCEPTED=NO'
            echo "ORACLE_RUN_ID=${ORACLE_RUN_ID}"
            exit 1
          fi
          rm -f "${ORACLE_LOG}"
          echo 'ONE_ORACLE_MAX=YES'
          echo 'RAW_ORACLE_ACCEPTED=YES'
          echo "ORACLE_RUN_ID=${ORACLE_RUN_ID}"
          echo 'NO_AUTOMATIC_RETRY=YES'

      - name: Run the B54 smoke-only gate once against the new served version
        shell: bash
        env:
          # WORKFLOW_DISPATCH_TOKEN=BUILTIN_GITHUB_TOKEN (orchestration only)
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEW_SERVED_VERSION="${{ steps.postflight.outputs.active_version }}"
          test -n "${NEW_SERVED_VERSION}"
          BEFORE_SMOKE_ID="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "${SMOKE_GATE_FILE}" --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || echo none)"
          gh workflow run "${SMOKE_GATE_FILE}" --repo "${GITHUB_REPOSITORY}" --ref main \
            -f target_sha="${TARGET_SHA}" \
            -f expected_served_version="${NEW_SERVED_VERSION}" \
            -f confirmation=RUN_B54_ENGINE_POSTDEPLOY_SMOKE_ONLY
          SMOKE_RUN_ID=""
          for _ in $(seq 1 60); do
            CANDIDATE="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "${SMOKE_GATE_FILE}" --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || echo none)"
            if [ -n "${CANDIDATE}" ] && [ "${CANDIDATE}" != "null" ] && [ "${CANDIDATE}" != "${BEFORE_SMOKE_ID}" ]; then
              SMOKE_RUN_ID="${CANDIDATE}"
              break
            fi
            sleep 2
          done
          if [ -z "${SMOKE_RUN_ID}" ]; then
            echo 'F5=CREDENTIAL_CUTOVER_SUCCESS=YES_PRODUCT_SMOKE_FAIL=YES_NO_ROLLBACK'
            echo 'SMOKE_PASS=NO'
            exit 1
          fi
          if ! gh run watch "${SMOKE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --exit-status >/dev/null; then
            # F5: the credential cutover already succeeded (oracle accepted
            # the raw new value on the new served version); a product smoke
            # failure is a PRODUCT defect signal, never a reason to rotate
            # credentials back. No automatic rollback exists in CI.
            echo 'F5=CREDENTIAL_CUTOVER_SUCCESS=YES_PRODUCT_SMOKE_FAIL=YES_NO_ROLLBACK'
            echo 'CREDENTIAL_CUTOVER_SUCCESS=YES'
            echo 'PRODUCT_SMOKE_FAIL=YES'
            echo 'SMOKE_PASS=NO'
            echo 'AUTOMATIC_GITHUB_SECRET_ROLLBACK=NO'
            echo "SMOKE_RUN_ID=${SMOKE_RUN_ID}"
            exit 1
          fi
          echo 'SMOKE_PASS=YES'
          echo "SMOKE_RUN_ID=${SMOKE_RUN_ID}"
          echo 'NO_AUTOMATIC_RETRY=YES'

      - name: Closed evidence (APPLY terminal state)
        run: |
          echo 'B54_CREDENTIAL_REGENERATION=COMPLETE_STOP_AND_REPORT'
          echo 'GITHUB_SECRET_UPDATED=YES'
          echo 'ENGINE_OVERLAY_APPLIED=YES'
          echo 'NEW_SERVED_VERSION_CREATED=YES'
          echo 'RAW_ORACLE_ACCEPTED=YES'
          echo 'SMOKE_PASS=YES'
          echo 'CREDENTIAL_CUTOVER_SUCCESS=YES'
          echo 'SECRET_WRITE_TOKEN=DEDICATED_ADMIN'
          echo 'WORKFLOW_DISPATCH_TOKEN=BUILTIN_GITHUB_TOKEN'
          echo 'BUILTIN_GITHUB_TOKEN_FOR_SECRET_WRITE=NO'
          echo 'BUILTIN_GITHUB_TOKEN_FOR_ACTIONS_ORCHESTRATION=YES'
          echo 'DEDICATED_ADMIN_TOKEN_FOR_SECRET_WRITE=YES'
          echo 'DEDICATED_ADMIN_TOKEN_FOR_ACTIONS_ORCHESTRATION=NO'
          echo 'GENERATED_SECRET_OUTPUT=0'
          echo 'ADMIN_TOKEN_OUTPUT=0'
          echo 'SECRET_DERIVED_OUTPUT=0'
          echo 'AUTOMATIC_GITHUB_SECRET_ROLLBACK=NO'
          echo 'NO_AUTOMATIC_RETRY=YES'
          echo 'PRODUCTION_MUTATION=1'
