name: Validate B21 Decision Corridor V2 20260810
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'reference/business-21-founder-strategy-letter-v1/**'
      - '.github/workflows/validate-b21-decision-corridor-v2-20260810.yml'
permissions: {contents: read}
jobs:
  validate:
    if: github.event.pull_request.head.ref == 'design/b21-decision-corridor-v2-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.ref }}', fetch-depth: 0}
      - name: Static product contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          b=Path('reference/business-21-founder-strategy-letter-v1')
          texts={r:(b/r).read_text(encoding='utf-8') for r in ('index.html','ux.html','guide.html')}
          for r,t in texts.items():
              assert 'decision-corridor-v2.css' in t,r
              assert '.svg' not in t.lower(),r
              assert 'Visual Reference' not in t and 'Phase 1' not in t,r
          css=(b/'styles/decision-corridor-v2.css').read_text(encoding='utf-8')
          assert 'SIGNAL → QUESTION → TENSION → DECISION → WATCH' in css
          for forbidden in ('fetch(', 'XMLHttpRequest', 'localStorage', 'document.cookie', 'serviceWorker'):
              assert forbidden not in '\n'.join(texts.values()),forbidden
          print('B21_DECISION_CORRIDOR_STATIC_PASS=1')
          PY
          git diff --check origin/main...HEAD -- 'reference/business-21-founder-strategy-letter-v1/**'
      - name: Install Chromium and Korean fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p /tmp/b21-browser && cd /tmp/b21-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.54.1
          npx playwright install chromium
      - name: Browser decision journeys and screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b21-evidence
          python3 -m http.server 4201 --directory reference/business-21-founder-strategy-letter-v1 >/tmp/b21-http.log 2>&1 &
          server=$!; trap 'kill $server || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4201/index.html >/dev/null && break; sleep .5; done
          cd /tmp/b21-browser
          node <<'JS'
          const {chromium}=require('playwright');const fs=require('fs'),path=require('path');const out='/tmp/b21-evidence';async function audit(p,l){const d=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,svg:[...document.images].filter(i=>/\.svg(?:[?#]|$)/i.test(i.getAttribute('src')||'')).length,text:document.body.innerText}));if(d.sw>d.cw+1)throw new Error(`${l}:overflow ${d.sw}>${d.cw}`);if(d.svg)throw new Error(`${l}:svg ${d.svg}`);if(/Visual Reference|Phase 1/i.test(d.text))throw new Error(`${l}:old chrome`);return d}
          async function runDecision(p,key,label){await p.locator('[data-signal="activation"]').click();await p.locator('[data-signal="pricing"]').click();if(await p.locator('#buildTension').isDisabled())throw new Error(`${label}:signal gate`);await p.locator('#buildTension').click();await p.locator('#tension [data-go="brief"]').click();await p.locator('#brief [data-go="review"]').click();await p.locator(`[data-decision="${key}"]`).click();if(await p.locator('#finish').isDisabled())throw new Error(`${label}:decision gate`);if(!(await p.locator('#watchText').innerText()).includes('다시'))throw new Error(`${label}:watchpoint`);await p.locator('#finish').click();if(!(await p.locator('#decisionStatus').innerText()).includes('결정 메모 완료'))throw new Error(`${label}:finish`)}
          (async()=>{const b=await chromium.launch({headless:true}),m={};for(const vp of [{name:'desktop',width:1440,height:1100},{name:'mobile',width:390,height:844}]){for(const rel of ['index.html','guide.html']){const p=await b.newPage({viewport:vp});await p.goto(`http://127.0.0.1:4201/${rel}`,{waitUntil:'networkidle'});m[`${vp.name}-${rel}`]=await audit(p,`${vp.name}:${rel}`);await p.screenshot({path:path.join(out,`b21-${rel.replace('.html','')}-${vp.name}.png`),fullPage:true});await p.close()}const p=await b.newPage({viewport:vp}),errs=[];p.on('console',x=>{if(x.type()==='error')errs.push(x.text())});p.on('pageerror',e=>errs.push(e.message));await p.goto('http://127.0.0.1:4201/ux.html',{waitUntil:'networkidle'});await runDecision(p,'onboarding',`${vp.name}:onboarding`);await p.goto('http://127.0.0.1:4201/ux.html',{waitUntil:'networkidle'});await runDecision(p,'pricing',`${vp.name}:pricing`);m[`${vp.name}-ux`]=await audit(p,`${vp.name}:ux`);if(errs.length)throw new Error(errs.join('|'));await p.screenshot({path:path.join(out,`b21-ux-${vp.name}.png`),fullPage:true});await p.close()}fs.writeFileSync(path.join(out,'manifest.json'),JSON.stringify(m,null,2));await b.close();console.log('B21_DECISION_CORRIDOR_BROWSER_PASS=1')})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: b21-decision-corridor-v2-20260810, path: /tmp/b21-evidence, retention-days: 7, if-no-files-found: warn}
