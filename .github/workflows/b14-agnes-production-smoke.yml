name: B14 Agnes Production Smoke

on:
  pull_request:
    paths:
      - '.github/scripts/b14_agnes_production_smoke.py'
      - '.github/tests/test_b14_agnes_production_smoke.py'
      - '.github/workflows/b14-agnes-production-smoke.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact current main SHA authorized for this one-shot Agnes live smoke'
        required: true
      expected_b14_version:
        description: 'Exact B14 Worker version that must still be serving 100%'
        required: true
      confirmation:
        description: 'Type RUN_B14_AGNES_PRODUCTION_SMOKE_ONCE'
        required: true

permissions:
  contents: read

concurrency:
  group: b14-agnes-production-smoke
  cancel-in-progress: false

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source under review
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_sha || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Exact-main dispatch preflight
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.inputs.target_sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.event.inputs.target_sha }}"
          echo 'PREFLIGHT_EXACT_MAIN=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run bounded smoke contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest
          python -m pytest -q .github/tests/test_b14_agnes_production_smoke.py

      - name: Pin exact Agnes contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'MODEL_ID = "agnes-ai/agnes-3.0-flash"' .github/scripts/b14_agnes_production_smoke.py
          grep -Fq 'UPSTREAM_MODEL = "agnes-3.0-flash"' .github/scripts/b14_agnes_production_smoke.py
          grep -Fq 'AGNES_ATTEMPT_COUNT=1' .github/scripts/b14_agnes_production_smoke.py
          grep -Fq 'B14_CHAT_POST_COUNT=' .github/scripts/b14_agnes_production_smoke.py
          grep -Fq 'NETWORK_RETRY_COUNT=' .github/scripts/b14_agnes_production_smoke.py
          echo 'AGNES_SMOKE_SOURCE_CONTRACT=PASS'

  live-agnes-smoke:
    needs: source-contract
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirmation == 'RUN_B14_AGNES_PRODUCTION_SMOKE_ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_B14_VERSION: ${{ github.event.inputs.expected_b14_version }}
    steps:
      - name: Checkout exact authorized main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_sha }}
          persist-credentials: false

      - name: Re-check exact current main before live call
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.inputs.target_sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.event.inputs.target_sha }}"
          echo 'LIVE_EXACT_MAIN=PASS'

      - name: GET-only B14 served-version guard
        shell: bash
        run: |
          set -euo pipefail
          echo "${EXPECTED_B14_VERSION}" | grep -Eq '^[A-Za-z0-9._-]{1,64}$'
          deployments="${RUNNER_TEMP}/b14-deployments.json"
          curl -fsS             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/ai-revenue-korean-ai-platform/deployments"             -o "${deployments}"
          python3 - "${deployments}" "${EXPECTED_B14_VERSION}" <<'PY'
          import json
          import sys

          path, expected = sys.argv[1:3]
          with open(path, encoding="utf-8") as fh:
              payload = json.load(fh)
          deployments = payload.get("result", {}).get("deployments", [])
          found = False
          for deployment in deployments:
              for version in deployment.get("versions") or []:
                  if version.get("version_id") == expected and version.get("percentage") == 100:
                      found = True
                      break
              if found:
                  break
          if not found:
              raise SystemExit("expected B14 version is not serving 100%")
          print("B14_EXPECTED_VERSION_AT_100=PASS")
          PY
          echo "B14_EXPECTED_VERSION=${EXPECTED_B14_VERSION}"
          echo 'PRODUCTION_MUTATION=0'

      - name: Execute exactly one bounded Agnes live smoke request
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/agnes-production-smoke.log"
          python .github/scripts/b14_agnes_production_smoke.py | tee "${log}"
          grep -qx 'AGNES_PRODUCTION_SMOKE=PASS' "${log}"
          grep -qx 'AGNES_PROVIDER_REGISTERED=YES' "${log}"
          grep -qx 'AGNES_CREDENTIAL_READY=YES' "${log}"
          grep -qx 'AGNES_ROUTE_REGISTERED=YES' "${log}"
          grep -qx 'AGNES_MODEL_ROUTE=agnes-ai/agnes-3.0-flash' "${log}"
          grep -qx 'AGNES_UPSTREAM_MODEL=agnes-3.0-flash' "${log}"
          grep -qx 'AGNES_ACTUAL_RESPONSE_MODEL_MATCH=YES' "${log}"
          grep -qx 'AGNES_PROVIDER_MATCH=YES' "${log}"
          grep -qx 'AGNES_FALLBACK_USED=NO' "${log}"
          grep -qx 'AGNES_ATTEMPT_COUNT=1' "${log}"
          grep -qx 'B14_CHAT_POST_COUNT=1' "${log}"
          grep -qx 'NETWORK_RETRY_COUNT=0' "${log}"
          grep -qx 'RAW_RESPONSE_CONTENT_OUTPUT=0' "${log}"
          grep -qx 'SECRET_VALUE_OUTPUT=0' "${log}"

      - name: Record immutable execution locks
        if: always()
        shell: bash
        run: |
          echo 'WORKFLOW_INTERNAL_RERUN=0'
          echo 'B14_DEPLOY=0'
          echo 'ENGINE_DEPLOY=0'
          echo 'SECRET_MUTATION=0'
          echo 'SECRET_VALUE_OUTPUT=0'
          echo 'D1_MUTATION=0'
          echo 'GMAIL_MUTATION=0'
          echo 'PRODUCTION_MUTATION=0'
