name: B54 Engine Credential Equivalence Diagnostic Gate

# Issue #2503 — bounded credential-equivalence diagnostic gate (SOURCE ONLY).
#
# The #2439 audit proved the overlay storage path is byte-exact while the HTTP
# header transport strips leading/trailing whitespace and the served verifier
# never normalizes credentials. Two candidates survive: boundary whitespace in
# the canonical secret, or a genuine value divergence. This gate adds the
# dispatch-only job that can distinguish them with AT MOST TWO read-only
# requests against the served Engine completed-replay authentication oracle.
#
# Safety design:
#   * the credential arrives ONLY as the B62_P01_ENGINE_CREDENTIAL job
#     environment secret; it never passes through workflow_dispatch inputs;
#   * the probe script consumes the value from that environment name and emits
#     only the closed evidence vocabulary (HTTP class, public error code from a
#     fixed allowlist, two booleans, one disposition) — never plaintext, hash,
#     length, prefix/suffix, registry payload, response body, or exception text;
#   * the completed-replay route authenticates before any durable lookup and a
#     fresh nonexistent idempotency key yields a read-only 200 not-found
#     projection: no provider call, no D1 write, no deploy, no secret
#     mutation, no Phase-A request;
#   * a pull request can only run the static contract tests, with zero network
#     requests to the Engine (LIVE_PROBE_EXECUTED=NO); the live probe requires
#     an exact-main workflow_dispatch, the production environment, an explicit
#     confirmation phrase, an expected-served-version guard, and the closed
#     output contract re-validated in the runner before the evidence is shown.

on:
  pull_request:
    paths:
      - ".github/workflows/b54-engine-credential-equivalence-diagnostic-gate.yml"
      - ".github/scripts/b54_engine_credential_equivalence_diagnostic.py"
      - ".github/tests/test_b54_engine_credential_equivalence_diagnostic_gate.py"
  workflow_dispatch:
    inputs:
      mode:
        description: "Engine credential-equivalence gate mode"
        required: true
        type: choice
        default: repository_preflight
        options:
          - repository_preflight
          - credential_equivalence_probe
      target_sha:
        description: "Exact current main SHA"
        required: true
        type: string
      expected_served_version:
        description: "Served Engine version id that MUST be active before any probe request"
        required: false
        default: ""
        type: string
      confirmation:
        description: "Exact probe confirmation phrase"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: b54-engine-credential-equivalence-diagnostic-gate
  cancel-in-progress: false

env:
  ENGINE_WORKER: padiem-ai-engine
  TARGET_SHA: ${{ inputs.target_sha }}

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR exact head
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact dispatch SHA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact current main for dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'EXACT_MAIN_GUARD=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run credential-equivalence diagnostic gate contract tests
        run: python .github/tests/test_b54_engine_credential_equivalence_diagnostic_gate.py

      - name: Source-only evidence
        run: |
          echo 'B54_CREDENTIAL_EQUIVALENCE_SOURCE_CONTRACT=PASS'
          echo 'LIVE_PROBE_EXECUTED=NO'
          echo 'ENGINE_REQUESTS_ISSUED=0'
          echo 'REQUEST_BUDGET_MAX=2'
          echo 'SECRET_VALUE_OUTPUT=0'
          echo 'CLOUDFLARE_MUTATION=0'
          echo 'PRODUCTION_MUTATION=0'

  served-version-preflight:
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'credential_equivalence_probe' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      active_version: ${{ steps.resolve.outputs.active_version }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_SERVED_VERSION: ${{ inputs.expected_served_version }}
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconfirm exact main immediately before the live read
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'PREFLIGHT_EXACT_MAIN_SHA=PASS'

      - name: GET-only served-version guard (canonical resolver, fail-closed)
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          echo "${EXPECTED_SERVED_VERSION}" | grep -Eq '^[A-Za-z0-9._-]{1,64}$' \
            || { echo 'EXPECTED_SERVED_VERSION_UNSAFE' >&2; exit 1; }
          auth=( -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" )
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          deployments="${RUNNER_TEMP}/b54-cred-eq-deployments.json"
          curl -fsS "${auth[@]}" "${api}/workers/scripts/${ENGINE_WORKER}/deployments" -o "${deployments}"
          jq -e '.success == true' "${deployments}" >/dev/null
          jq -e '(.result.deployments | type == "array" and length > 0)' "${deployments}" >/dev/null
          jq -e '(.result.deployments[0].versions | type == "array" and length == 1)' "${deployments}" >/dev/null
          jq -e '.result.deployments[0].versions[0].percentage == 100' "${deployments}" >/dev/null
          resolve_out="$(python3 .github/scripts/b54_engine_served_version_guard.py resolve-active --deployments "${deployments}")"
          printf '%s\n' "${resolve_out}"
          active_version="$(printf '%s\n' "${resolve_out}" | sed -n 's/^ENGINE_ACTIVE_VERSION_ID=//p')"
          test -n "${active_version}"
          if [ "${active_version}" != "${EXPECTED_SERVED_VERSION}" ]; then
            echo "SERVED_VERSION_MISMATCH active=${active_version} expected=${EXPECTED_SERVED_VERSION}" >&2
            echo 'EXPECTED_SERVED_VERSION_GUARD=FAIL' >&2
            exit 1
          fi
          version_detail="${RUNNER_TEMP}/b54-cred-eq-version.json"
          curl -fsS "${auth[@]}" "${api}/workers/scripts/${ENGINE_WORKER}/versions/${active_version}" -o "${version_detail}"
          python3 .github/scripts/b54_engine_served_version_guard.py verify \
            --version-settings "${version_detail}" \
            --active-version "${active_version}" \
            --expect-overlay
          echo "active_version=${active_version}" >> "${GITHUB_OUTPUT}"
          echo "PREFLIGHT_SERVED_VERSION=${active_version}"
          echo 'EXPECTED_SERVED_VERSION_GUARD=PASS'
          echo 'PREFLIGHT_V1_OVERLAY_PRESENT=PASS'
          echo 'DEPLOYMENTS_SHAPE_GUARD=PASS'
          echo 'GET_ONLY=PASS'
          echo 'SECRET_VALUES_READ=0'
          echo 'PRODUCTION_MUTATION=0'

  credential-equivalence-probe:
    needs: [source-contract, served-version-preflight]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'credential_equivalence_probe' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    env:
      CALLER_SECRET: ${{ secrets.B62_P01_ENGINE_CREDENTIAL }}
      CONFIRMATION: ${{ inputs.confirmation }}
      PROBED_SERVED_VERSION: ${{ needs.served-version-preflight.outputs.active_version }}
    steps:
      - name: Require explicit probe authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${CONFIRMATION}" = "RUN_B54_ENGINE_CREDENTIAL_EQUIVALENCE_PROBE"
          echo 'B54_CREDENTIAL_EQUIVALENCE_AUTHORIZATION=PASS'
          echo 'SECRET_MATERIAL_IN_WORKFLOW_INPUTS=0'

      - name: Checkout exact approved main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconfirm exact main immediately before the probe
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'PROBE_EXACT_MAIN_SHA=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the bounded two-request credential-equivalence probe
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROBED_SERVED_VERSION}"
          evidence_out="${RUNNER_TEMP}/b54-cred-eq-evidence.txt"
          probe_status=0
          python .github/scripts/b54_engine_credential_equivalence_diagnostic.py \
            --credential-env CALLER_SECRET > "${evidence_out}" 2>&1 || probe_status=$?
          # Closed output contract: every emitted line must belong to the fixed
          # vocabulary BEFORE anything is shown. An unexpected line aborts the
          # job without echoing the evidence file.
          if ! grep -qE '^DISPOSITION=(RAW_MATCH|BOUNDARY_WHITESPACE_MATCH|NEITHER_MATCH|UNEXPECTED)$' "${evidence_out}"; then
            echo 'B54_CREDENTIAL_EQUIVALENCE=FAIL_CLOSED_NO_EVIDENCE'
            echo 'CLOSED_OUTPUT_CONTRACT=FAIL'
            rm -f "${evidence_out}"
            exit 1
          fi
          if grep -qvE '^(R[12]_HTTP_STATUS=[0-9]{1,3}|R[12]_HTTP_CLASS=([1-5]xx|blocked)|R[12]_ERROR_CODE=(none|unrecognized|transport_blocked|service_authentication_failed|service_identity_unavailable|service_app_not_authorized|invalid_request|invalid_json|unsupported_media_type|request_too_large|method_not_allowed|not_found|idempotency_unavailable)|RAW_ACCEPTED=(YES|NO)|STRIPPED_ACCEPTED=(YES|NO)|DISPOSITION=(RAW_MATCH|BOUNDARY_WHITESPACE_MATCH|NEITHER_MATCH|UNEXPECTED)|REQUESTS_ISSUED=[0-9]|REQUEST_BUDGET_MAX=2|SECRET_VALUE_OUTPUT=0|SECRET_HASH_OUTPUT=0|SECRET_LENGTH_OUTPUT=0|SECRET_PREFIX_SUFFIX_OUTPUT=0|RAW_REGISTRY_OUTPUT=0|PROVIDER_CALL=0|D1_WRITE=0|DEPLOY=0|SECRET_MUTATION=0|PHASE_A=0|PRODUCTION_MUTATION=0)$' "${evidence_out}"; then
            echo 'B54_CREDENTIAL_EQUIVALENCE=FAIL_CLOSED_EVIDENCE_UNSAFE'
            echo 'CLOSED_OUTPUT_CONTRACT=FAIL'
            rm -f "${evidence_out}"
            exit 1
          fi
          test "$(grep -cE '^REQUESTS_ISSUED=[0-2]$' "${evidence_out}")" -eq 1
          printf '%s\n' "$(cat "${evidence_out}")"
          rm -f "${evidence_out}"
          echo 'CLOSED_OUTPUT_CONTRACT=PASS'
          echo 'LIVE_PROBE_EXECUTED=YES'
          echo "PROBED_SERVED_VERSION=${PROBED_SERVED_VERSION}"
          echo 'PRODUCTION_MUTATION=0'
          if [ "${probe_status}" -gt 1 ]; then
            echo 'B54_CREDENTIAL_EQUIVALENCE=INTERNAL_FAULT'
            exit 1
          fi
          exit "${probe_status}"
