name: B54 Engine Caller Authority Read-only Gate

on:
  pull_request:
    paths:
      - ".github/workflows/b54-engine-caller-authority-readonly-gate.yml"
      - ".github/scripts/b54_engine_caller_authority_readonly.py"
      - ".github/tests/test_b54_engine_caller_authority_readonly_gate.py"
  workflow_dispatch:
    inputs:
      mode:
        description: "Engine caller authority gate mode"
        required: true
        type: choice
        default: repository_preflight
        options:
          - repository_preflight
          - cloudflare_readonly
      target_sha:
        description: "Exact current main SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: b54-engine-caller-authority-readonly-gate
  cancel-in-progress: false

env:
  ENGINE_WORKER: padiem-ai-engine
  TARGET_SHA: ${{ inputs.target_sha }}

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR exact head
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact dispatch SHA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact current main for dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'EXACT_MAIN_GUARD=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run engine caller authority read-only gate tests
        run: python .github/tests/test_b54_engine_caller_authority_readonly_gate.py

      - name: Source-only evidence
        run: |
          echo 'B54_ENGINE_CALLER_AUTHORITY_SOURCE_CONTRACT=PASS'
          echo 'CLOUDFLARE_MUTATION=0'
          echo 'PRODUCTION_MUTATION=0'

  cloudflare-readonly:
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'cloudflare_readonly' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconfirm exact main immediately before live read
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'READONLY_EXACT_MAIN_SHA=PASS'

      - name: Read Engine caller authority names and types only
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          settings="${RUNNER_TEMP}/b54-engine-caller-authority-settings.json"
          http_status="$(curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -o "${settings}" -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${ENGINE_WORKER}/settings")"
          test "${http_status}" = "200"
          jq -e '.success == true and (.result.bindings | type == "array")' "${settings}" >/dev/null
          evidence="$(python .github/scripts/b54_engine_caller_authority_readonly.py "${settings}")"
          echo "${evidence}"
          printf '%s\n' "${evidence}" | grep -E '^ENGINE_CALLER_AUTHORITY_TARGET_COUNT=[0-4]$' >/dev/null
          echo 'GET_ONLY=PASS'
          echo 'CLOUDFLARE_MUTATION=0'
          echo 'RAW_SETTINGS_ARTIFACT_UPLOADED=0'
          echo 'SECRET_VALUE_OUTPUT=0'
          echo 'PRODUCTION_MUTATION=0'
