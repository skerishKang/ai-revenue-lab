name: B18 Deep Visual Audit 20260811

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/b18-deep-visual-audit-20260811.yml'

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'ops/b18-deep-visual-audit-20260811'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: 9dccc0d57f61e7c8e01d92d774d7352750cc4ff5
      APP_DIR: reference/business-18-personal-audio-channel-v1
      CANONICAL: https://18-personal-audio-channel.pages.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert read-only authority and Production bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          latest=$(git ls-remote https://github.com/skerishKang/ai-revenue-lab.git refs/heads/main | cut -f1)
          test "$latest" = "$EXPECTED_SHA"
          verify() {
            url="$1"; source="$2"; expected=$(sha256sum "$source"|cut -d' ' -f1)
            for n in 1 2; do
              curl -LfsS --max-time 20 -H 'Cache-Control: no-cache' "${url}?audit=${EXPECTED_SHA}-${n}" -o /tmp/public
              actual=$(sha256sum /tmp/public|cut -d' ' -f1)
              echo "$url expected=$expected actual=$actual"
              test "$actual" = "$expected"
              sleep 1
            done
          }
          verify "$CANONICAL/index.html" "$APP_DIR/index.html"
          verify "$CANONICAL/ux.html" "$APP_DIR/ux.html"
          verify "$CANONICAL/guide.html" "$APP_DIR/guide.html"

      - name: Install browser QA
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Capture desktop/mobile and interaction evidence
        shell: bash
        run: |
          mkdir -p /tmp/b18-audit-evidence
          cat > /tmp/b18-audit.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const fs = require('fs');
          const base='https://18-personal-audio-channel.pages.dev';
          const surfaces=[['root','/index.html'],['ux','/ux.html'],['guide','/guide.html']];
          const viewports={desktop:{width:1440,height:1100},mobile:{width:390,height:844}};
          const failures=[], results=[];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [mode,viewport] of Object.entries(viewports)){
              const context=await browser.newContext({viewport,deviceScaleFactor:1});
              for(const [name,path] of surfaces){
                const page=await context.newPage(); const errors=[];
                page.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`)});
                page.on('pageerror',e=>errors.push(`page:${e.message}`));
                page.on('requestfailed',r=>errors.push(`request:${r.url()} ${r.failure()?.errorText||''}`));
                const response=await page.goto(base+path+'?audit='+Date.now(),{waitUntil:'networkidle'});
                if(!response||!response.ok())failures.push(`${mode}/${name}: bad HTTP`);
                const metrics=await page.evaluate(()=>{
                  const root=document.documentElement, body=document.body, h1=document.querySelector('h1'), top=document.querySelector('.lr-topbar');
                  const hs=h1?getComputedStyle(h1):null, hr=h1?.getBoundingClientRect(), tr=top?.getBoundingClientRect();
                  const fs=hs?parseFloat(hs.fontSize):NaN, lh=hs?parseFloat(hs.lineHeight):NaN;
                  const queue=document.querySelector('.lr-queue')?.getBoundingClientRect();
                  const player=document.querySelector('.lr-player')?.getBoundingClientRect();
                  const echoes=document.querySelector('.lr-echoes')?.getBoundingClientRect();
                  return {viewportWidth:innerWidth,viewportHeight:innerHeight,overflowX:Math.max(root.scrollWidth,body.scrollWidth)-innerWidth,pageHeight:root.scrollHeight,h1Text:h1?.innerText||'',h1Font:fs,h1Line:lh,h1Ratio:Number.isFinite(fs)&&fs>0&&Number.isFinite(lh)?lh/fs:null,h1Top:hr?.top??null,h1Bottom:hr?.bottom??null,topbarBottom:tr?.bottom??null,queueTop:queue?.top??null,playerTop:player?.top??null,echoesTop:echoes?.top??null};
                });
                if(metrics.overflowX>1)failures.push(`${mode}/${name}: overflow ${metrics.overflowX}`);
                if(errors.length)failures.push(`${mode}/${name}: ${errors.join(' | ')}`);
                if(metrics.h1Top!==null&&metrics.topbarBottom!==null&&metrics.h1Top<metrics.topbarBottom-2)failures.push(`${mode}/${name}: H1 intersects chrome`);
                if(/[가-힣]/.test(metrics.h1Text)&&metrics.h1Ratio!==null&&metrics.h1Ratio<1.0)failures.push(`${mode}/${name}: Korean H1 ratio ${metrics.h1Ratio}`);
                if(mode==='mobile'&&name==='ux'&&!(metrics.queueTop<metrics.playerTop&&metrics.playerTop<metrics.echoesTop))failures.push(`mobile/ux: visual order is not QUEUE → PLAYER → ECHOES`);
                await page.screenshot({path:`/tmp/b18-audit-evidence/${mode}-${name}.png`,fullPage:false});
                await page.screenshot({path:`/tmp/b18-audit-evidence/${mode}-${name}-full.png`,fullPage:true});
                results.push({mode,name,metrics,errors}); await page.close();
              }
              const page=await context.newPage(); await page.goto(base+'/ux.html?journey='+Date.now(),{waitUntil:'networkidle'});
              await page.locator('#play').click();
              if(!((await page.locator('#play').innerText()).includes('잠시 멈춤')))failures.push(`${mode}/journey: play state did not start`);
              if((await page.locator('#progress').evaluate(el=>parseFloat(getComputedStyle(el).width)))<=0)failures.push(`${mode}/journey: progress did not advance`);
              await page.locator('#mark').click();
              await page.locator('[data-track="ai"]').click();
              await page.locator('#mark').click();
              if(await page.locator('.lr-echo').count()!==2)failures.push(`${mode}/journey: expected two kept echoes`);
              await page.locator('#finish').click();
              if(!((await page.locator('#closeStatus').innerText()).includes('2개 장면')))failures.push(`${mode}/journey: close summary missing two echoes`);
              await page.screenshot({path:`/tmp/b18-audit-evidence/${mode}-ux-finished-full.png`,fullPage:true});
              await page.close(); await context.close();
            }
            await browser.close();
            fs.writeFileSync('/tmp/b18-audit-evidence/metrics.json',JSON.stringify({expectedSha:'9dccc0d57f61e7c8e01d92d774d7352750cc4ff5',results,failures},null,2));
            console.log(JSON.stringify({results,failures},null,2));
            if(failures.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/b18-audit.cjs

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b18-deep-visual-audit-evidence-${{ github.run_attempt }}
          path: /tmp/b18-audit-evidence
          if-no-files-found: error
          retention-days: 7
