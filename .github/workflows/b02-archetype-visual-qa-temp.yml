name: B02 temporary archetype system visual QA

on:
  pull_request:
    branches: [design/b02-place-first-anchor-scaffold]
    paths:
      - '.github/workflows/b02-archetype-visual-qa-temp.yml'
      - 'apps/living-travel/pages-preview/site/demo/preferences.html'
      - 'apps/living-travel/pages-preview/site/demo/traveler-home.html'
      - 'apps/living-travel/pages-preview/site/demo/edition.html'
      - 'apps/living-travel/pages-preview/site/assets/b2-archetype-*.css'

permissions:
  contents: read

jobs:
  capture-archetypes:
    if: github.event.pull_request.head.ref == 'design/b02-archetype-system-test'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chromium harness
        run: |
          python -m pip install --disable-pip-version-check --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Serve exact static preview
        working-directory: apps/living-travel/pages-preview/site
        run: |
          python -m http.server 4174 --bind 127.0.0.1 > /tmp/b02-archetype-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/b02-archetype-http.log
          exit 1

      - name: Capture 8 views and interaction contracts
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p /tmp/b02-archetype-evidence
          python - <<'PY'
          import asyncio, json, os
          from pathlib import Path
          from playwright.async_api import async_playwright

          OUT = Path('/tmp/b02-archetype-evidence')
          BASE = 'http://127.0.0.1:4174'
          pages = [
              ('entry', '/index.html'),
              ('preferences', '/demo/preferences.html'),
              ('home', '/demo/traveler-home.html'),
              ('read', '/demo/edition.html'),
          ]
          viewports = [('desktop', 1440, 1100), ('mobile', 390, 844)]

          async def main():
              report = {'head': os.environ['EXPECTED_HEAD'], 'cases': [], 'interaction': {}}
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  for page_name, path in pages:
                      for vp_name, width, height in viewports:
                          page = await browser.new_page(viewport={'width': width, 'height': height}, device_scale_factor=1)
                          console_errors, page_errors, failed = [], [], []
                          page.on('console', lambda msg: console_errors.append(msg.text) if msg.type == 'error' else None)
                          page.on('pageerror', lambda exc: page_errors.append(str(exc)))
                          page.on('requestfailed', lambda req: failed.append({'url': req.url, 'failure': req.failure}))
                          response = await page.goto(BASE + path, wait_until='networkidle')
                          if response is None or response.status != 200:
                              raise RuntimeError(f'{page_name}/{vp_name}: bad document response')
                          metrics = await page.evaluate('''() => ({
                            scrollWidth: document.documentElement.scrollWidth,
                            clientWidth: document.documentElement.clientWidth,
                            scrollHeight: document.documentElement.scrollHeight,
                            clientHeight: document.documentElement.clientHeight,
                            brokenImages: Array.from(document.images).filter(i => !i.complete || i.naturalWidth === 0).map(i => i.src),
                            operatorLeak: document.body.innerText.includes('편집실') || document.body.innerText.includes('Operator'),
                          })''')
                          if metrics['scrollWidth'] > metrics['clientWidth'] + 1:
                              raise RuntimeError(f'{page_name}/{vp_name}: horizontal overflow {metrics}')
                          if metrics['brokenImages']:
                              raise RuntimeError(f'{page_name}/{vp_name}: broken images {metrics["brokenImages"]}')
                          if metrics['operatorLeak']:
                              raise RuntimeError(f'{page_name}/{vp_name}: operator chrome leaked')
                          if console_errors or page_errors or failed:
                              raise RuntimeError(f'{page_name}/{vp_name}: browser errors console={console_errors} page={page_errors} failed={failed}')
                          await page.screenshot(path=str(OUT / f'{page_name}-{vp_name}.png'), full_page=False)
                          report['cases'].append({'page': page_name, 'viewport': [width, height], 'name': vp_name, 'metrics': metrics})
                          await page.close()

                  pref = await browser.new_page(viewport={'width': 1440, 'height': 1100})
                  await pref.goto(BASE + '/demo/preferences.html', wait_until='networkidle')
                  before = await pref.locator('#metricMoves').inner_text()
                  await pref.get_by_role('button', name='빠르게 · 넓게 보기').click()
                  after_moves = await pref.locator('#metricMoves').inner_text()
                  after_dwell = await pref.locator('#metricDwell').inner_text()
                  after_title = await pref.locator('#previewTitle').inner_text()
                  if before != '3회' or after_moves != '7회' or after_dwell != '38%' or '더 넓게' not in after_title:
                      raise RuntimeError(f'preference preview contract failed: {before=} {after_moves=} {after_dwell=} {after_title=}')
                  await pref.get_by_role('button', name='문화 · 역사').click()
                  summary = await pref.locator('#previewSummary').inner_text()
                  if '문화 · 역사' not in summary:
                      raise RuntimeError(f'focus update missing: {summary}')
                  report['interaction'] = {
                      'pace_before': before,
                      'pace_after_moves': after_moves,
                      'pace_after_dwell': after_dwell,
                      'pace_after_title': after_title,
                      'focus_summary_after_click': summary,
                  }
                  await pref.close()
                  await browser.close()
              (OUT / 'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
              print(json.dumps(report, ensure_ascii=False, indent=2))

          asyncio.run(main())
          PY

      - name: Upload exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: b02-archetype-system-${{ github.event.pull_request.head.sha }}
          path: /tmp/b02-archetype-evidence/
          if-no-files-found: error
          retention-days: 7
