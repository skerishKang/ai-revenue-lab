name: Validate B17 Counter Journal V2 20260810
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'reference/business-17-local-shop-magazine-v1/**'
      - '.github/workflows/validate-b17-counter-journal-v2-20260810.yml'
permissions: {contents: read}
jobs:
  validate:
    if: github.event.pull_request.head.ref == 'design/b17-counter-journal-v2-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.ref }}', fetch-depth: 0}
      - name: Static product contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          b=Path('reference/business-17-local-shop-magazine-v1')
          texts={r:(b/r).read_text(encoding='utf-8') for r in ('index.html','ux.html','guide.html')}
          for r,t in texts.items():
              assert 'counter-journal-v2.css' in t,r
              assert '.svg' not in t.lower(),r
              assert 'UI ONLY' not in t and 'Visual Reference' not in t and 'Phase 1' not in t,r
          css=(b/'styles/counter-journal-v2.css').read_text(encoding='utf-8')
          assert 'SCENE → VOICE → EDIT → PROOF → ISSUE' in css
          for forbidden in ('fetch(', 'XMLHttpRequest', 'localStorage', 'document.cookie', 'serviceWorker'):
              assert forbidden not in '\n'.join(texts.values()),forbidden
          print('B17_COUNTER_JOURNAL_STATIC_PASS=1')
          PY
          git diff --check origin/main...HEAD -- 'reference/business-17-local-shop-magazine-v1/**'
      - name: Install Chromium and Korean fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p /tmp/b17-browser && cd /tmp/b17-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.54.1
          npx playwright install chromium
      - name: Browser editorial journey and screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b17-evidence
          python3 -m http.server 4197 --directory reference/business-17-local-shop-magazine-v1 >/tmp/b17-http.log 2>&1 &
          server=$!; trap 'kill $server || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4197/index.html >/dev/null && break; sleep .5; done
          cd /tmp/b17-browser
          node <<'JS'
          const {chromium}=require('playwright');const fs=require('fs'),path=require('path');const out='/tmp/b17-evidence';async function clean(p,l){const d=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,svg:[...document.images].filter(i=>/\.svg(?:[?#]|$)/i.test(i.getAttribute('src')||'')).length,text:document.body.innerText}));if(d.sw>d.cw+1)throw new Error(`${l}:overflow ${d.sw}>${d.cw}`);if(d.svg)throw new Error(`${l}:svg ${d.svg}`);if(/UI ONLY|Visual Reference|Phase 1/i.test(d.text))throw new Error(`${l}:old chrome`);return d}
          (async()=>{const b=await chromium.launch({headless:true}),m={};for(const vp of [{name:'desktop',width:1440,height:1100},{name:'mobile',width:390,height:844}]){for(const rel of ['index.html','guide.html']){const p=await b.newPage({viewport:vp});await p.goto(`http://127.0.0.1:4197/${rel}`,{waitUntil:'networkidle'});m[`${vp.name}-${rel}`]=await clean(p,`${vp.name}:${rel}`);await p.screenshot({path:path.join(out,`b17-${rel.replace('.html','')}-${vp.name}.png`),fullPage:true});await p.close()}const p=await b.newPage({viewport:vp}),errs=[];p.on('console',x=>{if(x.type()==='error')errs.push(x.text())});p.on('pageerror',e=>errs.push(e.message));await p.goto('http://127.0.0.1:4197/ux.html',{waitUntil:'networkidle'});await p.locator('#draft').click();const checks=p.locator('[data-proof]');for(let i=0;i<await checks.count();i++)await checks.nth(i).check();if(await p.locator('#publish').isDisabled())throw new Error(`${vp.name}:proof gate stayed disabled`);await p.locator('#publish').click();if(!(await p.locator('#issue').getAttribute('class')).includes('active'))throw new Error(`${vp.name}:issue not active`);if(await p.locator('#finish').isDisabled())throw new Error(`${vp.name}:finish disabled`);await p.locator('#finish').click();if(!(await p.locator('#proofStatus').innerText()).includes('검토 완료'))throw new Error(`${vp.name}:finish status`);m[`${vp.name}-ux`]=await clean(p,`${vp.name}:ux`);if(errs.length)throw new Error(errs.join('|'));await p.screenshot({path:path.join(out,`b17-ux-${vp.name}.png`),fullPage:true});await p.close()}fs.writeFileSync(path.join(out,'manifest.json'),JSON.stringify(m,null,2));await b.close();console.log('B17_COUNTER_JOURNAL_BROWSER_PASS=1')})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: b17-counter-journal-v2-20260810, path: /tmp/b17-evidence, retention-days: 7, if-no-files-found: warn}
