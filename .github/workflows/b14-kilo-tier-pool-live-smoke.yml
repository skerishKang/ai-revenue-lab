name: B14 Kilo Tier Pool Live Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/b14-kilo-tier-pool-live-smoke.yml'
      - 'apps/korean-ai-platform/**'

permissions:
  contents: read

jobs:
  kilo-tier-pool-live-smoke:
    if: github.head_ref == 'feat/b14-956-kilo-nemotron-free'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: apps/korean-ai-platform
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Install locked dependencies
        run: uv sync --group dev --frozen
      - name: Run exactly four anonymous Laguna and Hy3 live calls
        env:
          B14_PROVIDER_MODE: live
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import asyncio
          from app.pilot.kilo_provider import (
              KILO_HY3_MODEL_ID,
              KILO_HY3_UPSTREAM_MODEL,
              KILO_LAGUNA_MODEL_ID,
              KILO_LAGUNA_UPSTREAM_MODEL,
              KILO_PROVIDER_ID,
          )
          from app.pilot.platform import (
              call_platform_chat_completions,
              stream_platform_chat_completions,
          )

          ROUTES = (
              ("LAGUNA", KILO_LAGUNA_MODEL_ID, KILO_LAGUNA_UPSTREAM_MODEL, "Kilo Gateway / Poolside"),
              ("HY3", KILO_HY3_MODEL_ID, KILO_HY3_UPSTREAM_MODEL, "Kilo Gateway / Tencent"),
          )

          async def verify(label, model_id, upstream_model, provider):
              prompt = [{"role": "user", "content": f"Reply briefly with exactly: PADIEM {label} LIVE OK"}]
              completed = await call_platform_chat_completions(
                  model_id=model_id,
                  upstream_model=upstream_model,
                  provider=provider,
                  platform_provider_id=KILO_PROVIDER_ID,
                  messages=prompt,
                  temperature=0.0,
                  max_tokens=32,
              )
              choices = completed.get("choices") or []
              text = ""
              if choices and isinstance(choices[0], dict):
                  message = choices[0].get("message") or {}
                  if isinstance(message, dict):
                      text = message.get("content") or ""
              if not isinstance(text, str) or not text.strip():
                  raise RuntimeError(f"{label} completed smoke returned no visible content")
              if completed.get("_mock") is True or completed.get("_live") is not True:
                  raise RuntimeError(f"{label} completed smoke did not prove live execution")
              returned_model = completed.get("model") or ""
              if returned_model and returned_model != upstream_model:
                  raise RuntimeError(f"{label} returned unexpected model identity")
              print(f"KILO_{label}_COMPLETED_LIVE_SMOKE=PASS")

              visible = []
              saw_done = False
              async for event in stream_platform_chat_completions(
                  model_id=model_id,
                  upstream_model=upstream_model,
                  provider=provider,
                  platform_provider_id=KILO_PROVIDER_ID,
                  messages=prompt,
                  temperature=0.0,
                  max_tokens=32,
              ):
                  if event.delta_content:
                      visible.append(event.delta_content)
                  if event.done:
                      saw_done = True
              if not saw_done or not "".join(visible).strip():
                  raise RuntimeError(f"{label} stream smoke did not finish with visible content")
              print(f"KILO_{label}_SSE_LIVE_SMOKE=PASS")

          async def main():
              for route in ROUTES:
                  await verify(*route)
              print("REAL_PROVIDER_CALLS=4")
              print("KILO_API_KEY_USED=NO")
              print("PROMPT_DATA=SYNTHETIC_NON_SENSITIVE")

          asyncio.run(main())
          PY
