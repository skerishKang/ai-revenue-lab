name: B59 polish temporary

on:
  pull_request:
    paths:
      - '.github/workflows/b59-polish-temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out B59 branch
        uses: actions/checkout@v4
        with:
          ref: feat/business-59-living-archive-mvp
          fetch-depth: 1

      - name: Attach CTO responsive override and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          css = Path('reference/business-59-living-archive-v1/styles/living-archive.css')
          text = css.read_text(encoding='utf-8')
          marker = '@import url("./cto-responsive-polish.css");\n'
          if marker in text:
              raise SystemExit('override already attached; refusing duplicate')
          css.write_text(marker + text, encoding='utf-8')
          PY
          git rm .github/workflows/b59-polish-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/business-59-living-archive-v1/styles/living-archive.css \
                  reference/business-59-living-archive-v1/styles/cto-responsive-polish.css
          git diff --cached --check
          git commit -m "fix(B59): attach CTO responsive polish"
          git push origin HEAD:feat/business-59-living-archive-mvp
