name: B62 D1 Migration 013 Gate

# #5023: the native Padiem Calendar reads and writes two additive D1 tables
# (013_padiem_calendar.sql): the workspace-scoped work-log rows and the
# workspace-scoped appointment rows. The merged B62 Calendar routes read those
# tables first, so without them every Calendar read fails on a missing table.
# This gate is the only reviewed path that creates them in a live database.
#
# It reuses the existing B62 D1 operational pattern: the live database id is
# resolved server-side from the padiem-chat Worker PADIEM_CHAT_DB binding, the
# migration is the reviewed 013 file and nothing else, the run is pinned to an
# exact current main SHA, and the mutation needs a separate owner-authorized
# dispatch with an exact confirmation phrase.
#
# The gate never deploys a Worker, never mutates a binding, never applies
# another migration, never reads row content and never emits a database
# identifier. It fails closed on any state it does not own:
#   missing  -> the calendar tables are not in place yet
#   drift    -> the live schema is not the reviewed shape
#   exact    -> already applied, the run is a verified no-op

on:
  pull_request:
    paths:
      - ".github/workflows/b62-d1-migration-013-gate.yml"
      - ".github/scripts/b62_d1_migration_013_schema.py"
      - ".github/tests/test_b62_d1_migration_013_gate.py"
      - "apps/padiem-chat/migrations/013_padiem_calendar.sql"
  workflow_dispatch:
    inputs:
      mode:
        description: "Migration 013 gate mode"
        required: true
        type: choice
        default: repository_preflight
        options:
          - repository_preflight
          - cloudflare_readonly
          - apply_migration_013
      target_sha:
        description: "Exact current main SHA"
        required: true
        type: string
      confirmation:
        description: "Exact mutation confirmation phrase"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: b62-d1-migration-013-gate
  cancel-in-progress: false

env:
  B62_WORKER: padiem-chat
  D1_BINDING: PADIEM_CHAT_DB
  TARGET_SHA: ${{ inputs.target_sha }}

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR exact head
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact dispatch SHA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact current main for dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'PREMUTATION_EXACT_MAIN_SHA=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run migration gate contract tests
        run: |
          python -m pip install --disable-pip-version-check --quiet pytest pyyaml
          python -m pytest .github/tests/test_b62_d1_migration_013_gate.py -q

      - name: Replay the reviewed 013 source contract
        run: python3 .github/scripts/b62_d1_migration_013_schema.py query /dev/null

      - name: Source-only evidence
        run: |
          echo 'B62_D1_MIGRATION_013_SOURCE_CONTRACT=PASS'
          echo 'PRODUCTION_MUTATION=0'

  cloudflare-readonly:
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'repository_preflight' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      schema_state: ${{ steps.schema.outputs.schema_state }}
      db_fingerprint: ${{ steps.binding.outputs.db_fingerprint }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconfirm exact main before live readback
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'READONLY_EXACT_MAIN_SHA=PASS'

      - name: Resolve live PADIEM_CHAT_DB binding without emitting identifiers
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          settings="${RUNNER_TEMP}/b62-settings-d1-013.json"
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" \
            -o "${settings}"
          DB_ID="$(python - "${settings}" "${D1_BINDING}" <<'PY'
          import json, re, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          if payload.get('success') is not True:
              raise SystemExit('worker settings read failed')
          bindings = payload.get('result', {}).get('bindings', [])
          hits = [b for b in bindings if b.get('type') == 'd1' and b.get('name') == sys.argv[2]]
          if len(hits) != 1:
              raise SystemExit('expected exactly one live PADIEM_CHAT_DB binding')
          database_id = hits[0].get('id')
          if not isinstance(database_id, str) or not re.fullmatch(r'[0-9a-fA-F-]{32,36}', database_id):
              raise SystemExit('live PADIEM_CHAT_DB binding has invalid database id')
          print(database_id)
          PY
          )"
          test -n "${DB_ID}"
          echo "::add-mask::${DB_ID}"
          echo "DB_ID=${DB_ID}" >> "${GITHUB_ENV}"
          fingerprint="$(printf %s "${DB_ID}" | sha256sum | cut -d' ' -f1)"
          test -n "${fingerprint}"
          echo "db_fingerprint=${fingerprint}" >> "${GITHUB_OUTPUT}"
          echo 'LIVE_PADIEM_CHAT_DB_DERIVED=PASS'
          echo 'D1_IDENTIFIER_OUTPUT=0'

      - name: Read only the 013 schema disposition
        id: schema
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          query="${RUNNER_TEMP}/b62-d1-013-schema-query.json"
          response="${RUNNER_TEMP}/b62-d1-013-schema-before.json"
          python3 .github/scripts/b62_d1_migration_013_schema.py query "${query}"
          curl -fsS --max-time 30 -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${query}" -o "${response}"
          evidence="$(python3 .github/scripts/b62_d1_migration_013_schema.py classify "${response}")"
          echo "${evidence}"
          state="$(printf '%s\n' "${evidence}" | sed -n 's/^B62_D1_MIGRATION_013_SCHEMA=//p' | tr '[:upper:]' '[:lower:]')"
          case "${state}" in missing|exact|drift) ;; *) echo 'invalid schema classifier state' >&2; exit 1;; esac
          echo "schema_state=${state}" >> "${GITHUB_OUTPUT}"
          echo 'D1_SCHEMA_QUERY=READ_ONLY'
          echo 'ROW_CONTENT_READ=0'
          echo 'PRODUCTION_MUTATION=0'

      - name: Read only the preserved account row counts
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          query="${RUNNER_TEMP}/b62-d1-013-counts-readonly-query.json"
          response="${RUNNER_TEMP}/b62-d1-013-counts-readonly.json"
          python3 - "${query}" <<'PY'
          import json, sys
          sql = """SELECT COUNT(*) AS n FROM users;
          SELECT COUNT(*) AS n FROM password_credentials;"""
          with open(sys.argv[1], 'w', encoding='utf-8') as handle:
              json.dump({'sql': sql}, handle)
          PY
          curl -fsS --max-time 30 -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${query}" -o "${response}"
          python3 - "${response}" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          blocks = payload.get('result') if payload.get('success') is True else None
          if not isinstance(blocks, list) or len(blocks) != 2:
              raise SystemExit('row count evidence is incomplete')
          for block in blocks:
              if not isinstance(block, dict) or block.get('success') is not True:
                  raise SystemExit('row count statement unsuccessful')
              rows = block.get('results')
              if not isinstance(rows, list) or len(rows) != 1:
                  raise SystemExit('row count statement malformed')
              value = rows[0].get('n')
              if not isinstance(value, int) or isinstance(value, bool) or value < 0:
                  raise SystemExit('row count is unreadable')
          print('B62_D1_MIGRATION_013_ACCOUNT_ROW_COUNTS_READ=PASS')
          PY
          echo 'ROW_CONTENT_READ=0'
          echo 'PRODUCTION_MUTATION=0'

      - name: Read only D1 Time Travel recovery availability
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          response="${RUNNER_TEMP}/b62-d1-013-time-travel-readonly.json"
          # GET only. POST on this endpoint CREATES a recovery bookmark.
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/time_travel/bookmark" \
            -o "${response}"
          python - "${response}" <<'PY'
          import json, re, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          result = payload.get('result') if payload.get('success') is True else None
          mark = result.get('bookmark') if isinstance(result, dict) else None
          if not isinstance(mark, str) or re.fullmatch(r'[A-Za-z0-9_-]{12,130}', mark) is None:
              raise SystemExit('D1_RECOVERY_BOOKMARK_UNAVAILABLE')
          print('D1_RECOVERY_AVAILABLE=PASS')
          PY
          echo 'D1_RECOVERY_BOOKMARK_PRESENT=PASS'
          echo 'D1_SCHEMA_QUERY=READ_ONLY'
          echo 'D1_IDENTIFIER_OUTPUT=0'
          echo 'PRODUCTION_MUTATION=0'

  apply-migration-013:
    needs: [source-contract, cloudflare-readonly]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply_migration_013' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRMATION: ${{ inputs.confirmation }}
      READONLY_SCHEMA_STATE: ${{ needs.cloudflare-readonly.outputs.schema_state }}
      READONLY_DB_FINGERPRINT: ${{ needs.cloudflare-readonly.outputs.db_fingerprint }}
    steps:
      - name: Require explicit migration authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${CONFIRMATION}" = "APPLY_B62_D1_MIGRATION_013_FROM_EXACT_MAIN"
          case "${READONLY_SCHEMA_STATE}" in
            missing|exact) ;;
            drift)
              echo 'Refusing mutation: existing migration 013 schema is structurally different from the reviewed missing/exact additive contract.' >&2
              exit 1
              ;;
            *)
              echo 'Refusing mutation: no trustworthy readonly schema disposition.' >&2
              exit 1
              ;;
          esac
          echo 'B62_D1_MIGRATION_013_AUTHORIZATION=PASS'

      - name: Checkout exact approved main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconfirm exact main immediately before mutation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'PREMUTATION_EXACT_MAIN_SHA=PASS'

      - name: Re-resolve the live D1 binding immediately before mutation
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          settings="${RUNNER_TEMP}/b62-settings-d1-013-premutation.json"
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" \
            -o "${settings}"
          DB_ID="$(python - "${settings}" "${D1_BINDING}" <<'PY'
          import json, re, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          bindings = payload.get('result', {}).get('bindings', []) if payload.get('success') is True else []
          hits = [b for b in bindings if b.get('type') == 'd1' and b.get('name') == sys.argv[2]]
          if len(hits) != 1:
              raise SystemExit('expected exactly one live PADIEM_CHAT_DB binding')
          database_id = hits[0].get('id')
          if not isinstance(database_id, str) or not re.fullmatch(r'[0-9a-fA-F-]{32,36}', database_id):
              raise SystemExit('live PADIEM_CHAT_DB binding has invalid database id')
          print(database_id)
          PY
          )"
          test -n "${DB_ID}"
          echo "::add-mask::${DB_ID}"
          echo "DB_ID=${DB_ID}" >> "${GITHUB_ENV}"
          fingerprint="$(printf %s "${DB_ID}" | sha256sum | cut -d' ' -f1)"
          test "${fingerprint}" = "${READONLY_DB_FINGERPRINT}"
          echo 'D1_BINDING_IDENTITY_STABLE=PASS'

      - name: Recheck identical schema immediately before SQL mutation
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          query="${RUNNER_TEMP}/b62-d1-013-premutation-query.json"
          response="${RUNNER_TEMP}/b62-d1-013-premutation.json"
          python3 .github/scripts/b62_d1_migration_013_schema.py query "${query}"
          curl -fsS --max-time 30 -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${query}" -o "${response}"
          evidence="$(python3 .github/scripts/b62_d1_migration_013_schema.py classify "${response}")"
          echo "${evidence}"
          state="$(printf '%s\n' "${evidence}" | sed -n 's/^B62_D1_MIGRATION_013_SCHEMA=//p' | tr '[:upper:]' '[:lower:]')"
          test "${state}" = "${READONLY_SCHEMA_STATE}"
          echo "PREMUTATION_SCHEMA_STATE=${state}"
          echo 'PREMUTATION_SCHEMA_STATE_STABLE=PASS'

      - name: Read the preserved account row counts before the release
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          query="${RUNNER_TEMP}/b62-d1-013-counts-before-query.json"
          response="${RUNNER_TEMP}/b62-d1-013-counts-before.json"
          python3 - "${query}" <<'PY'
          import json, sys
          sql = """SELECT COUNT(*) AS n FROM users;
          SELECT COUNT(*) AS n FROM password_credentials;"""
          with open(sys.argv[1], 'w', encoding='utf-8') as handle:
              json.dump({'sql': sql}, handle)
          PY
          curl -fsS --max-time 30 -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${query}" -o "${response}"
          python3 - "${response}" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          blocks = payload.get('result') if payload.get('success') is True else None
          if not isinstance(blocks, list) or len(blocks) != 2:
              raise SystemExit('row count evidence is incomplete')
          for block in blocks:
              if not isinstance(block, dict) or block.get('success') is not True:
                  raise SystemExit('row count statement unsuccessful')
              rows = block.get('results')
              if not isinstance(rows, list) or len(rows) != 1:
                  raise SystemExit('row count statement malformed')
              value = rows[0].get('n')
              if not isinstance(value, int) or isinstance(value, bool) or value < 0:
                  raise SystemExit('row count is unreadable')
          print('B62_D1_MIGRATION_013_ACCOUNT_ROW_COUNTS_READ=PASS')
          PY
          echo 'ROW_CONTENT_READ=0'
          echo 'PRODUCTION_MUTATION=0'

      - name: Apply exactly migration 013 once
        if: ${{ env.READONLY_SCHEMA_STATE == 'missing' }}
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          apply="${RUNNER_TEMP}/b62-d1-013-apply.json"
          response="${RUNNER_TEMP}/b62-d1-013-apply-response.json"
          # The apply payload is the reviewed 013 file itself: the helper refuses
          # to emit SQL that is not the approved additive contract, so no other
          # migration and no hand-written statement can reach the live database.
          python3 .github/scripts/b62_d1_migration_013_schema.py apply "${apply}"
          curl -fsS --max-time 30 -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${apply}" -o "${response}"
          python3 .github/scripts/b62_d1_migration_013_schema.py check-apply "${response}"
          echo 'B62_D1_MIGRATION_013=APPLIED'
          echo 'PRODUCTION_MUTATION=1'

      - name: Record no-op when migration 013 is already applied
        if: ${{ env.READONLY_SCHEMA_STATE == 'exact' }}
        shell: bash
        run: |
          echo 'B62_D1_MIGRATION_013=SKIPPED_ALREADY_APPLIED'
          echo 'PRODUCTION_MUTATION=0'

      - name: Read back exact migration 013 schema
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          query="${RUNNER_TEMP}/b62-d1-013-post-query.json"
          response="${RUNNER_TEMP}/b62-d1-013-post.json"
          python3 .github/scripts/b62_d1_migration_013_schema.py query "${query}"
          curl -fsS --max-time 30 -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${query}" -o "${response}"
          evidence="$(python3 .github/scripts/b62_d1_migration_013_schema.py classify "${response}")"
          echo "${evidence}"
          test "${evidence}" = 'B62_D1_MIGRATION_013_SCHEMA=EXACT'
          echo 'B62_D1_MIGRATION_013_POST_READBACK=PASS'
          echo 'ROW_CONTENT_READ=0'
          echo 'D1_IDENTIFIER_OUTPUT=0'

      - name: Verify the account rows and foreign keys after migration 013
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          query="${RUNNER_TEMP}/b62-d1-013-counts-after-query.json"
          response="${RUNNER_TEMP}/b62-d1-013-counts-after.json"
          python3 - "${query}" <<'PY'
          import json, sys
          sql = """SELECT COUNT(*) AS n FROM users;
          SELECT COUNT(*) AS n FROM password_credentials;"""
          with open(sys.argv[1], 'w', encoding='utf-8') as handle:
              json.dump({'sql': sql}, handle)
          PY
          curl -fsS --max-time 30 -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${query}" -o "${response}"
          python3 - "${RUNNER_TEMP}/b62-d1-013-counts-before.json" "${response}" <<'PY'
          import json, sys
          def counts(path):
              payload = json.load(open(path, encoding='utf-8'))
              blocks = payload.get('result')
              if not isinstance(blocks, list) or len(blocks) != 2:
                  raise SystemExit('row count evidence is incomplete')
              values = []
              for block in blocks:
                  if not isinstance(block, dict) or block.get('success') is not True:
                      raise SystemExit('row count statement unsuccessful')
                  rows = block.get('results')
                  if not isinstance(rows, list) or len(rows) != 1:
                      raise SystemExit('row count statement malformed')
                  value = rows[0].get('n')
                  if not isinstance(value, int) or isinstance(value, bool) or value < 0:
                      raise SystemExit('row count is unreadable')
                  values.append(value)
              return values
          before = counts(sys.argv[1])
          after = counts(sys.argv[2])
          if before != after:
              raise SystemExit('account rows changed across migration 013')
          print('B62_D1_MIGRATION_013_ACCOUNT_ROWS_PRESERVED=PASS')
          PY
          fk_query="${RUNNER_TEMP}/b62-d1-013-fk-query.json"
          fk_response="${RUNNER_TEMP}/b62-d1-013-fk.json"
          python3 - "${fk_query}" <<'PY'
          import json, sys
          with open(sys.argv[1], 'w', encoding='utf-8') as handle:
              json.dump({'sql': 'PRAGMA foreign_key_check;'}, handle)
          PY
          curl -fsS --max-time 30 -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${fk_query}" -o "${fk_response}"
          jq -e '.success == true and (.result | length == 1) and (.result[0].success == true) and ((.result[0].results // []) | length == 0)' "${fk_response}" >/dev/null
          echo 'B62_D1_MIGRATION_013_FOREIGN_KEY_CHECK=PASS'
          echo 'WORKER_DEPLOYED=0'
          echo 'BINDING_MUTATION=0'
          echo 'UNRELATED_MIGRATION_APPLY=0'
          echo 'ROW_CONTENT_READ=0'
