name: QA B60 live browser

on:
  pull_request:
    paths:
      - .github/workflows/qa-b60-live-browser.yml

permissions:
  contents: read

jobs:
  rendered-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_REF: fix/b60-protagonist-visibility-20260824
      TARGET_SHA: ab4f6efc935c8500ed67b7e58172bdcb8837f39e
      TARGET_URL: http://127.0.0.1:4173/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          path: target
          persist-credentials: false
          fetch-depth: 1

      - name: Require exact target head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C target rev-parse HEAD)"
          echo "TARGET_HEAD=$actual"
          test "$actual" = "$TARGET_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium and start isolated reference server
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 4173 --bind 127.0.0.1 --directory target/reference/business-60-ai-api-v1 >/tmp/b60-server.log 2>&1 &
          echo $! > /tmp/b60-server.pid
          for i in $(seq 1 30); do
            if curl -fsS "$TARGET_URL" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/b60-server.log
          exit 1

      - name: Render desktop and mobile visibility evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const browser = await chromium.launch({headless:true});
          const all = [];

          async function runScenario(name, viewport) {
            const page = await browser.newPage({ viewport });
            const errors = [];
            const badResponses = [];
            page.on('console',m=>{ if(m.type()==='error') errors.push(m.text()); });
            page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
            page.on('response',r=>{ if(r.status()>=400) badResponses.push({status:r.status(),url:r.url()}); });

            const response = await page.goto(process.env.TARGET_URL,{waitUntil:'domcontentloaded',timeout:20000});
            const visual = async (label) => page.evaluate((label) => {
              const stage = document.querySelector('#stage');
              const alone = document.querySelector('.shot-alone');
              const close = document.querySelector('.shot-close');
              const hand = document.querySelector('.gesture-hand');
              const grade = document.querySelector('.world-grade');
              const connect = document.querySelector('#connect');
              const info = (el) => {
                const cs = getComputedStyle(el);
                const r = el.getBoundingClientRect();
                return {
                  opacity:Number(cs.opacity), filter:cs.filter, mixBlendMode:cs.mixBlendMode,
                  mask:cs.maskImage || cs.webkitMaskImage || '',
                  rect:{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}
                };
              };
              const imgInfo = (selector) => {
                const img = document.querySelector(selector);
                return img ? {complete:img.complete,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight} : null;
              };
              return {
                label,
                readyState:document.readyState,
                scrollY:Math.round(scrollY),
                stageClass:stage?.className || '',
                cue:document.querySelector('.scroll-cue')?.textContent?.trim() || '',
                alone:info(alone), close:info(close), hand:info(hand), grade:info(grade), connect:info(connect),
                images:{alone:imgInfo('.shot-alone img'),close:imgInfo('.shot-close img'),hand:imgInfo('.gesture-hand img')}
              };
            }, label);

            const states=[];
            states.push(await visual('loaded'));
            await page.screenshot({path:`${name}-01-loaded.png`});

            await page.waitForTimeout(1800);
            states.push(await visual('autoplay-1.8s'));
            await page.screenshot({path:`${name}-02-autoplay.png`});

            await page.waitForTimeout(4800);
            states.push(await visual('connect-gate'));
            await page.screenshot({path:`${name}-03-connect-gate.png`});

            await page.locator('#connect').click({timeout:8000});
            await page.waitForTimeout(1800);
            states.push(await visual('post-connect'));
            await page.screenshot({path:`${name}-04-post-connect.png`});

            const gate=states[2], post=states[3];
            const result={name,http:response?.status(),states,errors,badResponses};
            all.push(result);

            if(response?.status()!==200) throw new Error(`${name}:HTTP_NOT_200`);
            if(errors.length || badResponses.length) throw new Error(`${name}:BROWSER_RESOURCE_ERRORS`);
            if(gate.images.alone?.naturalWidth<=0 || gate.images.hand?.naturalWidth<=0 || post.images.close?.naturalWidth<=0) throw new Error(`${name}:IMAGE_NOT_DECODED`);
            if(gate.alone.opacity<.5) throw new Error(`${name}:PROTAGONIST_TOO_TRANSPARENT_AT_GATE`);
            if(gate.hand.opacity<.55) throw new Error(`${name}:HAND_TOO_TRANSPARENT_AT_GATE`);
            if(gate.grade.mixBlendMode!=='normal') throw new Error(`${name}:DARK_MULTIPLY_GRADE_STILL_ACTIVE`);
            if(post.close.opacity<.5) throw new Error(`${name}:POST_CONNECT_PROTAGONIST_TOO_TRANSPARENT`);
            if(!post.stageClass.includes('connected')) throw new Error(`${name}:CONNECT_DID_NOT_ACTIVATE`);
            await page.close();
          }

          try {
            await runScenario('desktop',{width:1440,height:1000});
            await runScenario('mobile',{width:390,height:844});
            fs.writeFileSync('qa-visibility.json',JSON.stringify({target:process.env.TARGET_SHA,results:all},null,2));
            console.log('VISIBILITY_QA='+JSON.stringify(all.map(r=>({
              name:r.name,
              gate:{scrollY:r.states[2].scrollY,aloneOpacity:r.states[2].alone.opacity,handOpacity:r.states[2].hand.opacity,handRect:r.states[2].hand.rect,grade:r.states[2].grade.mixBlendMode},
              post:{closeOpacity:r.states[3].close.opacity,connected:r.states[3].stageClass.includes('connected')},
              errors:r.errors.length,badResponses:r.badResponses.length
            }))));
          } finally {
            await browser.close();
          }
          JS
          node qa.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b60-protagonist-visibility-qa
          path: |
            desktop-*.png
            mobile-*.png
            qa-visibility.json
