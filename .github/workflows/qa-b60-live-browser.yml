name: QA B60 live browser

on:
  pull_request:
    paths:
      - .github/workflows/qa-b60-live-browser.yml

permissions:
  contents: read

jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Wait for Cloudflare hotfix and exercise live site
        env:
          TARGET: https://ai-revenue-business-60-ai-api.pages.dev/
        run: |
          set -euo pipefail
          ready=false
          for i in $(seq 1 30); do
            body="$(curl -fsSL --max-time 10 "${TARGET}product-v7.js" || true)"
            if printf '%s' "$body" | grep -q 'Observe only direct grid replacement' && ! printf '%s' "$body" | grep -q 'subtree:true'; then
              echo "LIVE_HOTFIX=VISIBLE attempt=$i"
              ready=true
              break
            fi
            echo "LIVE_HOTFIX=WAIT attempt=$i"
            sleep 3
          done
          test "$ready" = true

          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const browser = await chromium.launch({headless:true});
          try {
            const page = await browser.newPage({viewport:{width:1440,height:1000}});
            const errors=[]; const failed=[];
            page.on('console',m=>{ if(m.type()==='error') errors.push(m.text()); });
            page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
            page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText}));
            const response=await page.goto(process.env.TARGET,{waitUntil:'domcontentloaded',timeout:20000});
            const state=async label=>({
              label,
              readyState:await page.evaluate(()=>document.readyState),
              scrollY:Math.round(await page.evaluate(()=>scrollY)),
              cue:(await page.locator('.scroll-cue').textContent())?.trim(),
              stage:await page.locator('#stage').getAttribute('class'),
              connectOpacity:await page.locator('#connect').evaluate(el=>getComputedStyle(el).opacity)
            });
            const states=[];
            states.push(await state('loaded'));
            await page.screenshot({path:'01-loaded.png'});
            await page.waitForTimeout(1800);
            states.push(await state('autoplay-1.8s'));
            await page.screenshot({path:'02-autoplay.png'});
            await page.waitForTimeout(4800);
            states.push(await state('connect-gate'));
            await page.screenshot({path:'03-connect-gate.png'});
            const beforeClick=await page.evaluate(()=>scrollY);
            await page.locator('#connect').click({timeout:8000});
            await page.waitForTimeout(1600);
            states.push(await state('post-connect'));
            await page.screenshot({path:'04-post-connect.png'});
            const connected=await page.locator('#stage').evaluate(el=>el.classList.contains('connected'));
            const afterClick=await page.evaluate(()=>scrollY);
            const cards=await page.locator('.access-card').count();
            const saveButtons=await page.locator('.save-v7').count();
            const bodyMarker=(await page.locator('body').innerText()).includes('LIVE ACCESS SIGNAL');
            const out={http:response?.status(),states,beforeClick:Math.round(beforeClick),afterClick:Math.round(afterClick),connected,cards,saveButtons,bodyMarker,errors,failed};
            fs.writeFileSync('qa-result.json',JSON.stringify(out,null,2));
            console.log('QA_RESULT='+JSON.stringify(out));
            if(response?.status()!==200) throw new Error('HTTP_NOT_200');
            if(errors.length || failed.length) throw new Error('BROWSER_ERRORS');
            if(states[1].scrollY<=states[0].scrollY) throw new Error('AUTOPLAY_DID_NOT_ADVANCE');
            if(states[2].scrollY<=states[1].scrollY) throw new Error('AUTOPLAY_DID_NOT_REACH_GATE');
            if(!connected) throw new Error('CONNECT_DID_NOT_ACTIVATE');
            if(afterClick<=beforeClick) throw new Error('POST_CONNECT_DID_NOT_ADVANCE');
            if(cards<5 || saveButtons<5) throw new Error('PRODUCT_LAYER_NOT_READY');
            if(!bodyMarker) throw new Error('BODY_MARKER_MISSING');
          } finally {
            await browser.close();
          }
          JS
          node qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b60-live-browser-fixed
          path: |
            *.png
            qa-result.json
