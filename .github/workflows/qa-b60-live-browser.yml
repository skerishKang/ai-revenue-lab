name: QA B60 live browser

on:
  pull_request:
    paths:
      - .github/workflows/qa-b60-live-browser.yml

permissions:
  contents: read

jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Trace live network
        env:
          TARGET: https://ai-revenue-business-60-ai-api.pages.dev/
        run: |
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:1100}});
          const requests=[]; const responses=[]; const failed=[]; const errors=[];
          page.on('request',r=>requests.push({url:r.url(),type:r.resourceType()}));
          page.on('response',r=>responses.push({url:r.url(),status:r.status()}));
          page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText}));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
          let navStatus=null; let navError='';
          try {
            try {
              const response=await page.goto(process.env.TARGET,{waitUntil:'commit',timeout:20000});
              navStatus=response?.status() ?? null;
            } catch(e) { navError=e.message; }
            await new Promise(r=>setTimeout(r,12000));
            console.log('QA_NETWORK='+JSON.stringify({navStatus,navError,requests,responses,failed,errors}));
          } finally {
            await browser.close();
          }
          JS
          node qa.mjs
