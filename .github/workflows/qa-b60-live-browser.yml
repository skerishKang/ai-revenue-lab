name: QA B60 live browser

on:
  pull_request:
    paths:
      - .github/workflows/qa-b60-live-browser.yml

permissions:
  contents: read

jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Isolate blocking script group
        env:
          TARGET: https://ai-revenue-business-60-ai-api.pages.dev/
        run: |
          cat > scenario.mjs <<'JS'
          import { chromium } from 'playwright';
          const group=process.argv[2];
          const sets={
            none:[],
            core:['app.js'],
            cinematic:['cinematic-v2.js','cinematic-v3.js','cinematic-v4.js','cinematic-v5.js','cinematic-polish.js','cinematic-autoplay.js'],
            product:['snapshot-diff-v8.js','product-v6.js','product-v7.js','product-v8.js'],
            data:['data/deals.js','data/access-signals.js','data/signal-history.js','data/snapshots.js']
          };
          const blocked=sets[group]||[];
          const b=await chromium.launch({headless:true});
          const p=await b.newPage();
          if(blocked.length){
            await p.route('**/*', async route=>{
              const u=route.request().url();
              if(blocked.some(x=>u.endsWith('/'+x))) return route.fulfill({status:200,contentType:'application/javascript',body:''});
              return route.continue();
            });
          }
          let result='UNKNOWN'; let error='';
          try{
            await p.goto(process.env.TARGET,{waitUntil:'domcontentloaded',timeout:7000});
            result='DOMCONTENTLOADED';
          }catch(e){ result='TIMEOUT'; error=e.message.split('\n')[0]; }
          console.log(`GROUP_RESULT=${group}|${result}|${error}`);
          await b.close();
          JS
          for group in none core cinematic product data; do
            echo "--- $group ---"
            timeout 12s node scenario.mjs "$group" || echo "GROUP_PROCESS_TIMEOUT=$group"
          done
