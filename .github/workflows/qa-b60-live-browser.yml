name: QA B60 live browser

on:
  pull_request:
    paths:
      - .github/workflows/qa-b60-live-browser.yml

permissions:
  contents: read

jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Trace live page load
        env:
          TARGET: https://ai-revenue-business-60-ai-api.pages.dev/
        run: |
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:1100}});
          page.setDefaultTimeout(5000);
          const errors=[]; const failed=[]; const bad=[];
          page.on('console',m=>{ if(m.type()==='error') errors.push(m.text()); });
          page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
          page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText}));
          page.on('response',r=>{if(r.status()>=400) bad.push({url:r.url(),status:r.status()});});
          let navStatus=null;
          try {
            const response=await page.goto(process.env.TARGET,{waitUntil:'commit',timeout:20000});
            navStatus=response?.status() ?? null;
            await page.waitForTimeout(3000);
            let probe={};
            try {
              probe=await page.evaluate(()=>({
                readyState:document.readyState,
                scrollY,
                bodyText:(document.body?.innerText||'').slice(0,500),
                scripts:Array.from(document.scripts).map(s=>s.src||'[inline]'),
                resources:performance.getEntriesByType('resource').map(r=>({name:r.name,duration:Math.round(r.duration),transferSize:r.transferSize})).slice(-60)
              }));
            } catch(e) { probe={evaluateError:e.message}; }
            try { await page.screenshot({path:'live-after-3s.png'}); } catch(e) { probe.screenshotError=e.message; }
            await page.waitForTimeout(5000);
            let later={};
            try { later=await page.evaluate(()=>({readyState:document.readyState,scrollY,cue:document.querySelector('.scroll-cue')?.textContent||'',stage:document.querySelector('#stage')?.className||''})); }
            catch(e){ later={evaluateError:e.message}; }
            console.log('QA_TRACE='+JSON.stringify({navStatus,probe,later,errors,failed,bad}));
          } finally {
            await browser.close();
          }
          JS
          node qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b60-live-browser
          path: '*.png'
