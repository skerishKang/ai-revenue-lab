name: Migrate numbered Pages to NN-name 396

on:
  pull_request:
    branches:
      - main
    types: [synchronize, reopened]

permissions:
  contents: read

# Migration completed for all 39 targets: canonical NN-name projects were created and byte-verified.
# Further work is legacy cleanup only. Keep this workflow paused so synchronize events cannot redeploy or delete again.
concurrency:
  group: numbered-pages-migration-396
  cancel-in-progress: true

jobs:
  migrate:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'NUMBERED_PAGES_MIGRATION_PAUSED_AFTER_39_TARGETS_VERIFIED'
