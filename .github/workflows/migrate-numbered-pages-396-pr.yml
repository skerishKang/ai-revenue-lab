name: Migrate numbered Pages to NN-name 396

on:
  pull_request:
    branches:
      - main
    types: [synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: numbered-pages-migration-396
  cancel-in-progress: true

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/portfolio-review-deploy-396'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out migration authority branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Migrate numbered Business Pages only
        shell: bash
        run: |
          set -u
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo 'CLOUDFLARE_API_TOKEN missing' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo 'CLOUDFLARE_ACCOUNT_ID missing' >&2; exit 1; }

          cp ops/cloudflare-numbered-pages-migration-396.tsv /tmp/migration.tsv
          printf 'business_id\ttarget_project\tpublic_url\texact_sha\tsource_sha256\tpublic_sha256\tlegacy_primary\tlegacy_review\tstatus\treason\n' > /tmp/migration-results.tsv

          api_base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"

          get_project_code() {
            project="$1"
            curl -sS -o /tmp/cf-get.json -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "${api_base}/${project}" || true
          }

          delete_high_deployment_history() {
            project="$1"
            rounds=0
            prod_id=''
            while :; do
              rounds=$((rounds + 1))
              test "${rounds}" -le 30 || {
                echo "${project}: deployment cleanup exceeded safety round limit" >&2
                return 1
              }

              list_code="$(curl -sS -o /tmp/cf-deployments-list.json -w '%{http_code}' \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "${api_base}/${project}/deployments" || true)"
              test "${list_code}" = '200' || {
                echo "${project}: deployment list API failed HTTP ${list_code}" >&2
                return 1
              }

              ids="$(jq -r '.result[]?.id // empty' /tmp/cf-deployments-list.json 2>/dev/null || true)"
              to_delete="$(printf '%s\n' "${ids}" | grep -v -F -x "${prod_id}" | grep . || true)"
              if test -z "${to_delete}"; then
                return 0
              fi

              rm -rf /tmp/cf-deploy-delete
              mkdir -p /tmp/cf-deploy-delete
              pids=''
              while IFS= read -r deployment_id; do
                test -n "${deployment_id}" || continue
                (
                  code="$(curl -sS -o "/tmp/cf-deploy-delete/${deployment_id}.json" -w '%{http_code}' -X DELETE \
                    -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                    "${api_base}/${project}/deployments/${deployment_id}?force=true" || true)"
                  printf '%s' "${code}" > "/tmp/cf-deploy-delete/${deployment_id}.code"
                ) &
                pids="${pids} $!"
              done <<< "${to_delete}"

              for pid in ${pids}; do
                wait "${pid}" || true
              done

              progressed=0
              detected_prod=''
              while IFS= read -r deployment_id; do
                test -n "${deployment_id}" || continue
                code="$(cat "/tmp/cf-deploy-delete/${deployment_id}.code" 2>/dev/null || true)"
                if test "${code}" = '200' || test "${code}" = '204'; then
                  progressed=$((progressed + 1))
                elif grep -qi 'production deployment\|latest deployment\|cannot be deleted' "/tmp/cf-deploy-delete/${deployment_id}.json" 2>/dev/null; then
                  detected_prod="${deployment_id}"
                fi
              done <<< "${to_delete}"

              test -n "${detected_prod}" && prod_id="${detected_prod}"
              if test "${progressed}" -eq 0 && test -z "${prod_id}"; then
                echo "${project}: parallel deployment cleanup made no progress" >&2
                return 1
              fi
              echo "${project}: deployment cleanup round ${rounds}, deleted=${progressed}, protected_prod=${prod_id:-unknown}"
            done
          }

          safe_delete_numbered() {
            id="$1"
            project="$2"
            test -n "${project}" && test "${project}" != '-' || return 0

            case "${project}" in
              "arl-review-b${id}-"*|"ai-revenue-business-${id}-"*) ;;
              *)
                echo "REFUSING_NON_NUMBERED_DELETE B${id} ${project}" >&2
                return 1
                ;;
            esac

            code="$(get_project_code "${project}")"
            if test "${code}" = '404'; then
              echo "B${id}: ${project} already absent"
              return 0
            fi
            test "${code}" = '200' || {
              echo "B${id}: ${project} lookup failed HTTP ${code}" >&2
              return 1
            }

            delete_code="$(curl -sS -o /tmp/cf-delete.json -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "${api_base}/${project}" || true)"

            if { test "${delete_code}" = '200' || test "${delete_code}" = '204'; }; then
              :
            elif grep -q '8000076\|too many deployments' /tmp/cf-delete.json 2>/dev/null; then
              echo "B${id}: ${project} has high deployment history; cleaning only this numbered project"
              delete_high_deployment_history "${project}" || return 1
              delete_code="$(curl -sS -o /tmp/cf-delete-retry.json -w '%{http_code}' -X DELETE \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "${api_base}/${project}" || true)"
              { test "${delete_code}" = '200' || test "${delete_code}" = '204'; } || return 1
            else
              jq -c '{success,errors,messages}' /tmp/cf-delete.json 2>/dev/null >&2 || true
              return 1
            fi

            for attempt in $(seq 1 15); do
              verify_code="$(get_project_code "${project}")"
              test "${verify_code}" = '404' && {
                echo "B${id}: DELETE_VERIFIED ${project}"
                return 0
              }
              sleep 2
            done
            return 1
          }

          ensure_project() {
            project="$1"
            code="$(get_project_code "${project}")"
            if test "${code}" = '200'; then
              return 0
            fi
            test "${code}" = '404' || return 1

            create_code="$(curl -sS -o /tmp/cf-create.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data "{\"name\":\"${project}\",\"production_branch\":\"main\"}" \
              "${api_base}" || true)"
            if { test "${create_code}" = '200' || test "${create_code}" = '201'; } && jq -e '.success == true' /tmp/cf-create.json >/dev/null 2>&1; then
              return 0
            fi
            jq -c '{success,errors,messages}' /tmp/cf-create.json 2>/dev/null >&2 || true
            return 1
          }

          failures=0
          migrated=0
          header_seen=0

          while IFS=$'\t' read -r id pr sha dir entry target primary review safety; do
            if test "${header_seen}" -eq 0; then
              header_seen=1
              continue
            fi
            test -n "${id}" || continue

            echo "::group::Migrate B${id} -> ${target}"
            reason=''
            status='FAIL'
            source_hash=''
            public_hash=''

            case "${target}" in
              "${id}-"*) ;;
              *) reason='target_name_not_number_prefixed' ;;
            esac

            if test -z "${reason}"; then
              git fetch --no-tags origin "${sha}" >/dev/null 2>&1 || reason='git_fetch_failed'
            fi
            if test -z "${reason}"; then
              git checkout --force --detach "${sha}" >/dev/null 2>&1 || reason='git_checkout_failed'
            fi
            if test -z "${reason}" && test "$(git rev-parse HEAD)" != "${sha}"; then
              reason='sha_mismatch'
            fi
            if test -z "${reason}" && test ! -s "${dir}/${entry}"; then
              reason='source_entry_missing'
            fi

            stage=''
            if test -z "${reason}"; then
              source_hash="$(sha256sum "${dir}/${entry}" | awk '{print $1}')"
              stage="$(mktemp -d)"
              cp -a "${dir}/." "${stage}/"
              if test "${entry}" != 'index.html'; then
                cp "${dir}/${entry}" "${stage}/index.html"
              fi
              staged_hash="$(sha256sum "${stage}/index.html" | awk '{print $1}')"
              test "${staged_hash}" = "${source_hash}" || reason='staged_index_hash_mismatch'
            fi

            if test -z "${reason}" && test "$(get_project_code "${target}")" = '404' && test "${review}" != '-'; then
              safety_code="$(get_project_code "${safety}")"
              if test "${safety_code}" != '200'; then
                reason='safety_project_missing_before_review_delete'
              elif ! safe_delete_numbered "${id}" "${review}"; then
                reason='review_project_delete_failed'
              fi
            fi

            if test -z "${reason}" && ! ensure_project "${target}"; then
              reason='target_project_create_failed'
            fi

            if test -z "${reason}"; then
              deploy_ok=false
              for dattempt in $(seq 1 5); do
                if npx --yes wrangler@4 pages deploy "${stage}" \
                  --project-name "${target}" \
                  --branch main \
                  --commit-hash "${sha}" \
                  --commit-message "B${id} canonical numbered migration from PR #${pr}" \
                  --commit-dirty=false >/tmp/wrangler-deploy.log 2>&1; then
                  deploy_ok=true
                  break
                fi
                if grep -q '8000072\|8000208\|deployments too quickly' /tmp/wrangler-deploy.log; then
                  sleep 20
                else
                  break
                fi
              done
              if test "${deploy_ok}" != true; then
                tail -60 /tmp/wrangler-deploy.log >&2 || true
                reason='target_deploy_failed'
              fi
            fi

            if test -z "${reason}"; then
              verified=false
              public_url="https://${target}.pages.dev/"
              for attempt in $(seq 1 20); do
                root_code="$(curl -L -sS -o /tmp/root.html -w '%{http_code}' "${public_url}" || true)"
                index_code="$(curl -L -sS -o /tmp/index.html -w '%{http_code}' "${public_url}index.html" || true)"
                if test "${root_code}" = '200' && test "${index_code}" = '200'; then
                  root_hash="$(sha256sum /tmp/root.html | awk '{print $1}')"
                  index_hash="$(sha256sum /tmp/index.html | awk '{print $1}')"
                  if test "${index_hash}" = "${source_hash}" || test "${root_hash}" = "${source_hash}"; then
                    public_hash="${index_hash}"
                    verified=true
                    break
                  fi
                fi
                sleep 3
              done
              test "${verified}" = true || reason='public_byte_verification_failed'
            fi

            if test -z "${reason}"; then
              cleanup_failed=0
              if test "${primary}" != '-' && ! safe_delete_numbered "${id}" "${primary}"; then
                cleanup_failed=1
              fi
              if test "${review}" != '-' && ! safe_delete_numbered "${id}" "${review}"; then
                cleanup_failed=1
              fi
              if test "${cleanup_failed}" -eq 1; then
                reason='target_verified_but_legacy_cleanup_partial'
                status='PARTIAL'
              else
                status='PASS'
                migrated=$((migrated + 1))
              fi
            fi

            if test "${status}" = 'FAIL' || test "${status}" = 'PARTIAL'; then
              failures=$((failures + 1))
            fi

            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "${id}" "${target}" "https://${target}.pages.dev/" "${sha}" "${source_hash}" "${public_hash}" \
              "${primary}" "${review}" "${status}" "${reason}" >> /tmp/migration-results.tsv

            test -n "${stage}" && rm -rf "${stage}" || true
            echo "B${id}: ${status} ${reason}"
            echo "::endgroup::"
            sleep 2
          done < /tmp/migration.tsv

          echo '--- MIGRATION RESULTS ---'
          cat /tmp/migration-results.tsv
          echo "MIGRATED_PASS=${migrated}"
          echo "MIGRATION_FAILURE_OR_PARTIAL=${failures}"

          echo '--- CLOUDFLARE PROJECTS AFTER MIGRATION ---'
          npx --yes wrangler@4 pages project list > /tmp/projects-after.txt 2>/tmp/projects-after.err || true
          cat /tmp/projects-after.txt || true

          cp /tmp/migration-results.tsv "${GITHUB_WORKSPACE}/cloudflare-numbered-pages-migration-results.tsv"
          cp /tmp/projects-after.txt "${GITHUB_WORKSPACE}/cloudflare-projects-after-migration.txt" 2>/dev/null || true

          test "${failures}" -eq 0

      - name: Upload numbered migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-numbered-pages-migration-396
          path: |
            cloudflare-numbered-pages-migration-results.tsv
            cloudflare-projects-after-migration.txt
          if-no-files-found: warn

      - name: Publish migration summary
        if: always()
        shell: bash
        run: |
          if test -f cloudflare-numbered-pages-migration-results.tsv; then
            {
              echo '## Numbered Cloudflare Pages migration'
              echo
              echo 'Only number-prefixed BI Business projects were eligible for deletion.'
              echo 'Numberless projects were protected by the workflow delete guard.'
              echo
              echo '```text'
              cat cloudflare-numbered-pages-migration-results.tsv
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
