name: Diagnose Portfolio Pages 2026-08-15

on:
  push:
    branches:
      - agent/diagnose-portfolio-pages-20260815
    paths:
      - .github/workflows/diagnose-portfolio-pages-20260815.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: ai-revenue-portfolio-console
    steps:
      - name: Read Pages project and canonical deployment metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}" \
            -o /tmp/project.json
          canonical_id="$(jq -r '.result.canonical_deployment.id' /tmp/project.json)"
          canonical_url="$(jq -r '.result.canonical_deployment.url' /tmp/project.json)"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments/${canonical_id}" \
            -o /tmp/canonical.json
          jq '{project:{subdomain:.result.subdomain,production_branch:.result.production_branch,build_config:.result.build_config,source:.result.source},canonical:{id:.result.canonical_deployment.id,url:.result.canonical_deployment.url}}' /tmp/project.json
          jq '{canonical_detail:{id:.result.id,url:.result.url,environment:.result.environment,is_skipped:.result.is_skipped,skip_reason:.result.skip_reason,deployment_trigger:.result.deployment_trigger,latest_stage:.result.latest_stage,stages:.result.stages}}' /tmp/canonical.json
          echo "CANONICAL_URL=$canonical_url"

      - name: Compare canonical deployment URL with project root
        shell: bash
        run: |
          set -euo pipefail
          canonical_url="$(jq -r '.result.canonical_deployment.url' /tmp/project.json)"
          for spec in \
            "root|https://${PROJECT_NAME}.pages.dev/review-surfaces-396.js?audit=20260815c" \
            "deployment|${canonical_url}/review-surfaces-396.js?audit=20260815c"; do
            label="${spec%%|*}"
            url="${spec#*|}"
            status="$(curl --silent --show-error --location --output "/tmp/${label}.js" --write-out '%{http_code}' "$url" || true)"
            echo "$label HTTP=$status URL=$url"
            if [ "$status" = "200" ]; then
              echo "$label B07_FINAL=$(grep -c 'ai-revenue-final-b07' "/tmp/${label}.js" || true)"
              echo "$label B08_FINAL=$(grep -c 'ai-revenue-final-b08' "/tmp/${label}.js" || true)"
              echo "$label B09_FINAL=$(grep -c 'ai-revenue-final-b09' "/tmp/${label}.js" || true)"
              echo "$label B11_FINAL=$(grep -c 'ai-revenue-final-b11' "/tmp/${label}.js" || true)"
              sha256sum "/tmp/${label}.js"
            fi
          done
          if [ -f /tmp/root.js ] && [ -f /tmp/deployment.js ]; then
            cmp -s /tmp/root.js /tmp/deployment.js && echo 'ROOT_EQUALS_CANONICAL_DEPLOYMENT=YES' || echo 'ROOT_EQUALS_CANONICAL_DEPLOYMENT=NO'
          fi
