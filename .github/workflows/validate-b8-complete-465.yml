name: Validate B8 Complete 465
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'reference/business-08-family-newspaper-v1/**'
      - '.github/workflows/validate-b8-complete-465.yml'
permissions:
  contents: read
jobs:
  validate:
    if: github.event.pull_request.head.ref == 'feat/b8-family-newspaper-complete-465'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Family Newspaper UI UX and guide
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          base=Path('reference/business-08-family-newspaper-v1')
          for name in ('index.html','ux.html','guide.html'):
              HTMLParser().feed((base/name).read_text(encoding='utf-8'))
          index=(base/'index.html').read_text(encoding='utf-8')
          ux=(base/'ux.html').read_text(encoding='utf-8')
          guide=(base/'guide.html').read_text(encoding='utf-8')
          assert 'APPROVED VISUAL ATLAS' in index
          assert './guide.html' in index and './ux.html#front' in index
          for marker in ('id="front"','id="news"','id="photos"','id="calendar"','id="sources"','data-bookmark','window.onpopstate'):
              assert marker in ux, marker
          for marker in ('GUIDE · 30 SECONDS','01 · COLLECT','02 · EDIT','03 · READ','04 · REVIEW','05 · RETURN','신문 체험 시작'):
              assert marker in guide, marker
          for forbidden in ('fetch(', 'XMLHttpRequest', 'localStorage', 'document.cookie', 'serviceWorker'):
              assert forbidden not in ux+'\n'+guide, forbidden
          for html_name in ('index.html','guide.html'):
              html=(base/html_name).read_text(encoding='utf-8')
              for rel in re.findall(r'(?:href|src)="(\./[^"?#]+)', html):
                  assert (base/rel[2:]).exists(), f'{html_name}: missing {rel}'
          print('B8_UI_UX_GUIDE_STATIC_PASS=1')
          PY
          git diff --check origin/main...HEAD -- 'reference/business-08-family-newspaper-v1/*.html' 'reference/business-08-family-newspaper-v1/styles/**' 'reference/business-08-family-newspaper-v1/scripts/**'
          echo 'B8_COMPLETE_VALIDATION_PASS=1'
