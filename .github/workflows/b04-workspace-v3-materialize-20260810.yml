name: B04 Workspace V3 Materialize 20260810

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/b04-workspace-v3-materialize-20260810.yml'
      - 'apps/living-learning/pages-preview/assets/css/workspace-v3-20260810.css'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'design/b04-adaptive-workspace-v3-20260810'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Inject shared workspace visual layer
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          root=Path('apps/living-learning/pages-preview')
          files=[
            root/'index.html',
            root/'guide.html',
            root/'goals/index.html',
            root/'diagnostic/index.html',
            root/'lesson-1/index.html',
            root/'lesson-1/result/index.html',
            root/'feedback/index.html',
            root/'changes/index.html',
            root/'lesson-2/index.html',
            root/'home/index.html',
            root/'progress/index.html',
            root/'history/index.html',
            root/'review/index.html',
          ]
          marker='workspace-v3-20260810.css'
          link='<link rel="stylesheet" href="/assets/css/workspace-v3-20260810.css">'
          for p in files:
            text=p.read_text(encoding='utf-8')
            if marker not in text:
              if '</head>' not in text:
                raise SystemExit(f'missing </head>: {p}')
              text=text.replace('</head>',link+'\n</head>',1)
              p.write_text(text,encoding='utf-8')
          PY
          git rm .github/workflows/b04-workspace-v3-materialize-20260810.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/living-learning/pages-preview
          git commit -m 'style(B04): materialize Adaptive Workspace V3 across journey'
          git push origin HEAD:${GITHUB_HEAD_REF}
