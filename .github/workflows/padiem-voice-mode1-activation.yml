name: PADIEM Mode1 STT Private Worker Activation

on:
  pull_request:
    paths:
      - "apps/padiem-voice-stt/**"
      - "packages/padiem-control-plane/**"
      - ".github/workflows/padiem-voice-mode1-activation.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only or activate Mode1 private Workers
        required: true
        type: choice
        default: readonly
        options: [readonly, activate]
      target_sha:
        required: true
        type: string
      confirmation:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: padiem-mode1-voice-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'release' }}
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ inputs.target_sha }}
  CONFIRMATION: ${{ inputs.confirmation }}

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Verify exact main for operational dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
      - name: Private STT Worker auth tests
        run: uv run --no-project --python 3.13 --with "pytest==8.4.2" --with "pytest-asyncio==1.2.0" python -m pytest -q apps/padiem-voice-stt/tests
      - name: All-plan voice grants and reservations
        run: uv run --project packages/padiem-control-plane --with pytest python -m pytest -q packages/padiem-control-plane/tests/test_voice_stt_entitlement_policy_4643.py packages/padiem-control-plane/tests/test_engine_entitlement_producer.py
      - name: Package private Worker without deploying
        working-directory: apps/padiem-voice-stt
        run: uvx --from 'workers-py>=1.17.1,<2' pywrangler deploy --dry-run --outdir "$RUNNER_TEMP/padiem-voice-stt-dry-run"

  cloudflare-readonly:
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Inspect canonical CP and private STT Worker without reading secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          for name in padiem-control-plane-identity padiem-control-plane-engine-admission padiem-chat; do
            curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/$name/settings" -o "$RUNNER_TEMP/$name.json"
            jq -e '.success==true and (.result.bindings|type=="array")' "$RUNNER_TEMP/$name.json" >/dev/null
          done
          jq -e '.result.bindings|any(.type=="service" and .name=="CONTROL_PLANE_IDENTITY" and .service=="padiem-control-plane-identity")' "$RUNNER_TEMP/padiem-control-plane-engine-admission.json" >/dev/null
          status="$(curl -sS -o "$RUNNER_TEMP/voice-settings.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/padiem-voice-stt/settings")"
          case "$status" in 404|200) echo "PRIVATE_STT_INSPECTION=$status";; *) exit 1;; esac
          echo "SECRET_VALUES_READ=0"
          echo "PROVIDER_CALLS=0"
          echo "CLOUDFLARE_MUTATIONS=0"

  activate:
    needs: [source-contract, cloudflare-readonly]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'activate' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Require exact approved Mode1 scope and current main
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = ACTIVATE_PADIEM_MODE1_PRIVATE_STT_FROM_EXACT_MAIN
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
      - name: Deploy updated canonical CP Mode1 grant
        working-directory: packages/padiem-control-plane
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          cp wrangler.engine-admission-authority.jsonc wrangler.jsonc
          trap 'rm -f wrangler.jsonc' EXIT
          uvx --from 'workers-py>=1.17.1,<2' pywrangler deploy --strict --tag "git-$TARGET_SHA" --message "PADIEM Mode1 CP grant $TARGET_SHA"
      - name: Create private STT Worker with existing provider secret references
        working-directory: apps/padiem-voice-stt
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          uvx --from 'workers-py>=1.17.1,<2' pywrangler deploy --strict --tag "git-$TARGET_SHA" --message "PADIEM private Mode1 STT $TARGET_SHA"
      - name: Verify private binding names and no public route
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/padiem-voice-stt"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/settings" -o "$RUNNER_TEMP/voice-settings.json"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/subdomain" -o "$RUNNER_TEMP/voice-subdomain.json"
          jq -e '.success==true and (.result.bindings|any(.type=="service" and .name=="CONTROL_PLANE_IDENTITY" and .service=="padiem-control-plane-identity"))' "$RUNNER_TEMP/voice-settings.json" >/dev/null
          jq -e '.result.bindings|any(.type=="service" and .name=="CONTROL_PLANE_ENGINE_ADMISSION" and .service=="padiem-control-plane-engine-admission")' "$RUNNER_TEMP/voice-settings.json" >/dev/null
          jq -e '.result.bindings|any(.type=="secrets_store_secret" and .name=="PADIEM_GROQ_API_KEY" and .secret_name=="PADIEM_GROQ__API_KEY")' "$RUNNER_TEMP/voice-settings.json" >/dev/null
          jq -e '.success==true and .result.enabled==false' "$RUNNER_TEMP/voice-subdomain.json" >/dev/null
          echo "MODE1_PRIVATE_WORKER=VERIFIED"
          echo "PROVIDER_KEY_VALUES_READ=0"
          echo "CHAT_BINDING=REQUIRES_EXISTING_B62_PROTECTED_RELEASE"
