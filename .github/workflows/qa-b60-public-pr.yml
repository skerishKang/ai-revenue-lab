name: QA B60 public site PR

on:
  pull_request:
    paths:
      - .github/workflows/qa-b60-public-pr.yml

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Audit live public surface
        env:
          URL: https://ai-revenue-business-60-ai-api.pages.dev/
        run: |
          cat > /tmp/qa.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch({headless:true});
          const p = await b.newPage({viewport:{width:1440,height:1100}});
          const errors=[];
          p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          p.on('pageerror',e=>errors.push('PAGEERROR: '+e.message));
          const r=await p.goto(process.env.URL,{waitUntil:'networkidle',timeout:60000});
          const snap=async label=>({label,scrollY:await p.evaluate(()=>scrollY),cue:(await p.locator('.scroll-cue').textContent())?.trim(),stage:await p.locator('#stage').getAttribute('class')});
          const s=[];
          s.push(await snap('t0'));
          await p.waitForTimeout(1200); s.push(await snap('t1.2'));
          await p.waitForTimeout(5200); s.push(await snap('t6.4'));
          const connectBox=await p.locator('#connect').boundingBox();
          let clickError=null;
          try { await p.locator('#connect').click({timeout:10000}); } catch(e){ clickError=e.message; }
          await p.waitForTimeout(1500); s.push(await snap('postClick'));
          const connected=await p.locator('#stage').evaluate(el=>el.classList.contains('connected'));
          const marker=(await p.locator('body').innerText()).includes('LIVE ACCESS SIGNAL');
          console.log('QA_RESULT='+JSON.stringify({http:r?.status(),states:s,connectBox,connected,errors,clickError,marker}));
          await b.close();
          JS
          node /tmp/qa.mjs
