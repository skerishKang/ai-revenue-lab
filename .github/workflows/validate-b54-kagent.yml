name: Validate B54 KAgent

on:
  pull_request:
    paths:
      - '.github/actions/shared-python-install/**'
      - 'apps/korean-ai-code-agent/**'
      # #6265 retroactive guard: KAgent's CI installs the shared Core with
      # ``pip install -e ../../packages/padiem-ai-core[...]`` and its tests
      # import ``padiem_ai_core.b14_execution`` and friends directly, so a
      # Core source change is a KAgent surface change even when no Claw or
      # individual-listed file moves. The per-file entries below stay for
      # their contract comments; the glob makes a partial Core edit (the
      # #6265 _OPTIMIZE_FOR removal that only surfaced later through #6280)
      # fail this lane on the same pull request.
      - 'packages/padiem-ai-core/**'
      # The KAgent image facade is a thin wrapper over the Core image helper, and
      # the Core receipt module is what selects the wheel below, so a Core change
      # has to run this suite even when no Claw file moves.
      - 'packages/padiem-ai-core/padiem_ai_core/image_helpers.py'
      - 'packages/padiem-ai-core/padiem_ai_core/pillow_wheel_receipts.py'
      # #5172: the Claw plan boundary uses the shared PC device identity
      # grammar, so a change to that one contract has to run this suite even
      # when no Claw file moves.
      - 'packages/padiem-ai-core/padiem_ai_core/pc_device_identity.py'
      - 'packages/padiem-ai-core/tests/test_pc_device_identity.py'
      - 'packages/padiem-ai-core/tests/test_pillow_wheel_receipts.py'
      - 'packages/padiem-ai-core/tests/test_image_helpers_3037.py'
      - 'packages/padiem-ai-core/pyproject.toml'
      # KAgent cross-contract tests consume the Local Agent broker family, so any
      # broker module change must run this lane. The two literal entries below are
      # required individually: `test_tier_route_consumer_coverage` asserts the
      # exact strings, not the glob. The glob then extends the trigger to the
      # pairing / admission / state modules that the literal pair would miss.
      - 'packages/padiem-control-plane/padiem_control_plane/local_agent_broker.py'
      - 'packages/padiem-control-plane/padiem_control_plane/local_agent_broker_rpc.py'
      - 'packages/padiem-control-plane/padiem_control_plane/local_agent_broker*.py'
      # Claw derives its P01 model policy from the shared product-tier declaration,
      # so a declaration change has to run this suite even when no Claw file moves.
      - 'packages/padiem-control-plane/padiem_control_plane/product_tier_routes.py'
      - '.github/workflows/validate-b54-kagent.yml'
      - '.github/scripts/kagent_parallel_contract_tests.py'
      # #6265: the reverse-dependency trigger contract lives here so a
      # future partial-list regression fails on the same PR.
      - '.github/tests/test_ci_reverse_dependency_paths.py'
      - '.github/scripts/kagent_pytest_style_contract_tests.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-b54-kagent-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: KAgent ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install shared Python dependencies
        uses: ./.github/actions/shared-python-install
        with:
          lane: kagent

      # Receipt/provenance tests never need Pillow, while image-helper tests
      # normally skip in unrelated Core reuse lanes. This canonical image lane
      # has already proved and installed the exact approved wheel, so run both
      # focused groups here and fail if the helper group is globally skipped.
      - name: Run focused Core receipt and image-helper tests
        shell: bash
        env:
          PYTHONPATH: packages/padiem-ai-core
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pytest>=8,<10"
          focused_log="$RUNNER_TEMP/padiem-focused-image-tests.log"
          python -m pytest -q \
            packages/padiem-ai-core/tests/test_pillow_wheel_receipts.py \
            packages/padiem-ai-core/tests/test_image_helpers_3037.py \
            -o addopts='' | tee "$focused_log"
          if grep -q "skipped" "$focused_log"; then
            echo "focused image-helper tests were skipped" >&2
            exit 1
          fi

      - name: Compile source and tests
        working-directory: apps/korean-ai-code-agent
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests

      # The runner discovers the exact original unittest suite, proves a
      # disjoint complete partition by test IDs, then runs both groups in two
      # isolated Python processes on this single Linux/Windows GitHub runner.
      # Each child independently re-discovers and checks the test-ID digest,
      # preserves all failures and skips, and reports the slowest 50 durations.
      - name: Run KAgent contract tests
        working-directory: apps/korean-ai-code-agent
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/.github/scripts/kagent_parallel_contract_tests.py"
      # #6265: every app CI that installs a shared monorepo package must
      # trigger on that package's whole source tree. This contract is the
      # mechanical proof; the incident it encodes is documented in the test.
      - name: Test the reverse-dependency trigger contract
        # -I + direct file run: the repo checkout is not an importable
        # package, and isolated mode keeps the runner environment minimal.
        working-directory: ${{ github.workspace }}
        run: python -I .github/tests/test_ci_reverse_dependency_paths.py

      # unittest discovery collects TestCase cases only, so a pytest-style
      # module in this package contributed zero cases and its assertions ran
      # nowhere in CI. This step derives the exact complementary set from the
      # same discovery and runs only that set, so every test function in the
      # package is executed once and none is executed twice. The whole pytest
      # suite is deliberately not added here: that would re-run the unittest
      # cases and turn this lane into a second full-suite job.
      - name: Run KAgent pytest-style contract tests
        working-directory: apps/korean-ai-code-agent
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pytest>=8,<10" "openpyxl>=3.1,<4"
          python "$GITHUB_WORKSPACE/.github/scripts/kagent_pytest_style_contract_tests.py"
