name: Cleanup remaining numbered Pages legacy 396

on:
  pull_request:
    branches:
      - main
    types: [synchronize, reopened]

permissions:
  contents: read

# Completed: all 15 exact allowlisted numbered legacy projects were removed and
# the post-cleanup Cloudflare Pages inventory was verified at 64 projects.
# Keep paused so future synchronize events cannot repeat cleanup automatically.
concurrency:
  group: numbered-legacy-cleanup-396
  cancel-in-progress: true

jobs:
  cleanup:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'NUMBERED_LEGACY_CLEANUP_COMPLETE_15_OF_15_POST_COUNT_64'
