name: Validate Portfolio Console PR 434

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/portfolio-console
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/portfolio-console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run static and contract tests
        run: npm run test:static

      - name: Resolve the installed Playwright version
        id: playwright-version
        shell: bash
        run: echo "version=$(npx playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: playwright-browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the Node Playwright release this lane resolves
          # from its own lock, so a browser build can never be reused across releases.
          key: pw-chromium-node-${{ steps.playwright-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Select Ubuntu archive for Playwright OS dependencies
        shell: bash
        run: bash ../../.github/scripts/b62_playwright_apt_mirror_3989.sh

      - name: Install Chromium system libraries
        shell: bash
        run: npx playwright install-deps chromium

      - name: Install Chromium browser
        if: steps.playwright-browser-cache.outputs.cache-hit != 'true'
        shell: bash
        run: npx playwright install chromium

      - name: Run baseline browser regression
        run: npx playwright test tests/browser.spec.js --project=chromium-desktop

      - name: Run Business launcher browser matrix
        run: npx playwright test tests/business-launcher.spec.js
