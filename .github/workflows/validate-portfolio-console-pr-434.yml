name: Validate Portfolio Console PR 434

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/portfolio-console/**'
      - '.github/workflows/validate-portfolio-console-pr-434.yml'

permissions:
  contents: read

concurrency:
  group: portfolio-console-pr-434-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/portfolio-console-review-links-396'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/portfolio-console
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/portfolio-console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run static and contract tests
        run: npm run test:static

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser
