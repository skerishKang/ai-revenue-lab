name: Validate Portfolio Console PR 434

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/portfolio-console
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/portfolio-console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run static and contract tests
        run: npm run test:static

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run baseline browser regression
        run: npx playwright test tests/browser.spec.js --project=chromium-desktop

      - name: Run Business launcher browser matrix
        run: npx playwright test tests/business-launcher.spec.js
