name: B08 Type Polish QA 20260810
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/b08-type-polish-qa-20260810.yml'
      - 'reference/business-08-family-newspaper-v1/**'
permissions:
  contents: read
jobs:
  qa:
    if: github.event.pull_request.head.ref == 'fix/b08-korean-publication-rhythm-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install Chromium and Korean fonts
        run: |
          sudo apt-get update -y && sudo apt-get install -y fonts-noto-cjk
          mkdir -p /tmp/b08-polish && cd /tmp/b08-polish && npm init -y >/dev/null 2>&1 && npm install --silent playwright@1.55.0 && npx playwright install chromium
      - name: Serve B08
        run: |
          cd reference/business-08-family-newspaper-v1 && python3 -m http.server 4178 --bind 127.0.0.1 >/tmp/b08-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4178/ >/dev/null && exit 0; sleep 1; done; exit 1
      - name: Screenshot and interaction QA
        run: |
          set -euo pipefail
          mkdir -p /tmp/b08-polish-evidence && cd /tmp/b08-polish
          node <<'JS'
          const {chromium}=require('playwright'); const fs=require('fs'),path=require('path'); const base='http://127.0.0.1:4178'; const vps=[{name:'desktop',width:1440,height:1100},{name:'mobile',width:390,height:844}];
          (async()=>{const b=await chromium.launch({headless:true}),results=[]; for(const vp of vps){
            for(const [name,route,sel] of [['root','/','.fp-lead h2'],['guide','/guide.html','.fp-guide-copy h1']]){const p=await b.newPage({viewport:vp}),errors=[],failed=[];p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(e.message));p.on('response',r=>{if(r.status()>=400)failed.push(`${r.status()} ${r.url()}`)});const r=await p.goto(base+route,{waitUntil:'networkidle'});await p.evaluate(()=>document.fonts.ready);const m=await p.locator(sel).evaluate(h=>{const c=getComputedStyle(h),r=h.getBoundingClientRect();return{font:parseFloat(c.fontSize),line:parseFloat(c.lineHeight),ratio:parseFloat(c.lineHeight)/parseFloat(c.fontSize),w:r.width,h:r.height,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,polish:[...document.styleSheets].some(s=>String(s.href||'').includes('pressroom-v2-type-polish.css'))}});const problems=[...(r.status()===200?[]:['status']),...(m.overflow<=1?[]:['overflow']),...(errors.length||failed.length?['runtime']:[]),...(m.polish?[]:['polish missing']),...(m.ratio>=1?[]:[`tight ${m.ratio}`]),...(vp.name==='mobile'&&m.font>50?[`mobile too large ${m.font}`]:[])];await p.screenshot({path:path.join('/tmp/b08-polish-evidence',`${vp.name}-${name}.png`),fullPage:false});results.push({viewport:vp.name,name,status:r.status(),errors,failed,problems,...m});await p.close()}
            const p=await b.newPage({viewport:vp}),errors=[],failed=[];p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(e.message));p.on('response',r=>{if(r.status()>=400)failed.push(`${r.status()} ${r.url()}`)});const r=await p.goto(base+'/ux.html',{waitUntil:'networkidle'});await p.locator('[data-bookmark]').click();const bookmarked=await p.locator('[data-bookmark]').getAttribute('data-on');for(const id of ['news','photos','calendar','sources']){await p.locator(`.fp-reader-nav [data-page="${id}"]`).click()}const active=await p.locator('.fp-page.active').getAttribute('id');const m=await p.locator('.fp-page.active .fp-page-title').evaluate(h=>{const c=getComputedStyle(h);return{font:parseFloat(c.fontSize),line:parseFloat(c.lineHeight),ratio:parseFloat(c.lineHeight)/parseFloat(c.fontSize),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,polish:[...document.styleSheets].some(s=>String(s.href||'').includes('pressroom-v2-type-polish.css'))}});const problems=[...(r.status()===200?[]:['status']),...(bookmarked==='1'?[]:['bookmark']),...(active==='sources'?[]:['navigation']),...(m.overflow<=1?[]:['overflow']),...(errors.length||failed.length?['runtime']:[]),...(m.polish?[]:['polish missing']),...(m.ratio>=1?[]:[`tight ${m.ratio}`]),...(vp.name==='mobile'&&m.font>48?[`mobile reader too large ${m.font}`]:[])];await p.screenshot({path:path.join('/tmp/b08-polish-evidence',`${vp.name}-reader-sources.png`),fullPage:false});results.push({viewport:vp.name,name:'reader-sources',status:r.status(),bookmarked,active,errors,failed,problems,...m});await p.close();}
            await b.close();const bad=results.filter(x=>x.problems.length);fs.writeFileSync('/tmp/b08-polish-evidence/results.json',JSON.stringify({results,bad},null,2));console.log(JSON.stringify({count:results.length,bad},null,2));if(bad.length)process.exit(1)})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Source scope check
        run: |
          for f in index.html guide.html ux.html; do grep -q 'pressroom-v2-type-polish.css' "reference/business-08-family-newspaper-v1/$f"; done
          git diff --check origin/main...HEAD
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b08-type-polish-evidence-${{ github.run_number }}
          path: /tmp/b08-polish-evidence
          if-no-files-found: error
          retention-days: 7
