name: Verify B4 B6 Inspect B8 465

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/deploy-b1-b2-guides-465.yml'

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'ops/deploy-b1-b2-guides-465'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: 03db134d61f054f53b096104e83ba1342337ae9e
      B4_URL: https://ai-revenue-living-learning.pages.dev
      B6_URL: https://ai-revenue-world-feed.pages.dev
      B8_URL: https://ai-revenue-business-08-family-newspaper.pages.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Assert exact current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
      - name: Verify B4 and B6 canonical bytes
        shell: bash
        run: |
          set -euo pipefail
          fetch_until_match() {
            local url="$1" source="$2" out="$3" label="$4" ok=0
            local expected actual code
            expected=$(sha256sum "$source" | cut -d' ' -f1)
            echo "$label expected_sha256=$expected"
            for i in $(seq 1 20); do
              code=$(curl -L -sS --max-time 20 -o "$out" -w '%{http_code}' "$url" || true)
              actual='none'; [[ -f "$out" ]] && actual=$(sha256sum "$out" | cut -d' ' -f1)
              echo "$label poll=$i http=$code actual_sha256=$actual"
              if [[ "$code" == 200 && "$actual" == "$expected" ]]; then ok=1; break; fi
              sleep 3
            done
            test "$ok" = 1
          }
          fetch_until_match "$B4_URL/guide.html" apps/living-learning/pages-preview/guide.html /tmp/b4-guide.html B4_GUIDE
          fetch_until_match "$B4_URL/index.html" apps/living-learning/pages-preview/index.html /tmp/b4-root.html B4_ROOT
          fetch_until_match "$B6_URL/guide.html" reference/business-06-world-feed-v1/guide.html /tmp/b6-guide.html B6_GUIDE
          fetch_until_match "$B6_URL/index.html" reference/business-06-world-feed-v1/index.html /tmp/b6-root.html B6_ROOT
          echo 'B4_B6_CANONICAL_BYTES_VERIFIED=1'
      - name: Inspect historical B8 canonical URL without mutation
        shell: bash
        run: |
          set -euo pipefail
          for path in / /guide.html /ux.html; do
            code=$(curl -L -sS --max-time 20 -o /tmp/b8.out -w '%{http_code}' "$B8_URL$path" || true)
            echo "B8_URL=$B8_URL$path HTTP=$code SHA256=$(sha256sum /tmp/b8.out 2>/dev/null | cut -d' ' -f1 || true)"
          done
          echo 'B8_CANONICAL_INSPECTION_COMPLETE=1'
