name: Deploy B12 Numbered Canonical 465
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/deploy-b1-b2-guides-465.yml'
permissions:
  contents: read
jobs:
  deploy:
    if: github.event.pull_request.head.ref == 'ops/deploy-b1-b2-guides-465'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: 064561674a39c45dd17b5d03192c56670d301913
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert exact current main and B12 project
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          code=$(curl -sS -o /tmp/b12.json -w '%{http_code}' -H "Authorization: Bearer ${CF_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/12-creator-mini-media")
          echo "12-creator-mini-media HTTP=$code"; test "$code" = 200
      - name: Cool down then deploy B12 exact-main bytes
        shell: bash
        run: |
          set -euo pipefail
          sleep 25
          npx --yes wrangler@latest pages deploy reference/business-12-creator-mini-media-v1 --project-name 12-creator-mini-media --branch main --commit-hash "$EXPECTED_SHA" --commit-message 'B12 latest main UI UX guide review' --commit-dirty=true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify B12 canonical byte equality
        shell: bash
        run: |
          set -euo pipefail
          verify(){ url="$1"; source="$2"; label="$3"; expected=$(sha256sum "$source"|cut -d' ' -f1); for i in $(seq 1 25); do code=$(curl -L -sS --max-time 20 -o /tmp/public -w '%{http_code}' "$url"||true); actual=$(sha256sum /tmp/public 2>/dev/null|cut -d' ' -f1||true); echo "$label poll=$i http=$code expected=$expected actual=$actual"; [[ "$code" == 200 && "$actual" == "$expected" ]] && return 0; sleep 3; done; return 1; }
          verify https://12-creator-mini-media.pages.dev/index.html reference/business-12-creator-mini-media-v1/index.html B12_ROOT
          verify https://12-creator-mini-media.pages.dev/ux.html reference/business-12-creator-mini-media-v1/ux.html B12_UX
          verify https://12-creator-mini-media.pages.dev/guide.html reference/business-12-creator-mini-media-v1/guide.html B12_GUIDE
          echo B12_NUMBERED_CANONICAL_VERIFIED=1
