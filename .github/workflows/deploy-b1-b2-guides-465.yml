name: Align B4 B6 Production 465

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/deploy-b1-b2-guides-465.yml'

permissions:
  contents: read

jobs:
  align-and-deploy:
    if: github.event.pull_request.head.ref == 'ops/deploy-b1-b2-guides-465'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: 0fd4752df0311e41adca5528634acb3b7dccea9d
      B4_PROJECT: ai-revenue-living-learning
      B6_PROJECT: ai-revenue-world-feed
      B4_URL: https://ai-revenue-living-learning.pages.dev
      B6_URL: https://ai-revenue-world-feed.pages.dev
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert exact current main and guide bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          remote_main=$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)
          test "$remote_main" = "$EXPECTED_SHA"
          grep -q 'Guide · 30 seconds' apps/living-learning/pages-preview/guide.html
          grep -q 'href="/guide.html"' apps/living-learning/pages-preview/index.html
          grep -q 'GUIDE · 30 SECONDS' reference/business-06-world-feed-v1/guide.html
          grep -q './guide.html' reference/business-06-world-feed-v1/scripts/views/shell-loading-view.js
      - name: Set canonical Pages production branch to main
        shell: bash
        run: |
          set -euo pipefail
          for project in "$B4_PROJECT" "$B6_PROJECT"; do
            code=$(curl -sS -o "/tmp/${project}-patch.json" -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data '{"production_branch":"main"}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${project}")
            echo "$project PATCH_HTTP=$code"
            cat "/tmp/${project}-patch.json"
            test "$code" = 200
            PROJECT="$project" python3 - <<'PY'
          import json, os
          x=json.load(open('/tmp/'+os.environ['PROJECT']+'-patch.json'))
          assert x.get('success') is True, x.get('errors')
          p=x['result']
          cfg=((p.get('source') or {}).get('config') or {})
          top=p.get('production_branch')
          effective=cfg.get('production_branch') if cfg.get('production_branch') is not None else top
          print(os.environ['PROJECT']+'_EFFECTIVE_PRODUCTION_BRANCH='+str(effective))
          assert effective == 'main', (top,cfg)
          PY
          done
      - name: Deploy exact main bytes as Production
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy apps/living-learning/pages-preview \
            --project-name "$B4_PROJECT" --branch main --commit-hash "$EXPECTED_SHA" \
            --commit-message 'B4 exact main canonical Production'
          npx --yes wrangler@latest pages deploy reference/business-06-world-feed-v1 \
            --project-name "$B6_PROJECT" --branch main --commit-hash "$EXPECTED_SHA" \
            --commit-message 'B6 exact main canonical Production'
      - name: Verify canonical public surfaces
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            url="$1"; marker1="$2"; marker2="$3"; out="$4"; ok=0
            for i in $(seq 1 20); do
              code=$(curl -L -sS --max-time 20 -o "$out" -w '%{http_code}' "$url" || true)
              echo "$url poll=$i http=$code"
              if [[ "$code" == 200 ]] && grep -q "$marker1" "$out" && grep -q "$marker2" "$out"; then ok=1; break; fi
              sleep 3
            done
            test "$ok" = 1
          }
          verify "$B4_URL/guide.html" 'Guide · 30 seconds' '다음 수업이 나에게 맞게' /tmp/b4-guide.html
          verify "$B6_URL/guide.html" 'GUIDE · 30 SECONDS' 'WHY · 설명 가능한 개인화' /tmp/b6-guide.html
          curl -L -sS --max-time 20 "$B4_URL/" > /tmp/b4-root.html
          curl -L -sS --max-time 20 "$B6_URL/" > /tmp/b6-root.html
          grep -q '/guide.html' /tmp/b4-root.html
          grep -q 'world-feed-20260810-6' /tmp/b6-root.html
          echo 'B4_B6_CANONICAL_PUBLIC_VERIFIED=1'
