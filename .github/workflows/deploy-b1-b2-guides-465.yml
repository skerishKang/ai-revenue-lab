name: Deploy B1 B2 B4 B6 B7 Guides 465

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/deploy-b1-b2-guides-465.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.pull_request.head.ref == 'ops/deploy-b1-b2-guides-465'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SHA: 0fd4752df0311e41adca5528634acb3b7dccea9d
      B1_PROJECT: ai-revenue-personal-edition
      B2_PROJECT: ai-revenue-living-travel
      B4_PROJECT: ai-revenue-living-learning
      B6_PROJECT: ai-revenue-world-feed
      B7_PROJECT: ai-revenue-business-07-personal-meaning-map
      B1_URL: https://ai-revenue-personal-edition.pages.dev
      B2_URL: https://ai-revenue-living-travel.pages.dev
      B4_URL: https://ai-revenue-living-learning.pages.dev
      B6_URL: https://ai-revenue-world-feed.pages.dev
      B7_URL: https://ai-revenue-business-07-personal-meaning-map.pages.dev
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert exact current main
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          remote_main=$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)
          echo "remote_main=$remote_main"
          test "$remote_main" = "$EXPECTED_SHA"
      - name: Build and verify exact guide bytes
        run: |
          cd apps/personal-edition
          python -m pip install .
          python -m scripts.build_static_production
          cd ../..
          test -f apps/personal-edition/dist-preview/guide/index.html
          grep -q 'Guide · 30 seconds' apps/personal-edition/dist-preview/guide/index.html
          if grep -q 'UI Preview · Synthetic data · No persistence' apps/personal-edition/dist-preview/guide/index.html; then exit 1; fi
          test -f apps/living-travel/pages-preview/site/guide.html
          grep -q 'Guide · 30 seconds' apps/living-travel/pages-preview/site/guide.html
          test -f apps/living-learning/pages-preview/guide.html
          grep -q 'Guide · 30 seconds' apps/living-learning/pages-preview/guide.html
          grep -q 'href="/guide.html"' apps/living-learning/pages-preview/index.html
          test -f reference/business-06-world-feed-v1/guide.html
          grep -q 'GUIDE · 30 SECONDS' reference/business-06-world-feed-v1/guide.html
          grep -q './guide.html' reference/business-06-world-feed-v1/scripts/views/shell-loading-view.js
          test -f reference/business-07-personal-meaning-map-v1/guide.html
          grep -q 'Guide · 30 seconds' reference/business-07-personal-meaning-map-v1/guide.html
          test -f reference/business-07-personal-meaning-map-v1/ux.html
      - name: Deploy exact main review surfaces
        run: |
          npx --yes wrangler@latest pages deploy apps/personal-edition/dist-preview --project-name "$B1_PROJECT" --branch main --commit-hash "$EXPECTED_SHA" --commit-message 'B1 exact main owner guide review'
          npx --yes wrangler@latest pages deploy apps/living-travel/pages-preview/site --project-name "$B2_PROJECT" --branch main --commit-hash "$EXPECTED_SHA" --commit-message 'B2 exact main owner guide review'
          npx --yes wrangler@latest pages deploy apps/living-learning/pages-preview --project-name "$B4_PROJECT" --branch main --commit-hash "$EXPECTED_SHA" --commit-message 'B4 exact main owner guide review'
          npx --yes wrangler@latest pages deploy reference/business-06-world-feed-v1 --project-name "$B6_PROJECT" --branch main --commit-hash "$EXPECTED_SHA" --commit-message 'B6 exact main UX guide review'
          npx --yes wrangler@latest pages deploy reference/business-07-personal-meaning-map-v1 --project-name "$B7_PROJECT" --branch main --commit-hash "$EXPECTED_SHA" --commit-message 'B7 exact main UI UX guide review'
      - name: Verify canonical public surfaces
        shell: bash
        run: |
          verify() {
            url="$1"; marker1="$2"; marker2="$3"; out="$4"; ok=0
            for i in $(seq 1 30); do
              code=$(curl -L -sS --max-time 20 -o "$out" -w '%{http_code}' "$url" || true)
              echo "$url poll=$i http=$code"
              if [[ "$code" == 200 ]] && grep -q "$marker1" "$out" && grep -q "$marker2" "$out"; then ok=1; break; fi
              sleep 3
            done
            test "$ok" = 1
          }
          verify "$B1_URL/guide/" 'Guide · 30 seconds' 'Personal Edition은' /tmp/b1-guide.html
          verify "$B2_URL/guide.html" 'Guide · 30 seconds' 'Living Travel은' /tmp/b2-guide.html
          verify "$B4_URL/guide.html" 'Guide · 30 seconds' '다음 수업이 나에게 맞게' /tmp/b4-guide.html
          verify "$B6_URL/guide.html" 'GUIDE · 30 SECONDS' 'WHY · 설명 가능한 개인화' /tmp/b6-guide.html
          verify "$B7_URL/guide.html" 'Guide · 30 seconds' 'Select · 기억 조각' /tmp/b7-guide.html
          verify "$B7_URL/ux.html" 'id="connect"' 'id="undo"' /tmp/b7-ux.html
          curl -L -sS --max-time 20 "$B1_URL/" > /tmp/b1-root.html
          curl -L -sS --max-time 20 "$B2_URL/" > /tmp/b2-root.html
          curl -L -sS --max-time 20 "$B4_URL/" > /tmp/b4-root.html
          curl -L -sS --max-time 20 "$B6_URL/" > /tmp/b6-root.html
          curl -L -sS --max-time 20 "$B7_URL/" > /tmp/b7-root.html
          grep -q '/guide/' /tmp/b1-root.html
          grep -q 'guide.html' /tmp/b2-root.html
          grep -q '/guide.html' /tmp/b4-root.html
          grep -q 'world-feed-20260810-6' /tmp/b6-root.html
          grep -q 'personal-meaning-map-20260726-2' /tmp/b7-root.html
          echo 'B1_B2_B4_B6_B7_PUBLIC_VERIFIED=1'
