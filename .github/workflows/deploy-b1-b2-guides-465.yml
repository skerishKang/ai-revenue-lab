name: Verify B6 B7 Deploy B8 B9 Numbered 465
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/deploy-b1-b2-guides-465.yml'
permissions:
  contents: read
jobs:
  deploy:
    if: github.event.pull_request.head.ref == 'ops/deploy-b1-b2-guides-465'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA: d3f6ec2c5656ab2cad62e8b4e5dad0f6bd10f751
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert exact current main and numbered projects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          for project in 06-world-feed 07-personal-meaning-map 08-family-newspaper 09-personalized-childrens-story; do
            code=$(curl -sS -o "/tmp/${project}.json" -w '%{http_code}' -H "Authorization: Bearer ${CF_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${project}")
            echo "$project HTTP=$code"; test "$code" = 200
          done
      - name: Verify already deployed B6 B7 bytes
        shell: bash
        run: |
          set -euo pipefail
          verify_now() {
            url="$1"; source="$2"; label="$3"
            expected=$(sha256sum "$source" | cut -d' ' -f1)
            code=$(curl -L -sS --max-time 20 -o /tmp/public -w '%{http_code}' "$url" || true)
            actual=$(sha256sum /tmp/public 2>/dev/null | cut -d' ' -f1 || true)
            echo "$label http=$code expected=$expected actual=$actual"
            test "$code" = 200; test "$expected" = "$actual"
          }
          verify_now https://06-world-feed.pages.dev/index.html reference/business-06-world-feed-v1/index.html B6_ROOT
          verify_now https://06-world-feed.pages.dev/guide.html reference/business-06-world-feed-v1/guide.html B6_GUIDE
          verify_now https://07-personal-meaning-map.pages.dev/index.html reference/business-07-personal-meaning-map-v1/index.html B7_ROOT
          verify_now https://07-personal-meaning-map.pages.dev/ux.html reference/business-07-personal-meaning-map-v1/ux.html B7_UX
          verify_now https://07-personal-meaning-map.pages.dev/guide.html reference/business-07-personal-meaning-map-v1/guide.html B7_GUIDE
          echo B6_B7_NUMBERED_BYTES_VERIFIED=1
      - name: Deploy B8 then B9 with pacing
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy reference/business-08-family-newspaper-v1 --project-name 08-family-newspaper --branch main --commit-hash "$EXPECTED_SHA" --commit-message 'B8 latest main guide review' --commit-dirty=true
          echo 'Cloudflare pacing 25s before next deployment'
          sleep 25
          npx --yes wrangler@latest pages deploy reference/business-09-personalized-childrens-story-v1 --project-name 09-personalized-childrens-story --branch main --commit-hash "$EXPECTED_SHA" --commit-message 'B9 latest main guide review' --commit-dirty=true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify B8 B9 numbered canonical byte equality
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            local url="$1" source="$2" label="$3"; local expected actual code
            expected=$(sha256sum "$source" | cut -d' ' -f1)
            for i in $(seq 1 25); do
              code=$(curl -L -sS --max-time 20 -o /tmp/public -w '%{http_code}' "$url" || true)
              actual=$(sha256sum /tmp/public 2>/dev/null | cut -d' ' -f1 || true)
              echo "$label poll=$i http=$code expected=$expected actual=$actual"
              if [[ "$code" == 200 && "$expected" == "$actual" ]]; then return 0; fi
              sleep 3
            done
            return 1
          }
          verify https://08-family-newspaper.pages.dev/index.html reference/business-08-family-newspaper-v1/index.html B8_ROOT
          verify https://08-family-newspaper.pages.dev/ux.html reference/business-08-family-newspaper-v1/ux.html B8_UX
          verify https://08-family-newspaper.pages.dev/guide.html reference/business-08-family-newspaper-v1/guide.html B8_GUIDE
          verify https://09-personalized-childrens-story.pages.dev/index.html reference/business-09-personalized-childrens-story-v1/index.html B9_ROOT
          verify https://09-personalized-childrens-story.pages.dev/ux.html reference/business-09-personalized-childrens-story-v1/ux.html B9_UX
          verify https://09-personalized-childrens-story.pages.dev/guide.html reference/business-09-personalized-childrens-story-v1/guide.html B9_GUIDE
          echo NUMBERED_B6_B9_PUBLIC_BYTES_VERIFIED=1
