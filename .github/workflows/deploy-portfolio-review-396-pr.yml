name: Deploy portfolio review surfaces 396

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Safety stop: dedicated arl-review-* project creation is deprecated.
# Canonical redesign will use numbered NN-name projects only.
concurrency:
  group: portfolio-review-deploy-396-pr
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'ARL_REVIEW_PROJECT_CREATION_PAUSED_FOR_NUMBERED_CANONICAL_REDESIGN'
