name: Deploy portfolio review surfaces 396

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: portfolio-review-deploy-396-pr
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/portfolio-review-deploy-396'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out deployment authority branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Deploy review surfaces sequentially
        shell: bash
        run: |
          set -u
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo 'CLOUDFLARE_API_TOKEN missing' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo 'CLOUDFLARE_ACCOUNT_ID missing' >&2; exit 1; }
          export SKIP_VERIFIED=1
          cp ops/portfolio-review-396-manifest.tsv /tmp/portfolio-review-396-manifest.tsv
          printf 'business_id\tsource_pr\texact_sha\tsource_directory\tentry_file\tproject\tpublic_url\tsource_sha256\tpublic_sha256\tstatus\treason\n' > /tmp/portfolio-review-396-results.tsv
          failures=0

          proj_codes="$(curl -sS -o /tmp/projects.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects?per_page=200" || true)"
          echo "cloudflare_pages_project_list_http=${proj_codes}" >&2
          if test "${proj_codes}" = '200'; then
            jq -r '.result | length' /tmp/projects.json 2>/dev/null | xargs -I{} echo "cloudflare_pages_project_count={}" >&2
            jq -r '.result[] | .name' /tmp/projects.json 2>/dev/null | sed 's/^/CF_PROJECT /' >&2
          fi

          deploy_one() {
            id="$1"; pr="$2"; sha="$3"; dir="$4"; project="$5"; entry="$6"
            reason=''
            url="https://${project}.pages.dev/${entry}"

            git fetch --no-tags origin "${sha}" >/dev/null 2>&1 || { reason='git_fetch_failed'; return 1; }
            git checkout --force --detach "${sha}" >/dev/null 2>&1 || { reason='git_checkout_failed'; return 1; }
            test "$(git rev-parse HEAD)" = "${sha}" || { reason='sha_mismatch'; return 1; }
            test -f "${dir}/index.html" || { reason='index_missing'; return 1; }
            test -s "${dir}/${entry}" || { reason='entry_missing_or_empty'; return 1; }

            expected="$(sha256sum "${dir}/${entry}" | awk '{print $1}')"
            if test -n "${SKIP_VERIFIED:-}"; then
              skip_code="$(curl -L -sS -o /tmp/skip.html -w '%{http_code}' "${url}" || true)"
              if test "${skip_code}" = '200'; then
                skip_hash="$(sha256sum /tmp/skip.html | awk '{print $1}')"
                if test "${skip_hash}" = "${expected}"; then
                  echo "B${id}: already verified — skipped re-deploy"
                  verified=true
                  return 0
                fi
              fi
            fi

            api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${project}"
            code="$(curl -sS -o /tmp/project.json -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}" || true)"
            if test "${code}" = '404'; then
              create_ok=false
              for cattempt in $(seq 1 5); do
                create_code="$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data "{\"name\":\"${project}\",\"production_branch\":\"main\"}" \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" || true)"
                if { test "${create_code}" = '200' || test "${create_code}" = '201'; } && jq -e '.success == true' /tmp/create.json >/dev/null 2>&1; then
                  create_ok=true
                  break
                fi
                if test "${cattempt}" = '1'; then
                  (jq -c '{success, errors, messages}' /tmp/create.json 2>/dev/null || head -c 800 /tmp/create.json) | sed -E 's/([[:alnum:]_]*[Tt]oken[[:alnum:]_]*|"value"|api[_-]?key)[^,}]{0,80}/REDACTED/g' >&2
                fi
                sleep 10
              done
              test "${create_ok}" = true || { reason="project_create_http_${create_code}"; return 1; }
            elif test "${code}" = '200'; then
              jq -e '.success == true' /tmp/project.json >/dev/null 2>&1 || { reason='project_lookup_api_failure'; return 1; }
            else
              reason="project_lookup_http_${code}"
              return 1
            fi

            deploy_ok=false
            for dattempt in $(seq 1 6); do
              if npx --yes wrangler@4 pages deploy "${dir}" \
                --project-name "${project}" \
                --branch main \
                --commit-hash "${sha}" \
                --commit-message "B${id} review surface PR #${pr}" \
                --commit-dirty=false >/tmp/wrangler.log 2>&1; then
                deploy_ok=true
                break
              fi
              if grep -q 'deployments too quickly\|8000072\|8000208' /tmp/wrangler.log; then
                echo "B${id}: rate-limited, waiting before deploy retry $dattempt" >&2
                sleep 20
              else
                break
              fi
            done
            if test "${deploy_ok}" != 'true'; then
              tail -80 /tmp/wrangler.log
              reason='wrangler_deploy_failed'
              return 1
            fi

            verified=false
            for attempt in $(seq 1 12); do
              public_code="$(curl -L -sS -o /tmp/public.html -w '%{http_code}' "${url}" || true)"
              if test "${public_code}" = '200'; then
                actual="$(sha256sum /tmp/public.html | awk '{print $1}')"
                if test "${actual}" = "${expected}"; then
                  verified=true
                  break
                fi
              fi
              sleep 3
            done
            test "${verified}" = true || { reason='public_byte_verification_failed'; return 1; }
            return 0
          }

          while IFS=$'\t' read -r id pr sha dir project entry; do
            test -n "${id}" || continue
            echo "::group::Deploy B${id} from PR #${pr}"
            url="https://${project}.pages.dev/${entry}"
            if deploy_one "${id}" "${pr}" "${sha}" "${dir}" "${project}" "${entry}"; then
              status='PASS'
              reason=''
              echo "B${id}: PASS — ${url}"
            else
              status='FAIL'
              failures=$((failures + 1))
              echo "B${id}: FAIL — ${reason}" >&2
            fi
            source_hash="$(git show "${sha}:${dir}/${entry}" 2>/dev/null | sha256sum | awk '{print $1}')"
            public_hash=''
            if test "${status}" = 'PASS'; then
              public_hash="$(curl -L -sS -o /tmp/pubhash.html -w '' "${url}" 2>/dev/null && sha256sum /tmp/pubhash.html | awk '{print $1}')" || true
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "${id}" "${pr}" "${sha}" "${dir}" "${entry}" "${project}" "${url}" "${source_hash}" "${public_hash}" "${status}" "${reason}" >> /tmp/portfolio-review-396-results.tsv
            sleep 4
            echo "::endgroup::"
          done < /tmp/portfolio-review-396-manifest.tsv

          cat /tmp/portfolio-review-396-results.tsv
          cp /tmp/portfolio-review-396-results.tsv "${GITHUB_WORKSPACE}/portfolio-review-396-results.tsv"
          if test "${failures}" -gt 0; then
            echo "${failures} review deployments failed." >&2
            exit 1
          fi

      - name: Upload deployment result manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-review-396-results
          path: portfolio-review-396-results.tsv
          if-no-files-found: error

      - name: Publish result summary
        if: always()
        shell: bash
        run: |
          if test -f portfolio-review-396-results.tsv; then
            {
              echo '## Portfolio review deployment results'
              echo
              echo '```text'
              cat portfolio-review-396-results.tsv
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
