name: Deploy portfolio review surfaces 396

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: portfolio-review-deploy-396-pr
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/portfolio-review-deploy-396'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out deployment authority branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Deploy review surfaces sequentially
        shell: bash
        run: |
          set -u
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo 'CLOUDFLARE_API_TOKEN missing' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo 'CLOUDFLARE_ACCOUNT_ID missing' >&2; exit 1; }
          cp ops/portfolio-review-396-manifest.tsv /tmp/portfolio-review-396-manifest.tsv
          printf 'business_id\tpr\tsha\tproject\turl\tstatus\treason\n' > /tmp/portfolio-review-396-results.tsv
          failures=0

          deploy_one() {
            id="$1"; pr="$2"; sha="$3"; dir="$4"; project="$5"
            reason=''
            url="https://${project}.pages.dev/ux.html"

            git fetch --no-tags origin "${sha}" >/dev/null 2>&1 || { reason='git_fetch_failed'; return 1; }
            git checkout --force --detach "${sha}" >/dev/null 2>&1 || { reason='git_checkout_failed'; return 1; }
            test "$(git rev-parse HEAD)" = "${sha}" || { reason='sha_mismatch'; return 1; }
            test -f "${dir}/index.html" || { reason='index_missing'; return 1; }
            test -s "${dir}/ux.html" || { reason='ux_missing_or_empty'; return 1; }

            api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${project}"
            code="$(curl -sS -o /tmp/project.json -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}" || true)"
            if test "${code}" = '404'; then
              create_code="$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H 'Content-Type: application/json' \
                --data "{\"name\":\"${project}\",\"production_branch\":\"main\"}" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" || true)"
              if ! { test "${create_code}" = '200' || test "${create_code}" = '201'; }; then
                reason="project_create_http_${create_code}"
                return 1
              fi
              jq -e '.success == true' /tmp/create.json >/dev/null 2>&1 || { reason='project_create_api_failure'; return 1; }
            elif test "${code}" = '200'; then
              jq -e '.success == true' /tmp/project.json >/dev/null 2>&1 || { reason='project_lookup_api_failure'; return 1; }
            else
              reason="project_lookup_http_${code}"
              return 1
            fi

            npx --yes wrangler@4 pages deploy "${dir}" \
              --project-name "${project}" \
              --branch main \
              --commit-hash "${sha}" \
              --commit-message "B${id} review UX PR #${pr}" \
              --commit-dirty=false >/tmp/wrangler.log 2>&1 || { tail -80 /tmp/wrangler.log; reason='wrangler_deploy_failed'; return 1; }

            expected="$(sha256sum "${dir}/ux.html" | awk '{print $1}')"
            verified=false
            for attempt in $(seq 1 12); do
              public_code="$(curl -L -sS -o /tmp/public.html -w '%{http_code}' "${url}" || true)"
              if test "${public_code}" = '200'; then
                actual="$(sha256sum /tmp/public.html | awk '{print $1}')"
                if test "${actual}" = "${expected}"; then
                  verified=true
                  break
                fi
              fi
              sleep 3
            done
            test "${verified}" = true || { reason='public_byte_verification_failed'; return 1; }
            return 0
          }

          while IFS=$'\t' read -r id pr sha dir project; do
            test -n "${id}" || continue
            echo "::group::Deploy B${id} from PR #${pr}"
            if deploy_one "${id}" "${pr}" "${sha}" "${dir}" "${project}"; then
              status='PASS'
              reason=''
              echo "B${id}: PASS — https://${project}.pages.dev/ux.html"
            else
              status='FAIL'
              failures=$((failures + 1))
              echo "B${id}: FAIL — ${reason}" >&2
            fi
            printf '%s\t%s\t%s\t%s\thttps://%s.pages.dev/ux.html\t%s\t%s\n' \
              "${id}" "${pr}" "${sha}" "${project}" "${project}" "${status}" "${reason}" >> /tmp/portfolio-review-396-results.tsv
            echo "::endgroup::"
          done < /tmp/portfolio-review-396-manifest.tsv

          cat /tmp/portfolio-review-396-results.tsv
          cp /tmp/portfolio-review-396-results.tsv "${GITHUB_WORKSPACE}/portfolio-review-396-results.tsv"
          if test "${failures}" -gt 0; then
            echo "${failures} review deployments failed." >&2
            exit 1
          fi

      - name: Upload deployment result manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-review-396-results
          path: portfolio-review-396-results.tsv
          if-no-files-found: error

      - name: Publish result summary
        if: always()
        shell: bash
        run: |
          if test -f portfolio-review-396-results.tsv; then
            {
              echo '## Portfolio review deployment results'
              echo
              echo '```text'
              cat portfolio-review-396-results.tsv
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
