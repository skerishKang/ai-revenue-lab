name: Chat COM2 cutover gate
run-name: chat-com2/${{ inputs.mode }}/${{ inputs.target_sha }}/${{ inputs.generation_id }}

# Evidence contract: COM2 signs a minimal summary outside Git. Configure the
# trusted HTTPS URL and Ed25519 public PEM in production; no signing key here.
# Maximum evidence age is 24h from rehearsal completion (reviewed constant).
# Operator setup: docs/operations/CHAT_REHEARSAL_SIGNED_EVIDENCE_20261031.md
# This gate only verifies the existing write freeze. It never opens/closes it,
# stops background writers, exports D1, or performs the separate data handback.

on:
  pull_request:
    paths:
      - '.github/workflows/chat-com2-cutover-gate.yml'
      - '.github/scripts/chat_com2_cutover_gate.py'
      - '.github/tests/test_chat_com2_cutover_gate.py'
      - '.github/scripts/chat_rehearsal_evidence.py'
      - '.github/scripts/chat_publish_rehearsal.py'
      - '.github/tests/test_chat_rehearsal_evidence.py'
      - '.github/scripts/chat_domain_move_trial.py'
      - '.github/tests/test_chat_domain_move_trial.py'
      - 'deploy/host-com2/chat-cutover-trial/**'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [preflight, readonly, switch, rollback]
      target_sha:
        description: Exact current main SHA (40 lowercase hex characters)
        type: string
        required: true
      confirmation:
        description: <MODE>_CHAT_COM2_<target_sha> (MODE in uppercase)
        type: string
        required: true
      generation_id:
        description: Exact expected D1 sync generation ID; except rollback
        type: string
        required: false
      readonly_run_id:
        description: Successful readonly run for this exact SHA; switch only
        type: string
        required: false

permissions:
  contents: read
  actions: read

# Share the existing Python Chat production lock as well as serializing all
# modes here. No mode/ref suffix: rollback cannot overlap an in-flight switch.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('chat-com2-contract-{0}', github.event.pull_request.number) || 'b62-production-code-deploy-gate-production' }}
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest PyYAML cryptography==46.0.7
      - run: python -m pytest -q .github/tests/test_chat_com2_cutover_gate.py .github/tests/test_chat_rehearsal_evidence.py .github/tests/test_chat_domain_move_trial.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test deploy/host-com2/chat-cutover-trial/worker.test.mjs

  gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.mode }}
      TARGET_SHA: ${{ inputs.target_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      TARGET_GENERATION_ID: ${{ inputs.generation_id }}
      READONLY_RUN_ID: ${{ inputs.readonly_run_id }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Validate dispatch before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_SHA" == "$GITHUB_SHA" ]]
          case "$MODE" in
            preflight|readonly|switch|rollback) ;;
            *) exit 2 ;;
          esac
          [[ "$CONFIRMATION" == "${MODE^^}_CHAT_COM2_${TARGET_SHA}" ]]
          if [[ "$MODE" != 'rollback' ]]; then
            [[ "$TARGET_GENERATION_ID" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$ ]]
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing host signature dependency
        if: inputs.mode != 'rollback'
        run: python -m pip install cryptography==46.0.7
      - uses: actions/setup-node@v4
        if: inputs.mode == 'switch'
        with:
          node-version: '22'
      - name: Install pinned Wrangler on disposable runner
        if: inputs.mode == 'switch'
        run: npm install --no-save --no-audit --no-fund wrangler@4.130.0
      - name: Execute one approved mode
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          # The front signs probes itself. Its key is never copied to this job.
          REHEARSAL_EVIDENCE_URL: ${{ vars.CHAT_COM2_REHEARSAL_EVIDENCE_URL }}
          REHEARSAL_PUBLIC_KEY_PEM: ${{ vars.CHAT_COM2_REHEARSAL_PUBLIC_KEY_PEM }}
        run: python .github/scripts/chat_com2_cutover_gate.py
      - name: Switch failure guidance (no automatic rollback)
        if: failure() && inputs.mode == 'switch'
        run: |
          echo 'STOP: switch failed; inspect current domain ownership before any further action.'
          echo 'After this run ends, use rollback mode with current main SHA and ROLLBACK_CHAT_COM2_<SHA>.'
          echo 'Keep both write freezes enabled; data handback and unfreeze are separate operations.'
