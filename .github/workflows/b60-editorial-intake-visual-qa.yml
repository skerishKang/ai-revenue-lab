name: B60 Editorial Intake Visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'reference/business-60-ai-api-v1/operator/editorial-intake/**'
      - 'reference/business-60-ai-api-v1/editorial-intake-workbench.test.cjs'
      - '.github/workflows/b60-editorial-intake-visual-qa.yml'

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$expected" = "$actual"

      - name: Prepare Korean font and filled fixture
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          cd reference/business-60-ai-api-v1/operator/editorial-intake
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          fixture = r'''<script>
          (() => {
            const f = document.getElementById('intake-form');
            const values = {
              sourceUrl:'https://example.com/official-launch', sourceLabel:'Example AI · Official Launch', sourceAuthority:'OFFICIAL_WEB',
              provider:'Example AI', productOrModel:'Example Model', headline:'Example Model이 이번 주 무료', benefitLabel:'$0 · 7 days',
              title:'Example Model free week', summary:'공식 발표에서 7일 무료 사용을 확인한 편집 인입 예시입니다.',
              opportunityType:'TEMP_FREE_ACCESS', editorialRole:'JUST_DROPPED', eligibility:'ACCOUNT_REQUIRED', verification:'VERIFIED_OFFICIAL_WEB',
              categories:'API, CODING', access:'API, Console', startAt:'2026-08-25', expiresAt:'2026-09-01', expiryVerification:'VERIFIED_OFFICIAL_WEB',
              priceOrCredit:'$0 during promotion', limit:'공식 사용량 제한은 별도 문서 확인', conditions:'계정 필요\n프로모션 기간 확인 필요',
              ctaUrl:'https://example.com/use', verifiedAt:'2026-08-25', observedAt:'2026-08-25T08:30:00+09:00'
            };
            for (const [name, value] of Object.entries(values)) {
              if (f.elements[name]) f.elements[name].value = value;
            }
            f.dispatchEvent(new Event('submit', {bubbles:true, cancelable:true}));
          })();
          </script>'''
          html = html.replace('</body>', fixture + '</body>')
          Path('qa.html').write_text(html, encoding='utf-8')
          PY

      - name: Render desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          cd reference/business-60-ai-api-v1
          python3 -m http.server 4173 >/tmp/b60-intake-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          url='http://127.0.0.1:4173/operator/editorial-intake/qa.html'

          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=5000 --window-size=1440,2200 \
            --screenshot="$GITHUB_WORKSPACE/b60-intake-desktop.png" "$url"

          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --force-device-scale-factor=1 --virtual-time-budget=6000 --window-size=390,2600 \
            --screenshot="$GITHUB_WORKSPACE/b60-intake-mobile.png" "$url"

          "$browser" --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=4000 --dump-dom "$url" > "$GITHUB_WORKSPACE/b60-intake-dom.html"

          grep -q '편집 인입 워크벤치' "$GITHUB_WORKSPACE/b60-intake-dom.html"
          grep -q '후보 생성만' "$GITHUB_WORKSPACE/b60-intake-dom.html"
          grep -q 'READY' "$GITHUB_WORKSPACE/b60-intake-dom.html"
          grep -q 'PUBLISH_NOW' "$GITHUB_WORKSPACE/b60-intake-dom.html"
          grep -q 'Example Model이 이번 주 무료' "$GITHUB_WORKSPACE/b60-intake-dom.html"
          grep -q 'editorial-opportunities.js snippet' "$GITHUB_WORKSPACE/b60-intake-dom.html"
          test -s "$GITHUB_WORKSPACE/b60-intake-desktop.png"
          test -s "$GITHUB_WORKSPACE/b60-intake-mobile.png"

      - name: Upload rendered evidence
        uses: actions/upload-artifact@v4
        with:
          name: b60-editorial-intake-visual-evidence
          path: |
            b60-intake-desktop.png
            b60-intake-mobile.png
            b60-intake-dom.html
          retention-days: 7
          if-no-files-found: error
