name: Deploy Final Portfolio Hub 2026-08-15

on:
  push:
    branches:
      - agent/deploy-final-portfolio-hub-20260815
    paths:
      - .github/workflows/deploy-final-portfolio-hub-20260815.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: ai-revenue-final-portfolio
      MAIN_SHA: 8df3ace6dbfb58e121bcc39070f38ba40ee251be
    steps:
      - name: Check out exact reviewed main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MAIN_SHA }}
          persist-credentials: false

      - name: Verify exact source and final review links
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          node --check apps/portfolio-console/review-surfaces-396.js
          for token in ai-revenue-final-b07 ai-revenue-final-b08 ai-revenue-final-b09 ai-revenue-final-b11; do
            grep -Fq "$token" apps/portfolio-console/review-surfaces-396.js
          done

      - name: Ensure dedicated final Portfolio project exists
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/project.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}")"
          if [ "$status" = "404" ]; then
            npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch main
          elif [ "$status" != "200" ]; then
            cat /tmp/project.json || true
            exit 1
          fi

      - name: Deploy exact Portfolio Console to production branch
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy apps/portfolio-console \
            --project-name "$PROJECT_NAME" \
            --branch main \
            --commit-hash "$MAIN_SHA" \
            --commit-message "Final reviewed Portfolio #646" \
            --commit-dirty=false

      - name: Verify final Portfolio public registry
        shell: bash
        run: |
          set -euo pipefail
          url="https://${PROJECT_NAME}.pages.dev/review-surfaces-396.js?finalhub=20260815b"
          ok=0
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 "$url" -o /tmp/live.js; then
              good=1
              for token in ai-revenue-final-b07 ai-revenue-final-b08 ai-revenue-final-b09 ai-revenue-final-b11; do
                grep -Fq "$token" /tmp/live.js || good=0
              done
              if [ "$good" = "1" ]; then ok=1; break; fi
            fi
            sleep 5
          done
          test "$ok" = "1"
          echo "Final Portfolio Hub verified: https://${PROJECT_NAME}.pages.dev/" >> "$GITHUB_STEP_SUMMARY"
