name: B54 Engine D1 Provision Gate Contract Tests

# WO-8 PR-A — CI for the D1 provision gate itself. The gate workflow
# (b54-engine-d1-provision-gate.yml) stays workflow_dispatch-only by contract,
# so its static contract tests run here on pull requests that touch the gate
# or its tests. This workflow never provisions anything: it only parses YAML
# and runs pytest.

on:
  pull_request:
    paths:
      - ".github/workflows/b54-engine-d1-provision-gate.yml"
      - ".github/workflows/b54-engine-d1-provision-gate-contract-tests.yml"
      - ".github/tests/test_b54_engine_d1_provision_gate.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-contract-tests:
    name: Gate contract (parse only, no provisioning)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --quiet pyyaml pytest

      - name: Run gate contract tests
        run: python -m pytest -q .github/tests/test_b54_engine_d1_provision_gate.py

      - name: Record no provisioning performed
        run: |
          echo 'B54_D1_PROVISION_GATE_CONTRACT_TESTS=PASS'
          echo 'D1_PROVISIONED=0'
