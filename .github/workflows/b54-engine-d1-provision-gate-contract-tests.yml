name: B54 Engine D1 Provision Gate Contract Tests

# CI for the dispatch-only D1 provision gate. This workflow never provisions
# anything: it only parses YAML and runs static pytest contracts. Migration
# changes are included in the path filter so a new migration cannot silently
# drift from the explicit owner-authorized provision sequence.

on:
  pull_request:
    paths:
      - ".github/workflows/b54-engine-d1-provision-gate.yml"
      - ".github/workflows/b54-engine-d1-provision-gate-contract-tests.yml"
      - ".github/tests/test_b54_engine_d1_provision_gate.py"
      - ".github/workflows/b54-engine-d1-0009-0013-readonly.yml"
      - ".github/scripts/b54_engine_d1_0009_0013_schema.py"
      - ".github/scripts/b54_engine_d1_0009_0013_foreign_keys.py"
      - ".github/tests/test_b54_engine_d1_0009_0013_gate.py"
      - ".github/workflows/b54-engine-d1-0012-0013-apply.yml"
      - ".github/scripts/b54_engine_d1_0012_0013_*.py"
      - ".github/tests/test_b54_engine_d1_0012_0013_*.py"
      - "docs/operations/ENGINE_D1_0012_0013_GATE_20261030.md"
      - ".github/scripts/b54_engine_d1_0012_0013_apply_evidence.py"
      - ".github/tests/test_b54_engine_d1_0012_0013_apply_evidence.py"
      - "apps/padiem-ai-engine/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b54-engine-d1-provision-gate-contract-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gate-contract-tests:
    name: Gate contract (parse only, no provisioning)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --quiet pyyaml pytest

      - name: Run gate contract tests
        run: python -m pytest -q .github/tests/test_b54_engine_d1_provision_gate.py .github/tests/test_b54_engine_d1_0009_0013_gate.py .github/tests/test_b54_engine_d1_0012_0013_apply_evidence.py .github/tests/test_b54_engine_d1_0012_0013_payload.py .github/tests/test_b54_engine_d1_0012_0013_contract.py

      - name: Record no provisioning performed
        run: |
          echo 'B54_D1_PROVISION_GATE_CONTRACT_TESTS=PASS'
          echo 'D1_PROVISIONED=0'
