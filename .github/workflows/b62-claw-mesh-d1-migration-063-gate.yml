name: B62 Claw Mesh D1 Migration 063 Gate

# #5015: one owner run may stage several trusted PC file tool calls. 063
# rebuilds ``oracle_mesh_dispatch`` so the 047 ``UNIQUE (user_id, run_id)``
# constraint becomes two scoped rules (one legacy dispatch per run, one
# dispatch per trusted tool call) plus one call key that covers both row
# shapes, so an old Worker and a new Worker cannot stage the same call twice.
#
# This gate is the only reviewed path that applies 063 to the canonical live
# private D1. It proves the live table's disposition before any mutation,
# applies exactly the pinned 063 file under a separate owner-authorized
# dispatch, and verifies that every existing row survived with an unchanged
# aggregate count. It never deploys a Worker, never mutates a binding, never
# applies another migration, never reads row content and never emits a
# database identifier.

on:
  pull_request:
    paths:
      - ".github/workflows/b62-claw-mesh-d1-migration-063-gate.yml"
      - ".github/scripts/b62_d1_migration_063_schema.py"
      - ".github/tests/test_b62_d1_migration_063_gate.py"
      - "apps/padiem-chat/migrations/063_oracle_mesh_dispatch_tool_call_scope.sql"
  workflow_dispatch:
    inputs:
      mode:
        description: "Migration 063 gate mode"
        required: true
        type: choice
        default: repository_preflight
        options:
          - repository_preflight
          - cloudflare_readonly
          - apply_migration_063
      target_sha:
        description: "Exact current main SHA, rechecked before live access and mutation"
        required: true
        type: string
      confirmation:
        description: "Explicit mutation authorization; required for apply only"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: b62-claw-mesh-d1-migration-063-gate
  cancel-in-progress: false

env:
  B62_WORKER: padiem-chat
  D1_BINDING: PADIEM_CHAT_DB
  TARGET_SHA: ${{ inputs.target_sha }}

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR exact head
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact dispatch SHA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact current main for dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'PREMUTATION_EXACT_MAIN_SHA=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run migration gate contract tests
        run: |
          python -m pip install --disable-pip-version-check --quiet pytest
          python -m pytest .github/tests/test_b62_d1_migration_063_gate.py -q

      - name: Replay the reviewed 063 source contract
        run: python .github/scripts/b62_d1_migration_063_schema.py offline

      - name: Source-only evidence
        run: |
          echo 'B62_D1_MIGRATION_063_SOURCE_CONTRACT=PASS'
          echo 'PRODUCTION_MUTATION=0'

  cloudflare-readonly:
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'repository_preflight' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      schema_state: ${{ steps.schema.outputs.schema_state }}
      db_fingerprint: ${{ steps.binding.outputs.db_fingerprint }}
      row_count: ${{ steps.counts.outputs.row_count }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconfirm exact main before live readback
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'READONLY_EXACT_MAIN_SHA=PASS'

      - name: Resolve live PADIEM_CHAT_DB binding without emitting identifiers
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          settings="${RUNNER_TEMP}/b62-settings-d1-063.json"
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" \
            -o "${settings}"
          DB_ID="$(python - "${settings}" "${D1_BINDING}" <<'PY'
          import json, re, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          if payload.get('success') is not True:
              raise SystemExit('worker settings read failed')
          bindings = payload.get('result', {}).get('bindings', [])
          hits = [b for b in bindings if b.get('type') == 'd1' and b.get('name') == sys.argv[2]]
          if len(hits) != 1:
              raise SystemExit('expected exactly one live PADIEM_CHAT_DB binding')
          database_id = hits[0].get('id')
          if not isinstance(database_id, str) or re.fullmatch(r'[0-9a-fA-F-]{32,36}', database_id) is None:
              raise SystemExit('live PADIEM_CHAT_DB binding has invalid database id')
          print(database_id)
          PY
          )"
          test -n "${DB_ID}"
          echo "::add-mask::${DB_ID}"
          echo "DB_ID=${DB_ID}" >> "${GITHUB_ENV}"
          fingerprint="$(printf %s "${DB_ID}" | sha256sum | cut -d' ' -f1)"
          test -n "${fingerprint}"
          echo "db_fingerprint=${fingerprint}" >> "${GITHUB_OUTPUT}"
          echo 'LIVE_PADIEM_CHAT_DB_DERIVED=PASS'
          echo 'D1_IDENTIFIER_OUTPUT=0'

      - name: Read only the migration 063 schema disposition
        id: schema
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          query="${RUNNER_TEMP}/b62-d1-063-schema-query.json"
          response="${RUNNER_TEMP}/b62-d1-063-schema-before.json"
          python3 .github/scripts/b62_d1_migration_063_schema.py query "${query}"
          curl -fsS -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${query}" -o "${response}"
          evidence="$(python3 .github/scripts/b62_d1_migration_063_schema.py classify "${response}")"
          echo "${evidence}"
          state="$(printf '%s\n' "${evidence}" | sed -n 's/^B62_D1_MIGRATION_063_SCHEMA=//p' | tr '[:upper:]' '[:lower:]')"
          case "${state}" in missing|pre_063|exact|drift) ;; *) echo 'invalid schema classifier state' >&2; exit 1;; esac
          echo "schema_state=${state}" >> "${GITHUB_OUTPUT}"
          echo 'D1_SCHEMA_QUERY=READ_ONLY'
          echo 'ROW_CONTENT_READ=0'
          echo 'PRODUCTION_MUTATION=0'

      - name: Read only the aggregate dispatch row count
        id: counts
        if: ${{ steps.schema.outputs.schema_state == 'pre_063' || steps.schema.outputs.schema_state == 'exact' }}
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          query="${RUNNER_TEMP}/b62-d1-063-counts-query.json"
          response="${RUNNER_TEMP}/b62-d1-063-counts.json"
          python3 .github/scripts/b62_d1_migration_063_schema.py counts "${query}"
          curl -fsS -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${query}" -o "${response}"
          value="$(python - "${response}" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          blocks = payload.get('result') if payload.get('success') is True else None
          if not isinstance(blocks, list) or len(blocks) != 1:
              raise SystemExit('row count evidence is incomplete')
          block = blocks[0]
          if not isinstance(block, dict) or block.get('success') is not True:
              raise SystemExit('row count statement unsuccessful')
          rows = block.get('results')
          if not isinstance(rows, list) or len(rows) != 1:
              raise SystemExit('row count statement malformed')
          value = rows[0].get('n')
          if not isinstance(value, int) or isinstance(value, bool) or value < 0:
              raise SystemExit('row count is unreadable')
          print(value)
          PY
          )"
          echo "row_count=${value}" >> "${GITHUB_OUTPUT}"
          echo "B62_D1_MIGRATION_063_ROWS_BEFORE=${value}"
          echo 'ROW_CONTENT_READ=0'
          echo 'PRODUCTION_MUTATION=0'

      - name: Read only D1 Time Travel recovery availability
        if: ${{ steps.schema.outputs.schema_state != 'missing' }}
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          response="${RUNNER_TEMP}/b62-d1-063-time-travel-readonly.json"
          # GET only. POST on this endpoint CREATES a recovery bookmark.
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/time_travel/bookmark" \
            -o "${response}"
          python - "${response}" <<'PY'
          import json, re, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          result = payload.get('result') if payload.get('success') is True else None
          mark = result.get('bookmark') if isinstance(result, dict) else None
          if not isinstance(mark, str) or re.fullmatch(r'[A-Za-z0-9_-]{12,130}', mark) is None:
              raise SystemExit('D1_RECOVERY_BOOKMARK_UNAVAILABLE')
          print('D1_RECOVERY_AVAILABLE=PASS')
          PY
          echo 'D1_IDENTIFIER_OUTPUT=0'
          echo 'PRODUCTION_MUTATION=0'

  apply-migration-063:
    needs: [source-contract, cloudflare-readonly]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply_migration_063' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRMATION: ${{ inputs.confirmation }}
      READONLY_SCHEMA_STATE: ${{ needs.cloudflare-readonly.outputs.schema_state }}
      READONLY_DB_FINGERPRINT: ${{ needs.cloudflare-readonly.outputs.db_fingerprint }}
      READONLY_ROW_COUNT: ${{ needs.cloudflare-readonly.outputs.row_count }}
    steps:
      - name: Require explicit migration authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${CONFIRMATION}" = "APPLY_B62_D1_MIGRATION_063_FROM_EXACT_MAIN"
          case "${READONLY_SCHEMA_STATE}" in
            pre_063|exact) ;;
            missing)
              echo 'Refusing mutation: the 047 dispatch table is absent, so 063 has nothing to rebuild.' >&2
              exit 1
              ;;
            drift)
              echo 'Refusing mutation: the live dispatch table is not a reviewed shape.' >&2
              exit 1
              ;;
            *)
              echo 'Refusing mutation: no trustworthy readonly schema disposition.' >&2
              exit 1
              ;;
          esac
          echo 'B62_D1_MIGRATION_063_AUTHORIZATION=PASS'

      - name: Checkout exact approved main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconfirm exact main immediately before mutation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'PREMUTATION_EXACT_MAIN_SHA=PASS'

      - name: Re-resolve the live D1 binding immediately before mutation
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          settings="${RUNNER_TEMP}/b62-settings-d1-063-premutation.json"
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" \
            -o "${settings}"
          DB_ID="$(python - "${settings}" "${D1_BINDING}" <<'PY'
          import json, re, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          bindings = payload.get('result', {}).get('bindings', []) if payload.get('success') is True else []
          hits = [b for b in bindings if b.get('type') == 'd1' and b.get('name') == sys.argv[2]]
          if len(hits) != 1:
              raise SystemExit('expected exactly one live PADIEM_CHAT_DB binding')
          database_id = hits[0].get('id')
          if not isinstance(database_id, str) or re.fullmatch(r'[0-9a-fA-F-]{32,36}', database_id) is None:
              raise SystemExit('live PADIEM_CHAT_DB binding has invalid database id')
          print(database_id)
          PY
          )"
          test -n "${DB_ID}"
          echo "::add-mask::${DB_ID}"
          echo "DB_ID=${DB_ID}" >> "${GITHUB_ENV}"
          fingerprint="$(printf %s "${DB_ID}" | sha256sum | cut -d' ' -f1)"
          test -n "${READONLY_DB_FINGERPRINT}"
          if [ "${fingerprint}" != "${READONLY_DB_FINGERPRINT}" ]; then
            echo 'D1_BINDING_CHANGED_AFTER_READONLY=STOP' >&2
            exit 1
          fi
          echo 'D1_BINDING_IDENTITY_STABLE=PASS'

      - name: Recheck the identical schema immediately before SQL mutation
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          query="${RUNNER_TEMP}/b62-d1-063-premutation-query.json"
          response="${RUNNER_TEMP}/b62-d1-063-premutation.json"
          python3 .github/scripts/b62_d1_migration_063_schema.py query "${query}"
          curl -fsS -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${query}" -o "${response}"
          evidence="$(python3 .github/scripts/b62_d1_migration_063_schema.py classify "${response}")"
          echo "${evidence}"
          state="$(printf '%s\n' "${evidence}" | sed -n 's/^B62_D1_MIGRATION_063_SCHEMA=//p' | tr '[:upper:]' '[:lower:]')"
          test "${state}" = "${READONLY_SCHEMA_STATE}"
          echo "PREMUTATION_SCHEMA_STATE=${state}"
          echo 'PREMUTATION_SCHEMA_STATE_STABLE=PASS'

      - name: Read the aggregate row count before the rebuild
        if: ${{ env.READONLY_SCHEMA_STATE == 'pre_063' }}
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          query="${RUNNER_TEMP}/b62-d1-063-counts-before-query.json"
          response="${RUNNER_TEMP}/b62-d1-063-counts-before.json"
          python3 .github/scripts/b62_d1_migration_063_schema.py counts "${query}"
          curl -fsS -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${query}" -o "${response}"
          echo 'ROW_CONTENT_READ=0'
          echo 'PRODUCTION_MUTATION=0'

      - name: Apply exactly migration 063 once
        if: ${{ env.READONLY_SCHEMA_STATE == 'pre_063' }}
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          apply="${RUNNER_TEMP}/b62-d1-063-apply.json"
          response="${RUNNER_TEMP}/b62-d1-063-apply-response.json"
          # The apply payload is the reviewed 063 file itself: the helper
          # refuses to emit SQL that is not the pinned source, so no other
          # migration and no hand-written statement can reach the live database.
          python3 .github/scripts/b62_d1_migration_063_schema.py apply "${apply}"
          curl -fsS -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${apply}" -o "${response}"
          python3 .github/scripts/b62_d1_migration_063_schema.py check-apply "${response}"
          echo 'B62_D1_MIGRATION_063=APPLIED'
          echo 'PRODUCTION_MUTATION=1'

      - name: Record no-op when migration 063 is already applied
        if: ${{ env.READONLY_SCHEMA_STATE == 'exact' }}
        run: |
          echo 'B62_D1_MIGRATION_063=SKIPPED_ALREADY_APPLIED'
          echo 'PRODUCTION_MUTATION=0'

      - name: Read back the released schema
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          query="${RUNNER_TEMP}/b62-d1-063-post-query.json"
          response="${RUNNER_TEMP}/b62-d1-063-post.json"
          python3 .github/scripts/b62_d1_migration_063_schema.py query "${query}"
          curl -fsS -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${query}" -o "${response}"
          python3 .github/scripts/b62_d1_migration_063_schema.py classify "${response}" \
            | tee "${RUNNER_TEMP}/b62-d1-063-post-verdict.txt"
          grep -qx 'B62_D1_MIGRATION_063_SCHEMA=EXACT' "${RUNNER_TEMP}/b62-d1-063-post-verdict.txt"
          echo 'B62_D1_MIGRATION_063_POST_APPLY=EXACT'
          echo 'ROW_CONTENT_READ=0'
          echo 'D1_IDENTIFIER_OUTPUT=0'

      - name: Verify row preservation after the rebuild
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          query="${RUNNER_TEMP}/b62-d1-063-counts-after-query.json"
          response="${RUNNER_TEMP}/b62-d1-063-counts-after.json"
          python3 .github/scripts/b62_d1_migration_063_schema.py counts "${query}"
          curl -fsS -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${query}" -o "${response}"
          if [ "${READONLY_SCHEMA_STATE}" = "pre_063" ]; then
            python3 .github/scripts/b62_d1_migration_063_schema.py check-counts \
              "${RUNNER_TEMP}/b62-d1-063-counts-before.json" "${response}"
          else
            python3 .github/scripts/b62_d1_migration_063_schema.py check-count-arg \
              "${response}" "${READONLY_ROW_COUNT}"
          fi
          echo 'WORKER_DEPLOYED=0'
          echo 'BINDING_MUTATION=0'
          echo 'UNRELATED_MIGRATION_APPLY=0'
          echo 'ROW_CONTENT_READ=0'
