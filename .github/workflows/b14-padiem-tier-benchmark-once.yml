name: B14 Padiem tier benchmark once

on:
  push:
    branches:
      - test/b14-1435-bounded-kilo-benchmark

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Run bounded sequential benchmark
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          corpus_path = Path('apps/padiem-chat/tests/fixtures/padiem_tier_benchmark_v1.json')
          corpus = json.loads(corpus_path.read_text(encoding='utf-8'))
          assert corpus['version'] == 'padiem-tier-benchmark-v1'
          assert corpus['data_policy'] == 'synthetic_non_sensitive_only'
          assert len(corpus['cases']) == 6

          endpoint = 'https://api.kilo.ai/api/gateway/chat/completions'
          candidates = [
              {
                  'tier': 'Padiem Plus',
                  'model': 'poolside/laguna-s-2.1:free',
              },
              {
                  'tier': 'Padiem Pro',
                  'model': 'nvidia/nemotron-3-ultra-550b-a55b:free',
              },
              {
                  'tier': 'Padiem Max',
                  'model': 'tencent/hy3:free',
              },
          ]

          results = []
          disposition = 'BENCHMARK_COMPLETE'
          stop_reason = None
          consecutive_5xx = 0
          call_count = 0

          # Round-robin by case, still strictly sequential (parallelism=1), so a
          # shared-IP rate limit does not systematically starve the later tiers.
          for case in corpus['cases']:
              if stop_reason:
                  break
              for candidate in candidates:
                  if stop_reason:
                      break
                  if call_count >= 18:
                      stop_reason = 'MAX_PROVIDER_CALLS_REACHED'
                      disposition = 'PROVIDER_BLOCKED_PARTIAL'
                      break

                  call_count += 1
                  started = time.perf_counter()
                  body = json.dumps(
                      {
                          'model': candidate['model'],
                          'messages': [
                              {'role': 'user', 'content': case['prompt']},
                          ],
                      },
                      ensure_ascii=False,
                  ).encode('utf-8')
                  request = urllib.request.Request(
                      endpoint,
                      data=body,
                      method='POST',
                      headers={
                          'Content-Type': 'application/json',
                          'User-Agent': 'Padiem-Bounded-Benchmark/1.0',
                      },
                  )

                  row = {
                      'call_index': call_count,
                      'tier': candidate['tier'],
                      'requested_model': candidate['model'],
                      'case_id': case['id'],
                      'category': case['category'],
                      'rubric': case['rubric'],
                  }

                  try:
                      with urllib.request.urlopen(request, timeout=90) as response:
                          raw = response.read()
                          latency_ms = round((time.perf_counter() - started) * 1000, 1)
                          status = int(response.status)
                          payload = json.loads(raw.decode('utf-8'))
                          reported_model = payload.get('model')
                          choices = payload.get('choices') or []
                          content = ''
                          if choices:
                              message = choices[0].get('message') or {}
                              content = message.get('content') or ''

                          row.update(
                              {
                                  'http_status': status,
                                  'latency_ms': latency_ms,
                                  'reported_model': reported_model,
                                  'response_text': content,
                              }
                          )
                          results.append(row)
                          consecutive_5xx = 0

                          if status != 200:
                              stop_reason = f'UNEXPECTED_HTTP_{status}'
                              disposition = 'ROUTE_DEFECT'
                          elif reported_model and reported_model != candidate['model']:
                              stop_reason = 'MODEL_ROUTE_MISMATCH'
                              disposition = 'ROUTE_DEFECT'

                          print(
                              f"call={call_count} tier={candidate['tier']} case={case['id']} "
                              f"status={status} latency_ms={latency_ms}"
                          )

                  except urllib.error.HTTPError as exc:
                      latency_ms = round((time.perf_counter() - started) * 1000, 1)
                      status = int(exc.code)
                      row.update({'http_status': status, 'latency_ms': latency_ms, 'response_text': ''})
                      results.append(row)
                      print(
                          f"call={call_count} tier={candidate['tier']} case={case['id']} "
                          f"status={status} latency_ms={latency_ms}"
                      )

                      if status == 429:
                          stop_reason = 'HTTP_429'
                          disposition = 'RATE_LIMIT_BLOCKED_PARTIAL'
                      elif 500 <= status <= 599:
                          consecutive_5xx += 1
                          if consecutive_5xx >= 2:
                              stop_reason = 'PROVIDER_5XX_STREAK'
                              disposition = 'PROVIDER_BLOCKED_PARTIAL'
                      else:
                          stop_reason = f'HTTP_{status}'
                          disposition = 'ROUTE_DEFECT'

                  except Exception as exc:
                      latency_ms = round((time.perf_counter() - started) * 1000, 1)
                      row.update(
                          {
                              'http_status': None,
                              'latency_ms': latency_ms,
                              'response_text': '',
                              'client_error_type': type(exc).__name__,
                          }
                      )
                      results.append(row)
                      stop_reason = 'CLIENT_OR_NETWORK_ERROR'
                      disposition = 'PROVIDER_BLOCKED_PARTIAL'
                      print(
                          f"call={call_count} tier={candidate['tier']} case={case['id']} "
                          f"status=CLIENT_ERROR latency_ms={latency_ms}"
                      )

                  if not stop_reason and call_count < 18:
                      time.sleep(3)

          output = {
              'benchmark_version': corpus['version'],
              'source_sha': '${{ github.sha }}',
              'execution_branch': '${{ github.ref_name }}',
              'max_provider_calls': 18,
              'provider_calls_attempted': call_count,
              'parallelism': 1,
              'ordering': 'case_round_robin_sequential',
              'disposition': disposition,
              'stop_reason': stop_reason,
              'results': results,
          }
          Path('padiem-tier-benchmark-results.json').write_text(
              json.dumps(output, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          print(
              f"FINAL_DISPOSITION={disposition} PROVIDER_CALLS_ATTEMPTED={call_count} "
              f"STOP_REASON={stop_reason or 'NONE'}"
          )
          PY

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: padiem-tier-benchmark-results
          path: padiem-tier-benchmark-results.json
          if-no-files-found: error
          retention-days: 7
