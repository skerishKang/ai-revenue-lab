name: Cleanup approved Cloudflare Pages projects 396

on:
  pull_request:
    branches:
      - main
    types: [synchronize, reopened]

permissions:
  contents: read

# Safety stop: owner changed cleanup scope to numbered Business projects only.
# Any older in-progress cleanup using the previous broader target list must be cancelled.
concurrency:
  group: portfolio-review-cleanup-396-pr
  cancel-in-progress: true

jobs:
  cleanup:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'CLOUDFLARE_CLEANUP_PAUSED_FOR_NUMBERED_BUSINESS_ONLY_REDESIGN'
