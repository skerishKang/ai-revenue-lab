name: B60 Korean Static Sections Visual Temp

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.number == 680
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7169bbbfda5820bee604c7e36abf524655e8a0e1
          persist-credentials: false
      - name: Install Chromium
        shell: bash
        run: |
          mkdir -p /tmp/b60vis
          cd /tmp/b60vis
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Capture exact sections
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          python3 -m http.server 4174 --directory "$GITHUB_WORKSPACE/apps/portfolio-console/ai-api" >/tmp/b60-vis-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
          cd /tmp/b60vis
          GITHUB_WORKSPACE="$GITHUB_WORKSPACE" node <<'NODE'
          const { chromium } = require('playwright');
          const path = require('path');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const c of [{name:'desktop',viewport:{width:1440,height:1000}},{name:'mobile',viewport:{width:390,height:844}}]){
              const page=await browser.newPage({viewport:c.viewport});
              await page.goto('http://127.0.0.1:4174/',{waitUntil:'networkidle'});
              await page.waitForSelector('#explore');
              await page.locator('#signal').screenshot({path:path.join(process.env.GITHUB_WORKSPACE,'evidence',`${c.name}-static-signal.png`)});
              await page.locator('#source').screenshot({path:path.join(process.env.GITHUB_WORKSPACE,'evidence',`${c.name}-static-source.png`)});
              const signal=await page.locator('#signal').innerText();
              const source=await page.locator('#source').innerText();
              if(!signal.includes('확실한 것과')||!signal.includes('추가 확인 필요')) throw new Error(`${c.name}: signal Korean copy missing`);
              if(!source.includes('출처 신뢰도')||!source.includes('공식 확인 완료')||!source.includes('추가 확인 필요')) throw new Error(`${c.name}: source Korean copy missing`);
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: b60-korean-static-sections-visual
          path: evidence/
          if-no-files-found: error
