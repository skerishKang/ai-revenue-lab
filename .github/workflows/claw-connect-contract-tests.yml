name: Claw Connect Contract Tests

# #4139 — CI for the Windows-only PADIEM Connector (`apps/claw-connect/**`).
#
# Gap this closes: no workflow in this repository referenced claw-connect, so
# the connector's own suites ran only on a developer PC. PR #4463 (S2
# enrollment client) reported pytest/node results that no CI job had executed:
# its only PR-triggered checks were the shared P01-boundary, operations-policy
# and PR-contract guards plus browser QA jobs that skip on this path.
#
# Scope: run the connector's existing suites unchanged on the revision under
# review. This workflow never deploys, never touches Production, D1, secrets,
# a broker endpoint or the autostart registry, and holds no credential.
# `windows-latest` is used because the product is win32-only
# (`package.json` `os: ["win32"]`; tray/autostart/single-instance paths use
# `winreg`), so a Linux run would not be evidence for the shipped artifact.
#
# Deliberate non-goal: `apps/claw-connect/verify_windows_live.py`, the
# real-process Windows harness. It starts and stops supervised Connector
# processes and mutates per-user state; promoting it to a CI gate needs its
# own reviewed decision (see #3099).

on:
  pull_request:
    paths:
      - '.github/actions/shared-python-install/**'
      - "apps/claw-connect/**"
      # #7105: the stage-2 round trip runs the executor's own PowerShell pipe
      # client against the real helper, so a change to that client is a
      # claw-connect surface. It is imported from source, not installed.
      - "apps/korean-ai-code-agent/src/kagent/local_agent_oracle_mesh_executor.py"
      # #6265 retroactive guard: the contract tests install the shared Core
      # with pip install -e, so a Core source change is a claw-connect
      # surface change even when no claw-connect file moves.
      - "packages/padiem-ai-core/**"
      - ".github/workflows/claw-connect-contract-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claw-connect-contract-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  python-contract-tests:
    name: Connector contract tests (pytest)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/claw-connect
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install shared Python dependencies
        uses: ./.github/actions/shared-python-install
        with:
          lane: claw-connect

      - name: Run connector contract tests
        run: python -m pytest -q tests

      - name: Record gate scope
        run: |
          echo 'CLAW_CONNECT_PYTEST=EXECUTED'
          echo 'PRODUCTION_DEPLOYMENT=0'

  node-wrapper-tests:
    name: Connector wrapper tests (node)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/claw-connect
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No install step: `apps/claw-connect/package.json` declares no
      # dependencies and ships no lockfile. `npm test` is the package's own
      # declared entry point (`node --test tests/*.test.mjs`).
      - name: Run connector wrapper tests
        run: npm test

      - name: Record gate scope
        run: |
          echo 'CLAW_CONNECT_NODE_TESTS=EXECUTED'
          echo 'PRODUCTION_DEPLOYMENT=0'

  user-helper-single-file:
    name: User helper single-file EXE (build + real pipe)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/claw-connect
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install shared Python dependencies
        uses: ./.github/actions/shared-python-install
        with:
          lane: claw-connect

      - name: Build the no-Python helper EXE
        shell: powershell
        run: |
          $result = ./build-windows-helper.ps1 -OutRoot "$env:RUNNER_TEMP\padiem-helper" | ConvertFrom-Json
          if (-not $result.ok) { throw "helper build did not report ok" }
          if (-not (Test-Path -LiteralPath $result.exe -PathType Leaf)) { throw "helper EXE missing" }
          "PADIEM_HELPER_EXE=$($result.exe)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "PADIEM_HELPER_SHA256=$($result.sha256)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "PADIEM_HELPER_BYTES=$($result.bytes)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "PADIEM_HELPER_BUILD_SECONDS=$($result.build_seconds)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          $result | ConvertTo-Json -Compress

      - name: Run the real pipe round trip
        run: python -m pytest -q tests/test_helper_single_file_7108.py -s

      - name: Record helper build receipt
        shell: powershell
        run: |
          echo "HELPER_BYTES=$env:PADIEM_HELPER_BYTES"
          echo "HELPER_BUILD_SECONDS=$env:PADIEM_HELPER_BUILD_SECONDS"
          echo "HELPER_SHA256=$env:PADIEM_HELPER_SHA256"
          echo "USER_HELPER_SINGLE_FILE=EXECUTED"
          echo "PRODUCTION_DEPLOYMENT=0"
