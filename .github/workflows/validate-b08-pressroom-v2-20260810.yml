name: Validate B08 Pressroom V2 20260810
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'reference/business-08-family-newspaper-v1/**'
      - '.github/workflows/validate-b08-pressroom-v2-20260810.yml'
permissions:
  contents: read
jobs:
  validate:
    if: github.event.pull_request.head.ref == 'design/b08-family-pressroom-v2-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.ref }}', fetch-depth: 0}
      - name: Static product contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          base=Path('reference/business-08-family-newspaper-v1')
          for rel in ('index.html','ux.html','guide.html'):
              text=(base/rel).read_text(encoding='utf-8')
              assert 'pressroom-v2.css' in text, rel
              assert '.svg' not in text.lower(), rel
              assert 'Visual Atlas' not in text and 'VISUAL ATLAS' not in text, rel
              assert 'APPROVED VISUAL ATLAS' not in text, rel
          root=(base/'index.html').read_text(encoding='utf-8'); ux=(base/'ux.html').read_text(encoding='utf-8'); guide=(base/'guide.html').read_text(encoding='utf-8'); css=(base/'styles/pressroom-v2.css').read_text(encoding='utf-8')
          for marker in ('30초 사용법','이번 호','기사','편집 노트'):
              assert marker in root and marker in ux and marker in guide, marker
          for marker in ('.fp-front','.fp-reader','.fp-guide-hero','.fp-photo-grid'):
              assert marker in css, marker
          for forbidden in ('fetch(', 'XMLHttpRequest', 'localStorage', 'document.cookie', 'serviceWorker'):
              assert forbidden not in root+'\n'+ux+'\n'+guide, forbidden
          print('B08_PRESSROOM_STATIC_PASS=1')
          PY
          git diff --check origin/main...HEAD -- 'reference/business-08-family-newspaper-v1/**'
      - name: Install browser and Korean fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p /tmp/b08-browser && cd /tmp/b08-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.54.1
          npx playwright install chromium
      - name: Browser reader journey and screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b08-evidence
          python3 -m http.server 4188 --directory reference/business-08-family-newspaper-v1 >/tmp/b08-http.log 2>&1 &
          server=$!; trap 'kill $server || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4188/index.html >/dev/null && break; sleep .5; done
          cd /tmp/b08-browser
          node <<'JS'
          const {chromium}=require('playwright');const fs=require('fs'),path=require('path');const out='/tmp/b08-evidence';
          async function clean(page,label){const d=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,svg:[...document.images].filter(i=>/\.svg(?:[?#]|$)/i.test(i.getAttribute('src')||'')).length,text:document.body.innerText}));if(d.sw>d.cw+1)throw new Error(`${label}: overflow ${d.sw}>${d.cw}`);if(d.svg)throw new Error(`${label}: SVG remains ${d.svg}`);if(/VISUAL ATLAS|APPROVED VISUAL/i.test(d.text))throw new Error(`${label}: old reference chrome visible`);return d}
          (async()=>{const browser=await chromium.launch({headless:true});const manifest={};for(const vp of [{name:'desktop',width:1440,height:1100},{name:'mobile',width:390,height:844}]){
            const root=await browser.newPage({viewport:{width:vp.width,height:vp.height}});const re=[];root.on('console',m=>{if(m.type()==='error')re.push(m.text())});root.on('pageerror',e=>re.push(e.message));await root.goto('http://127.0.0.1:4188/index.html',{waitUntil:'networkidle'});manifest[`${vp.name}-root`]=await clean(root,`${vp.name}:root`);if(re.length)throw new Error(re.join('|'));await root.screenshot({path:path.join(out,`b08-root-${vp.name}.png`),fullPage:true});await root.close();
            const guide=await browser.newPage({viewport:{width:vp.width,height:vp.height}});await guide.goto('http://127.0.0.1:4188/guide.html',{waitUntil:'networkidle'});if(!(await guide.locator('body').innerText()).includes('GUIDE · 30 SECONDS'))throw new Error(`${vp.name}: guide marker missing`);manifest[`${vp.name}-guide`]=await clean(guide,`${vp.name}:guide`);await guide.screenshot({path:path.join(out,`b08-guide-${vp.name}.png`),fullPage:true});await guide.close();
            const ux=await browser.newPage({viewport:{width:vp.width,height:vp.height}});const ue=[];ux.on('console',m=>{if(m.type()==='error')ue.push(m.text())});ux.on('pageerror',e=>ue.push(e.message));await ux.goto('http://127.0.0.1:4188/ux.html#front',{waitUntil:'networkidle'});const ids=['front','news','photos','calendar','sources'];for(const id of ids){await ux.locator(`[data-page="${id}"]`).click();if(!(await ux.locator(`#${id}`).getAttribute('class')).includes('active'))throw new Error(`${vp.name}:${id} did not activate`)}await ux.locator('[data-page="front"]').click();const mark=ux.locator('[data-bookmark]');await mark.click();if((await mark.getAttribute('data-on'))!=='1')throw new Error(`${vp.name}: bookmark on failed`);await mark.click();if((await mark.getAttribute('data-on'))!=='0')throw new Error(`${vp.name}: bookmark off failed`);manifest[`${vp.name}-ux`]=await clean(ux,`${vp.name}:ux`);if(ue.length)throw new Error(ue.join('|'));await ux.screenshot({path:path.join(out,`b08-ux-${vp.name}.png`),fullPage:true});await ux.close();}
            fs.writeFileSync(path.join(out,'manifest.json'),JSON.stringify(manifest,null,2));await browser.close();console.log('B08_PRESSROOM_BROWSER_PASS=1')})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: b08-pressroom-v2-20260810, path: /tmp/b08-evidence, retention-days: 7, if-no-files-found: warn}
