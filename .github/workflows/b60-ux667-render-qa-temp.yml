name: B60 UX667 Render QA Temp

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.number == 668
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/b60qa"
          npm install --prefix "${RUNNER_TEMP}/b60qa" playwright@1.55.0 >/dev/null
          "${RUNNER_TEMP}/b60qa/node_modules/.bin/playwright" install --with-deps chromium >/dev/null

      - name: Start static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory apps/portfolio-console >"${RUNNER_TEMP}/b60-server.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ai-api/ >/dev/null && exit 0
            sleep 1
          done
          cat "${RUNNER_TEMP}/b60-server.log"
          exit 1

      - name: Run exact route compare and handoff gate
        shell: bash
        env:
          PW: ${{ runner.temp }}/b60qa/node_modules/playwright
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/b60-ux667"
          cat > "${RUNNER_TEMP}/b60-ux667/run.cjs" <<'NODE'
          const { chromium } = require(process.env.PW);
          const fs = require('fs');
          const path = require('path');
          const out = process.env.RUNNER_TEMP + '/b60-ux667';
          const failures = [];
          const evidence = [];
          const assert = (cond, msg) => { if (!cond) failures.push(msg); };
          const shot = async (page, name) => page.screenshot({path:path.join(out,name), fullPage:false});

          async function exercise(viewport, prefix) {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport});
            const consoleErrors = [];
            const requestFailures = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('requestfailed', req => requestFailures.push(`${req.method()} ${req.url()} ${req.failure()?.errorText || ''}`));
            await page.goto('http://127.0.0.1:4173/ai-api/', {waitUntil:'networkidle'});
            await page.locator('#explore').scrollIntoViewIfNeeded();
            await page.waitForSelector('.ia-primary');
            await page.waitForSelector('.ux2-compare-tray');

            const actualViewport = await page.evaluate(() => ({innerWidth,innerHeight,clientWidth:document.documentElement.clientWidth}));
            assert(actualViewport.innerWidth === viewport.width, `${prefix}: wrong viewport ${JSON.stringify(actualViewport)}`);

            const contract = await page.evaluate(() => window.B60_EXECUTION_HANDOFF);
            const keys = Object.keys(contract?.mappings || {});
            assert(keys.length === 1 && keys[0] === 'openrouter-free-router', `${prefix}: exact mapping violated ${JSON.stringify(keys)}`);
            assert(contract.mappings['openrouter-free-router'].b14ModelId === 'openrouter/free', `${prefix}: B14 model mismatch`);
            assert(contract.mappings['openrouter-free-router'].b14RouteId === 'openrouter:openrouter/free', `${prefix}: B14 route mismatch`);
            assert(contract.mappings['openrouter-free-router'].targetUrl === null, `${prefix}: target URL must remain null`);

            const compareButtons = page.locator('.access-card [data-compare-id]');
            assert(await compareButtons.count() === 5, `${prefix}: expected 5 discovery compare actions`);
            await compareButtons.nth(0).click();
            await compareButtons.nth(1).click();
            await page.waitForTimeout(80);
            assert((await page.locator('[data-compare-count]').textContent()).trim() === '2 / 3', `${prefix}: compare count not 2/3`);
            assert(await page.locator('[data-open-compare]').isEnabled(), `${prefix}: compare button not enabled`);
            await shot(page, `${prefix}-01-discover-selected.png`);

            await page.locator('[data-open-compare]').click();
            await page.waitForSelector('.ux2-sheet.is-open');
            assert(await page.locator('.ux2-compare-card').count() === 2, `${prefix}: compare sheet expected 2 cards`);
            for (const label of ['ACCESS','FREE / CREDIT','PRICE','CONTEXT','VERIFIED','EXECUTION']) {
              assert((await page.locator('.ux2-compare-card dt').allTextContents()).includes(label), `${prefix}: compare field missing ${label}`);
            }
            const compareRect = await page.locator('.ux2-sheet-panel').boundingBox();
            assert(compareRect && compareRect.x >= -1 && compareRect.x + compareRect.width <= actualViewport.innerWidth + 1, `${prefix}: compare panel horizontal overflow ${JSON.stringify(compareRect)}`);
            await shot(page, `${prefix}-02-compare.png`);
            await page.locator('[data-close-sheet]').click();

            await compareButtons.nth(2).click();
            await compareButtons.nth(3).click();
            await page.waitForTimeout(60);
            assert((await page.locator('[data-compare-count]').textContent()).trim() === '3 / 3', `${prefix}: max compare count violated`);
            assert((await page.locator('[data-compare-status]').textContent()).includes('최대 3개'), `${prefix}: max-three feedback missing`);

            await page.locator('.ia-primary [data-ia-view="connect"]').click();
            await page.waitForSelector('.ia-connect-boundary');
            await page.waitForTimeout(100);
            const routes = page.locator('.ia-connect-routes article');
            assert(await routes.count() === 5, `${prefix}: Connect route count mismatch`);
            assert(await page.locator('.ia-connect-routes [data-runtime-state="CONNECTABLE"]').count() === 1, `${prefix}: expected exactly one mapped route`);
            assert(await page.locator('.ia-connect-routes [data-runtime-state="DISCOVERABLE_ONLY"]').count() === 4, `${prefix}: expected four info-only routes`);
            const mappedArticle = page.locator('.ia-connect-routes article[data-route-id="openrouter-free-router"]');
            assert(await mappedArticle.count() === 1, `${prefix}: mapped OpenRouter route not identified`);
            assert((await mappedArticle.locator('.ia-state').textContent()).includes('ROUTER MAPPED'), `${prefix}: OpenRouter not labeled mapped`);
            assert(await page.locator('.ia-connect-boundary input[type="password"], .ia-connect-boundary input[name*="key" i]').count() === 0, `${prefix}: credential input found in B60`);
            await shot(page, `${prefix}-03-connect.png`);

            await mappedArticle.locator('[data-handoff-id="openrouter-free-router"]').click();
            await page.waitForSelector('.ux2-handoff.is-open');
            const handoffText = await page.locator('.ux2-handoff-panel').innerText();
            assert(handoffText.includes('openrouter/free'), `${prefix}: handoff model id missing`);
            assert(handoffText.includes('openrouter:openrouter/free'), `${prefix}: handoff route id missing`);
            assert(handoffText.includes('NOT BOUND'), `${prefix}: unbound live target not explicit`);
            assert(await page.locator('.ux2-handoff-panel a[href^="http"]').count() === 0, `${prefix}: guessed live execution link found`);
            const handoffRect = await page.locator('.ux2-handoff-panel').boundingBox();
            assert(handoffRect && handoffRect.x >= -1 && handoffRect.x + handoffRect.width <= actualViewport.innerWidth + 1, `${prefix}: handoff panel horizontal overflow ${JSON.stringify(handoffRect)}`);
            await shot(page, `${prefix}-04-handoff.png`);
            await page.locator('[data-close-handoff]').click();

            await page.locator('.ia-primary [data-ia-view="providers"]').click();
            await page.waitForSelector('.ia-provider-card');
            const openrouterProvider = page.locator('.ia-provider-card').filter({hasText:'OpenRouter'});
            assert(await openrouterProvider.count() === 1, `${prefix}: OpenRouter provider card missing`);
            await openrouterProvider.click();
            await page.waitForSelector('.ia-route-detail[data-route-id="openrouter-free-router"]');
            assert(await page.locator('.ia-route-detail[data-route-id="openrouter-free-router"] [data-compare-id]').count() === 1, `${prefix}: provider route compare missing`);
            assert(await page.locator('.ia-route-detail[data-route-id="openrouter-free-router"] [data-handoff-id]').count() === 1, `${prefix}: provider mapped handoff missing`);

            await page.locator('.ia-primary [data-ia-view="models"]').click();
            await page.waitForSelector('.ia-model-card');
            const openrouterModel = page.locator('.ia-model-card').filter({hasText:'openrouter/free'});
            assert(await openrouterModel.count() === 1, `${prefix}: OpenRouter model card missing`);
            await openrouterModel.click();
            await page.waitForSelector('.ia-route-detail[data-route-id="openrouter-free-router"]');
            assert((await page.locator('.ia-route-detail[data-route-id="openrouter-free-router"] [data-runtime-state]').textContent()).includes('ROUTER MAPPED'), `${prefix}: model detail mapping missing`);

            const overflow = await page.evaluate(() => ({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth}));
            assert(overflow.scrollWidth <= overflow.clientWidth + 1, `${prefix}: horizontal page overflow ${JSON.stringify(overflow)}`);
            assert(consoleErrors.length === 0, `${prefix}: console errors ${consoleErrors.join(' | ')}`);
            assert(requestFailures.length === 0, `${prefix}: request failures ${requestFailures.join(' | ')}`);
            evidence.push({prefix,viewport:actualViewport,mappingKeys:keys,overflow,consoleErrors,requestFailures});
            await browser.close();
          }

          (async () => {
            await exercise({width:1440,height:1000}, 'desktop');
            await exercise({width:390,height:844}, 'mobile');
            const result = {pass:failures.length===0,failures,evidence};
            fs.writeFileSync(path.join(out,'result.json'), JSON.stringify(result,null,2));
            console.log(JSON.stringify(result,null,2));
            if (failures.length) process.exit(1);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          node "${RUNNER_TEMP}/b60-ux667/run.cjs"

      - name: Upload UX2 render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b60-ux667-render-evidence
          path: ${{ runner.temp }}/b60-ux667
          if-no-files-found: error
