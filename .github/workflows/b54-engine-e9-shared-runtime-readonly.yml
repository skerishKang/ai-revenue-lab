name: B54 Engine E9 Shared Runtime Bindings Read-only Attestation

# #3314 — shared GET-only Production evidence for #1966 Gate 1 and #1971 Gate 1.
# This workflow proves binding/composition readiness only. It activates neither
# continuation/approval nor multimodal execution and performs no provider call.

on:
  pull_request:
    paths:
      - ".github/workflows/b54-engine-e9-shared-runtime-readonly.yml"
      - ".github/scripts/b54_engine_served_version_guard.py"
      - ".github/tests/test_b54_engine_e9_shared_runtime_readonly.py"
      - "apps/padiem-ai-engine/worker_identity.py"
      - "apps/padiem-ai-engine/wrangler.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/b54-engine-e9-shared-runtime-readonly.yml"
      - ".github/scripts/b54_engine_served_version_guard.py"
      - ".github/tests/test_b54_engine_e9_shared_runtime_readonly.py"
      - "apps/padiem-ai-engine/worker_identity.py"
      - "apps/padiem-ai-engine/wrangler.toml"

permissions:
  contents: read

concurrency:
  group: b54-engine-e9-shared-runtime-readonly-${{ github.ref }}
  cancel-in-progress: false

env:
  ENGINE_WORKER: padiem-ai-engine

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install source-contract dependencies
        run: python -m pip install --quiet pyyaml pytest

      - name: Run shared E9 runtime source contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            .github/tests/test_b54_engine_e9_shared_runtime_readonly.py \
            .github/tests/test_b54_engine_served_version_guard.py
          echo "E9_SHARED_RUNTIME_SOURCE_CONTRACT=PASS"
          echo "LIVE_CLOUDFLARE_GET=0"
          echo "PROVIDER_CALLS=0"
          echo "REAL_USER_DATA=0"
          echo "PRODUCTION_MUTATION=0"

      - name: Reconcile current main shared E9 source on push
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch --no-tags origin main
          relevant=(
            ".github/workflows/b54-engine-e9-shared-runtime-readonly.yml"
            ".github/scripts/b54_engine_served_version_guard.py"
            ".github/tests/test_b54_engine_e9_shared_runtime_readonly.py"
            "apps/padiem-ai-engine/worker_identity.py"
            "apps/padiem-ai-engine/wrangler.toml"
          )
          git diff --quiet "${GITHUB_SHA}" origin/main -- "${relevant[@]}"
          echo "E9_SHARED_CURRENT_MAIN_RELEVANT_SOURCE_RECONCILED=PASS"
          echo "E9_SHARED_RELEVANT_SOURCE_DRIFT=0"

  served-shared-readonly:
    needs: source-contract
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact merged event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconcile current main shared E9 source before live GETs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch --no-tags origin main
          relevant=(
            ".github/workflows/b54-engine-e9-shared-runtime-readonly.yml"
            ".github/scripts/b54_engine_served_version_guard.py"
            ".github/tests/test_b54_engine_e9_shared_runtime_readonly.py"
            "apps/padiem-ai-engine/worker_identity.py"
            "apps/padiem-ai-engine/wrangler.toml"
          )
          git diff --quiet "${GITHUB_SHA}" origin/main -- "${relevant[@]}"
          echo "E9_SHARED_CURRENT_MAIN_RELEVANT_SOURCE_RECONCILED=PASS"
          echo "E9_SHARED_RELEVANT_SOURCE_DRIFT=0"

      - name: Resolve served Engine version and prove shared runtime bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          auth=( -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" )
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${ENGINE_WORKER}"

          deployments="${RUNNER_TEMP}/engine-deployments.json"
          curl -fsS "${auth[@]}" "${base}/deployments" -o "${deployments}"
          resolve_out="$(python3 .github/scripts/b54_engine_served_version_guard.py resolve-active --deployments "${deployments}")"
          active_version="$(printf '%s\n' "${resolve_out}" | sed -n 's/^ENGINE_ACTIVE_VERSION_ID=//p')"
          test -n "${active_version}"

          version_detail="${RUNNER_TEMP}/engine-version-detail.json"
          curl -fsS "${auth[@]}" "${base}/versions/${active_version}" -o "${version_detail}"
          verify_out="$(python3 .github/scripts/b54_engine_served_version_guard.py verify \
            --version-settings "${version_detail}" \
            --active-version="${active_version}" \
            --require-approval-runtime-bindings \
            --require-a6-activation-runtime-bindings)"
          printf '%s\n' "${verify_out}" | grep -Fx 'ENGINE_CONTINUATION_SERVED_BINDING=PRESENT:d1'
          printf '%s\n' "${verify_out}" | grep -Fx 'ENGINE_IMAGE_STORE_SERVED_BINDING=PRESENT:d1'
          printf '%s\n' "${verify_out}" | grep -Fx 'B14_SERVICE_SERVED_BINDING=PRESENT:service'
          printf '%s\n' "${verify_out}" | grep -Fx 'CONTROL_PLANE_IDENTITY_SERVED_BINDING=PRESENT:service'
          printf '%s\n' "${verify_out}" | grep -Fx 'APPROVAL_RUNTIME_BINDINGS_VALIDATED=YES'
          printf '%s\n' "${verify_out}" | grep -Fx 'A6_ACTIVATION_RUNTIME_BINDINGS_VALIDATED=YES'

          echo "ENGINE_SERVED_VERSION=${active_version}"
          echo "ENGINE_ROLLBACK_ANCHOR=${active_version}"
          echo "ROLLBACK_ANCHOR_SOURCE=FRESH_SERVED_VERSION"
          echo "RAW_VERSION_DETAIL_OUTPUT=0"
          echo "SECRET_VALUE_OUTPUT=0"
          echo "ACCOUNT_ID_OUTPUT=0"
          echo "DATABASE_ID_OUTPUT=0"
          echo "TENANT_USER_IDENTIFIER_OUTPUT=0"
          echo "CONTINUATION_WRITE=0"
          echo "ATTACHMENT_WRITE=0"
          echo "PROVIDER_CALLS=0"
          echo "REAL_USER_DATA=0"
          echo "ENGINE_DEPLOY=0"
          echo "BINDING_MUTATION=0"
          echo "MANIFEST_FLIP=0"
          echo "PRODUCTION_MUTATION=0"
