name: B52 Source Verification

on:
  pull_request:
    paths:
      - 'reference/business-52-scheduled-agent-operations-v1/**'
      - '.github/workflows/b52-source-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b52-source-verification-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify-b52-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect B52 source
        id: source
        shell: bash
        run: |
          if [ -d reference/business-52-scheduled-agent-operations-v1 ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'B52 source is absent; this is a workflow-only validation run.'
          fi

      - name: Static source contracts
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          python reference/business-52-scheduled-agent-operations-v1/tests/validate_reference.py

      - name: Install pinned Playwright
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: python -m pip install --disable-pip-version-check 'playwright==1.55.0'

      - name: Cache pinned Playwright Chromium
        if: steps.source.outputs.present == 'true'
        id: playwright-browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Reuses the repo-wide full-Chromium entry for Python Playwright 1.55.0.
          key: b62-playwright-1.55.0-${{ runner.os }}-${{ runner.arch }}

      - name: Select Ubuntu archive for Playwright OS dependencies
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: bash .github/scripts/b62_playwright_apt_mirror_3989.sh

      - name: Install Chromium system libraries
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: python -m playwright install-deps chromium

      - name: Install Chromium browser
        if: steps.source.outputs.present == 'true' && steps.playwright-browser-cache.outputs.cache-hit != 'true'
        shell: bash
        run: python -m playwright install chromium

      - name: Link the Chromium build for the browser harness
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          BROWSER_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          p = sync_playwright().start()
          print(p.chromium.executable_path)
          p.stop()
          PY
          )"
          sudo ln -sf "$BROWSER_PATH" /usr/bin/chromium
          /usr/bin/chromium --version

      - name: Browser exact-head self-check
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          python reference/business-52-scheduled-agent-operations-v1/tests/browser_self_check.py

      - name: Evidence summary
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('reference/business-52-scheduled-agent-operations-v1/evidence')
          static = json.loads((root / 'static-self-check.json').read_text(encoding='utf-8'))
          browser = json.loads((root / 'browser-self-check.json').read_text(encoding='utf-8'))
          assert static['status'] == 'PASS', static
          assert browser['status'] == 'PASS', browser
          assert browser['matrix_pass'] == browser['matrix_total'] == 21, browser
          assert browser['keyboard_all'] is True, browser
          assert browser['replay_equal'] is True, browser
          assert browser['reduced_motion_immediate'] is True, browser
          assert browser['tab_vis_all_pass'] is True, browser
          assert browser['scrollY_invariant'] is True, browser
          print('B52_EXACT_HEAD_SOURCE_VERIFICATION_PASS')
          print('static=', static['status'])
          print('browser=', browser['status'])
          print('matrix=', f"{browser['matrix_pass']}/{browser['matrix_total']}")
          PY
