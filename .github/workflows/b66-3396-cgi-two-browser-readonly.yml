name: B66 3396 CGI Two-Browser Readonly Acceptance

on:
  pull_request:
    paths:
      - ".github/scripts/b66_3396_cgi_two_browser_readonly.py"
      - ".github/tests/test_b66_3396_cgi_two_browser_readonly.py"
      - ".github/workflows/b66-3396-cgi-two-browser-readonly.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "readonly (no D1 write), or synthetic (one CGI alpha temp guided slot, exact-marker cleanup)"
        required: true
        type: choice
        default: readonly
        options:
          - readonly
          - synthetic
          - foreign_window
      target_sha:
        description: "Exact current main SHA"
        required: true
        type: string
      confirmation:
        description: "readonly=RUN_B66_3396_CGI_TWO_BROWSER_READONLY; synthetic=RUN_B66_3396_CGI_SYNTHETIC_RESUME_ONCE; foreign_window=RUN_B66_3396_CGI_FOREIGN_WINDOW_ONCE"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: b66-3396-cgi-two-browser-readonly
  cancel-in-progress: false

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.target_sha }}
          persist-credentials: false
      - name: Exact main guard on dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'B66_3396_READONLY_EXACT_MAIN=PASS'
      - name: Fail-closed request and evidence contract
        run: |
          set -euo pipefail
          python .github/scripts/b66_3396_cgi_two_browser_readonly.py --self-test
          python .github/tests/test_b66_3396_cgi_two_browser_readonly.py
          echo 'PRODUCTION_MUTATION=0'
          echo 'CGI_ALPHA_CREDENTIAL_READ=0'
          echo 'PROVIDER_CALLS=0'

  live-cgi-readonly:
    needs: source-contract
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          ((inputs.mode == 'readonly' && inputs.confirmation == 'RUN_B66_3396_CGI_TWO_BROWSER_READONLY') ||
          (inputs.mode == 'synthetic' && inputs.confirmation == 'RUN_B66_3396_CGI_SYNTHETIC_RESUME_ONCE') ||
          (inputs.mode == 'foreign_window' && inputs.confirmation == 'RUN_B66_3396_CGI_FOREIGN_WINDOW_ONCE')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      QA_MANUAL_USERNAME: ${{ secrets.QA_MANUAL_USERNAME }}
      QA_MANUAL_PASSWORD: ${{ secrets.QA_MANUAL_PASSWORD }}
      B66_3396_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Recheck exact main and credential presence
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          test -n "${QA_MANUAL_USERNAME}"
          test -n "${QA_MANUAL_PASSWORD}"
          echo 'B66_3396_LIVE_CGI_PRECALL=PASS'
          echo 'CREDENTIAL_VALUES_LOGGED=0'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Playwright
        run: |
          python -m pip install --disable-pip-version-check --quiet "playwright==1.55.0"

      - name: Cache pinned Playwright Chromium
        id: playwright-browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Reuses the repo-wide full-Chromium entry for Python Playwright 1.55.0;
          # the binary is identical, so this lane does not need its own copy.
          key: b62-playwright-1.55.0-${{ runner.os }}-${{ runner.arch }}

      - name: Select Ubuntu archive for Playwright OS dependencies
        run: bash .github/scripts/b62_playwright_apt_mirror_3989.sh

      - name: Install Chromium system libraries
        run: python -m playwright install-deps chromium

      - name: Install Chromium browser
        if: steps.playwright-browser-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium
      - name: 'Exactly scoped CGI alpha mode: two isolated logins and guaranteed cleanup'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${B66_3396_MODE}" = "foreign_window" ]; then
            python .github/scripts/b66_3396_cgi_two_browser_readonly.py --authorized-live-foreign-window
            echo 'CGI_FOREIGN_WINDOW_EXACT_MARKER_CLEANUP_REQUIRED=PASS'
          elif [ "${B66_3396_MODE}" = "synthetic" ]; then
            python .github/scripts/b66_3396_cgi_two_browser_readonly.py --authorized-live-synthetic
            echo 'SYNTHETIC_TEMP_ROW_CLEANUP_REQUIRED=PASS'
          else
            test "${B66_3396_MODE}" = "readonly"
            python .github/scripts/b66_3396_cgi_two_browser_readonly.py --authorized-live-readonly
            echo 'CUSTOMER_QUOTE_MUTATION=0'
          fi
          echo 'MODEL_POSTS=0'
          echo 'PDF_POSTS=0'
          echo 'CUSTOMER_HISTORY_WRITES=0'
          echo 'CGI_CREDENTIAL_OUTPUT=0'
