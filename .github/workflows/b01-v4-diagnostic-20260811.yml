name: B01 V4 Assertion Diagnostic 2026-08-11
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/personal-edition/**'
      - '.github/workflows/b01-v4-diagnostic-20260811.yml'
permissions: { contents: read }
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        run: |
          python -m pip install playwright pillow jinja2
          python -m playwright install --with-deps chromium
      - name: Build and serve
        run: |
          cd apps/personal-edition
          python -m pip install -e .
          python -m scripts.build_static_production
          cd dist-preview
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Diagnose every V4 surface
        run: |
          mkdir -p diagnostic/screenshots
          cat > /tmp/diag.py <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          base='http://127.0.0.1:4173'
          routes=[('root','/'),('guide','/guide/'),('library','/preview/participant/published/'),('review','/preview/participant/editing/'),('write','/preview/participant/input/'),('read','/preview/participant/editions/modal-preview-edition/'),('feedback','/preview/participant/editions/modal-preview-edition/feedback/'),('adaptation','/preview/participant/editions/modal-preview-edition/adaptation/'),('history','/preview/participant/history/'),('operator-review','/admin/review/modal-preview-edition/content/')]
          failures=[]; rows=[]
          with sync_playwright() as pw:
            b=pw.chromium.launch(headless=True)
            for vp,w,h in [('desktop',1440,1100),('mobile',390,844)]:
              c=b.new_context(viewport={'width':w,'height':h}, reduced_motion='reduce')
              for name,path in routes:
                p=c.new_page(); errors=[]; failed=[]; external=[]
                p.on('console',lambda m: errors.append('console:'+m.text) if m.type=='error' else None)
                p.on('pageerror',lambda e: errors.append('page:'+str(e)))
                p.on('request',lambda r: external.append(r.url) if not r.url.startswith(base) and not r.url.startswith(('data:','blob:')) else None)
                p.on('response',lambda r: failed.append(f'{r.status} {r.url}') if r.url.startswith(base) and r.status>=400 and not r.url.endswith('/favicon.ico') else None)
                checks=[]; status=None
                try:
                  r=p.goto(base+path,wait_until='networkidle',timeout=20000); status=r.status if r else None; p.wait_for_timeout(300)
                  m=p.evaluate("""() => { const h=document.querySelector('h1'),s=h?getComputedStyle(h):null,fs=s?parseFloat(s.fontSize):null,lh=s&&s.lineHeight!=='normal'?parseFloat(s.lineHeight):null,stage=document.querySelector('.v3-assembly-stage'),cover=document.querySelector('.v3-library-cover,.v3-read-cover'); return {art:document.body.dataset.artDirection||null,sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,h1:h?.innerText?.trim()||null,fs,lh,ratio:(fs&&lh)?lh/fs:null,stage:stage?getComputedStyle(stage).backgroundImage:null,cover:cover?getComputedStyle(cover).backgroundImage:null,rootProof:!!document.querySelector('.v4-entry-proof'),recut:!!document.querySelector('.v4-feedback-preview'),text:document.body.innerText.replace(/\s+/g,' ').slice(0,700)} }""")
                  checks += [('status200',status==200),('art',m['art']=='b1-private-archive-v4'),('overflow',m['sw']<=m['cw'])]
                  if m['h1'] and any('\uac00'<=x<='\ud7a3' for x in m['h1']) and m['ratio'] is not None: checks.append(('korean-line-height',m['ratio']>=1.0))
                  if name=='root': checks += [('root-proof',m['rootProof']),('root-art','archive-entry-tableau.svg' in (m['stage'] or '')),('cta',p.get_by_text('첫 기록 맡기기',exact=True).count()>0),('guide-link',p.get_by_text('30초 사용법',exact=True).count()>0)]
                  if name in ('library','read'): checks.append(('cover-art','edition-cover-material.svg' in (m['cover'] or '')))
                  if name=='review': checks.append(('proof-art','proof-review-tableau.svg' in p.locator('.v3-status-composition').evaluate('el=>getComputedStyle(el).backgroundImage')))
                  if name=='feedback': checks.append(('recut-preview',m['recut']))
                  checks += [('console',not errors),('failed-local',not failed),('external',not external)]
                  p.screenshot(path=f'diagnostic/screenshots/{name}-{vp}.png',full_page=False)
                  for key,ok in checks:
                    if not ok: failures.append({'screen':name,'viewport':vp,'check':key,'metrics':m,'errors':errors,'failed':failed,'external':external})
                  rows.append({'screen':name,'viewport':vp,'status':status,'metrics':m,'checks':checks,'errors':errors,'failed':failed,'external':external})
                except Exception as e:
                  failures.append({'screen':name,'viewport':vp,'check':'exception','error':repr(e),'status':status}); rows.append({'screen':name,'viewport':vp,'status':status,'exception':repr(e)})
                  try: p.screenshot(path=f'diagnostic/screenshots/{name}-{vp}-exception.png',full_page=False)
                  except: pass
                p.close()
              c.close()
            b.close()
          Path('diagnostic/results.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('diagnostic/failures.json').write_text(json.dumps(failures,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(failures,ensure_ascii=False,indent=2))
          raise SystemExit(1 if failures else 0)
          PY
          set +e
          python /tmp/diag.py 2>&1 | tee diagnostic/diagnostic.log
          code=${PIPESTATUS[0]}
          exit $code
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-v4-diagnostic-${{ github.sha }}
          path: diagnostic
          if-no-files-found: error
          retention-days: 7
