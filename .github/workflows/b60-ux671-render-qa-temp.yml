name: B60 UX671 Render QA Temp

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.number == 672
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pw"
          npm install --prefix "${RUNNER_TEMP}/pw" playwright@1.55.0 >/dev/null
          "${RUNNER_TEMP}/pw/node_modules/.bin/playwright" install --with-deps chromium >/dev/null
      - name: Start B60 runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory apps/portfolio-console >"${RUNNER_TEMP}/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ai-api/ >/dev/null && exit 0; sleep 1; done
          cat "${RUNNER_TEMP}/server.log"; exit 1
      - name: Exercise entity-aware Watch
        shell: bash
        env:
          PW: ${{ runner.temp }}/pw/node_modules/playwright
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ux4"
          cat > "${RUNNER_TEMP}/ux4/run.cjs" <<'NODE'
          const { chromium } = require(process.env.PW);
          const fs=require('fs'), path=require('path');
          const out=process.env.RUNNER_TEMP+'/ux4';
          const failures=[], evidence=[];
          const assert=(c,m)=>{if(!c)failures.push(m)};
          const shot=(p,n)=>p.screenshot({path:path.join(out,n),fullPage:false});

          async function normal(viewport,prefix){
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport});
            const page=await context.newPage();
            const errors=[], failed=[];
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
            await page.goto('http://127.0.0.1:4173/ai-api/',{waitUntil:'networkidle'});
            await page.evaluate(()=>localStorage.setItem('b60.ai-api.watchlist.v1',JSON.stringify(['vercel-glm52','openrouter-free-router'])));
            await page.reload({waitUntil:'networkidle'});
            await page.locator('#explore').scrollIntoViewIfNeeded();
            await page.locator('.ia-primary [data-ia-view="watch"]').click();
            await page.waitForSelector('.ux4-saved-list');
            await page.waitForTimeout(180);
            assert(await page.locator('.ux4-saved-route').count()===2,`${prefix}: expected 2 saved routes`);
            assert(await page.locator('.watch-card-v7').count()===0,`${prefix}: legacy Watch cards visible`);
            assert(await page.locator('.ux4-runtime.is-mapped').count()===1,`${prefix}: mapped saved-route count not 1`);
            const stats=await page.locator('#explore-stats').innerText();
            assert(stats.includes('2\nsaved routes')||stats.includes('2 saved routes'),`${prefix}: saved stats wrong ${stats}`);
            assert(stats.includes('1\nrouter mapped')||stats.includes('1 router mapped'),`${prefix}: mapped stats wrong ${stats}`);
            const vercel=page.locator('.ux4-saved-route[data-watch-route-id="vercel-glm52"]');
            assert((await vercel.innerText()).includes('Vercel AI Gateway'),`${prefix}: Vercel provider context missing`);
            assert((await vercel.innerText()).includes('zai/glm-5.2'),`${prefix}: Vercel model context missing`);
            assert((await vercel.innerText()).includes('PENDING'),`${prefix}: latest Vercel pending activity not shown`);
            await shot(page,`${prefix}-01-saved.png`);

            await vercel.locator('[data-compare-id="vercel-glm52"]').click();
            await page.waitForTimeout(100);
            assert((await page.locator('[data-compare-count]').textContent()).trim()==='1 / 3',`${prefix}: Watch compare did not reach shared tray`);
            assert((await vercel.locator('[data-compare-id]').textContent()).trim()==='SELECTED',`${prefix}: Watch compare state not reflected`);

            const openrouter=page.locator('.ux4-saved-route[data-watch-route-id="openrouter-free-router"]');
            await openrouter.locator('[data-watch-open-route]').click();
            await page.waitForSelector('.ux3-route-detail.is-open');
            await page.waitForTimeout(280);
            assert((await page.locator('.ux3-route-panel').innerText()).includes('openrouter/free'),`${prefix}: Watch did not reopen UX3 route detail`);
            assert(new URL(page.url()).searchParams.get('route')==='openrouter-free-router',`${prefix}: Watch route deep-link missing`);
            await shot(page,`${prefix}-02-route-detail.png`);
            await page.locator('[data-close-route]').click();
            await page.waitForTimeout(250);

            await page.locator('[data-ux4-watch="changes"]').click();
            await page.waitForSelector('.ux4-changes');
            const changeText=await page.locator('.ux4-changes').innerText();
            assert(changeText.includes('아직 검증된 before → after 변경은 없습니다.'),`${prefix}: no-change truth statement missing`);
            assert(await page.locator('.ux4-kind.is-changed').count()===0,`${prefix}: baseline/pending mislabeled CHANGED`);
            assert(await page.locator('.ux4-kind.is-pending').count()>=1,`${prefix}: pending event classification missing`);
            assert(await page.locator('.ux4-kind.is-baseline').count()>=1,`${prefix}: baseline event classification missing`);
            assert((await page.locator('.ux4-change-section').first().innerText()).includes('PENDING_CLAIM_RECORDED'),`${prefix}: saved-route activity missing Vercel pending event`);
            await shot(page,`${prefix}-03-changes.png`);

            await page.locator('[data-ux4-watch="saved"]').click();
            await page.waitForSelector('.ux4-saved-list');
            await page.locator('.ux4-saved-route[data-watch-route-id="vercel-glm52"] [data-watch-remove]').click();
            await page.waitForTimeout(120);
            assert(await page.locator('.ux4-saved-route').count()===1,`${prefix}: remove did not update Watch`);
            const stored=await page.evaluate(()=>JSON.parse(localStorage.getItem('b60.ai-api.watchlist.v1')||'[]'));
            assert(!stored.includes('vercel-glm52')&&stored.includes('openrouter-free-router'),`${prefix}: remove did not preserve storage contract ${JSON.stringify(stored)}`);

            const metrics=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth}));
            assert(metrics.scrollWidth<=metrics.clientWidth+1,`${prefix}: horizontal overflow ${JSON.stringify(metrics)}`);
            assert(errors.length===0,`${prefix}: console errors ${errors.join(' | ')}`);
            assert(failed.length===0,`${prefix}: failed requests ${failed.join(' | ')}`);
            evidence.push({prefix,mode:'normal',metrics,errors,failed});
            await browser.close();
          }

          async function blockedStorage(viewport,prefix){
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport});
            await context.addInitScript(()=>{
              const deny=()=>{throw new DOMException('Blocked for QA','SecurityError')};
              Storage.prototype.getItem=deny; Storage.prototype.setItem=deny; Storage.prototype.removeItem=deny;
            });
            const page=await context.newPage();
            const errors=[]; page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('http://127.0.0.1:4173/ai-api/',{waitUntil:'networkidle'});
            await page.locator('#explore').scrollIntoViewIfNeeded();
            const vercelCard=page.locator('.access-card[data-id="vercel-glm52"]');
            await vercelCard.locator('[data-save-id="vercel-glm52"]').click();
            await page.waitForTimeout(80);
            await page.locator('.ia-primary [data-ia-view="watch"]').click();
            await page.waitForSelector('.ux4-saved-list');
            assert(await page.locator('.ux4-saved-route[data-watch-route-id="vercel-glm52"]').count()===1,`${prefix}: session-only saved route lost`);
            assert((await page.locator('#explore-stats').innerText()).includes('SESSION'),`${prefix}: storage fallback not disclosed`);
            await page.locator('[data-watch-open-route="vercel-glm52"]').click();
            await page.waitForSelector('.ux3-route-detail.is-open');
            await page.waitForTimeout(200);
            const save=page.locator('.ux3-route-panel [data-save-id="vercel-glm52"]');
            assert((await save.getAttribute('aria-pressed'))==='true'&&(await save.textContent()).trim()==='SAVED',`${prefix}: session-only Watch state not reflected in route detail`);
            await shot(page,`${prefix}-04-session-fallback.png`);
            assert(errors.length===0,`${prefix}: blocked-storage console errors ${errors.join(' | ')}`);
            await browser.close();
          }

          (async()=>{
            await normal({width:1440,height:1000},'desktop');
            await normal({width:390,height:844},'mobile');
            await blockedStorage({width:390,height:844},'mobile');
            const result={pass:failures.length===0,failures,evidence};
            fs.writeFileSync(path.join(out,'result.json'),JSON.stringify(result,null,2));
            console.log(JSON.stringify(result,null,2));
            if(failures.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node "${RUNNER_TEMP}/ux4/run.cjs"
      - name: Upload UX4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b60-ux671-render-evidence
          path: ${{ runner.temp }}/ux4
          if-no-files-found: error
