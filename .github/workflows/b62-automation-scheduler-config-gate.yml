name: B62 Automation Scheduler Config Contract Gate

on:
  pull_request:
    paths:
      - ".github/workflows/b62-automation-scheduler-config-gate.yml"
      - ".github/scripts/b62_automation_scheduler_config.py"
      - ".github/tests/test_b62_automation_scheduler_config.py"
  workflow_dispatch:
    inputs:
      mode:
        description: "Scheduler config contract mode"
        required: true
        type: choice
        default: repository_preflight
        options:
          - repository_preflight
          - plan_activation
          - plan_rollback
      target_sha:
        description: "Exact current main SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: b62-automation-scheduler-config-gate
  cancel-in-progress: false

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.b62_target_sha.outputs.target_sha }}
    steps:
      # The body below is copied verbatim from the marked region of
      # .github/scripts/b62_verify_target_sha.py, which stays the rule's only authority:
      # a step that runs before any checkout has no repository to read a script from.
      - name: Verify target_sha shape before any checkout
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: b62_target_sha
        env:
          B62_TARGET_SHA_RAW: ${{ inputs.target_sha }}
        shell: bash
        run: |
          python3 - <<'B62_TARGET_SHA_GUARD'
          import os
          import re
          import sys

          _SHA = re.compile(r"^[0-9a-f]{40}$")


          def canonical_target_sha(raw):
              # Case is the only forgiveness: a short or non-hex value is not a commit.
              value = (raw or "").strip()
              if len(value) != 40:
                  return None
              candidate = value.lower()
              return candidate if _SHA.match(candidate) else None


          def failure_message(raw):
              return f"target_sha는 40자리 전체 SHA여야 합니다(입력: {len((raw or '').strip())}자리). git rev-parse origin/main 값을 넣으세요"


          def main():
              raw = os.environ.get("B62_TARGET_SHA_RAW", "")
              canonical = canonical_target_sha(raw)
              if canonical is None:
                  sys.stdout.write("::error::" + failure_message(raw) + "\n")
                  return 1
              for key, name in (("GITHUB_OUTPUT", "target_sha"), ("GITHUB_ENV", "TARGET_SHA")):
                  path = os.environ.get(key)
                  if path:
                      with open(path, "a", encoding="utf-8") as handle:
                          handle.write(f"{name}={canonical}\n")
              sys.stdout.write("B62_TARGET_SHA_INPUT_SHAPE=PASS\n")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          B62_TARGET_SHA_GUARD

      - name: Checkout PR exact head
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact dispatch SHA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.b62_target_sha.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scheduler config contract tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest
          python -m pytest .github/tests/test_b62_automation_scheduler_config.py -q
      - name: Prove no deployment or mutation path
        run: |
          echo 'B62_AUTOMATION_SCHEDULER_CONFIG_SOURCE_CONTRACT=PASS'
          echo 'PRODUCTION_CRON_ACTIVATION=0'
          echo 'PRODUCTION_DEPLOY=0'
          echo 'SECRET_MUTATION=0'
          echo 'CONFIG_MUTATION=0'

  plan-only:
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'repository_preflight' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ needs.source-contract.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Require exact current main
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
      - name: Build inert scheduler plan only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/scripts/b62_automation_scheduler_config.py').read_text(encoding='utf-8')
          required = ('SCHEDULER_VAR', 'EXPECTED_CRON', 'CRON_DECLARATION_ADD', 'CRON_DECLARATION_REMOVE')
          if any(token not in text for token in required):
              raise SystemExit('scheduler config contract incomplete')
          print('B62_AUTOMATION_SCHEDULER_PLAN_ONLY=PASS')
          print('CONFIG_MUTATION=0')
          print('PRODUCTION_CRON_ACTIVATION=0')
          PY