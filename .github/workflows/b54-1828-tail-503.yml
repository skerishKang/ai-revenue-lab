name: B54 1828 Read-only 503 Tail Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: b54-1828-tail-503
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: 3d0052a2d03aa0530e837aaef40bfd9eb3e3dd35
  STATE_WORKER: padiem-local-agent-broker-state
  EDGE_WORKER: padiem-local-agent-broker-edge
  STATE_VERSION: a2b9d708-8cc2-4994-bc52-bb6e72eef944
  EDGE_VERSION: b870d30b-1d47-401d-97c9-7a52425f8299
  PUBLIC_HOSTNAME: local-agent.padiem.net

jobs:
  tail-503:
    if: >-
      github.event.pull_request.head.ref == 'ops/b54-1828-tail-503' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Require exact current main and read-only Cloudflare authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          current="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" | jq -r '.commit.sha')"
          test "${current}" = "${EXPECTED_MAIN_SHA}"
          echo "EXACT_MAIN_SHA=PASS"
          echo "PRODUCTION_MUTATION=0"

      - name: Tail current state and edge invocations around one bounded unauthenticated request
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          state_log="${RUNNER_TEMP}/state-tail.log"
          edge_log="${RUNNER_TEMP}/edge-tail.log"
          response_body="${RUNNER_TEMP}/response.json"

          timeout 50s npx --yes wrangler@4.129.0 tail "${STATE_WORKER}" --version-id "${STATE_VERSION}" --format json --sampling-rate 1 >"${state_log}" 2>&1 &
          state_pid=$!
          timeout 50s npx --yes wrangler@4.129.0 tail "${EDGE_WORKER}" --version-id "${EDGE_VERSION}" --format json --sampling-rate 1 >"${edge_log}" 2>&1 &
          edge_pid=$!
          trap 'kill ${state_pid} ${edge_pid} 2>/dev/null || true' EXIT

          sleep 10
          code="$(curl -sS --connect-timeout 5 --max-time 15 -o "${response_body}" -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' "https://${PUBLIC_HOSTNAME}/session" || true)"
          echo "PUBLIC_SESSION_HTTP_CODE=${code}"
          if jq -e '.error.code | type == "string"' "${response_body}" >/dev/null 2>&1; then
            jq -r '"PUBLIC_SESSION_ERROR_CODE=" + .error.code' "${response_body}"
          else
            echo "PUBLIC_SESSION_ERROR_CODE=UNAVAILABLE"
          fi

          sleep 12
          kill ${state_pid} ${edge_pid} 2>/dev/null || true
          wait ${state_pid} 2>/dev/null || true
          wait ${edge_pid} 2>/dev/null || true

          sanitize() {
            local label="$1" file="$2"
            echo "${label}_TAIL_BEGIN"
            grep -E '^\{' "${file}" 2>/dev/null | jq -c '{scriptName:(.scriptName // null),outcome:(.outcome // null),exceptions:[.exceptions[]? | {name:(.name // null),message:(.message // null)}]}' 2>/dev/null || true
            echo "${label}_TAIL_END"
          }
          sanitize STATE "${state_log}"
          sanitize EDGE "${edge_log}"
          echo "TAIL_DIAGNOSTIC_MUTATION=0"
