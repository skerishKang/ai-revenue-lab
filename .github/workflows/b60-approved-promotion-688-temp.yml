name: B60 Approved Promotion 688 Temp

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  approved-promotion:
    if: github.event.pull_request.number == 691
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_SHA: 5e4625c89dc954a87ed245bba89a1ba822e596ec
    steps:
      - name: Checkout carrier
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact canonical main
        uses: actions/checkout@v4
        with:
          ref: 5e4625c89dc954a87ed245bba89a1ba822e596ec
          path: product
          persist-credentials: false

      - name: Fresh official-source intake
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/b60-approved"
          cd product
          test "$(git rev-parse HEAD)" = "${PRODUCT_SHA}"
          SNAPSHOT=apps/portfolio-console/ai-api/data/snapshots.js
          sha256sum "${SNAPSHOT}" | awk '{print $1}' > "${RUNNER_TEMP}/b60-approved/snapshot-before.sha256"
          node reference/business-60-ai-api-v1/collector/run-intake.cjs \
            --out "${RUNNER_TEMP}/b60-approved/candidates.json"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node reference/business-60-ai-api-v1/collector/run-review.cjs packet \
            --candidates "${RUNNER_TEMP}/b60-approved/candidates.json" \
            --snapshot "${SNAPSHOT}" \
            --out "${RUNNER_TEMP}/b60-approved/review-packet.json" \
            --markdown "${RUNNER_TEMP}/b60-approved/review-packet.md" \
            --generated-at "${NOW}"

      - name: Record owner standing approval for every reviewable candidate
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const root=process.env.RUNNER_TEMP+'/b60-approved';
          const packet=JSON.parse(fs.readFileSync(root+'/review-packet.json','utf8'));
          if(packet.summary.reviewRequired!==7) throw new Error(`expected 7 reviewable candidates, got ${packet.summary.reviewRequired}`);
          if(packet.summary.approvable!==7) throw new Error(`expected 7 approvable candidates, got ${packet.summary.approvable}`);
          const notApprovable=packet.candidates.filter(x=>!x.canApprove);
          if(notApprovable.length) throw new Error('approval blocked: '+notApprovable.map(x=>x.candidateId).join(','));
          const reviewedAt=new Date().toISOString();
          const decisions={
            packetId:packet.packetId,
            reviewer:'owner-cto-standing-approval-2026-08-24',
            reviewedAt,
            authorityNote:'Owner explicitly authorized CTO to proceed and approved all candidates on 2026-08-24.',
            decisions:packet.candidates.map(x=>({candidateId:x.candidateId,decision:'approve',reason:'Owner standing approval; CTO reviewed official-source packet.'}))
          };
          fs.writeFileSync(root+'/decisions.json',JSON.stringify(decisions,null,2)+'\n');
          console.log(`PACKET_ID=${packet.packetId}`);
          console.log(`APPROVED_DECISIONS=${decisions.decisions.length}`);
          NODE

      - name: Generate proposal and field-level change ledger
        shell: bash
        run: |
          set -euo pipefail
          cd product
          SNAPSHOT=apps/portfolio-console/ai-api/data/snapshots.js
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node reference/business-60-ai-api-v1/collector/run-review.cjs promote \
            --candidates "${RUNNER_TEMP}/b60-approved/candidates.json" \
            --snapshot "${SNAPSHOT}" \
            --decisions "${RUNNER_TEMP}/b60-approved/decisions.json" \
            --out-dir "${RUNNER_TEMP}/b60-approved/promotion" \
            --date 2026-08-24 \
            --captured-at "${NOW}" \
            --generated-at "${NOW}"

          node - <<'NODE'
          const fs=require('node:fs');
          const root=process.env.RUNNER_TEMP+'/b60-approved';
          const proposal=JSON.parse(fs.readFileSync(root+'/promotion/snapshot-proposal.json','utf8'));
          const ledger=JSON.parse(fs.readFileSync(root+'/promotion/change-ledger.json','utf8'));
          if(proposal.publishAuthorized!==false) throw new Error('proposal must remain non-publishing');
          if(ledger.publishAuthorized!==false) throw new Error('ledger must remain non-publishing');
          const summary={
            packetId:proposal.packetId,
            proposalPublicationAuthority:proposal.publicationAuthority,
            ledgerPublicationAuthority:ledger.publicationAuthority,
            verifiedChanges:ledger.summary.verifiedChanges,
            reverifiedUnchanged:ledger.summary.reverifiedUnchanged,
            changes:ledger.changes,
            reverified:ledger.reverifiedUnchanged
          };
          fs.writeFileSync(root+'/promotion-summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary,null,2));
          NODE

      - name: Prove promotion did not publish
        shell: bash
        run: |
          set -euo pipefail
          cd product
          SNAPSHOT=apps/portfolio-console/ai-api/data/snapshots.js
          sha256sum "${SNAPSHOT}" | awk '{print $1}' > "${RUNNER_TEMP}/b60-approved/snapshot-after.sha256"
          cmp "${RUNNER_TEMP}/b60-approved/snapshot-before.sha256" "${RUNNER_TEMP}/b60-approved/snapshot-after.sha256"
          echo 'SNAPSHOTS_JS_UNCHANGED=YES'
          echo 'AUTO_PUBLICATION=NO'

      - name: Upload promotion audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: b60-approved-promotion-688
          path: |
            ${{ runner.temp }}/b60-approved/candidates.json
            ${{ runner.temp }}/b60-approved/review-packet.json
            ${{ runner.temp }}/b60-approved/review-packet.md
            ${{ runner.temp }}/b60-approved/decisions.json
            ${{ runner.temp }}/b60-approved/promotion/reviewed-candidates.json
            ${{ runner.temp }}/b60-approved/promotion/snapshot-proposal.json
            ${{ runner.temp }}/b60-approved/promotion/change-ledger.json
            ${{ runner.temp }}/b60-approved/promotion-summary.json
          if-no-files-found: error
          retention-days: 30
