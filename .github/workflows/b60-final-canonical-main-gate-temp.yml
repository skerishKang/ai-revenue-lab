name: B60 Final Canonical Main Gate Temp

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  final-main:
    if: github.event.pull_request.number == 678
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout carrier
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout final canonical main
        uses: actions/checkout@v4
        with:
          ref: 12b7f74d9ac68feeda1fbe3dcb6b258562c8e9c4
          path: canonical
          persist-credentials: false

      - name: Checkout deployed integrated product source
        uses: actions/checkout@v4
        with:
          ref: 7bac4ff4d490d71d3604e52d3bd5e65b472e0ced
          path: deployed
          persist-credentials: false

      - name: Verify exact main and deployed product parity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "12b7f74d9ac68feeda1fbe3dcb6b258562c8e9c4"
          test "$(git -C deployed rev-parse HEAD)" = "7bac4ff4d490d71d3604e52d3bd5e65b472e0ced"
          diff -qr canonical/apps/portfolio-console/ai-api deployed/apps/portfolio-console/ai-api
          echo "CANONICAL_RUNTIME_EQUALS_DEPLOYED_SOURCE=YES"

      - name: Verify runtime-reference mirrors and syntax
        shell: bash
        run: |
          set -euo pipefail
          cd canonical
          for f in \
            data/access-signals.js \
            data/execution-handoff-v10.js \
            product-v9-ia.css \
            product-v9-ia.js \
            product-v10-route-compare.css \
            product-v10-route-compare.js \
            product-v11-route-detail.css \
            product-v11-route-detail.js \
            product-v12-watch.css \
            product-v12-watch.js \
            product-v7.js; do
            cmp "apps/portfolio-console/ai-api/$f" "reference/business-60-ai-api-v1/$f"
          done
          for f in \
            data/access-signals.js \
            data/execution-handoff-v10.js \
            product-v9-ia.js \
            product-v10-route-compare.js \
            product-v11-route-detail.js \
            product-v12-watch.js \
            product-v7.js; do
            node --check "apps/portfolio-console/ai-api/$f"
          done
          echo "RUNTIME_REFERENCE_MIRRORS=PASS"
          echo "RUNTIME_JS_SYNTAX=PASS"

      - name: Verify product truth and safety contracts
        shell: bash
        run: |
          set -euo pipefail
          cd canonical
          grep -F "Varies by routed provider" apps/portfolio-console/ai-api/data/access-signals.js >/dev/null
          ! grep -F '$1.40/M input · $4.40/M output' apps/portfolio-console/ai-api/data/access-signals.js
          grep -F 'openrouter:openrouter/free' apps/portfolio-console/ai-api/data/execution-handoff-v10.js >/dev/null
          grep -F '.ux4-saved-list,.ux4-changes,.ux4-empty{grid-column:1/-1}' apps/portfolio-console/ai-api/product-v12-watch.css >/dev/null
          grep -F 'b60.ai-api.watchlist.v1' apps/portfolio-console/ai-api/product-v7.js >/dev/null
          grep -F 'window.B60_WATCH_STATE' apps/portfolio-console/ai-api/product-v12-watch.js >/dev/null
          ! grep -Ei "type=['\"]password|api[-_ ]?key.*input" apps/portfolio-console/ai-api/index.html
          echo "VERCEL_ROUTED_PRICE=PROVIDER_DEPENDENT"
          echo "OPENROUTER_EXACT_HANDOFF=PRESENT"
          echo "WATCH_STORAGE_CONTRACT=PRESENT"
          echo "API_KEY_INPUT=ABSENT"

      - name: Verify collector truth boundary
        shell: bash
        run: |
          set -euo pipefail
          cd canonical
          node --test reference/business-60-ai-api-v1/collector/intake-core.test.cjs
          grep -F "PARTIALLY_VERIFIED_OFFICIAL_WEB" reference/business-60-ai-api-v1/collector/intake-core.cjs >/dev/null
          grep -F "carriedForwardFields" reference/business-60-ai-api-v1/collector/intake-core.cjs >/dev/null
          ! grep -R "state:.*VERIFIED_OFFICIAL_WEB" reference/business-60-ai-api-v1/collector/run-intake.cjs reference/business-60-ai-api-v1/collector/source-manifest.cjs
          echo "COLLECTOR_FIELD_PROVENANCE=PASS"
          echo "AUTO_PUBLICATION=NO"

      - name: Verify current public apex
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 https://ai-api-a9x.pages.dev/ -o /tmp/live.html
          grep -F '<title>AI API — Cinematic Anchor</title>' /tmp/live.html >/dev/null
          test "$(wc -c < /tmp/live.html)" -gt 1000
          echo "PUBLIC_APEX_HTTP=PASS"

      - name: Final summary
        shell: bash
        run: |
          echo "B60_CANONICAL_MAIN_GATE=PASS"
          echo "MAIN=12b7f74d9ac68feeda1fbe3dcb6b258562c8e9c4"
          echo "DEPLOYED_PRODUCT_SOURCE=7bac4ff4d490d71d3604e52d3bd5e65b472e0ced"
          echo "PUBLIC_APEX=https://ai-api-a9x.pages.dev/"
