name: B62 Conversation Delete Focus Apply

on:
  push:
    branches:
      - "feat/b62-conversation-delete-1042"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/b62-conversation-delete-1042
          fetch-depth: 0
      - name: Apply focused accessibility repair
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/padiem-chat/static/app.js")
          text = path.read_text(encoding="utf-8")
          old = "      const deletedActiveConversation = conversationId === id;\n      if (deletedActiveConversation) resetConversation(true);\n      await loadRecentConversations();\n      if (!deletedActiveConversation) setNote(idleNote());"
          new = "      const deletedActiveConversation = conversationId === id;\n      if (deletedActiveConversation) resetConversation(true);\n      await loadRecentConversations();\n      if (deletedActiveConversation) {\n        input.focus();\n      } else {\n        setNote(idleNote());\n      }"
          if text.count(old) != 1:
              raise SystemExit(f"expected one active-delete focus target, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/b62-conversation-delete-focus-apply.yml").unlink()
      - name: Validate focused repair
        run: |
          set -euo pipefail
          node --check apps/padiem-chat/static/app.js
          git diff --check
          test ! -e .github/workflows/b62-conversation-delete-focus-apply.yml
      - name: Commit focused repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/padiem-chat/static/app.js .github/workflows/b62-conversation-delete-focus-apply.yml
          git commit -m "fix(b62): restore focus after active conversation deletion (#1042)"
          git push origin HEAD:feat/b62-conversation-delete-1042
