name: B60 Temp Protected Fallback Preview

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.pull_request.number == 662
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_APP_ID: 845d1802-9458-46c8-8685-448538f0511a
      TEMP_PROJECT: b60-pr662-review-20260824
      TEMP_DOMAIN: b60-pr662-review-20260824.pages.dev
      TEMP_BRANCH: review
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Read source Access policy
        shell: bash
        run: |
          set -euo pipefail
          app_json="$(mktemp)"
          policies_json="$(mktemp)"
          curl --silent --show-error --fail \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/apps/${SOURCE_APP_ID}" \
            -o "${app_json}"
          curl --silent --show-error --fail \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/apps/${SOURCE_APP_ID}/policies" \
            -o "${policies_json}"
          jq -e '.success == true and .result.type == "self_hosted"' "${app_json}" >/dev/null
          jq -e '.success == true and (.result|length) >= 1' "${policies_json}" >/dev/null
          cp "${app_json}" "${RUNNER_TEMP}/source-app.json"
          cp "${policies_json}" "${RUNNER_TEMP}/source-policies.json"

      - name: Ensure empty temporary Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          project_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${TEMP_PROJECT}"
          response="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "${response}" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            "${project_url}")"
          if [ "${status}" = 404 ]; then
            create_payload="$(mktemp)"
            create_response="$(mktemp)"
            jq -n --arg name "${TEMP_PROJECT}" --arg branch "${TEMP_BRANCH}" '{name:$name,production_branch:$branch}' > "${create_payload}"
            create_status="$(curl --silent --show-error \
              --request POST \
              --output "${create_response}" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data-binary "@${create_payload}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects")"
            test "${create_status}" = 200 || test "${create_status}" = 201 || { cat "${create_response}"; exit 1; }
          else
            test "${status}" = 200 || { cat "${response}"; exit 1; }
          fi

      - name: Attach cloned Access protection before file deployment
        shell: bash
        run: |
          set -euo pipefail
          apps_json="$(mktemp)"
          curl --silent --show-error --fail \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/apps" \
            -o "${apps_json}"
          app_id="$(jq -r --arg domain "${TEMP_DOMAIN}" '.result[] | select(.domain==$domain) | .id' "${apps_json}" | head -n1)"
          if [ -z "${app_id}" ]; then
            payload="$(mktemp)"
            response="$(mktemp)"
            jq --arg name "B60 PR662 Review Temp" --arg domain "${TEMP_DOMAIN}" \
              '.result | {type,session_duration,auto_redirect_to_identity,allowed_idps,app_launcher_visible,enable_binding_cookie,http_only_cookie_attribute,options_preflight_bypass} + {name:$name,domain:$domain}' \
              "${RUNNER_TEMP}/source-app.json" > "${payload}"
            status="$(curl --silent --show-error \
              --request POST \
              --output "${response}" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data-binary "@${payload}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/apps")"
            test "${status}" = 201 || test "${status}" = 200 || { cat "${response}"; exit 1; }
            app_id="$(jq -r '.result.id' "${response}")"
          fi
          test -n "${app_id}"
          echo "TEMP_ACCESS_APP_ID=${app_id}" >> "${GITHUB_ENV}"

          policy_list="$(mktemp)"
          curl --silent --show-error --fail \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/apps/${app_id}/policies" \
            -o "${policy_list}"
          count="$(jq '.result|length' "${policy_list}")"
          if [ "${count}" -eq 0 ]; then
            policy_payload="$(mktemp)"
            policy_response="$(mktemp)"
            jq '.result[0] | {name:"Allow Members - B60 PR662 Temp",decision,include,exclude,require}' \
              "${RUNNER_TEMP}/source-policies.json" > "${policy_payload}"
            status="$(curl --silent --show-error \
              --request POST \
              --output "${policy_response}" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data-binary "@${policy_payload}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/apps/${app_id}/policies")"
            test "${status}" = 201 || test "${status}" = 200 || { cat "${policy_response}"; exit 1; }
          fi

      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source and deploy protected fallback
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${PR_HEAD_SHA}"
          test -f apps/portfolio-console/ai-api/index.html
          npx --yes wrangler@4 pages deploy apps/portfolio-console \
            --project-name "${TEMP_PROJECT}" \
            --branch "${TEMP_BRANCH}" \
            --commit-hash "${PR_HEAD_SHA}" \
            --commit-message "B60 PR662 protected review fallback" \
            --commit-dirty=false

      - name: Verify apex TLS and Access protection
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if timeout 10 openssl s_client -connect "${TEMP_DOMAIN}:443" -servername "${TEMP_DOMAIN}" -brief </dev/null >/tmp/tls.out 2>&1; then
              cat /tmp/tls.out
              break
            fi
            cat /tmp/tls.out || true
            if [ "${attempt}" -eq 12 ]; then exit 1; fi
            sleep 10
          done
          headers="$(mktemp)"
          curl --silent --show-error --head --max-time 15 "https://${TEMP_DOMAIN}/ai-api/" -o "${headers}"
          cat "${headers}"
          grep -qi '^location: https://.*cloudflareaccess.com/' "${headers}"
          echo "PROTECTED_PREVIEW=https://${TEMP_DOMAIN}/ai-api/"
