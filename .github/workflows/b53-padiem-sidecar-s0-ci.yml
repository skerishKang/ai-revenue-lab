name: B53 Padiem Sidecar S0 CI

on:
  # push 트리거는 feat/1722-b53-padiem-sidecar-s0 전용이었고 해당 브랜치는
  # 원격에 더 이상 없다(2026-11-05 기준). 항목만 남기면 push 대상이 모든
  # 브랜치로 넓어지므로, 동작 보존을 위해 push 트리거 블록째로 뺀다.
  # PR 트리거는 그대로 산동한다.
  pull_request:
    paths:
      - 'apps/portfolio-console/business-manifest.js'
      - 'apps/portfolio-console/tests/padiem-sidecar-registry.test.js'
      - 'docs/products/padiem-sidecar/**'
      - '.github/workflows/b53-padiem-sidecar-s0-ci.yml'

permissions:
  contents: read

concurrency:
  group: b53-padiem-sidecar-s0-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  b53-sidecar-s0-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          node --check apps/portfolio-console/business-manifest.js
          node --check apps/portfolio-console/tests/padiem-sidecar-registry.test.js

      - name: Padiem Sidecar registry and docs contract
        run: node apps/portfolio-console/tests/padiem-sidecar-registry.test.js

      - name: Diff whitespace gate
        shell: bash
        run: |
          BASE="$(git merge-base origin/${{ github.event.repository.default_branch }} HEAD)"
          git diff --check "$BASE"...HEAD
