name: Validate B13 Complete 465
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/personal-video-archive/**'
      - '.github/workflows/validate-b13-complete-465.yml'
permissions:
  contents: read
jobs:
  validate:
    if: github.event.pull_request.head.ref == 'feat/b13-personal-video-archive-complete-465'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and validate B13
        shell: bash
        run: |
          set -euo pipefail
          cd apps/personal-video-archive
          python -m pip install -e '.[dev]'
          pytest tests/ -q
          python -m scripts.build_static_preview
          test -f dist-preview/index.html
          grep -q 'class="top-note"' dist-preview/index.html
          python -m scripts.build_static_production
          test -f dist-preview/guide.html
          grep -q 'GUIDE · 30 SECONDS' dist-preview/guide.html
          ! grep -q 'class="top-note"' dist-preview/index.html
          grep -q 'href="/guide.html"' dist-preview/index.html
          test -f dist-preview/topics/new/index.html
          test -f dist-preview/records/index.html
          grep -q "form-action 'none'" dist-preview/_headers
          grep -q "connect-src 'none'" dist-preview/_headers
          cd ../..
          git diff --check origin/main...HEAD -- 'apps/personal-video-archive/**'
          echo B13_COMPLETE_VALIDATION_PASS=1
