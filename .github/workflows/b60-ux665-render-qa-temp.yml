name: B60 UX665 Render QA Temp

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.number == 666
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/b60qa"
          npm install --prefix "${RUNNER_TEMP}/b60qa" playwright@1.55.0 >/dev/null
          "${RUNNER_TEMP}/b60qa/node_modules/.bin/playwright" install --with-deps chromium >/dev/null

      - name: Start static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory apps/portfolio-console >"${RUNNER_TEMP}/b60-server.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/b60-server.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ai-api/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/b60-server.log"
          exit 1

      - name: Run desktop and mobile UX render gate
        shell: bash
        env:
          PW: ${{ runner.temp }}/b60qa/node_modules/playwright
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/b60-ux665"
          cat > "${RUNNER_TEMP}/b60-ux665/run.cjs" <<'NODE'
          const { chromium } = require(process.env.PW);
          const fs = require('fs');
          const path = require('path');
          const out = process.env.RUNNER_TEMP + '/b60-ux665';
          const failures = [];
          const evidence = [];
          const assert = (cond, msg) => { if (!cond) failures.push(msg); };
          const shot = async (page, name) => page.screenshot({path:path.join(out,name), fullPage:true});
          const activePrimary = async page => page.locator('.ia-primary [data-ia-view].is-active').evaluateAll(nodes => nodes.map(node => node.dataset.iaView));

          async function exercise(viewport, prefix) {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport});
            const consoleErrors = [];
            const requestFailures = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('requestfailed', req => requestFailures.push(`${req.method()} ${req.url()} ${req.failure()?.errorText || ''}`));
            await page.goto('http://127.0.0.1:4173/ai-api/', {waitUntil:'networkidle'});
            await page.locator('#explore').scrollIntoViewIfNeeded();
            await page.waitForSelector('.ia-primary');

            const actualViewport = await page.evaluate(() => ({innerWidth, innerHeight, clientWidth: document.documentElement.clientWidth}));
            assert(actualViewport.innerWidth === viewport.width, `${prefix}: viewport width mismatch ${JSON.stringify(actualViewport)} expected ${viewport.width}`);

            const primary = await page.locator('.ia-primary [data-ia-view]').allTextContents();
            assert(JSON.stringify(primary) === JSON.stringify(['Discover','Providers','Models','Connect','Watch']), `${prefix}: primary nav mismatch ${JSON.stringify(primary)}`);
            assert(await page.locator('.ia-legacy-tabs').evaluate(el => getComputedStyle(el).display === 'none'), `${prefix}: legacy tabs still visible`);
            assert(JSON.stringify(await activePrimary(page)) === JSON.stringify(['discover']), `${prefix}: Discover active state incorrect ${JSON.stringify(await activePrimary(page))}`);
            await shot(page, `${prefix}-01-discover.png`);

            await page.locator('.ia-primary [data-ia-view="providers"]').click();
            await page.waitForSelector('.ia-provider-card');
            assert(JSON.stringify(await activePrimary(page)) === JSON.stringify(['providers']), `${prefix}: Providers active state incorrect ${JSON.stringify(await activePrimary(page))}`);
            assert(await page.locator('.ia-provider-card').count() === 5, `${prefix}: expected 5 provider cards`);
            await shot(page, `${prefix}-02-providers.png`);
            await page.locator('.ia-provider-card').first().click();
            await page.waitForSelector('.ia-entity-detail .ia-route-detail');
            assert(await page.locator('.ia-source-row a').count() >= 1, `${prefix}: provider detail missing source links`);
            await shot(page, `${prefix}-03-provider-detail.png`);

            await page.locator('.ia-primary [data-ia-view="models"]').click();
            await page.waitForSelector('.ia-model-card');
            assert(JSON.stringify(await activePrimary(page)) === JSON.stringify(['models']), `${prefix}: Models active state incorrect ${JSON.stringify(await activePrimary(page))}`);
            assert(await page.locator('.ia-model-card').count() === 5, `${prefix}: expected 5 model cards`);
            await shot(page, `${prefix}-04-models.png`);
            await page.locator('.ia-model-card').first().click();
            await page.waitForSelector('.ia-entity-detail .ia-route-detail');
            assert(await page.locator('.ia-route-facts').count() >= 1, `${prefix}: model route detail missing`);
            await shot(page, `${prefix}-05-model-detail.png`);

            await page.locator('.ia-primary [data-ia-view="connect"]').click();
            await page.waitForSelector('.ia-connect-boundary');
            const connectActive = await activePrimary(page);
            assert(JSON.stringify(connectActive) === JSON.stringify(['connect']), `${prefix}: Connect active state incorrect ${JSON.stringify(connectActive)}`);
            assert(await page.locator('.ia-state.discoverable').count() >= 2, `${prefix}: discoverable/info-only boundary missing`);
            assert(await page.locator('.ia-connect-boundary input[type="password"], .ia-connect-boundary input[name*="key" i]').count() === 0, `${prefix}: credential input unexpectedly present`);
            await shot(page, `${prefix}-06-connect.png`);

            await page.locator('.ia-primary [data-ia-view="discover"]').click();
            await page.waitForSelector('.access-card');
            await page.waitForTimeout(50);
            const save = page.locator('.access-card .save-v7').first();
            if (await save.count()) await save.click();
            await page.locator('.ia-primary [data-ia-view="watch"]').click();
            await page.waitForTimeout(80);
            assert(JSON.stringify(await activePrimary(page)) === JSON.stringify(['watch']), `${prefix}: Watch active state incorrect ${JSON.stringify(await activePrimary(page))}`);
            assert(await page.locator('[data-ia-subview="saved"]').count() === 1, `${prefix}: watch saved subview missing`);
            if (await save.count()) assert(await page.locator('.watch-card-v7').count() >= 1, `${prefix}: saved item did not reach Watch`);
            await shot(page, `${prefix}-07-watch.png`);

            await page.locator('.ia-primary [data-ia-view="discover"]').click();
            await page.locator('[data-ia-subview="new"]').click();
            await page.waitForTimeout(60);
            assert(await page.locator('.v8-context, .v8-signal-row').count() >= 1, `${prefix}: New Today view did not render`);
            await page.locator('[data-ia-subview="ending"]').click();
            await page.waitForTimeout(60);
            assert(await page.locator('.v8-context, .v8-signal-row').count() >= 1, `${prefix}: Ending Soon view did not render`);

            const overflow = await page.evaluate(() => ({scrollWidth:document.documentElement.scrollWidth, clientWidth:document.documentElement.clientWidth}));
            if (prefix === 'mobile') assert(overflow.scrollWidth <= overflow.clientWidth + 1, `${prefix}: horizontal overflow ${JSON.stringify(overflow)}`);
            assert(consoleErrors.length === 0, `${prefix}: console errors ${consoleErrors.join(' | ')}`);
            assert(requestFailures.length === 0, `${prefix}: failed requests ${requestFailures.join(' | ')}`);
            evidence.push({prefix, viewport: actualViewport, primary, connectActive, consoleErrors, requestFailures, overflow});
            await browser.close();
          }

          (async () => {
            await exercise({width:1440,height:1000}, 'desktop');
            await exercise({width:390,height:844}, 'mobile');
            const result = {pass:failures.length===0, failures, evidence};
            fs.writeFileSync(path.join(out,'result.json'), JSON.stringify(result,null,2));
            console.log(JSON.stringify(result,null,2));
            if (failures.length) process.exit(1);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          node "${RUNNER_TEMP}/b60-ux665/run.cjs"

      - name: Upload UX render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b60-ux665-render-evidence
          path: ${{ runner.temp }}/b60-ux665
          if-no-files-found: error
