name: Internal Platform Registry CI

on:
  pull_request:
    paths:
      - 'docs/internal-platform/**'
      - 'apps/portfolio-console/internal-platform-*.js'
      - 'apps/portfolio-console/internal-platform.css'
      - 'apps/portfolio-console/businesses.js'
      - 'apps/portfolio-console/package.json'
      - 'apps/portfolio-console/package-lock.json'
      - 'apps/portfolio-console/tests/internal-platform-registry.test.js'
      - 'apps/portfolio-console/tests/internal-platform.spec.js'
      - '.github/workflows/internal-platform-registry-ci.yml'
  push:
    paths:
      - 'docs/internal-platform/**'
      - 'apps/portfolio-console/internal-platform-*.js'
      - 'apps/portfolio-console/internal-platform.css'
      - 'apps/portfolio-console/businesses.js'
      - 'apps/portfolio-console/package.json'
      - 'apps/portfolio-console/package-lock.json'
      - 'apps/portfolio-console/tests/internal-platform-registry.test.js'
      - 'apps/portfolio-console/tests/internal-platform.spec.js'
      - '.github/workflows/internal-platform-registry-ci.yml'

permissions:
  contents: read

concurrency:
  group: internal-platform-registry-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  internal-platform-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        working-directory: apps/portfolio-console
        run: |
          node --check internal-platform-manifest.js
          node --check internal-platform-console.js
          node --check businesses.js
          node --check tests/internal-platform.spec.js

      - name: Internal Platform registry contract
        working-directory: apps/portfolio-console
        run: node tests/internal-platform-registry.test.js

      - name: Diff whitespace gate
        run: |
          BASE="$(git merge-base origin/main HEAD)"
          git diff --check "${BASE}"..HEAD

  internal-platform-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/portfolio-console/package-lock.json

      - name: Install dependencies
        working-directory: apps/portfolio-console
        run: npm ci

      - name: Resolve the installed Playwright version
        id: playwright-version
        working-directory: apps/portfolio-console
        shell: bash
        run: echo "version=$(npx playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: playwright-browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the Node Playwright release this lane resolves
          # from its own lock, so a browser build can never be reused across releases.
          key: pw-chromium-node-${{ steps.playwright-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Select Ubuntu archive for Playwright OS dependencies
        working-directory: apps/portfolio-console
        shell: bash
        run: bash ../../.github/scripts/b62_playwright_apt_mirror_3989.sh

      - name: Install Chromium system libraries
        working-directory: apps/portfolio-console
        shell: bash
        run: npx playwright install-deps chromium

      - name: Install Chromium browser
        if: steps.playwright-browser-cache.outputs.cache-hit != 'true'
        working-directory: apps/portfolio-console
        shell: bash
        run: npx playwright install chromium

      - name: Focused Internal Platform browser contract
        working-directory: apps/portfolio-console
        env:
          ARL_PLAIN_STATIC_SERVER: '1'
        run: npx playwright test tests/internal-platform.spec.js --project=chromium-desktop
