name: B62 Web XLSX D1 Migration 081 Gate

on:
  pull_request:
    paths:
      - ".github/workflows/b62-d1-migration-081-gate.yml"
      - ".github/scripts/b62_d1_migration_081_schema.py"
      - ".github/tests/test_b62_d1_migration_081_gate.py"
      - "apps/padiem-chat/migrations/029_claw_web_xlsx_selection.sql"
      - "apps/padiem-chat/migrations/032_claw_web_xlsx_quote_edit_receipts.sql"
      - "apps/padiem-chat/migrations/081_claw_web_xlsx_selection_limit.sql"
  workflow_dispatch:
    inputs:
      mode:
        description: "D1 web XLSX selection release mode"
        required: true
        type: choice
        default: repository_preflight
        options:
          - repository_preflight
          - readonly
          - apply_migration_081
      target_sha:
        description: "Exact latest main SHA, rechecked before live access and mutation"
        required: true
        type: string
      confirmation:
        description: "Explicit mutation authorization; required for apply only"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: b62-web-xlsx-d1-081-gate
  cancel-in-progress: false

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.b62_target_sha.outputs.target_sha }}
    steps:
      - name: Verify target_sha shape before any checkout
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: b62_target_sha
        env:
          B62_TARGET_SHA_RAW: ${{ inputs.target_sha }}
        shell: bash
        run: |
          python3 - <<'B62_TARGET_SHA_GUARD'
          import os
          import re
          import sys

          _SHA = re.compile(r"^[0-9a-f]{40}$")


          def canonical_target_sha(raw):
              # Case is the only forgiveness: a short or non-hex value is not a commit.
              value = (raw or "").strip()
              if len(value) != 40:
                  return None
              candidate = value.lower()
              return candidate if _SHA.match(candidate) else None


          def failure_message(raw):
              return f"target_sha는 40자리 전체 SHA여야 합니다(입력: {len((raw or '').strip())}자리). git rev-parse origin/main 값을 넣으세요"


          def main():
              raw = os.environ.get("B62_TARGET_SHA_RAW", "")
              canonical = canonical_target_sha(raw)
              if canonical is None:
                  sys.stdout.write("::error::" + failure_message(raw) + "\n")
                  return 1
              for key, name in (("GITHUB_OUTPUT", "target_sha"), ("GITHUB_ENV", "TARGET_SHA")):
                  path = os.environ.get(key)
                  if path:
                      with open(path, "a", encoding="utf-8") as handle:
                          handle.write(f"{name}={canonical}\n")
              sys.stdout.write("B62_TARGET_SHA_INPUT_SHAPE=PASS\n")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          B62_TARGET_SHA_GUARD

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || steps.b62_target_sha.outputs.target_sha }}
          persist-credentials: false
      - name: Exact-main authority for dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'B62_WEB_XLSX_EXACT_MAIN=PASS'
      - name: Source SQL and fail-closed contract
        run: python .github/tests/test_b62_d1_migration_081_gate.py
      - run: |
          echo 'B62_WEB_XLSX_SOURCE=PASS'
          echo 'PRODUCTION_MUTATION=0'

  cloudflare-readonly:
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'repository_preflight' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ needs.source-contract.outputs.target_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    outputs:
      schema: ${{ steps.readback.outputs.schema }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Exact current main and production D1 binding
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/padiem-chat/settings" \
            -o "${RUNNER_TEMP}/settings.json"
          DB_ID="$(python - "${RUNNER_TEMP}/settings.json" <<'PY'
          import json,re,sys
          result=json.load(open(sys.argv[1],encoding='utf-8'))
          bindings=result.get('result',{}).get('bindings',[]) if result.get('success') is True else []
          hits=[x for x in bindings if x.get('name')=='PADIEM_CHAT_DB' and x.get('type')=='d1']
          if len(hits)!=1 or not re.fullmatch(r'[0-9a-fA-F-]{32,36}',str(hits[0].get('id',''))):
              raise SystemExit('live PADIEM_CHAT_DB binding not proven')
          print(hits[0]['id'])
          PY
          )"
          echo "::add-mask::${DB_ID}"
          echo "DB_ID=${DB_ID}" >> "${GITHUB_ENV}"
          echo 'B62_WEB_XLSX_BOUND_D1=PASS'
      - name: Schema-only readback (never application rows)
        id: readback
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/b62_d1_migration_081_schema.py query "${RUNNER_TEMP}/q.json"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary "@${RUNNER_TEMP}/q.json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            -o "${RUNNER_TEMP}/schema.json"
          python .github/scripts/b62_d1_migration_081_schema.py classify "${RUNNER_TEMP}/schema.json" | tee "${RUNNER_TEMP}/result.txt"
          STATE="$(sed -n 's/^B62_WEB_XLSX_SCHEMA=//p' "${RUNNER_TEMP}/result.txt")"
          case "${STATE}" in 029|081|DRIFT) ;; *) exit 1 ;; esac
          test "${STATE}" != "DRIFT"
          echo "schema=${STATE}" >> "${GITHUB_OUTPUT}"
          echo 'D1_SCHEMA_QUERY=READ_ONLY'
          echo 'ROW_DATA_READ=0'
          echo 'PRODUCTION_MUTATION=0'

  apply-migration-081:
    needs: [source-contract, cloudflare-readonly]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply_migration_081' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      TARGET_SHA: ${{ needs.source-contract.outputs.target_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRMATION: ${{ inputs.confirmation }}
      READONLY_SCHEMA: ${{ needs.cloudflare-readonly.outputs.schema }}
    steps:
      - name: Require explicit authorization and non-drift preflight
        shell: bash
        run: |
          set -euo pipefail
          test "${CONFIRMATION}" = "APPLY_B62_WEB_XLSX_081_FROM_EXACT_MAIN"
          case "${READONLY_SCHEMA}" in 029|081) ;; *) exit 1 ;; esac
          echo 'B62_WEB_XLSX_PRODUCTION_AUTHORITY=PASS'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Recheck exact main and same live D1 schema before mutation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          curl --fail --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/padiem-chat/settings" \
            -o "${RUNNER_TEMP}/settings.json"
          DB_ID="$(python - "${RUNNER_TEMP}/settings.json" <<'PY'
          import json,re,sys
          result=json.load(open(sys.argv[1],encoding='utf-8'))
          bindings=result.get('result',{}).get('bindings',[]) if result.get('success') is True else []
          hits=[x for x in bindings if x.get('name')=='PADIEM_CHAT_DB' and x.get('type')=='d1']
          if len(hits)!=1 or not re.fullmatch(r'[0-9a-fA-F-]{32,36}',str(hits[0].get('id',''))):
              raise SystemExit('live PADIEM_CHAT_DB binding not proven')
          print(hits[0]['id'])
          PY
          )"
          echo "::add-mask::${DB_ID}"
          echo "DB_ID=${DB_ID}" >> "${GITHUB_ENV}"
          python .github/scripts/b62_d1_migration_081_schema.py query "${RUNNER_TEMP}/q.json"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' --data-binary "@${RUNNER_TEMP}/q.json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            -o "${RUNNER_TEMP}/before.json"
          python .github/scripts/b62_d1_migration_081_schema.py classify "${RUNNER_TEMP}/before.json" | tee "${RUNNER_TEMP}/result.txt"
          STATE="$(sed -n 's/^B62_WEB_XLSX_SCHEMA=//p' "${RUNNER_TEMP}/result.txt")"
          test "${STATE}" = "${READONLY_SCHEMA}"
          BEFORE_SELECTION_COUNT="$(sed -n 's/^B62_WEB_XLSX_SELECTION_ROW_COUNT=//p' "${RUNNER_TEMP}/result.txt")"
          BEFORE_RECEIPT_COUNT="$(sed -n 's/^B62_WEB_XLSX_RECEIPT_ROW_COUNT=//p' "${RUNNER_TEMP}/result.txt")"
          test "${BEFORE_SELECTION_COUNT}" -ge 0
          test "${BEFORE_RECEIPT_COUNT}" -ge 0
          echo "BEFORE_SELECTION_COUNT=${BEFORE_SELECTION_COUNT}" >> "${GITHUB_ENV}"
          echo "BEFORE_RECEIPT_COUNT=${BEFORE_RECEIPT_COUNT}" >> "${GITHUB_ENV}"
          echo "STATE=${STATE}" >> "${GITHUB_ENV}"
          echo 'B62_WEB_XLSX_PREMUTATION_GUARD=PASS'
      - name: Rebuild XLSX selection only from exact 029 schema
        if: ${{ env.STATE != '081' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'B62_WEB_XLSX_IMMEDIATE_PREAPPLY_MAIN=PASS'
          python .github/scripts/b62_d1_migration_081_schema.py apply "${RUNNER_TEMP}/apply.json" "${STATE}"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' --data-binary "@${RUNNER_TEMP}/apply.json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            -o "${RUNNER_TEMP}/apply-result.json"
          python .github/scripts/b62_d1_migration_081_schema.py check-apply "${RUNNER_TEMP}/apply-result.json"
          echo 'B62_WEB_XLSX_APPLY=PASS'
          echo 'PRODUCTION_MUTATION=SCHEMA_ONLY'
      - name: Verify exact schema after operation
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/b62_d1_migration_081_schema.py query "${RUNNER_TEMP}/post-q.json"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' --data-binary "@${RUNNER_TEMP}/post-q.json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            -o "${RUNNER_TEMP}/post.json"
          python .github/scripts/b62_d1_migration_081_schema.py classify "${RUNNER_TEMP}/post.json" | tee "${RUNNER_TEMP}/post-state.txt"
          grep -qx 'B62_WEB_XLSX_SCHEMA=081' "${RUNNER_TEMP}/post-state.txt"
          echo 'B62_WEB_XLSX_POSTMUTATION_SCHEMA=PASS'
          POST_SELECTION_COUNT="$(sed -n 's/^B62_WEB_XLSX_SELECTION_ROW_COUNT=//p' "${RUNNER_TEMP}/post-state.txt")"
          POST_RECEIPT_COUNT="$(sed -n 's/^B62_WEB_XLSX_RECEIPT_ROW_COUNT=//p' "${RUNNER_TEMP}/post-state.txt")"
          test "${POST_SELECTION_COUNT}" = "${BEFORE_SELECTION_COUNT}"
          test "${POST_RECEIPT_COUNT}" = "${BEFORE_RECEIPT_COUNT}"
          python .github/scripts/b62_d1_migration_081_schema.py verify-preservation "${RUNNER_TEMP}/before.json" "${RUNNER_TEMP}/post.json"
          echo 'B62_WEB_XLSX_ROW_PRESERVATION=PASS'
          echo 'WEB_XLSX_POST_SCHEMA=081'
