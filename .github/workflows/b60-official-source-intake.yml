name: B60 Official Source Intake

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b60-official-source-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout default-branch source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate collector and review boundaries
        working-directory: reference/business-60-ai-api-v1
        run: >-
          node --test
          collector/intake-core.test.cjs
          collector/review-promotion.test.cjs
          collector/audit-intake-output.test.cjs

      - name: Run read-only official-source intake
        working-directory: reference/business-60-ai-api-v1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/b60-official-source-intake"
          node collector/run-intake.cjs \
            --out "${RUNNER_TEMP}/b60-official-source-intake/candidates.json"

      - name: Audit review-only output and write summary
        working-directory: reference/business-60-ai-api-v1
        shell: bash
        run: |
          set -euo pipefail
          node collector/audit-intake-output.cjs \
            --input "${RUNNER_TEMP}/b60-official-source-intake/candidates.json" \
            --summary "${RUNNER_TEMP}/b60-official-source-intake/summary.md" \
            --sha "${GITHUB_SHA}"
          cat "${RUNNER_TEMP}/b60-official-source-intake/summary.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload review-only intake artifacts
        uses: actions/upload-artifact@v4
        with:
          name: b60-official-source-intake-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/b60-official-source-intake/candidates.json
            ${{ runner.temp }}/b60-official-source-intake/summary.md
          if-no-files-found: error
          retention-days: 14
