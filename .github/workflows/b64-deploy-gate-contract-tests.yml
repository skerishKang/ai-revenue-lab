name: B64 Deploy Gate Contract Tests

# CI for the two dispatch-only B64 production gates: the deploy gate and the
# independent-identity activation gate (schema + credential bindings). This
# workflow mutates nothing: it parses the gate YAML and runs static pytest
# contracts.
#
# apps/ai-reward-router/** is in the path filter on purpose. The gate's
# post-deploy parity step asserts on strings the product renders
# (`INCOME_PIPELINE`, `data-theme`, `수익 기회 보기`, the anonymous login prompt,
# the /healthz field set), so a product rename can silently turn a green gate
# into a check that no longer proves the merged revision is serving. A change to
# those surfaces must re-run these contracts.

on:
  pull_request:
    paths:
      - ".github/workflows/b64-cloudflare-worker-production-deploy-gate.yml"
      - ".github/workflows/b64-deploy-gate-contract-tests.yml"
      - ".github/workflows/b64-independent-identity-activation-gate.yml"
      - ".github/tests/test_b64_production_deploy_gate.py"
      - ".github/tests/test_b64_google_oauth_binding_gate.py"
      - "apps/ai-reward-router/src/**"
      - "apps/ai-reward-router/wrangler.jsonc"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/b64-cloudflare-worker-production-deploy-gate.yml"
      - ".github/workflows/b64-deploy-gate-contract-tests.yml"
      - ".github/workflows/b64-independent-identity-activation-gate.yml"
      - ".github/tests/test_b64_production_deploy_gate.py"
      - ".github/tests/test_b64_google_oauth_binding_gate.py"
      - "apps/ai-reward-router/src/**"
      - "apps/ai-reward-router/wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b64-deploy-gate-contract-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gate-contract-tests:
    name: Gate contract (parse only, no deployment)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --quiet pyyaml pytest

      - name: Run gate contract tests
        run: |
          python -m pytest -q \
            .github/tests/test_b64_production_deploy_gate.py \
            .github/tests/test_b64_google_oauth_binding_gate.py

      - name: Record no deployment performed
        run: |
          echo 'B64_DEPLOY_GATE_CONTRACT_TESTS=PASS'
          echo 'B64_WORKER_DEPLOYED=0'
          echo 'CLOUDFLARE_API_CALLED=0'
