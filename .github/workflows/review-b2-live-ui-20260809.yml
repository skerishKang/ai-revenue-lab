name: Review B2 Live UI 20260809

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/review-b2-live-ui-20260809.yml

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.head.ref == 'ops/review-b2-ui-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      B2_URL: https://ops-living-travel-external-s.ai-revenue-living-travel.pages.dev/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Capture live B2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p b2-live-review
          cat > capture-b2.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const url = process.env.B2_URL;
          const browser = await chromium.launch({headless:true});
          const cases = [
            {name:'desktop', width:1440, height:1100},
            {name:'mobile', width:390, height:844}
          ];
          const report = [];
          for (const c of cases) {
            const page = await browser.newPage({viewport:{width:c.width,height:c.height}, deviceScaleFactor:1});
            const consoleErrors=[]; const pageErrors=[];
            page.on('console', msg => { if (msg.type()==='error') consoleErrors.push(msg.text()); });
            page.on('pageerror', err => pageErrors.push(String(err)));
            const response = await page.goto(url, {waitUntil:'networkidle', timeout:60000});
            await page.waitForTimeout(1200);
            await page.screenshot({path:`b2-live-review/${c.name}.png`, fullPage:true});
            const title = await page.title();
            const finalUrl = page.url();
            const text = (await page.locator('body').innerText()).slice(0,12000);
            fs.writeFileSync(`b2-live-review/${c.name}.txt`, text);
            const metrics = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth,
              scrollHeight: document.documentElement.scrollHeight,
              clientHeight: document.documentElement.clientHeight,
              h1: [...document.querySelectorAll('h1')].map(x=>x.textContent?.trim()).filter(Boolean),
              buttons: [...document.querySelectorAll('button,a')].map(x=>x.textContent?.trim()).filter(Boolean).slice(0,80),
              images: [...document.images].map(i=>({src:i.currentSrc||i.src,alt:i.alt,nw:i.naturalWidth,nh:i.naturalHeight})).slice(0,80),
              bodyBg: getComputedStyle(document.body).backgroundColor,
              bodyFont: getComputedStyle(document.body).fontFamily
            }));
            report.push({case:c.name,status:response?.status(),title,finalUrl,consoleErrors,pageErrors,metrics});
            await page.close();
          }
          fs.writeFileSync('b2-live-review/report.json', JSON.stringify(report,null,2));
          await browser.close();
          JS
          node capture-b2.mjs
          cat b2-live-review/report.json

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: b2-live-ui-review
          path: b2-live-review
          retention-days: 3
