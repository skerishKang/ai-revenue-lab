name: Review B2 Live UI 20260809

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/review-b2-live-ui-20260809.yml

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.head.ref == 'ops/review-b2-ui-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      B2_URL: https://ops-living-travel-external-s.ai-revenue-living-travel.pages.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Capture live B2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p b2-live-review
          cat > capture-b2.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const root = process.env.B2_URL;
          const browser = await chromium.launch({headless:true});
          const viewports=[{name:'desktop',width:1440,height:1100},{name:'mobile',width:390,height:844}];
          const routeDefs=[
            ['root',''],
            ['traveler','traveler/enter.html'],
            ['operator','operator/login.html'],
            ['demo-intro','demo/intro.html'],
            ['demo-home','demo/traveler-home.html'],
            ['demo-edition','demo/edition.html'],
            ['demo-comparison','demo/comparison.html']
          ];
          const report=[];
          for(const v of viewports){
            for(const [name,path] of routeDefs){
              const page=await browser.newPage({viewport:{width:v.width,height:v.height}});
              const consoleErrors=[]; const pageErrors=[];
              page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
              page.on('pageerror',e=>pageErrors.push(String(e)));
              const url=new URL(path,root).href;
              const response=await page.goto(url,{waitUntil:'networkidle',timeout:60000});
              await page.waitForTimeout(700);
              await page.screenshot({path:`b2-live-review/${v.name}-${name}.png`,fullPage:true});
              fs.writeFileSync(`b2-live-review/${v.name}-${name}.txt`,(await page.locator('body').innerText()).slice(0,12000));
              const metrics=await page.evaluate(()=>({
                scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,
                scrollHeight:document.documentElement.scrollHeight,clientHeight:document.documentElement.clientHeight,
                h1:[...document.querySelectorAll('h1')].map(x=>x.textContent?.trim()).filter(Boolean),
                headings:[...document.querySelectorAll('h2,h3')].map(x=>x.textContent?.trim()).filter(Boolean).slice(0,30),
                actions:[...document.querySelectorAll('button,a')].map(x=>x.textContent?.trim()).filter(Boolean).slice(0,80),
                imageCount:document.images.length,bodyBg:getComputedStyle(document.body).backgroundColor,bodyFont:getComputedStyle(document.body).fontFamily
              }));
              report.push({viewport:v.name,route:name,url,status:response?.status(),title:await page.title(),consoleErrors,pageErrors,metrics});
              await page.close();
            }
          }
          fs.writeFileSync('b2-live-review/report.json',JSON.stringify(report,null,2));
          await browser.close();
          JS
          node capture-b2.mjs
          cat b2-live-review/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: b2-live-ui-review
          path: b2-live-review
          retention-days: 3
