name: B60 Canonical Integration Exact Head Gate 2 Temp

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  canonical-exact-heads-remaining:
    if: github.event.pull_request.number == 678
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout gate carrier
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout PR 672 exact head
        uses: actions/checkout@v4
        with:
          ref: e80aeb0204fad50faba4a35499bb73ab1589fdcd
          path: gates/pr672
          persist-credentials: false
      - name: Verify PR 672 Watch
        shell: bash
        run: |
          set -euo pipefail
          cd gates/pr672
          test "$(git rev-parse HEAD)" = "e80aeb0204fad50faba4a35499bb73ab1589fdcd"
          node --check apps/portfolio-console/ai-api/product-v12-watch.js
          node --check apps/portfolio-console/ai-api/product-v7.js
          cmp apps/portfolio-console/ai-api/product-v12-watch.js reference/business-60-ai-api-v1/product-v12-watch.js
          cmp apps/portfolio-console/ai-api/product-v12-watch.css reference/business-60-ai-api-v1/product-v12-watch.css
          grep -F '.ux4-saved-list,.ux4-changes,.ux4-empty{grid-column:1/-1}' apps/portfolio-console/ai-api/product-v12-watch.css >/dev/null
          grep -F 'b60.ai-api.watchlist.v1' apps/portfolio-console/ai-api/product-v7.js >/dev/null
          grep -F 'window.B60_WATCH_STATE' apps/portfolio-console/ai-api/product-v12-watch.js >/dev/null
          echo "PR672_EXACT_HEAD=PASS"

      - name: Checkout PR 676 exact head
        uses: actions/checkout@v4
        with:
          ref: e4596a1d329cf3593695365bfdd30c775d5fdaa1
          path: gates/pr676
          persist-credentials: false
      - name: Verify PR 676 data truth
        shell: bash
        run: |
          set -euo pipefail
          cd gates/pr676
          test "$(git rev-parse HEAD)" = "e4596a1d329cf3593695365bfdd30c775d5fdaa1"
          cmp apps/portfolio-console/ai-api/data/access-signals.js reference/business-60-ai-api-v1/data/access-signals.js
          grep -F "Varies by routed provider" apps/portfolio-console/ai-api/data/access-signals.js >/dev/null
          ! grep -F '$1.40/M input · $4.40/M output' apps/portfolio-console/ai-api/data/access-signals.js
          node --check apps/portfolio-console/ai-api/data/access-signals.js
          echo "PR676_EXACT_HEAD=PASS"

      - name: Checkout PR 655 exact head
        uses: actions/checkout@v4
        with:
          ref: 2a9877db178155ddee7b4de62b04c88be4d0f508
          path: gates/pr655
          persist-credentials: false
      - name: Verify PR 655 collector truth boundary
        shell: bash
        run: |
          set -euo pipefail
          cd gates/pr655
          test "$(git rev-parse HEAD)" = "2a9877db178155ddee7b4de62b04c88be4d0f508"
          node --test reference/business-60-ai-api-v1/collector/intake-core.test.cjs
          grep -F "PARTIALLY_VERIFIED_OFFICIAL_WEB" reference/business-60-ai-api-v1/collector/intake-core.cjs >/dev/null
          grep -F "carriedForwardFields" reference/business-60-ai-api-v1/collector/intake-core.cjs >/dev/null
          ! grep -R "state:.*VERIFIED_OFFICIAL_WEB" reference/business-60-ai-api-v1/collector/run-intake.cjs reference/business-60-ai-api-v1/collector/source-manifest.cjs
          echo "PR655_EXACT_HEAD=PASS"

      - name: Summarize remaining gate
        shell: bash
        run: |
          echo "B60_CANONICAL_REMAINING_EXACT_HEAD_GATE=PASS"
          echo "PR672=e80aeb0204fad50faba4a35499bb73ab1589fdcd"
          echo "PR676=e4596a1d329cf3593695365bfdd30c775d5fdaa1"
          echo "PR655=2a9877db178155ddee7b4de62b04c88be4d0f508"
