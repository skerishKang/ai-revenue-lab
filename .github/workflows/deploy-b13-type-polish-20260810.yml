name: Deploy B13 Type Polish Exact Main 20260810

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/deploy-b13-type-polish-20260810.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.pull_request.head.ref == 'ops/deploy-b13-type-polish-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_SHA: e1a722c063f41332dfe185407a84220cbd977c6a
      PROJECT: ai-revenue-personal-video-archive
      URL: https://ai-revenue-personal-video-archive.pages.dev
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Assert exact main and build Production
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          cd apps/personal-video-archive
          python -m pip install -e .
          python -m scripts.build_static_production
          test -f dist-preview/index.html
          test -f dist-preview/guide.html
          test -f dist-preview/topics/index.html
          test -f dist-preview/records/index.html
          test -f dist-preview/static/cinema-ledger-v2-type-polish.css
          grep -q 'cinema-ledger-v2-type-polish.css' dist-preview/index.html
          grep -q 'cinema-ledger-v2-type-polish.css' dist-preview/guide.html
          ! grep -q 'cinema-ledger-v2-type-polish.css?v=' dist-preview/index.html
          ! grep -q 'cinema-ledger-v2-type-polish.css?v=' dist-preview/guide.html
          grep -q 'PRIVATE CINEMA LEDGER' dist-preview/guide.html
          ! grep -q 'class="top-note"' dist-preview/index.html

      - name: Assert canonical Cloudflare project
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PROJECT}" > /tmp/project.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/project.json'))['result']
          assert p['name']=='ai-revenue-personal-video-archive', p.get('name')
          print('B13_CANONICAL_PROJECT_OK=1')
          PY

      - name: Deploy exact-main Production output
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy apps/personal-video-archive/dist-preview \
            --project-name "$PROJECT" --branch main --commit-hash "$EXPECTED_SHA" \
            --commit-message 'B13 Korean cinema rhythm exact main' --commit-dirty=true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify canonical byte equality is stable
        shell: bash
        run: |
          set -euo pipefail
          verify(){
            url="$1"; source="$2"; label="$3"; expected=$(sha256sum "$source"|cut -d' ' -f1); streak=0
            for i in $(seq 1 50); do
              code=$(curl -L -sS --max-time 20 -o /tmp/public -w '%{http_code}' "$url"||true)
              actual=$(sha256sum /tmp/public 2>/dev/null|cut -d' ' -f1||true)
              if [[ "$code" == 200 && "$actual" == "$expected" ]]; then streak=$((streak+1)); else streak=0; fi
              echo "$label poll=$i streak=$streak http=$code expected=$expected actual=$actual"
              [[ "$streak" -ge 3 ]] && return 0
              sleep 3
            done
            return 1
          }
          verify "$URL/index.html" apps/personal-video-archive/dist-preview/index.html B13_ROOT
          verify "$URL/guide.html" apps/personal-video-archive/dist-preview/guide.html B13_GUIDE
          verify "$URL/topics/index.html" apps/personal-video-archive/dist-preview/topics/index.html B13_TOPICS
          verify "$URL/records/index.html" apps/personal-video-archive/dist-preview/records/index.html B13_RECORDS
          echo B13_CINEMA_LEDGER_PRODUCTION_BYTES_STABLE=1

      - name: Install browser QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p /tmp/b13-prod-browser && cd /tmp/b13-prod-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium

      - name: Capture canonical Production desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b13-prod-evidence
          cd /tmp/b13-prod-browser
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs'), path=require('path');
          const base=process.env.URL;
          const surfaces=[
            ['root',base+'/', '.intro .display',1.02,47],
            ['guide',base+'/guide.html','.b13-guide .hero h1',1.03,47],
            ['topics',base+'/topics/','.page-header h1',1.01,42],
            ['records',base+'/records/','.page-header h1',1.01,42]
          ];
          const vps=[{name:'desktop',width:1440,height:1100},{name:'mobile',width:390,height:844}];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const results=[];
            for(const vp of vps){
              const ctx=await browser.newContext({viewport:{width:vp.width,height:vp.height}});
              for(const [name,url,sel,minRatio,maxMobile] of surfaces){
                const p=await ctx.newPage();
                let r=null, ready=false, attempt=0;
                for(attempt=1;attempt<=12;attempt++){
                  r=await p.goto(url,{waitUntil:'networkidle',timeout:45000});
                  await p.evaluate(()=>document.fonts.ready); await p.waitForTimeout(250);
                  ready=await p.evaluate(()=>[...document.styleSheets].some(s=>String(s.href||'').includes('cinema-ledger-v2-type-polish.css')));
                  if(r.status()===200 && ready) break;
                  await p.waitForTimeout(3000);
                }
                const errors=[], failed=[];
                p.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
                p.on('pageerror',e=>errors.push(e.message));
                p.on('response',resp=>{if(resp.status()>=400) failed.push(`${resp.status()} ${resp.url()}`)});
                await p.reload({waitUntil:'networkidle',timeout:45000});
                await p.evaluate(()=>document.fonts.ready); await p.waitForTimeout(250);
                const m=await p.locator(sel).evaluate(h=>{const c=getComputedStyle(h),r=h.getBoundingClientRect();const polishHref=[...document.styleSheets].map(s=>String(s.href||'')).find(x=>x.includes('cinema-ledger-v2-type-polish.css'))||'';return{font:parseFloat(c.fontSize),line:parseFloat(c.lineHeight),ratio:parseFloat(c.lineHeight)/parseFloat(c.fontSize),width:r.width,height:r.height,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,polish:!!polishHref,polishHref,polishHasQuery:polishHref.includes('?')}});
                const status=r?.status()||0;
                const problems=[...(status===200?[]:['status']),...(m.ratio>=minRatio?[]:[`tight ${m.ratio}`]),...(m.overflow<=1?[]:['overflow']),...(m.polish?[]:['missing type polish']),...(!m.polishHasQuery?[]:['query-string polish href']),...(errors.length||failed.length?['runtime']:[]),...(vp.name==='mobile'&&m.font>maxMobile?[`mobile too large ${m.font}`]:[])];
                await p.screenshot({path:path.join('/tmp/b13-prod-evidence',`${vp.name}-${name}.png`),fullPage:false});
                results.push({viewport:vp.name,name,url,status,readinessAttempts:attempt,errors,failed,problems,...m});
                await p.close();
              }
              await ctx.close();
            }
            await browser.close();
            const bad=results.filter(x=>x.problems.length);
            fs.writeFileSync('/tmp/b13-prod-evidence/results.json',JSON.stringify({expectedSha:process.env.EXPECTED_SHA,results,bad},null,2));
            console.log(JSON.stringify({count:results.length,bad},null,2));
            if(bad.length) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Upload canonical Production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b13-production-exact-main-evidence-${{ github.run_number }}
          path: /tmp/b13-prod-evidence
          if-no-files-found: error
          retention-days: 7
