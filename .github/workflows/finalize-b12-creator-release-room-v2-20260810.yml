name: Finalize B12 Creator Release Room V2 20260810
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/finalize-b12-creator-release-room-v2-20260810.yml']
permissions:
  contents: write
  pull-requests: write
jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'design/b12-creator-release-room-v2-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Require recorded browser PASS
        shell: bash
        run: |
          set -euo pipefail
          test -f .b12-final-pass-20260810
          grep -q '^result=success$' .b12-final-pass-20260810
          grep -q 'creator-release-room-v2.css' reference/business-12-creator-mini-media-v1/index.html
          grep -q 'creator-release-room-v2.js' reference/business-12-creator-mini-media-v1/ux.html
      - name: Remove one-off validation evidence from product branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .b12-final-pass-20260810
          rm -f .github/workflows/validate-b12-creator-release-room-v2-20260810.yml
          rm -f .github/workflows/validate-b12-observable-20260810.yml
          rm -f .github/workflows/finalize-b12-creator-release-room-v2-20260810.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(B12): remove one-off visual gates'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Merge only the cleaned validated head
        shell: bash
        run: |
          set -euo pipefail
          gh pr ready 526 --repo "$GITHUB_REPOSITORY" || true
          gh pr merge 526 --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$FINAL_HEAD" --subject 'feat(B12): Creator Release Room V2 (#526)'
      - name: Deploy merged exact main to numbered canonical
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          MAIN_SHA=$(git rev-parse HEAD)
          grep -q 'creator-release-room-v2.css' reference/business-12-creator-mini-media-v1/index.html
          npx --yes wrangler@latest pages deploy reference/business-12-creator-mini-media-v1 --project-name 12-creator-mini-media --branch main --commit-hash "$MAIN_SHA" --commit-message 'B12 Creator Release Room V2 exact main'
          for i in $(seq 1 35); do
            root=$(curl -L -sS --max-time 20 https://12-creator-mini-media.pages.dev/ || true)
            ux=$(curl -L -sS --max-time 20 https://12-creator-mini-media.pages.dev/ux.html || true)
            guide=$(curl -L -sS --max-time 20 https://12-creator-mini-media.pages.dev/guide.html || true)
            if grep -q 'creator-release-room-v2.css' <<<"$root" && grep -q 'creator-release-room-v2.css' <<<"$ux" && grep -q 'creator-release-room-v2.css' <<<"$guide"; then echo B12_CREATOR_RELEASE_PUBLIC_PASS=1; exit 0; fi
            sleep 4
          done
          exit 1
