name: Living Travel CI

on:
  pull_request:
    paths:
      - "apps/living-travel/**"
      - ".github/workflows/living-travel-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/living-travel/**"
      - ".github/workflows/living-travel-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: living-travel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/living-travel

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lt_ci
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: lt_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lt_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      LT_TEST_PG_URL: postgresql://lt_ci@127.0.0.1:5432/lt_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch verified CC0 Busan source assets
        env:
          OUT_DIR: ${{ runner.temp }}/b2-cc0-source-assets
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          out = pathlib.Path(os.environ["OUT_DIR"])
          out.mkdir(parents=True, exist_ok=True)
          files = {
              "gamcheon.jpg": "File:Gamcheon Culture Village.jpg",
              "jagalchi.jpg": "File:Jagalchi Market 02.jpg",
              "gukje.jpg": "File:Gukje Market Busan South Korea 02.jpg",
              "seaside.jpg": "File:Busan's seaside.jpg",
          }
          headers = {
              "User-Agent": "ai-revenue-lab-b2-asset-import/1.0 (GitHub Actions; contact via repository)",
              "Accept": "image/avif,image/webp,image/jpeg,*/*",
          }

          query = urllib.parse.urlencode({
              "action": "query",
              "format": "json",
              "prop": "imageinfo",
              "iiprop": "url|size|sha1",
              "iiurlwidth": "1920",
              "titles": "|".join(files.values()),
          })
          req = urllib.request.Request(
              "https://commons.wikimedia.org/w/api.php?" + query,
              headers=headers,
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)

          info_by_title = {}
          for page in payload["query"]["pages"].values():
              info_by_title[page["title"]] = page["imageinfo"][0]

          def download(url: str) -> bytes:
              for attempt in range(5):
                  try:
                      image_req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(image_req, timeout=60) as response:
                          return response.read()
                  except urllib.error.HTTPError as exc:
                      if exc.code != 429 or attempt == 4:
                          raise
                      time.sleep(4 * (2 ** attempt))
              raise RuntimeError("unreachable")

          manifest = []
          for index, (local_name, title) in enumerate(files.items()):
              info = info_by_title[title]
              asset_url = info.get("thumburl") or info["url"]
              data = download(asset_url)
              (out / local_name).write_bytes(data)
              manifest.append({
                  "local_name": local_name,
                  "commons_title": title,
                  "source_url": info["descriptionurl"],
                  "original_url": info["url"],
                  "download_url": asset_url,
                  "original_width": info["width"],
                  "original_height": info["height"],
                  "download_width": info.get("thumbwidth", info["width"]),
                  "download_height": info.get("thumbheight", info["height"]),
                  "original_sha1": info["sha1"],
                  "download_bytes": len(data),
              })
              if index < len(files) - 1:
                  time.sleep(3)

          (out / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload verified CC0 source assets
        uses: actions/upload-artifact@v4
        with:
          name: b2-cc0-source-assets
          path: ${{ runner.temp }}/b2-cc0-source-assets
          if-no-files-found: error
          retention-days: 1

      - name: Install Korean font for visual QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/living-travel/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run functional test suite
        run: python -m pytest tests -q

      - name: Run static preview test suite
        run: python -m pytest pages-preview/tests -q

      - name: Upload B2 V2 Chromium review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-v2-457-visual-evidence
          path: ${{ runner.temp }}/living-travel-v2-457-*
          if-no-files-found: ignore
          retention-days: 7

      - name: Startup health smoke
        env:
          LT_ENVIRONMENT: testing
          LT_OPERATOR_SECRET: testing-secret-value
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          client = TestClient(app)
          response = client.get("/health")

          assert response.status_code == 200
          assert response.json() == {"status": "ok"}

          print(response.status_code, response.json())
          PY

      - name: Check whitespace in changed range
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            git fetch origin "${{ github.event.pull_request.base.ref }}" --no-tags
            echo "Pull request whitespace check: ${BASE}..${HEAD}"
            git diff --check "${BASE}" "${HEAD}"
          else
            BEFORE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            ZERO="0000000000000000000000000000000000000000"
            if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "${ZERO}" ]; then
              if git rev-parse --verify origin/main >/dev/null 2>&1; then
                BEFORE="$(git rev-parse origin/main)"
                echo "No previous SHA; comparing against origin/main"
              else
                BEFORE="$(git hash-object -t tree /dev/null)"
                echo "No previous SHA and no origin/main; comparing against empty tree"
              fi
            fi
            echo "Push whitespace check: ${BEFORE}..${HEAD}"
            git diff --check "${BEFORE}" "${HEAD}"
          fi
