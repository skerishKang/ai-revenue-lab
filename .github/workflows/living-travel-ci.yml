name: Living Travel CI

on:
  pull_request:
    paths:
      - "apps/living-travel/**"
      - ".github/workflows/living-travel-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/living-travel/**"
      - ".github/workflows/living-travel-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: living-travel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/living-travel

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lt_ci
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: lt_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lt_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      LT_TEST_PG_URL: postgresql://lt_ci@127.0.0.1:5432/lt_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch verified Unsplash Busan source assets
        env:
          OUT_DIR: ${{ runner.temp }}/b2-unsplash-source-assets
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.request

          out = pathlib.Path(os.environ["OUT_DIR"])
          out.mkdir(parents=True, exist_ok=True)
          assets = [
              {
                  "local_name": "gamcheon.jpg",
                  "photo_id": "sA-MiDbdI94",
                  "photographer": "Sung Jin Cho",
                  "profile": "@mbuff",
                  "location": "Gamcheon Culture Village, Busan, South Korea",
                  "source_page": "https://unsplash.com/photos/sA-MiDbdI94",
                  "image_url": "https://images.unsplash.com/photo-1701786551898-bb997c0e9db7?auto=format&fit=crop&fm=jpg&q=88&w=2200",
              },
              {
                  "local_name": "market.jpg",
                  "photo_id": "c43XH-lCqy4",
                  "photographer": "Alicja Podstolska",
                  "profile": "@podstolina",
                  "location": "Busan, South Korea",
                  "source_page": "https://unsplash.com/photos/c43XH-lCqy4",
                  "image_url": "https://images.unsplash.com/photo-1706443256843-121b4646816c?auto=format&fit=crop&fm=jpg&q=88&w=2200",
              },
              {
                  "local_name": "seaside.jpg",
                  "photo_id": "H7FWCMGeqcs",
                  "photographer": "YMA",
                  "profile": "@anhsy",
                  "location": "Huinnyeoul-gil, Yeongdo-gu, Busan, South Korea",
                  "source_page": "https://unsplash.com/photos/H7FWCMGeqcs",
                  "image_url": "https://images.unsplash.com/photo-1723707739016-28da9e81e3d0?auto=format&fit=crop&fm=jpg&q=88&w=2200",
              },
              {
                  "local_name": "beach.jpg",
                  "photo_id": "bYAwT2rgwmk",
                  "photographer": "sehoon ye",
                  "profile": "@_3bread",
                  "location": "Busan, South Korea",
                  "source_page": "https://unsplash.com/photos/bYAwT2rgwmk",
                  "image_url": "https://images.unsplash.com/photo-1650698055751-664bb87c8639?auto=format&fit=crop&fm=jpg&q=88&w=2200",
              },
          ]
          headers = {
              "User-Agent": "ai-revenue-lab-b2-asset-import/1.0",
              "Accept": "image/jpeg,image/*;q=0.8,*/*;q=0.5",
          }
          manifest = []
          for asset in assets:
              request = urllib.request.Request(asset["image_url"], headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = response.read()
                  content_type = response.headers.get("Content-Type", "")
              if not content_type.startswith("image/") or len(data) < 100_000:
                  raise RuntimeError((asset["local_name"], content_type, len(data)))
              (out / asset["local_name"]).write_bytes(data)
              manifest.append({
                  **asset,
                  "license": "Unsplash License",
                  "download_bytes": len(data),
                  "download_sha256": hashlib.sha256(data).hexdigest(),
                  "content_type": content_type,
              })
          (out / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload verified Unsplash source assets
        uses: actions/upload-artifact@v4
        with:
          name: b2-unsplash-source-assets
          path: ${{ runner.temp }}/b2-unsplash-source-assets
          if-no-files-found: error
          retention-days: 1

      - name: Install Korean font for visual QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/living-travel/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run functional test suite
        run: python -m pytest tests -q

      - name: Run static preview test suite
        run: python -m pytest pages-preview/tests -q

      - name: Upload B2 V2 Chromium review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-v2-457-visual-evidence
          path: ${{ runner.temp }}/living-travel-v2-457-*
          if-no-files-found: ignore
          retention-days: 7

      - name: Startup health smoke
        env:
          LT_ENVIRONMENT: testing
          LT_OPERATOR_SECRET: testing-secret-value
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          client = TestClient(app)
          response = client.get("/health")

          assert response.status_code == 200
          assert response.json() == {"status": "ok"}

          print(response.status_code, response.json())
          PY

      - name: Check whitespace in changed range
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            git fetch origin "${{ github.event.pull_request.base.ref }}" --no-tags
            echo "Pull request whitespace check: ${BASE}..${HEAD}"
            git diff --check "${BASE}" "${HEAD}"
          else
            BEFORE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            ZERO="0000000000000000000000000000000000000000"
            if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "${ZERO}" ]; then
              if git rev-parse --verify origin/main >/dev/null 2>&1; then
                BEFORE="$(git rev-parse origin/main)"
                echo "No previous SHA; comparing against origin/main"
              else
                BEFORE="$(git hash-object -t tree /dev/null)"
                echo "No previous SHA and no origin/main; comparing against empty tree"
              fi
            fi
            echo "Push whitespace check: ${BEFORE}..${HEAD}"
            git diff --check "${BEFORE}" "${HEAD}"
          fi
