name: Validate B20 Complete 465
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'reference/business-20-personal-memory-novel-v1/**'
      - '.github/workflows/validate-b20-complete-465.yml'
permissions:
  contents: read
jobs:
  validate:
    if: github.event.pull_request.head.ref == 'feat/b20-personal-memory-novel-complete-465'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static contract
        shell: bash
        run: |
          set -euo pipefail
          python3 reference/business-20-personal-memory-novel-v1/tests/validate_reference.py
          node --check reference/business-20-personal-memory-novel-v1/app.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          base=Path('reference/business-20-personal-memory-novel-v1')
          for name in ('index.html','ux.html','guide.html'):
              HTMLParser().feed((base/name).read_text(encoding='utf-8'))
          index=(base/'index.html').read_text(encoding='utf-8')
          ux=(base/'ux.html').read_text(encoding='utf-8')
          guide=(base/'guide.html').read_text(encoding='utf-8')
          js=(base/'app.js').read_text(encoding='utf-8')
          for marker in ('Memory Manuscript','data-state-target="cover"','data-state-target="source"','data-state-target="draft"','data-state-target="proof"','AUTHORIAL CONTROL','SYNTHETIC'):
              assert marker in index, marker
          for marker in ('id="opening"','id="choice"','id="draft"','id="review"','data-path="rain"','data-path="tea"','id="inspect"','id="keep"','id="discard"','id="finish"','window.onpopstate'):
              assert marker in ux, marker
          for marker in ('GUIDE · 30 SECONDS','01 · SOURCE','02 · PATH','03 · DRAFT','04 · COMPARE','05 · AUTHOR','./ux.html#opening'):
              assert marker in guide, marker
          assert './guide.html' in js and 'dataset.firstUseGuide' in js
          for forbidden in ('fetch(', 'XMLHttpRequest', 'localStorage', 'document.cookie', 'serviceWorker'):
              assert forbidden not in ux+'\n'+guide+'\n'+js, forbidden
          for html in ('index.html','guide.html'):
              text=(base/html).read_text(encoding='utf-8')
              for rel in re.findall(r'(?:href|src)="(\./[^"?#]+)', text):
                  assert (base/rel[2:]).exists(), (html,rel)
          print('B20_STATIC_CONTRACT_PASS=1')
          PY
          git diff --check origin/main...HEAD -- 'reference/business-20-personal-memory-novel-v1/**'
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b20-browser && cd /tmp/b20-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.54.1
          npx playwright install chromium
      - name: Browser journey desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4178 --directory reference/business-20-personal-memory-novel-v1 >/tmp/b20-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4178/index.html >/dev/null && break; sleep 0.5; done
          cd /tmp/b20-browser
          node <<'JS'
          const { chromium } = require('playwright');
          async function assertNoOverflow(page,label){
            const diag=await page.evaluate(()=>{const de=document.documentElement,vw=de.clientWidth;const offenders=[...document.querySelectorAll('body *')].map(el=>{const r=el.getBoundingClientRect(),cs=getComputedStyle(el);return{tag:el.tagName,id:el.id||'',cls:typeof el.className==='string'?el.className:'',left:+r.left.toFixed(1),right:+r.right.toFixed(1),width:+r.width.toFixed(1),display:cs.display,text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,60)}}).filter(x=>x.display!=='none'&&(x.right>vw+1||x.left<-1)).slice(0,15);return{scrollWidth:de.scrollWidth,clientWidth:vw,offenders}});if(diag.scrollWidth>diag.clientWidth){console.error(`OVERFLOW_DIAG ${label} ${JSON.stringify(diag)}`);throw new Error(`${label}: overflow ${diag.scrollWidth}>${diag.clientWidth}`)}}
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const vp of [{width:1440,height:1100,name:'desktop'},{width:390,height:844,name:'mobile'}]){
              const page=await browser.newPage({viewport:{width:vp.width,height:vp.height}});
              const errors=[]; page.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`)}); page.on('pageerror',e=>errors.push(`page:${e.message}`));
              await page.goto('http://127.0.0.1:4178/index.html',{waitUntil:'networkidle'});
              await page.locator('[data-first-use-guide]').waitFor({state:'visible'});
              await assertNoOverflow(page,`${vp.name}: root`);
              await page.locator('[data-first-use-guide]').click();
              await page.waitForURL(/guide\.html/); await assertNoOverflow(page,`${vp.name}: guide`);
              await page.getByRole('link',{name:'서사 실험 시작'}).click();
              await page.waitForURL(/ux\.html#opening/);
              await page.getByRole('button',{name:'서사 방향 고르기'}).click();
              await page.locator('[data-path="rain"]').click();
              const draftTitle=await page.locator('#draftTitle').textContent();
              if(!draftTitle || !draftTitle.includes('비가 먼저')) throw new Error(`${vp.name}: rain draft missing`);
              await page.locator('#inspect').click();
              if(await page.locator('#compare').isHidden()) throw new Error(`${vp.name}: source comparison not visible`);
              await page.getByRole('button',{name:'이 초안 검토하기'}).click();
              await page.locator('#keep').click();
              let status=await page.locator('#reviewStatus').textContent();
              if(!status || !status.includes('세션에서 남겼습니다')) throw new Error(`${vp.name}: keep status missing`);
              await page.locator('#finish').click();
              status=await page.locator('#reviewStatus').textContent();
              if(!status || !status.includes('검토를 완료')) throw new Error(`${vp.name}: finish status missing`);
              await assertNoOverflow(page,`${vp.name}: ux`);
              if(errors.length) throw new Error(`${vp.name}: ${errors.join(' | ')}`);
              await page.close();
            }
            await browser.close(); console.log('B20_BROWSER_JOURNEY_PASS=1');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
