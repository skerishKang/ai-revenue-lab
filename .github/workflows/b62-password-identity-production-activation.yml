name: B62 Password Identity Production Activation

on:
  pull_request:
    paths:
      - ".github/workflows/b62-password-identity-production-activation.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/b62-password-identity-production-activation.yml"

permissions:
  contents: read

concurrency:
  group: b62-password-identity-production-activation
  cancel-in-progress: false

env:
  IDENTITY_WORKER: padiem-control-plane-identity
  B62_WORKER: padiem-chat
  IDENTITY_CONFIG: wrangler.identity-authority.jsonc

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate password identity Production source contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          durable = Path("packages/padiem-control-plane/identity_authority_durable.py").read_text(encoding="utf-8")
          worker = Path("packages/padiem-control-plane/identity_authority_worker.py").read_text(encoding="utf-8")
          config = Path("packages/padiem-control-plane/wrangler.identity-authority.jsonc").read_text(encoding="utf-8")
          bridge = Path("apps/padiem-chat/app/control_plane_identity.py").read_text(encoding="utf-8")
          routes = Path("apps/padiem-chat/app/auth_routes.py").read_text(encoding="utf-8")

          assert '_ALLOWED_PROVIDERS = frozenset({"google", "password"})' in durable
          assert 'if self.provider not in {"google", "password"}' in bridge
          assert 'ensure_personal_tenant=True' in routes
          assert 'resolve_active_memberships' in worker
          assert 'create_tenant' in worker
          assert 'assign_tenant_membership' in worker
          assert '"workers_dev": false' in config
          assert '"preview_urls": false' in config
          assert 'PUBLIC_FETCH = False' in worker
          assert 'PRODUCTION_ROUTE_CONFIGURED = False' in worker
          assert 'pywrangler deploy' in Path(".github/workflows/b62-password-identity-production-activation.yml").read_text(encoding="utf-8")

          print("PASSWORD_PROVIDER_SOURCE=PASS")
          print("PERSONAL_TENANT_SOURCE=PASS")
          print("IDENTITY_WORKER_PRIVATE_SOURCE=PASS")
          print("PRODUCTION_MUTATION=0")
          PY

  deploy-private-identity:
    needs: source-contract
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      IDENTITY_LOOKUP_KEY: ${{ secrets.CONTROL_PLANE_IDENTITY_LOOKUP_KEY }}
      CONNECT_TICKET_KEY: ${{ secrets.GOOGLE_CONNECT_TICKET_KEY }}
    steps:
      - name: Checkout exact merged main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact current main and bounded Production secret shape
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${IDENTITY_LOOKUP_KEY}"
          test -n "${CONNECT_TICKET_KEY}"

          python - <<'PY'
          import base64, os

          for name in ("IDENTITY_LOOKUP_KEY", "CONNECT_TICKET_KEY"):
              value = os.environ[name]
              padding = "=" * (-len(value) % 4)
              raw = base64.urlsafe_b64decode(value + padding)
              if len(raw) != 32:
                  raise SystemExit(f"{name} must decode to 32 bytes")
          print("IDENTITY_PRODUCTION_SECRET_SHAPE=PASS")
          print("SECRET_VALUE_OUTPUT=0")
          PY
          echo "IDENTITY_EXACT_CURRENT_MAIN=PASS"

      - name: Read-only preflight and record rollback anchor
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${IDENTITY_WORKER}"

          settings="${RUNNER_TEMP}/identity-settings-before.json"
          deployments="${RUNNER_TEMP}/identity-deployments-before.json"
          subdomain="${RUNNER_TEMP}/identity-subdomain-before.json"
          domains="${RUNNER_TEMP}/worker-domains-before.json"
          b62="${RUNNER_TEMP}/b62-settings-before.json"

          curl -fsS "${auth[@]}" "${api}/settings" -o "${settings}"
          curl -fsS "${auth[@]}" "${api}/deployments" -o "${deployments}"
          curl -fsS "${auth[@]}" "${api}/subdomain" -o "${subdomain}"
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" -o "${domains}"
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" -o "${b62}"

          jq -e '.success == true and (.result.bindings | type == "array")' "${settings}" >/dev/null
          jq -e '.success == true and (.result.deployments | length) > 0 and (.result.deployments[0].versions | length) == 1 and .result.deployments[0].versions[0].percentage == 100' "${deployments}" >/dev/null
          jq -e '.success == true and .result.enabled == false and .result.previews_enabled == false' "${subdomain}" >/dev/null
          jq -e --arg worker "${IDENTITY_WORKER}" '[.result[] | select(.service == $worker)] | length == 0' "${domains}" >/dev/null
          jq -e '.result.bindings | any(.name == "CONTROL_PLANE_IDENTITY_LOOKUP_KEY" and .type == "secret_text")' "${settings}" >/dev/null
          jq -e '.result.bindings | any(.name == "GOOGLE_CONNECT_TICKET_KEY" and .type == "secret_text")' "${settings}" >/dev/null
          jq -e '.result.bindings | any(.name == "CONTROL_PLANE_IDENTITY")' "${settings}" >/dev/null
          jq -e '.result.bindings | any(.name == "CONTROL_PLANE_ALLOWED_PRODUCT" and .type == "plain_text" and .text == "b62")' "${settings}" >/dev/null
          jq -e --arg identity "${IDENTITY_WORKER}" '[.result.bindings[] | select(.name == "IDENTITY_AUTHORITY_SERVICE" and .type == "service" and .service == $identity)] | length == 1' "${b62}" >/dev/null

          previous="$(jq -r '.result.deployments[0].versions[0].version_id' "${deployments}")"
          test -n "${previous}" && test "${previous}" != "null"
          echo "PREVIOUS_IDENTITY_VERSION=${previous}" >> "${GITHUB_ENV}"

          jq '[.result.bindings[] | {name,type}] | sort_by(.name)' "${settings}" > "${RUNNER_TEMP}/identity-binding-shape-before.json"
          echo "IDENTITY_PRIVATE_PRESTATE=PASS"
          echo "B62_IDENTITY_SERVICE_BINDING_PRESTATE=PASS"
          echo "PRODUCTION_MUTATION=0"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.5"

      - name: Deploy exact-main identity authority source
        working-directory: packages/padiem-control-plane
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"

          secret_file="${RUNNER_TEMP}/identity-production-secrets.env"
          temp_config="wrangler.jsonc"
          trap 'rm -f "${secret_file}" "${temp_config}"' EXIT

          printf 'CONTROL_PLANE_IDENTITY_LOOKUP_KEY=%s\nGOOGLE_CONNECT_TICKET_KEY=%s\n'             "${IDENTITY_LOOKUP_KEY}" "${CONNECT_TICKET_KEY}" > "${secret_file}"
          chmod 600 "${secret_file}"
          cp "${IDENTITY_CONFIG}" "${temp_config}"

          uvx --from 'workers-py>=1.17.1,<2' pywrangler deploy             --secrets-file "${secret_file}"             --strict             --tag "git-${GITHUB_SHA}"             --message "B62 password identity authority ${GITHUB_SHA}"

          rm -f "${temp_config}"
          echo "IDENTITY_WORKER_DEPLOY=SUCCESS"
          echo "PRODUCTION_MUTATION=1"

      - name: Read back private topology, bindings, and active version
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${IDENTITY_WORKER}"

          ready=no
          active=""
          for _ in $(seq 1 30); do
            deployments="${RUNNER_TEMP}/identity-deployments-after.json"
            curl -fsS "${auth[@]}" "${api}/deployments" -o "${deployments}"
            active="$(jq -r '.result.deployments[0].versions[0].version_id // empty' "${deployments}")"
            if [ -n "${active}" ] && [ "${active}" != "${PREVIOUS_IDENTITY_VERSION}" ] &&                jq -e '.result.deployments[0].versions | length == 1 and .[0].percentage == 100' "${deployments}" >/dev/null 2>&1; then
              ready=yes
              break
            fi
            sleep 2
          done
          test "${ready}" = yes

          settings="${RUNNER_TEMP}/identity-settings-after.json"
          subdomain="${RUNNER_TEMP}/identity-subdomain-after.json"
          domains="${RUNNER_TEMP}/worker-domains-after.json"
          b62="${RUNNER_TEMP}/b62-settings-after.json"

          curl -fsS "${auth[@]}" "${api}/settings" -o "${settings}"
          curl -fsS "${auth[@]}" "${api}/subdomain" -o "${subdomain}"
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" -o "${domains}"
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" -o "${b62}"

          jq -e '.success == true and .result.enabled == false and .result.previews_enabled == false' "${subdomain}" >/dev/null
          jq -e --arg worker "${IDENTITY_WORKER}" '[.result[] | select(.service == $worker)] | length == 0' "${domains}" >/dev/null
          jq '[.result.bindings[] | {name,type}] | sort_by(.name)' "${settings}" > "${RUNNER_TEMP}/identity-binding-shape-after.json"
          cmp -s "${RUNNER_TEMP}/identity-binding-shape-before.json" "${RUNNER_TEMP}/identity-binding-shape-after.json"
          jq -e --arg identity "${IDENTITY_WORKER}" '[.result.bindings[] | select(.name == "IDENTITY_AUTHORITY_SERVICE" and .type == "service" and .service == $identity)] | length == 1' "${b62}" >/dev/null

          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"

          echo "IDENTITY_ACTIVE_VERSION_CHANGED=PASS"
          echo "IDENTITY_BINDING_SHAPE_PRESERVED=PASS"
          echo "IDENTITY_WORKER_PRIVATE=PASS"
          echo "B62_IDENTITY_SERVICE_BINDING_PRESERVED=PASS"
          echo "SECRET_VALUE_OUTPUT=0"

      - name: Auto-rollback identity version on any failed post-deploy step
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PREVIOUS_IDENTITY_VERSION:-}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${IDENTITY_WORKER}"
          state="${RUNNER_TEMP}/identity-rollback-precheck.json"
          curl -fsS "${auth[@]}" "${api}/deployments" -o "${state}"
          active="$(jq -r '.result.deployments[0].versions[0].version_id // empty' "${state}")"
          if [ "${active}" = "${PREVIOUS_IDENTITY_VERSION}" ]; then
            echo "IDENTITY_ROLLBACK_NOT_REQUIRED=YES"
            exit 0
          fi
          curl -fsS "${auth[@]}" -X POST "${api}/deployments"             -d "{\"version_id\": \"${PREVIOUS_IDENTITY_VERSION}\", \"percentage\": 100}"             -o "${RUNNER_TEMP}/identity-auto-rollback.json"
          for _ in $(seq 1 12); do
            curl -fsS "${auth[@]}" "${api}/deployments" -o "${state}"
            active="$(jq -r '.result.deployments[0].versions[0].version_id // empty' "${state}")"
            if [ "${active}" = "${PREVIOUS_IDENTITY_VERSION}" ]; then break; fi
            sleep 5
          done
          test "${active}" = "${PREVIOUS_IDENTITY_VERSION}"
          echo "IDENTITY_AUTO_ROLLBACK=EXECUTED"

      - name: Publish bounded activation evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## B62 password identity Production activation"
            echo
            echo "- exact main: `${GITHUB_SHA}`"
            echo "- previous identity version recorded: yes"
            echo "- identity Worker remains private: enforced"
            echo "- B62 identity service binding mutation: no"
            echo "- secret values output: never"
            echo "- auto-rollback armed: yes"
          } >> "${GITHUB_STEP_SUMMARY}"
