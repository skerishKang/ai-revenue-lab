name: B60 Signup Benefits Visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'reference/business-60-ai-api-v1/**'
      - '.github/workflows/b60-signup-benefits-visual-qa.yml'

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$expected" = "$actual"

      - name: Prepare Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Render live and signup surfaces
        shell: bash
        run: |
          set -euo pipefail
          cd reference/business-60-ai-api-v1
          python3 -m http.server 4173 >/tmp/b60-signup-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"

          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=8000 --window-size=1440,2100 \
            --screenshot="$GITHUB_WORKSPACE/b60-signup-top-desktop.png" \
            http://127.0.0.1:4173/

          cat >> product-v13-editorial-radar-polish.css <<'EOF'
          .radar-masthead,
          .radar-rule,
          .radar-lead,
          .radar-dropped,
          .radar-expiring { display: none !important; }
          .radar-signups { padding-top: 22px !important; }
          EOF

          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=10000 --window-size=1440,1650 \
            --screenshot="$GITHUB_WORKSPACE/b60-signup-desktop.png" \
            http://127.0.0.1:4173/

          # Warm a mobile paint first; some hosted Chrome runs defer large WebP decode until the first mobile paint.
          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --force-device-scale-factor=1 --virtual-time-budget=10000 --window-size=390,3000 \
            --screenshot="$GITHUB_WORKSPACE/b60-signup-mobile-warm.png" \
            http://127.0.0.1:4173/

          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --force-device-scale-factor=1 --virtual-time-budget=15000 --window-size=390,3000 \
            --screenshot="$GITHUB_WORKSPACE/b60-signup-mobile.png" \
            http://127.0.0.1:4173/

          "$browser" --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=6000 --dump-dom http://127.0.0.1:4173/ \
            > "$GITHUB_WORKSPACE/b60-signup-dom.html"

          grep -q 'Ox Alpha' "$GITHUB_WORKSPACE/b60-signup-dom.html"
          grep -q 'MiniMax' "$GITHUB_WORKSPACE/b60-signup-dom.html"
          grep -q 'Fireworks AI' "$GITHUB_WORKSPACE/b60-signup-dom.html"
          grep -q '\$100 + up to \$100' "$GITHUB_WORKSPACE/b60-signup-dom.html"
          grep -q '가입해야 받는 혜택' "$GITHUB_WORKSPACE/b60-signup-dom.html"
          grep -q '신규 고객 전용' "$GITHUB_WORKSPACE/b60-signup-dom.html"
          grep -q '지금 가장 핫함' "$GITHUB_WORKSPACE/b60-signup-dom.html"
          grep -q '방금 뜬 무료' "$GITHUB_WORKSPACE/b60-signup-dom.html"
          grep -q '수동 큐레이션' "$GITHUB_WORKSPACE/b60-signup-dom.html"
          test -s "$GITHUB_WORKSPACE/b60-signup-top-desktop.png"
          test -s "$GITHUB_WORKSPACE/b60-signup-desktop.png"
          test -s "$GITHUB_WORKSPACE/b60-signup-mobile.png"

      - name: Upload rendered evidence
        uses: actions/upload-artifact@v4
        with:
          name: b60-signup-benefits-visual-evidence
          path: |
            b60-signup-top-desktop.png
            b60-signup-desktop.png
            b60-signup-mobile.png
            b60-signup-dom.html
          retention-days: 7
          if-no-files-found: error
