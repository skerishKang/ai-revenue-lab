name: B20 Korean Manuscript Rhythm QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'reference/business-20-personal-memory-novel-v1/**'
      - '.github/workflows/b20-korean-manuscript-rhythm-qa-20260811.yml'

permissions: {contents: read}

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Diff hygiene
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          grep -q 'manuscript-studio-v2-type-polish.css' reference/business-20-personal-memory-novel-v1/index.html
          grep -q 'manuscript-studio-v2-type-polish.css' reference/business-20-personal-memory-novel-v1/guide.html
          test -z "$(git diff --name-only origin/main...HEAD -- reference/business-20-personal-memory-novel-v1/ux.html)"
          if git diff origin/main...HEAD | grep -q 'OWNER_UI_APPROVED=true'; then exit 1; fi
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve B20
        run: |
          python3 -m http.server 4173 --directory reference/business-20-personal-memory-novel-v1 >/tmp/b20-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/b20-http.log; exit 1
      - name: Visual and author-path QA
        run: |
          mkdir -p /tmp/b20-evidence
          cat > /tmp/b20-qa.cjs <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright'); const fs=require('fs');
          const base='http://127.0.0.1:4173', surfaces=[['root','/index.html'],['ux','/ux.html'],['guide','/guide.html']], viewports={desktop:{width:1440,height:1100},mobile:{width:390,height:844}}, failures=[],results=[];
          (async()=>{const browser=await chromium.launch({headless:true});
            for(const [mode,viewport] of Object.entries(viewports)){const context=await browser.newContext({viewport,deviceScaleFactor:1});
              for(const [name,path] of surfaces){const page=await context.newPage(),errors=[]; page.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`)}); page.on('pageerror',e=>errors.push(`page:${e.message}`)); page.on('requestfailed',r=>errors.push(`request:${r.url()} ${r.failure()?.errorText||''}`)); const response=await page.goto(base+path,{waitUntil:'networkidle'}); if(!response||!response.ok())failures.push(`${mode}/${name}: bad HTTP`);
                const m=await page.evaluate(()=>{const root=document.documentElement,body=document.body,h1=document.querySelector('h1'),top=document.querySelector('.ms-topbar'),hs=h1?getComputedStyle(h1):null,hr=h1?.getBoundingClientRect(),tr=top?.getBoundingClientRect(); const f=hs?parseFloat(hs.fontSize):NaN,l=hs?parseFloat(hs.lineHeight):NaN,s=document.querySelector('.ms-source')?.getBoundingClientRect(),c=document.querySelector('.ms-canvas')?.getBoundingClientRect(),a=document.querySelector('.ms-author')?.getBoundingClientRect(); return {viewportWidth:innerWidth,viewportHeight:innerHeight,overflowX:Math.max(root.scrollWidth,body.scrollWidth)-innerWidth,pageHeight:root.scrollHeight,h1Text:h1?.innerText||'',h1Font:f,h1Line:l,h1Ratio:Number.isFinite(f)&&f>0&&Number.isFinite(l)?l/f:null,h1Top:hr?.top??null,h1Bottom:hr?.bottom??null,topbarBottom:tr?.bottom??null,sourceTop:s?.top??null,canvasTop:c?.top??null,authorTop:a?.top??null};});
                if(m.overflowX>1)failures.push(`${mode}/${name}: overflow ${m.overflowX}`); if(errors.length)failures.push(`${mode}/${name}: ${errors.join(' | ')}`); if(m.h1Top!==null&&m.topbarBottom!==null&&m.h1Top<m.topbarBottom-2)failures.push(`${mode}/${name}: H1 intersects chrome`); if(/[가-힣]/.test(m.h1Text)&&m.h1Ratio!==null&&m.h1Ratio<1.0)failures.push(`${mode}/${name}: Korean H1 ratio ${m.h1Ratio}`); if((name==='root'||name==='guide')&&m.h1Ratio!==null&&m.h1Ratio<1.04)failures.push(`${mode}/${name}: polished H1 ratio ${m.h1Ratio} < 1.04`); if(mode==='mobile'&&name==='ux'&&!(m.sourceTop<m.canvasTop&&m.canvasTop<m.authorTop))failures.push('mobile/ux: SOURCE → POV/DRAFT → AUTHOR order mismatch'); await page.screenshot({path:`/tmp/b20-evidence/${mode}-${name}.png`}); await page.screenshot({path:`/tmp/b20-evidence/${mode}-${name}-full.png`,fullPage:true}); results.push({mode,name,metrics:m,errors}); await page.close();}
              for(const [pathName,choice,decision] of [['rain-keep','rain','keep'],['tea-discard','tea','discard']]){const page=await context.newPage(); await page.goto(base+'/ux.html',{waitUntil:'networkidle'}); await page.locator(`[data-path="${choice}"]`).click(); if(!(await page.locator('#draft').evaluate(el=>el.classList.contains('active'))))failures.push(`${mode}/${pathName}: draft not active`); await page.locator('#inspect').click(); if(await page.locator('#compare').isHidden())failures.push(`${mode}/${pathName}: compare hidden`); await page.locator('#draft [data-go="review"]').click(); await page.locator(`#${decision}`).click(); if(await page.locator('#finish').isDisabled())failures.push(`${mode}/${pathName}: finish locked`); await page.locator('#finish').click(); const status=await page.locator('#authorStatus').innerText(); if(choice==='rain'&&!status.includes('세션 원고'))failures.push(`${mode}/${pathName}: keep mismatch`); if(choice==='tea'&&!status.includes('원 기억만 유지'))failures.push(`${mode}/${pathName}: discard mismatch`); await page.screenshot({path:`/tmp/b20-evidence/${mode}-ux-${pathName}-full.png`,fullPage:true}); await page.reload({waitUntil:'networkidle'}); if(!(await page.locator('#finish').isDisabled()))failures.push(`${mode}/${pathName}: reload did not reset`); await page.close();}
              await context.close();}
            await browser.close(); fs.writeFileSync('/tmp/b20-evidence/metrics.json',JSON.stringify({results,failures},null,2)); console.log(JSON.stringify({results,failures},null,2)); if(failures.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/b20-qa.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b20-korean-manuscript-rhythm-evidence-${{ github.run_attempt }}
          path: /tmp/b20-evidence
          if-no-files-found: error
          retention-days: 7
