name: B62 Project Delete Bounded Patch

on:
  push:
    branches:
      - feat/b62-project-delete-1060
    paths:
      - .github/workflows/b62-project-delete-bounded-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/b62-project-delete-1060
          fetch-depth: 0
      - name: Apply exact bounded patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {text.count(old)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "apps/padiem-chat/app/history.py",
              "    async def update_project(self, user_id: str, project_id: str, name: str, instructions: str) -> ProjectProfile | None: ...\n    async def list_project_conversations",
              "    async def update_project(self, user_id: str, project_id: str, name: str, instructions: str) -> ProjectProfile | None: ...\n    async def delete_project(self, user_id: str, project_id: str) -> bool: ...\n    async def list_project_conversations",
          )
          replace_once(
              "apps/padiem-chat/app/history.py",
              "        return ProjectProfile(project_id, clean_name, clean_instructions, current.created_at, now)\n\n    async def append_exchange",
              "        return ProjectProfile(project_id, clean_name, clean_instructions, current.created_at, now)\n\n    async def delete_project(self, user_id: str, project_id: str) -> bool:\n        current = await self.get_project(user_id, project_id)\n        if current is None:\n            return False\n        await self._run(\n            \"DELETE FROM projects WHERE id=? AND user_id=?\",\n            project_id, user_id,\n        )\n        return True\n\n    async def append_exchange",
          )

          replace_once(
              "apps/padiem-chat/app/project_routes.py",
              "    store: HistoryStore = request.app.state.history_store\n\n    if request.method == \"GET\":",
              "    store: HistoryStore = request.app.state.history_store\n\n    if request.method == \"DELETE\":\n        try:\n            project = await store.get_project(uid, project_id)\n            if project is None:\n                return _not_found()\n            file_store = request.app.state.project_file_store\n            if file_store is None:\n                return _unavailable()\n            files = await file_store.list_files(uid, project_id)\n            if files:\n                return JSONResponse(\n                    {\"error\": {\"code\": \"project_has_files\", \"message\": \"프로젝트 파일을 먼저 삭제해 주세요.\"}},\n                    status_code=409,\n                )\n            deleted = await store.delete_project(uid, project_id)\n        except Exception:\n            return _unavailable()\n        if not deleted:\n            return _not_found()\n        return JSONResponse({\"deleted\": True, \"project_id\": project_id})\n\n    if request.method == \"GET\":",
          )

          replace_once(
              "apps/padiem-chat/app/main.py",
              'Route("/api/projects/{project_id}", project_detail, methods=["GET", "PATCH"]),',
              'Route("/api/projects/{project_id}", project_detail, methods=["GET", "PATCH", "DELETE"]),',
          )

          replace_once(
              "apps/padiem-chat/static/app.js",
              '  const projectSaveButton = document.getElementById("projectSaveButton");\n  const projectFilesPanel',
              '  const projectSaveButton = document.getElementById("projectSaveButton");\n  const projectFormActions = projectForm.querySelector(".project-form-actions");\n  const projectDeleteButton = document.createElement("button");\n  projectDeleteButton.id = "projectDeleteButton";\n  projectDeleteButton.type = "button";\n  projectDeleteButton.className = "project-danger";\n  projectDeleteButton.textContent = "프로젝트 삭제";\n  projectDeleteButton.hidden = true;\n  projectDeleteButton.setAttribute("aria-label", "현재 프로젝트 삭제");\n  projectFormActions.prepend(projectDeleteButton);\n  const projectFilesPanel',
          )
          replace_once(
              "apps/padiem-chat/static/app.js",
              '    projectSaveButton.disabled = false;\n    projectFilesPanel.hidden = !(project && authState.project_files_ready);',
              '    projectSaveButton.disabled = false;\n    projectDeleteButton.hidden = !project;\n    projectDeleteButton.disabled = false;\n    projectFilesPanel.hidden = !(project && authState.project_files_ready);',
          )
          replace_once(
              "apps/padiem-chat/static/app.js",
              '  }\n\n  function applyAuthState(data) {',
              '''  }\n\n  async function deleteProject() {\n    if (!editingProjectId || !projectsReady || !authState.authenticated || inFlight) return;\n    const project = projectById(editingProjectId);\n    if (!project) return;\n    const confirmed = window.confirm(\n      `‘${project.name}’ 프로젝트를 삭제할까요?\\n프로젝트의 대화는 남지만 프로젝트 연결은 해제됩니다. 삭제한 프로젝트는 되돌릴 수 없습니다.`\n    );\n    if (!confirmed) return;\n    const deletingId = editingProjectId;\n    const deletingActiveProject = Boolean(activeProject && activeProject.id === deletingId);\n    projectDeleteButton.disabled = true;\n    projectSaveButton.disabled = true;\n    projectFormError.hidden = true;\n    try {\n      const response = await fetch(`/api/projects/${encodeURIComponent(deletingId)}`, {\n        method: "DELETE",\n        headers: { "Accept": "application/json" },\n        cache: "no-store",\n      });\n      const data = await response.json().catch(() => null);\n      if (!response.ok || !data || data.deleted !== true || data.project_id !== deletingId) {\n        const message = data && data.error && typeof data.error.message === "string"\n          ? data.error.message\n          : "프로젝트를 삭제하지 못했습니다.";\n        throw new Error(message);\n      }\n      projects = projects.filter((item) => item.id !== deletingId);\n      if (deletingActiveProject) {\n        activeProject = null;\n        activeProjectFileCount = 0;\n      }\n      renderProjects();\n      renderProjectState();\n      closeProjectDialog();\n      await loadProjects();\n      if (deletingActiveProject) {\n        renderProjectState();\n        setNote(DEFAULT_NOTE);\n      }\n      input.focus();\n    } catch (error) {\n      projectFormError.textContent = error instanceof Error ? error.message : "프로젝트를 삭제하지 못했습니다.";\n      projectFormError.hidden = false;\n      projectDeleteButton.disabled = false;\n      projectSaveButton.disabled = false;\n    }\n  }\n\n  function applyAuthState(data) {''',
          )
          replace_once(
              "apps/padiem-chat/static/app.js",
              '  projectForm.addEventListener("submit", saveProject);\n  projectFileInput.addEventListener',
              '  projectForm.addEventListener("submit", saveProject);\n  projectDeleteButton.addEventListener("click", deleteProject);\n  projectFileInput.addEventListener',
          )

          replace_once(
              "apps/padiem-chat/static/projects.css",
              ".project-primary {\n  border: 1px solid #18181b;\n  background: #18181b;\n  color: #fff;\n}\n",
              ".project-primary {\n  border: 1px solid #18181b;\n  background: #18181b;\n  color: #fff;\n}\n\n.project-danger {\n  margin-right: auto;\n  min-height: 44px;\n  border: 1px solid rgba(179, 38, 30, 0.25);\n  background: #fff;\n  color: #b3261e;\n}\n",
          )

          replace_once(
              "apps/padiem-chat/tests/test_projects.py",
              "    async def update_project(self, user_id, project_id, name, instructions):\n        row = self.projects.get(project_id)\n        if not row or row[\"user_id\"] != user_id:\n            return None\n        name, instructions = validate_project_fields(name, instructions)\n        current = row[\"profile\"]\n        updated = ProjectProfile(project_id, name, instructions, current.created_at, self._now())\n        row[\"profile\"] = updated\n        return updated\n\n    async def list_conversations",
              "    async def update_project(self, user_id, project_id, name, instructions):\n        row = self.projects.get(project_id)\n        if not row or row[\"user_id\"] != user_id:\n            return None\n        name, instructions = validate_project_fields(name, instructions)\n        current = row[\"profile\"]\n        updated = ProjectProfile(project_id, name, instructions, current.created_at, self._now())\n        row[\"profile\"] = updated\n        return updated\n\n    async def delete_project(self, user_id, project_id):\n        row = self.projects.get(project_id)\n        if not row or row[\"user_id\"] != user_id:\n            return False\n        del self.projects[project_id]\n        for conversation in self.conversations.values():\n            if conversation[\"user_id\"] == user_id and conversation[\"project_id\"] == project_id:\n                conversation[\"project_id\"] = None\n        return True\n\n    async def list_conversations",
          )
          replace_once(
              "apps/padiem-chat/tests/test_projects.py",
              "\n\nasync def client_with_session(app, app_settings, user: UserProfile):",
              '''\n\nclass MemoryProjectFileStore:\n    def __init__(self):\n        self.files = {}\n\n    async def list_files(self, user_id, project_id):\n        return list(self.files.get((user_id, project_id), []))\n\n\nasync def client_with_session(app, app_settings, user: UserProfile):''',
          )
          replace_once(
              "apps/padiem-chat/tests/test_projects.py",
              "\n\n@pytest.mark.asyncio\nasync def test_new_project_chat_persists_project_and_injects_one_system_message():",
              '''\n\n@pytest.mark.asyncio\nasync def test_project_delete_is_owner_scoped_file_safe_and_preserves_conversations():\n    store = MemoryProjectStore()\n    file_store = MemoryProjectFileStore()\n    owner = await store.add_user("owner-delete")\n    other = await store.add_user("other-delete")\n    blocked = await store.create_project(owner.id, "자료 있음", "")\n    removable = await store.create_project(owner.id, "삭제 가능", "")\n    foreign = await store.create_project(other.id, "다른 사용자", "")\n    cid = await store.append_exchange(owner.id, None, "남겨 둘 질문", "남겨 둘 답", project_id=removable.id)\n    file_store.files[(owner.id, blocked.id)] = [object()]\n    cfg = settings()\n    app = create_app(cfg, history_store=store, project_file_store=file_store)\n    owner_client = await client_with_session(app, cfg, owner)\n    try:\n        malformed = await owner_client.delete("/api/projects/not-a-project")\n        foreign_result = await owner_client.delete(f"/api/projects/{foreign.id}")\n        blocked_result = await owner_client.delete(f"/api/projects/{blocked.id}")\n        deleted = await owner_client.delete(f"/api/projects/{removable.id}")\n    finally:\n        await owner_client.aclose()\n\n    assert malformed.status_code == 404\n    assert foreign_result.status_code == 404\n    assert blocked_result.status_code == 409\n    assert blocked_result.json()["error"]["code"] == "project_has_files"\n    assert await store.get_project(owner.id, blocked.id) is not None\n    assert deleted.status_code == 200\n    assert deleted.json() == {"deleted": True, "project_id": removable.id}\n    assert await store.get_project(owner.id, removable.id) is None\n    assert store.conversations[cid]["project_id"] is None\n\n\n@pytest.mark.asyncio\nasync def test_new_project_chat_persists_project_and_injects_one_system_message():''',
          )
          replace_once(
              "apps/padiem-chat/tests/test_projects.py",
              '    assert \'exitProjectButton.addEventListener("click", exitProject)\' in js\n',
              '    assert \'exitProjectButton.addEventListener("click", exitProject)\' in js\n    assert \'projectDeleteButton.addEventListener("click", deleteProject)\' in js\n    assert \'method: "DELETE"\' in js\n',
          )

      - name: Quick syntax and focused tests
        run: |
          python -m compileall -q apps/padiem-chat/app apps/padiem-chat/tests/test_projects.py
          node --check apps/padiem-chat/static/app.js
      - name: Remove one-shot workflow and commit patch
        run: |
          rm .github/workflows/b62-project-delete-bounded-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/padiem-chat/app/history.py apps/padiem-chat/app/project_routes.py apps/padiem-chat/app/main.py apps/padiem-chat/static/app.js apps/padiem-chat/static/projects.css apps/padiem-chat/tests/test_projects.py .github/workflows/b62-project-delete-bounded-patch.yml
          git commit -m "feat(b62): add file-safe Project deletion (#1060)"
          git push origin HEAD:feat/b62-project-delete-1060
