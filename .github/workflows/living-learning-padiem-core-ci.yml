name: Living Learning Padiem Core CI

on:
  pull_request:
    paths:
      - 'apps/living-learning/**'
      - 'packages/padiem-ai-core/**'
      - 'scripts/experiments/benchmark_padiem_search_providers.py'
      - 'scripts/experiments/benchmark_padiem_fetch_providers.py'
      - '.github/tests/test_3989_engine_living_learning_ci_scope.py'
      - '.github/workflows/living-learning-padiem-core-ci.yml'
      - '.github/scripts/living_learning_core_parallel_3989.sh'
      - '.github/tests/test_3989_living_learning_parallel_scope.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: living-learning-padiem-core-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  living-learning-core-reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install opt-in Core dependency and Living Learning
        working-directory: apps/living-learning
        run: |
          python -m pip install --disable-pip-version-check -r requirements-padiem-core.txt
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pip install --disable-pip-version-check 'jsonschema>=4.23,<5'
          python -m pip check

      - name: Compile Living Learning and Core
        run: |
          python -m compileall -q apps/living-learning/app
          python -m compileall -q packages/padiem-ai-core/padiem_ai_core

      # #3989: Both complete pytest suites remain mandatory. The same Ubuntu
      # runner runs each from its original working directory and collects both
      # independent statuses even if the other suite fails.
      - name: Validate Living Learning/Core parallel failure propagation
        run: python .github/tests/test_3989_living_learning_parallel_scope.py

      - name: Living Learning full tests and Padiem AI Core full tests
        shell: bash
        run: bash .github/scripts/living_learning_core_parallel_3989.sh

      - name: Prove default provider remains mock
        working-directory: apps/living-learning
        run: |
          python - <<'PY'
          from app.config import Settings
          from app.factory import create_provider
          provider = create_provider(Settings(database_url=':memory:'))
          assert provider.provider_type == 'mock'
          print('LIVING_LEARNING_DEFAULT_PROVIDER=mock')
          print('REAL_PROVIDER_CALLS=0')
          PY
