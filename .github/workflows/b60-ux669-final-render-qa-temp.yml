name: B60 UX669 Final Render QA Temp

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.number == 670
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pw"
          npm install --prefix "${RUNNER_TEMP}/pw" playwright@1.55.0 >/dev/null
          "${RUNNER_TEMP}/pw/node_modules/.bin/playwright" install --with-deps chromium >/dev/null

      - name: Start B60 static runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory apps/portfolio-console >"${RUNNER_TEMP}/server.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ai-api/ >/dev/null && exit 0
            sleep 1
          done
          cat "${RUNNER_TEMP}/server.log"
          exit 1

      - name: Exercise unified route detail
        shell: bash
        env:
          PW: ${{ runner.temp }}/pw/node_modules/playwright
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ux3-final"
          cat > "${RUNNER_TEMP}/ux3-final/run.cjs" <<'NODE'
          const { chromium } = require(process.env.PW);
          const fs = require('fs');
          const path = require('path');
          const out = process.env.RUNNER_TEMP + '/ux3-final';
          const failures = [];
          const evidence = [];
          const assert = (cond, msg) => { if (!cond) failures.push(msg); };
          const shot = (page, name) => page.screenshot({ path: path.join(out, name), fullPage: false });

          async function exercise(viewport, prefix) {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport });
            const page = await context.newPage();
            const consoleErrors = [];
            const requestFailures = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('requestfailed', req => requestFailures.push(`${req.method()} ${req.url()} ${req.failure()?.errorText || ''}`));

            await page.goto('http://127.0.0.1:4173/ai-api/', { waitUntil: 'networkidle' });
            await page.locator('#explore').scrollIntoViewIfNeeded();
            await page.waitForSelector('.ux3-route-detail');

            const viewportState = await page.evaluate(() => ({
              innerWidth,
              innerHeight,
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth
            }));
            assert(viewportState.innerWidth === viewport.width, `${prefix}: viewport mismatch ${JSON.stringify(viewportState)}`);

            const legacy = page.locator('.signal-drawer-v6');
            assert(await legacy.count() === 1, `${prefix}: legacy drawer compatibility node missing`);
            assert(await legacy.evaluate(el => el.hidden && getComputedStyle(el).display === 'none'), `${prefix}: legacy drawer is not hard-hidden`);

            const vercel = page.locator('.access-card[data-id="vercel-glm52"]');
            await vercel.locator('h3').click();
            await page.waitForSelector('.ux3-route-detail.is-open');
            await page.waitForTimeout(320);
            assert(!(await legacy.isVisible()), `${prefix}: legacy drawer visible after route activation`);
            assert(!(await legacy.evaluate(el => el.classList.contains('is-open'))), `${prefix}: legacy drawer still received open ownership`);

            let panel = page.locator('.ux3-route-panel');
            let text = await panel.innerText();
            assert(text.includes('Vercel AI Gateway'), `${prefix}: provider missing`);
            assert(text.includes('zai/glm-5.2'), `${prefix}: model missing`);
            assert(text.includes('$5 credits / 30 days'), `${prefix}: recurring credit fact missing`);
            assert(text.includes('PENDING_WEB_VERIFICATION'), `${prefix}: pending state missing`);
            assert(text.includes('Free on fx through Aug 27'), `${prefix}: pending promotion copy missing`);
            assert(!text.includes('VERIFIED END DATE'), `${prefix}: unverified expiry promoted to verified`);
            assert((await panel.locator('.ux3-exec').textContent()).includes('INFO ONLY'), `${prefix}: Vercel must remain INFO ONLY`);
            assert(await panel.locator('.ux3-sources a').count() >= 1, `${prefix}: official evidence link missing`);

            const routeUrl = new URL(page.url());
            assert(routeUrl.searchParams.get('route') === 'vercel-glm52', `${prefix}: route deep-link parameter missing`);
            assert([...routeUrl.searchParams.keys()].join(',') === 'route', `${prefix}: non-public query state leaked`);
            assert(routeUrl.hash === '#explore', `${prefix}: information-layer hash missing`);
            await shot(page, `${prefix}-01-vercel-detail.png`);

            let save = panel.locator('[data-save-id="vercel-glm52"]');
            assert((await save.getAttribute('aria-pressed')) === 'false', `${prefix}: initial SAVE state not false`);
            await save.click();
            await page.waitForTimeout(100);
            assert((await save.getAttribute('aria-pressed')) === 'true', `${prefix}: SAVE aria state not synchronized`);
            assert((await save.textContent()).trim() === 'SAVED', `${prefix}: SAVE label not synchronized`);
            const stored = await page.evaluate(() => JSON.parse(localStorage.getItem('b60.ai-api.watchlist.v1') || '[]'));
            assert(stored.includes('vercel-glm52'), `${prefix}: watch storage missing saved route`);

            let compare = panel.locator('[data-compare-id="vercel-glm52"]');
            await compare.click();
            await page.waitForTimeout(100);
            assert((await compare.getAttribute('aria-pressed')) === 'true', `${prefix}: COMPARE aria state not synchronized`);
            assert((await compare.textContent()).trim() === 'SELECTED', `${prefix}: COMPARE label not synchronized`);
            assert((await page.locator('[data-compare-count]').textContent()).trim() === '1 / 3', `${prefix}: compare tray count mismatch`);

            await page.locator('[data-close-route]').click();
            await page.waitForTimeout(280);
            await vercel.locator('h3').click();
            await page.waitForSelector('.ux3-route-detail.is-open');
            await page.waitForTimeout(280);
            panel = page.locator('.ux3-route-panel');
            save = panel.locator('[data-save-id="vercel-glm52"]');
            compare = panel.locator('[data-compare-id="vercel-glm52"]');
            assert((await save.getAttribute('aria-pressed')) === 'true' && (await save.textContent()).trim() === 'SAVED', `${prefix}: SAVE state lost on reopen`);
            assert((await compare.getAttribute('aria-pressed')) === 'true' && (await compare.textContent()).trim() === 'SELECTED', `${prefix}: COMPARE state lost on reopen`);
            await shot(page, `${prefix}-02-vercel-reopen.png`);

            await panel.locator('[data-provider-open="Vercel AI Gateway"]').click();
            await page.waitForTimeout(220);
            assert(await page.locator('.ux3-route-detail.is-open').count() === 0, `${prefix}: provider jump did not close route detail`);
            assert((await page.locator('.ia-entity-hero').innerText()).includes('Vercel AI Gateway'), `${prefix}: provider jump landed on wrong entity`);

            await page.locator('.ia-primary [data-ia-view="discover"]').click();
            await page.waitForSelector('.access-card[data-id="openrouter-free-router"]');
            await page.locator('.access-card[data-id="openrouter-free-router"] h3').click();
            await page.waitForSelector('.ux3-route-detail.is-open');
            await page.waitForTimeout(300);
            panel = page.locator('.ux3-route-panel');
            text = await panel.innerText();
            assert(text.includes('openrouter/free'), `${prefix}: OpenRouter model absent`);
            assert((await panel.locator('.ux3-exec').textContent()).includes('ROUTER MAPPED'), `${prefix}: mapped state absent`);
            assert(await panel.locator('[data-handoff-id="openrouter-free-router"]').count() === 1, `${prefix}: mapped handoff action absent`);
            await shot(page, `${prefix}-03-openrouter-detail.png`);

            await panel.locator('[data-handoff-id="openrouter-free-router"]').click();
            await page.waitForSelector('.ux2-handoff.is-open');
            await page.waitForTimeout(320);
            const handoffText = await page.locator('.ux2-handoff-panel').innerText();
            assert(handoffText.includes('openrouter:openrouter/free'), `${prefix}: exact route ID absent in handoff`);
            assert(handoffText.includes('NOT BOUND'), `${prefix}: live target boundary absent`);
            assert(await page.locator('.ux2-handoff-panel a[href^="http"]').count() === 0, `${prefix}: guessed execution link present`);
            await shot(page, `${prefix}-04-handoff.png`);
            await page.locator('[data-close-handoff]').click();
            await page.waitForTimeout(280);
            await page.locator('[data-close-route]').click();

            const google = page.locator('.access-card[data-id="google-gemini-free"]');
            await google.focus();
            await page.keyboard.press('Enter');
            await page.waitForSelector('.ux3-route-detail.is-open');
            await page.waitForTimeout(280);
            assert(!(await legacy.isVisible()), `${prefix}: legacy drawer visible after keyboard route activation`);
            await page.keyboard.press('Escape');
            await page.waitForTimeout(280);
            assert(await page.locator('.ux3-route-detail.is-open').count() === 0, `${prefix}: Escape did not close route detail`);

            const deep = await context.newPage();
            const deepErrors = [];
            deep.on('console', msg => { if (msg.type() === 'error') deepErrors.push(msg.text()); });
            await deep.goto('http://127.0.0.1:4173/ai-api/?route=openrouter-free-router#explore', { waitUntil: 'networkidle' });
            await deep.waitForSelector('.ux3-route-detail.is-open');
            await deep.waitForTimeout(320);
            const deepUrl = new URL(deep.url());
            assert([...deepUrl.searchParams.keys()].join(',') === 'route', `${prefix}: deep-link has unexpected query state`);
            assert(deepUrl.searchParams.get('route') === 'openrouter-free-router', `${prefix}: deep-link route mismatch`);
            assert(deepUrl.hash === '#explore', `${prefix}: deep-link hash mismatch`);
            const exploreTop = await deep.locator('#explore').evaluate(el => Math.abs(el.getBoundingClientRect().top));
            assert(exploreTop < 12, `${prefix}: deep-link did not land on information layer (${exploreTop})`);
            assert((await deep.locator('.ux3-route-panel').innerText()).includes('openrouter/free'), `${prefix}: deep-link did not reopen exact route`);
            assert(deepErrors.length === 0, `${prefix}: deep-link console errors ${deepErrors.join(' | ')}`);
            await shot(deep, `${prefix}-05-deeplink.png`);
            await deep.close();

            const metrics = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth
            }));
            assert(metrics.scrollWidth <= metrics.clientWidth + 1, `${prefix}: horizontal overflow ${JSON.stringify(metrics)}`);
            assert(consoleErrors.length === 0, `${prefix}: console errors ${consoleErrors.join(' | ')}`);
            assert(requestFailures.length === 0, `${prefix}: request failures ${requestFailures.join(' | ')}`);
            evidence.push({ prefix, viewportState, metrics, consoleErrors, requestFailures });
            await browser.close();
          }

          (async () => {
            await exercise({ width: 1440, height: 1000 }, 'desktop');
            await exercise({ width: 390, height: 844 }, 'mobile');
            const result = { pass: failures.length === 0, failures, evidence };
            fs.writeFileSync(path.join(out, 'result.json'), JSON.stringify(result, null, 2));
            console.log(JSON.stringify(result, null, 2));
            if (failures.length) process.exit(1);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          node "${RUNNER_TEMP}/ux3-final/run.cjs"

      - name: Upload UX3 final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b60-ux669-final-render-evidence
          path: ${{ runner.temp }}/ux3-final
          if-no-files-found: error
