name: B62 DOM Sink Audit

on:
  pull_request:
    paths:
      - 'apps/padiem-chat/static/**'
      - '.github/scripts/b62_dom_sink_audit.py'
      - '.github/workflows/b62-dom-sink-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dom-sink-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify B62 unsafe DOM sink boundary
        run: python .github/scripts/b62_dom_sink_audit.py
