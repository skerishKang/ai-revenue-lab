name: B54 Slack Grant Seed Gate

# One-shot Production seed of the canonical shared Slack READ grant for #2951.
#
# The grant row pins app/agent/connector identity plus the trusted binding and
# actor references, and capability is exactly ["read"], so Slack send/write/
# events paths stay fail-closed. The only D1 mutation is the single reviewed
# INSERT emitted by the canonical seed script
# (apps/padiem-ai-engine/scripts/connector_grant_seed.py) after it is reviewed
# inline. No Slack Web API call, no Worker code change, no secret handling.
#
# The Slack grant reuses the existing single grant store and the already
# promoted canonical identity b54-padiem-claw-slack /
# agent:padiem:claw_slack_reader@1 / connector:slack:workspace@1. This gate
# never creates a second grant store, seed authority, Slack runtime or
# credential authority.
#
# Trusted refs: the Slack binding_ref/actor_ref are NEVER invented in source.
# The live job reads them from the repository/environment secrets
# B54_SLACK_BINDING_REF / B54_SLACK_ACTOR_REF. Missing refs fail closed before
# any D1 call. Creating or merging this workflow is not authority to dispatch
# it, and it never provisions the Slack bot credential or channel config.

on:
  pull_request:
    paths:
      - '.github/workflows/b54-slack-grant-seed-gate.yml'
      - '.github/tests/test_b54_slack_grant_seed_gate.py'
      - 'apps/padiem-ai-engine/scripts/connector_grant_seed.py'
      - 'apps/padiem-ai-engine/tests/test_connector_grant_seed_script.py'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact current main SHA authorized for this one-shot Slack READ grant seed'
        required: true
      confirmation:
        description: 'Type RUN_B54_SLACK_GRANT_SEED_ONCE to authorize exactly one Slack READ grant seed'
        required: true

permissions:
  contents: read

concurrency:
  group: b54-slack-grant-seed
  cancel-in-progress: false

env:
  ENGINE_WORKER: padiem-ai-engine
  EXPECTED_D1_ID: 6b77ad02-bc27-488f-bb97-6325f6750cba
  SLACK_APP_ID: b54-padiem-claw-slack
  SLACK_AGENT_ID: agent:padiem:claw_slack_reader@1
  SLACK_CONNECTOR_ID: connector:slack:workspace@1

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source under review
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_sha || github.sha }}
          persist-credentials: false

      - name: Dispatch exact-main preflight
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.inputs.target_sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.event.inputs.target_sha }}"
          echo 'PREFLIGHT_EXACT_MAIN=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run bounded seed contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest pytest-asyncio
          python -m pip install --disable-pip-version-check --quiet -e packages/padiem-ai-core
          python -m pytest -q apps/padiem-ai-engine/tests/test_connector_grant_seed_script.py

      - name: Run Slack grant seed gate contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet 'pyyaml>=6,<7'
          python -m pytest -q .github/tests/test_b54_slack_grant_seed_gate.py
          echo 'B54_SLACK_GRANT_SEED_GATE_SOURCE_CONTRACT=PASS'

      - name: Prove reviewed Slack seed SQL without executing it
        shell: bash
        run: |
          set -euo pipefail
          # Dry-run placeholders only. These values are never used by the live
          # job and never reach D1: the live seed reads both refs from the
          # trusted repository secrets instead.
          out="$(python apps/padiem-ai-engine/scripts/connector_grant_seed.py \
            --action seed --connector slack \
            --app-id "${SLACK_APP_ID}" \
            --agent-id "${SLACK_AGENT_ID}" \
            --binding-ref 'dry-run-binding-ref' \
            --actor-ref 'dry-run-actor-ref' \
            --capabilities read | tr -d '\r')"
          printf '%s\n' "${out}" | grep -Fq "INSERT INTO padiem_engine_connector_grants"
          printf '%s\n' "${out}" | grep -Fq "'b54-padiem-claw-slack'"
          printf '%s\n' "${out}" | grep -Fq "'agent:padiem:claw_slack_reader@1'"
          printf '%s\n' "${out}" | grep -Fq "'connector:slack:workspace@1'"
          printf '%s\n' "${out}" | grep -Fq "'[]', '[\"read\"]', 1,"
          printf '%s\n' "${out}" | grep -Fq 'ON CONFLICT(app_id, connector_id) DO UPDATE SET active=1'
          printf '%s\n' "${out}" | grep -Fq "binding_ref=excluded.binding_ref, actor_ref=excluded.actor_ref"
          printf '%s\n' "${out}" | grep -Fq 'granted_capabilities_json=excluded.granted_capabilities_json'
          # READ-only capability proof: the capability column must be exactly
          # ["read"]. Column names such as created_at/updated_at legitimately
          # contain the substrings create/update, so the check matches only the
          # capability tokens themselves.
          if printf '%s\n' "${out}" | grep -Eq '\["read",|slack\.write|slack\.send|slack\.readonly|post_message|reply_thread|update_message|upload_file|send_message|events_ingress'; then
            echo 'SLACK_SEED_SQL_SCOPE=FAIL'
            exit 1
          fi
          printf '%s\n' "${out}" | grep -Fq "'[]', '[\"read\"]', 1,"
          echo 'SLACK_SEED_SQL_CONTRACT=PASS'
          echo 'SLACK_SEED_SQL_SCOPE=READ_ONLY'
          echo 'SLACK_GRANT_SEED_EXECUTED=0'
          echo 'SLACK_SYNTHETIC_REF_DEFAULT=NO'
          echo 'D1_MUTATION=0'
          echo 'SLACK_PROVIDER_CALLS=0'
          echo 'PRODUCTION_MUTATION=0'

  live-slack-seed:
    needs: source-contract
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirmation == 'RUN_B54_SLACK_GRANT_SEED_ONCE'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SLACK_BINDING_REF_SOURCE: ${{ secrets.B54_SLACK_BINDING_REF }}
      SLACK_ACTOR_REF_SOURCE: ${{ secrets.B54_SLACK_ACTOR_REF }}
    steps:
      - name: Checkout exact authorized main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_sha }}
          persist-credentials: false

      - name: Re-check exact current main before seed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.inputs.target_sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.event.inputs.target_sha }}"
          echo 'LIVE_EXACT_MAIN=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install reviewed seed script runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet -e packages/padiem-ai-core
          echo 'SLACK_SEED_SCRIPT_DEPS=INSTALLED'

      - name: Require trusted Slack refs before any D1 call
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          if [ -z "${SLACK_BINDING_REF_SOURCE:-}" ] || [ -z "${SLACK_ACTOR_REF_SOURCE:-}" ]; then
            echo 'SLACK_TRUSTED_REFS=FAIL'
            echo 'SLACK_TRUSTED_REFS_SOURCE=REPOSITORY_SECRET_REQUIRED'
            echo 'MISSING_REF_FAILS_BEFORE_D1=YES'
            echo 'D1_MUTATION=0'
            echo 'SLACK_GRANT_SEED=0'
            exit 1
          fi
          # Reuse the canonical seed script's own identifier grammar: a ref that
          # the script would reject must fail here, before any D1 call.
          if ! python apps/padiem-ai-engine/scripts/connector_grant_seed.py \
            --action seed --connector slack \
            --app-id "${SLACK_APP_ID}" \
            --agent-id "${SLACK_AGENT_ID}" \
            --binding-ref "${SLACK_BINDING_REF_SOURCE}" \
            --actor-ref "${SLACK_ACTOR_REF_SOURCE}" \
            --capabilities read > "${RUNNER_TEMP}/slack-ref-shape.sql" 2>/dev/null; then
            echo 'SLACK_TRUSTED_REFS=FAIL'
            echo 'SLACK_TRUSTED_REF_SHAPE=FAIL'
            echo 'MISSING_REF_FAILS_BEFORE_D1=YES'
            echo 'D1_MUTATION=0'
            exit 1
          fi
          rm -f "${RUNNER_TEMP}/slack-ref-shape.sql"
          echo 'SLACK_TRUSTED_REFS_PRESENT=PASS'
          echo 'TRUSTED_BINDING_REF_REQUIRED=YES'
          echo 'TRUSTED_ACTOR_REF_REQUIRED=YES'
          echo 'MISSING_REF_FAILS_BEFORE_D1=YES'
          echo 'SLACK_SYNTHETIC_REF_DEFAULT=NO'
          echo 'RAW_BINDING_REF_OUTPUT=0'
          echo 'RAW_ACTOR_REF_OUTPUT=0'
          echo 'SECRET_VALUE_OUTPUT=0'

      - name: Resolve actually served Engine version
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${ENGINE_WORKER}"
          deployments="${RUNNER_TEMP}/slack-seed-deployments.json"
          curl -fsS "${auth[@]}" "${base}/deployments" -o "${deployments}"
          resolve_out="$(python3 .github/scripts/b54_engine_served_version_guard.py resolve-active --deployments "${deployments}")"
          active_version="$(printf '%s\n' "${resolve_out}" | sed -n 's/^ENGINE_ACTIVE_VERSION_ID=//p')"
          test -n "${active_version}"
          echo "::add-mask::${active_version}"
          echo "ACTIVE_ENGINE_VERSION=${active_version}" >> "${GITHUB_ENV}"
          echo 'ENGINE_ACTIVE_VERSION_IDENTIFIED=PASS'
          echo 'ENGINE_VERSION_ID_OUTPUT=0'

      - name: Resolve served connector-grants D1 identity without output
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${ENGINE_WORKER}"
          detail="${RUNNER_TEMP}/slack-seed-version.json"
          curl -fsS "${auth[@]}" "${base}/versions/${ACTIVE_ENGINE_VERSION}" -o "${detail}"
          DB_ID="$(python - "${detail}" "${ACTIVE_ENGINE_VERSION}" "${EXPECTED_D1_ID}" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          result = payload.get("result") if payload.get("success") is True else None
          if not isinstance(result, dict) or result.get("id") != sys.argv[2]:
              raise SystemExit("served version identity mismatch")
          resources = result.get("resources")
          raw = resources.get("bindings") if isinstance(resources, dict) else None
          if isinstance(raw, dict):
              bindings = [{**value, "name": name} for name, value in raw.items() if isinstance(value, dict)]
          elif isinstance(raw, list):
              bindings = raw
          else:
              raise SystemExit("served binding collection malformed")
          hits = [b for b in bindings if isinstance(b, dict) and b.get("name") == "ENGINE_CONNECTOR_GRANTS"]
          if len(hits) != 1 or hits[0].get("type") != "d1":
              raise SystemExit("served ENGINE_CONNECTOR_GRANTS binding missing or wrong type")
          db_id = hits[0].get("id")
          if db_id != sys.argv[3]:
              raise SystemExit("served connector-grants D1 identity drifted")
          print(db_id)
          PY
          )"
          test -n "${DB_ID}"
          echo "::add-mask::${DB_ID}"
          echo "DB_ID=${DB_ID}" >> "${GITHUB_ENV}"
          echo 'LIVE_ENGINE_CONNECTOR_GRANTS_D1_DERIVED=PASS'
          echo 'D1_IDENTIFIER_OUTPUT=0'

      - name: Guard on the pre-seed Slack grant aggregate
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          query_payload="${RUNNER_TEMP}/slack-seed-presql.json"
          python - "${query_payload}" "${SLACK_APP_ID}" "${SLACK_AGENT_ID}" "${SLACK_CONNECTOR_ID}" <<'PY'
          import json, sys
          app_id, agent_id, connector_id = sys.argv[2:5]
          sql = """
          SELECT
            COUNT(*) AS total_rows,
            SUM(CASE WHEN active = 1 THEN 1 ELSE 0 END) AS active_count,
            SUM(CASE WHEN active = 1 AND canonical_agent_id = ? THEN 1 ELSE 0 END) AS exact_identity_count,
            SUM(CASE
                  WHEN active = 1
                   AND json_valid(granted_capabilities_json) = 1
                   AND json_array_length(granted_capabilities_json) = 1
                   AND json_extract(granted_capabilities_json, '$[0]') = 'read'
                  THEN 1 ELSE 0 END) AS read_capability_count,
            SUM(CASE
                  WHEN active = 1
                   AND binding_ref IS NOT NULL
                   AND length(trim(binding_ref)) > 0
                  THEN 1 ELSE 0 END) AS binding_ref_present_count,
            SUM(CASE
                  WHEN active = 1
                   AND actor_ref IS NOT NULL
                   AND length(trim(actor_ref)) > 0
                  THEN 1 ELSE 0 END) AS actor_ref_present_count
          FROM padiem_engine_connector_grants
          WHERE app_id = ? AND connector_id = ?;
          """
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump({"sql": sql, "params": [agent_id, app_id, connector_id]}, handle)
          PY

          response="${RUNNER_TEMP}/slack-seed-pre-response.json"
          curl -fsS -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${query_payload}" -o "${response}"

          state="$(python - "${response}" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("success") is not True:
              raise SystemExit("pre-seed aggregate query failed")
          result = payload.get("result")
          if not isinstance(result, list) or len(result) != 1 or result[0].get("success") is not True:
              raise SystemExit("pre-seed aggregate envelope invalid")
          rows = result[0].get("results")
          if not isinstance(rows, list) or len(rows) != 1:
              raise SystemExit("pre-seed aggregate row invalid")
          row = rows[0]
          values = (
              int(row.get("total_rows") or 0),
              int(row.get("active_count") or 0),
              int(row.get("exact_identity_count") or 0),
              int(row.get("read_capability_count") or 0),
              int(row.get("binding_ref_present_count") or 0),
              int(row.get("actor_ref_present_count") or 0),
          )
          if all(value == 0 for value in values):
              print("ABSENT_ZERO")
          elif values == (1, 1, 1, 1, 1, 1):
              print("EXACT_ACTIVE_READ")
          else:
              print("NONCANONICAL")
          PY
          )"
          if [ "${state}" = "NONCANONICAL" ]; then
            echo 'SLACK_PRE_SEED_STATE=NONCANONICAL'
            echo 'SLACK_GRANT_SEED=0'
            echo 'D1_MUTATION=0'
            exit 1
          fi
          if [ "${state}" = "EXACT_ACTIVE_READ" ]; then
            echo 'SLACK_PRE_SEED_STATE=EXACT_ACTIVE_READ'
            echo 'SLACK_SEED_SKIPPED_ALREADY_SEEDED=YES'
            echo 'SLACK_GRANT_SEED=0'
            echo 'D1_MUTATION=0'
          else
            echo 'SLACK_PRE_SEED_STATE=ABSENT_ZERO'
            echo 'SLACK_SEED_SKIPPED_ALREADY_SEEDED=NO'
          fi
          echo "SLACK_SEED_GATE_PRE_STATE=${state}" >> "${GITHUB_ENV}"
          echo 'RAW_BINDING_REF_OUTPUT=0'
          echo 'RAW_ACTOR_REF_OUTPUT=0'
          echo 'ROW_VALUE_OUTPUT=AGGREGATES_ONLY'
          echo 'D1_QUERY_MODE=READ_ONLY'

      - name: Execute exactly one reviewed Slack READ grant INSERT
        shell: bash
        run: |
          set -euo pipefail
          if [ "${SLACK_SEED_GATE_PRE_STATE}" != "ABSENT_ZERO" ]; then
            echo 'SLACK_GRANT_SEED=0'
            echo 'D1_MUTATION=0'
            exit 0
          fi
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          sql_file="${RUNNER_TEMP}/slack-reviewed-seed.sql"
          python apps/padiem-ai-engine/scripts/connector_grant_seed.py \
            --action seed --connector slack \
            --app-id "${SLACK_APP_ID}" \
            --agent-id "${SLACK_AGENT_ID}" \
            --binding-ref "${SLACK_BINDING_REF_SOURCE}" \
            --actor-ref "${SLACK_ACTOR_REF_SOURCE}" \
            --capabilities read > "${sql_file}"
          python - "${sql_file}" "${SLACK_APP_ID}" "${SLACK_AGENT_ID}" "${SLACK_CONNECTOR_ID}" <<'PY'
          import sys

          sql = open(sys.argv[1], encoding="utf-8").read().strip()
          app_id, agent_id, connector_id = sys.argv[2:5]
          for token in (app_id, agent_id, connector_id):
              if token not in sql:
                  raise SystemExit("reviewed seed SQL deviates from the canonical Slack identity")
          if "'[]'" not in sql or "'[\"read\"]'" not in sql:
              raise SystemExit("reviewed seed SQL deviates from the READ-only columns")
          if "ON CONFLICT(app_id, connector_id) DO UPDATE SET active=1" not in sql:
              raise SystemExit("reviewed seed SQL misses the canonical upsert")
          print("SLACK_SEED_SQL_REVIEWED=PASS")
          print("SLACK_SEED_SQL_SCOPE=READ_ONLY")
          PY

          mutation_payload="${RUNNER_TEMP}/slack-seed-mutation.json"
          python - "${sql_file}" "${mutation_payload}" <<'PY'
          import json, sys
          sql = open(sys.argv[1], encoding="utf-8").read()
          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              json.dump({"sql": sql}, handle)
          PY

          response="${RUNNER_TEMP}/slack-seed-mutation-response.json"
          curl -fsS -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${mutation_payload}" -o "${response}"

          python - "${response}" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("success") is not True:
              raise SystemExit("Slack READ grant mutation failed")
          result = payload.get("result")
          if not isinstance(result, list) or not result or any(entry.get("success") is not True for entry in result):
              raise SystemExit("Slack READ grant mutation envelope invalid")
          print("SLACK_GRANT_SEED_EXECUTED=1")
          print("D1_MUTATION=1")
          PY

          echo 'RAW_BINDING_REF_OUTPUT=0'
          echo 'RAW_ACTOR_REF_OUTPUT=0'
          echo 'ROW_VALUE_OUTPUT=AGGREGATES_ONLY'
          echo 'SLACK_PROVIDER_CALLS=0'
          echo 'SLACK_SEND=0'
          echo 'SLACK_WRITE=0'
          echo 'SLACK_EVENTS_INGRESS=0'
          echo 'SLACK_BOT_TOKEN_PROVISIONING=0'
          echo 'SLACK_ALLOWED_CHANNEL_CONFIG=0'
          echo 'SECRET_MUTATION=0'
          echo 'ENGINE_DEPLOY=0'

      - name: Attest the post-seed Slack grant aggregate
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          query_payload="${RUNNER_TEMP}/slack-seed-postsql.json"
          python - "${query_payload}" "${SLACK_APP_ID}" "${SLACK_AGENT_ID}" "${SLACK_CONNECTOR_ID}" <<'PY'
          import json, sys
          app_id, agent_id, connector_id = sys.argv[2:5]
          sql = """
          SELECT
            COUNT(*) AS total_rows,
            SUM(CASE WHEN active = 1 THEN 1 ELSE 0 END) AS active_count,
            SUM(CASE WHEN active = 1 AND canonical_agent_id = ? THEN 1 ELSE 0 END) AS exact_identity_count,
            SUM(CASE
                  WHEN active = 1
                   AND json_valid(granted_capabilities_json) = 1
                   AND json_array_length(granted_capabilities_json) = 1
                   AND json_extract(granted_capabilities_json, '$[0]') = 'read'
                  THEN 1 ELSE 0 END) AS read_capability_count,
            SUM(CASE
                  WHEN active = 1
                   AND binding_ref IS NOT NULL
                   AND length(trim(binding_ref)) > 0
                  THEN 1 ELSE 0 END) AS binding_ref_present_count,
            SUM(CASE
                  WHEN active = 1
                   AND actor_ref IS NOT NULL
                   AND length(trim(actor_ref)) > 0
                  THEN 1 ELSE 0 END) AS actor_ref_present_count
          FROM padiem_engine_connector_grants
          WHERE app_id = ? AND connector_id = ?;
          """
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump({"sql": sql, "params": [agent_id, app_id, connector_id]}, handle)
          PY

          response="${RUNNER_TEMP}/slack-seed-post-response.json"
          curl -fsS -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${query_payload}" -o "${response}"

          python - "${response}" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("success") is not True:
              raise SystemExit("post-seed aggregate query failed")
          result = payload.get("result")
          if not isinstance(result, list) or len(result) != 1 or result[0].get("success") is not True:
              raise SystemExit("post-seed aggregate envelope invalid")
          rows = result[0].get("results")
          if not isinstance(rows, list) or len(rows) != 1:
              raise SystemExit("post-seed aggregate row invalid")
          row = rows[0]
          values = {
              "total_rows": int(row.get("total_rows") or 0),
              "active_count": int(row.get("active_count") or 0),
              "exact_identity_count": int(row.get("exact_identity_count") or 0),
              "read_capability_count": int(row.get("read_capability_count") or 0),
              "binding_ref_present_count": int(row.get("binding_ref_present_count") or 0),
              "actor_ref_present_count": int(row.get("actor_ref_present_count") or 0),
          }
          print(f"SLACK_GRANT_TOTAL_ROWS={values['total_rows']}")
          print(f"SLACK_GRANT_ACTIVE_COUNT={values['active_count']}")
          print("SLACK_GRANT_EXACT_IDENTITY=YES" if values["exact_identity_count"] == 1 else "SLACK_GRANT_EXACT_IDENTITY=NO")
          print('SLACK_GRANT_CAPABILITIES=["read"]' if values["read_capability_count"] == 1 else "SLACK_GRANT_CAPABILITIES=OTHER_OR_MISSING")
          print("SLACK_GRANT_BINDING_REF_PRESENT=YES" if values["binding_ref_present_count"] == 1 else "SLACK_GRANT_BINDING_REF_PRESENT=NO")
          print("SLACK_GRANT_ACTOR_REF_PRESENT=YES" if values["actor_ref_present_count"] == 1 else "SLACK_GRANT_ACTOR_REF_PRESENT=NO")
          if values != {
              "total_rows": 1,
              "active_count": 1,
              "exact_identity_count": 1,
              "read_capability_count": 1,
              "binding_ref_present_count": 1,
              "actor_ref_present_count": 1,
          }:
              print("SLACK_GRANT_STATE=NONCANONICAL")
              raise SystemExit("post-seed Slack grant state is noncanonical")
          print("SLACK_GRANT_STATE=EXACT_ACTIVE_READ")
          PY

          echo 'RAW_BINDING_REF_OUTPUT=0'
          echo 'RAW_ACTOR_REF_OUTPUT=0'
          echo 'RAW_SLACK_ID_OUTPUT=0'
          echo 'ROW_VALUE_OUTPUT=AGGREGATES_ONLY'
          echo 'SECRET_VALUE_OUTPUT=0'
          echo 'PROVIDER_CREDENTIAL_OUTPUT=0'
          echo 'D1_QUERY_MODE=READ_ONLY'
          echo 'SLACK_GRANT_ATTESTED=1'
          echo 'SLACK_PROVIDER_CALLS=0'
          echo 'SLACK_SEND=0'
          echo 'SLACK_WRITE=0'
          echo 'SLACK_EVENTS_INGRESS=0'
          echo 'SLACK_BOT_TOKEN_PROVISIONING=0'
          echo 'SLACK_ALLOWED_CHANNEL_CONFIG=0'
          echo 'SECRET_MUTATION=0'
          echo 'ENGINE_DEPLOY=0'
          echo 'PRODUCTION_MUTATION=SCOPED_SLACK_GRANT_SEED'
          # A canonical READ grant row never proves the Slack bot token carries
          # the workspace READ authority: that needs the separately authorized
          # live READ canary under #2951.
          echo 'SLACK_READ_AUTHORITY_STATUS=UNVERIFIED_WITHOUT_PROVIDER'

      - name: Publish bounded seed evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## B54 Slack grant seed gate"
            echo
            echo "- seed scope: one canonical shared Slack READ grant row ([\"read\"] only)"
            echo "- trusted binding_ref/actor_ref: read from repository secrets; never printed"
            echo "- pre/post aggregates only; Slack send/write/events remain unregistered"
            echo "- no Slack Web API call, no bot-token/channel-config provisioning, no Worker change"
            echo "- single grant store reused; no second Slack runtime or seed authority"
            echo "- next step: bounded live Slack READ canary under a separate authority (#2951)"
          } >> "${GITHUB_STEP_SUMMARY}"
