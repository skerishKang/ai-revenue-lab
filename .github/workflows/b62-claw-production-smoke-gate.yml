name: B62 Claw Production Smoke Gate

on:
  pull_request:
    paths:
      - ".github/workflows/b62-claw-production-smoke-gate.yml"
  push:
    paths:
      - ".github/workflows/b62-claw-production-smoke-gate.yml"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact current main SHA"
        required: true
        type: string
      confirmation:
        description: "Exact canary authorization phrase"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: b62-claw-production-smoke-gate
  cancel-in-progress: false

env:
  B62_PUBLIC_BASE_URL: https://padiem-chat.charliekant.workers.dev

jobs:
  source-contract:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout push SHA
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout dispatch SHA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate smoke gate contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/b62-claw-production-smoke-gate.yml').read_text(encoding='utf-8')
          required = [
              'RUN_B62_CLAW_PHASE_A_REAL_MODEL_CANARY',
              '/api/claw/manual-intake/execute',
              '"action":"summary"',
              'P01_RUN_ID_PRESENT=PASS',
              'MODEL_RESULT_NONEMPTY=PASS',
              'NO_EXTERNAL_SIDE_EFFECT_ACTION=PASS',
              'SECRET_VALUES_OUTPUT=0',
              'PRODUCTION_MUTATION=0',
          ]
          for needle in required:
              assert needle in text, needle
          secret_context = '$' + '{{' + ' secrets.'
          cookie_header = '-H ' + "'Cookie:"
          auth_header = '-H ' + "'Authorization:"
          assert secret_context not in text
          assert cookie_header not in text
          assert auth_header not in text
          print('B62_CLAW_PHASE_A_SMOKE_SOURCE=PASS')
          print('PRODUCTION_MUTATION=0')
          PY

  phase-a-production-canary:
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact current main and explicit canary authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${{ inputs.confirmation }}" = "RUN_B62_CLAW_PHASE_A_REAL_MODEL_CANARY"
          test "$(git rev-parse HEAD)" = "${{ inputs.target_sha }}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${{ inputs.target_sha }}"
          echo "PHASE_A_EXACT_MAIN=PASS"

      - name: Run bounded synthetic real-model canary
        shell: bash
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/claw-phase-a.json"
          headers="${RUNNER_TEMP}/claw-phase-a.headers"
          payload='{"channel":"other","action":"summary","content":"Closed beta synthetic canary. Summarize this sentence in one short sentence."}'
          scan_secret_patterns() {
            local f="$1"
            [ -s "${f}" ] || return 1
            grep -Eiq -e 'Bearer ' -e 'CLOUDFLARE_API_TOKEN' -e 'Authorization:' -e 'connect_ticket' "${f}"
          }
          curl_exit=0
          status="$(curl --silent --show-error --max-time 45 \
            -D "${headers}" -o "${body}" -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data "${payload}" \
            "${B62_PUBLIC_BASE_URL}/api/claw/manual-intake/execute")" || curl_exit=$?
          if [ -s "${body}" ]; then body_captured=YES; else body_captured=NO; fi
          if [ -s "${headers}" ]; then headers_captured=YES; else headers_captured=NO; fi
          if [ "${curl_exit}" -ne 0 ] || [ "${status}" != "200" ]; then
            echo "CURL_EXIT_CODE=${curl_exit}"
            echo "INTAKE_POST_STATUS=${status:-NO_RESPONSE}"
            body_redacted=NO
            if [ "${body_captured}" = "YES" ] || [ "${headers_captured}" = "YES" ]; then
              if scan_secret_patterns "${body}" || scan_secret_patterns "${headers}"; then
                body_redacted=YES
                echo "RESPONSE_REDACTED_BY_SECRET_SCAN=YES"
              else
                echo "::group::canary_failure_response_body_bounded"
                head -c 4096 "${body}" 2>/dev/null || true
                echo
                echo "::endgroup::"
                echo "::group::canary_failure_response_headers_selected"
                grep -Ei '^(HTTP/|content-type:|cache-control:|cf-ray:|cf-cache-status:|server:|date:|via:|x-[a-z0-9-]+:)' "${headers}" 2>/dev/null || true
                echo "::endgroup::"
              fi
            fi
            echo "RESPONSE_BODY_CAPTURED=${body_captured}"
            echo "RESPONSE_BODY_REDACTED=${body_redacted}"
            echo "RESPONSE_HEADERS_CAPTURED=${headers_captured}"
            echo "PHASE_A_CANARY=FAIL"
            exit 1
          fi
          echo "HTTP_STATUS=${status}"
          echo "INTAKE_POST_STATUS=${status}"
          echo "RESPONSE_BODY_CAPTURED=${body_captured}"
          echo "RESPONSE_BODY_REDACTED=NO"
          echo "RESPONSE_HEADERS_CAPTURED=${headers_captured}"
          jq -e '.ok == true' "${body}" >/dev/null
          jq -e '.result.result_text | type == "string" and length > 0' "${body}" >/dev/null
          jq -e '.result.p01_run_id | type == "string" and length > 0' "${body}" >/dev/null
          jq -e '.result.p01_event_count | type == "number" and . >= 0' "${body}" >/dev/null
          jq -e '.result.action == "summarize_request" or .result.action == "summary"' "${body}" >/dev/null
          jq -e '.result.direct_kakao_send == false and .result.direct_sms_send == false' "${body}" >/dev/null
          grep -qi '^cache-control:.*no-store' "${headers}"
          if grep -Eqi 'credential|api[_-]?key|provider[_-]?key|engine[_-]?url|object[_-]?key|bucket[_-]?name|access[_-]?token|refresh[_-]?token' "${body}"; then
            echo "Public canary response contains forbidden internal material." >&2
            exit 1
          fi
          echo "MODEL_RESULT_NONEMPTY=PASS"
          echo "P01_RUN_ID_PRESENT=PASS"
          echo "NO_EXTERNAL_SIDE_EFFECT_ACTION=PASS"
          echo "SECRET_VALUES_OUTPUT=0"
          echo "PRODUCTION_MUTATION=0"

      - name: Publish bounded evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## B62 Claw Phase-A Production canary'
            echo
            echo "- exact SHA: \`${{ inputs.target_sha }}\`"
            echo '- action: `summary`'
            echo '- synthetic input only: yes'
            echo '- human session material stored in CI: no'
            echo '- external send/write: no'
            echo '- production deployment/config mutation: no'
          } >> "${GITHUB_STEP_SUMMARY}"
