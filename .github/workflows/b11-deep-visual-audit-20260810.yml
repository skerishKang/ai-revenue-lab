name: B11 Deep Visual Audit 20260810
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/b11-deep-visual-audit-20260810.yml']
permissions:
  contents: read
jobs:
  audit:
    if: github.event.pull_request.head.ref == 'ops/b11-deep-visual-audit-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium and Korean fonts
        run: |
          sudo apt-get update -y && sudo apt-get install -y fonts-noto-cjk
          mkdir -p /tmp/b11-audit && cd /tmp/b11-audit && npm init -y >/dev/null 2>&1 && npm install --silent playwright@1.55.0 && npx playwright install chromium
      - name: Capture B11 Production journey
        run: |
          set -euo pipefail
          mkdir -p /tmp/b11-evidence && cd /tmp/b11-audit
          node <<'JS'
          const {chromium}=require('playwright'),fs=require('fs'),path=require('path');const base='https://11-language-learning-magazine.pages.dev',vps=[{name:'desktop',width:1440,height:1100},{name:'mobile',width:390,height:844}];
          (async()=>{const b=await chromium.launch({headless:true}),R=[];for(const vp of vps){for(const [n,r] of [['root','/'],['guide','/guide.html']]){const p=await b.newPage({viewport:vp}),E=[],F=[];p.on('console',m=>{if(m.type()==='error')E.push(m.text())});p.on('pageerror',e=>E.push(e.message));p.on('response',x=>{if(x.status()>=400)F.push(`${x.status()} ${x.url()}`)});const q=await p.goto(base+r,{waitUntil:'networkidle'});await p.evaluate(()=>document.fonts.ready);const m=await p.evaluate(()=>{const h=document.querySelector('h1'),c=h?getComputedStyle(h):null,r=h?.getBoundingClientRect();return{overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,h1:h?.innerText.trim()||'',font:c?parseFloat(c.fontSize):null,line:c?parseFloat(c.lineHeight):null,ratio:c?parseFloat(c.lineHeight)/parseFloat(c.fontSize):null,h1Y:r?.y??null,visibleSvg:[...document.querySelectorAll('svg')].filter(s=>{const x=s.getBoundingClientRect();return x.width>60&&x.height>60}).length,oldChrome:/UI_ONLY|Visual Reference|Phase 1|Visual Atlas/i.test(document.body.innerText)}});await p.screenshot({path:path.join('/tmp/b11-evidence',`${vp.name}-${n}.png`),fullPage:false});R.push({viewport:vp.name,name:n,status:q.status(),errors:E,failed:F,...m});await p.close()}
          const p=await b.newPage({viewport:vp}),E=[],F=[];p.on('console',m=>{if(m.type()==='error')E.push(m.text())});p.on('pageerror',e=>E.push(e.message));p.on('response',x=>{if(x.status()>=400)F.push(`${x.status()} ${x.url()}`)});const q=await p.goto(base+'/ux.html',{waitUntil:'networkidle'});await p.locator('.lf-phrase[data-key="came-alive"]').click();const note=await p.locator('#marginText').textContent();await p.locator('[data-go="vocab"]').click();const vocab=await p.locator('.lf-panel.active').getAttribute('id');await p.locator('[data-go="revise"]').click();const revise=await p.locator('.lf-panel.active').getAttribute('id');await p.locator('[data-go="feedback"]').click();const feedback=await p.locator('.lf-panel.active').getAttribute('id');await p.locator('#finish').click();const finish=await p.locator('#finishStatus').textContent();const m=await p.evaluate(()=>{const h=document.querySelector('.lf-panel.active h1'),c=h?getComputedStyle(h):null;return{overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,title:h?.innerText.trim()||'',font:c?parseFloat(c.fontSize):null,line:c?parseFloat(c.lineHeight):null,ratio:c?parseFloat(c.lineHeight)/parseFloat(c.fontSize):null,visibleSvg:[...document.querySelectorAll('svg')].filter(s=>{const x=s.getBoundingClientRect();return x.width>60&&x.height>60}).length,oldChrome:/UI_ONLY|Visual Reference|Phase 1|Visual Atlas/i.test(document.body.innerText)}});await p.screenshot({path:path.join('/tmp/b11-evidence',`${vp.name}-feedback.png`),fullPage:false});R.push({viewport:vp.name,name:'reader-feedback',status:q.status(),errors:E,failed:F,note,vocab,revise,feedback,finish,...m});await p.close()}
          await b.close();const bad=R.filter(x=>x.status!==200||x.overflow>1||x.errors?.length||x.failed?.length||x.visibleSvg>0||x.oldChrome);const req=[];for(const vp of ['desktop','mobile']){const x=R.find(r=>r.viewport===vp&&r.name==='reader-feedback');if(!/came alive/.test(x.note||'')||x.vocab!=='vocab'||x.revise!=='revise'||x.feedback!=='feedback'||!/다음 호 포인트/.test(x.finish||''))req.push(vp)}fs.writeFileSync('/tmp/b11-evidence/results.json',JSON.stringify({results:R,bad,required:req},null,2));if(bad.length||req.length)process.exit(1)})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'b11-deep-visual-audit-${{ github.run_number }}', path: /tmp/b11-evidence, if-no-files-found: error, retention-days: 7}
