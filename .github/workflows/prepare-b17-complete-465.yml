name: Prepare B17 Complete 465
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/prepare-b17-complete-465.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'ops/prepare-b17-complete-465'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize approved B17 UI plus existing UX on exact main
        shell: bash
        env:
          EXPECTED_MAIN: 2df873ae5825704c17c8e57246430f7e2b95d934
          TARGET_BRANCH: feat/b17-local-shop-magazine-complete-465
          UI_BRANCH: feat/business-17-local-shop-magazine-ui
          UX_BRANCH: feat/business-17-local-shop-magazine-ux-396
          SCOPE: reference/business-17-local-shop-magazine-v1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          git fetch origin "$UI_BRANCH" "$UX_BRANCH"
          test "$(git rev-parse origin/$UI_BRANCH)" = c4e9e8123ede89cfd41c2985e2aae0c5c828d9aa
          test "$(git rev-parse origin/$UX_BRANCH)" = fecfb4ce306870b6e035a4e425c7e9c2e86b326c
          if git ls-tree -r --name-only HEAD -- "$SCOPE" | grep -q .; then
            echo 'B17 scope unexpectedly exists on current main; refusing overwrite' >&2
            exit 1
          fi
          git switch -c "$TARGET_BRANCH"
          git checkout "origin/$UI_BRANCH" -- "$SCOPE"
          git checkout "origin/$UX_BRANCH" -- "$SCOPE/ux.html"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$SCOPE"
          git diff --cached --check
          git commit -m 'feat(b17): integrate approved shop magazine UI and publishing UX'
          git push origin "$TARGET_BRANCH"
          echo B17_PREPARE_PASS=1
