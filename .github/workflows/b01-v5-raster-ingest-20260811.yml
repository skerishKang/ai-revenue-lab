name: B01 V5 Raster Asset Ingest 2026-08-11

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/b01-v5-raster-ingest-20260811.yml'

permissions:
  contents: write

jobs:
  ingest:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processor
        run: python -m pip install --quiet pillow
      - name: Download rights-recorded source photography
        run: |
          set -euo pipefail
          mkdir -p /tmp/b01-v5-source apps/personal-edition/static/images/v5
          curl -fL --retry 3 'https://images.pexels.com/photos/6348/reading-magazine-open-newspaper.jpg?cs=srgb&dl=pexels-karola-g2-6348.jpg&fm=jpg' -o /tmp/b01-v5-source/hero.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/5582874/pexels-photo-5582874.jpeg?cs=srgb&dl=pexels-thirdman-5582874.jpg&fm=jpg' -o /tmp/b01-v5-source/review.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/4271624/pexels-photo-4271624.jpeg?cs=srgb&dl=pexels-alleksana-4271624.jpg&fm=jpg' -o /tmp/b01-v5-source/library.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/8148578/pexels-photo-8148578.jpeg?cs=srgb&dl=pexels-vie-studio-8148578.jpg&fm=jpg' -o /tmp/b01-v5-source/read.jpg
      - name: Process source photography into local B01 assets
        run: |
          cat > /tmp/process_b01_v5.py <<'PY'
          from PIL import Image, ImageEnhance, ImageFilter, ImageDraw
          from pathlib import Path

          src = Path('/tmp/b01-v5-source')
          out = Path('apps/personal-edition/static/images/v5')
          out.mkdir(parents=True, exist_ok=True)

          PAPER=(242,238,228)
          INK=(23,25,21)
          CORAL=(183,70,45)

          def cover(im, size, anchor=(0.5,0.5)):
              tw,th=size; w,h=im.size
              scale=max(tw/w, th/h); nw,nh=round(w*scale),round(h*scale)
              im=im.resize((nw,nh),Image.Resampling.LANCZOS)
              ax,ay=anchor
              left=max(0,min(nw-tw,round((nw-tw)*ax)))
              top=max(0,min(nh-th,round((nh-th)*ay)))
              return im.crop((left,top,left+tw,top+th))

          def grade(im, saturation=.72, contrast=1.08, warmth=.06):
              im=ImageEnhance.Color(im).enhance(saturation)
              im=ImageEnhance.Contrast(im).enhance(contrast)
              px=im.convert('RGB')
              wash=Image.new('RGB',px.size,PAPER)
              px=Image.blend(px,wash,warmth)
              return px

          def vignette(im, strength=70):
              w,h=im.size
              mask=Image.new('L',(w,h),0); d=ImageDraw.Draw(mask)
              for i in range(120):
                  a=int(strength*(i/119)**2)
                  d.rectangle((i,i,w-i-1,h-i-1),outline=a)
              dark=Image.new('RGB',(w,h),INK)
              return Image.composite(dark,im,mask)

          # Hero: actual magazine material, but source print detail becomes texture rather than product text.
          hero=Image.open(src/'hero.jpg').convert('RGB')
          hero=cover(hero,(1600,1080),(0.52,0.62))
          hero=grade(hero,.68,1.06,.04)
          hero=hero.filter(ImageFilter.GaussianBlur(.55))
          # Coral proof intervention lives as a purely visual line; meaningful proof text stays HTML.
          ov=Image.new('RGBA',hero.size,(0,0,0,0)); d=ImageDraw.Draw(ov)
          d.line([(1230,160),(1190,420),(1270,665),(1210,940)],fill=CORAL+(215,),width=8)
          d.ellipse((1189,926,1231,968),outline=CORAL+(225,),width=7)
          hero=Image.alpha_composite(hero.convert('RGBA'),ov).convert('RGB')
          hero.save(out/'hero-private-edition.webp','WEBP',quality=82,method=6)

          # Human proof: hands are the evidence of human review; source note/text is deliberately blurred.
          review=Image.open(src/'review.jpg').convert('RGB')
          review=cover(review,(1500,980),(0.54,0.42))
          review=grade(review,.62,1.08,.04)
          # Blur upper-center note/text region and lower page copy so it cannot act as embedded product text.
          for box,radius in [((500,80,1030,420),11),((0,500,1500,980),2.3)]:
              region=review.crop(box).filter(ImageFilter.GaussianBlur(radius))
              review.paste(region,box)
          ov=Image.new('RGBA',review.size,(0,0,0,0)); d=ImageDraw.Draw(ov)
          d.line([(120,770),(520,752)],fill=CORAL+(210,),width=7)
          d.ellipse((1090,655,1218,783),outline=CORAL+(225,),width=7)
          review=Image.alpha_composite(review.convert('RGBA'),ov).convert('RGB')
          review.save(out/'human-proof-review.webp','WEBP',quality=82,method=6)

          # Library: emphasize page/spine depth; suppress individual source page content.
          library=Image.open(src/'library.jpg').convert('RGB')
          library=cover(library,(1500,1000),(0.5,0.62))
          library=grade(library,.50,1.11,.06)
          library=library.filter(ImageFilter.GaussianBlur(.65))
          library.save(out/'library-edition-stack.webp','WEBP',quality=82,method=6)

          # Read: blank spread is intentionally clean so all editorial text remains HTML.
          read=Image.open(src/'read.jpg').convert('RGB')
          read=cover(read,(1600,1000),(0.56,0.50))
          read=grade(read,.58,1.04,.035)
          read.save(out/'edition-opening.webp','WEBP',quality=84,method=6)

          # Basic file sanity.
          for p in out.glob('*.webp'):
              im=Image.open(p)
              assert im.width >= 1400 and im.height >= 900, (p, im.size)
              assert p.stat().st_size > 20000, (p, p.stat().st_size)
              print(p, im.size, p.stat().st_size)
          PY
          python /tmp/process_b01_v5.py
      - name: Commit local raster assets to the V5 branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/personal-edition/static/images/v5/*.webp
          if git diff --cached --quiet; then
            echo 'Raster assets already present; nothing to commit.'
            exit 0
          fi
          git commit -m 'assets(B01): add local image-led V5 editorial photography'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
