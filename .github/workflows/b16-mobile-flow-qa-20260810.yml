name: B16 Mobile Matchday Flow QA 20260810

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'reference/business-16-personal-sports-v1/**'
      - '.github/workflows/b16-mobile-flow-qa-20260810.yml'

permissions:
  contents: read

jobs:
  qa:
    if: github.event.pull_request.head.ref == 'fix/b16-mobile-matchday-focus-order-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Diff and static contract checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          test -f reference/business-16-personal-sports-v1/index.html
          test -f reference/business-16-personal-sports-v1/ux.html
          test -f reference/business-16-personal-sports-v1/guide.html
          grep -q 'MATCHDAY → FOCUS → FLOW → MOMENTS → WRAP' reference/business-16-personal-sports-v1/styles/matchday-live-v2.css
          grep -q '\.md-main{display:contents}' reference/business-16-personal-sports-v1/styles/matchday-live-v2-polish.css
          grep -q 'data-team="bay"' reference/business-16-personal-sports-v1/ux.html
          grep -q 'data-save="12′ 첫 압박 전환"' reference/business-16-personal-sports-v1/ux.html

      - name: Start exact branch static site
        shell: bash
        run: |
          set -euo pipefail
          cd reference/business-16-personal-sports-v1
          nohup python -m http.server 8160 --bind 127.0.0.1 >/tmp/b16-http.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8160/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/b16-http.log
          exit 1

      - name: Install browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p /tmp/b16-browser /tmp/b16-qa-evidence
          cd /tmp/b16-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium

      - name: Desktop and mobile browser QA
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/b16-browser
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs'), path = require('path');
          const base='http://127.0.0.1:8160';
          const cases=[
            {name:'desktop',width:1440,height:1100},
            {name:'mobile',width:390,height:844},
          ];
          const surfaces=[['root','/index.html'],['ux','/ux.html'],['guide','/guide.html']];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const results=[];
            for(const c of cases){
              for(const [name,route] of surfaces){
                const ctx=await browser.newContext({viewport:{width:c.width,height:c.height}});
                const p=await ctx.newPage();
                const consoleErrors=[],pageErrors=[],failed=[];
                p.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
                p.on('pageerror',e=>pageErrors.push(e.message));
                p.on('response',r=>{if(r.status()>=400) failed.push(`${r.status()} ${r.url()}`)});
                const resp=await p.goto(base+route,{waitUntil:'networkidle',timeout:45000});
                await p.evaluate(()=>document.fonts.ready); await p.waitForTimeout(300);
                const common=await p.evaluate(()=>({
                  overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                  scrollHeight:document.documentElement.scrollHeight,
                  sticky:[...document.querySelectorAll('body *')].filter(el=>['fixed','sticky'].includes(getComputedStyle(el).position)).map(el=>{const r=el.getBoundingClientRect();return{tag:el.tagName,cls:String(el.className||''),top:r.top,bottom:r.bottom,height:r.height}}).filter(x=>x.bottom>0&&x.top<innerHeight)
                }));
                let flow=null,interaction=null;
                if(name==='ux'){
                  flow=await p.evaluate(()=>{
                    const rect=s=>{const r=document.querySelector(s).getBoundingClientRect();return{top:r.top,bottom:r.bottom,height:r.height}};
                    return {
                      workDisplay:getComputedStyle(document.querySelector('.md-work')).display,
                      mainDisplay:getComputedStyle(document.querySelector('.md-main')).display,
                      matchLabel:rect('.md-main>.md-label'),
                      matchTitle:rect('.md-main>h1'),
                      matchCard:rect('.md-main>.md-match-card'),
                      rail:rect('.md-rail'),
                      flow:rect('.md-main>.md-flow'),
                      flowStatus:rect('.md-main>#flowStatus'),
                      side:rect('.md-side')
                    };
                  });

                  await p.locator('[data-team="bay"]').click();
                  await p.locator('[data-save]').nth(0).click();
                  await p.locator('[data-save]').nth(1).click();
                  await p.locator('#finish').click();
                  interaction=await p.evaluate(()=>({
                    bayPressed:document.querySelector('[data-team="bay"]').getAttribute('aria-pressed'),
                    teamStatus:document.querySelector('#teamStatus').textContent,
                    savedCount:document.querySelectorAll('.md-saved-card').length,
                    flowStatus:document.querySelector('#flowStatus').textContent,
                    wrapStatus:document.querySelector('#wrapStatus').textContent
                  }));
                  await p.reload({waitUntil:'networkidle'});
                  await p.evaluate(()=>document.fonts.ready); await p.waitForTimeout(250);
                }
                const problems=[];
                if(!resp||resp.status()!==200) problems.push('status');
                if(common.overflow>1) problems.push(`overflow ${common.overflow}`);
                if(consoleErrors.length||pageErrors.length||failed.length) problems.push('runtime');
                if(name==='ux'){
                  if(interaction.bayPressed!=='true') problems.push('team toggle failed');
                  if(interaction.savedCount!==2) problems.push(`saved count ${interaction.savedCount}`);
                  if(!interaction.wrapStatus.includes('2개 장면')) problems.push('wrap action failed');
                }
                if(name==='ux'&&c.name==='desktop'){
                  if(flow.workDisplay!=='grid') problems.push(`desktop work display ${flow.workDisplay}`);
                  if(flow.mainDisplay==='contents') problems.push('desktop main unexpectedly contents');
                  if(Math.abs(flow.rail.top-flow.matchLabel.top)>90) problems.push('desktop workspace alignment shifted');
                }
                if(name==='ux'&&c.name==='mobile'){
                  if(flow.workDisplay!=='flex') problems.push(`mobile work display ${flow.workDisplay}`);
                  if(flow.mainDisplay!=='contents') problems.push(`mobile main display ${flow.mainDisplay}`);
                  if(!(flow.matchLabel.top<flow.matchTitle.top&&flow.matchTitle.bottom<=flow.matchCard.top+2&&flow.matchCard.bottom<=flow.rail.top+2&&flow.rail.bottom<=flow.flow.top+2&&flow.flow.bottom<=flow.flowStatus.top+2&&flow.flowStatus.bottom<=flow.side.top+2)) problems.push('mobile matchday numbered flow incorrect');
                  if(flow.rail.top>844) problems.push(`focus starts below first viewport ${flow.rail.top}`);
                }
                await p.screenshot({path:path.join('/tmp/b16-qa-evidence',`${c.name}-${name}.png`),fullPage:false});
                await p.screenshot({path:path.join('/tmp/b16-qa-evidence',`${c.name}-${name}-full.png`),fullPage:true});
                results.push({viewport:c.name,name,status:resp?resp.status():0,consoleErrors,pageErrors,failed,problems,...common,flow,interaction});
                await ctx.close();
              }
            }
            await browser.close();
            const bad=results.filter(r=>r.problems.length);
            fs.writeFileSync('/tmp/b16-qa-evidence/results.json',JSON.stringify({results,bad},null,2));
            console.log(JSON.stringify({count:results.length,bad,results},null,2));
            if(bad.length) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b16-mobile-flow-qa-${{ github.run_number }}
          path: /tmp/b16-qa-evidence
          if-no-files-found: error
          retention-days: 7
