name: Padiem Control Plane CI

on:
  pull_request:
    paths:
      - 'packages/padiem-control-plane/**'
      - '.github/workflows/padiem-control-plane-ci.yml'
      - '.github/workflows/b54-local-agent-broker-production-gate.yml'
      - '.github/workflows/b54-local-agent-ingress-remediation-redeploy.yml'
      - '.github/workflows/b54-local-agent-public-ingress-activation.yml'
      - '.github/scripts/control_plane_ci_overlap_3989.sh'
      - '.github/scripts/connector_bundle_fingerprint.py'
      - '.github/tests/test_connector_bundle_fingerprint.py'
      - '.github/tests/test_3989_control_plane_ci_overlap.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: padiem-control-plane-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  control-plane-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Control Plane package
        run: |
          # #4139: the real Claw TXT projector is exercised by the canonical
          # Broker race regression and imports the existing PADIEM Core.
          # Install the actual package, never a test-only import shim.
          python -m pip install --disable-pip-version-check -e 'packages/padiem-control-plane[dev]' -e packages/padiem-ai-core
          python -m pip check

      - name: Compile Control Plane contracts
        run: |
          python -m compileall -q packages/padiem-control-plane/padiem_control_plane
          python -m py_compile packages/padiem-control-plane/tests/test_contracts.py

      - name: Assert foundation package has no runtime side-effect client
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('packages/padiem-control-plane')
          sources = '\n'.join(
              path.read_text(encoding='utf-8').lower()
              for path in root.rglob('*.py')
          )
          forbidden = (
              'subprocess.',
              'import requests',
              'import httpx',
              'wrangler',
              'stripe',
          )
          assert all(term not in sources for term in forbidden)
          print('PRODUCTION_MUTATION=NO')
          print('DB_MUTATION=NO')
          print('LIVE_BILLING=NO')
          PY

      - name: Set up Node for Python Worker packaging
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install uv for Python Worker packaging
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'

      # #3989: full pytest and all six Worker --dry-run packages remain mandatory.
      # The packaging subtree is a disposable checkout-byte copy, preventing
      # temporary wrangler.jsonc and Python bundle files from racing tests.
      - name: Verify full-suite and six Worker dry-run ownership contract
        run: python .github/tests/test_3989_control_plane_ci_overlap.py

      - name: Verify source-only Connector bundle fingerprint tests
        shell: bash
        run: python -m unittest discover -s .github/tests -p test_connector_bundle_fingerprint.py -q

      - name: Overlap full Control Plane tests and six isolated Worker package dry-runs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          bash .github/scripts/control_plane_ci_overlap_3989.sh

      - name: Retain three redacted private Worker dry-run fingerprints
        uses: actions/upload-artifact@v4
        with:
          name: connector-private-workers-bundle-fingerprints
          path: |
            ${{ runner.temp }}/connector-ci-broker-state-fingerprint.json
            ${{ runner.temp }}/connector-ci-broker-edge-fingerprint.json
            ${{ runner.temp }}/connector-ci-identity-fingerprint.json
          if-no-files-found: error
          retention-days: 30
