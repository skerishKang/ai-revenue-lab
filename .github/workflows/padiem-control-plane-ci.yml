name: Padiem Control Plane CI

on:
  pull_request:
    paths:
      - 'packages/padiem-control-plane/**'
      - '.github/workflows/padiem-control-plane-ci.yml'
      - '.github/workflows/b54-local-agent-broker-production-gate.yml'
      - '.github/workflows/b54-local-agent-ingress-remediation-redeploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Control Plane package
        run: |
          python -m pip install --disable-pip-version-check -e 'packages/padiem-control-plane[dev]'
          python -m pip check

      - name: Compile Control Plane contracts
        run: |
          python -m compileall -q packages/padiem-control-plane/padiem_control_plane
          python -m py_compile packages/padiem-control-plane/tests/test_contracts.py

      - name: Control Plane contract tests
        working-directory: packages/padiem-control-plane
        run: pytest -q

      - name: Assert foundation package has no runtime side-effect client
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('packages/padiem-control-plane')
          sources = '\n'.join(
              path.read_text(encoding='utf-8').lower()
              for path in root.rglob('*.py')
          )
          forbidden = (
              'subprocess.',
              'import requests',
              'import httpx',
              'wrangler',
              'stripe',
          )
          assert all(term not in sources for term in forbidden)
          print('PRODUCTION_MUTATION=NO')
          print('DB_MUTATION=NO')
          print('LIVE_BILLING=NO')
          PY

      - name: Set up Node for Python Worker packaging
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install uv for Python Worker packaging
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'

      - name: Dry-run package Local Agent broker Workers
        working-directory: packages/padiem-control-plane
        shell: bash
        run: |
          set -euo pipefail
          secret_file="${RUNNER_TEMP}/b54-local-agent-ci-secrets.env"
          temp_config="wrangler.jsonc"
          trap 'rm -f "${secret_file}" "${temp_config}"' EXIT
          test ! -e "${temp_config}"
          printf 'LOCAL_AGENT_BROKER_PEPPER=%s\n' "$(python -c 'import secrets; print(secrets.token_hex(32))')" > "${secret_file}"
          chmod 600 "${secret_file}"

          cp wrangler.local-agent-broker.jsonc "${temp_config}"
          uvx --from 'workers-py>=1.17.1,<2' pywrangler deploy \
            --secrets-file "${secret_file}" \
            --dry-run \
            --outdir "${RUNNER_TEMP}/b54-state-dry-run"
          rm -f "${temp_config}"

          cp wrangler.local-agent-broker-edge.jsonc "${temp_config}"
          uvx --from 'workers-py>=1.17.1,<2' pywrangler deploy \
            --dry-run \
            --outdir "${RUNNER_TEMP}/b54-edge-dry-run"
          rm -f "${temp_config}"

          test -d "${RUNNER_TEMP}/b54-state-dry-run"
          test -d "${RUNNER_TEMP}/b54-edge-dry-run"
          echo 'PYTHON_WORKER_PACKAGING_PREFLIGHT=PASS'
          echo 'PRODUCTION_MUTATION=NO'
