name: Provision approved Business Pages

on:
  workflow_dispatch:
    inputs:
      business_id:
        description: Two-digit Business ID
        required: true
        type: string
      project_name:
        description: Dedicated Cloudflare Pages project name
        required: true
        type: string
      source_directory:
        description: Isolated approved Business reference directory
        required: true
        type: string
      approved_sha:
        description: UI_APPROVED full exact head SHA
        required: true
        type: string
      approval_pr:
        description: Draft/merged approval PR number
        required: true
        type: string
      production_branch:
        description: Cloudflare Pages production branch
        required: true
        default: main
        type: string
      existing_project_action:
        description: Verify existing project or migrate its approved source directory
        required: true
        default: verify-only
        type: choice
        options:
          - verify-only
          - migrate-source
      expected_old_source_directory:
        description: Required only for migrate-source; exact currently configured old Business reference directory
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: provision-approved-business-pages-${{ inputs.project_name }}
  cancel-in-progress: false

jobs:
  provision:
    name: Provision approved Business ${{ inputs.business_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUSINESS_ID: ${{ inputs.business_id }}
      PROJECT_NAME: ${{ inputs.project_name }}
      SOURCE_DIRECTORY: ${{ inputs.source_directory }}
      APPROVED_SHA: ${{ inputs.approved_sha }}
      APPROVAL_PR: ${{ inputs.approval_pr }}
      PRODUCTION_BRANCH: ${{ inputs.production_branch }}
      EXISTING_PROJECT_ACTION: ${{ inputs.existing_project_action }}
      EXPECTED_OLD_SOURCE_DIRECTORY: ${{ inputs.expected_old_source_directory }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Require dispatch from the default branch
        env:
          DISPATCH_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          test "${DISPATCH_REF}" = "${DEFAULT_BRANCH}" || {
            echo "This provisioning workflow must be dispatched from the default branch." >&2
            exit 1
          }

      - name: Initialize runtime paths
        shell: bash
        run: |
          set -euo pipefail
          echo "REPOSITORY_METADATA_FILE=${RUNNER_TEMP}/pages-repository-metadata.json" >> "${GITHUB_ENV}"
          echo "MIGRATION_COMMENTS_FILE=${RUNNER_TEMP}/pages-source-migration-comments.json" >> "${GITHUB_ENV}"
          echo "MIGRATION_PATCH_FILE=${RUNNER_TEMP}/pages-source-migration-patch.json" >> "${GITHUB_ENV}"

      - name: Check out trusted workflow authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-authority
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/validate_pages_provisioning.py
            .github/scripts/validate_pages_source_migration.py
          sparse-checkout-cone-mode: false

      - name: Validate source-migration mode contract
        shell: bash
        run: |
          set -euo pipefail
          python3 .workflow-authority/.github/scripts/validate_pages_source_migration.py contract \
            --existing-project-action "${EXISTING_PROJECT_ACTION}" \
            --business-id "${BUSINESS_ID}" \
            --project-name "${PROJECT_NAME}" \
            --source-directory "${SOURCE_DIRECTORY}" \
            --expected-old-source-directory "${EXPECTED_OLD_SOURCE_DIRECTORY}" \
            --approved-sha "${APPROVED_SHA}" \
            --approval-pr "${APPROVAL_PR}" \
            --production-branch "${PRODUCTION_BRANCH}"

      - name: Validate inputs and repository-owner UI approval authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .workflow-authority/.github/scripts/validate_pages_provisioning.py authority \
            --business-id "${BUSINESS_ID}" \
            --project-name "${PROJECT_NAME}" \
            --source-directory "${SOURCE_DIRECTORY}" \
            --approved-sha "${APPROVED_SHA}" \
            --approval-pr "${APPROVAL_PR}" \
            --production-branch "${PRODUCTION_BRANCH}" \
            --repository-metadata-output "${REPOSITORY_METADATA_FILE}"

      - name: Verify exact source-migration owner authority
        if: ${{ inputs.existing_project_action == 'migrate-source' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_TOKEN}" || {
            echo "GITHUB_TOKEN is unavailable." >&2
            exit 1
          }

          comments_file="${MIGRATION_COMMENTS_FILE}"
          printf '[]\n' > "${comments_file}"
          complete=false
          for page in $(seq 1 100); do
            page_file="$(mktemp)"
            merged_file="$(mktemp)"
            status="$({
              curl --silent --show-error \
                --output "${page_file}" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer ${GITHUB_TOKEN}" \
                --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${APPROVAL_PR}/comments?per_page=100&page=${page}"
            })"
            test "${status}" = "200" || {
              echo "GitHub approval comments request failed with HTTP ${status}." >&2
              exit 1
            }
            jq -e 'type == "array"' "${page_file}" >/dev/null
            count="$(jq 'length' "${page_file}")"
            jq -s '.[0] + .[1]' "${comments_file}" "${page_file}" > "${merged_file}"
            mv "${merged_file}" "${comments_file}"
            rm -f "${page_file}"
            if test "${count}" -lt 100; then
              complete=true
              break
            fi
          done
          test "${complete}" = true || {
            echo "GitHub approval comment pagination exceeded the safety bound." >&2
            exit 1
          }

          python3 .workflow-authority/.github/scripts/validate_pages_source_migration.py authority \
            --comments-file "${MIGRATION_COMMENTS_FILE}" \
            --repository-metadata-file "${REPOSITORY_METADATA_FILE}" \
            --project-name "${PROJECT_NAME}" \
            --old-source-directory "${EXPECTED_OLD_SOURCE_DIRECTORY}" \
            --new-source-directory "${SOURCE_DIRECTORY}" \
            --approved-sha "${APPROVED_SHA}"

      - name: Check out approved UI exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}
          path: approved-source
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: ${{ inputs.source_directory }}
          sparse-checkout-cone-mode: false

      - name: Verify exact checkout and source isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 .workflow-authority/.github/scripts/validate_pages_provisioning.py source \
            --repository-root approved-source \
            --source-directory "${SOURCE_DIRECTORY}" \
            --approved-sha "${APPROVED_SHA}"

      - name: Verify Cloudflare credentials and Pages API access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || {
            echo "CLOUDFLARE_API_TOKEN is not configured." >&2
            exit 1
          }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || {
            echo "CLOUDFLARE_ACCOUNT_ID is not configured." >&2
            exit 1
          }

          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT
          status="$({
            curl --silent --show-error \
              --connect-timeout 15 \
              --max-time 60 \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects?per_page=1"
          })"
          test "${status}" = "200" || {
            echo "Cloudflare Pages API access failed with HTTP ${status}." >&2
            exit 1
          }
          jq -e '.success == true and (.result | type == "array")' "${response_file}" >/dev/null

      - name: Ensure the exact GitHub-integrated Pages project exists
        id: project
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          request_file="$(mktemp)"
          post_file="$(mktemp)"
          trap 'rm -f "${response_file}" "${request_file}" "${post_file}"' EXIT
          project_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}"

          status="$({
            curl --silent --show-error \
              --connect-timeout 15 \
              --max-time 60 \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              "${project_url}"
          })"

          migration_result="not-requested"
          old_source=""

          lookup_state="$(
            python3 .workflow-authority/.github/scripts/validate_pages_provisioning.py cloudflare-lookup \
              --status "${status}" \
              --response-file "${response_file}" \
            | head -n 1
          )"

          case "${lookup_state}" in
            exists)
              if test "${EXISTING_PROJECT_ACTION}" = "verify-only"; then
                python3 .workflow-authority/.github/scripts/validate_pages_provisioning.py cloudflare-project \
                  --repository-metadata-file "${REPOSITORY_METADATA_FILE}" \
                  --project-name "${PROJECT_NAME}" \
                  --source-directory "${SOURCE_DIRECTORY}" \
                  --production-branch "${PRODUCTION_BRANCH}" \
                  --response-file "${response_file}"
                project_state="already-existed"
                migration_result="verify-only-no-mutation"
              else
                old_source="${EXPECTED_OLD_SOURCE_DIRECTORY%/}"

                # Pre-mutation GET must match the exact old source AND every
                # repository/branch/deployment flag checked by the existing validator.
                python3 .workflow-authority/.github/scripts/validate_pages_provisioning.py cloudflare-project \
                  --repository-metadata-file "${REPOSITORY_METADATA_FILE}" \
                  --project-name "${PROJECT_NAME}" \
                  --source-directory "${EXPECTED_OLD_SOURCE_DIRECTORY}" \
                  --production-branch "${PRODUCTION_BRANCH}" \
                  --response-file "${response_file}"

                python3 .workflow-authority/.github/scripts/validate_pages_source_migration.py patch-payload \
                  --business-id "${BUSINESS_ID}" \
                  --source-directory "${SOURCE_DIRECTORY}" \
                  --production-branch "${PRODUCTION_BRANCH}" \
                  --repository-metadata-file "${REPOSITORY_METADATA_FILE}" \
                  --output "${MIGRATION_PATCH_FILE}"

                patch_status="$({
                  curl --silent --show-error \
                    -X PATCH \
                    --output "${post_file}" \
                    --write-out '%{http_code}' \
                    --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                    --header 'Content-Type: application/json' \
                    --data-binary "@${MIGRATION_PATCH_FILE}" \
                    "${project_url}"
                })"
                test "${patch_status}" = "200" || {
                  echo "Cloudflare Pages source migration failed with HTTP ${patch_status}." >&2
                  exit 1
                }
                jq -e '.success == true' "${post_file}" >/dev/null

                post_status="$({
                  curl --silent --show-error \
                    --output "${post_file}" \
                    --write-out '%{http_code}' \
                    --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                    --header 'Content-Type: application/json' \
                    "${project_url}"
                })"
                test "${post_status}" = "200" || {
                  echo "Cloudflare Pages post-migration lookup failed with HTTP ${post_status}." >&2
                  exit 1
                }
                python3 .workflow-authority/.github/scripts/validate_pages_provisioning.py cloudflare-project \
                  --repository-metadata-file "${REPOSITORY_METADATA_FILE}" \
                  --project-name "${PROJECT_NAME}" \
                  --source-directory "${SOURCE_DIRECTORY}" \
                  --production-branch "${PRODUCTION_BRANCH}" \
                  --response-file "${post_file}"

                project_state="migrated"
                migration_result="source-migrated-and-identity-verified"
              fi
              ;;
            missing)
              if test "${EXISTING_PROJECT_ACTION}" = "migrate-source"; then
                echo "migrate-source requires an existing Pages project; refusing create/recreate." >&2
                exit 1
              fi

              python3 .workflow-authority/.github/scripts/validate_pages_provisioning.py cloudflare-payload \
                --repository-metadata-file "${REPOSITORY_METADATA_FILE}" \
                --project-name "${PROJECT_NAME}" \
                --source-directory "${SOURCE_DIRECTORY}" \
                --production-branch "${PRODUCTION_BRANCH}" \
                --output "${request_file}"
              create_status="$({
                curl --silent --show-error \
                  --connect-timeout 15 \
                  --max-time 60 \
                  --request POST \
                  --output "${response_file}" \
                  --write-out '%{http_code}' \
                  --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  --header 'Content-Type: application/json' \
                  --data-binary "@${request_file}" \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
              })"
              case "${create_status}" in
                200|201) ;;
                *)
                  echo "Cloudflare Pages project creation failed with HTTP ${create_status}." >&2
                  exit 1
                  ;;
              esac
              python3 .workflow-authority/.github/scripts/validate_pages_provisioning.py cloudflare-project \
                --repository-metadata-file "${REPOSITORY_METADATA_FILE}" \
                --project-name "${PROJECT_NAME}" \
                --source-directory "${SOURCE_DIRECTORY}" \
                --production-branch "${PRODUCTION_BRANCH}" \
                --response-file "${response_file}"
              project_state="created"
              migration_result="verify-only-created-project"
              ;;
            *)
              echo "Cloudflare project lookup validator returned an unexpected state." >&2
              exit 1
              ;;
          esac

          echo "state=${project_state}" >> "${GITHUB_OUTPUT}"
          echo "action=${EXISTING_PROJECT_ACTION}" >> "${GITHUB_OUTPUT}"
          echo "old_source=${old_source}" >> "${GITHUB_OUTPUT}"
          echo "new_source=${SOURCE_DIRECTORY%/}" >> "${GITHUB_OUTPUT}"
          echo "migration_result=${migration_result}" >> "${GITHUB_OUTPUT}"

      - name: Deploy the approved exact head
        id: deploy
        working-directory: approved-source
        shell: bash
        run: |
          set -euo pipefail
          output_file="$(mktemp)"
          clean_output="$(mktemp)"
          trap 'rm -f "${output_file}" "${clean_output}"' EXIT

          npx --yes wrangler@4 pages deploy "${SOURCE_DIRECTORY}" \
            --project-name "${PROJECT_NAME}" \
            --branch "${PRODUCTION_BRANCH}" \
            --commit-hash "${APPROVED_SHA}" \
            --commit-message "UI_APPROVED Business ${BUSINESS_ID} exact head" \
            --commit-dirty=false 2>&1 | tee "${output_file}"

          sed -E $'s/\x1B\[[0-9;]*[A-Za-z]//g' "${output_file}" > "${clean_output}"
          deployment_url="$({
            grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' "${clean_output}" || true
          } | grep -E "(^https://${PROJECT_NAME}\.pages\.dev$|\.${PROJECT_NAME}\.pages\.dev$)" | head -n 1 || true)"
          test -n "${deployment_url}" || {
            echo "Wrangler did not report a deployment URL for the exact project." >&2
            exit 1
          }
          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"

      - name: Verify project, deployment metadata, and public bytes
        id: verify
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          project_file="$(mktemp)"
          deployments_file="$(mktemp)"
          selected_file="$(mktemp)"
          deployment_metadata="$(mktemp)"
          trap 'rm -f "${project_file}" "${deployments_file}" "${selected_file}" "${deployment_metadata}"' EXIT

          project_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}"
          project_status="$({
            curl --silent --show-error --connect-timeout 15 --max-time 60 \
              --output "${project_file}" --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${project_url}"
          })"
          test "${project_status}" = "200" || {
            echo "Cloudflare project verification failed with HTTP ${project_status}." >&2
            exit 1
          }
          python3 .workflow-authority/.github/scripts/validate_pages_provisioning.py cloudflare-project \
            --repository-metadata-file "${REPOSITORY_METADATA_FILE}" \
            --project-name "${PROJECT_NAME}" \
            --source-directory "${SOURCE_DIRECTORY}" \
            --production-branch "${PRODUCTION_BRANCH}" \
            --response-file "${project_file}"

          deployments_url="${project_url}/deployments?per_page=20"
          found=false
          for attempt in $(seq 1 10); do
            deployments_status="$({
              curl --silent --show-error --connect-timeout 15 --max-time 60 \
                --output "${deployments_file}" --write-out '%{http_code}' \
                --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${deployments_url}"
            })"
            test "${deployments_status}" = "200" || {
              echo "Cloudflare deployment lookup failed with HTTP ${deployments_status}." >&2
              exit 1
            }
            jq -e '.success == true and (.result | type == "array")' "${deployments_file}" >/dev/null
            if jq -e --arg url "${DEPLOYMENT_URL}" \
              '.result[] | select((.url // "") == $url)' "${deployments_file}" > "${selected_file}"; then
              found=true
              break
            fi
            sleep 3
          done
          test "${found}" = true || {
            echo "The deployment API did not return the Wrangler deployment URL." >&2
            exit 1
          }

          python3 .workflow-authority/.github/scripts/validate_pages_provisioning.py cloudflare-deployment \
            --response-file "${selected_file}" \
            --project-name "${PROJECT_NAME}" \
            --approved-sha "${APPROVED_SHA}" \
            --production-branch "${PRODUCTION_BRANCH}" \
            --deployment-url "${DEPLOYMENT_URL}" \
            --output "${deployment_metadata}"

          expected_file="approved-source/${SOURCE_DIRECTORY%/}/index.html"
          expected_production_url="https://${PROJECT_NAME}.pages.dev/"

          python3 .workflow-authority/.github/scripts/validate_pages_provisioning.py verify-public-url \
            --url "${DEPLOYMENT_URL}/" \
            --expected-file "${expected_file}" \
            --deadline 300

          python3 .workflow-authority/.github/scripts/validate_pages_provisioning.py verify-public-url \
            --url "${expected_production_url}" \
            --expected-file "${expected_file}" \
            --deadline 300

          deployment_id="$(jq -r '.deployment_id' "${deployment_metadata}")"
          commit_verification="$(jq -r '.commit_verification' "${deployment_metadata}")"
          deployment_status="$(jq -r '.deployment_status' "${deployment_metadata}")"
          echo "deployment_id=${deployment_id}" >> "${GITHUB_OUTPUT}"
          echo "commit_verification=${commit_verification}" >> "${GITHUB_OUTPUT}"
          echo "deployment_status=${deployment_status}" >> "${GITHUB_OUTPUT}"
          echo "production_url=${expected_production_url}" >> "${GITHUB_OUTPUT}"
          echo "result=github-project-deployment-and-public-bytes-verified" >> "${GITHUB_OUTPUT}"

      - name: Publish provisioning summary
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          PROJECT_STATE: ${{ steps.project.outputs.state }}
          EXISTING_ACTION: ${{ steps.project.outputs.action }}
          OLD_SOURCE: ${{ steps.project.outputs.old_source }}
          NEW_SOURCE: ${{ steps.project.outputs.new_source }}
          MIGRATION_RESULT: ${{ steps.project.outputs.migration_result }}
          DEPLOYMENT_ID: ${{ steps.verify.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          PRODUCTION_URL: ${{ steps.verify.outputs.production_url }}
          DEPLOYMENT_STATUS: ${{ steps.verify.outputs.deployment_status }}
          COMMIT_VERIFICATION: ${{ steps.verify.outputs.commit_verification }}
          VERIFICATION_RESULT: ${{ steps.verify.outputs.result }}
        shell: bash
        run: |
          set -euo pipefail
          safe_value() {
            local value="$1"
            value="$(printf '%s' "${value}" | tr -cd 'A-Za-z0-9._/#:-')"
            if test -z "${value}"; then
              value="not-returned"
            fi
            printf '%s' "${value:0:240}"
          }
          {
            echo "## Approved Business Pages provisioning"
            echo
            echo "- Job status: \`$(safe_value "${JOB_STATUS}")\`"
            echo "- Business ID: \`$(safe_value "${BUSINESS_ID}")\`"
            echo "- Approval PR: \`#$(safe_value "${APPROVAL_PR}")\`"
            echo "- Approved exact SHA: \`$(safe_value "${APPROVED_SHA}")\`"
            echo "- Existing-project action: \`$(safe_value "${EXISTING_ACTION}")\`"
            echo "- Expected old source: \`$(safe_value "${OLD_SOURCE:-not-applicable}")\`"
            echo "- Approved new source: \`$(safe_value "${NEW_SOURCE}")\`"
            echo "- Source directory: \`$(safe_value "${SOURCE_DIRECTORY}")\`"
            echo "- Pages project: \`$(safe_value "${PROJECT_NAME}")\`"
            echo "- Project state: \`$(safe_value "${PROJECT_STATE}")\`"
            echo "- Source migration result: \`$(safe_value "${MIGRATION_RESULT}")\`"
            echo "- Repository: \`$(safe_value "${GITHUB_REPOSITORY}")\`"
            echo "- Production branch: \`$(safe_value "${PRODUCTION_BRANCH}")\`"
            echo "- Deployment ID: \`$(safe_value "${DEPLOYMENT_ID}")\`"
            echo "- Actual deployment URL: $(safe_value "${DEPLOYMENT_URL}")"
            echo "- Expected production URL: $(safe_value "${PRODUCTION_URL}")"
            echo "- Deployment status: \`$(safe_value "${DEPLOYMENT_STATUS}")\`"
            echo "- Cloudflare commit metadata: \`$(safe_value "${COMMIT_VERIFICATION}")\`"
            echo "- Verification: \`$(safe_value "${VERIFICATION_RESULT}")\`"
          } >> "${GITHUB_STEP_SUMMARY}"
