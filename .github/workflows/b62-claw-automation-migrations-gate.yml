name: B62 Claw Automation Migrations 018/019 Gate

on:
  pull_request:
    paths:
      - ".github/workflows/b62-claw-automation-migrations-gate.yml"
      - ".github/scripts/b62_claw_automation_migrations_schema.py"
      - ".github/tests/test_b62_claw_automation_migrations_gate.py"
      - "apps/padiem-chat/migrations/018_claw_automation_durable_store.sql"
      - "apps/padiem-chat/migrations/019_claw_automation_rule_provenance.sql"
  workflow_dispatch:
    inputs:
      mode:
        description: "Automation migration gate mode"
        required: true
        type: choice
        default: repository_preflight
        options:
          - repository_preflight
          - cloudflare_readonly
          - apply_migration_018
          - apply_migration_019
      target_sha:
        description: "Exact current main SHA"
        required: true
        type: string
      confirmation:
        description: "Exact mutation confirmation phrase"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: b62-claw-automation-migrations-gate
  cancel-in-progress: false

env:
  B62_WORKER: padiem-chat
  D1_BINDING: PADIEM_CHAT_DB
  TARGET_SHA: ${{ inputs.target_sha }}

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR exact head
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact dispatch SHA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Require exact current main for dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'PREMUTATION_EXACT_MAIN_SHA=PASS'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run migration gate contract tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest
          python -m pytest .github/tests/test_b62_claw_automation_migrations_gate.py -q
      - name: Source-only evidence
        run: |
          echo 'B62_CLAW_AUTOMATION_MIGRATIONS_SOURCE_CONTRACT=PASS'
          echo 'PRODUCTION_MUTATION=0'
          echo 'MIGRATION_APPLY=0'
          echo 'D1_ROW_DATA_READ=0'

  cloudflare-readonly:
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'repository_preflight' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      migration_018: ${{ steps.schema018.outputs.state }}
      migration_019: ${{ steps.schema019.outputs.state }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Reconfirm exact main before live readback
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'READONLY_EXACT_MAIN_SHA=PASS'
      - name: Resolve live D1 binding without emitting identifiers
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          settings="${RUNNER_TEMP}/b62-automation-migrations-settings.json"
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" -o "${settings}"
          DB_ID="$(python - "${settings}" "${D1_BINDING}" <<'PY'
          import json, re, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          if payload.get('success') is not True:
              raise SystemExit('worker settings read failed')
          bindings = payload.get('result', {}).get('bindings', [])
          hits = [b for b in bindings if b.get('type') == 'd1' and b.get('name') == sys.argv[2]]
          if len(hits) != 1:
              raise SystemExit('expected exactly one live PADIEM_CHAT_DB binding')
          database_id = hits[0].get('id')
          if not isinstance(database_id, str) or not re.fullmatch(r'[0-9a-fA-F-]{32,36}', database_id):
              raise SystemExit('live PADIEM_CHAT_DB binding has invalid database id')
          print(database_id)
          PY
          )"
          test -n "${DB_ID}"
          echo "::add-mask::${DB_ID}"
          echo "DB_ID=${DB_ID}" >> "${GITHUB_ENV}"
          echo 'LIVE_PADIEM_CHAT_DB_DERIVED=PASS'
          echo 'D1_IDENTIFIER_OUTPUT=0'
      - name: Read migration 018 schema
        id: schema018
        shell: bash
        run: |
          set -euo pipefail
          query="${RUNNER_TEMP}/b62-automation-018-query.json"
          python - "${query}" <<'PY'
          import json, sys
          sql = """SELECT name, type, sql FROM sqlite_master WHERE name IN ('claw_rules','claw_runs','claw_occurrences','claw_proposals','idx_claw_rules_workspace','idx_claw_runs_workspace_status','idx_claw_occurrences_workspace','idx_claw_proposals_workspace') ORDER BY name;
          PRAGMA table_info(claw_rules);
          PRAGMA table_info(claw_runs);
          PRAGMA table_info(claw_occurrences);
          PRAGMA table_info(claw_proposals);
          PRAGMA index_info(idx_claw_rules_workspace);
          PRAGMA index_info(idx_claw_runs_workspace_status);
          PRAGMA index_info(idx_claw_occurrences_workspace);
          PRAGMA index_info(idx_claw_proposals_workspace);
          SELECT name, type, sql FROM sqlite_master WHERE name IN ('idx_claw_rules_workspace','idx_claw_runs_workspace_status','idx_claw_occurrences_workspace','idx_claw_proposals_workspace') ORDER BY name;"""
          with open(sys.argv[1], 'w', encoding='utf-8') as handle:
              json.dump({'sql': sql}, handle)
          PY
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          response="${RUNNER_TEMP}/b62-automation-018-schema.json"
          curl -fsS -X POST "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" --data-binary "@${query}" -o "${response}"
          evidence="$(python .github/scripts/b62_claw_automation_migrations_schema.py 018 "${response}")"
          echo "${evidence}"
          state="$(printf '%s\n' "${evidence}" | sed -n 's/^B62_CLAW_AUTOMATION_MIGRATION_018_SCHEMA=//p' | tr '[:upper:]' '[:lower:]')"
          case "${state}" in exact|missing|drift) ;; *) exit 1 ;; esac
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          echo 'D1_SCHEMA_QUERY=READ_ONLY'
          echo 'ROW_DATA_READ=0'
          echo 'PRODUCTION_MUTATION=0'
          echo 'MIGRATION_APPLY=0'
      - name: Read migration 019 schema
        id: schema019
        shell: bash
        run: |
          set -euo pipefail
          query="${RUNNER_TEMP}/b62-automation-019-query.json"
          python - "${query}" <<'PY'
          import json, sys
          with open(sys.argv[1], 'w', encoding='utf-8') as handle:
              json.dump({'sql': 'PRAGMA table_info(claw_rules);'}, handle)
          PY
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          response="${RUNNER_TEMP}/b62-automation-019-schema.json"
          curl -fsS -X POST "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" --data-binary "@${query}" -o "${response}"
          evidence="$(python .github/scripts/b62_claw_automation_migrations_schema.py 019 "${response}")"
          echo "${evidence}"
          state="$(printf '%s\n' "${evidence}" | sed -n 's/^B62_CLAW_AUTOMATION_MIGRATION_019_SCHEMA=//p' | tr '[:upper:]' '[:lower:]')"
          case "${state}" in exact|missing|drift) ;; *) exit 1 ;; esac
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          echo 'D1_SCHEMA_QUERY=READ_ONLY'
          echo 'ROW_DATA_READ=0'
          echo 'PRODUCTION_MUTATION=0'
          echo 'MIGRATION_APPLY=0'

  apply-migration-018:
    needs: [source-contract, cloudflare-readonly]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply_migration_018' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRMATION: ${{ inputs.confirmation }}
      READONLY_SCHEMA_STATE: ${{ needs.cloudflare-readonly.outputs.migration_018 }}
    steps:
      - name: Require explicit migration authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${CONFIRMATION}" = "APPLY_B62_CLAW_AUTOMATION_MIGRATION_018_FROM_EXACT_MAIN"
          case "${READONLY_SCHEMA_STATE}" in exact|missing) ;; *) exit 1 ;; esac
          echo 'B62_CLAW_AUTOMATION_MIGRATION_018_AUTHORIZATION=PASS'
      - name: Checkout exact approved main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Reconfirm exact main immediately before mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'PREMUTATION_EXACT_MAIN_SHA=PASS'
      - name: Re-resolve the live D1 binding immediately before mutation
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          settings="${RUNNER_TEMP}/b62-automation-migrations-settings-pre018.json"
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" -o "${settings}"
          DB_ID="$(python - "${settings}" "${D1_BINDING}" <<'PY'
          import json, re, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          bindings = payload.get('result', {}).get('bindings', []) if payload.get('success') is True else []
          hits = [b for b in bindings if b.get('type') == 'd1' and b.get('name') == sys.argv[2]]
          if len(hits) != 1:
              raise SystemExit('expected exactly one live PADIEM_CHAT_DB binding')
          database_id = hits[0].get('id')
          if not isinstance(database_id, str) or not re.fullmatch(r'[0-9a-fA-F-]{32,36}', database_id):
              raise SystemExit('live PADIEM_CHAT_DB binding has invalid database id')
          print(database_id)
          PY
          )"
          test -n "${DB_ID}"
          echo "::add-mask::${DB_ID}"
          echo "DB_ID=${DB_ID}" >> "${GITHUB_ENV}"
          echo 'PREMUTATION_LIVE_PADIEM_CHAT_DB_DERIVED=PASS'
          echo 'D1_IDENTIFIER_OUTPUT=0'
      - name: Apply only migration 018 when absent
        if: ${{ env.READONLY_SCHEMA_STATE == 'missing' }}
        shell: bash
        run: |
          set -euo pipefail
          migration="apps/padiem-chat/migrations/018_claw_automation_durable_store.sql"
          test -f "${migration}"
          payload="${RUNNER_TEMP}/b62-automation-018-apply.json"
          python - "${migration}" "${payload}" <<'PY'
          import json, sys
          sql = open(sys.argv[1], encoding='utf-8').read()
          for token in ('CREATE TABLE IF NOT EXISTS claw_rules', 'CREATE TABLE IF NOT EXISTS claw_runs', 'CREATE TABLE IF NOT EXISTS claw_occurrences', 'CREATE TABLE IF NOT EXISTS claw_proposals', 'CREATE INDEX IF NOT EXISTS idx_claw_rules_workspace'):
              if token not in sql:
                  raise SystemExit('migration 018 contract missing')
          with open(sys.argv[2], 'w', encoding='utf-8') as handle:
              json.dump({'sql': sql}, handle)
          PY
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          result="${RUNNER_TEMP}/b62-automation-018-apply-result.json"
          curl -fsS -X POST "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" --data-binary "@${payload}" -o "${result}"
          jq -e '.success == true and (.result | type == "array") and all(.result[]; .success == true)' "${result}" >/dev/null
          echo 'B62_CLAW_AUTOMATION_MIGRATION_018=APPLIED'
          echo 'PRODUCTION_MUTATION=1'
      - name: Record no-op when migration 018 is already exact
        if: ${{ env.READONLY_SCHEMA_STATE == 'exact' }}
        run: |
          echo 'B62_CLAW_AUTOMATION_MIGRATION_018=SKIPPED_ALREADY_APPLIED'
          echo 'PRODUCTION_MUTATION=0'
      - name: Read back exact migration 018 schema
        shell: bash
        run: |
          set -euo pipefail
          query="${RUNNER_TEMP}/b62-automation-018-schema-query-after.json"
          python - "${query}" <<'PY'
          import json, sys
          sql = """SELECT name, type, sql FROM sqlite_master WHERE name IN ('claw_rules','claw_runs','claw_occurrences','claw_proposals','idx_claw_rules_workspace','idx_claw_runs_workspace_status','idx_claw_occurrences_workspace','idx_claw_proposals_workspace') ORDER BY name;
          PRAGMA table_info(claw_rules);
          PRAGMA table_info(claw_runs);
          PRAGMA table_info(claw_occurrences);
          PRAGMA table_info(claw_proposals);
          PRAGMA index_info(idx_claw_rules_workspace);
          PRAGMA index_info(idx_claw_runs_workspace_status);
          PRAGMA index_info(idx_claw_occurrences_workspace);
          PRAGMA index_info(idx_claw_proposals_workspace);
          SELECT name, type, sql FROM sqlite_master WHERE name IN ('idx_claw_rules_workspace','idx_claw_runs_workspace_status','idx_claw_occurrences_workspace','idx_claw_proposals_workspace') ORDER BY name;"""
          with open(sys.argv[1], 'w', encoding='utf-8') as handle:
              json.dump({'sql': sql}, handle)
          PY
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          response="${RUNNER_TEMP}/b62-automation-018-schema-after.json"
          curl -fsS -X POST "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" --data-binary "@${query}" -o "${response}"
          evidence="$(python .github/scripts/b62_claw_automation_migrations_schema.py 018 "${response}")"
          test "${evidence}" = 'B62_CLAW_AUTOMATION_MIGRATION_018_SCHEMA=EXACT'
          echo "${evidence}"
          echo 'B62_CLAW_AUTOMATION_MIGRATION_018_POST_READBACK=PASS'
          echo 'WORKER_DEPLOYED=0'
          echo 'BINDING_MUTATION=0'
          echo 'UNRELATED_MIGRATION_APPLY=0'
          echo 'ROW_DATA_READ=0'

  apply-migration-019:
    needs: [source-contract, cloudflare-readonly]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply_migration_019' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRMATION: ${{ inputs.confirmation }}
      READONLY_SCHEMA_018_STATE: ${{ needs.cloudflare-readonly.outputs.migration_018 }}
      READONLY_SCHEMA_019_STATE: ${{ needs.cloudflare-readonly.outputs.migration_019 }}
    steps:
      - name: Require explicit migration authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${CONFIRMATION}" = "APPLY_B62_CLAW_AUTOMATION_MIGRATION_019_FROM_EXACT_MAIN"
          test "${READONLY_SCHEMA_018_STATE}" = "exact"
          case "${READONLY_SCHEMA_019_STATE}" in exact|missing) ;; *) exit 1 ;; esac
          echo 'B62_CLAW_AUTOMATION_MIGRATION_019_AUTHORIZATION=PASS'
      - name: Checkout exact approved main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Reconfirm exact main immediately before mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'PREMUTATION_EXACT_MAIN_SHA=PASS'
      - name: Re-resolve the live D1 binding immediately before mutation
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          settings="${RUNNER_TEMP}/b62-automation-migrations-settings-pre019.json"
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" -o "${settings}"
          DB_ID="$(python - "${settings}" "${D1_BINDING}" <<'PY'
          import json, re, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          bindings = payload.get('result', {}).get('bindings', []) if payload.get('success') is True else []
          hits = [b for b in bindings if b.get('type') == 'd1' and b.get('name') == sys.argv[2]]
          if len(hits) != 1:
              raise SystemExit('expected exactly one live PADIEM_CHAT_DB binding')
          database_id = hits[0].get('id')
          if not isinstance(database_id, str) or not re.fullmatch(r'[0-9a-fA-F-]{32,36}', database_id):
              raise SystemExit('live PADIEM_CHAT_DB binding has invalid database id')
          print(database_id)
          PY
          )"
          test -n "${DB_ID}"
          echo "::add-mask::${DB_ID}"
          echo "DB_ID=${DB_ID}" >> "${GITHUB_ENV}"
          echo 'PREMUTATION_LIVE_PADIEM_CHAT_DB_DERIVED=PASS'
          echo 'D1_IDENTIFIER_OUTPUT=0'
      - name: Apply only migration 019 when absent
        if: ${{ env.READONLY_SCHEMA_019_STATE == 'missing' }}
        shell: bash
        run: |
          set -euo pipefail
          migration="apps/padiem-chat/migrations/019_claw_automation_rule_provenance.sql"
          test -f "${migration}"
          payload="${RUNNER_TEMP}/b62-automation-019-apply.json"
          python - "${migration}" "${payload}" <<'PY'
          import json, sys
          sql = open(sys.argv[1], encoding='utf-8').read()
          if 'ALTER TABLE claw_rules ADD COLUMN canonical_subject_id TEXT;' not in sql:
              raise SystemExit('migration 019 contract missing')
          with open(sys.argv[2], 'w', encoding='utf-8') as handle:
              json.dump({'sql': sql}, handle)
          PY
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          result="${RUNNER_TEMP}/b62-automation-019-apply-result.json"
          curl -fsS -X POST "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" --data-binary "@${payload}" -o "${result}"
          jq -e '.success == true and (.result | type == "array") and all(.result[]; .success == true)' "${result}" >/dev/null
          echo 'B62_CLAW_AUTOMATION_MIGRATION_019=APPLIED'
          echo 'PRODUCTION_MUTATION=1'
      - name: Record no-op when migration 019 is already exact
        if: ${{ env.READONLY_SCHEMA_019_STATE == 'exact' }}
        run: |
          echo 'B62_CLAW_AUTOMATION_MIGRATION_019=SKIPPED_ALREADY_APPLIED'
          echo 'PRODUCTION_MUTATION=0'
      - name: Read back exact migration 019 schema
        shell: bash
        run: |
          set -euo pipefail
          query="${RUNNER_TEMP}/b62-automation-019-schema-query-after.json"
          python - "${query}" <<'PY'
          import json, sys
          with open(sys.argv[1], 'w', encoding='utf-8') as handle:
              json.dump({'sql': 'PRAGMA table_info(claw_rules);'}, handle)
          PY
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          response="${RUNNER_TEMP}/b62-automation-019-schema-after.json"
          curl -fsS -X POST "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" --data-binary "@${query}" -o "${response}"
          evidence="$(python .github/scripts/b62_claw_automation_migrations_schema.py 019 "${response}")"
          test "${evidence}" = 'B62_CLAW_AUTOMATION_MIGRATION_019_SCHEMA=EXACT'
          echo "${evidence}"
          echo 'B62_CLAW_AUTOMATION_MIGRATION_019_POST_READBACK=PASS'
          echo 'WORKER_DEPLOYED=0'
          echo 'BINDING_MUTATION=0'
          echo 'UNRELATED_MIGRATION_APPLY=0'
          echo 'ROW_DATA_READ=0'
