name: B14 Mobile Connection Order QA 20260810

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/korean-ai-platform/**'
      - '.github/workflows/b14-mobile-order-qa-20260810.yml'

permissions:
  contents: read

jobs:
  qa:
    if: github.event.pull_request.head.ref == 'fix/b14-mobile-connection-order-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Regression and diff checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b14-qa-evidence /tmp/b14-test-shim/fastapi
          cat > /tmp/b14-test-shim/fastapi/__init__.py <<'PY'
          # Test-only compatibility namespace for stale FastAPI TestClient imports.
          PY
          cat > /tmp/b14-test-shim/fastapi/testclient.py <<'PY'
          from starlette.testclient import TestClient
          __all__ = ["TestClient"]
          PY
          git diff --check origin/main...HEAD
          cd apps/korean-ai-platform
          python -m pip install -e . 'pytest>=8.3,<9' pytest-asyncio 'uvicorn>=0.32,<1'
          PYTHONPATH="/tmp/b14-test-shim:${PYTHONPATH:-}" python -m pytest -q

      - name: Start exact branch app
        shell: bash
        run: |
          set -euo pipefail
          cd apps/korean-ai-platform
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8140 >/tmp/b14-uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8140/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/b14-uvicorn.log
          exit 1

      - name: Install browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p /tmp/b14-browser && cd /tmp/b14-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium

      - name: Desktop and mobile browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b14-qa-evidence
          cd /tmp/b14-browser
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const cases = [
            {name:'desktop', width:1440, height:1100},
            {name:'mobile', width:390, height:844},
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const results=[];
            for(const c of cases){
              const ctx=await browser.newContext({viewport:{width:c.width,height:c.height}});
              const p=await ctx.newPage();
              const consoleErrors=[], pageErrors=[], failed=[];
              p.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
              p.on('pageerror',e=>pageErrors.push(e.message));
              p.on('response',r=>{if(r.status()>=400) failed.push(`${r.status()} ${r.url()}`)});
              const resp=await p.goto('http://127.0.0.1:8140/workspace',{waitUntil:'networkidle',timeout:45000});
              await p.evaluate(()=>document.fonts.ready);
              await p.waitForTimeout(300);
              const m=await p.evaluate(()=>{
                const root=document.documentElement;
                const h1=document.querySelector('.console-heading h1');
                const hc=getComputedStyle(h1), hr=h1.getBoundingClientRect();
                const connection=document.querySelector('.connection-panel').getBoundingClientRect();
                const session=document.querySelector('.session-panel').getBoundingClientRect();
                const model=document.querySelector('#ws_model').getBoundingClientRect();
                const key=document.querySelector('#ws_key').getBoundingClientRect();
                return {
                  overflow:root.scrollWidth-root.clientWidth,
                  h1:{font:parseFloat(hc.fontSize),line:parseFloat(hc.lineHeight),ratio:parseFloat(hc.lineHeight)/parseFloat(hc.fontSize),top:hr.top,bottom:hr.bottom},
                  connection:{top:connection.top,bottom:connection.bottom,height:connection.height},
                  session:{top:session.top,bottom:session.bottom,height:session.height},
                  model:{top:model.top,bottom:model.bottom},
                  key:{top:key.top,bottom:key.bottom},
                };
              });
              const problems=[];
              if(!resp || resp.status()!==200) problems.push('status');
              if(m.overflow>1) problems.push(`overflow ${m.overflow}`);
              if(m.h1.ratio<1) problems.push(`h1 tight ${m.h1.ratio}`);
              if(consoleErrors.length||pageErrors.length||failed.length) problems.push('runtime errors');
              if(c.name==='desktop' && Math.abs(m.connection.top-m.session.top)>2) problems.push('desktop panel alignment changed');
              if(c.name==='mobile' && !(m.connection.top<m.session.top)) problems.push('connection does not precede session');
              if(c.name==='mobile' && !(m.key.top<m.session.top)) problems.push('key control does not precede session');
              await p.screenshot({path:path.join('/tmp/b14-qa-evidence',`${c.name}.png`),fullPage:false});
              await p.screenshot({path:path.join('/tmp/b14-qa-evidence',`${c.name}-full.png`),fullPage:true});
              results.push({viewport:c.name,status:resp?resp.status():0,consoleErrors,pageErrors,failed,problems,...m});
              await ctx.close();
            }
            await browser.close();
            const bad=results.filter(r=>r.problems.length);
            fs.writeFileSync('/tmp/b14-qa-evidence/results.json',JSON.stringify({results,bad},null,2));
            console.log(JSON.stringify({results,bad},null,2));
            if(bad.length) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b14-mobile-order-qa-${{ github.run_number }}
          path: /tmp/b14-qa-evidence
          if-no-files-found: error
          retention-days: 7
