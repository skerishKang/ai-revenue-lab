name: Validate B13 Private Cinema Ledger V2 20260810
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/personal-video-archive/**'
      - '.github/workflows/validate-b13-private-cinema-ledger-v2-20260810.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/b13-private-cinema-ledger-v2-20260810
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test B13
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'apps/personal-video-archive[dev]'
          cd apps/personal-video-archive
          python -m pytest tests/test_static_production_review_465.py tests/test_static_preview.py -q
          python scripts/build_static_production.py
          test -f static-production/static/cinema-ledger-v2.css
          grep -q 'cinema-ledger-v2.css' static-production/index.html
          grep -q 'PRIVATE CINEMA LEDGER' static-production/guide.html
          ! grep -q 'class="top-note"' static-production/index.html
      - name: Install Chromium and Korean fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p /tmp/b13-browser && cd /tmp/b13-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.54.1
          npx playwright install chromium
      - name: Browser visual and route validation
        run: |
          mkdir -p /tmp/b13-v2-evidence
          python3 -m http.server 4313 --directory apps/personal-video-archive/static-production >/tmp/b13-http.log 2>&1 &
          server=$!; trap 'kill $server || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4313/index.html >/dev/null && break; sleep .5; done
          cd /tmp/b13-browser
          node <<'JS'
          const {chromium}=require('playwright');const fs=require('fs'),path=require('path');const out='/tmp/b13-v2-evidence';
          async function audit(p,label){const d=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,css:[...document.styleSheets].map(x=>x.href||'').filter(Boolean),text:document.body.innerText.slice(0,1000)}));if(d.sw>d.cw+1)throw new Error(`${label}:overflow ${d.sw}>${d.cw}`);if(!d.css.some(x=>x.includes('cinema-ledger-v2.css')))throw new Error(`${label}:v2 css missing`);return d}
          (async()=>{const b=await chromium.launch({headless:true}),manifest={};for(const vp of [{name:'desktop',width:1440,height:1100},{name:'mobile',width:390,height:844}]){for(const rel of ['index.html','guide.html','topics/index.html','records/index.html']){const p=await b.newPage({viewport:vp}),errs=[];p.on('console',x=>{if(x.type()==='error')errs.push(x.text())});p.on('pageerror',e=>errs.push(e.message));const r=await p.goto(`http://127.0.0.1:4313/${rel}`,{waitUntil:'networkidle'});if(!r||r.status()!==200)throw new Error(`${vp.name}:${rel}:http`);if(rel!=='guide.html')manifest[`${vp.name}:${rel}`]=await audit(p,`${vp.name}:${rel}`);else{const d=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,text:document.body.innerText}));if(d.sw>d.cw+1)throw new Error(`${vp.name}:${rel}:overflow`);if(!d.text.includes('PRIVATE CINEMA LEDGER'))throw new Error(`${vp.name}:${rel}:guide marker`)}if(errs.length)throw new Error(`${vp.name}:${rel}:${errs.join('|')}`);await p.screenshot({path:path.join(out,`b13-${rel.replaceAll('/','-').replace('.html','')}-${vp.name}.png`),fullPage:true});await p.close()}}fs.writeFileSync(path.join(out,'manifest.json'),JSON.stringify(manifest,null,2));await b.close();console.log('B13_CINEMA_LEDGER_BROWSER_PASS=1')})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b13-private-cinema-ledger-v2-20260810
          path: /tmp/b13-v2-evidence
          retention-days: 7