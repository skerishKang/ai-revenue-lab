name: Deploy B06 Product V2 20260810

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/deploy-b06-product-v2-20260810.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.pull_request.head.ref == 'ops/deploy-b06-product-v2-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: c2dd57fe99a1ca85113fff3561ef2adbfcccd1cc
      PROJECT: 06-world-feed
      URL: https://06-world-feed.pages.dev/
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert exact current main and source markers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          grep -q 'art-direction-v2.css' reference/business-06-world-feed-v1/index.html
          grep -q 'art-direction-v2-polish.css' reference/business-06-world-feed-v1/index.html
          grep -q 'art-direction-v2.js' reference/business-06-world-feed-v1/index.html
      - name: Deploy exact main B06
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy reference/business-06-world-feed-v1 \
            --project-name "$PROJECT" \
            --branch main \
            --commit-hash "$EXPECTED_SHA" \
            --commit-message 'B06 World Feed product V2 exact main'
      - name: Verify public canonical bytes
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 35); do
            html=$(curl -L -sS --max-time 20 "$URL" || true)
            guide=$(curl -L -sS --max-time 20 "${URL}guide.html" || true)
            if grep -q 'art-direction-v2.css' <<<"$html" \
              && grep -q 'art-direction-v2-polish.css' <<<"$html" \
              && grep -q 'art-direction-v2.js' <<<"$html" \
              && grep -q 'art-direction-v2.css' <<<"$guide"; then
              echo 'B06_PRODUCT_V2_PUBLIC_PASS=1'
              exit 0
            fi
            sleep 4
          done
          exit 1
