name: Materialize B15 Verification Desk V2 20260810
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'reference/business-15-global-ai-newsroom-v1/**'
      - '.github/workflows/materialize-b15-verification-desk-v2-20260810.yml'
permissions: {contents: write}
jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'design/b15-verification-desk-v2-20260810'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.ref }}', fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          b=Path('reference/business-15-global-ai-newsroom-v1')
          (b/'ux.html').write_text((b/'ux.v2-source.html').read_text(encoding='utf-8'),encoding='utf-8')
          (b/'guide.html').write_text((b/'guide.v2-source.html').read_text(encoding='utf-8'),encoding='utf-8')
          (b/'ux.v2-source.html').unlink(); (b/'guide.v2-source.html').unlink()
          Path('.github/workflows/materialize-b15-verification-desk-v2-20260810.yml').unlink()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A && git commit -m 'feat(B15): materialize Verification Desk V2' && git push origin HEAD:${{ github.event.pull_request.head.ref }}
