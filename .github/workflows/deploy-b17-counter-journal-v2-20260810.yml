name: Deploy B17 Counter Journal V2 20260810
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/deploy-b17-counter-journal-v2-20260810.yml']
permissions: {contents: read}
jobs:
  deploy:
    if: github.event.pull_request.head.ref == 'ops/deploy-b17-counter-journal-v2-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: 9ad5c2ce1afcd5a3021e70e4b2a42302cfa7f9c2
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.EXPECTED_SHA }}', persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Assert canonical project
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          code=$(curl -sS -o /tmp/project.json -w '%{http_code}' -H "Authorization: Bearer ${CF_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/17-local-shop-magazine")
          test "$code" = 200
      - name: Deploy exact-main bytes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest pages deploy reference/business-17-local-shop-magazine-v1 --project-name 17-local-shop-magazine --branch main --commit-hash "$EXPECTED_SHA" --commit-message 'B17 Counter Journal V2 exact main' --commit-dirty=true
      - name: Verify canonical byte equality
        shell: bash
        run: |
          set -euo pipefail
          verify(){ url="$1"; source="$2"; expected=$(sha256sum "$source"|cut -d' ' -f1); for i in $(seq 1 30); do code=$(curl -L -sS --max-time 20 -o /tmp/public -w '%{http_code}' "$url"||true); actual=$(sha256sum /tmp/public 2>/dev/null|cut -d' ' -f1||true); [[ "$code" == 200 && "$actual" == "$expected" ]] && return 0; sleep 3; done; return 1; }
          verify https://17-local-shop-magazine.pages.dev/index.html reference/business-17-local-shop-magazine-v1/index.html
          verify https://17-local-shop-magazine.pages.dev/ux.html reference/business-17-local-shop-magazine-v1/ux.html
          verify https://17-local-shop-magazine.pages.dev/guide.html reference/business-17-local-shop-magazine-v1/guide.html
          echo B17_COUNTER_JOURNAL_PUBLIC_PASS=1
