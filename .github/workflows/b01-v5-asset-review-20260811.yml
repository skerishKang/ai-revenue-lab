name: B01 V5 Raster Asset Review 2026-08-11
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/b01-v5-asset-review-20260811.yml'
permissions:
  contents: read
jobs:
  review-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Assert local raster set
        run: |
          set -euo pipefail
          test -s apps/personal-edition/static/images/v5/hero-private-edition.webp
          test -s apps/personal-edition/static/images/v5/human-proof-review.webp
          test -s apps/personal-edition/static/images/v5/library-edition-stack.webp
          test -s apps/personal-edition/static/images/v5/edition-opening.webp
          file apps/personal-edition/static/images/v5/*.webp
      - uses: actions/upload-artifact@v4
        with:
          name: b01-v5-raster-review-${{ github.sha }}
          path: apps/personal-edition/static/images/v5/*.webp
          retention-days: 7
          if-no-files-found: error
