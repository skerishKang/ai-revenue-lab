name: B60 UX3 Wire Temp

on:
  push:
    branches: [feat/b60-ux3-route-detail-669]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/b60-ux3-route-detail-669
          fetch-depth: 1
      - name: Wire v11 and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          for p in [Path('apps/portfolio-console/ai-api/index.html'), Path('reference/business-60-ai-api-v1/index.html')]:
              text=p.read_text()
              css='  <link rel="stylesheet" href="product-v10-route-compare.css">'
              js='  <script src="product-v10-route-compare.js"></script>'
              if css not in text or js not in text: raise SystemExit(f'v10 anchors missing: {p}')
              text=text.replace(css, css+'\n  <link rel="stylesheet" href="product-v11-route-detail.css">',1)
              text=text.replace(js, js+'\n  <script src="product-v11-route-detail.js"></script>',1)
              p.write_text(text)
          PY
          git rm .github/workflows/b60-ux3-wire-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/portfolio-console/ai-api/index.html reference/business-60-ai-api-v1/index.html
          git commit -m "feat(b60): wire unified route detail UX"
          git push origin HEAD:feat/b60-ux3-route-detail-669
