name: B60 UX667 Copy Refine Temp

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  refine:
    if: github.event.pull_request.number == 668 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/b60-ux2-route-compare-handoff-667
          fetch-depth: 1
      - name: Refine end-user handoff language and settled-state screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          js_files = [
              Path('apps/portfolio-console/ai-api/product-v10-route-compare.js'),
              Path('reference/business-60-ai-api-v1/product-v10-route-compare.js'),
          ]
          replacements = {
              "이 경로는 현재 Business 14 Router Core의 정확한 모델 ID와 매핑됩니다. 실행과 자격증명 처리는 B60이 아니라 실행 계층에서 담당합니다.":
                  "이 경로는 현재 실행 라우터의 정확한 모델 ID와 매핑되어 있습니다. 실제 실행과 API Key 처리는 연결된 실행 계층에서 담당합니다.",
              "<div><dt>B14 MODEL</dt><dd><code>${esc(mapping.b14ModelId)}</code></dd></div>":
                  "<div><dt>MODEL ID</dt><dd><code>${esc(mapping.b14ModelId)}</code></dd></div>",
              "<div><dt>B14 ROUTE</dt><dd><code>${esc(mapping.b14RouteId)}</code></dd></div>":
                  "<div><dt>ROUTE ID</dt><dd><code>${esc(mapping.b14RouteId)}</code></dd></div>",
              "<div><dt>CREDENTIAL</dt><dd>${esc(mapping.credentialMode)}</dd></div>":
                  "<div><dt>API KEY</dt><dd>실행 계층에서 처리 · 이 사이트에 저장하지 않음</dd></div>",
              "<div><dt>WORKSPACE</dt><dd><code>${esc(mapping.workspacePath)}</code></dd></div>":
                  "<div><dt>EXECUTION PATH</dt><dd><code>${esc(mapping.workspacePath)}</code></dd></div>",
              "<div><dt>LIVE TARGET</dt><dd>${mapping.targetUrl ? 'BOUND' : 'NOT BOUND'}</dd></div>":
                  "<div><dt>EXECUTION TARGET</dt><dd>${mapping.targetUrl ? 'BOUND' : 'NOT BOUND'}</dd></div>",
              "<div class=\"ux2-handoff-boundary\"><strong>지금은 연결 계약까지만 열려 있습니다.</strong><p>승인된 B14 배포 대상 URL이 설정되기 전에는 외부 실행 버튼을 만들지 않습니다. API Key도 이 사이트에서 받거나 저장하지 않습니다.</p></div>":
                  "<div class=\"ux2-handoff-boundary\"><strong>지금은 실행 경로까지만 확인된 상태입니다.</strong><p>승인된 실행 대상이 연결되기 전에는 실행 버튼을 열지 않습니다. API Key도 이 사이트에서 받거나 저장하지 않습니다.</p></div>",
          }
          for path in js_files:
              text = path.read_text()
              for old, new in replacements.items():
                  if old not in text:
                      raise SystemExit(f'missing expected copy in {path}: {old[:50]}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

          qa = Path('.github/workflows/b60-ux667-render-qa-temp.yml')
          text = qa.read_text()
          text = text.replace("await page.waitForSelector('.ux2-sheet.is-open');", "await page.waitForSelector('.ux2-sheet.is-open');\n            await page.waitForTimeout(300);", 1)
          text = text.replace("await page.waitForSelector('.ux2-handoff.is-open');", "await page.waitForSelector('.ux2-handoff.is-open');\n            await page.waitForTimeout(300);", 1)
          qa.write_text(text)
          PY
          git rm .github/workflows/b60-ux667-copy-refine-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/portfolio-console/ai-api/product-v10-route-compare.js reference/business-60-ai-api-v1/product-v10-route-compare.js .github/workflows/b60-ux667-render-qa-temp.yml
          git commit -m "refine(b60): make execution handoff user-facing"
          git push origin HEAD:feat/b60-ux2-route-compare-handoff-667
