name: B60 ai-api Pages Production Temp

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  audit-pages-routing:
    if: github.event.pull_request.number == 678
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: ai-api
    steps:
      - name: Audit project deployment routing
        shell: bash
        run: |
          set -euo pipefail
          project="$(mktemp)"
          curl --silent --show-error --fail \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}" \
            -o "${project}"
          jq '{success, result:{name:.result.name,subdomain:.result.subdomain,production_branch:.result.production_branch,source:.result.source,canonical_deployment:(.result.canonical_deployment|if . then {id,url,environment,aliases,deployment_trigger,latest_stage} else null end),latest_deployment:(.result.latest_deployment|if . then {id,url,environment,aliases,deployment_trigger,latest_stage} else null end)}}' "${project}"
          subdomain="$(jq -r '.result.subdomain' "${project}")"
          canonical_url="$(jq -r '.result.canonical_deployment.url // empty' "${project}")"
          latest_url="$(jq -r '.result.latest_deployment.url // empty' "${project}")"
          printf 'PROJECT_SUBDOMAIN=%s\nCANONICAL_URL=%s\nLATEST_URL=%s\n' "${subdomain}" "${canonical_url}" "${latest_url}"
          for pair in "subdomain|https://${subdomain}/" "canonical|${canonical_url}" "latest|${latest_url}" "branch|https://production.${subdomain}/"; do
            label="${pair%%|*}"; url="${pair#*|}"
            [ -n "${url}" ] || continue
            body="$(mktemp)"
            code="$(curl --silent --show-error --location --output "${body}" --write-out '%{http_code}' --max-time 20 "${url}" || true)"
            marker="$(grep -c 'id=\"explore\"' "${body}" 2>/dev/null || true)"
            title="$(sed -n 's:.*<title>\(.*\)</title>.*:\1:p' "${body}" | head -n1)"
            printf 'CHECK_%s url=%s http=%s marker=%s title=%s bytes=%s\n' "${label}" "${url}" "${code}" "${marker}" "${title}" "$(wc -c < "${body}")"
          done

      - name: List recent deployments
        shell: bash
        run: |
          set -euo pipefail
          deployments="$(mktemp)"
          curl --silent --show-error --fail \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments" \
            -o "${deployments}"
          jq '[.result[:8][] | {id,url,environment,aliases,created_on,deployment_trigger,latest_stage}]' "${deployments}"
