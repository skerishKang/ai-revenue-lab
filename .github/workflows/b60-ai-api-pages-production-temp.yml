name: B60 ai-api Pages Production Temp

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  deploy-production:
    if: github.event.pull_request.number == 678
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: ai-api
      PRODUCTION_BRANCH: production
      PUBLIC_DOMAIN: ai-api.pages.dev
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Ensure dedicated Pages project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}"
          body="$(mktemp)"
          status="$(curl --silent --show-error --output "${body}" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            "${endpoint}")"
          if [ "${status}" = "404" ]; then
            payload="$(mktemp)"; created="$(mktemp)"
            jq -n --arg name "${PROJECT_NAME}" --arg branch "${PRODUCTION_BRANCH}" '{name:$name,production_branch:$branch}' > "${payload}"
            create_status="$(curl --silent --show-error --request POST --output "${created}" --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data-binary "@${payload}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects")"
            test "${create_status}" = "200" || test "${create_status}" = "201" || { cat "${created}"; exit 1; }
            jq -e --arg name "${PROJECT_NAME}" --arg branch "${PRODUCTION_BRANCH}" '.success == true and .result.name == $name and .result.production_branch == $branch' "${created}" >/dev/null
            echo "PROJECT_CREATED=${PROJECT_NAME}"
          else
            test "${status}" = "200" || { cat "${body}"; exit 1; }
            jq -e --arg name "${PROJECT_NAME}" '.success == true and .result.name == $name' "${body}" >/dev/null
            existing_branch="$(jq -r '.result.production_branch' "${body}")"
            if [ "${existing_branch}" != "${PRODUCTION_BRANCH}" ]; then
              echo "Existing project ${PROJECT_NAME} has production_branch=${existing_branch}; refusing to overwrite an unknown project." >&2
              exit 1
            fi
            echo "PROJECT_EXISTED=${PROJECT_NAME}"
          fi

      - name: Check out exact integrated head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify deploy source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PR_HEAD_SHA}"
          test -f apps/portfolio-console/ai-api/index.html
          test -f apps/portfolio-console/ai-api/product-v12-watch.js
          test -f apps/portfolio-console/ai-api/product-v12-watch.css
          cmp apps/portfolio-console/ai-api/data/access-signals.js reference/business-60-ai-api-v1/data/access-signals.js
          grep -F "price: 'Varies by routed provider'" apps/portfolio-console/ai-api/data/access-signals.js >/dev/null
          ! grep -F '$1.40/M input · $4.40/M output' apps/portfolio-console/ai-api/data/access-signals.js
          echo "DEPLOY_SOURCE=apps/portfolio-console/ai-api"
          echo "ROOT_MODE=YES"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pw"
          npm install --prefix "${RUNNER_TEMP}/pw" playwright@1.55.0 >/dev/null
          "${RUNNER_TEMP}/pw/node_modules/.bin/playwright" install --with-deps chromium >/dev/null

      - name: Local root smoke
        shell: bash
        env:
          PW: ${{ runner.temp }}/pw/node_modules/playwright
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory apps/portfolio-console/ai-api >"${RUNNER_TEMP}/server.log" 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi; sleep 1; done
          cat > "${RUNNER_TEMP}/smoke.cjs" <<'NODE'
          const { chromium } = require(process.env.PW);
          async function run(url, label) {
            const browser = await chromium.launch({headless:true});
            for (const viewport of [{width:1440,height:1000},{width:390,height:844}]) {
              const page = await browser.newPage({viewport});
              const errors=[], failed=[];
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
              const response = await page.goto(url,{waitUntil:'networkidle'});
              if (!response || response.status() !== 200) throw new Error(`${label}: root status ${response?.status()}`);
              await page.locator('#explore').scrollIntoViewIfNeeded();
              const card=page.locator('.access-card[data-id="vercel-glm52"]');
              if (await card.count() !== 1) throw new Error(`${label}: Vercel card missing`);
              await card.click();
              await page.waitForSelector('.ux3-route-detail.is-open');
              await page.waitForTimeout(350);
              const detail=await page.locator('.ux3-route-panel').innerText();
              if (!detail.includes('Varies by routed provider')) throw new Error(`${label}: routed-provider price missing`);
              if (!detail.includes('$5 credits / 30 days')) throw new Error(`${label}: recurring credit missing`);
              await page.locator('[data-close-route]').click();
              await page.waitForTimeout(260);
              await page.evaluate(()=>localStorage.setItem('b60.ai-api.watchlist.v1',JSON.stringify(['vercel-glm52','openrouter-free-router'])));
              await page.reload({waitUntil:'networkidle'});
              await page.locator('#explore').scrollIntoViewIfNeeded();
              await page.locator('.ia-primary [data-ia-view="watch"]').click();
              await page.waitForSelector('.ux4-saved-list');
              if (await page.locator('.ux4-saved-route').count() !== 2) throw new Error(`${label}: Watch count not 2`);
              const metric=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
              if (metric.sw > metric.cw + 1) throw new Error(`${label}: horizontal overflow ${JSON.stringify(metric)}`);
              if (errors.length) throw new Error(`${label}: console errors ${errors.join(' | ')}`);
              if (failed.length) throw new Error(`${label}: failed requests ${failed.join(' | ')}`);
              console.log(`${label} ${viewport.width}x${viewport.height} PASS`);
              await page.close();
            }
            await browser.close();
          }
          run(process.argv[2],process.argv[3]).catch(e=>{console.error(e);process.exit(1)});
          NODE
          node "${RUNNER_TEMP}/smoke.cjs" "http://127.0.0.1:4173/" "LOCAL_ROOT"

      - name: Deploy ai-api apex
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PR_HEAD_SHA}"
          npx --yes wrangler@4 pages deploy apps/portfolio-console/ai-api \
            --project-name "${PROJECT_NAME}" \
            --branch "${PRODUCTION_BRANCH}" \
            --commit-hash "${PR_HEAD_SHA}" \
            --commit-message "B60 ai-api dedicated apex" \
            --commit-dirty=false

      - name: Verify public apex and TLS
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            code="$(curl --silent --show-error --output /tmp/root.html --write-out '%{http_code}' --max-time 15 "https://${PUBLIC_DOMAIN}/" || true)"
            if [ "${code}" = "200" ]; then break; fi
            if [ "${attempt}" -eq 18 ]; then echo "Final HTTP=${code}"; exit 1; fi
            sleep 10
          done
          grep -q '<!DOCTYPE html>' /tmp/root.html || grep -qi '<html' /tmp/root.html
          timeout 10 openssl s_client -connect "${PUBLIC_DOMAIN}:443" -servername "${PUBLIC_DOMAIN}" -brief </dev/null >/tmp/tls.txt 2>&1
          cat /tmp/tls.txt
          headers="$(mktemp)"
          curl --silent --show-error --head --max-time 15 "https://${PUBLIC_DOMAIN}/" -o "${headers}"
          cat "${headers}"
          grep -qi '^HTTP/.* 200' "${headers}"
          if grep -qi '^location: https://.*cloudflareaccess.com/' "${headers}"; then
            echo "Unexpected Cloudflare Access redirect on public apex" >&2
            exit 1
          fi
          echo "PUBLIC_APEX=https://${PUBLIC_DOMAIN}/"

      - name: Live post-deploy browser QA
        shell: bash
        env:
          PW: ${{ runner.temp }}/pw/node_modules/playwright
        run: |
          set -euo pipefail
          node "${RUNNER_TEMP}/smoke.cjs" "https://${PUBLIC_DOMAIN}/" "LIVE_APEX"
          echo "PRODUCTION_ACCEPTED=https://${PUBLIC_DOMAIN}/"
