name: B60 ai-api Pages Production Temp

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  postdeploy-verify:
    if: github.event.pull_request.number == 678
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: ai-api
    steps:
      - name: Resolve actual Pages subdomain
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          curl --silent --show-error --fail \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}" \
            -o "${body}"
          jq -e --arg name "${PROJECT_NAME}" '.success == true and .result.name == $name' "${body}" >/dev/null
          actual_domain="$(jq -r '.result.subdomain' "${body}")"
          test -n "${actual_domain}" && test "${actual_domain}" != "null"
          echo "PUBLIC_DOMAIN=${actual_domain}" >> "${GITHUB_ENV}"
          echo "PROJECT_SUBDOMAIN=${actual_domain}"
          if [ "${actual_domain}" = "ai-api.pages.dev" ]; then
            echo "EXACT_AI_API_PAGES_DEV_AVAILABLE=YES"
          else
            echo "EXACT_AI_API_PAGES_DEV_AVAILABLE=NO"
          fi

      - name: Wait for production alias propagation
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --output /tmp/root.html --write-out '%{http_code}' --max-time 15 "https://${PUBLIC_DOMAIN}/" || true)"
            if [ "${code}" = "200" ] && grep -q 'id="explore"' /tmp/root.html; then
              ready=1
              echo "APEX_MARKER_READY_ATTEMPT=${attempt}"
              break
            fi
            echo "attempt=${attempt} http=${code} marker=$(grep -c 'id=\"explore\"' /tmp/root.html 2>/dev/null || true)"
            sleep 10
          done
          test "${ready}" = "1"
          timeout 10 openssl s_client -connect "${PUBLIC_DOMAIN}:443" -servername "${PUBLIC_DOMAIN}" -brief </dev/null >/tmp/tls.txt 2>&1
          cat /tmp/tls.txt
          echo "PUBLIC_APEX=https://${PUBLIC_DOMAIN}/"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pw"
          npm install --prefix "${RUNNER_TEMP}/pw" playwright@1.55.0 >/dev/null
          "${RUNNER_TEMP}/pw/node_modules/.bin/playwright" install --with-deps chromium >/dev/null

      - name: Live desktop and mobile QA
        shell: bash
        env:
          PW: ${{ runner.temp }}/pw/node_modules/playwright
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/live.cjs" <<'NODE'
          const { chromium } = require(process.env.PW);
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const viewport of [{width:1440,height:1000},{width:390,height:844}]){
              const page=await browser.newPage({viewport});
              const errors=[],failed=[];
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
              const response=await page.goto(`https://${process.env.PUBLIC_DOMAIN}/`,{waitUntil:'networkidle'});
              if(!response||response.status()!==200) throw new Error(`status ${response?.status()}`);
              await page.locator('#explore').scrollIntoViewIfNeeded();
              const vercel=page.locator('.access-card[data-id="vercel-glm52"]');
              if(await vercel.count()!==1) throw new Error('Vercel card missing');
              await vercel.click();
              await page.waitForSelector('.ux3-route-detail.is-open');
              await page.waitForTimeout(350);
              const detail=await page.locator('.ux3-route-panel').innerText();
              if(!detail.includes('Varies by routed provider')) throw new Error('Vercel provider-dependent price missing');
              if(!detail.includes('$5 credits / 30 days')) throw new Error('Vercel recurring credit missing');
              await page.locator('[data-close-route]').click();
              await page.waitForTimeout(260);
              await page.evaluate(()=>localStorage.setItem('b60.ai-api.watchlist.v1',JSON.stringify(['vercel-glm52','openrouter-free-router'])));
              await page.reload({waitUntil:'networkidle'});
              await page.locator('#explore').scrollIntoViewIfNeeded();
              await page.locator('.ia-primary [data-ia-view="watch"]').click();
              await page.waitForSelector('.ux4-saved-list');
              if(await page.locator('.ux4-saved-route').count()!==2) throw new Error('Watch route count not 2');
              const metrics=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
              if(metrics.sw>metrics.cw+1) throw new Error(`horizontal overflow ${JSON.stringify(metrics)}`);
              if(errors.length) throw new Error(`console errors ${errors.join(' | ')}`);
              if(failed.length) throw new Error(`request failures ${failed.join(' | ')}`);
              console.log(`LIVE ${viewport.width}x${viewport.height} PASS`);
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          PUBLIC_DOMAIN="${PUBLIC_DOMAIN}" node "${RUNNER_TEMP}/live.cjs"
          echo "PRODUCTION_ACCEPTED=https://${PUBLIC_DOMAIN}/"
