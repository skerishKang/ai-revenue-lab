name: B14 Comparative Model Benchmark (source gate)

# Source-only gate for #2676. Pull requests run contract tests and the exact
# 5x6 call-cap proof. A future CENTRAL-authorized workflow_dispatch can execute
# one bounded benchmark; this workflow does not mutate routing or Production.

on:
  pull_request:
    paths:
      - '.github/scripts/b14_model_evaluation_live.py'
      - '.github/tests/test_b14_model_evaluation_live.py'
      - '.github/scripts/b14_model_evaluation.py'
      - '.github/tests/test_b14_model_evaluation.py'
      - 'apps/padiem-chat/tests/fixtures/padiem_tier_benchmark_v1.json'
      - '.github/workflows/b14-model-evaluation-live.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact current main SHA authorized for this one-shot benchmark'
        required: true
      candidate_selector:
        description: 'Manual-pin selector (all-five or one candidate)'
        required: true
        type: choice
        options:
          - all-five
          - agnes
          - motif
          - mercury
          - atria
          - luna
      confirmation:
        description: 'Type RUN_B14_COMPARATIVE_BENCHMARK_ONCE'
        required: true

permissions:
  contents: read

concurrency:
  group: b14-comparative-model-benchmark
  cancel-in-progress: false

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source under review
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_sha || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Exact-main dispatch preflight
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.inputs.target_sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.event.inputs.target_sha }}"
          echo 'PREFLIGHT_EXACT_MAIN=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install source-test dependency
        shell: bash
        run: python -m pip install --quiet pytest

      - name: Run comparative benchmark source tests
        shell: bash
        run: python -m pytest -q .github/tests/test_b14_model_evaluation_live.py .github/tests/test_b14_model_evaluation.py

      - name: Re-run shared fixture contract
        shell: bash
        run: python -m pytest -q apps/padiem-chat/tests/test_tier_benchmark_corpus.py

      - name: Pin source-only safety and call-cap contract
        shell: bash
        run: |
          set -euo pipefail
          script=.github/scripts/b14_model_evaluation_live.py
          test -f "${script}"
          grep -Fq 'RETRY = 0' "${script}"
          grep -Fq 'FALLBACK = 0' "${script}"
          grep -Fq 'MAX_ALL_FIVE_POSTS = len(EVALUATION_CANDIDATE_IDS) * MAX_CASES' "${script}"
          grep -Fq 'LIVE_PROVIDER_CALL=0' "${script}"
          grep -Fq 'WORKFLOW_DISPATCH=0' "${script}"
          grep -Fq 'SECRET_VALUE_READ=0' "${script}"
          grep -Fq 'ROUTE_ACTIVATION=0' "${script}"
          grep -Fq 'PRODUCTION_MUTATION=0' "${script}"
          grep -Fq 'b14/auto' "${script}"
          echo 'SOURCE_GATE_LIVE_PROVIDER_CALL=0'
          echo 'SOURCE_GATE_WORKFLOW_DISPATCH=0'
          echo 'SOURCE_GATE_SECRET_VALUE_READ=0'
          echo 'SOURCE_GATE_ROUTE_ACTIVATION=0'
          echo 'SOURCE_GATE_PRODUCTION_MUTATION=0'

  live-comparative-benchmark:
    needs: source-contract
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirmation == 'RUN_B14_COMPARATIVE_BENCHMARK_ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      TARGET_SHA: ${{ github.event.inputs.target_sha }}
      CANDIDATE_SELECTOR: ${{ github.event.inputs.candidate_selector }}
    steps:
      - name: Checkout exact authorized main
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Re-check exact current main immediately before live gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'LIVE_EXACT_MAIN=PASS'

      - name: Run one-shot comparative benchmark
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/b14-comparative-benchmark.log"
          python .github/scripts/b14_model_evaluation_live.py "${CANDIDATE_SELECTOR}" --authorized-live-run | tee "${log}"
          grep -Eq '"retry": 0' "${log}"
          grep -Eq '"fallback": 0' "${log}"
          if [ "${CANDIDATE_SELECTOR}" = all-five ]; then
            grep -Eq '"benchmark_post_count": 30' "${log}"
            grep -Eq '"max_all_five_posts": 30' "${log}"
          else
            grep -Eq '"benchmark_post_count": 6' "${log}"
          fi

      - name: Record immutable execution locks
        if: always()
        shell: bash
        run: |
          echo 'B14_DEPLOY=0'
          echo 'ENGINE_DEPLOY=0'
          echo 'SECRET_VALUE_READ=0'
          echo 'ROUTE_ACTIVATION=0'
          echo 'PRODUCT_TIER_MUTATION=0'
          echo 'PRODUCTION_MUTATION=0'
          echo 'PRIVATE_PAYLOAD_OUTPUT=0'
          echo 'RAW_RESPONSE_OUTPUT=0'
