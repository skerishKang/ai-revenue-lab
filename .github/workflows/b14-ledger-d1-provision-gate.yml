name: B14 Ledger D1 Provision Gate

# #5318 — applies the B14 model-call ledger migrations to the Cloudflare D1
# database `padiem-b14-call-ledger`, the database the `B14_CALL_LEDGER_D1`
# binding in apps/korean-ai-platform/wrangler.toml already points at.
# Dispatch-only by contract: an ordinary pull request can never trigger it.
#
# The gate provisions an EXISTING database. It never creates one, never edits
# wrangler.toml and never deploys the worker.
#
# 0001_b14_model_call_ledger.sql is entirely CREATE ... IF NOT EXISTS, and the
# remote database already carries that schema while wrangler's migrations table
# is empty. Applying through this gate records migrations without changing
# existing objects; the readback compares it with the schema derived by replaying
# every SQL migration against a blank in-memory database.
#
# 0002_credential_source.sql is the first file that actually mutates: it ALTERs
# b14_model_call to add the pool/user credential label (#5824 PR-3a). An ALTER is
# not replay-safe, so the ordering matters — this gate must run for a revision
# before the worker that writes the new column is deployed against it.
# 0003 adds the immutable PC-turn annotation columns and their lookup index.

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact main SHA to provision from'
        required: true
      confirmation:
        description: 'Type PROVISION_B14_LEDGER_D1 to authorize provisioning'
        required: true

permissions:
  contents: read

jobs:
  provision-d1:
    if: github.event.inputs.confirmation == 'PROVISION_B14_LEDGER_D1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_sha }}
          persist-credentials: false

      - name: Premutation exact-main and account assertions
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.inputs.target_sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.event.inputs.target_sha }}"
          test "$CLOUDFLARE_ACCOUNT_ID" = '9be14bb7b8974e65d0afba647ab16932'
          echo 'PREMUTATION_EXACT_MAIN_SHA=PASS'
          echo 'PREMUTATION_TARGET_ACCOUNT=PASS'

      - name: Assert the ledger database already exists (never create it)
        shell: bash
        working-directory: apps/korean-ai-platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # The listing payload carries a database identifier per row, so it is
          # read from a file that this same step deletes. Only the name is echoed.
          npx --yes wrangler@4 d1 list --json > /tmp/b14-ledger-d1-list.json
          python3 - <<'PY'
          import json
          rows = json.load(open('/tmp/b14-ledger-d1-list.json'))
          names = {row.get('name') for row in rows}
          assert 'padiem-b14-call-ledger' in names, (
              'ledger database absent: this gate provisions an existing database '
              'and never creates one'
          )
          print('D1_DATABASE_PRESENT=YES')
          print('D1_DATABASE_NAME=padiem-b14-call-ledger')
          PY
          rm -f /tmp/b14-ledger-d1-list.json
          echo 'D1_PROVISION_TARGET=padiem-b14-call-ledger'

      - name: List pending migrations against the remote ledger database
        shell: bash
        working-directory: apps/korean-ai-platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations list padiem-b14-call-ledger --remote
          echo 'D1_MIGRATIONS_LIST_PRE=PASS'

      - name: Apply ledger migrations to the remote database
        shell: bash
        working-directory: apps/korean-ai-platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Report the exact SQL files Wrangler will apply, from its migrations folder.
          python3 ../../.github/scripts/b14_ledger_d1_schema.py --print-migrations
          # In a non-interactive context wrangler answers its own confirmation
          # prompt with a fallback value: "Using fallback value in non-interactive context: yes".
          npx --yes wrangler@4 d1 migrations apply padiem-b14-call-ledger --remote

      - name: Post-apply migrations list and schema readback
        shell: bash
        working-directory: apps/korean-ai-platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations list padiem-b14-call-ledger --remote
          echo 'D1_MIGRATIONS_LIST_POST=PASS'
          # Read schema names only; never query ledger rows or column values.
          trap 'rm -f /tmp/b14-ledger-columns.json /tmp/b14-ledger-indexes.json' EXIT
          npx --yes wrangler@4 d1 execute padiem-b14-call-ledger --remote --json \
            --command "SELECT m.name AS table_name, p.name AS column_name FROM sqlite_master AS m JOIN pragma_table_info(m.name) AS p WHERE m.type = 'table' AND m.name NOT LIKE 'sqlite_%' AND m.name != 'd1_migrations' ORDER BY m.name, p.cid" > /tmp/b14-ledger-columns.json
          npx --yes wrangler@4 d1 execute padiem-b14-call-ledger --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type = 'index' AND name NOT LIKE 'sqlite_autoindex%' AND tbl_name != 'd1_migrations' ORDER BY name" > /tmp/b14-ledger-indexes.json
          python3 ../../.github/scripts/b14_ledger_d1_schema.py \
            --remote-columns /tmp/b14-ledger-columns.json \
            --remote-indexes /tmp/b14-ledger-indexes.json

      - name: Final evidence
        shell: bash
        run: |
          python3 .github/scripts/b14_ledger_d1_schema.py --print-migrations
          echo 'B14_LEDGER_D1_PROVISION=PASS'
          echo 'D1_PROVISION_TARGET=padiem-b14-call-ledger'
          echo 'D1_DATABASE_CREATED=0'
          echo 'WORKER_DEPLOYED=0'
          echo 'WRANGLER_TOML_MODIFIED=0'
          echo 'SECRET_VALUE_OUTPUT=0'
          echo 'DATABASE_UUID_OUTPUT=0'
