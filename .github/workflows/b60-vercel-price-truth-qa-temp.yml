name: B60 Vercel Price Truth QA Temp

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  data-truth:
    if: github.event.pull_request.number == 676
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify mirrored Vercel route truth
        shell: bash
        run: |
          set -euo pipefail
          A=apps/portfolio-console/ai-api/data/access-signals.js
          B=reference/business-60-ai-api-v1/data/access-signals.js
          cmp "$A" "$B"
          ! grep -F '$1.40/M input · $4.40/M output' "$A"
          ! grep -F '$1.40/M input · $4.40/M output' "$B"
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const paths = [
            'apps/portfolio-console/ai-api/data/access-signals.js',
            'reference/business-60-ai-api-v1/data/access-signals.js'
          ];
          for (const path of paths) {
            const sandbox = { window: {} };
            vm.runInNewContext(fs.readFileSync(path, 'utf8'), sandbox, { filename: path });
            const signal = sandbox.window.B60_ACCESS_SIGNALS.find(x => x.id === 'vercel-glm52');
            assert.ok(signal, `${path}: vercel signal missing`);
            assert.equal(signal.price, 'Varies by routed provider');
            assert.equal(signal.verifiedAt, '2026-08-24');
            assert.equal(signal.freeLabel, '$5 credits / 30 days');
            assert.equal(signal.model, 'zai/glm-5.2');
            assert.equal(signal.context, '1M tokens');
            assert.equal(signal.pending?.state, 'PENDING_WEB_VERIFICATION');
            assert.ok(signal.facts.includes('AI Gateway routes GLM 5.2 across multiple providers with provider-specific rates.'));
          }
          console.log(JSON.stringify({ mirror: 'IDENTICAL', vercelPrice: 'PROVIDER_DEPENDENT', preservedFreeCredit: true, pendingPromotion: 'UNCHANGED', status: 'PASS' }));
          NODE
