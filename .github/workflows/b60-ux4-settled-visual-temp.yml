name: B60 UX4 Settled Visual Temp

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  settled-visual:
    if: github.event.pull_request.number == 678
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pw"
          npm install --prefix "${RUNNER_TEMP}/pw" playwright@1.55.0 >/dev/null
          "${RUNNER_TEMP}/pw/node_modules/.bin/playwright" install --with-deps chromium >/dev/null
      - name: Capture settled Route Detail and Watch
        shell: bash
        env:
          PW: ${{ runner.temp }}/pw/node_modules/playwright
          OUT: ${{ runner.temp }}/b60-settled
        run: |
          set -euo pipefail
          mkdir -p "${OUT}"
          python3 -m http.server 4173 --directory apps/portfolio-console >"${RUNNER_TEMP}/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ai-api/ >/dev/null && break; sleep 1; done
          cat > "${OUT}/capture.cjs" <<'NODE'
          const { chromium } = require(process.env.PW);
          const fs = require('fs');
          const path = require('path');
          const out = process.env.OUT;
          const failures = [];
          const assert = (c,m) => { if(!c) failures.push(m); };
          async function capture(viewport,prefix){
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({viewport});
            const page = await context.newPage();
            const errors=[]; const failed=[];
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
            await page.goto('http://127.0.0.1:4173/ai-api/',{waitUntil:'networkidle'});
            await page.locator('#explore').scrollIntoViewIfNeeded();
            await page.locator('.access-card[data-id="vercel-glm52"]').click();
            await page.waitForSelector('.ux3-route-detail.is-open');
            await page.waitForTimeout(450);
            const modal = await page.locator('.ux3-route-detail').evaluate(el=>({opacity:getComputedStyle(el).opacity,background:getComputedStyle(el).backgroundColor}));
            assert(modal.opacity==='1',`${prefix}: route detail not settled ${JSON.stringify(modal)}`);
            assert((await page.locator('.ux3-route-panel').innerText()).includes('Varies by routed provider'),`${prefix}: routed provider price missing`);
            await page.screenshot({path:path.join(out,`${prefix}-route-detail-settled.png`),fullPage:false});
            await page.locator('[data-close-route]').click();
            await page.waitForTimeout(300);
            await page.evaluate(()=>localStorage.setItem('b60.ai-api.watchlist.v1',JSON.stringify(['vercel-glm52','openrouter-free-router'])));
            await page.reload({waitUntil:'networkidle'});
            await page.locator('#explore').scrollIntoViewIfNeeded();
            await page.locator('.ia-primary [data-ia-view="watch"]').click();
            await page.waitForSelector('.ux4-saved-list');
            await page.waitForTimeout(250);
            const bounds = await page.locator('.ux4-saved-list').boundingBox();
            const grid = await page.locator('#signal-grid-v6').boundingBox();
            assert(bounds && grid && bounds.width >= grid.width - 2, `${prefix}: Watch does not span grid ${JSON.stringify({bounds,grid})}`);
            await page.screenshot({path:path.join(out,`${prefix}-watch-settled.png`),fullPage:false});
            const metrics=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth}));
            assert(metrics.scrollWidth<=metrics.clientWidth+1,`${prefix}: overflow ${JSON.stringify(metrics)}`);
            assert(errors.length===0,`${prefix}: console errors ${errors.join(' | ')}`);
            assert(failed.length===0,`${prefix}: request failures ${failed.join(' | ')}`);
            await browser.close();
            return {prefix,modal,bounds,grid,metrics,errors,failed};
          }
          (async()=>{
            const evidence=[await capture({width:1440,height:1000},'desktop'),await capture({width:390,height:844},'mobile')];
            const result={pass:failures.length===0,failures,evidence};
            fs.writeFileSync(path.join(out,'settled-result.json'),JSON.stringify(result,null,2));
            console.log(JSON.stringify(result,null,2));
            if(failures.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node "${OUT}/capture.cjs"
      - name: Upload settled visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b60-ux4-settled-visual-evidence
          path: ${{ runner.temp }}/b60-settled
          if-no-files-found: error
