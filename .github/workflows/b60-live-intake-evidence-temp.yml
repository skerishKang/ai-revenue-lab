name: B60 Live Intake Evidence Temp

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  live-intake:
    if: github.event.pull_request.number == 655
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch official sources into review-only candidates
        shell: bash
        env:
          OUT: ${{ runner.temp }}/b60-live-intake
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          cd reference/business-60-ai-api-v1/collector
          node run-intake.cjs --out "$OUT/candidates.json"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const manifest = require('./source-manifest.cjs');
          const out = process.env.OUT;
          const payload = JSON.parse(fs.readFileSync(path.join(out, 'candidates.json'), 'utf8'));
          assert.equal(payload.publicationAuthority, 'REVIEW_REQUIRED');
          assert.equal(payload.candidates.length, manifest.length);
          assert.equal(manifest.length, 7);
          const allowed = new Set(['NEEDS_REVIEW', 'REJECTED']);
          for (const candidate of payload.candidates) {
            assert.ok(allowed.has(candidate.state), `unexpected live state: ${candidate.sourceId} ${candidate.state}`);
            assert.equal(candidate.verification, undefined, `${candidate.sourceId}: live intake must not verify`);
            assert.notEqual(candidate.state, 'APPROVED_FOR_SNAPSHOT', `${candidate.sourceId}: live intake must not approve`);
          }
          const bySource = new Map(payload.candidates.map(candidate => [candidate.sourceId, candidate]));
          const entries = manifest.map(source => {
            const candidate = bySource.get(source.id);
            assert.ok(candidate, `missing candidate: ${source.id}`);
            return {
              sourceId: source.id,
              signalId: source.signalId,
              provider: source.provider,
              url: source.url,
              state: candidate.state,
              reason: candidate.reason || null,
              httpStatus: candidate.evidence?.httpStatus ?? null,
              finalUrl: candidate.evidence?.finalUrl ?? null,
              contentType: candidate.evidence?.contentType ?? null,
              contentLength: candidate.evidence?.contentLength ?? null,
              missingRequired: candidate.missingRequired || [],
              observationFields: (candidate.observations || []).map(observation => observation.field),
              observationValues: Object.fromEntries((candidate.observations || []).map(observation => [observation.field, observation.value]))
            };
          });
          const counts = entries.reduce((acc, entry) => {
            acc[entry.state] = (acc[entry.state] || 0) + 1;
            return acc;
          }, {});
          const summary = {
            generatedAt: payload.generatedAt,
            publicationAuthority: payload.publicationAuthority,
            sourceCount: entries.length,
            counts,
            allReviewOnly: entries.every(entry => ['NEEDS_REVIEW', 'REJECTED'].includes(entry.state)),
            entries
          };
          fs.writeFileSync(path.join(out, 'summary.json'), JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE
      - name: Upload live intake evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b60-live-intake-evidence-20260824
          path: ${{ runner.temp }}/b60-live-intake
          if-no-files-found: error
