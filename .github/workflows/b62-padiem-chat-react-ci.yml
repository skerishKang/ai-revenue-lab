name: B62 Padiem Chat React clone CI

on:
  pull_request:
    paths:
      # The clone owns its own sources.
      - "apps/padiem-chat-react/**"
      # The clone imports the operational stylesheets read-only, so a change
      # there can change what the clone renders.
      - "apps/padiem-chat/static/**"
      # The clone consumes the canonical shared composer core.
      - "packages/padiem-conversation-ui/**"
      - ".github/workflows/b62-padiem-chat-react-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/padiem-chat-react/**"
      - "apps/padiem-chat/static/**"
      - "packages/padiem-conversation-ui/**"
      - ".github/workflows/b62-padiem-chat-react-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# Test-only lane. It never deploys and never touches a Production surface.
concurrency:
  group: b62-padiem-chat-react-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react-clone:
    name: React clone typecheck, tests, build and browser check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/padiem-chat-react
    steps:
      - name: Check out the exact ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/padiem-chat-react/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Component and contract tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Prove the build did not change the operational product
        run: |
          set -euo pipefail
          git diff --exit-code -- ../padiem-chat
          echo 'OPERATIONAL_PRODUCT_UNCHANGED=PASS'

      - name: Resolve the installed Playwright version
        id: playwright-version
        shell: bash
        run: echo "version=$(npx playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: playwright-browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the Node Playwright release this lane resolves
          # from its own lock, so a browser build can never be reused across releases.
          key: pw-chromium-node-${{ steps.playwright-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Select Ubuntu archive for Playwright OS dependencies
        shell: bash
        run: bash ../../.github/scripts/b62_playwright_apt_mirror_3989.sh

      - name: Install Chromium system libraries
        shell: bash
        run: npx playwright install-deps chromium

      - name: Install Chromium browser
        if: steps.playwright-browser-cache.outputs.cache-hit != 'true'
        shell: bash
        run: npx playwright install chromium

      - name: First-screen browser regression
        run: npm run test:e2e
