name: One-shot relay Business 22 Pages
run-name: Relay Business 22 Pages after run ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows:
      - Provision approved Business Pages
    types:
      - completed

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  relay:
    if: github.event.workflow_run.id == 30223403324 && github.event.workflow_run.run_attempt >= 2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Dispatch protected Business 22 workflow
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          payload="$(jq -n \
            --arg ref 'main' \
            --arg business_id '22' \
            --arg project_name 'ai-revenue-business-22-personal-media-studio' \
            --arg source_directory 'reference/business-22-personal-media-studio-v1' \
            --arg approved_sha 'e43da95f7e59d1800cd1f182c2c835ab9a59456b' \
            --arg approval_pr '224' \
            --arg production_branch 'main' \
            '{ref:$ref,inputs:{business_id:$business_id,project_name:$project_name,source_directory:$source_directory,approved_sha:$approved_sha,approval_pr:$approval_pr,production_branch:$production_branch}}')"
          status="$(curl --silent --show-error \
            --request POST \
            --output response.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary "${payload}" \
            "${API_URL}/repos/${REPOSITORY}/actions/workflows/provision-approved-business-pages.yml/dispatches")"
          if test "${status}" != '204'; then
            body="$(cat response.json)"
            jq -n --arg body "## Business 22 Pages relay dispatch failed\n\n- HTTP status: \`${status}\`\n- Response: \`${body}\`" '{body:$body}' > comment.json
            curl --silent --show-error --fail \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data-binary @comment.json \
              "${API_URL}/repos/${REPOSITORY}/issues/224/comments" >/dev/null
            exit 1
          fi
          echo "started_at=${started_at}" >> "${GITHUB_OUTPUT}"

      - name: Locate dispatched run
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
        shell: bash
        run: |
          set -euo pipefail
          run_json=''
          for attempt in $(seq 1 40); do
            payload="$(curl --silent --show-error --fail \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${API_URL}/repos/${REPOSITORY}/actions/workflows/provision-approved-business-pages.yml/runs?event=workflow_dispatch&branch=main&per_page=30")"
            run_json="$(jq -c --arg started "${STARTED_AT}" '[.workflow_runs[] | select(.event == "workflow_dispatch" and .head_branch == "main" and .created_at >= $started)] | sort_by(.created_at) | last // empty' <<<"${payload}")"
            test -n "${run_json}" && break
            sleep 3
          done
          test -n "${run_json}"
          echo "run_id=$(jq -r '.id' <<<"${run_json}")" >> "${GITHUB_OUTPUT}"
          echo "run_url=$(jq -r '.html_url' <<<"${run_json}")" >> "${GITHUB_OUTPUT}"

      - name: Record created run
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.locate.outputs.run_id }}
          RUN_URL: ${{ steps.locate.outputs.run_url }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          ## Business 22 protected Pages workflow created

          - Run ID: \`${RUN_ID}\`
          - Run URL: ${RUN_URL}
          - Approved exact head: \`e43da95f7e59d1800cd1f182c2c835ab9a59456b\`
          - Dedicated project: \`ai-revenue-business-22-personal-media-studio\`
          EOF
          )"
          jq -n --arg body "${body}" '{body:$body}' > comment.json
          curl --silent --show-error --fail \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @comment.json \
            "${API_URL}/repos/${REPOSITORY}/issues/224/comments" >/dev/null

      - name: Wait for protected run
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.locate.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          run_json=''
          for attempt in $(seq 1 160); do
            run_json="$(curl --silent --show-error --fail \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${API_URL}/repos/${REPOSITORY}/actions/runs/${RUN_ID}")"
            status="$(jq -r '.status' <<<"${run_json}")"
            test "${status}" = 'completed' && break
            sleep 8
          done
          test "$(jq -r '.status' <<<"${run_json}")" = 'completed'
          echo "conclusion=$(jq -r '.conclusion // empty' <<<"${run_json}")" >> "${GITHUB_OUTPUT}"

      - name: Publish final result
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.locate.outputs.run_id }}
          RUN_URL: ${{ steps.locate.outputs.run_url }}
          CONCLUSION: ${{ steps.wait.outputs.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          jobs="$(curl --silent --show-error --fail \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${API_URL}/repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")"
          job_summary="$(jq -r '[.jobs[] | "- " + .name + ": `" + (.conclusion // "") + "`"] | join("\n")' <<<"${jobs}")"
          body="$(cat <<EOF
          ## Business 22 protected Pages workflow completed

          - Run ID: \`${RUN_ID}\`
          - Run URL: ${RUN_URL}
          - Conclusion: \`${CONCLUSION}\`
          - Approved exact head: \`e43da95f7e59d1800cd1f182c2c835ab9a59456b\`

          ${job_summary}
          EOF
          )"
          jq -n --arg body "${body}" '{body:$body}' > comment.json
          curl --silent --show-error --fail \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @comment.json \
            "${API_URL}/repos/${REPOSITORY}/issues/224/comments" >/dev/null
          test "${CONCLUSION}" = 'success'
