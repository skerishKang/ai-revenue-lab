name: B1 Personal Edition UI V2 Visual Evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/personal-edition/**"
      - ".github/workflows/b1-personal-edition-ui-v2-443-visual.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b1-personal-edition-ui-v2-443-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-evidence:
    name: 3-viewport browser evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVIDENCE_DIR: ${{ runner.temp }}/b1-ui-v2-443-${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/personal-edition/pyproject.toml

      - name: Install Personal Edition and Playwright
        working-directory: apps/personal-edition
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run exact-head visual validator
        working-directory: apps/personal-edition
        run: |
          python docs/visual-review/final/validate_final.py --output-dir "$EVIDENCE_DIR"

      - name: Upload deterministic visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-ui-v2-443-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
