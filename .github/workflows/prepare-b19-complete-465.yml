name: Prepare B19 Complete 465
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/prepare-b19-complete-465.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'ops/prepare-b19-complete-465'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize approved B19 UI plus existing UX on exact main
        shell: bash
        env:
          EXPECTED_MAIN: ebf7a71da864157f3716cc23e519774cfcbfbeca
          TARGET_BRANCH: feat/b19-personal-memory-book-complete-465
          UI_BRANCH: feat/business-19-personal-memory-book-ui
          UX_BRANCH: feat/business-19-personal-memory-book-ux-396
          SCOPE: reference/business-19-personal-memory-book-v1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          git fetch origin "$UI_BRANCH" "$UX_BRANCH"
          test "$(git rev-parse origin/$UI_BRANCH)" = 486a7226b8e5e230cfc3cceadab8ea4034d7bb6f
          test "$(git rev-parse origin/$UX_BRANCH)" = 33b1f30b54d23a91ed6f0a257977741ddf8cbace
          if git ls-tree -r --name-only HEAD -- "$SCOPE" | grep -q .; then
            echo 'B19 scope unexpectedly exists on current main; refusing overwrite' >&2
            exit 1
          fi
          git switch -c "$TARGET_BRANCH"
          git checkout "origin/$UI_BRANCH" -- "$SCOPE"
          git checkout "origin/$UX_BRANCH" -- "$SCOPE/ux.html"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$SCOPE"
          git diff --cached --check
          git commit -m 'feat(b19): integrate approved memory-book UI and reading UX'
          git push origin "$TARGET_BRANCH"
          echo B19_PREPARE_PASS=1
