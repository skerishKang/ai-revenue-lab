name: Validate padiem-broker skeleton and packaging
on:
  pull_request:
    paths:
      - 'apps/padiem-broker/**'
      - 'packages/padiem-control-plane/internal_rpc_ingress.py'
      - '.github/workflows/validate-padiem-broker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  broker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest httpx starlette uvicorn
      - name: Skeleton contracts (storage CAS, proof door, session lane)
        run: PYTHONPATH=apps/padiem-broker:packages/padiem-control-plane python -m pytest apps/padiem-broker/tests -q
      - name: Offline installer, units, health, backup and lock contracts
        run: python -m unittest discover -s apps/padiem-broker/deploy/tests -q
