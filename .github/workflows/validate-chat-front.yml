name: Validate chat front proxy
on:
  pull_request:
    paths:
      - 'apps/padiem-chat-front/**'
      - '.github/workflows/validate-chat-front.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-chat-front-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check apps/padiem-chat-front/worker.mjs
      - name: Proxy, streaming, fallback and CPU-shape tests
        run: node --test apps/padiem-chat-front/test/worker.test.mjs
      - name: Security response header tests
        run: node --test apps/padiem-chat-front/test/security-headers.test.mjs
