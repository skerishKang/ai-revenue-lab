name: B60 UX671 Watch Controller Patch Temp

on:
  push:
    branches: [feat/b60-ux4-entity-watch-671]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/b60-ux4-entity-watch-671
          fetch-depth: 1
      - name: Expose existing Watch state without replacing its storage authority
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          paths = [
              Path('apps/portfolio-console/ai-api/product-v7.js'),
              Path('reference/business-60-ai-api-v1/product-v7.js'),
          ]
          insert = """  window.B60_WATCH_STATE = Object.freeze({
    ids: () => [...saved],
    has: id => saved.has(id),
    toggle: id => toggleSave(id),
    storageAvailable: () => storageAvailable
  });

"""
          anchor = "  updateBadge();\n  decorateCards();\n})();\n"
          for path in paths:
              text = path.read_text()
              if insert not in text:
                  if anchor not in text:
                      raise SystemExit(f'missing Watch controller anchor in {path}')
                  text = text.replace(anchor, insert + anchor, 1)
                  path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/portfolio-console/ai-api/product-v7.js reference/business-60-ai-api-v1/product-v7.js
          git commit -m "refactor(b60): expose browser-local Watch state"
          git push origin HEAD:feat/b60-ux4-entity-watch-671
