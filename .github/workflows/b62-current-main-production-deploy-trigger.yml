# B62 production release is manual-only under the 2026-10-13 owner-approved
# single-operator policy in docs/operations/DIRECT_PRODUCTION_DEPLOYMENT_AND_ROLLBACK_POLICY.md.
#
# The legacy path-scoped main-push deploy trigger is intentionally retired:
# editing this workflow must never dispatch a production Worker upload.
# The canonical guarded write authority remains the separate
# .github/workflows/b62-production-code-deploy-gate.yml manual workflow_dispatch,
# with exact current main, confirmation, live D1 checks and rollback.
name: B62 Manual-Only Deployment Boundary Contract

on:
  pull_request:
    paths:
      - ".github/workflows/b62-current-main-production-deploy-trigger.yml"

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove the legacy path-trigger cannot deploy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          workflow = Path(".github/workflows/b62-current-main-production-deploy-trigger.yml").read_text(encoding="utf-8")
          canonical = Path(".github/workflows/b62-production-code-deploy-gate.yml").read_text(encoding="utf-8")
          assert re.search(r"(?m)^on:\s*$", workflow)
          assert re.search(r"(?m)^  pull_request:\s*$", workflow)
          assert not re.search(r"(?m)^  (push|workflow_dispatch):\s*$", workflow)
          assert not re.search(r"(?m)^  deploy-production:\s*$", workflow)
          assert "actions:" + " write" not in workflow
          assert "gh workflow" + " run " not in workflow
          assert "  contents: read" in workflow
          assert "  workflow_dispatch:" in canonical
          assert "deploy_production_code" in canonical
          assert "DEPLOY_B62_PRODUCTION_CODE_FROM_EXACT_MAIN" in canonical
          assert "environment: production" in canonical
          print("B62_MANUAL_ONLY_RELEASE_BOUNDARY=PASS")
          print("B62_AUTOMATIC_PUSH_DEPLOY=DISABLED")
          print("PRODUCTION_MUTATION=0")
          PY
