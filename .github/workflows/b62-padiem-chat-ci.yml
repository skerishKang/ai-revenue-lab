name: B62 Padiem Chat CI

on:
  # #5678: every main push runs the full Chat regression, including changes
  # the PR classifier can safely route to a focused lane.
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/padiem-chat/**"
      - "apps/korean-ai-platform/**"
      - "packages/padiem-ai-core/**"
      # Chat resolves every Plus/Pro/Max request through the shared product-tier
      # declaration, so a declaration change has to run this suite even when no
      # Chat file moves.
      - "packages/padiem-control-plane/padiem_control_plane/product_tier_routes.py"
      - "reference/business-62-padiem-chat-v1/**"
      - ".github/scripts/b62_cloudflare_*.py"
      - ".github/scripts/b14_model_registration_ci_plan.py"
      - ".github/scripts/b62_ci_impact_scope_3989.py"
      - ".github/tests/test_b62_ci_impact_scope_3989.py"
      # #5341: the shared Core import-scope proof and its contract test
      # decide which Core changes need the complete B62 regression.
      - ".github/scripts/ci_core_import_scope.py"
      - ".github/tests/test_5341_core_import_scope.py"
      # CI implementation itself: probe runner/test changes require real B62 checks.
      - ".github/scripts/b62_worker_probe_*.sh"
      - ".github/scripts/b62_worker_probe_shared_assertions.py"
      - ".github/tests/test_3989_b62_worker_probe_parallel.py"
      - ".github/tests/test_3989_b62_worker_shared_runtime.py"
      - ".github/tests/test_3989_b62_parallel_runtime_jobs.py"
      - ".github/workflows/b62-padiem-chat-ci.yml"
      - ".github/workflows/b62-cloudflare-worker-deploy.yml"
      # #6209 부수 피해: chat 테스트가 게이트 워크플로 본문을 직접 읽는다.
      # 게이트를 바꾼 PR에서 이 스위트가 돌지 않아 main이 빨개진 채 머지됐다.
      # chat 테스트가 실제로 읽는 워크플로만 정확히 넣는다(전체 glob 금지).
      - ".github/workflows/b62-claw-production-smoke-gate.yml"
      - ".github/workflows/b62-production-code-deploy-gate.yml"
      - ".github/workflows/b62-browser-qa-unified.yml"
  workflow_dispatch:

permissions:
  contents: read

# #3989: Only the latest main commit needs an expensive full
# regression; a later qualifying push contains all earlier merged source.
# Preserve separate PR groups and keep manual dispatch runs independent.
# This is test-only: deploy / migration workflows have their own non-cancellable
# concurrency contracts and must not share this group.
concurrency:
  group: b62-padiem-chat-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('push-{0}', github.ref) || format('manual-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  registry-ci-plan:
    name: B14 changeset classifier (fail-closed)
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.classify.outputs.lane }}
      scope: ${{ steps.classify-b62.outputs.scope }}
      ui_tests: ${{ steps.classify-b62.outputs.ui_tests }}
      core_tests: ${{ steps.classify-b62.outputs.core_tests }}
      core_modules: ${{ steps.classify-b62.outputs.core_modules }}
    steps:
      - uses: actions/checkout@v4
      - name: Test CI lane fail-closed rules
        run: python -m unittest discover -s .github/tests -p test_b14_model_registration_ci_plan.py -q
      - name: Classify exact PR or push changes
        id: classify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/b14_model_registration_ci_plan.py
      - name: Test B62 scoped-regression fail-closed contract
        run: |
          python -m unittest discover -s .github/tests -p test_b62_ci_impact_scope_3989.py -q
          python -m unittest discover -s .github/tests -p test_4459_b62_ui_mixed_scope.py -q
          # #5341: the shared Core import-scope proof and its lane contracts.
          python -m unittest discover -s .github/tests -p test_5341_core_import_scope.py -q
      - name: Test B62 parallel job fan-in contract
        run: python -m unittest discover -s .github/tests -p test_3989_b62_parallel_runtime_jobs.py -q
      - name: Classify B62 unchanged-dependency CI scope
        id: classify-b62
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/b62_ci_impact_scope_3989.py

  # #3989: source-proven static UI cannot change Python/Worker/Core bytes.
  # Browser QA and standalone static audit workflows remain separately required.
  b62-static-ui:
    name: B62 static UI fast checks
    needs: registry-ci-plan
    if: ${{ needs.registry-ci-plan.outputs.lane != 'model_registration_only' && (needs.registry-ci-plan.outputs.scope == 'static_only' || needs.registry-ci-plan.outputs.scope == 'ui_mixed') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse every shipped UI JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/padiem-chat/static/app.js
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find apps/padiem-chat/static -type f -name '*.js' -print0)
          echo 'B62_STATIC_JS_PARSE=PASS'
      - name: Enforce DOM sink, external-origin and browser-persistence boundaries
        run: |
          set -euo pipefail
          python .github/scripts/b62_dom_sink_audit.py
          python .github/scripts/b62_static_origin_audit.py
          python .github/scripts/b62_browser_persistence_audit.py
          echo 'B62_STATIC_UI_SECURITY=PASS'

  b62-registry-contract:
    name: B62 B14 registry-only contract
    needs: registry-ci-plan
    if: ${{ needs.registry-ci-plan.outputs.lane == 'model_registration_only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/padiem-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: apps/padiem-chat/uv.lock
      - name: Locked dependencies
        run: uv sync --locked --extra dev
      - name: Strict B14 source route and manual-only selection integration
        run: uv run --locked python -m pytest -q tests/test_b66_real_b14_source_authority.py

  # #4459: static UI with changed ordinary test modules: run every changed
  # pytest module. Uncertain/source/auth/Worker changes keep full regression.
  b62-ui-mixed-tests:
    name: B62 UI-mixed focused pytest
    needs: registry-ci-plan
    if: ${{ needs.registry-ci-plan.outputs.lane != 'model_registration_only' && needs.registry-ci-plan.outputs.scope == 'ui_mixed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/padiem-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
      - name: Locked B62 test dependencies
        run: uv sync --locked --extra dev
      - name: Run every changed UI-test module (bounded, fail closed)
        env:
          UI_TEST_MODULES: ${{ needs.registry-ci-plan.outputs.ui_tests }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a modules <<< "$UI_TEST_MODULES"
          test "${#modules[@]}" -ge 1
          test "${#modules[@]}" -le 24
          for module in "${modules[@]}"; do
            [[ "$module" =~ ^tests/test_[A-Za-z0-9_]+\.py$ ]]
            test -f "$module"
          done
          uv run --locked python -m pytest -q "${modules[@]}"

  b62-test:
    name: b62-test
    if: always()
    needs: [registry-ci-plan, b62-static-ui, b62-ui-mixed-tests, b62-core-parser-focused, b62-b14-attempt-focused, b62-full-suite, b62-worker-suite, b14-multimodal-test, b62-registry-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce selected lane and both relevant checks
        env:
          MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          LANE: ${{ needs.registry-ci-plan.outputs.lane }}
          SCOPE: ${{ needs.registry-ci-plan.outputs.scope }}
          PLAN_RESULT: ${{ needs.registry-ci-plan.result }}
          UI_RESULT: ${{ needs.b62-static-ui.result }}
          MIXED_RESULT: ${{ needs.b62-ui-mixed-tests.result }}
          PARSER_RESULT: ${{ needs.b62-core-parser-focused.result }}
          ATTEMPT_RESULT: ${{ needs.b62-b14-attempt-focused.result }}
          FULL_RESULT: ${{ needs.b62-full-suite.result }}
          WORKER_RESULT: ${{ needs.b62-worker-suite.result }}
          MM_RESULT: ${{ needs.b14-multimodal-test.result }}
          QUICK_RESULT: ${{ needs.b62-registry-contract.result }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          # Focused PR lanes still require a skipped full suite; main requires
          # an executed, successful full suite without changing other jobs.
          EXPECTED_FOCUSED_FULL=skipped
          if [ "$MAIN_PUSH" = true ]; then
            EXPECTED_FOCUSED_FULL=success
          fi
          if [ "$LANE" = model_registration_only ]; then
            test "$QUICK_RESULT" = success
            test "$UI_RESULT" = skipped
            test "$MIXED_RESULT" = skipped
            test "$FULL_RESULT" = "$EXPECTED_FOCUSED_FULL"
            test "$WORKER_RESULT" = skipped
            test "$MM_RESULT" = skipped
            echo 'B62_CI_MODE=MODEL_REGISTRATION_ONLY'
          elif [ "$SCOPE" = b14_tests_only ]; then
            # Independent validate-b14-alpha.yml runs all B14 tests. This B62
            # required check only needs the retained B14 pilot contract: B62
            # source, locks, Worker and Core are byte-identical.
            test "$MM_RESULT" = success
            test "$UI_RESULT" = skipped
            test "$MIXED_RESULT" = skipped
            test "$FULL_RESULT" = "$EXPECTED_FOCUSED_FULL"
            test "$WORKER_RESULT" = skipped
            test "$QUICK_RESULT" = skipped
            echo 'B62_CI_MODE=B14_TESTS_ONLY'
          elif [ "$SCOPE" = b14_attempt_only ]; then
            test "$ATTEMPT_RESULT" = success
            test "$FULL_RESULT" = "$EXPECTED_FOCUSED_FULL"
            test "$WORKER_RESULT" = skipped
            echo 'B62_CI_MODE=B14_ATTEMPT_FOCUSED'
          elif [ "$SCOPE" = core_focused_only ]; then
            # #5341: the changed Core module is outside every B62 runtime
            # import path, so the focused independent-Core contract is the
            # load-bearing check for this change set.
            test "$PARSER_RESULT" = success
            test "$UI_RESULT" = skipped
            test "$MIXED_RESULT" = skipped
            test "$FULL_RESULT" = "$EXPECTED_FOCUSED_FULL"
            test "$WORKER_RESULT" = skipped
            test "$MM_RESULT" = skipped
            test "$QUICK_RESULT" = skipped
            echo 'B62_CI_MODE=CORE_FOCUSED'
          elif [ "$SCOPE" = static_only ]; then
            # The UI suite is required; main also requires the full regression.
            test "$UI_RESULT" = success
            test "$MIXED_RESULT" = skipped
            test "$FULL_RESULT" = "$EXPECTED_FOCUSED_FULL"
            test "$WORKER_RESULT" = skipped
            test "$MM_RESULT" = skipped
            test "$QUICK_RESULT" = skipped
            echo 'B62_CI_MODE=STATIC_UI_ONLY'
          elif [ "$SCOPE" = ui_mixed ]; then
            test "$UI_RESULT" = success
            test "$MIXED_RESULT" = success
            test "$FULL_RESULT" = "$EXPECTED_FOCUSED_FULL"
            test "$WORKER_RESULT" = skipped
            test "$MM_RESULT" = skipped
            test "$QUICK_RESULT" = skipped
            echo 'B62_CI_MODE=UI_MIXED_TARGETED'
          else
            test "$UI_RESULT" = skipped
            test "$MIXED_RESULT" = skipped
            test "$FULL_RESULT" = success
            test "$WORKER_RESULT" = success
            # #5002: a product regression must not chain-fail on the
            # independent B14 contract lane. B14 source changes stay gated:
            # their own contract failure is the defect under review. Product
            # scopes still require the B14 lane to execute; a B14 failure is
            # visible on its own job and owned by #4318.
            if [ "$SCOPE" = b14_only ]; then
              test "$MM_RESULT" = success
            else
              case "$MM_RESULT" in
                success|failure) ;;
                *) echo "B14 contract lane did not execute: $MM_RESULT"; exit 1 ;;
              esac
            fi
            test "$QUICK_RESULT" = skipped
            echo 'B62_CI_MODE=FULL'
            echo "B14_CONTRACT_RESULT=$MM_RESULT"
          fi

      - name: Record independent result boundaries (#5002)
        if: always()
        env:
          LANE: ${{ needs.registry-ci-plan.outputs.lane }}
          SCOPE: ${{ needs.registry-ci-plan.outputs.scope }}
          FULL_RESULT: ${{ needs.b62-full-suite.result }}
          WORKER_RESULT: ${{ needs.b62-worker-suite.result }}
          MM_RESULT: ${{ needs.b14-multimodal-test.result }}
        run: |
          {
            echo '### Independent product/B14 result boundaries (#5002)'
            echo ''
            echo "- LANE=$LANE SCOPE=$SCOPE"
            echo "- PRODUCT_TEST_REGRESSION=$FULL_RESULT"
            echo "- PRODUCT_WORKER_REGRESSION=$WORKER_RESULT"
            if [ "$FULL_RESULT" = success ]; then
              echo '- PRODUCT_E2E_BYOK=INTEGRATION_MOCK (real ASGI + real D1 history; provider MockTransport, no live call)'
            else
              echo "- PRODUCT_E2E_BYOK=NOT_RUN (product regression did not pass: $FULL_RESULT)"
            fi
            echo '- PRODUCT_E2E_BYOK_LIVE=NOT_RUN (no approved paid customer-provider call in CI)'
            echo "- B14_CONTRACT=$MM_RESULT"
            echo '- B14_E2E=NOT_RUN (B14 contract tests only; live E2E is tracked by #4318)'
            echo '- FIRST_B14_FAILURE_EVIDENCE=record the first failure once in #4318; product ledgers link it'
          } >> "$GITHUB_STEP_SUMMARY"

  b62-core-parser-focused:
    name: B62 focused independent Core
    needs: registry-ci-plan
    if: ${{ needs.registry-ci-plan.outputs.scope == 'core_focused_only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused Core test dependencies
        run: python -m pip install --disable-pip-version-check -e 'packages/padiem-ai-core[dev]'
      - name: Validate the changed independent Core contract
        env:
          CORE_TESTS: ${{ needs.registry-ci-plan.outputs.core_tests }}
          CORE_MODULES: ${{ needs.registry-ci-plan.outputs.core_modules }}
        run: |
          set -euo pipefail
          # #5341: only the Core modules proven outside the B62 runtime import
          # closure changed. Compile the package, import the changed modules and
          # run the Core tests that cover them. The B62 Chat runtime, Worker
          # bundle and B14 contract are unchanged by such a change set.
          python -m compileall -q packages/padiem-ai-core/padiem_ai_core
          if [ -n "$CORE_MODULES" ]; then
            read -r -a modules <<< "$CORE_MODULES"
            test "${#modules[@]}" -ge 1
            for module in "${modules[@]}"; do
              [[ "$module" =~ ^[a-z][a-z0-9_]*$ ]]
            done
            python - "$CORE_MODULES" <<'PY'
          import importlib
          import sys

          for name in sys.argv[1].split():
              importlib.import_module(f"padiem_ai_core.{name}")
          print("B62_CORE_INDEPENDENT_IMPORT_SMOKE=PASS")
          PY
          else
            echo 'B62_CORE_INDEPENDENT_IMPORT_SMOKE=NOT_REQUIRED'
          fi
          if [ -n "$CORE_TESTS" ]; then
            read -r -a tests <<< "$CORE_TESTS"
            test "${#tests[@]}" -ge 1
            for test_file in "${tests[@]}"; do
              [[ "$test_file" =~ ^test_[A-Za-z0-9_]+\.py$ ]]
              test -f "packages/padiem-ai-core/tests/$test_file"
            done
            python -m pytest -q "${tests[@]/#/packages/padiem-ai-core/tests/}"
          else
            echo 'B62_CORE_FOCUSED_TESTS=NONE'
          fi
          echo 'B62_CORE_FOCUSED=1'

  b62-b14-attempt-focused:
    name: B62 B14 attempt-policy focused tests
    needs: registry-ci-plan
    if: ${{ needs.registry-ci-plan.outputs.scope == 'b14_attempt_only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: apps/padiem-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.13.5'
      - run: uv sync --locked --extra dev
      - run: uv run --locked python -m pytest -q tests/test_owner_tier_fallback_dispatch_261015.py tests/test_3977_provider_default_temperature_bridge.py tests/test_attachments.py tests/test_dispatch_quota_refund.py tests/test_documents.py tests/test_grounding.py tests/test_service_binding.py tests/test_skills.py

  b62-full-suite:
    name: B62 full regression
    needs: registry-ci-plan
    if: ${{ !cancelled() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (needs.registry-ci-plan.result == 'success' && needs.registry-ci-plan.outputs.lane != 'model_registration_only' && needs.registry-ci-plan.outputs.scope != 'static_only' && needs.registry-ci-plan.outputs.scope != 'b14_tests_only' && needs.registry-ci-plan.outputs.scope != 'ui_mixed' && needs.registry-ci-plan.outputs.scope != 'core_focused_only' && needs.registry-ci-plan.outputs.scope != 'b14_attempt_only')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/padiem-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
      - name: Verify committed host lock is current
        run: uv lock --check
      - name: Resolve B62 with shared Core path dependency
        run: uv sync --locked --extra dev
      - name: Prove shared Core import without PYTHONPATH
        run: uv run --locked python -c "import padiem_ai_core, pathlib; print(pathlib.Path(padiem_ai_core.__file__).resolve())"
      - name: Compile B62 and Core
        run: uv run --locked python -m compileall -q app worker.py ../../packages/padiem-ai-core/padiem_ai_core
      - name: JavaScript syntax
        run: node --check static/app.js && node --check static/b66-quote-runtime.js && node --check static/claw-local-handoff.js && node --check static/claw-local-adapter.js
      - name: B62 Chat and eligible Core tests (same-runner fail-closed overlap)
        # #4070: same two original pytest commands, distinct cwd/.venv, one
        # runner and one mandatory exit status. Only proven chat_only/static_only/
        # tests_only/b14_only omit unchanged Core; unknown/mixed run both suites.
        env:
          B62_CI_IMPACT_SCOPE: ${{ needs.registry-ci-plan.outputs.scope }}
        run: bash ../../.github/scripts/b62_host_pytest_overlap_4070.sh
      - name: Verify locked host dependency versions
        run: uv run --locked python tests/check_dependency_locks.py --phase host
  # Run worker checks concurrently with the 3,616-case Chat/Core host suite.
  # Required b62-test aggregates BOTH results; neither lane can be silently skipped.
  b62-worker-suite:
    name: B62 Worker/Pyodide contract
    needs: registry-ci-plan
    if: ${{ needs.registry-ci-plan.outputs.lane != 'model_registration_only' && needs.registry-ci-plan.outputs.scope != 'static_only' && needs.registry-ci-plan.outputs.scope != 'b14_tests_only' && needs.registry-ci-plan.outputs.scope != 'ui_mixed' && needs.registry-ci-plan.outputs.scope != 'core_focused_only' && needs.registry-ci-plan.outputs.scope != 'b14_attempt_only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/padiem-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
      - name: Verify committed host lock is current
        run: uv lock --check
      - name: Resolve B62 with shared Core path dependency
        run: uv sync --locked --extra dev
      - name: Verify locked host dependency versions
        run: uv run --locked python tests/check_dependency_locks.py --phase host
      - name: Pywrangler dependency sync from committed pylock
        # #3989: preserve the exact locked sync and Wrangler 4.130.0 prewarm,
        # but run these independent preparations together on one runner.
        # Marker is exported only after BOTH finish and pass.
        run: bash ../../.github/scripts/b62_worker_prewarm_overlap.sh
      - name: Verify vendored Worker dependency versions
        run: uv run --locked python tests/check_dependency_locks.py --phase vendor
      - name: Prove sync did not mutate committed locks
        run: git diff --exit-code -- uv.lock pylock.toml
      - name: Verify Worker probe concurrency and failure propagation contract
        run: |
          uv run --locked python -m unittest discover -s ../../.github/tests -p test_3989_b62_worker_probe_parallel.py -q
          uv run --locked python -m unittest discover -s ../../.github/tests -p test_3989_b62_worker_shared_runtime.py -q
      - name: Real Worker/Pyodide probes (four assertions, one Workerd, fail-closed)
        # Retain all parallel probes on Python/Worker/mixed/unknown changes.
        # Pure Python test-module edits cannot change deployed Worker bytes or
        # its locked dependencies. Still vendor, audit locks and bundle Worker;
        # Strict B14 application/test-only edits also cannot modify the B62
        # Workerd probe entrypoints/dependencies. Keep full B62 Chat/B14,
        # pinned vendor & Worker bundle, but omit these unchanged live boots.
        # All B62 source/Worker/mixed/CI/unknown changes run all four real
        # probes, now sharing one isolated Workerd to avoid four cold Pyodide
        # startups. Original checks, pinned runtime and fail-closed coverage stay.
        if: ${{ needs.registry-ci-plan.outputs.scope != 'static_only' && needs.registry-ci-plan.outputs.scope != 'tests_only' && needs.registry-ci-plan.outputs.scope != 'b14_only' }}
        run: bash ../../.github/scripts/b62_worker_probe_parallel.sh
      - name: Prove Core vendored for Python Worker
        run: |
          set -euo pipefail
          test -f python_modules/padiem_ai_core/__init__.py
          test -f python_modules/padiem_ai_core/b14_execution.py
          test -f python_modules/padiem_ai_core/b14_transport.py
          test -f python_modules/padiem_ai_core/b14_multimodal.py
          test ! -e python_modules/jsonschema
          echo "Padiem AI Core base runtime is vendored without Tool Runtime extras."
      - name: Python Worker bundle dry-run
        run: uv run --locked pywrangler deploy --dry-run --outdir ../../.tmp/b62-worker-bundle

  b14-multimodal-test:
    needs: registry-ci-plan
    # Only the proven static-only B62 surface can omit the source-invariant B14 pilot runner.
    # All Python, shared-Core, B14, registry-mixed and uncertain changes keep B14 coverage.
    if: ${{ needs.registry-ci-plan.outputs.lane != 'model_registration_only' && needs.registry-ci-plan.outputs.scope != 'static_only' && needs.registry-ci-plan.outputs.scope != 'ui_mixed' && needs.registry-ci-plan.outputs.scope != 'core_focused_only' && needs.registry-ci-plan.outputs.scope != 'b14_attempt_only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/korean-ai-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # #3989: retain identical editable B14 + pytest requirements while
      # avoiding repeated pip metadata/wheel installation on fresh Linux runners.
      # The pinned uv version is already used by the full and Worker B62 jobs.
      - name: Install uv for B14 pilot
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
      - name: Install B14 test dependencies
        run: uv pip install --system -e . 'pytest>=8.3,<9' 'pytest-asyncio>=0.24,<1'
      - name: Compile B14 pilot
        run: python -m compileall -q app/pilot app/factory.py
      - name: B14 multimodal and pilot contract tests
        run: python -m pytest -q tests/test_multimodal.py tests/test_pilot.py

  # #5678 follow-up: the Engine and B14 whole suites ran only on PRs whose paths
  # touched those apps (padiem-ai-engine-ci.yml, validate-b14-alpha.yml), so an
  # unrelated main push could land while either suite was already red. These two
  # jobs add exactly those suites to every main push, reusing each app's own
  # locked invocation instead of inventing a second way to run it. They are
  # main-push-only on purpose: a full-scope PR already runs each suite in its own
  # workflow, and the existing job-topology contracts pin how many jobs carry the
  # classifier gate.
  #
  # They are baseline-informational at first: continue-on-error keeps a failure
  # that predates this change from blocking the push, while the real pass/fail
  # counts and the failing-test list are published to the run summary. b62-test is
  # deliberately untouched, so no existing required lane changes meaning.
  engine-full-regression:
    name: Engine full regression (main push baseline)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    defaults:
      run:
        shell: bash
        working-directory: apps/padiem-ai-engine
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
      - name: Resolve Engine with shared Core dependency
        run: uv sync --extra dev
      - name: Engine whole-suite pytest
        shell: bash
        run: |
          set -uo pipefail
          status=0
          uv run python -m pytest -q 2>&1 \
            | tee "${RUNNER_TEMP}/engine-full-regression.log" || status=$?
          echo "ENGINE_FULL_REGRESSION_STATUS=${status}" >> "${GITHUB_ENV}"
      - name: Publish Engine counts to the step summary
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -uo pipefail
          python3 .github/scripts/b62_suite_result_summary.py \
            "${RUNNER_TEMP}/engine-full-regression.log" "Engine" "ENGINE_FULL_REGRESSION"
      - name: Surface the Engine result without blocking the push
        shell: bash
        run: |
          set -uo pipefail
          echo "B62_MAIN_PUSH_BASELINE=INFORMATIONAL"
          if [ "${ENGINE_FULL_REGRESSION_STATUS:-0}" != "0" ]; then
            exit "${ENGINE_FULL_REGRESSION_STATUS}"
          fi
          echo "ENGINE_FULL_REGRESSION=PASS"

  b14-full-regression:
    name: B14 full regression (main push baseline)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    defaults:
      run:
        shell: bash
        working-directory: apps/korean-ai-platform
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
      - name: Install exact locked B14 dependencies
        run: uv sync --group dev --frozen
      - name: B14 whole-suite pytest
        env:
          PYTHONWARNINGS: error
        run: |
          set -uo pipefail
          status=0
          uv run pytest -q 2>&1 \
            | tee "${RUNNER_TEMP}/b14-full-regression.log" || status=$?
          echo "B14_FULL_REGRESSION_STATUS=${status}" >> "${GITHUB_ENV}"
      - name: Publish B14 counts to the step summary
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -uo pipefail
          python3 .github/scripts/b62_suite_result_summary.py \
            "${RUNNER_TEMP}/b14-full-regression.log" "B14" "B14_FULL_REGRESSION"
      - name: Surface the B14 result without blocking the push
        shell: bash
        run: |
          set -uo pipefail
          echo "B62_MAIN_PUSH_BASELINE=INFORMATIONAL"
          if [ "${B14_FULL_REGRESSION_STATUS:-0}" != "0" ]; then
            exit "${B14_FULL_REGRESSION_STATUS}"
          fi
          echo "B14_FULL_REGRESSION=PASS"
