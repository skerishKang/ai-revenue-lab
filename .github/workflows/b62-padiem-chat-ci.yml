name: B62 Padiem Chat CI

on:
  pull_request:
    paths:
      - "apps/padiem-chat/**"
      - "apps/korean-ai-platform/**"
      - "reference/business-62-padiem-chat-v1/**"
      - ".github/scripts/b62_cloudflare_*.py"
      - ".github/workflows/b62-padiem-chat-ci.yml"
      - ".github/workflows/b62-cloudflare-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b62-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/padiem-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install B62
        run: python -m pip install -e '.[dev]'
      - name: Compile B62
        run: python -m compileall -q app worker.py
      - name: JavaScript syntax
        run: node --check static/app.js
      - name: B62 tests
        run: python -m pytest -q

  b14-multimodal-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/korean-ai-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install B14 test dependencies
        run: python -m pip install -e . 'pytest>=8.3,<9' 'pytest-asyncio>=0.24,<1'
      - name: Compile B14 pilot
        run: python -m compileall -q app/pilot app/factory.py
      - name: B14 multimodal and pilot contract tests
        run: python -m pytest -q tests/test_multimodal.py tests/test_pilot.py
