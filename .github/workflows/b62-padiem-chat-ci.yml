name: B62 Padiem Chat CI

on:
  pull_request:
    paths:
      - "apps/padiem-chat/**"
      - "apps/korean-ai-platform/**"
      - "packages/padiem-ai-core/**"
      - "reference/business-62-padiem-chat-v1/**"
      - ".github/scripts/b62_cloudflare_*.py"
      - ".github/workflows/b62-padiem-chat-ci.yml"
      - ".github/workflows/b62-cloudflare-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b62-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/padiem-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
      - name: Resolve B62 with shared Core path dependency
        run: uv sync --extra dev
      - name: Prove shared Core import without PYTHONPATH
        run: uv run python -c "import padiem_ai_core, pathlib; print(pathlib.Path(padiem_ai_core.__file__).resolve())"
      - name: Compile B62 and Core
        run: uv run python -m compileall -q app worker.py ../../packages/padiem-ai-core/padiem_ai_core
      - name: JavaScript syntax
        run: node --check static/app.js
      - name: B62 tests
        run: uv run python -m pytest -q
      - name: Core tests with Tool Runtime dev dependency
        working-directory: packages/padiem-ai-core
        run: uv run --extra dev python -m pytest -q
      - name: Pywrangler dependency sync
        run: uv run pywrangler sync --force
      - name: Real Worker/Pyodide timeout runtime probe
        run: |
          set -euo pipefail
          cat > .runtime-timeout-probe.toml <<'EOF'
          name = "padiem-chat-runtime-timeout-probe"
          main = "tests/worker_runtime_timeout_probe.py"
          compatibility_date = "2026-08-25"
          compatibility_flags = ["python_workers"]
          workers_dev = true
          EOF

          uv run python tests/worker_runtime_probe_origin.py --port 9099 > /tmp/b62-timeout-origin.log 2>&1 &
          ORIGIN_PID=$!
          npx --yes wrangler@4.130.0 dev --config .runtime-timeout-probe.toml --port 8787 > /tmp/b62-timeout-workerd.log 2>&1 &
          WORKER_PID=$!

          cleanup() {
            kill "$WORKER_PID" "$ORIGIN_PID" 2>/dev/null || true
            rm -f .runtime-timeout-probe.toml
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/ready >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/b62-timeout-workerd.log
            exit 1
          fi

          HTTP_CODE="$(curl -sS -o /tmp/b62-timeout-result.json -w '%{http_code}' http://127.0.0.1:8787/probe)"
          cat /tmp/b62-timeout-result.json
          if [ "$HTTP_CODE" != "200" ]; then
            cat /tmp/b62-timeout-workerd.log
            exit 1
          fi

          uv run python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/b62-timeout-result.json").read_text())
          required = (
              "abortsignal_import",
              "abortsignal_timeout_call",
              "fetch_accepts_signal",
              "local_normal_fetch",
              "local_delay_timeout",
              "local_body_timeout",
          )
          failed = [name for name in required if data.get(name) is not True]
          if failed:
              raise SystemExit(f"Worker timeout runtime probe failed: {failed}; data={data}")
          print("WORKER_TIMEOUT_RUNTIME_PASS")
          PY
      - name: Prove Core vendored for Python Worker
        run: |
          set -euo pipefail
          test -f python_modules/padiem_ai_core/__init__.py
          test -f python_modules/padiem_ai_core/b14_execution.py
          test -f python_modules/padiem_ai_core/b14_transport.py
          test -f python_modules/padiem_ai_core/b14_multimodal.py
          test ! -e python_modules/jsonschema
          echo "Padiem AI Core base runtime is vendored without Tool Runtime extras."
      - name: Python Worker bundle dry-run
        run: uv run pywrangler deploy --dry-run --outdir ../../.tmp/b62-worker-bundle

  b14-multimodal-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/korean-ai-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install B14 test dependencies
        run: python -m pip install -e . 'pytest>=8.3,<9' 'pytest-asyncio>=0.24,<1'
      - name: Compile B14 pilot
        run: python -m compileall -q app/pilot app/factory.py
      - name: B14 multimodal and pilot contract tests
        run: python -m pytest -q tests/test_multimodal.py tests/test_pilot.py
