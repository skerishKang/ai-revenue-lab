name: Portfolio Visual Audit B44 2026-08-11
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/portfolio-visual-audit-b44-20260811.yml']
permissions: { contents: read }
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium
      - run: |
          mkdir -p audit-output
          cat > capture.mjs <<'NODE'
          import { chromium } from 'playwright'; import fs from 'node:fs';
          const b=await chromium.launch({headless:true}); const results=[];
          for(const [name,vp] of [['desktop',{width:1440,height:1100}],['mobile',{width:390,height:844}]]){
            const c=await b.newContext({viewport:vp}); const p=await c.newPage(); const errors=[];
            p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            const r=await p.goto('https://ai-revenue-portfolio-console.pages.dev/',{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForTimeout(3500);
            const m=await p.evaluate(()=>({title:document.title,h1:document.querySelector('h1')?.innerText||null,overflow:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth),text:document.body.innerText.replace(/\s+/g,' ').slice(0,1800),items:document.querySelectorAll('.biz-item').length,bodyBackground:getComputedStyle(document.body).backgroundColor}));
            await p.screenshot({path:`audit-output/B44-${name}-viewport.png`,fullPage:false});
            await p.screenshot({path:`audit-output/B44-${name}-full.png`,fullPage:true});
            results.push({name,status:r.status(),errors,metrics:m}); await c.close();
          }
          await b.close(); fs.writeFileSync('audit-output/results.json',JSON.stringify(results,null,2));
          NODE
          node capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-visual-audit-b44-${{ github.sha }}
          path: audit-output
          if-no-files-found: error
          retention-days: 14
