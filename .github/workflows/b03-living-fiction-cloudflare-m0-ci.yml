name: B03 Living Fiction Cloudflare M0 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/living-fiction/**'
      - '.github/workflows/b03-living-fiction-cloudflare-m0-ci.yml'

permissions:
  contents: read

concurrency:
  group: b03-living-fiction-cloudflare-m0-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  contract-and-container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Exact original Git history is still needed by the full-range
          # merge-base + git diff --check safety guard below.
          fetch-depth: 0
          # #3989: retain the complete Docker build context, migration history,
          # test sources, and this workflow; materialize no unrelated products.
          sparse-checkout: |
            apps/living-fiction/**
            .github/workflows/b03-living-fiction-cloudflare-m0-ci.yml
          sparse-checkout-cone-mode: false

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pytest only
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<10'

      # Both full original test files (Cloudflare migration source-contracts
      # and #3110 grandfathered prefix/upgrade validation) must run together.
      # No -k / selection / ignored tests. New CI guard pins Docker/dry-run.
      - name: Cloudflare migration and sequence prefix contracts
        working-directory: apps/living-fiction
        run: |
          python -m pytest -q \
            tests/test_cloudflare_migration_contract.py \
            tests/test_migration_prefix_guard_3110.py \
            tests/test_3989_b03_m0_ci_scope.py

      - name: Python syntax gate
        working-directory: apps/living-fiction
        run: python -m compileall -q app deploy/cloudflare/worker.py

      - name: Build Cloudflare Container image
        working-directory: apps/living-fiction
        run: docker build --pull -f Dockerfile.cloudflare -t living-fiction-cloudflare-m0:${{ github.sha }} .

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install current Cloudflare tooling for dry-run only
        working-directory: apps/living-fiction
        run: npm install --no-save --ignore-scripts wrangler @cloudflare/containers

      - name: Wrangler Container bundle/config dry-run
        working-directory: apps/living-fiction
        run: npx wrangler deploy --dry-run --config wrangler.cloudflare-container.toml --outdir .wrangler-dry-run

      - name: Diff whitespace gate
        shell: bash
        run: |
          BASE="$(git merge-base origin/${{ github.event.repository.default_branch }} HEAD)"
          git diff --check "$BASE"...HEAD

      - name: Record M0 non-deploy scope
        run: |
          echo 'B03_CLOUDFLARE_M0_CONTRACT=PASS'
          echo 'CONTAINER_IMAGE_BUILD=PASS'
          echo 'WRANGLER_DEPLOY_MODE=DRY_RUN_ONLY'
          echo 'MIGRATION_SEQUENCE_PREFIX_GUARD=PASS'
          echo 'PRODUCTION_MUTATION=0'
