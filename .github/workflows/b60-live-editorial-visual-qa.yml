name: B60 Live Editorial Visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'reference/business-60-ai-api-v1/**'
      - '.github/workflows/b60-live-editorial-visual-qa.yml'

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$expected" = "$actual"

      - name: Prepare Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Render desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          cd reference/business-60-ai-api-v1
          python3 -m http.server 4173 >/tmp/b60-live-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"

          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=5000 --window-size=1440,2600 \
            --screenshot="$GITHUB_WORKSPACE/b60-live-desktop.png" \
            http://127.0.0.1:4173/

          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --force-device-scale-factor=1 --virtual-time-budget=5000 --window-size=390,2200 \
            --screenshot="$GITHUB_WORKSPACE/b60-live-mobile.png" \
            http://127.0.0.1:4173/

          "$browser" --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=4000 --dump-dom http://127.0.0.1:4173/ \
            > "$GITHUB_WORKSPACE/b60-live-dom.html"

          grep -q 'Ox Alpha' "$GITHUB_WORKSPACE/b60-live-dom.html"
          grep -q 'MiniMax' "$GITHUB_WORKSPACE/b60-live-dom.html"
          grep -q '지금 가장 핫함' "$GITHUB_WORKSPACE/b60-live-dom.html"
          grep -q '방금 뜬 무료' "$GITHUB_WORKSPACE/b60-live-dom.html"
          test -s "$GITHUB_WORKSPACE/b60-live-desktop.png"
          test -s "$GITHUB_WORKSPACE/b60-live-mobile.png"

      - name: Upload rendered evidence
        uses: actions/upload-artifact@v4
        with:
          name: b60-live-editorial-visual-evidence
          path: |
            b60-live-desktop.png
            b60-live-mobile.png
            b60-live-dom.html
          retention-days: 7
          if-no-files-found: error
