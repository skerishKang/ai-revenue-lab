name: PADIEM Parliament Rules CI

# Focused contract lane for the #6061 content-rule authority.
#
# The module owns no model route, no store, no network call and no deployment.
# This lane proves only what it executes: that every registered coordinate is
# complete, sourced and dated, that unregistered coordinates fail closed, and
# that no configuration forces a second approver on a member who works alone.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/padiem-parliament-rules/**'
      - '.github/workflows/padiem-parliament-rules-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/padiem-parliament-rules/**'
      - '.github/workflows/padiem-parliament-rules-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: padiem-parliament-rules-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  parliament-rules-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$expected" = "$actual"

      - name: Install the rule authority with its test extras
        run: |
          python -m pip install --disable-pip-version-check -e 'apps/padiem-parliament-rules[dev]'
          python -m pip check

      - name: Prove the module has no runtime or network dependency
        run: |
          set -euo pipefail
          test ! -f apps/padiem-parliament-rules/wrangler.toml
          ! grep -RnE "^\s*(import|from)[[:space:]]+(requests|httpx|urllib\.request|socket|fastapi|starlette)" apps/padiem-parliament-rules/parliament_rules/
          echo "no engine, no provider, no store: checked"

      - name: Test the parliament rule contracts
        run: python -m pytest apps/padiem-parliament-rules/tests -q
