name: B60 ai-api Korean Production Temp

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  deploy-production:
    if: github.event.pull_request.number == 681
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: ai-api
      PRODUCTION_BRANCH: production
      TARGET_SHA: fcc2331f6c7969f6bc92c517ece15504ab1af3a0
    steps:
      - name: Verify target project contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          project="$(mktemp)"
          curl --silent --show-error --fail \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}" \
            -o "${project}"
          jq -e --arg name "${PROJECT_NAME}" --arg branch "${PRODUCTION_BRANCH}" \
            '.success == true and .result.name == $name and .result.production_branch == $branch and .result.source == null' "${project}" >/dev/null
          domain="$(jq -r '.result.subdomain' "${project}")"
          test -n "${domain}" && test "${domain}" != "null"
          echo "PUBLIC_DOMAIN=${domain}" >> "${GITHUB_ENV}"
          echo "PROJECT_SUBDOMAIN=${domain}"

      - name: Check out exact canonical main
        uses: actions/checkout@v4
        with:
          ref: fcc2331f6c7969f6bc92c517ece15504ab1af3a0
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Korean deploy source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test -f apps/portfolio-console/ai-api/index.html
          test -f apps/portfolio-console/ai-api/korean-v1.js
          test -f apps/portfolio-console/ai-api/korean-v1.css
          grep -F '<html lang="ko">' apps/portfolio-console/ai-api/index.html >/dev/null
          grep -F 'korean-v1.js' apps/portfolio-console/ai-api/index.html >/dev/null
          grep -F 'korean-v1.css' apps/portfolio-console/ai-api/index.html >/dev/null
          cmp apps/portfolio-console/ai-api/korean-v1.js reference/business-60-ai-api-v1/korean-v1.js
          cmp apps/portfolio-console/ai-api/korean-v1.css reference/business-60-ai-api-v1/korean-v1.css
          grep -F "price: 'Varies by routed provider'" apps/portfolio-console/ai-api/data/access-signals.js >/dev/null
          ! grep -F '$1.40/M input · $4.40/M output' apps/portfolio-console/ai-api/data/access-signals.js
          echo "DEPLOY_SOURCE=apps/portfolio-console/ai-api"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pw"
          npm install --prefix "${RUNNER_TEMP}/pw" playwright@1.55.0 >/dev/null
          "${RUNNER_TEMP}/pw/node_modules/.bin/playwright" install --with-deps chromium >/dev/null

      - name: Prepare Korean browser smoke
        shell: bash
        env:
          PW: ${{ runner.temp }}/pw/node_modules/playwright
        run: |
          cat > "${RUNNER_TEMP}/korean-smoke.cjs" <<'NODE'
          const { chromium } = require(process.env.PW);
          async function run(url,label){
            const browser=await chromium.launch({headless:true});
            for(const viewport of [{width:1440,height:1000},{width:390,height:844}]){
              const page=await browser.newPage({viewport});
              const errors=[],failed=[];
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
              const response=await page.goto(url,{waitUntil:'networkidle'});
              if(!response||response.status()!==200) throw new Error(`${label}: status ${response?.status()}`);
              await page.waitForSelector('#explore');
              const signalTitle=(await page.locator('#signal-title').innerText()).replace(/\s+/g,' ');
              if(!signalTitle.includes('확실한 것과')||!signalTitle.includes('확인 중인 것을 섞지 않습니다')) throw new Error(`${label}: Korean signal title missing`);
              const sourceText=await page.locator('#source').innerText();
              if(!sourceText.includes('출처 신뢰도')||!sourceText.includes('공식 확인 완료')||!sourceText.includes('추가 확인 필요')) throw new Error(`${label}: Korean source copy missing`);
              if(sourceText.includes('VERIFIED_OFFICIAL_WEB')||sourceText.includes('PENDING_WEB_VERIFICATION')) throw new Error(`${label}: raw enum visible`);
              const ratio=await page.locator('#signal-title').evaluate(el=>{const s=getComputedStyle(el);return parseFloat(s.lineHeight)/parseFloat(s.fontSize)});
              if(ratio<1.07) throw new Error(`${label}: Hangul line-height ${ratio}`);
              await page.locator('#explore').scrollIntoViewIfNeeded();
              const nav=(await page.locator('.ia-primary').innerText()).replace(/\s+/g,' ');
              for(const term of ['탐색','제공사','모델','연결','관심 목록']) if(!nav.includes(term)) throw new Error(`${label}: nav term ${term} missing`);
              const card=page.locator('.access-card[data-id="vercel-glm52"]');
              if(await card.count()!==1) throw new Error(`${label}: Vercel card missing`);
              await card.click();
              await page.waitForSelector('.ux3-route-detail.is-open');
              await page.waitForTimeout(350);
              const detail=await page.locator('.ux3-route-panel').innerText();
              if(!detail.includes('현재 이용 조건')||!detail.includes('출처 신뢰도')) throw new Error(`${label}: Korean route labels missing`);
              if(!detail.includes('라우팅 제공사별 상이')) throw new Error(`${label}: Korean routed-provider price missing`);
              if(!detail.includes('$5 크레딧 / 30일')) throw new Error(`${label}: Korean recurring credit missing`);
              if(detail.includes('VERIFIED_OFFICIAL_WEB')) throw new Error(`${label}: route raw enum visible`);
              await page.locator('[data-close-route]').click();
              await page.waitForTimeout(250);
              await page.evaluate(()=>localStorage.setItem('b60.ai-api.watchlist.v1',JSON.stringify(['vercel-glm52','openrouter-free-router'])));
              await page.reload({waitUntil:'networkidle'});
              await page.waitForSelector('#explore');
              await page.locator('#explore').scrollIntoViewIfNeeded();
              await page.locator('.ia-primary [data-ia-view="watch"]').click();
              await page.waitForSelector('.ux4-saved-list');
              if(await page.locator('.ux4-saved-route').count()!==2) throw new Error(`${label}: Watch count not 2`);
              const metrics=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
              if(metrics.sw>metrics.cw+1) throw new Error(`${label}: overflow ${JSON.stringify(metrics)}`);
              if(errors.length) throw new Error(`${label}: console ${errors.join(' | ')}`);
              if(failed.length) throw new Error(`${label}: requests ${failed.join(' | ')}`);
              console.log(`${label} ${viewport.width}x${viewport.height} PASS lineHeight=${ratio.toFixed(3)}`);
              await page.close();
            }
            await browser.close();
          }
          run(process.argv[2],process.argv[3]).catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Local exact-main browser QA
        shell: bash
        env:
          PW: ${{ runner.temp }}/pw/node_modules/playwright
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory apps/portfolio-console/ai-api >"${RUNNER_TEMP}/server.log" 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi; sleep 1; done
          node "${RUNNER_TEMP}/korean-smoke.cjs" "http://127.0.0.1:4173/" "LOCAL_KO"

      - name: Deploy Korean-first production
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          npx --yes wrangler@4 pages deploy apps/portfolio-console/ai-api \
            --project-name "${PROJECT_NAME}" \
            --branch "${PRODUCTION_BRANCH}" \
            --commit-hash "${TARGET_SHA}" \
            --commit-message "B60 Korean-first production" \
            --commit-dirty=false

      - name: Verify canonical deployment identity
        shell: bash
        run: |
          set -euo pipefail
          project="$(mktemp)"
          for attempt in $(seq 1 18); do
            curl --silent --show-error --fail \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}" \
              -o "${project}"
            hash="$(jq -r '.result.canonical_deployment.deployment_trigger.metadata.commit_hash // empty' "${project}")"
            status="$(jq -r '.result.canonical_deployment.latest_stage.status // empty' "${project}")"
            if [ "${hash}" = "${TARGET_SHA}" ] && [ "${status}" = "success" ]; then break; fi
            if [ "${attempt}" -eq 18 ]; then jq '{result:{subdomain:.result.subdomain,canonical_deployment:.result.canonical_deployment}}' "${project}"; exit 1; fi
            sleep 10
          done
          jq -e --arg sha "${TARGET_SHA}" --arg branch "${PRODUCTION_BRANCH}" '.result.canonical_deployment.environment == "production" and .result.canonical_deployment.deployment_trigger.metadata.branch == $branch and .result.canonical_deployment.deployment_trigger.metadata.commit_hash == $sha and .result.canonical_deployment.latest_stage.status == "success"' "${project}" >/dev/null
          echo "CANONICAL_DEPLOYMENT=$(jq -r '.result.canonical_deployment.id' "${project}")"
          echo "CANONICAL_URL=$(jq -r '.result.canonical_deployment.url' "${project}")"
          echo "PUBLIC_APEX=https://${PUBLIC_DOMAIN}/"

      - name: Live Korean production QA
        shell: bash
        env:
          PW: ${{ runner.temp }}/pw/node_modules/playwright
        run: |
          set -euo pipefail
          node "${RUNNER_TEMP}/korean-smoke.cjs" "https://${PUBLIC_DOMAIN}/" "LIVE_KO"
          echo "PRODUCTION_ACCEPTED=https://${PUBLIC_DOMAIN}/"
