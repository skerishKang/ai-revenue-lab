name: PADIEM R2 C14 Media Upload (dispatch-only)

# Publishes the Rotating Memory Index (C14) runtime media set to the
# padiem-media R2 bucket. Dispatch-only: nothing runs on push/PR.
# Uses the established dedicated R2 credential authority (#2377/#2388/#2394,
# #2652 family). Existing keys are NEVER overwritten: any pre-existing key
# stops the run before any download or upload.
#
# Manifest: ops/padiem-r2-c14-upload-manifest.json (89 objects).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preflight only (no download, no upload)'
        type: boolean
        default: true
      limit:
        description: 'Optional comma-separated filenames for canary (default: all 89)'
        type: string
        default: ''

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: padiem-r2-c14-upload
  cancel-in-progress: false

jobs:
  upload:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # Dedicated R2 credential authority established by #2377/#2388/#2394.
      # Do not fall back to the shared Engine/Worker deployment credential.
      CLOUDFLARE_API_TOKEN: ${{ secrets.B62_R2_READONLY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 9be14bb7b8974e65d0afba647ab16932
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preflight existing keys (no overwrite)
        id: preflight
        shell: bash
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          python - <<'EOF'
          import json, os, subprocess, sys
          man = json.load(open('ops/padiem-r2-c14-upload-manifest.json', encoding='utf-8'))
          limit = {s.strip() for s in os.environ.get('LIMIT', '').split(',') if s.strip()}
          objs = [o for o in man['objects'] if not limit or o['file'] in limit]
          existing = []
          for o in objs:
              url = 'https://media.padiem.net/' + o['r2_key']
              code = subprocess.run(
                  ['curl', '-s', '-o', '/dev/null', '-w', '%{http_code}',
                   '--max-time', '30', '-I', url],
                  capture_output=True, text=True).stdout.strip()
              print(f"PREFLIGHT {code} {o['r2_key']}")
              if code == '200':
                  existing.append(o['r2_key'])
          print(f"PREFLIGHT_COUNT={len(objs)}")
          print(f"PREFLIGHT_EXISTING={len(existing)}")
          if existing:
              print('NO_OVERWRITE_STOP=YES', file=sys.stderr)
              for k in existing:
                  print(f'EXISTING_KEY={k}', file=sys.stderr)
              sys.exit(1)
          print('NO_OVERWRITE_STOP=NO')
          EOF

      - name: Upload plan (dry run)
        if: ${{ inputs.dry_run }}
        shell: bash
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          python - <<'EOF'
          import json, os
          man = json.load(open('ops/padiem-r2-c14-upload-manifest.json', encoding='utf-8'))
          limit = {s.strip() for s in os.environ.get('LIMIT', '').split(',') if s.strip()}
          objs = [o for o in man['objects'] if not limit or o['file'] in limit]
          print(f"DRY_RUN=YES")
          print(f"PLAN_COUNT={len(objs)}")
          print(f"PLAN_BYTES={sum(o['bytes'] for o in objs)}")
          print('R2_MUTATION=NONE')
          print('PRODUCTION_MUTATION=NONE')
          print('SECRET_VALUE_OUTPUT=0')
          EOF

      - name: Download from Drive and upload to R2
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'R2_CREDENTIAL_PRESENT=NO'; exit 1; }
          echo 'R2_CREDENTIAL_PRESENT=YES'
          pip install --quiet gdown
          export MANIFEST="${GITHUB_WORKSPACE}/ops/padiem-r2-c14-upload-manifest.json"
          export WORKDIR="${RUNNER_TEMP}/c14-upload"
          mkdir -p "${WORKDIR}"
          python - <<'EOF'
          import json, os, subprocess, sys
          man = json.load(open(os.environ['MANIFEST'], encoding='utf-8'))
          limit = {s.strip() for s in os.environ.get('LIMIT', '').split(',') if s.strip()}
          objs = [o for o in man['objects'] if not limit or o['file'] in limit]
          workdir = os.environ['WORKDIR']
          done = 0
          skipped = 0
          def wrun(args):
              return subprocess.run(args, capture_output=True, text=True)
          import time
          def download_with_retry(drive_id, dest, label):
              last = ''
              for attempt in range(1, 4):
                  if os.path.exists(dest):
                      os.remove(dest)
                  r = wrun(['gdown', drive_id, '-O', dest])
                  if r.returncode == 0 and os.path.exists(dest):
                      return True
                  last = (r.stderr or '')[-1500:]
                  print(f'DOWNLOAD_RETRY {label} gdown attempt={attempt} '
                        f'err={last[:200]}', flush=True)
                  time.sleep(20 * attempt)
              # Fallback: direct usercontent download (proven 206 for these IDs).
              if os.path.exists(dest):
                  os.remove(dest)
              r = wrun(['curl', '-sS', '-L', '--max-time', '600', '-o', dest,
                        f'https://drive.usercontent.google.com/download'
                        f'?id={drive_id}&export=download&confirm=t'])
              if r.returncode == 0 and os.path.exists(dest):
                  print(f'DOWNLOAD_FALLBACK_OK {label}', flush=True)
                  return True
              last = (r.stderr or '')[-1500:]
              print(f'DOWNLOAD_FAIL {label}\n{last}', file=sys.stderr)
              return False
          for o in objs:
              dest = os.path.join(workdir, o['file'])
              # NOTE: wrangler r2 object commands default to a LOCAL simulator.
              # --remote is REQUIRED to touch the real padiem-media bucket.
              # API-side idempotency: same bytes -> SKIP_IDENTICAL,
              # different bytes -> STOP (no overwrite).
              probe = os.path.join(workdir, 'probe-' + o['file'])
              r = wrun(['npx', '--yes', 'wrangler@4.130.0', 'r2', 'object', 'get',
                        f"padiem-media/{o['r2_key']}", '--file', probe,
                        '--remote'])
              if r.returncode == 0 and os.path.exists(probe):
                  psize = os.path.getsize(probe)
                  os.remove(probe)
                  if psize == o['bytes']:
                      skipped += 1
                      print(f'SKIP_IDENTICAL {o["r2_key"]}', flush=True)
                      continue
                  print(f"CONTENT_CONFLICT {o['r2_key']} r2_bytes={psize} "
                        f"manifest_bytes={o['bytes']}", file=sys.stderr)
                  sys.exit(1)
              print(f"PROBE_MISS {o['r2_key']} rc={r.returncode} "
                    f"err={((r.stderr or '')[-200:])}", flush=True)
              print(f'DOWNLOAD {o["file"]}', flush=True)
              if not download_with_retry(o['drive_id'], dest, o['file']):
                  sys.exit(1)
              actual = os.path.getsize(dest)
              if actual != o['bytes']:
                  print(f"SIZE_MISMATCH {o['file']} expected={o['bytes']} actual={actual}",
                        file=sys.stderr)
                  sys.exit(1)
              print(f"PUT padiem-media/{o['r2_key']}", flush=True)
              r = subprocess.run(
                  ['npx', '--yes', 'wrangler@4.130.0', 'r2', 'object', 'put',
                   f"padiem-media/{o['r2_key']}", '--file', dest,
                   '--content-type', 'video/mp4', '--remote'],
                  capture_output=True, text=True)
              if r.returncode != 0:
                  print(f"UPLOAD_FAIL {o['r2_key']}\n{r.stderr[-2000:]}", file=sys.stderr)
                  sys.exit(1)
              print(f"PUT_RESPONSE {o['r2_key']} {((r.stdout or '') + (r.stderr or ''))[-500:]}",
                    flush=True)
              # Authoritative verify via remote R2 API (bypasses CDN caching).
              vdest = os.path.join(workdir, 'verify-' + o['file'])
              r = subprocess.run(
                  ['npx', '--yes', 'wrangler@4.130.0', 'r2', 'object', 'get',
                   f"padiem-media/{o['r2_key']}", '--file', vdest,
                   '--remote'],
                  capture_output=True, text=True)
              if r.returncode != 0 or not os.path.exists(vdest):
                  print(f"API_VERIFY_FAIL {o['r2_key']}\n{r.stderr[-2000:]}",
                        file=sys.stderr)
                  sys.exit(1)
              vactual = os.path.getsize(vdest)
              os.remove(vdest)
              if vactual != o['bytes']:
                  print(f"API_SIZE_MISMATCH {o['r2_key']} expected={o['bytes']} "
                        f"actual={vactual}", file=sys.stderr)
                  sys.exit(1)
              print(f"API_VERIFY_OK {o['r2_key']} bytes={vactual}", flush=True)
              url = 'https://media.padiem.net/' + o['r2_key']
              head = subprocess.run(
                  ['curl', '-s', '-o', '/dev/null', '-w', '%{http_code} %{size_download}',
                   '--max-time', '60', '-I', url],
                  capture_output=True, text=True).stdout.strip()
              code = head.split(' ')[0]
              # Public HEAD is informational: a cached 404 from preflight must not
              # fail an API-verified upload. Retry briefly, then record and continue.
              if code != '200':
                  print(f'PUBLIC_HEAD_CACHED {o["r2_key"]} head={head}', flush=True)
              rng = subprocess.run(
                  ['curl', '-s', '-o', '/dev/null', '-w', '%{http_code}',
                   '--max-time', '60', '-r', '0-1023', url],
                  capture_output=True, text=True).stdout.strip()
              if rng != '206':
                  print(f'PUBLIC_RANGE_CACHED {o["r2_key"]} range={rng}', flush=True)
              else:
                  print(f'PUBLIC_RANGE_OK {o["r2_key"]}', flush=True)
              os.remove(dest)
              done += 1
              print(f'OK {done}/{len(objs)} {o["r2_key"]}', flush=True)
          print(f'UPLOAD_COUNT={done}')
          print(f'SKIP_IDENTICAL_COUNT={skipped}')
          EOF

      - name: Purge CDN cache and verify public convergence
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          LIMIT: ${{ inputs.limit }}
          MANIFEST: ${{ github.workspace }}/ops/padiem-r2-c14-upload-manifest.json
        run: |
          set -euo pipefail
          python - <<'EOF'
          import json, os, subprocess, sys, time
          man = json.load(open(os.environ['MANIFEST'], encoding='utf-8'))
          limit = {s.strip() for s in os.environ.get('LIMIT', '').split(',') if s.strip()}
          objs = [o for o in man['objects'] if not limit or o['file'] in limit]
          token = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          acct = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '')
          urls = ['https://media.padiem.net/' + o['r2_key'] for o in objs]
          # Best-effort single-URL purge (tolerate missing permission).
          try:
              z = subprocess.run(
                  ['curl', '-s', '--max-time', '30', '-H',
                   f'Authorization: Bearer {token}',
                   'https://api.cloudflare.com/client/v4/zones?name=padiem.net'],
                  capture_output=True, text=True)
              zid = (json.loads(z.stdout).get('result') or [{}])[0].get('id', '')
              if zid:
                  for i in range(0, len(urls), 30):
                      p = subprocess.run(
                          ['curl', '-s', '--max-time', '60', '-X', 'POST',
                           f'https://api.cloudflare.com/client/v4/zones/{zid}/purge_cache',
                           '-H', f'Authorization: Bearer {token}',
                           '-H', 'Content-Type: application/json',
                           '--data', json.dumps({'files': urls[i:i + 30]})],
                          capture_output=True, text=True)
                      ok = json.loads(p.stdout).get('success', False)
                      print(f'PURGE_BATCH {i // 30 + 1} success={ok}', flush=True)
              else:
                  print('PURGE_SKIPPED=ZONE_LOOKUP_EMPTY', flush=True)
          except Exception as e:
              print(f'PURGE_SKIPPED={e}', flush=True)
          # Poll public HEAD until all converge (20 rounds x 60s).
          for rnd in range(1, 21):
              pending = []
              for o in objs:
                  url = 'https://media.padiem.net/' + o['r2_key']
                  code = subprocess.run(
                      ['curl', '-s', '-o', '/dev/null', '-w', '%{http_code}',
                       '--max-time', '30', '-I', url],
                      capture_output=True, text=True).stdout.strip()
                  if code != '200':
                      pending.append(o['r2_key'])
              print(f'CONVERGE_ROUND {rnd} pending={len(pending)}', flush=True)
              if not pending:
                  print('PUBLIC_CONVERGENCE=ALL_200', flush=True)
                  break
              time.sleep(60)
          else:
              print(f'PUBLIC_CONVERGENCE=PENDING remaining={len(pending)}', file=sys.stderr)
              sys.exit(1)
          # Range spot-check on first key.
          rng = subprocess.run(
              ['curl', '-s', '-o', '/dev/null', '-w', '%{http_code}',
               '--max-time', '60', '-r', '0-1023', urls[0]],
              capture_output=True, text=True).stdout.strip()
          if rng != '206':
              print(f'PUBLIC_RANGE_FAIL {urls[0]} range={rng}', file=sys.stderr)
              sys.exit(1)
          print('PUBLIC_RANGE=206', flush=True)
          EOF

      - name: Mutation contract
        if: always()
        shell: bash
        run: |
          if [ '${{ inputs.dry_run }}' = 'true' ]; then echo 'R2_MUTATION=NONE'; else echo 'R2_MUTATION=APPEND_NEW_KEYS_ONLY'; fi
          echo 'R2_OVERWRITE=NO'
          echo 'PRODUCTION_MUTATION=NONE'
          echo 'SECRET_VALUE_OUTPUT=0'


  publish-design-human-hero-v1:
    name: Publish Design human cinematic hero v1
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/padiem-design-human-hero-media-v1-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.B62_R2_READONLY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 9be14bb7b8974e65d0afba647ab16932
      BUCKET: padiem-media
      SOURCE_DRIVE_ID: 1gJHzDFFB0-jcsRHyP33B-Ab7_FNmXvqJ
      SOURCE_SHA256: 27df135bedcd0c4c24dd68feec7b0908adb12276853dff52377dc865d3b1900c
      FILM_KEY: design/hero/padiem-design-human-cinematic-v1.mp4
      FILM_SHA256: 46a24c0b232fe28d7d7317aff0dc75c5189d1e07cf0d31277b019fca190b244f
      POSTER_KEY: design/hero/padiem-design-human-cinematic-v1.webp
      POSTER_SHA256: ab7661e64b4a4ab9b259a80ce3123f335e8f57cdf01f30fbc563d7ebb5ec95c9
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify bounded authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = "ops/padiem-design-human-hero-media-v1-20260919"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          echo "AUTHORITY=DESIGN_HERO_V1_ONLY"
          echo "OBJECT_COUNT=2"
          echo "OVERWRITE=NO"
          echo "PRODUCTION_PAGE_MUTATION=0"
          echo "SECRET_VALUE_OUTPUT=0"

      - name: Setup media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet gdown

      - name: Download and verify owner source
        shell: bash
        run: |
          set -euo pipefail
          gdown "$SOURCE_DRIVE_ID" -O "$RUNNER_TEMP/source.mp4"
          test "$(sha256sum "$RUNNER_TEMP/source.mp4" | awk '{print $1}')" = "$SOURCE_SHA256"
          echo "SOURCE_PARITY=PASS"

      - name: Build exact cinematic film and poster
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y -ss 12 -t 24 -i "$RUNNER_TEMP/source.mp4" -an             -vf "crop=1670:940:125:65,scale=1920:1080:flags=lanczos,format=yuv420p"             -r 24 -c:v libx264 -preset medium -crf 24 -movflags +faststart             "$RUNNER_TEMP/design-hero.mp4"
          ffmpeg -y -ss 12 -i "$RUNNER_TEMP/design-hero.mp4" -frames:v 1             -vf "scale=1600:-2" -c:v libwebp -quality 82             "$RUNNER_TEMP/design-hero.webp"
          test "$(sha256sum "$RUNNER_TEMP/design-hero.mp4" | awk '{print $1}')" = "$FILM_SHA256"
          test "$(sha256sum "$RUNNER_TEMP/design-hero.webp" | awk '{print $1}')" = "$POSTER_SHA256"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate             -show_entries format=duration,size -of json "$RUNNER_TEMP/design-hero.mp4"
          echo "DERIVATIVE_PARITY=PASS"

      - name: Preflight immutable object keys
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, pathlib, subprocess, sys
          items=[
            (os.environ["FILM_KEY"], os.environ["FILM_SHA256"]),
            (os.environ["POSTER_KEY"], os.environ["POSTER_SHA256"]),
          ]
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          for i,(key,expected) in enumerate(items):
              p=root/f"remote-{i}"
              r=subprocess.run(["npx","--yes","wrangler@4.130.0","r2","object","get",
                                f'{os.environ["BUCKET"]}/{key}',"--file",str(p),"--remote"],
                               capture_output=True,text=True)
              if r.returncode!=0 or not p.exists():
                  print(f"PREFLIGHT_MISS {key}")
                  continue
              sha=hashlib.sha256(p.read_bytes()).hexdigest()
              p.unlink(missing_ok=True)
              if sha!=expected:
                  print(f"PREFLIGHT_CONFLICT {key} sha256={sha}",file=sys.stderr)
                  sys.exit(1)
              print(f"PREFLIGHT_IDENTICAL {key}")
          print("PREFLIGHT=PASS")
          PY

      - name: Append missing exact objects only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, pathlib, subprocess, sys
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          items=[
            (os.environ["FILM_KEY"], root/"design-hero.mp4", os.environ["FILM_SHA256"], "video/mp4"),
            (os.environ["POSTER_KEY"], root/"design-hero.webp", os.environ["POSTER_SHA256"], "image/webp"),
          ]
          for idx,(key,src,expected,ctype) in enumerate(items):
              chk=root/f"chk-{idx}"
              r=subprocess.run(["npx","--yes","wrangler@4.130.0","r2","object","get",
                                f'{os.environ["BUCKET"]}/{key}',"--file",str(chk),"--remote"],
                               capture_output=True,text=True)
              if r.returncode==0 and chk.exists():
                  sha=hashlib.sha256(chk.read_bytes()).hexdigest()
                  chk.unlink(missing_ok=True)
                  if sha==expected:
                      print(f"IDENTICAL_SKIP {key}")
                      continue
                  print(f"NO_OVERWRITE_CONFLICT {key}",file=sys.stderr); sys.exit(1)
              r=subprocess.run(["npx","--yes","wrangler@4.130.0","r2","object","put",
                                f'{os.environ["BUCKET"]}/{key}',"--file",str(src),
                                "--content-type",ctype,
                                "--cache-control","public, max-age=31536000, immutable",
                                "--remote"],capture_output=True,text=True)
              if r.returncode!=0:
                  print(f"PUT_FAIL {key} {(r.stderr or '')[-500:]}",file=sys.stderr); sys.exit(1)
              print(f"PUT_PASS {key}")
          print("R2_MUTATION=APPEND_MISSING_ONLY")
          print("R2_OVERWRITE=NO")
          PY

      - name: Verify public media contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess, time, sys
          film="https://media.padiem.net/"+os.environ["FILM_KEY"]
          poster="https://media.padiem.net/"+os.environ["POSTER_KEY"]
          def headers(url):
              for n in range(1,21):
                  r=subprocess.run(["curl","-sS","-D","-","-o","/dev/null","--max-time","30",url],
                                   capture_output=True,text=True)
                  code=""
                  for line in r.stdout.splitlines():
                      if line.startswith("HTTP/"):
                          p=line.split()
                          if len(p)>1: code=p[1]
                  if code=="200":
                      return r.stdout.lower()
                  print(f"PUBLIC_WAIT {url} attempt={n} code={code or 'NONE'}")
                  time.sleep(10)
              raise SystemExit(f"PUBLIC_200_FAIL {url}")
          fh=headers(film)
          ph=headers(poster)
          if "content-type: video/mp4" not in fh or "immutable" not in fh:
              raise SystemExit("FILM_HEADER_FAIL")
          if "content-type: image/webp" not in ph or "immutable" not in ph:
              raise SystemExit("POSTER_HEADER_FAIL")
          r=subprocess.run(["curl","-sS","-D","-","-o","/dev/null","--max-time","30",
                            "-H","Range: bytes=0-1023",film],capture_output=True,text=True)
          if " 206 " not in (" "+r.stdout.replace("\r","")+" "):
              # Accept HTTP/2 206 and HTTP/1.1 206 by parsing status lines.
              ok=any(line.startswith("HTTP/") and len(line.split())>1 and line.split()[1]=="206" for line in r.stdout.splitlines())
              if not ok: raise SystemExit("FILM_RANGE_FAIL")
          print("PUBLIC_FILM=HTTP_200_TYPE_MP4_CACHE_IMMUTABLE_RANGE_206")
          print("PUBLIC_POSTER=HTTP_200_TYPE_WEBP_CACHE_IMMUTABLE")
          print("SECRET_VALUE_OUTPUT=0")
          PY
