name: B54 OAuth Browser Canary Contract Tests

# #2976 (child of #2636) — CI locus for the reusable readonly OAuth browser
# canary contract. The contract and its focused tests were merged by PR #2796,
# but no workflow executed them, so a later change to the contract could not be
# reviewed against its own regression coverage.
#
# This workflow never performs OAuth. It installs pytest and runs provider-free
# contract tests plus a static pin of the reviewed read-only scope table.

on:
  pull_request:
    paths:
      - ".github/scripts/b54_oauth_browser_canary_contract.py"
      - ".github/tests/test_b54_oauth_browser_canary_contract.py"
      - ".github/workflows/b54-oauth-browser-canary-contract-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary-contract-tests:
    name: Canary contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --quiet "pytest>=8,<10"

      - name: Run focused canary contract tests
        run: python -m pytest -q .github/tests/test_b54_oauth_browser_canary_contract.py

      - name: Pin reviewed read-only scope table
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'CANARY_REVIEWED_READONLY_SCOPES' .github/scripts/b54_oauth_browser_canary_contract.py
          grep -Fq 'GOOGLE_DRIVE_READONLY_SCOPE = "https://www.googleapis.com/auth/drive.readonly"' .github/scripts/b54_oauth_browser_canary_contract.py
          grep -Fq 'GMAIL_READONLY_SCOPE = "https://www.googleapis.com/auth/gmail.readonly"' .github/scripts/b54_oauth_browser_canary_contract.py
          echo 'REVIEWED_READONLY_SCOPE_TABLE=PINNED'

      - name: Record no OAuth execution
        shell: bash
        run: |
          echo 'B54_OAUTH_CANARY_CONTRACT_TESTS=PASS'
          echo 'OAUTH_RECONNECT=NO'
          echo 'LIVE_PROVIDER_CALL=0'
          echo 'TICKET_POST=0'
          echo 'CONNECT_POST=0'
          echo 'PRODUCTION_MUTATION=0'
