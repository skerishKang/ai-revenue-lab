# Nightly full-suite safety net for the latest main commit.
#
# Why: this repository's PR CI is mostly path-scoped, so an app test suite can
# break on main without any PR touching that app (observed with the KAgent
# suite, #6265 -> #6340). This workflow runs every included app test suite
# against the current main HEAD once a day (KST early morning) plus manual
# dispatch, one job per app so one failing suite still reports the others.
#
# Rules honored here:
# - Pure tests only: no Production deploy, no Cloudflare access, no secrets.
# - Run commands are reused verbatim from each app's existing CI workflow
#   (b64-ai-reward-router-ci, b62-padiem-chat-react-ci, padiem-ai-engine-ci,
#   claw-connect-contract-tests, claw4-3083-desktop-shell-ci,
#   b03-living-fiction-cloudflare-m0-ci); suites without a prior CI workflow
#   use the app's own documented uv/pytest invocation.
# - A failing suite opens or updates exactly one tracking issue.

name: Nightly Main Full Suite

on:
  schedule:
    # 19:30 UTC == 04:30 KST (KST 새벽)
    - cron: "30 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-main-full-suite
  cancel-in-progress: false

jobs:
  app-b64-ai-reward-router:
    name: tests — b64-ai-reward-router
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm ci
        working-directory: apps/ai-reward-router
        run: npm ci
      - name: npm run build
        working-directory: apps/ai-reward-router
        run: npm run build
      - name: npm run typecheck
        working-directory: apps/ai-reward-router
        run: npm run typecheck
      - name: npm test
        working-directory: apps/ai-reward-router
        run: npm test

  app-padiem-chat-react:
    name: tests — padiem-chat-react
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm ci
        working-directory: apps/padiem-chat-react
        run: npm ci
      - name: npm run typecheck
        working-directory: apps/padiem-chat-react
        run: npm run typecheck
      - name: npm run test
        working-directory: apps/padiem-chat-react
        run: npm run test
      - name: npm run build
        working-directory: apps/padiem-chat-react
        run: npm run build

  app-padiem-desktop-shell:
    name: tests — padiem-desktop-shell
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm ci
        working-directory: apps/padiem-desktop-shell
        run: npm ci
      - name: npm run typecheck
        working-directory: apps/padiem-desktop-shell
        run: npm run typecheck
      - name: npm test
        working-directory: apps/padiem-desktop-shell
        run: npm test

  app-claw-connect:
    name: tests — claw-connect (contract)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        working-directory: apps/claw-connect
        run: |
          python -m pip install --disable-pip-version-check 'pytest>=8,<10' 'cryptography' -r requirements-wss-review.txt
          python -m pip install --disable-pip-version-check -e ../../packages/padiem-ai-core
      - name: Run contract tests
        working-directory: apps/claw-connect
        run: python -m pytest -q tests

  app-padiem-chat:
    name: tests — padiem-chat
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.5'
      - name: uv sync
        working-directory: apps/padiem-chat
        run: uv sync --extra dev --frozen
      - name: pytest
        working-directory: apps/padiem-chat
        run: uv run --frozen pytest -q

  app-padiem-ai-engine:
    name: tests — padiem-ai-engine
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.5'
      - name: uv sync
        working-directory: apps/padiem-ai-engine
        run: uv sync --extra dev
      - name: compileall
        working-directory: apps/padiem-ai-engine
        run: uv run python -m compileall -q app worker.py ../../packages/padiem-ai-core/padiem_ai_core
      - name: pytest
        working-directory: apps/padiem-ai-engine
        run: uv run python -m pytest -q

  app-korean-ai-platform:
    name: tests — korean-ai-platform (B14 pilot)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.5'
      - name: uv sync
        working-directory: apps/korean-ai-platform
        run: uv sync --group dev
      - name: pytest
        working-directory: apps/korean-ai-platform
        run: uv run pytest -q

  app-padiem-ai-core:
    name: tests — packages/padiem-ai-core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.5'
      - name: uv sync
        working-directory: packages/padiem-ai-core
        run: uv sync --extra dev
      - name: pytest
        working-directory: packages/padiem-ai-core
        run: uv run pytest -q tests

  app-padiem-control-plane:
    name: tests — packages/padiem-control-plane
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Control Plane package
        run: |
          python -m pip install --disable-pip-version-check -e 'packages/padiem-control-plane[dev]' -e packages/padiem-ai-core
          python -m pip check
      - name: pytest
        working-directory: packages/padiem-control-plane
        run: python -m pytest -q tests

  app-korean-ai-code-agent:
    name: tests — korean-ai-code-agent
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # #3037. The wheel filename, URL, size and digest all come from the
      # source-owned receipt module, so this workflow cannot drift away from the
      # receipt. Nothing here resolves a version range or "latest".
      - name: Select the approved Pillow 12.3.0 wheel receipt
        shell: bash
        env:
          PYTHONPATH: packages/padiem-ai-core
          RUNNER_FAMILY: ${{ runner.os }}
        run: |
          set -euo pipefail
          eval "$(python "$GITHUB_WORKSPACE/packages/padiem-ai-core/padiem_ai_core/pillow_wheel_receipts.py" "$RUNNER_FAMILY")"
          echo "receipt_id=${PILLOW_WHEEL_RECEIPT_ID}" >> "$GITHUB_OUTPUT"
          echo "filename=${PILLOW_WHEEL_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=${PILLOW_WHEEL_SHA256}" >> "$GITHUB_OUTPUT"
          echo "size=${PILLOW_WHEEL_SIZE}" >> "$GITHUB_OUTPUT"
          echo "Approved Pillow receipt: ${PILLOW_WHEEL_RECEIPT_ID}"

      - name: Download the approved Pillow wheel
        shell: bash
        env:
          PYTHONPATH: packages/padiem-ai-core
          RUNNER_FAMILY: ${{ runner.os }}
        run: |
          set -euo pipefail
          eval "$(python "$GITHUB_WORKSPACE/packages/padiem-ai-core/padiem_ai_core/pillow_wheel_receipts.py" "$RUNNER_FAMILY")"
          wheel_dir="$RUNNER_TEMP/padiem-pillow-wheel"
          mkdir -p "$wheel_dir"
          curl --fail --location --silent --show-error \
            --output "$wheel_dir/${PILLOW_WHEEL_FILENAME}" \
            "$PILLOW_WHEEL_URL"

      # Filename, then exact size, then exact SHA-256, all before any installer is
      # allowed to touch the file.
      - name: Verify the downloaded Pillow wheel against the receipt
        shell: bash
        env:
          PYTHONPATH: packages/padiem-ai-core
          RUNNER_FAMILY: ${{ runner.os }}
        run: |
          set -euo pipefail
          eval "$(python "$GITHUB_WORKSPACE/packages/padiem-ai-core/padiem_ai_core/pillow_wheel_receipts.py" "$RUNNER_FAMILY")"
          python "$GITHUB_WORKSPACE/packages/padiem-ai-core/padiem_ai_core/pillow_wheel_receipts.py" \
            "$RUNNER_FAMILY" \
            "$RUNNER_TEMP/padiem-pillow-wheel/${PILLOW_WHEEL_FILENAME}"
          echo "verified ${PILLOW_WHEEL_FILENAME}"

      # --no-index keeps pip off the network and --no-deps keeps it from pulling
      # a second, unverified Pillow alongside the verified one.
      - name: Install the verified local Pillow wheel
        shell: bash
        env:
          PYTHONPATH: packages/padiem-ai-core
          RUNNER_FAMILY: ${{ runner.os }}
        run: |
          set -euo pipefail
          eval "$(python "$GITHUB_WORKSPACE/packages/padiem-ai-core/padiem_ai_core/pillow_wheel_receipts.py" "$RUNNER_FAMILY")"
          python -m pip install --disable-pip-version-check \
            --no-index --no-deps --force-reinstall \
            "$RUNNER_TEMP/padiem-pillow-wheel/${PILLOW_WHEEL_FILENAME}"

      # Pillow is intentionally absent from KAgent base dependencies. The exact
      # verified wheel above is the only image runtime admitted into this lane;
      # later dependency installation must not re-resolve or widen that runtime.
      # KAgent itself is exercised from ``src`` below rather than installed as an
      # editable distribution. An editable .pth would make the reviewed parser
      # child importable even when a test deliberately empties PYTHONPATH, so the
      # real import-failure contract would be invalidated.
      - name: Install monorepo conformance dependencies
        working-directory: apps/korean-ai-code-agent
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            -e "../../packages/padiem-ai-core[tools,documents,render,tables,authoring]"
          python -m pip install --disable-pip-version-check \
            -e "../../packages/padiem-control-plane"
          python -m pip install --disable-pip-version-check \
            -e "../../apps/padiem-ai-engine/clients/python"

      # Prove the artifact that is actually installed is the approved one, rather
      # than a same-version wheel some other step resolved.
      - name: Prove the installed Pillow artifact
        working-directory: apps/korean-ai-code-agent
        shell: bash
        env:
          PYTHONPATH: packages/padiem-ai-core
          RUNNER_FAMILY: ${{ runner.os }}
        run: |
          set -euo pipefail
          eval "$(python "$GITHUB_WORKSPACE/packages/padiem-ai-core/padiem_ai_core/pillow_wheel_receipts.py" "$RUNNER_FAMILY")"
          python - "$PILLOW_WHEEL_PLATFORM_TAG" "$PILLOW_WHEEL_FILENAME" <<'PY'
          import json
          import pathlib
          import sys

          import PIL
          from PIL import features

          platform_tag, filename = sys.argv[1], sys.argv[2]
          if PIL.__version__ != "12.3.0":
              raise SystemExit(f"unexpected installed Pillow {PIL.__version__}")

          payload = {
              "version": PIL.__version__,
              "interpreter_tag": f"cp{sys.version_info[0]}{sys.version_info[1]}",
              "platform_tag": platform_tag,
              "wheel_filename": filename,
              "native_extensions": sorted(
                  path.name
                  for path in pathlib.Path(PIL.__file__).parent.glob("_imaging*")
              ),
              "codecs": {
                  codec: bool(features.check(codec))
                  for codec in ("jpg", "zlib", "webp", "libtiff")
              },
          }
          record = pathlib.Path("recorded_pillow_artifact.json")
          record.write_text(
              json.dumps(payload, indent=2, sort_keys=True), encoding="utf-8"
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Install KAgent pytest dependencies
        working-directory: apps/korean-ai-code-agent
        run: python -m pip install --disable-pip-version-check "pytest>=8,<10" "openpyxl>=3.1,<4"
      - name: pytest
        working-directory: apps/korean-ai-code-agent
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests

  app-living-fiction:
    name: tests — living-fiction (b03 contract)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest only
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<10'
      - name: contract tests
        working-directory: apps/living-fiction
        run: |
          python -m pytest -q tests/test_cloudflare_migration_contract.py
          python -m pytest -q tests/test_migration_prefix_guard_3110.py
      - name: compileall
        working-directory: apps/living-fiction
        run: python -m compileall -q app deploy/cloudflare/worker.py

  nightly-failure-issue:
    name: failure issue (create or update)
    needs:
      - app-b64-ai-reward-router
      - app-padiem-chat-react
      - app-padiem-desktop-shell
      - app-claw-connect
      - app-padiem-chat
      - app-padiem-ai-engine
      - app-korean-ai-platform
      - app-padiem-ai-core
      - app-padiem-control-plane
      - app-korean-ai-code-agent
      - app-living-fiction
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Create or update the fixed-title failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          title="[CI] 야간 main 전체 점검 실패"
          failed="$(printf '%s' "${NEEDS_JSON}" | jq -r 'to_entries[] | select(.value.result == "failure") | .key' | sort | sed 's/^/- /')"
          if [ -z "${failed}" ]; then
            echo "no failed job found; nothing to report" >&2
            exit 0
          fi
          body="$(printf '야간 main 전체 점검에서 실패한 앱 스위트:\n\n%s\n\n실행 로그: %s\n대상 커밋: %s' "${failed}" "${RUN_URL}" "${COMMIT}")"
          existing="$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
            echo "ISSUE_UPDATED=${existing}"
          else
            gh issue create --title "${title}" --body "${body}"
            echo "ISSUE_CREATED"
          fi
