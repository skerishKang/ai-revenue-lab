name: Padiem AI Engine CI

on:
  pull_request:
    paths:
      - 'apps/padiem-ai-engine/**'
      - 'packages/padiem-ai-core/**'
      # Living Learning-only source is independently covered by its dedicated
      # CI below. Engine depends on Core, not Living Learning product code.
      # Keep Core changes here and retain the full LL regression within
      # Engine's job whenever Engine/Core itself changes.
      - '.github/tests/test_3989_engine_living_learning_ci_scope.py'
      # #5341: the shared Core import-scope proof and its classifier decide
      # whether a Core change reaches the Engine runtime at all.
      - '.github/scripts/ci_core_import_scope.py'
      - '.github/scripts/b62_ci_impact_scope_3989.py'
      - '.github/tests/test_5341_core_import_scope.py'
      - '.github/workflows/padiem-ai-engine-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: padiem-ai-engine-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  engine-core-reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      # #5341: prove whether the changed Core module is outside the Engine
      # runtime import closure. An unproven or unknown change set keeps the
      # complete Engine + Core regression below.
      - name: Classify the Core change impact for Engine
        id: core-scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/b62_ci_impact_scope_3989.py --core-product engine

      - name: Test the shared Core import-scope contract
        run: python -m unittest discover -s .github/tests -p test_5341_core_import_scope.py -q

      - name: Detect Engine source
        id: engine-source
        shell: bash
        run: |
          if [ -d apps/padiem-ai-engine ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'PADIEM_AI_ENGINE_SOURCE=present'
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'PADIEM_AI_ENGINE_SOURCE=bootstrap_only'
          fi

      - name: Bootstrap-only gate registration
        if: steps.engine-source.outputs.present != 'true'
        run: |
          test ! -e apps/padiem-ai-engine
          echo 'ENGINE_GATE_BOOTSTRAP_ONLY=PASS'
          echo 'ENGINE_PRODUCT_ACCEPTANCE=NOT_RUN'
          echo 'REAL_PROVIDER_CALLS=0'
          echo 'PRODUCTION_DEPLOYMENT=NO'

      - name: Set up Python
        if: steps.engine-source.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        if: steps.engine-source.outputs.present == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'

      - name: Resolve Engine with shared Core dependency
        if: steps.engine-source.outputs.present == 'true' && steps.core-scope.outputs.core_independent != 'true'
        working-directory: apps/padiem-ai-engine
        run: uv sync --extra dev

      - name: Prove shared Core import without PYTHONPATH
        if: steps.engine-source.outputs.present == 'true' && steps.core-scope.outputs.core_independent != 'true'
        working-directory: apps/padiem-ai-engine
        run: uv run python -c "import padiem_ai_core, pathlib; print(pathlib.Path(padiem_ai_core.__file__).resolve())"

      - name: Compile Engine and Core
        if: steps.engine-source.outputs.present == 'true' && steps.core-scope.outputs.core_independent != 'true'
        working-directory: apps/padiem-ai-engine
        run: uv run python -m compileall -q app worker.py ../../packages/padiem-ai-core/padiem_ai_core

      - name: Engine network-free tests
        if: steps.engine-source.outputs.present == 'true' && steps.core-scope.outputs.core_independent != 'true'
        working-directory: apps/padiem-ai-engine
        run: uv run python -m pytest -q

      - name: Set up Node for cross-runtime reference client
        if: steps.engine-source.outputs.present == 'true' && steps.core-scope.outputs.core_independent != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript Service Binding client tests
        if: steps.engine-source.outputs.present == 'true' && steps.core-scope.outputs.core_independent != 'true'
        working-directory: apps/padiem-ai-engine
        run: node --test clients/js/test/client.test.mjs

      - name: Cross-account ingress contract tests
        if: steps.engine-source.outputs.present == 'true' && steps.core-scope.outputs.core_independent != 'true'
        working-directory: apps/padiem-ai-engine
        run: node --test ingress/test/worker.test.mjs

      - name: Padiem AI Core full tests
        if: steps.engine-source.outputs.present == 'true' && steps.core-scope.outputs.core_independent != 'true'
        working-directory: packages/padiem-ai-core
        run: uv run --extra dev python -m pytest -q

      - name: Pywrangler dependency sync
        if: steps.engine-source.outputs.present == 'true' && steps.core-scope.outputs.core_independent != 'true'
        working-directory: apps/padiem-ai-engine
        run: uv run pywrangler sync --force

      - name: Prove Core vendored for Engine Worker
        if: steps.engine-source.outputs.present == 'true' && steps.core-scope.outputs.core_independent != 'true'
        working-directory: apps/padiem-ai-engine
        run: |
          set -euo pipefail
          test -f python_modules/padiem_ai_core/__init__.py
          test -f python_modules/padiem_ai_core/execution_runtime.py
          test -f python_modules/padiem_ai_core/b14_execution.py
          echo 'PADIEM_AI_ENGINE_CORE_VENDORED=PASS'

      - name: Prove ToolRuntime Worker-native validation path
        if: steps.engine-source.outputs.present == 'true' && steps.core-scope.outputs.core_independent != 'true'
        working-directory: apps/padiem-ai-engine
        run: |
          set -euo pipefail
          test -f python_modules/padiem_ai_core/tool_runtime.py
          grep -q 'class _BoundedSchemaValidator' python_modules/padiem_ai_core/tool_runtime.py
          jsonschema_path="$(find .venv .venv-workers python_modules -path '*/jsonschema/__init__.py' -print -quit 2>/dev/null || true)"
          referencing_path="$(find .venv .venv-workers python_modules -path '*/referencing/__init__.py' -print -quit 2>/dev/null || true)"
          rpds_path="$(find .venv .venv-workers python_modules -path '*/rpds/__init__.py' -print -quit 2>/dev/null || true)"
          test -z "${jsonschema_path}"
          test -z "${referencing_path}"
          test -z "${rpds_path}"
          echo 'PADIEM_AI_ENGINE_TOOL_RUNTIME_WORKER_NATIVE=PASS'
      - name: Real Worker/Pyodide Drive external transport probe
        if: steps.engine-source.outputs.present == 'true' && steps.core-scope.outputs.core_independent != 'true'
        working-directory: apps/padiem-ai-engine
        run: |
          set -euo pipefail
          cat > .runtime-drive-transport-probe.toml <<'EOF'
          name = "padiem-ai-engine-drive-transport-probe"
          main = "worker_runtime_drive_transport_probe.py"
          compatibility_date = "2026-08-25"
          compatibility_flags = ["python_workers"]
          workers_dev = true
          EOF

          uv run python worker_runtime_drive_probe_origin.py --port 9101 > /tmp/engine-drive-origin.log 2>&1 &
          ORIGIN_PID=$!
          npx --yes wrangler@4.130.0 dev --config .runtime-drive-transport-probe.toml --port 8793 > /tmp/engine-drive-workerd.log 2>&1 &
          WORKER_PID=$!

          cleanup() {
            kill "$WORKER_PID" "$ORIGIN_PID" 2>/dev/null || true
            rm -f .runtime-drive-transport-probe.toml
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8793/ready >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/engine-drive-workerd.log
            exit 1
          fi

          HTTP_CODE="$(curl -sS -o /tmp/engine-drive-result.json -w '%{http_code}' http://127.0.0.1:8793/probe)"
          cat /tmp/engine-drive-result.json
          if [ "$HTTP_CODE" != "200" ]; then
            cat /tmp/engine-drive-workerd.log
            exit 1
          fi

          uv run python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/engine-drive-result.json").read_text())
          required = (
              "real_httpx_transport_class",
              "worker_fetch_get",
              "incremental_body",
              "timeout_enforced",
              "host_gate",
          )
          failed = [name for name in required if data.get(name) is not True]
          if failed:
              raise SystemExit(
                  f"Worker Drive transport runtime probe failed: {failed}; "
                  f"error_type={data.get('error_type', 'NONE')}"
              )
          print("WORKER_DRIVE_EXTERNAL_TRANSPORT_PASS")
          PY

      - name: Python Worker bundle dry-run
        if: steps.engine-source.outputs.present == 'true' && steps.core-scope.outputs.core_independent != 'true'
        working-directory: apps/padiem-ai-engine
        run: uv run pywrangler deploy --dry-run --outdir ../../.tmp/padiem-ai-engine-worker-bundle

      # #5341: a Core change that no Engine source imports cannot change the
      # Engine runtime. The focused Core contract below is the load-bearing
      # check for that change set; every Engine/Core integration step above
      # stays on the complete path for every other change.
      - name: Focused independent Core contract
        if: steps.engine-source.outputs.present == 'true' && steps.core-scope.outputs.core_independent == 'true'
        working-directory: packages/padiem-ai-core
        env:
          CORE_TESTS: ${{ steps.core-scope.outputs.core_tests }}
          CORE_MODULES: ${{ steps.core-scope.outputs.core_modules }}
        run: |
          set -euo pipefail
          uv sync --extra dev
          uv run python -m compileall -q padiem_ai_core
          if [ -n "$CORE_MODULES" ]; then
            read -r -a modules <<< "$CORE_MODULES"
            test "${#modules[@]}" -ge 1
            for module in "${modules[@]}"; do
              [[ "$module" =~ ^[a-z][a-z0-9_]*$ ]]
            done
            uv run python - "$CORE_MODULES" <<'PY'
          import importlib
          import sys

          for name in sys.argv[1].split():
              importlib.import_module(f"padiem_ai_core.{name}")
          print("ENGINE_CORE_INDEPENDENT_IMPORT_SMOKE=PASS")
          PY
          else
            echo 'ENGINE_CORE_INDEPENDENT_IMPORT_SMOKE=NOT_REQUIRED'
          fi
          if [ -n "$CORE_TESTS" ]; then
            read -r -a tests <<< "$CORE_TESTS"
            test "${#tests[@]}" -ge 1
            for test_file in "${tests[@]}"; do
              [[ "$test_file" =~ ^test_[A-Za-z0-9_]+\.py$ ]]
              test -f "tests/$test_file"
            done
            uv run python -m pytest -q "${tests[@]/#/tests/}"
          else
            echo 'ENGINE_CORE_FOCUSED_TESTS=NONE'
          fi
          echo 'ENGINE_CORE_FOCUSED=1'
          echo 'ENGINE_PUBLIC_HTTP_FALLBACK=0'
          echo 'REAL_PROVIDER_CALLS=0'
          echo 'PRODUCTION_DEPLOYMENT=NO'

      - name: Record zero-live-call contract
        if: steps.engine-source.outputs.present == 'true'
        run: |
          echo 'ENGINE_PUBLIC_HTTP_FALLBACK=0'
          echo 'REAL_PROVIDER_CALLS=0'
          echo 'PRODUCTION_DEPLOYMENT=NO'
