name: Padiem AI Engine CI

on:
  pull_request:
    paths:
      - 'apps/padiem-ai-engine/**'
      - 'packages/padiem-ai-core/**'
      - 'apps/living-learning/**'
      - '.github/workflows/padiem-ai-engine-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-core-reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'

      - name: Resolve Engine with shared Core dependency
        working-directory: apps/padiem-ai-engine
        run: uv sync --extra dev

      - name: Prove shared Core import without PYTHONPATH
        working-directory: apps/padiem-ai-engine
        run: uv run python -c "import padiem_ai_core, pathlib; print(pathlib.Path(padiem_ai_core.__file__).resolve())"

      - name: Compile Engine and Core
        working-directory: apps/padiem-ai-engine
        run: uv run python -m compileall -q app worker.py ../../packages/padiem-ai-core/padiem_ai_core

      - name: Engine network-free tests
        working-directory: apps/padiem-ai-engine
        run: uv run python -m pytest -q

      - name: Padiem AI Core full tests
        working-directory: packages/padiem-ai-core
        run: uv run --extra dev python -m pytest -q

      - name: Living Learning Core-reuse regression
        working-directory: apps/living-learning
        env:
          LL_PROVIDER_TYPE: mock
        run: |
          python -m pip install --disable-pip-version-check -r requirements-padiem-core.txt
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pip install --disable-pip-version-check 'jsonschema>=4.23,<5'
          python -m pip check
          python -m pytest -q

      - name: Pywrangler dependency sync
        working-directory: apps/padiem-ai-engine
        run: uv run pywrangler sync --force

      - name: Prove Core vendored for Engine Worker
        working-directory: apps/padiem-ai-engine
        run: |
          set -euo pipefail
          test -f python_modules/padiem_ai_core/__init__.py
          test -f python_modules/padiem_ai_core/execution_runtime.py
          test -f python_modules/padiem_ai_core/b14_execution.py
          echo 'PADIEM_AI_ENGINE_CORE_VENDORED=PASS'

      - name: Python Worker bundle dry-run
        working-directory: apps/padiem-ai-engine
        run: uv run pywrangler deploy --dry-run --outdir ../../.tmp/padiem-ai-engine-worker-bundle

      - name: Record zero-live-call contract
        run: |
          echo 'ENGINE_PUBLIC_HTTP_FALLBACK=0'
          echo 'REAL_PROVIDER_CALLS=0'
          echo 'PRODUCTION_DEPLOYMENT=NO'
