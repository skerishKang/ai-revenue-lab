name: B03 Living Fiction Cloudflare Preview Deploy

# HOLD as of 2026-09-09 KST: Cloudflare Containers require Workers Paid.
# This workflow must not be used for the current B03 UI check. The active path
# is existing Modal redeploy tracked by #2255. This file remains only as future
# Cloudflare migration preparation and is guarded against accidental dispatch.
# Builds, if re-enabled by a future owner decision, must occur on CI/remote
# infrastructure only. Do not use local Docker Desktop.

on:
  workflow_dispatch:
    inputs:
      workers_paid_confirmed:
        description: "Type YES only after owner approves Workers Paid / Containers for B03 or broader infra."
        required: true
        default: "NO"
      owner_paid_plan_issue:
        description: "Issue number recording the separate paid-plan approval."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: b03-lf-preview-deploy
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Dedicated B03 preview token. Scoped to the account that already hosts
      # living-fiction-cloudflare-container-m0 and granted Workers Containers
      # Write, which the shared CLOUDFLARE_API_TOKEN does not carry.
      CLOUDFLARE_API_TOKEN: ${{ secrets.LF_PREVIEW_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Guard Workers Paid approval
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.workers_paid_confirmed }}" != "YES" ]; then
            cat >&2 <<'MSG'
          B03 Cloudflare Container Preview deploy is HOLD.

          Reason:
          - Cloudflare Containers require Workers Paid.
          - Owner decision on 2026-09-09: do not purchase Workers Paid solely for B03 UI check.
          - Active path: existing Modal redeploy, tracked by #2255.
          - Local Docker Desktop remains forbidden by operating policy.

          To use this workflow in the future, record a separate paid-plan owner
          approval issue and dispatch with workers_paid_confirmed=YES.
          MSG
            exit 1
          fi
          if [ -z "${{ inputs.owner_paid_plan_issue }}" ]; then
            echo "owner_paid_plan_issue is required when enabling paid Containers deploy" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install current Cloudflare tooling
        working-directory: apps/living-fiction
        run: npm install --no-save --ignore-scripts wrangler @cloudflare/containers

      - name: Resolve workers.dev subdomain and preview origin
        id: sub
        run: |
          SUB=$(curl -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["result"]["subdomain"])')
          test -n "$SUB"
          echo "subdomain=$SUB" >> "$GITHUB_OUTPUT"
          echo "origin=https://living-fiction-cloudflare-container-m0.$SUB.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Put Worker secrets (server-side only, values never printed)
        working-directory: apps/living-fiction
        env:
          LF_DATABASE_URL: ${{ secrets.LF_PREVIEW_DATABASE_URL }}
          LF_ADMIN_SECRET: ${{ secrets.LF_PREVIEW_ADMIN_SECRET }}
          LF_CREDENTIAL_HMAC_KEY: ${{ secrets.LF_PREVIEW_CREDENTIAL_HMAC_KEY }}
          LF_SESSION_HMAC_KEY: ${{ secrets.LF_PREVIEW_SESSION_HMAC_KEY }}
          LF_ALLOWED_ORIGINS: ${{ steps.sub.outputs.origin }}
        run: |
          for k in LF_DATABASE_URL LF_ADMIN_SECRET LF_CREDENTIAL_HMAC_KEY LF_SESSION_HMAC_KEY LF_ALLOWED_ORIGINS; do
            v=$(printenv "$k")
            if [ -z "$v" ]; then echo "missing secret $k" >&2; exit 1; fi
            printf '%s' "$v" | npx wrangler secret put "$k" --config wrangler.cloudflare-container.toml
          done

      - name: Build container image and deploy Preview Worker
        working-directory: apps/living-fiction
        run: npx wrangler deploy --config wrangler.cloudflare-container.toml

      - name: Verify /health and /access on preview origin
        run: |
          ORIGIN="${{ steps.sub.outputs.origin }}"
          echo "verifying $ORIGIN"
          h=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 180 "$ORIGIN/health")
          echo "health status=$h"
          cat /tmp/health.json
          test "$h" = "200"
          a=$(curl -sS -o /tmp/access.html -w '%{http_code}' --max-time 180 "$ORIGIN/access")
          echo "access status=$a"
          test "$a" = "200"
          grep -q "Living Fiction" /tmp/access.html
