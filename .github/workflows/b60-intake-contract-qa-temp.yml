name: B60 Intake Contract QA Temp

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  contract:
    if: github.event.pull_request.number == 655
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify B60 intake contract
        shell: bash
        run: |
          set -euo pipefail
          cd reference/business-60-ai-api-v1/collector
          node --test intake-core.test.cjs
          node run-intake.cjs --help
          node <<'NODE'
          const assert = require('node:assert/strict');
          const manifest = require('./source-manifest.cjs');
          const core = require('./intake-core.cjs');
          assert.equal(manifest.length, 7, 'expected seven explicit official-source entries');
          assert.equal(new Set(manifest.map(x => x.id)).size, manifest.length, 'source ids must be unique');
          assert.ok(manifest.every(x => x.authority === 'PRIMARY_OFFICIAL'), 'all current sources must remain primary official');
          assert.ok(manifest.every(x => /^https:\/\//.test(x.url)), 'all sources must use HTTPS');
          assert.equal(core.STATES.NEEDS_REVIEW, 'NEEDS_REVIEW');
          assert.equal(core.STATES.APPROVED_FOR_SNAPSHOT, 'APPROVED_FOR_SNAPSHOT');
          console.log(JSON.stringify({ manifestEntries: manifest.length, publicationBoundary: 'REVIEW_REQUIRED', status: 'PASS' }));
          NODE
