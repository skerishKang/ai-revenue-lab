name: Validate B12 Observable Final 20260810
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'reference/business-12-creator-mini-media-v1/**'
      - '.github/workflows/validate-b12-observable-20260810.yml'
permissions:
  contents: write
jobs:
  final:
    if: github.event.pull_request.head.ref == 'design/b12-creator-release-room-v2-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Static contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check reference/business-12-creator-mini-media-v1/scripts/creator-release-room-v2.js
          node --check reference/business-12-creator-mini-media-v1/scripts/ux-app.js
          python3 - <<'PY'
          from pathlib import Path
          b=Path('reference/business-12-creator-mini-media-v1')
          root=(b/'index.html').read_text(encoding='utf-8'); guide=(b/'guide.html').read_text(encoding='utf-8'); ux=(b/'ux.html').read_text(encoding='utf-8'); css=(b/'styles/creator-release-room-v2.css').read_text(encoding='utf-8')
          assert 'creator-release-room-v2.css' in root
          assert 'creator-release-room-v2.css' in guide
          assert 'creator-release-room-v2.css' in ux
          assert 'creator-release-room-v2.js' in ux
          assert 'Creator Release Room' in root and 'Creator Release Room' in guide
          assert 'IDEA → DIRECTION → FORMATS → REVIEW → PACKAGE' in css
          assert not (b/'index.v2-source.html').exists()
          assert not (b/'guide.v2-source.html').exists()
          print('B12_STATIC_PASS=1')
          PY
          git diff --check origin/main...HEAD -- 'reference/business-12-creator-mini-media-v1/**'
      - name: Install Chromium and Korean fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p /tmp/b12o && cd /tmp/b12o
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.54.1
          npx playwright install chromium
      - name: Browser visual gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b12-evidence
          python3 -m http.server 4192 --directory reference/business-12-creator-mini-media-v1 >/tmp/b12-http.log 2>&1 &
          server=$!; trap 'kill $server || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4192/index.html >/dev/null && break; sleep .5; done
          cd /tmp/b12o
          node <<'JS'
          const {chromium}=require('playwright');const fs=require('fs'),path=require('path');const out='/tmp/b12-evidence';
          async function audit(page,label){const d=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,svg:[...document.images].filter(i=>/\.svg(?:[?#]|$)/i.test(i.getAttribute('src')||'')).length,text:document.body.innerText,room:document.documentElement.dataset.creatorRoom||'',scenes:document.querySelectorAll('.creator-scene').length}));if(d.sw>d.cw+1)throw new Error(`${label}: overflow ${d.sw}>${d.cw}`);if(d.svg)throw new Error(`${label}: visible SVG ${d.svg}`);if(/UI Preview|reference-only|Visual Atlas/i.test(d.text))throw new Error(`${label}: old chrome visible`);return d}
          (async()=>{const browser=await chromium.launch({headless:true});const m={};for(const vp of [{name:'desktop',width:1440,height:1100},{name:'mobile',width:390,height:844}]){for(const rel of ['index.html','guide.html','ux.html']){const p=await browser.newPage({viewport:{width:vp.width,height:vp.height}}),errs=[];p.on('console',x=>{if(x.type()==='error')errs.push(x.text())});p.on('pageerror',e=>errs.push(e.message));await p.goto(`http://127.0.0.1:4192/${rel}`,{waitUntil:'networkidle'});const d=await audit(p,`${vp.name}:${rel}`);if(rel==='ux.html'&&d.room!=='v2')throw new Error(`${vp.name}: UX V2 runtime missing`);if(errs.length)throw new Error(`${vp.name}:${rel}:${errs.join('|')}`);m[`${vp.name}-${rel}`]=d;await p.screenshot({path:path.join(out,`b12-${rel.replace('.html','')}-${vp.name}.png`),fullPage:true});await p.close()}}fs.writeFileSync(path.join(out,'manifest.json'),JSON.stringify(m,null,2));await browser.close();console.log('B12_BROWSER_PASS=1')})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: b12-creator-release-room-final-20260810
          path: /tmp/b12-evidence
          retention-days: 7
          if-no-files-found: error
      - name: Write observable PASS marker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf 'result=success\nrun_id=%s\nvalidated_head=%s\n' "$GITHUB_RUN_ID" "$(git rev-parse HEAD)" > .b12-final-pass-20260810
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .b12-final-pass-20260810
          git commit -m 'test(B12): record final visual PASS'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
