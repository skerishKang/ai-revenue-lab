name: B14 Ledger D1 Provision Gate Contract Tests

# CI for the dispatch-only B14 ledger D1 provision gate. This workflow never
# provisions anything: it only parses YAML and runs static pytest contracts.
# The migration folder is in the path filter so a new migration cannot silently
# drift from what the gate applies and verifies.

on:
  pull_request:
    paths:
      - ".github/workflows/b14-ledger-d1-provision-gate.yml"
      - ".github/workflows/b14-ledger-d1-provision-gate-contract-tests.yml"
      - ".github/tests/test_b14_ledger_d1_provision_gate.py"
      - "apps/korean-ai-platform/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b14-ledger-d1-provision-gate-contract-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gate-contract-tests:
    name: Gate contract (parse only, no provisioning)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --quiet pyyaml pytest

      - name: Run gate contract tests
        run: python -m pytest -q .github/tests/test_b14_ledger_d1_provision_gate.py

      - name: Record no provisioning performed
        run: |
          echo 'B14_LEDGER_D1_PROVISION_GATE_CONTRACT_TESTS=PASS'
          echo 'D1_PROVISIONED=0'
