name: B66 Quote Interpretation Benchmark (offline source gate)

# No workflow_dispatch: this does NOT send inference requests or deploy.
on:
  pull_request:
    paths:
      - '.github/fixtures/b66_quote_interpret_v1.json'
      - '.github/scripts/b66_quote_model_benchmark.py'
      - '.github/tests/test_b66_quote_model_benchmark.py'
      - '.github/tests/test_b66_document_stage_authority.py'
      - 'docs/products/b66/README.md'
      - 'docs/products/b66/SOURCE_TEMPLATE_FIDELITY.md'
      - 'docs/operations/B14_B66_QUOTE_MODEL_EVALUATION_PROTOCOL.md'
      - '.github/workflows/b66-quote-model-benchmark.yml'
      - '.github/scripts/b14_owner_evaluation_registry.py'
      - 'apps/korean-ai-platform/app/pilot/b14_models.json'
  push:
    branches: [main]
    paths:
      - '.github/fixtures/b66_quote_interpret_v1.json'
      - '.github/scripts/b66_quote_model_benchmark.py'
      - '.github/tests/test_b66_quote_model_benchmark.py'
      - '.github/tests/test_b66_document_stage_authority.py'
      - 'docs/products/b66/README.md'
      - 'docs/products/b66/SOURCE_TEMPLATE_FIDELITY.md'
      - 'docs/operations/B14_B66_QUOTE_MODEL_EVALUATION_PROTOCOL.md'
      - '.github/workflows/b66-quote-model-benchmark.yml'
      - '.github/scripts/b14_owner_evaluation_registry.py'
      - 'apps/korean-ai-platform/app/pilot/b14_models.json'

permissions:
  contents: read

jobs:
  offline-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline test runner
        run: python -m pip install --quiet pytest
      - name: Verify current canonical model allowlist and actual B66 extraction schema
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest .github/tests/test_b66_quote_model_benchmark.py -q
          python -m pytest .github/tests/test_b66_document_stage_authority.py -q
          python .github/scripts/b66_quote_model_benchmark.py --list > "$RUNNER_TEMP/models.json"
          python - "$RUNNER_TEMP/models.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f:
              d=json.load(f)
          assert len(d['models'])==len(set(d['models']))>0
          assert not any(x.startswith('kilo/') for x in d['models'])
          assert d['post_count']==0
          print('B66_QUOTE_EVAL_SOURCE_GATE=PASS')
          print('LIVE_PROVIDER_CALLS=0')
          print('PRODUCTION_MUTATIONS=0')
          PY
      - name: Assert no live provider POST path exists
        shell: bash
        run: |
          set -euo pipefail
          script=.github/scripts/b66_quote_model_benchmark.py
          grep -Fq 'method="GET"' "$script"
          grep -Fq 'authorize_exact_models' "$script"
          echo 'B66_QUOTE_BENCHMARK_OFFLINE_ONLY=YES'
