name: B54 Engine A7 Authenticated USER Production Canary

on:
  pull_request:
    paths:
      - ".github/workflows/b54-engine-a7-authenticated-user-canary.yml"
      - ".github/tests/test_b54_engine_a7_authenticated_canary.py"
      - ".github/tests/test_b54_engine_a7_canary_negative_gate.py"
      - "apps/padiem-ai-engine/scripts/a7_authenticated_user_production_canary.py"
      - "apps/padiem-ai-engine/app/execution_admission_service.py"
      - "apps/padiem-ai-engine/app/tenant_auth.py"
      - "apps/padiem-ai-engine/app/control_plane_trust_client.py"
      - "packages/padiem-control-plane/engine_admission_authority_worker.py"
      - "packages/padiem-control-plane/padiem_control_plane/engine_entitlement_producer.py"
  workflow_dispatch:
    inputs:
      mode:
        description: "repository_preflight | live_authenticated_user_canary"
        required: true
        type: choice
        default: repository_preflight
        options:
          - repository_preflight
          - live_authenticated_user_canary
      target_sha:
        description: "Exact current main SHA"
        required: true
        type: string
      expected_served_version:
        description: "Exact Engine served version expected for live canary"
        required: false
        default: ""
        type: string
      model_id:
        description: "Explicit Owner-selected registered model id for this live run (no default, no fallback)"
        required: false
        default: ""
        type: string
      confirmation:
        description: "Exact owner confirmation for live canary"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: b54-engine-a7-authenticated-user-canary
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ inputs.target_sha }}

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install source-test dependencies
        run: python -m pip install --quiet pyyaml pytest

      - name: Run authenticated A7 canary source contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile apps/padiem-ai-engine/scripts/a7_authenticated_user_production_canary.py
          python -m pytest -q .github/tests/test_b54_engine_a7_authenticated_canary.py
          python -m pytest -q .github/tests/test_b54_engine_a7_canary_negative_gate.py
          echo "A7_AUTHENTICATED_USER_CANARY_SOURCE=PASS"
          echo "PRODUCTION_MUTATION=0"

  live-authenticated-user-canary:
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'live_authenticated_user_canary' && inputs.confirmation == 'RUN_A7_AUTHENTICATED_USER_CANARY_FROM_EXACT_MAIN' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      CALLER_ID: b54-p01-overlay-20260914-a1
      CALLER_SECRET: ${{ secrets.B62_P01_ENGINE_CREDENTIAL }}
      PADIEM_A7_CANARY_SUBJECT_ID: ${{ secrets.PADIEM_A7_CANARY_SUBJECT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ENGINE_BASE_URL: https://engine.padiem.net
      EXPECTED_SERVED_VERSION: ${{ inputs.expected_served_version }}
      # #3523: explicit per-run Owner-selected registered model. Never inherited
      # from a primary/default and never substituted by a fallback.
      A7_CANARY_MODEL_ID: ${{ inputs.model_id }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout exact approved main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Exact-main and protected-subject preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          test -n "${CALLER_SECRET}"
          test -n "${PADIEM_A7_CANARY_SUBJECT_ID}"
          # #3523: the live run must carry one explicit Owner-selected model id.
          # There is no inherited, default or dynamically resolved model.
          test -n "${A7_CANARY_MODEL_ID}"
          echo "${A7_CANARY_MODEL_ID}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,127}$' || {
            echo "EXPLICIT_MODEL_ID_UNSAFE" >&2
            exit 1
          }
          echo "::add-mask::${PADIEM_A7_CANARY_SUBJECT_ID}"
          echo "SUBJECT_SOURCE=PROTECTED_ENV_SECRET"
          echo "RAW_SUBJECT_OUTPUT=0"
          echo "MODEL_SELECTION=EXPLICIT_OWNER_SUPPLIED"
          echo "MODEL_DEFAULT_OR_FALLBACK=0"
          echo "CANARY_EXACT_MAIN=PASS"

      - name: GET-only exact served-version A7 binding preflight
        shell: bash
        run: |
          set -euo pipefail
          echo "${EXPECTED_SERVED_VERSION}" | grep -Eq '^[A-Za-z0-9._-]{1,64}$' || {
            echo "EXPECTED_SERVED_VERSION_UNSAFE" >&2
            exit 1
          }
          auth=( -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" )
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/padiem-ai-engine"
          deployments="${RUNNER_TEMP}/a7-auth-canary-deployments.json"
          curl -fsS "${auth[@]}" "${base}/deployments" -o "${deployments}"
          resolve_out="$(python3 .github/scripts/b54_engine_served_version_guard.py resolve-active --deployments "${deployments}")"
          active="$(printf '%s\n' "${resolve_out}" | sed -n 's/^ENGINE_ACTIVE_VERSION_ID=//p')"
          if [ "${active}" != "${EXPECTED_SERVED_VERSION}" ]; then
            echo "SERVED_VERSION_MISMATCH" >&2
            exit 1
          fi
          detail="${RUNNER_TEMP}/a7-auth-canary-version.json"
          curl -fsS "${auth[@]}" "${base}/versions/${active}" -o "${detail}"
          verify_out="$(python3 .github/scripts/b54_engine_served_version_guard.py verify --version-settings "${detail}" --active-version="${active}" --inspect-engine-admission-binding)"
          printf '%s\n' "${verify_out}" | grep -q '^CONTROL_PLANE_ENGINE_ADMISSION_SERVED_BINDING=PRESENT:service$'
          printf '%s\n' "${verify_out}" | grep -q '^ENGINE_ADMISSION_BINDING_TARGET_VALIDATED=YES$'
          echo "A7_CANARY_SERVED_BINDING=PASS"
          echo "PRODUCTION_MUTATION=0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The probe is stdlib-only by design: it no longer imports the canonical
      # model-primary package, so no model dependency is installed here.

      - name: Run one bounded authenticated USER canary
        shell: bash
        run: |
          set -euo pipefail
          python apps/padiem-ai-engine/scripts/a7_authenticated_user_production_canary.py | tee "${RUNNER_TEMP}/a7-authenticated-canary.log"
          grep -q '^A7_AUTHENTICATED_USER_CANARY=PASS$' "${RUNNER_TEMP}/a7-authenticated-canary.log"
          grep -q '^CANONICAL_IDENTITY_REVALIDATION=PASS$' "${RUNNER_TEMP}/a7-authenticated-canary.log"
          grep -q '^ADMISSION_LIFECYCLE_FAIL_CLOSED=PASS$' "${RUNNER_TEMP}/a7-authenticated-canary.log"
          grep -q '^EXECUTION_COMPLETED=PASS$' "${RUNNER_TEMP}/a7-authenticated-canary.log"
          grep -q '^MODEL_SELECTION=EXPLICIT_OWNER_SUPPLIED$' "${RUNNER_TEMP}/a7-authenticated-canary.log"
          grep -q '^MODEL_DEFAULT_OR_FALLBACK=0$' "${RUNNER_TEMP}/a7-authenticated-canary.log"
          grep -q '^RAW_SUBJECT_OUTPUT=0$' "${RUNNER_TEMP}/a7-authenticated-canary.log"
          echo "LIVE_PROVIDER_CALL_MAX=1"
          echo "CP_USAGE_MUTATION=BOUNDED"
          echo "ENGINE_IDEMPOTENCY_MUTATION=BOUNDED"
          echo "MANIFEST_FLIP=0"
