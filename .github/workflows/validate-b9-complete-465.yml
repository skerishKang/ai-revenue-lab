name: Validate B9 Complete 465
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'reference/business-09-personalized-childrens-story-v1/**'
      - '.github/workflows/validate-b9-complete-465.yml'
permissions:
  contents: read
jobs:
  validate:
    if: github.event.pull_request.head.ref == 'feat/b9-personalized-childrens-story-complete-465'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate storybook UI UX and guide
        shell: bash
        run: |
          set -euo pipefail
          node --check reference/business-09-personalized-childrens-story-v1/scripts/review-state.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          base=Path('reference/business-09-personalized-childrens-story-v1')
          for name in ('index.html','ux.html','guide.html'):
              HTMLParser().feed((base/name).read_text(encoding='utf-8'))
          ux=(base/'ux.html').read_text(encoding='utf-8')
          guide=(base/'guide.html').read_text(encoding='utf-8')
          js=(base/'scripts/review-state.js').read_text(encoding='utf-8')
          for marker in ('data-choice="river"','data-choice="shop"','id="why"','id="back"','id="continue"','window.onpopstate'):
              assert marker in ux, marker
          for marker in ('GUIDE · 30 SECONDS','01 · READ','02 · CHOOSE','03 · BLOOM','04 · WHY','05 · RECHOOSE','이야기 체험 시작'):
              assert marker in guide, marker
          assert './guide.html' in js and './ux.html' in js
          source=ux+'\n'+guide
          for forbidden in ('fetch(', 'XMLHttpRequest', 'localStorage', 'document.cookie', 'serviceWorker'):
              assert forbidden not in source, forbidden
          for html_name in ('guide.html',):
              html=(base/html_name).read_text(encoding='utf-8')
              for rel in re.findall(r'(?:href|src)="(\./[^"?#]+)', html):
                  assert (base/rel[2:]).exists(), f'{html_name}: missing {rel}'
          print('B9_UI_UX_GUIDE_STATIC_PASS=1')
          PY
          git diff --check origin/main...HEAD -- 'reference/business-09-personalized-childrens-story-v1/*.html' 'reference/business-09-personalized-childrens-story-v1/styles/**' 'reference/business-09-personalized-childrens-story-v1/scripts/**'
          echo 'B9_COMPLETE_VALIDATION_PASS=1'
