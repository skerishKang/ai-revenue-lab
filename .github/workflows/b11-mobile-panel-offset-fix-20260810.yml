name: B11 Mobile Panel Offset Fix 20260810
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/b11-mobile-panel-offset-fix-20260810.yml']
permissions:
  contents: write
jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'fix/b11-korean-learning-rhythm-20260810'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Keep switched panel heading below sticky navigation
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          p=Path('reference/business-11-language-learning-magazine-v1/ux.html')
          text=p.read_text(encoding='utf-8')
          old="window.scrollTo({top:68,behavior:'smooth'})"
          new="window.scrollTo({top:0,behavior:'smooth'})"
          if old not in text:
              raise SystemExit('expected scroll marker not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          git rm .github/workflows/b11-mobile-panel-offset-fix-20260810.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reference/business-11-language-learning-magazine-v1/ux.html
          git commit -m 'fix(B11): keep switched panel heading below sticky navigation'
          git push origin HEAD:${GITHUB_HEAD_REF}
