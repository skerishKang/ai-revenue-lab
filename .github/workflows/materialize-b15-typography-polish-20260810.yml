name: Materialize B15 Typography Polish 20260810
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/materialize-b15-typography-polish-20260810.yml']
permissions: {contents: write}
jobs:
  patch:
    if: github.event.pull_request.head.ref == 'design/b15-verification-desk-v2-20260810'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.ref }}', fetch-depth: 0}
      - name: Append Korean-safe layout overrides and self-remove
        shell: bash
        run: |
          set -euo pipefail
          cat >> reference/business-15-global-ai-newsroom-v1/styles/verification-desk-v2.css <<'CSS'

/* 20260810 Korean typography + narrow viewport polish */
.vn-index h2{max-width:14ch;font-family:var(--vn-ui);font-size:clamp(2.8rem,5.1vw,5.5rem);font-weight:850;line-height:1.04;letter-spacing:-.065em;text-transform:none;word-break:keep-all}
.vn-guide-step h2{max-width:16ch;font-family:var(--vn-ui);font-size:clamp(2rem,3.25vw,3.55rem);font-weight:850;line-height:1.08;letter-spacing:-.06em;text-transform:none;word-break:keep-all}
.vn-guide-step p,.vn-index-head>p{word-break:keep-all}.vn-guide-card,.vn-guide-step,.vn-guide-ledger,.vn-guide-ledger div{min-width:0}.vn-guide-card strong{overflow-wrap:anywhere}
@media(max-width:620px){html,body,.vn-shell,.vn-guide-hero,.vn-guide-ledger,.vn-guide-steps,.vn-guide-step,.vn-guide-card{max-width:100%;min-width:0}.vn-guide-hero{grid-template-columns:minmax(0,1fr)!important}.vn-guide-ledger{padding:2.4rem 1rem!important;overflow:hidden}.vn-guide-ledger div{grid-template-columns:2rem minmax(0,1fr)!important}.vn-guide-ledger small{grid-column:2;justify-self:start}.vn-guide-step{grid-template-columns:minmax(0,1fr)!important;gap:1rem!important;padding:3rem 0!important}.vn-guide-step>.vn-guide-card{grid-column:1!important;width:100%;min-width:0}.vn-guide-step>span{font-size:2.5rem}.vn-guide-step h2{max-width:15ch;font-size:clamp(1.9rem,8.8vw,2.65rem);line-height:1.12}.vn-index h2{max-width:13ch;font-size:clamp(2.45rem,11vw,3.5rem);line-height:1.06}.vn-guide-copy{padding-left:1rem!important;padding-right:1rem!important}.vn-guide-copy h1{max-width:100%;font-size:clamp(3.2rem,15vw,4.8rem)}}
CSS
          rm -f .github/workflows/materialize-b15-typography-polish-20260810.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(B15): stabilize Korean display and mobile guide'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
