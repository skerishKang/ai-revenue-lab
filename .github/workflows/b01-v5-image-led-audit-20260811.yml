name: B01 Image-led V5 Conformance Audit 2026-08-11

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/personal-edition/**'
      - 'docs/operations/ui-ux/businesses/B01_VISUAL_DIRECTION.md'
      - '.github/workflows/b01-v5-image-led-audit-20260811.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install B01 test and browser dependencies
        run: |
          cd apps/personal-edition
          python -m pip install --upgrade pip
          python -m pip install -e . pytest playwright pillow
          python -m playwright install --with-deps chromium
          CHROME_PATH=$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p: print(p.chromium.executable_path)
          PY
          )
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Run existing Personal Edition visual regression contracts
        run: |
          python -m pytest apps/personal-edition/tests/test_ui_v2_443.py apps/personal-edition/tests/test_ui_v3_browser_454.py -q

      - name: Build exact branch static Production
        run: |
          cd apps/personal-edition
          python -m scripts.build_static_production
          test -f dist-preview/static/ui-v5-image-led.css
          for f in hero-private-edition.webp human-proof-review.webp library-edition-stack.webp edition-opening.webp; do
            test -s "dist-preview/static/images/v5/$f"
          done
          grep -q 'data-art-direction="b1-image-led-v5"' dist-preview/index.html
          grep -q 'v5-read-visual-break' dist-preview/preview/participant/editions/modal-preview-edition/index.html
          ! grep -q 'images/v4/archive-entry-tableau.svg' dist-preview/static/ui-v5-image-led.css
          ! grep -q 'images/v4/proof-review-tableau.svg' dist-preview/static/ui-v5-image-led.css
          ! grep -q 'images/v4/edition-cover-material.svg' dist-preview/static/ui-v5-image-led.css

      - name: Start exact static Production bytes
        run: |
          cd apps/personal-edition/dist-preview
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/b01-v5-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/b01-v5-http.log
          exit 1

      - name: Browser conformance and evidence capture
        run: |
          mkdir -p b01-v5-evidence/screenshots
          cat > /tmp/b01_v5_audit.py <<'PY'
          from __future__ import annotations
          import json, os
          from pathlib import Path
          from PIL import Image, ImageDraw
          from playwright.sync_api import sync_playwright

          base='http://127.0.0.1:4173'
          out=Path('b01-v5-evidence'); shots=out/'screenshots'
          routes=[
            ('root','/'),('guide','/guide/'),('library','/preview/participant/published/'),
            ('review','/preview/participant/editing/'),('write','/preview/participant/input/'),
            ('read','/preview/participant/editions/modal-preview-edition/'),
            ('feedback','/preview/participant/editions/modal-preview-edition/feedback/'),
            ('adaptation','/preview/participant/editions/modal-preview-edition/adaptation/'),
            ('history','/preview/participant/history/'),
            ('operator-review','/admin/review/modal-preview-edition/content/'),
          ]
          vps=[('desktop',1440,1100),('mobile',390,844)]
          rows=[]; failures=[]
          with sync_playwright() as pw:
            browser=pw.chromium.launch(headless=True, executable_path=os.environ['CHROME_PATH'], args=['--no-sandbox'])
            try:
              for vp,w,h in vps:
                context=browser.new_context(viewport={'width':w,'height':h},reduced_motion='reduce')
                for name,path in routes:
                  page=context.new_page(); errors=[]; failed=[]; external=[]
                  page.on('console',lambda m: errors.append('console:'+m.text) if m.type=='error' else None)
                  page.on('pageerror',lambda e: errors.append('page:'+str(e)))
                  page.on('request',lambda r: external.append(r.url) if not r.url.startswith(base) and not r.url.startswith(('data:','blob:')) else None)
                  page.on('response',lambda r: failed.append(f'{r.status} {r.url}') if r.url.startswith(base) and r.status>=400 and not r.url.endswith('/favicon.ico') else None)
                  try:
                    response=page.goto(base+path,wait_until='networkidle',timeout=25000)
                    assert response and response.status==200
                    page.wait_for_timeout(350)
                    m=page.evaluate("""() => {
                      const h=document.querySelector('h1'),s=h?getComputedStyle(h):null;
                      const fs=s?parseFloat(s.fontSize):null, lh=s&&s.lineHeight!=='normal'?parseFloat(s.lineHeight):null;
                      const bg=sel=>{const e=document.querySelector(sel);return e?getComputedStyle(e).backgroundImage:null};
                      const rect=sel=>{const e=document.querySelector(sel);if(!e)return null;const r=e.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height,bottom:r.bottom}};
                      return {
                        art:document.body.dataset.artDirection||null,
                        sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,
                        h1:h?.innerText?.trim()||null,fontSize:fs,lineHeight:lh,ratio:(fs&&lh)?lh/fs:null,
                        bodyBg:getComputedStyle(document.body).backgroundColor,
                        heroBg:bg('.v3-assembly-stage'),reviewBg:bg('.v3-status-composition'),
                        libraryBg:bg('.v3-library-object-zone'),readOpeningBg:bg('.v3-read-cover-zone'),readBreakBg:bg('.v5-read-visual-break'),
                        heroRect:rect('.v3-assembly-stage'),titleRect:rect('h1'),primaryRect:rect('.btn-primary'),
                        readBreak:!!document.querySelector('.v5-read-visual-break'),
                        text:document.body.innerText.replace(/\s+/g,' ').slice(0,900)
                      }
                    }""")
                    checks=[('art',m['art']=='b1-image-led-v5'),('overflow',m['sw']<=m['cw']),('console',not errors),('failed-local',not failed),('external',not external)]
                    if m['h1'] and any('\uac00'<=x<='\ud7a3' for x in m['h1']) and m['ratio'] is not None: checks.append(('korean-line-height',m['ratio']>=1.0))
                    if name=='root':
                      checks += [('hero-raster','hero-private-edition.webp' in (m['heroBg'] or '')),('hero-no-v4-svg','images/v4/' not in (m['heroBg'] or '')),('cta-visible',m['primaryRect'] is not None)]
                      if vp=='mobile' and m['heroRect'] and m['titleRect']:
                        checks.append(('mobile-image-begins-near-first-view',m['heroRect']['y']<800))
                    if name=='review': checks += [('review-raster','human-proof-review.webp' in (m['reviewBg'] or '')),('review-no-v4-svg','images/v4/' not in (m['reviewBg'] or ''))]
                    if name=='library': checks += [('library-raster','library-edition-stack.webp' in (m['libraryBg'] or '')),('library-no-v4-svg','images/v4/' not in (m['libraryBg'] or ''))]
                    if name=='read': checks += [('read-opening-raster','edition-opening.webp' in (m['readOpeningBg'] or '')),('read-break',m['readBreak']),('read-break-raster','hero-private-edition.webp' in (m['readBreakBg'] or '')),('read-no-v4-svg','images/v4/' not in ((m['readOpeningBg'] or '')+(m['readBreakBg'] or '')))]
                    for key,ok in checks:
                      if not ok: failures.append({'screen':name,'viewport':vp,'check':key,'metrics':m,'errors':errors,'failed':failed,'external':external})
                    page.screenshot(path=str(shots/f'{name}-{vp}.png'),full_page=False)
                    page.screenshot(path=str(shots/f'{name}-{vp}-full.png'),full_page=True)
                    rows.append({'screen':name,'viewport':vp,'metrics':m,'checks':checks})
                  except Exception as exc:
                    failures.append({'screen':name,'viewport':vp,'check':'exception','error':repr(exc)})
                    try: page.screenshot(path=str(shots/f'{name}-{vp}-exception.png'),full_page=False)
                    except: pass
                  page.close()
                context.close()
            finally: browser.close()

          for vp,w,h in vps:
            files=[shots/f'{name}-{vp}.png' for name,_ in routes]
            thumb_w=360 if vp=='desktop' else 260; thumb_h=round(h*thumb_w/w); cols=2; rows_n=(len(files)+1)//2
            sheet=Image.new('RGB',(cols*thumb_w,rows_n*(thumb_h+28)),(242,238,228)); d=ImageDraw.Draw(sheet)
            for i,(p,(name,_)) in enumerate(zip(files,routes)):
              if not p.exists(): continue
              im=Image.open(p).convert('RGB'); im.thumbnail((thumb_w,thumb_h)); x=(i%2)*thumb_w; y=(i//2)*(thumb_h+28); sheet.paste(im,(x,y)); d.text((x+6,y+thumb_h+5),name,fill=(23,25,21))
            sheet.save(out/f'contact-{vp}.jpg',quality=91)

          (out/'results.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'failures.json').write_text(json.dumps(failures,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(failures,ensure_ascii=False,indent=2))
          raise SystemExit(1 if failures else 0)
          PY
          python /tmp/b01_v5_audit.py

      - name: Upload V5 conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-image-led-v5-${{ github.sha }}
          path: b01-v5-evidence
          if-no-files-found: error
          retention-days: 14
