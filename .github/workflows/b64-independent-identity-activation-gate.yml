name: B64 Independent Identity Activation Gate

# Owner decision #987 (2026-10-27): B64 is an independent business.
# Dispatch-only; changes ONLY b64-ai-reward-router secret binding and existing padiem-b64 D1 schema.
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact current main SHA'
        required: true
      confirmation:
        description: 'Type ACTIVATE_B64_INDEPENDENT_IDENTITY'
        required: true
permissions:
  contents: read
concurrency:
  group: b64-independent-identity-activation
  cancel-in-progress: false
jobs:
  activate:
    if: ${{ github.event.inputs.confirmation == 'ACTIVATE_B64_INDEPENDENT_IDENTITY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_sha }}
          persist-credentials: false
      - name: Verify exact main, designated account, existing D1 binding
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.inputs.target_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          test "$CLOUDFLARE_ACCOUNT_ID" = '9be14bb7b8974e65d0afba647ab16932'
          test -n "$CLOUDFLARE_API_TOKEN"
          python3 - <<'PY'
          import json
          from pathlib import Path
          # No lossy parsing of JSONC; only exact reviewed binding assertions.
          text=Path('apps/ai-reward-router/wrangler.jsonc').read_text()
          assert '"database_name": "padiem-b64"' in text
          assert '"binding": "B64_INCOME_DB"' in text
          assert '"database_id": "b7f7bbd7-442c-4bc6-bc0d-b1026b0d459a"' in text
          assert '"services"' not in text
          assert '"B64_PUBLIC_BASE_URL"' in text
          print('B64_TARGET_CONFIG=PASS')
          PY
          echo 'B64_PREMUTATION=PASS'
      - name: Confirm existing D1 database, no creation or deletion
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 list --json > "$RUNNER_TEMP/b64-d1-list.json"
          python3 - "$RUNNER_TEMP/b64-d1-list.json" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1]))
          matches=[r for r in rows if r.get('name')=='padiem-b64' and r.get('uuid')=='b7f7bbd7-442c-4bc6-bc0d-b1026b0d459a']
          assert len(matches)==1, 'existing B64 database absent or mismatched'
          print('B64_EXISTING_D1=PASS')
          PY
      - name: Apply additive B64 member and session schema on existing D1
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute padiem-b64 --remote --file=apps/ai-reward-router/migrations/d1/0002_b64_member.sql
          npx --yes wrangler@4 d1 execute padiem-b64 --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('b64_user_income','b64_member','b64_session')" > "$RUNNER_TEMP/b64-schema.json"
          python3 - "$RUNNER_TEMP/b64-schema.json" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1]))
          rows=payload[0]['results'] if isinstance(payload,list) else payload['results']
          names={x['name'] for x in rows}
          assert {'b64_user_income','b64_member','b64_session'} <= names, 'B64 schema incomplete'
          print('B64_EXISTING_INCOME_AND_MEMBER_SCHEMA=PASS')
          PY
      - name: Count existing rows before the Google identity table is added
        shell: bash
        run: |
          set -euo pipefail
          # The count is the evidence that 0003 is additive: it is taken before
          # and after, and compared below. Nothing here deletes or rewrites a row.
          npx --yes wrangler@4 d1 execute padiem-b64 --remote --json \
            --command "SELECT (SELECT COUNT(*) FROM b64_user_income) AS income, (SELECT COUNT(*) FROM b64_member) AS member, (SELECT COUNT(*) FROM b64_session) AS session" \
            > "$RUNNER_TEMP/b64-rowcount-before.json"
          python3 - "$RUNNER_TEMP/b64-rowcount-before.json" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1]))
          rows=payload[0]['results'] if isinstance(payload,list) else payload['results']
          print('B64_ROW_COUNT_BEFORE=' + json.dumps(rows[0], sort_keys=True))
          PY
      - name: Apply additive B64 Google identity schema on existing D1
        shell: bash
        run: |
          set -euo pipefail
          # #987: a Google subject is linked to a B64 member in its own table.
          # 0003 creates tables only — it never ALTERs b64_member or b64_session,
          # so an existing member keeps its row, its credential and its sessions.
          npx --yes wrangler@4 d1 execute padiem-b64 --remote --file=apps/ai-reward-router/migrations/d1/0003_b64_google_identity.sql
          npx --yes wrangler@4 d1 execute padiem-b64 --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('b64_user_income','b64_member','b64_session','b64_member_google')" > "$RUNNER_TEMP/b64-schema-google.json"
          python3 - "$RUNNER_TEMP/b64-schema-google.json" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1]))
          rows=payload[0]['results'] if isinstance(payload,list) else payload['results']
          names={x['name'] for x in rows}
          assert {'b64_user_income','b64_member','b64_session','b64_member_google'} <= names, 'B64 google identity schema incomplete'
          print('B64_GOOGLE_IDENTITY_SCHEMA=PASS')
          PY
      - name: Apply additive B64 reward event schema on existing D1
        shell: bash
        run: |
          set -euo pipefail
          # #987 ayeT: the postback needs a row to land in. 0004 creates
          # b64_reward_event only — it never alters or reads-and-rewrites the
          # member, session or income tables, and a confirmed provider event is
          # not an income record.
          npx --yes wrangler@4 d1 execute padiem-b64 --remote --file=apps/ai-reward-router/migrations/d1/0004_b64_reward_event.sql
          npx --yes wrangler@4 d1 execute padiem-b64 --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('b64_user_income','b64_member','b64_session','b64_member_google','b64_reward_event')" > "$RUNNER_TEMP/b64-schema-reward.json"
          python3 - "$RUNNER_TEMP/b64-schema-reward.json" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1]))
          rows=payload[0]['results'] if isinstance(payload,list) else payload['results']
          names={x['name'] for x in rows}
          assert {'b64_user_income','b64_member','b64_session','b64_member_google','b64_reward_event'} <= names, 'B64 reward event schema incomplete'
          print('B64_REWARD_EVENT_SCHEMA=PASS')
          PY
      - name: Confirm the additive migration preserved every existing row
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute padiem-b64 --remote --json \
            --command "SELECT (SELECT COUNT(*) FROM b64_user_income) AS income, (SELECT COUNT(*) FROM b64_member) AS member, (SELECT COUNT(*) FROM b64_session) AS session" \
            > "$RUNNER_TEMP/b64-rowcount-after.json"
          python3 - "$RUNNER_TEMP/b64-rowcount-before.json" "$RUNNER_TEMP/b64-rowcount-after.json" <<'PY'
          import json,sys
          def counts(path):
              payload=json.load(open(path))
              rows=payload[0]['results'] if isinstance(payload,list) else payload['results']
              return rows[0]
          before=counts(sys.argv[1])
          after=counts(sys.argv[2])
          # Non-decreasing is the property that matters: an additive migration
          # can never remove a row. A live login in between legitimately adds
          # one, so equality is not asserted.
          lost=[k for k in before if after.get(k, 0) < before[k]]
          assert not lost, f'rows disappeared across an additive migration: {before} -> {after}'
          print(f'B64_D1_ROWS_PRESERVED=PASS {json.dumps(before, sort_keys=True)} -> {json.dumps(after, sort_keys=True)}')
          PY
      - name: Create B64-only signing key if absent; never rotate existing key
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/b64-settings.json" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/b64-ai-reward-router/settings")"
          test "$code" = 200 || { echo "B64_BINDING_READ_STATUS=$code"; exit 1; }
          present="$(python3 - "$RUNNER_TEMP/b64-settings.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data.get('success') is True, 'settings response unsuccessful'
          bindings=data.get('result',{}).get('bindings',[])
          matches=[b for b in bindings if b.get('name')=='B64_SESSION_SECRET']
          assert not matches or (len(matches)==1 and matches[0].get('type')=='secret_text'), 'unexpected B64 session binding type'
          print('yes' if matches else 'no')
          PY
          )"
          if [ "$present" = yes ]; then
            echo 'B64_SESSION_SECRET=ALREADY_PRESENT_NOT_ROTATED'
          else
            # Generated on the GitHub runner, sent directly to Cloudflare stdin, never output/stored.
            openssl rand -hex 48 | npx --yes wrangler@4 secret put B64_SESSION_SECRET --name b64-ai-reward-router > "$RUNNER_TEMP/b64-secret-result.txt"
            echo 'B64_SESSION_SECRET=CREATED'
          fi
          code="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/b64-settings-after.json" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/b64-ai-reward-router/settings")"
          test "$code" = 200
          python3 - "$RUNNER_TEMP/b64-settings-after.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data.get('success') is True
          assert any(x.get('name')=='B64_SESSION_SECRET' and x.get('type')=='secret_text' for x in data['result']['bindings'])
          print('B64_SESSION_SECRET_BINDING=PASS')
          PY
      - name: Report B64 Google OAuth client bindings by name only
        shell: bash
        run: |
          set -euo pipefail
          # #987: the Google entry needs B64's OWN OAuth client. This step reads
          # the state BEFORE the binding step below, so a run shows both the
          # starting point and the result. Names and types only — a value is
          # never read back (secret_text cannot be read) and never printed.
          code="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/b64-settings-google.json" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/b64-ai-reward-router/settings")"
          test "$code" = 200 || { echo "B64_BINDING_READ_STATUS=$code"; exit 1; }
          python3 - "$RUNNER_TEMP/b64-settings-google.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data.get('success') is True, 'settings response unsuccessful'
          bindings=data.get('result',{}).get('bindings',[])
          for name in ('B64_GOOGLE_CLIENT_ID','B64_GOOGLE_CLIENT_SECRET'):
              matches=[b for b in bindings if b.get('name')==name]
              if not matches:
                  print(f'B64_GOOGLE_BINDING_BEFORE {name}: ABSENT (Google login stays fail-closed 503 until it is set)')
              else:
                  print(f'B64_GOOGLE_BINDING_BEFORE {name}: PRESENT type={matches[0].get("type")}')
          print('B64_GOOGLE_OAUTH_CLIENT_CREATED_BY_THIS_GATE=NO')
          PY
      - name: Bind B64 Google OAuth client from production environment secrets
        shell: bash
        env:
          GOOGLE_CLIENT_ID_VALUE: ${{ secrets.B64_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET_VALUE: ${{ secrets.B64_GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # #987: this is the reviewed path for putting a credential on this
          # Worker — the same one the B64_SESSION_SECRET step above uses. A value
          # travels only as a step env var piped through stdin, so it never enters
          # argv (the runner echoes commands), never a file in the workspace, and
          # never an echo.
          #
          # Both bindings are written as secret_text on purpose. That keeps
          # wrangler.jsonc and .github/binding_baselines/ untouched: deploy run
          # 40578410849 read B64_SESSION_SECRET back as a live secret_text binding
          # even though no config file declares it, which proves an out-of-band
          # secret survives the reviewed deploy path. The application reads
          # env.B64_GOOGLE_CLIENT_ID as a plain string either way.
          missing=''
          if [ -z "${GOOGLE_CLIENT_ID_VALUE}" ]; then missing="${missing} B64_GOOGLE_CLIENT_ID"; fi
          if [ -z "${GOOGLE_CLIENT_SECRET_VALUE}" ]; then missing="${missing} B64_GOOGLE_CLIENT_SECRET"; fi
          if [ -n "${missing}" ]; then
            # Half a configuration is worse than none: a client id without its
            # secret renders the entry and then fails mid-round-trip. Write
            # nothing and say so.
            echo "B64_GOOGLE_BINDING=SKIPPED (production environment secrets missing:${missing})"
            echo 'B64_GOOGLE_LOGIN_STATE=FAIL_CLOSED_503 (nothing half-configured was written)'
            exit 0
          fi
          printf '%s' "${GOOGLE_CLIENT_ID_VALUE}" \
            | npx --yes wrangler@4 secret put B64_GOOGLE_CLIENT_ID --name b64-ai-reward-router \
            > "${RUNNER_TEMP}/b64-google-client-id-put.log"
          printf '%s' "${GOOGLE_CLIENT_SECRET_VALUE}" \
            | npx --yes wrangler@4 secret put B64_GOOGLE_CLIENT_SECRET --name b64-ai-reward-router \
            > "${RUNNER_TEMP}/b64-google-client-secret-put.log"
          echo 'B64_GOOGLE_BINDING=PUT (values reached Cloudflare over stdin and were never printed)'
          code="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/b64-settings-bound.json" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/b64-ai-reward-router/settings")"
          test "$code" = 200 || { echo "B64_BINDING_READ_STATUS=$code"; exit 1; }
          python3 - "$RUNNER_TEMP/b64-settings-bound.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data.get('success') is True, 'settings response unsuccessful'
          bindings=data.get('result',{}).get('bindings',[])
          for name in ('B64_GOOGLE_CLIENT_ID','B64_GOOGLE_CLIENT_SECRET'):
              matches=[b for b in bindings if b.get('name')==name]
              assert len(matches)==1 and matches[0].get('type')=='secret_text', f'{name} is not bound as a single secret_text binding'
              print(f'B64_GOOGLE_BINDING_AFTER {name}: secret_text CONFIRMED')
          print('B64_GOOGLE_BINDING_VERIFIED=YES')
          PY
      - name: Bind the B64 operator address from the production environment secret
        shell: bash
        env:
          ADMIN_EMAIL_VALUE: ${{ secrets.B64_ADMIN_EMAIL }}
        run: |
          set -euo pipefail
          # #6001: the administrator address is a value the owner registers, not
          # something that belongs in wrangler.jsonc or in source. It travels the
          # same reviewed path as B64_SESSION_SECRET and the Google client pair in
          # this file — a step env var piped through stdin into `wrangler secret
          # put` — so it never enters argv (the runner echoes commands), never a
          # workspace file, and never an echo.
          #
          # secret_text rather than a plain var, on purpose: the application reads
          # env.B64_ADMIN_EMAIL as a string either way, a secret binding survives a
          # later Worker release (proven by run 40578410849 reading back
          # B64_SESSION_SECRET, which no config file declares), and the address
          # stays out of the publicly readable vars list.
          if [ -z "${ADMIN_EMAIL_VALUE}" ]; then
            echo 'B64_ADMIN_EMAIL_BINDING=SKIPPED (production environment secret B64_ADMIN_EMAIL is not registered; /admin stays closed to every member, which is the fail-closed state)'
            exit 0
          fi
          printf '%s' "${ADMIN_EMAIL_VALUE}" \
            | npx --yes wrangler@4 secret put B64_ADMIN_EMAIL --name b64-ai-reward-router \
            > "${RUNNER_TEMP}/b64-admin-email-put.log"
          echo 'B64_ADMIN_EMAIL_BINDING=PUT (the address reached Cloudflare over stdin and was never printed)'
          code="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/b64-settings-admin.json" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/b64-ai-reward-router/settings")"
          test "$code" = 200 || { echo "B64_BINDING_READ_STATUS=$code"; exit 1; }
          python3 - "$RUNNER_TEMP/b64-settings-admin.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data.get('success') is True, 'settings response unsuccessful'
          bindings=data.get('result',{}).get('bindings',[])
          matches=[b for b in bindings if b.get('name')=='B64_ADMIN_EMAIL']
          assert len(matches)==1 and matches[0].get('type')=='secret_text', 'B64_ADMIN_EMAIL is not bound as a single secret_text binding'
          print('B64_ADMIN_EMAIL_BINDING_AFTER: secret_text CONFIRMED')
          PY
      - name: Explicit completion boundary
        run: |
          echo 'B64_INDEPENDENT_IDENTITY_ACTIVATION=PASS'
          echo 'B64_WORKER_REVISION_DEPLOYED_BY_THIS_GATE=NO'
          echo 'B64_PUBLIC_LOGIN_E2E=NOT_RUN'
          echo 'B64_DNS_OR_ROUTES_CHANGED=NO'
          echo 'B64_GOOGLE_OAUTH_CLIENT_CREATED_BY_THIS_GATE=NO (the client already exists in the existing Google Cloud project; this gate only binds its values)'
          echo 'B64_GOOGLE_SECRET_VALUES_PRINTED=NO (stdin only; the put logs are written to RUNNER_TEMP and never echoed)'
          echo 'B64_GOOGLE_BINDINGS_ARE_SECRET_TEXT=YES (wrangler.jsonc and the binding baseline stay untouched)'
          echo 'B64_ADMIN_EMAIL_IS_SECRET_TEXT=YES (the operator address is never a committed or publicly readable var)'
          echo 'B64_D1_DESTRUCTIVE_MIGRATION=NO (0003 adds b64_member_google, 0004 adds b64_reward_event; neither alters or rewrites an existing table)'
          echo 'B64_AYET_PROVIDER_ENABLED=NO (this gate creates the table only; B64_AYET_MODE stays DISABLED until the owner approves the account)'
