name: Deploy B09 Type Polish 20260810

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/deploy-b09-type-polish-20260810.yml'

permissions:
  contents: read

jobs:
  deploy-and-qa:
    if: github.event.pull_request.head.ref == 'ops/deploy-b09-type-polish-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_SHA: 94427e61834c5e5d0b3563f55b2344638a36b13c
      PROJECT: 09-personalized-childrens-story
      URL: https://09-personalized-childrens-story.pages.dev
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Assert exact main/source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          for f in index.html guide.html ux.html; do grep -q 'story-bloom-v2-type-polish.css' "reference/business-09-personalized-childrens-story-v1/$f"; done
      - name: Deploy exact main B09
        run: |
          npx --yes wrangler@latest pages deploy reference/business-09-personalized-childrens-story-v1 \
            --project-name "$PROJECT" --branch main --commit-hash "$EXPECTED_SHA" \
            --commit-message 'B09 Korean Story Bloom rhythm exact main'
      - name: Wait for canonical bytes
        run: |
          set -euo pipefail
          for n in $(seq 1 40); do
            ok=1
            for r in / /guide.html /ux.html; do
              b=$(curl -L -sS --max-time 20 -H 'Cache-Control: no-cache' "$URL$r" || true)
              grep -q 'story-bloom-v2-type-polish.css' <<<"$b" || ok=0
            done
            c=$(curl -L -sS --max-time 20 -H 'Cache-Control: no-cache' "$URL/styles/story-bloom-v2-type-polish.css" || true)
            if [ "$ok" = 1 ] && grep -q 'Korean display rhythm polish' <<<"$c"; then exit 0; fi
            sleep 4
          done
          exit 1
      - name: Install Chromium and Korean fonts
        run: |
          sudo apt-get update -y && sudo apt-get install -y fonts-noto-cjk
          mkdir -p /tmp/b09-prod && cd /tmp/b09-prod
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
      - name: Production browser QA
        run: |
          set -euo pipefail
          mkdir -p /tmp/b09-prod-evidence
          cd /tmp/b09-prod
          node <<'JS'
          const {chromium}=require('playwright');const fs=require('fs'),path=require('path');const base='https://09-personalized-childrens-story.pages.dev';const vps=[{name:'desktop',width:1440,height:1100},{name:'mobile',width:390,height:844}];
          (async()=>{const browser=await chromium.launch({headless:true});const results=[];
            for(const vp of vps){
              for(const [name,route,sel] of [['root','/','.sb-copy h1'],['guide','/guide.html','.sb-guide-copy h1']]){
                const context=await browser.newContext({viewport:vp,extraHTTPHeaders:{'Cache-Control':'no-cache','Pragma':'no-cache'}}),page=await context.newPage(),errors=[],failed=[];page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});page.on('pageerror',e=>errors.push(e.message));page.on('response',r=>{if(r.status()>=400)failed.push(`${r.status()} ${r.url()}`)});const response=await page.goto(base+route,{waitUntil:'networkidle',timeout:45000});await page.evaluate(()=>document.fonts.ready);const m=await page.locator(sel).evaluate(h=>{const c=getComputedStyle(h);return{font:parseFloat(c.fontSize),line:parseFloat(c.lineHeight),ratio:parseFloat(c.lineHeight)/parseFloat(c.fontSize),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,polish:[...document.styleSheets].some(s=>String(s.href||'').includes('story-bloom-v2-type-polish.css'))}});const problems=[...(response.status()===200?[]:['status']),...(m.ratio>=1.02?[]:['tight']),...(m.overflow<=1?[]:['overflow']),...(m.polish?[]:['missing']),...(errors.length||failed.length?['runtime']:[])];await page.screenshot({path:path.join('/tmp/b09-prod-evidence',`${vp.name}-${name}.png`),fullPage:false});results.push({viewport:vp.name,name,status:response.status(),errors,failed,problems,...m});await context.close();
              }
              for(const choice of ['river','shop']){
                const context=await browser.newContext({viewport:vp,extraHTTPHeaders:{'Cache-Control':'no-cache','Pragma':'no-cache'}}),page=await context.newPage(),errors=[],failed=[];page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});page.on('pageerror',e=>errors.push(e.message));page.on('response',r=>{if(r.status()>=400)failed.push(`${r.status()} ${r.url()}`)});const response=await page.goto(base+'/ux.html',{waitUntil:'networkidle',timeout:45000});await page.locator(`.sb-choice[data-choice="${choice}"]`).click();await page.waitForTimeout(130);const m=await page.locator('#nextTitle').evaluate(h=>{const c=getComputedStyle(h);return{font:parseFloat(c.fontSize),line:parseFloat(c.lineHeight),ratio:parseFloat(c.lineHeight)/parseFloat(c.fontSize),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,polish:[...document.styleSheets].some(s=>String(s.href||'').includes('story-bloom-v2-type-polish.css'))}});await page.locator('#whyButton').click();const why=!(await page.locator('#whyText').evaluate(e=>e.hidden));await page.locator('#back').click();const back=!(await page.locator('#spread').evaluate(e=>e.hidden));await page.locator(`.sb-choice[data-choice="${choice}"]`).click();await page.locator('#continue').click();const end=await page.locator('#continue').isDisabled();const problems=[...(response.status()===200?[]:['status']),...(m.ratio>=1.03?[]:['tight']),...(m.overflow<=1?[]:['overflow']),...(m.polish?[]:['missing']),...(why?[]:['why']),...(back?[]:['back']),...(end?[]:['end']),...(errors.length||failed.length?['runtime']:[])];await page.screenshot({path:path.join('/tmp/b09-prod-evidence',`${vp.name}-${choice}-end.png`),fullPage:false});results.push({viewport:vp.name,name:`${choice}-journey`,status:response.status(),errors,failed,problems,why,back,end,...m});await context.close();
              }
            }
            await browser.close();const bad=results.filter(x=>x.problems.length);fs.writeFileSync('/tmp/b09-prod-evidence/results.json',JSON.stringify({results,bad},null,2));console.log(JSON.stringify({count:results.length,bad},null,2));if(bad.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Reassert exact main
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b09-type-polish-production-evidence-${{ github.run_number }}
          path: /tmp/b09-prod-evidence
          if-no-files-found: error
          retention-days: 7
