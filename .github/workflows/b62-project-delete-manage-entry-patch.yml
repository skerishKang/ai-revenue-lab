name: B62 Project Delete Manage Entry Patch

on:
  push:
    branches:
      - feat/b62-project-delete-1060
    paths:
      - .github/workflows/b62-project-delete-manage-entry-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/b62-project-delete-1060
          fetch-depth: 0
      - name: Add bounded Project manage entry
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {text.count(old)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "apps/padiem-chat/static/app.js",
              '''    projects.forEach((project) => {\n      const button = document.createElement("button");\n      button.type = "button";\n      button.className = "recent-item project-item";\n      button.dataset.projectId = project.id;\n      button.textContent = project.name;\n      button.setAttribute("aria-current", activeProject && activeProject.id === project.id ? "true" : "false");\n      button.addEventListener("click", () => selectProject(project));\n      projectsList.appendChild(button);\n    });''',
              '''    projects.forEach((project) => {\n      const row = document.createElement("div");\n      row.className = "project-row";\n      const button = document.createElement("button");\n      button.type = "button";\n      button.className = "recent-item project-item";\n      button.dataset.projectId = project.id;\n      button.textContent = project.name;\n      button.setAttribute("aria-current", activeProject && activeProject.id === project.id ? "true" : "false");\n      button.addEventListener("click", () => selectProject(project));\n      const manage = document.createElement("button");\n      manage.type = "button";\n      manage.className = "project-manage";\n      manage.textContent = "관리";\n      manage.setAttribute("aria-label", `‘${project.name}’ 프로젝트 관리`);\n      manage.addEventListener("click", () => openProjectDialog(project));\n      row.append(button, manage);\n      projectsList.appendChild(row);\n    });''',
          )

          replace_once(
              "apps/padiem-chat/static/projects.css",
              '''.project-item[aria-current="true"] {\n  font-weight: 650;\n  background: rgba(24, 24, 27, 0.06);\n}\n''',
              '''.project-row {\n  display: flex;\n  align-items: stretch;\n  gap: 6px;\n}\n\n.project-row .project-item {\n  flex: 1 1 auto;\n  min-width: 0;\n}\n\n.project-manage {\n  flex: 0 0 auto;\n  min-width: 44px;\n  min-height: 44px;\n  padding: 0 8px;\n  border: 0;\n  border-radius: 9px;\n  background: transparent;\n  color: #5f6368;\n  cursor: pointer;\n}\n\n.project-manage:hover,\n.project-manage:focus-visible {\n  background: rgba(24, 24, 27, 0.06);\n  outline: none;\n}\n\n.project-item[aria-current="true"] {\n  font-weight: 650;\n  background: rgba(24, 24, 27, 0.06);\n}\n''',
          )

          replace_once(
              "apps/padiem-chat/tests/test_projects.py",
              '    assert \'projectDeleteButton.addEventListener("click", deleteProject)\' in js\n',
              '    assert \'projectDeleteButton.addEventListener("click", deleteProject)\' in js\n    assert \'manage.addEventListener("click", () => openProjectDialog(project))\' in js\n',
          )

      - name: Syntax check
        run: |
          node --check apps/padiem-chat/static/app.js
          python -m compileall -q apps/padiem-chat/tests/test_projects.py
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/b62-project-delete-manage-entry-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/padiem-chat/static/app.js apps/padiem-chat/static/projects.css apps/padiem-chat/tests/test_projects.py .github/workflows/b62-project-delete-manage-entry-patch.yml
          git commit -m "fix(b62): add non-switching Project manage entry (#1060)"
          git push origin HEAD:feat/b62-project-delete-1060
