name: B62 Cloudflare mock deploy

on:
  pull_request:
    paths:
      - "apps/padiem-chat/**"
      - ".github/scripts/b62_cloudflare_*.py"
      - ".github/workflows/b62-cloudflare-worker-deploy.yml"
  push:
    branches: [main]
    paths:
      - "apps/padiem-chat/**"
      - ".github/scripts/b62_cloudflare_*.py"
      - ".github/workflows/b62-cloudflare-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b62-cloudflare-mock-deploy
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      worker_state: ${{ steps.preflight.outputs.worker_state }}
      subdomain: ${{ steps.preflight.outputs.subdomain }}
      b14_http: ${{ steps.preflight.outputs.b14_http }}
      b14_status: ${{ steps.preflight.outputs.b14_status }}
      b14_provider_mode: ${{ steps.preflight.outputs.b14_provider_mode }}
      b14_has_key: ${{ steps.preflight.outputs.b14_has_key }}
      b14_catalog_models: ${{ steps.preflight.outputs.b14_catalog_models }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository mock-only deploy config
        run: python .github/scripts/b62_cloudflare_mock_config_guard.py
      - name: Read-only Cloudflare and B14 preflight
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python .github/scripts/b62_cloudflare_preflight.py
      - name: Read-only public-live readiness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python .github/scripts/b62_cloudflare_live_readiness.py
      - name: Read-only deployed progressive-SSE parity
        env:
          B62_BASE_URL: https://padiem-chat.${{ steps.preflight.outputs.subdomain }}.workers.dev
        run: python .github/scripts/b62_cloudflare_deployed_parity.py

  deploy-mock:
    needs: preflight
    # Once an existing Worker has production-only bindings (D1/quota/service bindings),
    # the repository's minimal mock wrangler file must never overwrite them. Existing
    # Workers are read-only preflight targets; production updates are explicit owner/local
    # deployments that preserve the full binding set.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.preflight.outputs.worker_state == 'absent'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Revalidate mock-only config before deploy
        run: python .github/scripts/b62_cloudflare_mock_config_guard.py

      - name: Guard initial Worker creation only
        env:
          WORKER_STATE: ${{ needs.preflight.outputs.worker_state }}
        run: |
          set -euo pipefail
          if [ "$WORKER_STATE" != "absent" ]; then
            echo "Refusing repository mock deploy over an existing provisioned Worker." >&2
            exit 1
          fi
          echo "Padiem Chat Worker is absent; guarded initial mock creation is allowed."

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"

      - name: Deploy initial mock-only Python Worker
        working-directory: apps/padiem-chat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uvx --from 'workers-py>=1.16.2,<2' pywrangler deploy

      - name: Post-deploy mock smoke
        env:
          B62_BASE_URL: https://padiem-chat.${{ needs.preflight.outputs.subdomain }}.workers.dev
        run: python .github/scripts/b62_cloudflare_mock_smoke.py
