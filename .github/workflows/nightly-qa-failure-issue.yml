name: Nightly QA failure issue

# CTO 2026-11-02: a failed nightly QA run must leave a tracked issue instead of
# only a red run. This reacts to the nightly runs of the moved checks (schedule,
# and a manual dispatch of the same night path) and opens one issue per failing
# workflow, commenting on the existing open one.
on:
  workflow_run:
    workflows:
      - "B62 Padiem Chat CI"
      - "B62 Browser QA Nightly"
      - "Web Desktop Non-Model E2E (3098)"
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: nightly-qa-failure-issue
  cancel-in-progress: false

jobs:
  file:
    if: ${{ (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or update the nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          title="nightly QA 실패: ${WF}"
          # The grade smoke prints one bounded line per declared tier. Read it
          # from every failed job of the run (all attempts, so a partial rerun
          # cannot erase earlier attempts' lines). No provider text.
          grades=""
          if [ "${WF}" = "B62 Padiem Chat CI" ]; then
            grades=$(gh api \
              "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs?filter=all&per_page=100" \
              --jq '.jobs[] | select(.conclusion == "failure") | .id' 2>/dev/null \
              | while read -r job; do
                  gh run view --job "${job}" --log 2>/dev/null || true
                done \
              | grep -o 'GRADE_SMOKE tier=[a-z]* status=[^ ]* error_code=[^ ]* verdict=[A-Z_]*' \
              | sort -u | head -8 || true)
          fi
          if [ -z "${grades}" ]; then
            grades="- 등급 스모크 결과 없음"
          fi
          body=$(printf '%s\n' \
            "야간 검사가 실패했습니다." \
            "" \
            "- 워크플로: ${WF}" \
            "- 실행: ${RUN_URL}" \
            "- 커밋: ${SHA}" \
            "" \
            "등급별 결과:" \
            "${grades}" \
            "" \
            "원인을 고친 뒤 이 이슈를 닫아 주세요.")
          number=$(TITLE="$title" gh issue list --state open --limit 200 \
            --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          echo "NIGHTLY_QA_FAILURE_ISSUE=RECORDED"
