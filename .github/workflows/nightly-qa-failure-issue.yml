name: Nightly QA failure issue

# CTO 2026-11-02: a failed nightly QA run must leave a tracked issue instead of
# only a red run. This reacts to the nightly runs of the moved checks (schedule,
# and a manual dispatch of the same night path) and opens one issue per failing
# workflow, commenting on the existing open one.
on:
  workflow_run:
    workflows:
      - "B62 Padiem Chat CI"
      - "B62 Browser QA Nightly"
      - "Web Desktop Non-Model E2E (3098)"
      - "Daily Real Usage Check"
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: nightly-qa-failure-issue
  cancel-in-progress: false

jobs:
  file:
    if: ${{ (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or update the nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          title="nightly QA 실패: ${WF}"
          # Every "Grade live smoke" job prints one bounded verdict line
          # (--report) on pass AND on fail, and the job itself records a
          # SKIPPED line when the QA credential is absent (#6720). The old
          # collector read only failed jobs' logs, so a green smoke beside a
          # red regression was reported as "결과 없음", and a smoke that never
          # started (self-hosted runner absent) left no line at all. Read
          # every smoke job of every attempt instead, classify the ones that
          # never ran, and keep one line per tier; a real verdict beats a
          # synthetic skip for the same tier. No provider text.
          grades=""
          nl=$'\n'
          if [ "${WF}" = "B62 Padiem Chat CI" ]; then
            smoke_jobs=$(gh api \
              "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs?filter=all&per_page=100" \
              --jq '.jobs[] | select(.name | startswith("Grade live smoke")) | [.id, .conclusion, ([.steps[]?] | length), .name] | @tsv' 2>/dev/null || true)
            real=""
            synthetic=""
            while IFS=$'\t' read -r job_id conclusion step_count name; do
              [ -n "${job_id}" ] || continue
              tier=$(printf '%s' "${name}" | sed -n 's/^Grade live smoke (\([a-z]*\))$/\1/p')
              tier="${tier:-unknown}"
              found=""
              if [ "${conclusion}" = "success" ] || { [ "${conclusion}" = "failure" ] && [ "${step_count}" -gt 0 ]; }; then
                found=$(gh run view --job "${job_id}" --log 2>/dev/null \
                  | grep -o 'GRADE_SMOKE tier=[a-z]* status=[^ ]* error_code=[^ ]* verdict=[A-Z_]*' \
                  | sort -u || true)
              fi
              if [ -n "${found}" ]; then
                real="${real}${found}${nl}"
                continue
              fi
              case "${conclusion}" in
                failure)
                  if [ "${step_count}" = "0" ]; then code=qa_runner_unavailable; else code=smoke_log_missing; fi ;;
                skipped) code=job_skipped ;;
                cancelled) code=job_cancelled ;;
                *) code="job_${conclusion:-unknown}" ;;
              esac
              synthetic="${synthetic}GRADE_SMOKE tier=${tier} status=0 error_code=${code} verdict=SKIPPED${nl}"
            done <<< "${smoke_jobs}"
            if [ -n "${real}" ]; then
              for t in $(printf '%s' "${real}" | grep -o 'tier=[a-z]*' | sort -u); do
                synthetic=$(printf '%s\n' "${synthetic}" | grep -v "GRADE_SMOKE ${t} " || true)
              done
            fi
            grades=$(printf '%s\n%s\n' "${real}" "${synthetic}" | sed '/^$/d' | head -8)
          elif [ "${WF}" = "Daily Real Usage Check" ]; then
            # #6724: the check prints one bounded USAGE_FLOW line per flow on
            # pass and on fail. Read them the same way the grade smokes are
            # read; a run whose job never started gets one synthetic line.
            usage_real=$(gh run view --job "$(gh api \
              "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs?filter=all&per_page=100" \
              --jq '.jobs[] | select(.conclusion == "success" or .conclusion == "failure") | .id' | head -1)" \
              --log 2>/dev/null | grep -o 'USAGE_FLOW name=[a-z_]* verdict=[A-Z]* elapsed_ms=[0-9]* code=[a-z_0-9]* head=[^ ]*' \
              | sort -u || true)
            if [ -n "${usage_real}" ]; then
              grades="${usage_real}"
            else
              grades="USAGE_FLOW name=none verdict=SKIPPED code=usage_log_missing"
            fi
          fi
          if [ -z "${grades}" ]; then
            grades="GRADE_SMOKE tier=none status=0 error_code=smoke_job_not_present verdict=SKIPPED"
          fi
          result_label="등급별 결과"
          if [ "${WF}" = "Daily Real Usage Check" ]; then
            result_label="흐름별 결과"
          fi
          body=$(printf '%s\n' \
            "야간 검사가 실패했습니다." \
            "" \
            "- 워크플로: ${WF}" \
            "- 실행: ${RUN_URL}" \
            "- 커밋: ${SHA}" \
            "" \
            "${result_label}:" \
            "${grades}" \
            "" \
            "원인을 고친 뒤 이 이슈를 닫아 주세요.")
          number=$(TITLE="$title" gh issue list --state open --limit 200 \
            --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          echo "NIGHTLY_QA_FAILURE_ISSUE=RECORDED"
