name: B14 Production Deploy Gate

# #1955 — exact-SHA production deploy gate for Business 14
# (ai-revenue-korean-ai-platform). Follows the engine gate pattern
# (#1923/#1924, b54-engine-production-deploy-gate.yml).
#
# Dispatch-only by contract: an ordinary pull request can never trigger a
# production mutation. The deploy step runs the repository's canonical
# pipeline (apps/korean-ai-platform/deploy.sh) as the single source of
# truth; no build steps are duplicated here.
#
# Retirement note: Cloudflare Workers Builds previously auto-deployed the
# watched branch. After the first gated deploy the owner must pause /
# disconnect Workers Builds for this worker so the retired auto-deploy can
# never overwrite a gated deploy.

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact main SHA to deploy'
        required: true
      confirmation:
        description: 'Type DEPLOY_B14_FROM_EXACT_MAIN to deploy, ROLLBACK_B14_TO_PREVIOUS_VERSION to roll back, or RETIRE_B14_SECRET_OPENROUTER_API_KEY for the #1933 S2-c one-shot dead-secret removal'
        required: true
      # #3704: a rollback must name its own target, the contract the Engine gate
      # established in #2748. Optional at the schema level so a deploy dispatch is
      # not forced to supply it, but the rollback branch refuses to run without
      # it, so Wrangler can never implicitly select a "previous upload" version
      # that no evidence names.
      rollback_version_id:
        description: 'Exact B14 Worker version id to roll back to (required for the rollback branch)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: b14-production-deploy-gate
  cancel-in-progress: false

jobs:
  deploy-production-b14:
    if: github.event.inputs.confirmation == 'DEPLOY_B14_FROM_EXACT_MAIN'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_sha }}
          persist-credentials: false

      - name: Premutation exact-main and account assertions
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.inputs.target_sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.event.inputs.target_sha }}"
          test "$CLOUDFLARE_ACCOUNT_ID" = '9be14bb7b8974e65d0afba647ab16932'
          echo 'PREMUTATION_EXACT_MAIN_SHA=PASS'
          echo 'PREMUTATION_TARGET_ACCOUNT=PASS'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'

      - name: Set up Node.js (for npx wrangler inside deploy.sh)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy B14 via canonical pipeline (deploy.sh)
        working-directory: apps/korean-ai-platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bash ./deploy.sh 2>&1 | tee /tmp/b14-deploy.log
          echo 'B14_CANONICAL_PIPELINE_DEPLOY=PASS'

      - name: Post-deploy verification (version 100% + engine binding + Kilo catalog marker)
        working-directory: apps/korean-ai-platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # This step runs with working-directory apps/korean-ai-platform, so the
          # canonical resolver is addressed by absolute path instead of a cwd
          # relative guess.
          B14_SERVED_VERSION_SCRIPTS: ${{ github.workspace }}/.github/scripts
        run: |
          set -euo pipefail
          sleep 15

          # (a) The deploy step must have emitted a Current Version ID, and the
          # documented Cloudflare deployments endpoint must report that exact
          # version as the one actively serving 100%.
          #
          # The served-version rules are NOT reimplemented here and they are NOT
          # read from `wrangler deployments list`: that command emits a bare list
          # whose entry order is not a documented served-version authority, and
          # every superseded deployment still records percentage 100 in its own
          # history, so scanning it lets a rolled-back version satisfy the gate.
          # The whole REST envelope is handed to the shared canonical resolver,
          # which requires result.deployments[0] -- the documented active
          # deployment -- to carry exactly one version at 100% with a safe id.
          VERSION_ID="$(grep -oE 'Current Version ID:\s*[0-9a-fA-F-]+' /tmp/b14-deploy.log | tail -n 1 | awk '{print $NF}')"
          test -n "$VERSION_ID"
          echo "DEPLOY_CURRENT_VERSION_ID=${VERSION_ID}"
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/ai-revenue-korean-ai-platform/deployments" \
            -o /tmp/b14-deployments.json
          python3 - "$VERSION_ID" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path(os.environ["B14_SERVED_VERSION_SCRIPTS"]).resolve()))

          from cloudflare_served_version import (  # noqa: E402
              ServedVersionReason,
              ServedVersionResolutionError,
              resolve_served_version_id,
          )

          expected = sys.argv[1]
          print(f"B14_EXPECTED_VERSION={expected}")
          path = os.environ.get("B14_DEPLOYMENTS_JSON", "/tmp/b14-deployments.json")
          with open(path, encoding="utf-8") as fh:
              payload = json.load(fh)

          try:
              served = resolve_served_version_id(payload)
          except ServedVersionResolutionError as exc:
              print("CANONICAL_SERVED_VERSION_RESOLVED=NO")
              print(f"CANONICAL_SERVED_VERSION_REASON={exc.reason}")
              raise SystemExit(f"served-version guard failed closed: {exc.reason}")

          if served != expected:
              print("CANONICAL_SERVED_VERSION_RESOLVED=NO")
              print(f"CANONICAL_SERVED_VERSION_REASON={ServedVersionReason.VERSION_ID}")
              print("B14_SERVED_VERSION_MISMATCH=YES")
              raise SystemExit("active served version does not match deployed version")

          print(f"CANONICAL_SERVED_VERSION_RESOLVED={served}")
          print("CANONICAL_SERVED_VERSION_REUSED=YES")
          print("HISTORICAL_DEPLOYMENT_ACCEPTED=NO")
          print("WRANGLER_RAW_LIST_ACCEPTED=NO")
          print("POST_DEPLOY_VERSION_AT_100=PASS")
          PY

          # (b) Engine health must report the B14 service binding present.
          CODE=$(curl -s -o /tmp/engine-health.json -w '%{http_code}' --max-time 20 'https://engine.padiem.net/internal/v1/health')
          test "$CODE" = '200'
          grep -q '"b14_service_bound":true' /tmp/engine-health.json
          echo 'ENGINE_B14_BOUND_SMOKE=PASS'

          # (c) Catalog liveness marker: the deployed B14 catalog must expose a
          # Kilo Gateway route (the first gated deploy carries #1952). Mechanism:
          # the already-CI-read workers.dev pilot models endpoint (same target
          # the b62 preflight uses); no new public surface is introduced.
          curl -s --max-time 20 \
            'https://ai-revenue-korean-ai-platform.charliekant.workers.dev/api/pilot/models' \
            -o /tmp/b14-models.json
          python3 - <<'PY'
          import json

          with open('/tmp/b14-models.json', encoding='utf-8') as fh:
              payload = json.load(fh)
          catalog = payload.get('catalog') or []
          ids = [str(entry.get('id', '')) for entry in catalog]
          assert any(mid.startswith('kilo/') for mid in ids), (
              f'deployed B14 catalog has no Kilo route entry: {ids!r}'
          )
          print('B14_KILO_CATALOG_MARKER=PASS')
          PY

          echo 'B14_PRODUCTION_DEPLOY_SMOKE=PASS'

  # #1933 S2-c: one-shot removal of the dead Worker secret OPENROUTER_API_KEY.
  # After S2-b no code path reads this key; the value is inert. Separate
  # confirmation token: deploying or rolling back never removes a secret.
  # wrangler secret delete creates a NEW Worker version (same code as the
  # currently served version, minus the secret) and deploys it immediately
  # (developers.cloudflare.com/workers/wrangler/commands/workers/#secret).
  # Therefore this job must verify serving health afterwards.
  retire-openrouter-secret:
    if: github.event.inputs.confirmation == 'RETIRE_B14_SECRET_OPENROUTER_API_KEY'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Retire dead OPENROUTER_API_KEY secret
        working-directory: apps/korean-ai-platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 secret list --format json > /tmp/b14-secrets-before.json
          python3 -c "import json; d=json.load(open('/tmp/b14-secrets-before.json')); assert isinstance(d,list) and d, 'EMPTY_OR_INVALID_SECRET_LIST'; print('SECRETS_BEFORE=' + ','.join(sorted(x['name'] for x in d)))"
          if ! python3 -c "import json,sys; d=json.load(open('/tmp/b14-secrets-before.json')); sys.exit(0 if any(x.get('name')=='OPENROUTER_API_KEY' for x in d) else 1)"; then
            echo 'SECRET_ALREADY_ABSENT'
            exit 0
          fi
          npx wrangler@4 secret delete OPENROUTER_API_KEY
          npx wrangler@4 secret list --format json > /tmp/b14-secrets-after.json
          if python3 -c "import json,sys; d=json.load(open('/tmp/b14-secrets-after.json')); sys.exit(0 if any(x.get('name')=='OPENROUTER_API_KEY' for x in d) else 1)"; then
            echo 'B14_SECRET_RETIREMENT_VERIFICATION_FAILED' >&2
            exit 1
          fi
          echo 'B14_SECRET_RETIRED=OPENROUTER_API_KEY'

      - name: Verify serving health after secret retirement
        run: |
          set -euo pipefail; sleep 15
          CODE=$(curl -s -A "b14-gate/1.0" -o /tmp/health.json -w '%{http_code}' --max-time 20 'https://ai-revenue-korean-ai-platform.charliekant.workers.dev/api/pilot/health')
          test "$CODE" = '200'
          python3 -c "import json;d=json.load(open('/tmp/health.json'));assert d.get('mode')=='b14-live',d.get('mode');assert d.get('configured_providers')==3,d.get('configured_providers');r=d.get('registered_routes');n=len(r) if isinstance(r,list) else r;assert n==6,n;print('B14_POST_RETIRE_HEALTH=PASS mode=b14-live providers=3 routes=6')"
          npx wrangler@4 deployments list 2>/dev/null | head -20 || true

  # #3704: a rollback names its target and then proves that target is serving.
  # Before this the job ran a bare `wrangler rollback` and declared PASS from the
  # command exit, which is the #2451 defect class twice over: an unnamed version
  # selection, and an exit code mistaken for a served-version proof. The Engine
  # gate is the canonical precedent (#2748 explicit target, #2752 mutation-class
  # evidence) and is reused through the repository-wide adapters, not
  # reimplemented here.
  rollback-production-b14:
    if: github.event.inputs.confirmation == 'ROLLBACK_B14_TO_PREVIOUS_VERSION'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Roll back B14 to the named version and prove it is serving
        working-directory: apps/korean-ai-platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_TARGET: ${{ github.event.inputs.rollback_version_id }}
          # This step runs with working-directory apps/korean-ai-platform, so the
          # canonical adapters are addressed from the workspace root instead of a
          # cwd-relative guess.
          B14_SERVED_VERSION_SCRIPTS: ${{ github.workspace }}/.github/scripts
        run: |
          set -euo pipefail
          cli="${B14_SERVED_VERSION_SCRIPTS}/cloudflare_served_version_cli.py"
          class_cli="${B14_SERVED_VERSION_SCRIPTS}/cloudflare_mutation_evidence.py"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/ai-revenue-korean-ai-platform"

          # Durable, bounded evidence: version ids, read counts and the primitive's
          # own verdict lines. Never a token, an account id, a header or a response
          # envelope, which is why the raw deployment files stay out of the path
          # this step publishes.
          evidence="${RUNNER_TEMP}/b14-rollback-evidence.txt"
          : > "${evidence}"
          record() {
            printf '%s\n' "$1"
            printf '%s\n' "$1" >> "${evidence}"
          }
          record "MUTATION_CLASS=ROLLBACK"
          record "B14_WORKER_SCRIPT=ai-revenue-korean-ai-platform"
          record "RAW_DEPLOYMENTS_ENVELOPE_INCLUDED=NO"
          record "SECRET_VALUES_INCLUDED=NO"
          record "ACCOUNT_ID_INCLUDED=NO"

          # (1) #2748: name the target or stop before touching Production. A
          # rollback that lets Wrangler pick the previous upload proves nothing
          # about the version any evidence names.
          if [ -z "${ROLLBACK_TARGET:-}" ]; then
            echo 'B14_PRODUCTION_ROLLBACK=FAIL' >&2
            echo 'REASON=rollback_version_id is required; implicit previous-version selection is refused' >&2
            echo 'ROLLBACK_TARGET_EXPLICIT=NO' >&2
            exit 1
          fi
          # Canonical safe-id contract, recorded before the value is written
          # anywhere, so a rejected string can neither reach the CLI nor forge an
          # evidence line. The --version-id=FORM is load-bearing: with a space,
          # argparse reads a canonical-but-leading-hyphen id such as
          # "-safe-version" as an option and refuses it before the predicate ever
          # runs, so the gate would reject ids the canonical grammar accepts.
          python3 "${cli}" validate-version-id \
            --version-id="${ROLLBACK_TARGET}"
          record "ROLLBACK_TARGET_VERSION_ID=${ROLLBACK_TARGET}"
          record "ROLLBACK_TARGET_EXPLICIT=YES"
          record "IMPLICIT_PREVIOUS_VERSION_SELECTION=NO"

          # (2) Baseline the served version BEFORE mutating, through the canonical
          # resolver rather than a shell-side envelope read.
          pre_deployments="${RUNNER_TEMP}/deployments-rollback-baseline.json"
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${base}/deployments" -o "${pre_deployments}"
          if ! pre_version="$(python3 "${cli}" resolve-active --deployments "${pre_deployments}")"; then
            echo 'B14_PRODUCTION_ROLLBACK=FAIL' >&2
            echo 'REASON=canonical resolver refused the pre-rollback deployments read' >&2
            exit 1
          fi
          test -n "${pre_version}"
          record "PRE_ROLLBACK_SERVED_VERSION_ID=${pre_version}"
          record "PRE_MUTATION_VERSION_CAPTURED=YES"

          # (3) Mutate only the named version. The command exit is recorded as one
          # step, never as the verdict.
          npx wrangler@4 rollback "${ROLLBACK_TARGET}" \
            --message "B14 production rollback to explicit target (owner-authorized gate)"
          record "B14_ROLLBACK_COMMAND=EXIT_ZERO"
          record "ROLLBACK_COMMAND_EXIT_ZERO_AS_FINAL_PASS=NO"

          # (4) Bounded readback. Each attempt is resolved through the canonical
          # resolver and recorded as one observation; a refused read is recorded too
          # and finalizes nothing while the window is open. No envelope rule is
          # evaluated in this shell.
          observations="${RUNNER_TEMP}/b14-rollback-observations.txt"
          : > "${observations}"
          rollback_reads=0
          for attempt in $(seq 1 30); do
            rollback_reads="${attempt}"
            deployments="${RUNNER_TEMP}/deployments-rollback-${attempt}.json"
            if curl -fsS --max-time 20 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "${base}/deployments" -o "${deployments}" \
              && candidate="$(python3 "${cli}" resolve-active --deployments "${deployments}")" \
              && [ -n "${candidate}" ]; then
              printf 'ok %s\n' "${candidate}" >> "${observations}"
            else
              printf 'reject -\n' >> "${observations}"
            fi
            # The open-window verdict is only a continue/stop signal; the closed
            # window below is what publishes a decision, so nothing is lost here.
            if python3 "${class_cli}" evaluate \
              --class ROLLBACK --pre-version="${pre_version}" --target-version="${ROLLBACK_TARGET}" \
              --observations "${observations}" --window-open >/dev/null; then
              open_rc=0
            else
              open_rc=$?
            fi
            # 3 means "not final yet, keep reading"; anything else ends the poll
            # and the closed-window decision below settles the verdict.
            if [ "${open_rc}" -ne 3 ]; then
              break
            fi
            sleep 2
          done
          record "POST_ROLLBACK_CONVERGENCE_READS=${rollback_reads}"

          # (5) The verdict must be one the evidence primitive itself considers
          # final, and a ROLLBACK is final only when the served version EQUALS the
          # named target. A timed-out window, a refused read, a split-traffic
          # deployment and a wrong served version all close as FAIL here.
          # The version-id flags keep the =FORM for the same reason as above: a
          # pre-version read from the resolver is as much a canonical id as a
          # dispatched target is, and it may start with a hyphen too.
          if final_out="$(python3 "${class_cli}" evaluate \
            --class ROLLBACK --pre-version="${pre_version}" --target-version="${ROLLBACK_TARGET}" \
            --observations "${observations}")"; then
            final_rc=0
          else
            final_rc=$?
          fi
          while IFS= read -r line; do
            record "${line}"
          done <<< "${final_out}"
          if [ "${final_rc}" -ne 0 ]; then
            echo 'POST_ROLLBACK_SERVED_EQUALS_TARGET=FAIL' >&2
            echo 'B14_PRODUCTION_ROLLBACK=FAIL' >&2
            exit 1
          fi
          served_version="$(printf '%s\n' "${final_out}" | sed -n 's/^POST_MUTATION_SERVED_VERSION_ID=//p')"
          record "POST_ROLLBACK_SERVED_VERSION_ID=${served_version}"
          record "POST_ROLLBACK_SERVED_EQUALS_TARGET=PASS"
          record "B14_PRODUCTION_ROLLBACK=PASS"

      - name: Publish the bounded rollback evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b14-production-rollback-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/b14-rollback-evidence.txt
          if-no-files-found: error
          retention-days: 90
