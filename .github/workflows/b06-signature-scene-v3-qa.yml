name: B06 Signature Scene V3 Visual QA

on:
  pull_request:
    paths:
      - 'reference/business-06-world-feed-v1/**'
      - '.github/workflows/b06-signature-scene-v3-qa.yml'
  push:
    branches:
      - 'agent/b06-world-signal-stage-v3'
    paths:
      - 'reference/business-06-world-feed-v1/**'
      - '.github/workflows/b06-signature-scene-v3-qa.yml'

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static contract checks
        run: |
          set -euo pipefail
          node --check reference/business-06-world-feed-v1/scripts/signature-scene-v3.js
          grep -q 'signature-scene-v3.css' reference/business-06-world-feed-v1/index.html
          grep -q 'signature-scene-v3.js' reference/business-06-world-feed-v1/index.html
          grep -q 'prefers-reduced-motion' reference/business-06-world-feed-v1/styles/signature-scene-v3.css
          grep -q 'data-open-story data-story-id="harbor"' reference/business-06-world-feed-v1/scripts/signature-scene-v3.js

      - name: Install isolated Playwright
        run: |
          set -euo pipefail
          mkdir -p /tmp/b06-pw
          cd /tmp/b06-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory reference/business-06-world-feed-v1 >/tmp/b06-http.log 2>&1 &
          echo $! >/tmp/b06-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/b06-http.log
          exit 1

      - name: Desktop mobile reduced-motion browser QA
        env:
          NODE_PATH: /tmp/b06-pw/node_modules
        run: |
          set -euo pipefail
          mkdir -p /tmp/b06-visual
          cat >/tmp/b06-qa.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const assert = require('assert');
          const base = 'http://127.0.0.1:4173/index.html';

          async function runScenario(browser, name, viewport, reducedMotion = 'no-preference') {
            const context = await browser.newContext({ viewport, reducedMotion });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
            page.on('console', msg => { if (msg.type() === 'error') errors.push(`console: ${msg.text()}`); });

            await page.goto(`${base}#feed`, { waitUntil: 'networkidle' });
            await page.waitForSelector('#view-feed:not([hidden]) .wf-signal-stage', { state: 'visible' });
            await page.waitForFunction(() => document.querySelector('.wf-signal-stage')?.dataset.stageStep === '4', null, { timeout: 8000 });

            const state = await page.evaluate(() => {
              const stage = document.querySelector('.wf-signal-stage');
              const brief = stage?.querySelector('.wf-stage-brief');
              const routeViews = [...document.querySelectorAll('[data-route-view]')];
              const activeRoutes = routeViews.filter(node => !node.hidden);
              const visibleSvg = [...document.images].filter(img => {
                const src = img.getAttribute('src') || '';
                const rect = img.getBoundingClientRect();
                return /\.svg(?:[?#]|$)/i.test(src) && rect.width > 0 && rect.height > 0 && getComputedStyle(img).visibility !== 'hidden' && getComputedStyle(img).display !== 'none';
              });
              return {
                step: stage?.dataset.stageStep,
                route: document.querySelector('.review-shell')?.dataset.route,
                activeRoutes: activeRoutes.length,
                overflow: document.documentElement.scrollWidth - window.innerWidth,
                stageWidth: stage?.getBoundingClientRect().width || 0,
                briefOpacity: Number(getComputedStyle(brief).opacity),
                visibleSvg: visibleSvg.length,
                ctaDisabled: stage?.querySelector('[data-open-story][data-story-id="harbor"]')?.disabled || false
              };
            });

            assert.equal(state.step, '4', `${name}: stage did not resolve to BRIEF`);
            assert.equal(state.route, 'feed', `${name}: wrong route`);
            assert.equal(state.activeRoutes, 1, `${name}: expected exactly one active route`);
            assert.ok(state.overflow <= 1, `${name}: horizontal overflow ${state.overflow}px`);
            assert.ok(state.stageWidth > 300, `${name}: stage not laid out`);
            assert.ok(state.briefOpacity > 0.95, `${name}: final brief not fully revealed`);
            assert.equal(state.visibleSvg, 0, `${name}: visible SVG artwork remains`);
            assert.equal(state.ctaDisabled, false, `${name}: brief CTA disabled`);
            assert.deepEqual(errors, [], `${name}: browser errors: ${errors.join(' | ')}`);

            await page.screenshot({ path: `/tmp/b06-visual/${name}.png`, fullPage: true });

            await page.click('.wf-stage-brief [data-open-story][data-story-id="harbor"]');
            await page.waitForFunction(() => location.hash === '#story' && !document.querySelector('#view-story')?.hidden);
            assert.equal(await page.evaluate(() => document.querySelector('.review-shell')?.dataset.storyId), 'harbor', `${name}: harbor story contract broke`);

            if (reducedMotion === 'no-preference') {
              await page.goto(`${base}#feed`, { waitUntil: 'networkidle' });
              await page.waitForSelector('.wf-stage-replay', { state: 'visible' });
              await page.waitForFunction(() => document.querySelector('.wf-signal-stage')?.dataset.stageStep === '4', null, { timeout: 8000 });
              await page.click('.wf-stage-replay');
              await page.waitForFunction(() => document.querySelector('.wf-signal-stage')?.dataset.stageStep === '0');
              await page.waitForFunction(() => document.querySelector('.wf-signal-stage')?.dataset.stageStep === '4', null, { timeout: 8000 });
            }

            await context.close();
            return state;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const results = {};
            results.desktop = await runScenario(browser, 'desktop-1440x1100', { width: 1440, height: 1100 });
            results.mobile = await runScenario(browser, 'mobile-390x844', { width: 390, height: 844 });
            results.reduced = await runScenario(browser, 'reduced-motion-1440x1100', { width: 1440, height: 1100 }, 'reduce');
            fs.writeFileSync('/tmp/b06-visual/results.json', JSON.stringify(results, null, 2));
            await browser.close();
            console.log(JSON.stringify(results, null, 2));
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node /tmp/b06-qa.cjs

      - name: Upload B06 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b06-signature-scene-v3-visual-evidence
          path: /tmp/b06-visual
          if-no-files-found: error
