name: B62 B66 D1 Migration 027 Gate

# #4379: 027 is the one table the byte-ceiling release chain still needs in the
# live database. 060 rebuilds b66_template_source, so 060 cannot be applied
# before 027 is. This gate is the reviewed apply path for it.
#
# It reuses the existing B62 D1 operational pattern instead of standing up a
# second deployment system: the live database id is resolved server-side from
# the padiem-chat Worker PADIEM_CHAT_DB binding, the applied SQL is the
# reviewed 027 file and nothing else, the run is pinned to an exact current
# main SHA, the mutation needs a separate owner-authorized dispatch with an
# exact confirmation phrase, and a D1 recovery bookmark is read before the
# mutation so a rollback point exists.
#
# The gate never deploys a Worker, never mutates a binding, never applies
# another migration, never reads row content and never emits a database
# identifier. It fails closed on any state it does not own:
#   missing -> the reviewed 027 release applies exactly once
#   exact   -> already applied, the run is a verified no-op
#   drift   -> the live table is not the reviewed shape, never applied

on:
  pull_request:
    paths:
      - ".github/workflows/b62-b66-d1-migration-027-gate.yml"
      - ".github/scripts/b62_d1_migration_027_schema.py"
      - ".github/tests/test_b62_d1_migration_027_gate.py"
      - "apps/padiem-chat/migrations/027_b66_template_source.sql"
  workflow_dispatch:
    inputs:
      mode:
        description: "Migration 027 gate mode"
        required: true
        type: choice
        default: repository_preflight
        options:
          - repository_preflight
          - cloudflare_readonly
          - apply_migration_027
      target_sha:
        description: "Exact current main SHA"
        required: true
        type: string
      confirmation:
        description: "Exact mutation confirmation phrase"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: b62-b66-d1-migration-027-gate
  cancel-in-progress: false

env:
  B62_WORKER: padiem-chat
  D1_BINDING: PADIEM_CHAT_DB
  TARGET_SHA: ${{ inputs.target_sha }}

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR exact head
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact dispatch SHA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact current main for dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'PREMUTATION_EXACT_MAIN_SHA=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run migration gate contract tests
        run: python .github/tests/test_b62_d1_migration_027_gate.py

      - name: Replay the reviewed 027 source contract
        run: python .github/scripts/b62_d1_migration_027_schema.py offline

      - name: Source-only evidence
        run: |
          echo 'B62_D1_MIGRATION_027_SOURCE_CONTRACT=PASS'
          echo 'PRODUCTION_MUTATION=0'

  cloudflare-readonly:
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'repository_preflight' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      schema_state: ${{ steps.schema.outputs.schema_state }}
      db_fingerprint: ${{ steps.binding.outputs.db_fingerprint }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconfirm exact main before live readback
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'READONLY_EXACT_MAIN_SHA=PASS'

      - name: Resolve live PADIEM_CHAT_DB binding without emitting identifiers
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          settings="${RUNNER_TEMP}/b62-settings-d1-027.json"
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" \
            -o "${settings}"
          DB_ID="$(python - "${settings}" "${D1_BINDING}" <<'PY'
          import json, re, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          if payload.get('success') is not True:
              raise SystemExit('worker settings read failed')
          bindings = payload.get('result', {}).get('bindings', [])
          hits = [b for b in bindings if b.get('type') == 'd1' and b.get('name') == sys.argv[2]]
          if len(hits) != 1:
              raise SystemExit('expected exactly one live PADIEM_CHAT_DB binding')
          database_id = hits[0].get('id')
          if not isinstance(database_id, str) or not re.fullmatch(r'[0-9a-fA-F-]{32,36}', database_id):
              raise SystemExit('live PADIEM_CHAT_DB binding has invalid database id')
          print(database_id)
          PY
          )"
          test -n "${DB_ID}"
          echo "::add-mask::${DB_ID}"
          echo "DB_ID=${DB_ID}" >> "${GITHUB_ENV}"
          fingerprint="$(printf %s "${DB_ID}" | sha256sum | cut -d' ' -f1)"
          test -n "${fingerprint}"
          echo "db_fingerprint=${fingerprint}" >> "${GITHUB_OUTPUT}"
          echo 'LIVE_PADIEM_CHAT_DB_DERIVED=PASS'
          echo 'D1_IDENTIFIER_OUTPUT=0'

      - name: Read only migration 027 schema
        id: schema
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          query="${RUNNER_TEMP}/b62-d1-027-schema-query.json"
          response="${RUNNER_TEMP}/b62-d1-027-schema-before.json"
          python3 .github/scripts/b62_d1_migration_027_schema.py query "${query}"
          curl -fsS -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${query}" -o "${response}"
          evidence="$(python3 .github/scripts/b62_d1_migration_027_schema.py inspect "${response}")"
          echo "${evidence}"
          state="$(printf '%s\n' "${evidence}" | sed -n 's/^B62_D1_MIGRATION_027_SCHEMA=//p' | tr '[:upper:]' '[:lower:]')"
          case "${state}" in missing|exact) ;; *) echo 'invalid schema classifier state' >&2; exit 1;; esac
          echo "schema_state=${state}" >> "${GITHUB_OUTPUT}"
          echo 'D1_SCHEMA_QUERY=READ_ONLY'
          echo 'ROW_CONTENT_READ=0'
          echo 'PRODUCTION_MUTATION=0'

      - name: Read only D1 Time Travel recovery availability
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          response="${RUNNER_TEMP}/b62-d1-027-time-travel-readonly.json"
          # GET only. POST on this endpoint CREATES a recovery bookmark, and the
          # Cloudflare API refuses it as a method the read path does not allow.
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/time_travel/bookmark" \
            -o "${response}"
          python - "${response}" <<'PY'
          import json, re, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          result = payload.get('result') if payload.get('success') is True else None
          mark = result.get('bookmark') if isinstance(result, dict) else None
          if not isinstance(mark, str) or re.fullmatch(r'[A-Za-z0-9_-]{12,130}', mark) is None:
              raise SystemExit('D1_RECOVERY_BOOKMARK_UNAVAILABLE')
          print('D1_RECOVERY_AVAILABLE=PASS')
          PY
          echo 'D1_RECOVERY_BOOKMARK_PRESENT=PASS'
          echo 'D1_SCHEMA_QUERY=READ_ONLY'
          echo 'D1_IDENTIFIER_OUTPUT=0'
          echo 'PRODUCTION_MUTATION=0'

  apply-migration-027:
    needs: [source-contract, cloudflare-readonly]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply_migration_027' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRMATION: ${{ inputs.confirmation }}
      READONLY_SCHEMA_STATE: ${{ needs.cloudflare-readonly.outputs.schema_state }}
      READONLY_DB_FINGERPRINT: ${{ needs.cloudflare-readonly.outputs.db_fingerprint }}
    steps:
      - name: Require explicit migration authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${CONFIRMATION}" = "APPLY_B62_B66_D1_MIGRATION_027_FROM_EXACT_MAIN"
          case "${READONLY_SCHEMA_STATE}" in
            missing|exact) ;;
            drift)
              echo 'Refusing mutation: the existing 027 schema is structurally different.' >&2
              exit 1
              ;;
            *)
              echo 'Refusing mutation: no trustworthy readonly schema disposition.' >&2
              exit 1
              ;;
          esac
          echo 'B62_D1_MIGRATION_027_AUTHORIZATION=PASS'

      - name: Checkout exact approved main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconfirm exact main immediately before mutation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo 'PREMUTATION_EXACT_MAIN_SHA=PASS'

      - name: Re-resolve the live D1 binding immediately before mutation
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          settings="${RUNNER_TEMP}/b62-settings-d1-027-premutation.json"
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}/settings" \
            -o "${settings}"
          DB_ID="$(python - "${settings}" "${D1_BINDING}" <<'PY'
          import json, re, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          bindings = payload.get('result', {}).get('bindings', []) if payload.get('success') is True else []
          hits = [b for b in bindings if b.get('type') == 'd1' and b.get('name') == sys.argv[2]]
          if len(hits) != 1:
              raise SystemExit('expected exactly one live PADIEM_CHAT_DB binding')
          database_id = hits[0].get('id')
          if not isinstance(database_id, str) or not re.fullmatch(r'[0-9a-fA-F-]{32,36}', database_id):
              raise SystemExit('live PADIEM_CHAT_DB binding has invalid database id')
          print(database_id)
          PY
          )"
          test -n "${DB_ID}"
          echo "::add-mask::${DB_ID}"
          echo "DB_ID=${DB_ID}" >> "${GITHUB_ENV}"
          fingerprint="$(printf %s "${DB_ID}" | sha256sum | cut -d' ' -f1)"
          test -n "${READONLY_DB_FINGERPRINT}"
          if [ "${fingerprint}" != "${READONLY_DB_FINGERPRINT}" ]; then
            echo 'D1_BINDING_CHANGED_AFTER_READONLY=STOP' >&2
            exit 1
          fi
          echo 'D1_BINDING_IDENTITY_STABLE=PASS'

      - name: Recheck identical schema immediately before SQL mutation
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          python3 .github/scripts/b62_d1_migration_027_schema.py query "${RUNNER_TEMP}/b62-d1-027-premutation-query.json"
          curl -fsS -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${RUNNER_TEMP}/b62-d1-027-premutation-query.json" \
            -o "${RUNNER_TEMP}/b62-d1-027-premutation.json"
          evidence="$(python3 .github/scripts/b62_d1_migration_027_schema.py inspect "${RUNNER_TEMP}/b62-d1-027-premutation.json")"
          echo "${evidence}"
          state="$(printf '%s\n' "${evidence}" | sed -n 's/^B62_D1_MIGRATION_027_SCHEMA=//p' | tr '[:upper:]' '[:lower:]')"
          test "${state}" = "${READONLY_SCHEMA_STATE}"
          echo "PREMUTATION_SCHEMA_STATE=${state}"
          echo 'PREMUTATION_SCHEMA_STATE_STABLE=PASS'

      - name: Apply only migration 027 when absent
        if: ${{ env.READONLY_SCHEMA_STATE == 'missing' }}
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          apply="${RUNNER_TEMP}/b62-d1-027-apply.json"
          response="${RUNNER_TEMP}/b62-d1-027-apply-response.json"
          # The apply payload is the reviewed 027 file itself: the helper refuses
          # to emit SQL that is not the approved source, so no other migration
          # and no hand-written statement can reach the live database.
          python3 .github/scripts/b62_d1_migration_027_schema.py payload "${apply}"
          curl -fsS -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${apply}" -o "${response}"
          python3 - "${response}" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          blocks = payload.get('result') if payload.get('success') is True else None
          if not isinstance(blocks, list) or len(blocks) != 3:
              raise SystemExit('027 apply response is not the reviewed statement set')
          for block in blocks:
              if not isinstance(block, dict) or block.get('success') is not True:
                  raise SystemExit('027 apply statement unsuccessful')
          print('B62_D1_MIGRATION_027_APPLY_RESPONSE=PASS')
          print('B62_D1_MIGRATION_027_APPLY_STATEMENTS=%d' % len(blocks))
          PY
          echo 'B62_D1_MIGRATION_027=APPLIED'
          echo 'PRODUCTION_MUTATION=1'

      - name: Record no-op when migration 027 is already applied
        if: ${{ env.READONLY_SCHEMA_STATE == 'exact' }}
        run: |
          echo 'B62_D1_MIGRATION_027=SKIPPED_ALREADY_APPLIED'
          echo 'PRODUCTION_MUTATION=0'

      - name: Read back exact migration 027 schema
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          query="${RUNNER_TEMP}/b62-d1-027-post-query.json"
          response="${RUNNER_TEMP}/b62-d1-027-post.json"
          python3 .github/scripts/b62_d1_migration_027_schema.py query "${query}"
          curl -fsS -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${query}" -o "${response}"
          python3 .github/scripts/b62_d1_migration_027_schema.py inspect "${response}" \
            | tee "${RUNNER_TEMP}/b62-d1-027-post-verdict.txt"
          grep -qx 'B62_D1_MIGRATION_027_SCHEMA=EXACT' "${RUNNER_TEMP}/b62-d1-027-post-verdict.txt"
          echo 'B62_D1_MIGRATION_027_POST_APPLY=EXACT'
          echo 'ROW_CONTENT_READ=0'
          echo 'D1_IDENTIFIER_OUTPUT=0'

      - name: Verify foreign key integrity after the release
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          query="${RUNNER_TEMP}/b62-d1-027-foreign-key-check.json"
          python - "${query}" <<'PY'
          import json, sys
          with open(sys.argv[1], 'w', encoding='utf-8') as handle:
              json.dump({'sql': 'PRAGMA foreign_key_check;'}, handle)
          PY
          response="${RUNNER_TEMP}/b62-d1-027-foreign-key-check-response.json"
          curl -fsS -X POST "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            --data-binary "@${query}" -o "${response}"
          jq -e '.success == true and (.result | length == 1) and (.result[0].success == true) and ((.result[0].results // []) | length == 0)' \
            "${response}" >/dev/null
          echo 'B62_D1_MIGRATION_027_FOREIGN_KEY_CHECK=PASS'
          echo 'WORKER_DEPLOYED=0'
          echo 'BINDING_MUTATION=0'
          echo 'UNRELATED_MIGRATION_APPLY=0'
          echo 'ROW_CONTENT_READ=0'
