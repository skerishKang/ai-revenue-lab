name: B62 Workspace R2 Binding Gate

on:
  pull_request:
    paths:
      - ".github/workflows/b62-workspace-r2-binding-gate.yml"
      - ".github/scripts/b62_cloudflare_production_deploy_config.py"
      - "apps/padiem-chat/tests/test_b62_production_r2_binding.py"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact current main SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: b62-workspace-r2-binding-gate
  cancel-in-progress: false

env:
  B62_WORKER: padiem-chat
  R2_BINDING: PADIEM_WORKSPACE_FILES

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.b62_target_sha.outputs.target_sha }}
    steps:
      # The body below is copied verbatim from the marked region of
      # .github/scripts/b62_verify_target_sha.py, which stays the rule's only authority:
      # a step that runs before any checkout has no repository to read a script from.
      - name: Verify target_sha shape before any checkout
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: b62_target_sha
        env:
          B62_TARGET_SHA_RAW: ${{ inputs.target_sha }}
        shell: bash
        run: |
          python3 - <<'B62_TARGET_SHA_GUARD'
          import os
          import re
          import sys

          _SHA = re.compile(r"^[0-9a-f]{40}$")


          def canonical_target_sha(raw):
              # Case is the only forgiveness: a short or non-hex value is not a commit.
              value = (raw or "").strip()
              if len(value) != 40:
                  return None
              candidate = value.lower()
              return candidate if _SHA.match(candidate) else None


          def failure_message(raw):
              return f"target_sha는 40자리 전체 SHA여야 합니다(입력: {len((raw or '').strip())}자리). git rev-parse origin/main 값을 넣으세요"


          def main():
              raw = os.environ.get("B62_TARGET_SHA_RAW", "")
              canonical = canonical_target_sha(raw)
              if canonical is None:
                  sys.stdout.write("::error::" + failure_message(raw) + "\n")
                  return 1
              for key, name in (("GITHUB_OUTPUT", "target_sha"), ("GITHUB_ENV", "TARGET_SHA")):
                  path = os.environ.get(key)
                  if path:
                      with open(path, "a", encoding="utf-8") as handle:
                          handle.write(f"{name}={canonical}\n")
              sys.stdout.write("B62_TARGET_SHA_INPUT_SHAPE=PASS\n")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          B62_TARGET_SHA_GUARD

      - name: Checkout PR exact head
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact dispatch SHA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.b62_target_sha.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact current main for dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${TARGET_SHA}"
          echo "R2_GATE_EXACT_MAIN=PASS"

      - name: Assert source contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/b62-workspace-r2-binding-gate.yml').read_text(encoding='utf-8')
          generator = Path('.github/scripts/b62_cloudflare_production_deploy_config.py').read_text(encoding='utf-8')
          assert 'PADIEM_WORKSPACE_FILES' in workflow
          assert 'r2_bucket' in workflow
          assert 'bucket_name' in workflow
          assert 'R2_GATE_EXACT_MAIN=PASS' in workflow
          assert 'R2_BINDING_READBACK=PASS' in workflow
          assert 'PRODUCTION_MUTATION=0' in workflow
          assert '"r2_bucket"' in generator
          import tomllib
          repo = tomllib.loads(Path('apps/padiem-chat/wrangler.toml').read_text())
          assert repo['r2_buckets'] == [{'binding': 'PADIEM_WORKSPACE_FILES', 'bucket_name': 'padiem-workspace-files'}]
          assert 'bucket_name' in generator
          print('B62_WORKSPACE_R2_GATE_SOURCE=PASS')
          print('PRODUCTION_MUTATION=0')
          PY

  cloudflare-readonly:
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read back private workspace R2 binding
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}"
          settings="${RUNNER_TEMP}/b62-r2-settings.json"
          curl -fsS "${auth[@]}" "${api}/settings" -o "${settings}"
          jq -e '.success == true and (.result.bindings | type == "array")' "${settings}" >/dev/null
          jq -e --arg name "${R2_BINDING}" '
            [.result.bindings[] | select(.name == $name)] as $b |
            ($b | length) == 1 and
            $b[0].type == "r2_bucket" and
            ($b[0].bucket_name | type == "string") and
            ($b[0].bucket_name | length) > 0
          ' "${settings}" >/dev/null
          jq -e '[.result.bindings[] | .name] | length == (unique | length)' "${settings}" >/dev/null
          echo "R2_BINDING_READBACK=PASS"
          echo "R2_BINDING_NAME=${R2_BINDING}"
          echo "R2_BUCKET_NAME_REDACTED=YES"
          echo "PRODUCTION_MUTATION=0"
