name: Cloudflare Pages cleanup verification 2026-08-16

on:
  push:
    branches:
      - ops/cloudflare-cleanup-20260816

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify cleanup and protected projects
        shell: python
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          import json, os, urllib.request

          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          if not token or not account:
              raise SystemExit("Cloudflare credential secret missing")

          base = f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects"

          def fetch(page=None):
              url = base if page is None else f"{base}?page={page}"
              req = urllib.request.Request(url)
              req.add_header("Authorization", f"Bearer {token}")
              req.add_header("Accept", "application/json")
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.load(resp)
              if not data.get("success"):
                  raise SystemExit("Cloudflare Pages API returned success=false")
              return data

          first = fetch()
          pages = [first]
          info = first.get("result_info") or {}
          for page in range(2, int(info.get("total_pages") or 1) + 1):
              pages.append(fetch(page))

          names = sorted({p.get("name") for d in pages for p in d.get("result", []) if p.get("name")})

          deleted = {
              "ai-revenue-final-b07",
              "ai-revenue-final-b08",
              "ai-revenue-final-b11",
              "ai-revenue-final-review-b01",
              "ai-revenue-final-review-b02",
              "ai-revenue-final-review-b04",
              "ai-revenue-final-review-b06",
              "ai-revenue-final-review-b07",
              "ai-revenue-final-review-b08",
              "ai-revenue-final-review-b11",
          }
          protected = {
              "ai-revenue-final-b09",
              "ai-revenue-final-review-b09",
              "ai-revenue-business-14-korean-ai-platform",
              "ai-revenue-final-portfolio",
              "ai-revenue-personal-edition",
              "ai-revenue-living-travel",
              "ai-revenue-living-learning",
              "ai-revenue-personal-video-archive",
              "ai-revenue-world-feed",
              "06-world-feed",
              "07-personal-meaning-map",
              "08-family-newspaper",
              "09-personalized-childrens-story",
              "10-fan-magazine",
              "11-language-learning-magazine",
              "12-creator-mini-media",
              "15-global-ai-newsroom",
              "ai-revenue-portfolio-console",
              "lovebud",
              "lovetree3",
              "cgbukku",
              "fmindex",
          }

          names_set = set(names)
          deleted_still_present = sorted(deleted & names_set)
          protected_missing = sorted(protected - names_set)

          print(f"POST_CLEANUP_PROJECT_COUNT={len(names)}")
          print("DELETED_STILL_PRESENT=" + json.dumps(deleted_still_present))
          print("PROTECTED_MISSING=" + json.dumps(protected_missing))

          if len(names) != 67:
              raise SystemExit(f"Expected 67 projects after cleanup, got {len(names)}")
          if deleted_still_present:
              raise SystemExit("Deleted projects still present")
          if protected_missing:
              raise SystemExit("Protected project missing")

          print("CLEANUP_VERIFICATION=PASS")
