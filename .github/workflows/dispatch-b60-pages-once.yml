name: Finalize B60 public Pages wiring once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-b60-pages-once.yml

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    name: Verify public B60 surface, wire portfolio, and self-clean
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify public B60 Pages surface
        shell: bash
        run: |
          set -euo pipefail
          url='https://ai-revenue-business-60-ai-api.pages.dev/'
          code="$(curl --silent --show-error --max-time 25 --output /tmp/b60-public.html --write-out '%{http_code}' "${url}")"
          test "${code}" = '200'
          grep -Eqi 'AI[[:space:]/-]*API|ACCESS CHANGES THE WORLD|LIVE ACCESS SIGNAL' /tmp/b60-public.html

      - name: Point Portfolio Console B60 to public Pages surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/portfolio-console/business-manifest.js')
          text = path.read_text(encoding='utf-8')
          old = 'su:"https://ai-revenue-portfolio-console.pages.dev/ai-api/"'
          new = 'su:"https://ai-revenue-business-60-ai-api.pages.dev/"'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one B60 private surface URL, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit final wiring
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/dispatch-b60-pages-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/portfolio-console/business-manifest.js
          git commit -m 'deploy(b60): point portfolio to public Cloudflare Pages'
          git push origin HEAD:main

      - name: Record final public wiring
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 658 --repo "${GITHUB_REPOSITORY}" --body $'B60_PUBLIC_WIRING_COMPLETE\n\nPUBLIC_URL=https://ai-revenue-business-60-ai-api.pages.dev/\nPUBLIC_HTTP=200\nBODY_MARKER=PASS\nPORTFOLIO_SURFACE_URL=UPDATED_TO_PUBLIC_PAGES\nONE_SHOT_WORKFLOW=REMOVED\nHOST=Cloudflare Pages\nACCESS=LOGIN_FREE'
