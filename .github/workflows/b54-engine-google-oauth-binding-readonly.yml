name: B54 Engine Drive Runtime Bindings Read-only Attestation

on:
  pull_request:
    paths:
      - ".github/workflows/b54-engine-google-oauth-binding-readonly.yml"
      - "apps/padiem-ai-engine/wrangler.toml"
      - ".github/scripts/b54_engine_served_version_guard.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/b54-engine-google-oauth-binding-readonly.yml"

permissions:
  contents: read

concurrency:
  group: b54-engine-drive-runtime-bindings-readonly-${{ github.ref }}
  cancel-in-progress: false

env:
  ENGINE_WORKER: padiem-ai-engine

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Engine Drive runtime bindings read-only contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          config = Path("apps/padiem-ai-engine/wrangler.toml").read_text(encoding="utf-8")
          expected_oauth = (
              '[[services]]\n'
              'binding = "CONTROL_PLANE_GOOGLE_OAUTH"\n'
              'service = "padiem-google-oauth-state"'
          )
          expected_grants = (
              '[[d1_databases]]\n'
              'binding = "ENGINE_CONNECTOR_GRANTS"\n'
              'database_name = "padiem-engine"\n'
              'database_id = "6b77ad02-bc27-488f-bb97-6325f6750cba"'
          )
          if expected_oauth not in config:
              raise SystemExit("canonical Engine Google OAuth Service Binding missing or drifted")
          if expected_grants not in config:
              raise SystemExit("canonical Engine connector grants D1 binding missing or drifted")

          workflow = Path(".github/workflows/b54-engine-google-oauth-binding-readonly.yml").read_text(encoding="utf-8")
          required = (
              "/workers/scripts/${ENGINE_WORKER}",
              "${base}/deployments",
              "${base}/versions/${active_version}",
              "b54_engine_served_version_guard.py resolve-active",
              "--require-drive-runtime-bindings",
              "ENGINE_CONNECTOR_GRANTS_SERVED_BINDING=PRESENT:d1",
              "CONTROL_PLANE_GOOGLE_OAUTH_SERVED_BINDING=PRESENT:service",
              "DRIVE_RUNTIME_BINDINGS_VALIDATED=YES",
              "RAW_VERSION_DETAIL_OUTPUT=0",
              "SECRET_VALUE_OUTPUT=0",
              "PRODUCTION_MUTATION=0",
          )
          for marker in required:
              if marker not in workflow:
                  raise SystemExit(f"missing read-only attestation marker: {marker}")

          print("ENGINE_DRIVE_RUNTIME_BINDINGS_SOURCE_CONTRACT=PASS")
          print("ENGINE_DEPLOY=0")
          print("D1_MUTATION=0")
          print("GOOGLE_PROVIDER_CALLS=0")
          print("OAUTH_CONNECT=0")
          print("PUBLIC_INGRESS_MUTATION=0")
          print("DRIVE_GRANT_SEED=0")
          print("PRODUCTION_MUTATION=0")
          PY

      - name: Require exact current main on push
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          echo "EXACT_CURRENT_MAIN=PASS"

  served-binding-readonly:
    needs: source-contract
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconfirm exact current main before live GETs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          echo "READONLY_EXACT_MAIN_SHA=PASS"

      - name: Resolve served Engine version and attest Drive runtime bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          auth=( -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" )
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${ENGINE_WORKER}"

          deployments="${RUNNER_TEMP}/engine-deployments.json"
          curl -fsS "${auth[@]}" "${base}/deployments" -o "${deployments}"
          resolve_out="$(python3 .github/scripts/b54_engine_served_version_guard.py resolve-active --deployments "${deployments}")"
          printf '%s\n' "${resolve_out}"
          active_version="$(printf '%s\n' "${resolve_out}" | sed -n 's/^ENGINE_ACTIVE_VERSION_ID=//p')"
          test -n "${active_version}"

          version_detail="${RUNNER_TEMP}/engine-version-detail.json"
          curl -fsS "${auth[@]}" "${base}/versions/${active_version}" -o "${version_detail}"

          verify_out="$(python3 .github/scripts/b54_engine_served_version_guard.py verify \
            --version-settings "${version_detail}" \
            --active-version "${active_version}" \
            --require-drive-runtime-bindings)"
          printf '%s\n' "${verify_out}"

          printf '%s\n' "${verify_out}" | grep -Fx 'ENGINE_CONNECTOR_GRANTS_SERVED_BINDING=PRESENT:d1'
          printf '%s\n' "${verify_out}" | grep -Fx 'CONTROL_PLANE_GOOGLE_OAUTH_SERVED_BINDING=PRESENT:service'
          printf '%s\n' "${verify_out}" | grep -Fx 'DRIVE_RUNTIME_BINDINGS_VALIDATED=YES'

          echo "ENGINE_DRIVE_RUNTIME_SERVED_BINDINGS=PRESENT_EXPECTED"
          echo "BINDING_NAME_TYPE_ID_SERVICE_ONLY=YES"
          echo "RAW_VERSION_DETAIL_OUTPUT=0"
          echo "SECRET_VALUE_OUTPUT=0"
          echo "ENGINE_DEPLOY=0"
          echo "D1_MUTATION=0"
          echo "GOOGLE_PROVIDER_CALLS=0"
          echo "OAUTH_CONNECT=0"
          echo "PUBLIC_INGRESS_MUTATION=0"
          echo "DRIVE_GRANT_SEED=0"
          echo "PRODUCTION_MUTATION=0"
