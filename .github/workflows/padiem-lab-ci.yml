name: Padiem Lab CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/padiem-lab/**'
      - 'apps/living-learning/pages-preview/**'
      - 'reference/business-06-world-feed-v1/**'
      - 'reference/business-07-personal-meaning-map-v1/**'
      - 'reference/business-08-family-newspaper-v1/**'
      - 'reference/business-09-personalized-childrens-story-v1/**'
      - 'reference/business-10-fan-magazine-v1/**'
      - 'reference/business-11-language-learning-magazine-v1/**'
      - 'reference/business-12-creator-mini-media-v1/**'
      - 'reference/business-15-global-ai-newsroom-v1/**'
      - 'reference/business-16-personal-sports-v1/**'
      - 'reference/business-17-local-shop-magazine-v1/**'
      - 'reference/business-18-personal-audio-channel-v1/**'
      - 'reference/business-19-personal-memory-book-v1/**'
      - 'reference/business-20-personal-memory-novel-v1/**'
      - 'reference/business-21-founder-strategy-letter-v1/**'
      - 'reference/business-22-personal-media-studio-v1/**'
      - 'reference/business-32-ai-skill-studio-ux/**'
      - 'reference/business-35-ai-media-education-dx-v3/**'
      - 'reference/business-60-ai-api-v1/**'
      - '.github/workflows/padiem-lab-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/padiem-lab/**'
      - 'apps/living-learning/pages-preview/**'
      - 'reference/business-06-world-feed-v1/**'
      - 'reference/business-07-personal-meaning-map-v1/**'
      - 'reference/business-08-family-newspaper-v1/**'
      - 'reference/business-09-personalized-childrens-story-v1/**'
      - 'reference/business-10-fan-magazine-v1/**'
      - 'reference/business-11-language-learning-magazine-v1/**'
      - 'reference/business-12-creator-mini-media-v1/**'
      - 'reference/business-15-global-ai-newsroom-v1/**'
      - 'reference/business-16-personal-sports-v1/**'
      - 'reference/business-17-local-shop-magazine-v1/**'
      - 'reference/business-18-personal-audio-channel-v1/**'
      - 'reference/business-19-personal-memory-book-v1/**'
      - 'reference/business-20-personal-memory-novel-v1/**'
      - 'reference/business-21-founder-strategy-letter-v1/**'
      - 'reference/business-22-personal-media-studio-v1/**'
      - 'reference/business-32-ai-skill-studio-ux/**'
      - 'reference/business-35-ai-media-education-dx-v3/**'
      - 'reference/business-60-ai-api-v1/**'
      - '.github/workflows/padiem-lab-ci.yml'

permissions:
  contents: read

concurrency:
  group: padiem-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PAGES_PROJECT: padiem-lab

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"

      - name: Run Lab and routed Business contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test apps/padiem-lab/*.test.cjs
          node --test reference/business-60-ai-api-v1/*.test.cjs reference/business-60-ai-api-v1/collector/*.test.cjs

      - name: Build aggregate public artifact
        shell: bash
        run: |
          set -euo pipefail
          node apps/padiem-lab/build-site.cjs
          test -f dist/padiem-lab/index.html
          test -f dist/padiem-lab/404.html
          registered_routes="$(node -e "console.log(require('./apps/padiem-lab/route-registry.cjs').map(r => r.route).join(' '))")"
          for route in ${registered_routes}; do
            test -f "dist/padiem-lab/${route}/index.html"
          done
          for route in b16 b18 b19 b20 b22; do
            test ! -e "dist/padiem-lab/${route}/app.js"
            test ! -e "dist/padiem-lab/${route}/docs"
          done
          test ! -e dist/padiem-lab/b60/operator
          test ! -e dist/padiem-lab/b60/operations
          test ! -e dist/padiem-lab/b60/collector
          test ! -e dist/padiem-lab/b60/reviews
          if find dist/padiem-lab -type f \( -name '*.test.cjs' -o -name '*.md' \) -print -quit | grep -q .; then
            echo 'Repository-only files entered the public aggregate artifact.' >&2
            exit 1
          fi

      - name: Install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pw"
          npm install --prefix "${RUNNER_TEMP}/pw" playwright@1.55.0 >/dev/null
          "${RUNNER_TEMP}/pw/node_modules/.bin/playwright" install --with-deps chromium >/dev/null
          echo "PW=${RUNNER_TEMP}/pw/node_modules/playwright" >> "${GITHUB_ENV}"

      - name: Aggregate browser QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist/padiem-lab >"${RUNNER_TEMP}/padiem-lab-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:4173 SCREENSHOT_DIR="${RUNNER_TEMP}" node apps/padiem-lab/browser-qa.cjs

      - name: Upload aggregate visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: padiem-lab-aggregate-visual-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/padiem-lab-*.png
          if-no-files-found: warn
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact main head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact main head and credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }

      - name: Rebuild exact aggregate artifact
        shell: bash
        run: |
          set -euo pipefail
          node apps/padiem-lab/build-site.cjs
          registered_routes="$(node -e "console.log(require('./apps/padiem-lab/route-registry.cjs').map(r => r.route).join(' '))")"
          for route in ${registered_routes}; do
            test -f "dist/padiem-lab/${route}/index.html"
          done
          for route in b16 b18 b19 b20 b22; do
            test ! -e "dist/padiem-lab/${route}/app.js"
            test ! -e "dist/padiem-lab/${route}/docs"
          done
          test ! -e dist/padiem-lab/b60/operator
          test ! -e dist/padiem-lab/b60/operations

      - name: Create or verify aggregate Pages project
        shell: bash
        run: |
          set -euo pipefail
          project_json="$(mktemp)"
          status="$(curl --silent --show-error --output "${project_json}" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}")"
          case "${status}" in
            200)
              jq -e --arg name "${PAGES_PROJECT}" '.success == true and .result.name == $name' "${project_json}" >/dev/null
              production_branch="$(jq -r '.result.production_branch // ""' "${project_json}")"
              test -z "${production_branch}" -o "${production_branch}" = main || {
                echo "Existing ${PAGES_PROJECT} project has unexpected production branch: ${production_branch}" >&2
                exit 1
              }
              echo "Verified existing ${PAGES_PROJECT} Pages project."
              ;;
            404)
              npx --yes wrangler@4 pages project create "${PAGES_PROJECT}" --production-branch main
              ;;
            *)
              echo "Cloudflare Pages project lookup failed with HTTP ${status}." >&2
              cat "${project_json}" >&2 || true
              exit 1
              ;;
          esac
          rm -f "${project_json}"

      - name: Deploy aggregate exact head
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist/padiem-lab \
            --project-name "${PAGES_PROJECT}" \
            --branch main \
            --commit-hash "${TARGET_SHA}" \
            --commit-message "Padiem Lab aggregate ${TARGET_SHA}" \
            --commit-dirty=false

      - name: Install live browser runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pw"
          npm install --prefix "${RUNNER_TEMP}/pw" playwright@1.55.0 >/dev/null
          "${RUNNER_TEMP}/pw/node_modules/.bin/playwright" install --with-deps chromium >/dev/null
          echo "PW=${RUNNER_TEMP}/pw/node_modules/playwright" >> "${GITHUB_ENV}"

      - name: Live aggregate route gate
        shell: bash
        run: |
          set -euo pipefail
          base="https://${PAGES_PROJECT}.pages.dev"
          route_paths="$(node -e "console.log(require('./apps/padiem-lab/route-registry.cjs').map(r => '/' + r.route + '/').join(' '))")"
          for path in / ${route_paths}; do
            ok=false
            for i in $(seq 1 18); do
              if curl -fsS "${base}${path}" >/dev/null; then ok=true; break; fi
              sleep 5
            done
            test "${ok}" = true || { echo "Live route failed: ${base}${path}" >&2; exit 1; }
          done

          operator_status="$(curl -sS -o /dev/null -w '%{http_code}' "${base}/b60/operator/editorial-intake/" || true)"
          test "${operator_status}" = 404 || {
            echo "Expected unpublished B60 operator route to return 404, got ${operator_status}." >&2
            exit 1
          }

          BASE_URL="${base}" QA_MODE=live node apps/padiem-lab/browser-qa.cjs