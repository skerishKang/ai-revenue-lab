name: Padiem Lab CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/padiem-lab/**'
      - 'reference/business-60-ai-api-v1/**'
      - '.github/workflows/padiem-lab-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/padiem-lab/**'
      - 'reference/business-60-ai-api-v1/**'
      - '.github/workflows/padiem-lab-ci.yml'

permissions:
  contents: read

concurrency:
  group: padiem-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PAGES_PROJECT: padiem-lab

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"

      - name: Run Lab and B60 contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test apps/padiem-lab/*.test.cjs
          node --test reference/business-60-ai-api-v1/*.test.cjs reference/business-60-ai-api-v1/collector/*.test.cjs

      - name: Build aggregate public artifact
        shell: bash
        run: |
          set -euo pipefail
          node apps/padiem-lab/build-site.cjs
          test -f dist/padiem-lab/index.html
          test -f dist/padiem-lab/b60/index.html
          test ! -e dist/padiem-lab/b60/operator
          test ! -e dist/padiem-lab/b60/operations
          test ! -e dist/padiem-lab/b60/collector
          test ! -e dist/padiem-lab/b60/reviews
          if find dist/padiem-lab/b60 -maxdepth 1 \( -name '*.test.cjs' -o -name '*.md' \) -print -quit | grep -q .; then
            echo 'Repository-only B60 files entered the public artifact.' >&2
            exit 1
          fi

      - name: Install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pw"
          npm install --prefix "${RUNNER_TEMP}/pw" playwright@1.55.0 >/dev/null
          "${RUNNER_TEMP}/pw/node_modules/.bin/playwright" install --with-deps chromium >/dev/null
          echo "PW=${RUNNER_TEMP}/pw/node_modules/playwright" >> "${GITHUB_ENV}"

      - name: Aggregate browser QA
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/padiem-lab-smoke.cjs" <<'NODE'
          const { chromium } = require(process.env.PW);

          function localFailure(url) {
            try {
              const parsed = new URL(url);
              return parsed.hostname === '127.0.0.1' || parsed.hostname === 'localhost';
            } catch (_) {
              return false;
            }
          }

          async function inspect(page, url, kind, viewportName) {
            const consoleErrors = [];
            const localFailures = [];
            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('requestfailed', request => {
              if (localFailure(request.url())) localFailures.push(request.url());
            });

            const response = await page.goto(url, { waitUntil: 'networkidle' });
            if (!response || response.status() !== 200) throw new Error(`${kind} HTTP ${response?.status()}`);

            let state;
            if (kind === 'root') {
              await page.waitForSelector('.business-card');
              state = await page.evaluate(() => ({
                title: document.title,
                brand: document.querySelector('.brand')?.textContent?.replace(/\s+/g, ' ').trim(),
                cards: document.querySelectorAll('.business-card').length,
                b60: document.body.textContent.includes('AI 무료 레이더'),
                storyMemory: document.body.textContent.includes('StoryMemory') || document.body.textContent.includes('스토리메모리'),
                internalOps: /프로젝트 현황|작업 중|백엔드|Pull Request|GitHub CI/.test(document.body.textContent),
                overflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 1
              }));
              if (!state.title.startsWith('Padiem Lab')) throw new Error(`bad Lab title ${JSON.stringify(state)}`);
              if (!state.brand.includes('PADIEM LAB')) throw new Error(`bad Lab brand ${JSON.stringify(state)}`);
              if (state.cards < 4 || !state.b60) throw new Error(`public work missing ${JSON.stringify(state)}`);
              if (state.storyMemory || state.internalOps) throw new Error(`private data exposed ${JSON.stringify(state)}`);
            } else {
              await page.waitForFunction(() => Boolean(window.B60_EDITORIAL_RADAR && window.B60_OPPORTUNITY_DETAIL));
              state = await page.evaluate(() => ({
                title: document.title,
                radar: Boolean(window.B60_EDITORIAL_RADAR),
                detail: Boolean(window.B60_OPPORTUNITY_DETAIL),
                masthead: document.body.textContent.includes('AI 무료 레이더'),
                operatorText: /PUBLICATION BOUNDARY|후보 생성만|GitHub 쓰기/.test(document.body.textContent),
                overflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 1
              }));
              if (!state.title.startsWith('AI FREE RADAR')) throw new Error(`bad B60 title ${JSON.stringify(state)}`);
              if (!state.radar || !state.detail || !state.masthead) throw new Error(`B60 runtime incomplete ${JSON.stringify(state)}`);
              if (state.operatorText) throw new Error(`operator surface leaked ${JSON.stringify(state)}`);
            }

            if (state.overflow) throw new Error(`${kind} horizontal overflow ${JSON.stringify(state)}`);
            if (consoleErrors.length) throw new Error(`${kind} console errors ${consoleErrors.join(' | ')}`);
            if (localFailures.length) throw new Error(`${kind} local request failures ${localFailures.join(' | ')}`);

            const file = `${process.env.RUNNER_TEMP}/padiem-lab-${kind}-${viewportName}.png`;
            await page.screenshot({ path: file, fullPage: true });
            console.log(`${kind}/${viewportName} PASS`);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const viewports = [
              { name: 'desktop', width: 1440, height: 1000 },
              { name: 'mobile', width: 390, height: 844 }
            ];
            for (const viewport of viewports) {
              const root = await browser.newPage({ viewport });
              await inspect(root, 'http://127.0.0.1:4173/', 'root', viewport.name);
              await root.close();

              const b60 = await browser.newPage({ viewport });
              await inspect(b60, 'http://127.0.0.1:4173/b60/', 'b60', viewport.name);
              await b60.close();
            }
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

          python3 -m http.server 4173 --directory dist/padiem-lab >"${RUNNER_TEMP}/padiem-lab-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node "${RUNNER_TEMP}/padiem-lab-smoke.cjs"

      - name: Upload aggregate visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: padiem-lab-aggregate-visual-${{ env.TARGET_SHA }}
          path: |
            ${{ runner.temp }}/padiem-lab-root-desktop.png
            ${{ runner.temp }}/padiem-lab-root-mobile.png
            ${{ runner.temp }}/padiem-lab-b60-desktop.png
            ${{ runner.temp }}/padiem-lab-b60-mobile.png
          if-no-files-found: warn
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact main head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact main head and credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }

      - name: Rebuild exact aggregate artifact
        shell: bash
        run: |
          set -euo pipefail
          node apps/padiem-lab/build-site.cjs
          test -f dist/padiem-lab/index.html
          test -f dist/padiem-lab/b60/index.html
          test ! -e dist/padiem-lab/b60/operator
          test ! -e dist/padiem-lab/b60/operations

      - name: Create or verify aggregate Pages project
        shell: bash
        run: |
          set -euo pipefail
          project_json="$(mktemp)"
          status="$(curl --silent --show-error --output "${project_json}" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}")"
          case "${status}" in
            200)
              jq -e --arg name "${PAGES_PROJECT}" '.success == true and .result.name == $name' "${project_json}" >/dev/null
              production_branch="$(jq -r '.result.production_branch // ""' "${project_json}")"
              test -z "${production_branch}" -o "${production_branch}" = main || {
                echo "Existing ${PAGES_PROJECT} project has unexpected production branch: ${production_branch}" >&2
                exit 1
              }
              echo "Verified existing ${PAGES_PROJECT} Pages project."
              ;;
            404)
              npx --yes wrangler@4 pages project create "${PAGES_PROJECT}" --production-branch main
              ;;
            *)
              echo "Cloudflare Pages project lookup failed with HTTP ${status}." >&2
              cat "${project_json}" >&2 || true
              exit 1
              ;;
          esac
          rm -f "${project_json}"

      - name: Deploy aggregate exact head
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist/padiem-lab \
            --project-name "${PAGES_PROJECT}" \
            --branch main \
            --commit-hash "${TARGET_SHA}" \
            --commit-message "Padiem Lab aggregate B60 canary ${TARGET_SHA}" \
            --commit-dirty=false

      - name: Install live browser runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pw"
          npm install --prefix "${RUNNER_TEMP}/pw" playwright@1.55.0 >/dev/null
          "${RUNNER_TEMP}/pw/node_modules/.bin/playwright" install --with-deps chromium >/dev/null
          echo "PW=${RUNNER_TEMP}/pw/node_modules/playwright" >> "${GITHUB_ENV}"

      - name: Live root and B60 gate
        shell: bash
        run: |
          set -euo pipefail
          base="https://${PAGES_PROJECT}.pages.dev"
          for path in / /b60/; do
            ok=false
            for i in $(seq 1 18); do
              if curl -fsS "${base}${path}" >/dev/null; then ok=true; break; fi
              sleep 5
            done
            test "${ok}" = true || { echo "Live route failed: ${base}${path}" >&2; exit 1; }
          done

          operator_status="$(curl -sS -o /dev/null -w '%{http_code}' "${base}/b60/operator/editorial-intake/" || true)"
          test "${operator_status}" = 404 || {
            echo "Expected unpublished B60 operator route to return 404, got ${operator_status}." >&2
            exit 1
          }

          cat > "${RUNNER_TEMP}/padiem-lab-live.cjs" <<'NODE'
          const { chromium } = require(process.env.PW);
          (async () => {
            const base = `https://${process.env.PAGES_PROJECT}.pages.dev`;
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const failed = [];
            page.on('requestfailed', request => {
              if (request.url().startsWith(base)) failed.push(request.url());
            });
            let response = await page.goto(`${base}/`, { waitUntil: 'networkidle' });
            if (!response || response.status() !== 200) throw new Error(`root HTTP ${response?.status()}`);
            await page.waitForSelector('.business-card');
            if (!await page.locator('body').innerText().then(text => text.includes('PADIEM') && text.includes('AI 무료 레이더'))) {
              throw new Error('Live Lab root content mismatch');
            }

            response = await page.goto(`${base}/b60/`, { waitUntil: 'networkidle' });
            if (!response || response.status() !== 200) throw new Error(`b60 HTTP ${response?.status()}`);
            await page.waitForFunction(() => Boolean(window.B60_EDITORIAL_RADAR && window.B60_OPPORTUNITY_DETAIL));
            const state = await page.evaluate(() => ({
              title: document.title,
              radar: Boolean(window.B60_EDITORIAL_RADAR),
              detail: Boolean(window.B60_OPPORTUNITY_DETAIL),
              masthead: document.body.textContent.includes('AI 무료 레이더')
            }));
            if (!state.title.startsWith('AI FREE RADAR') || !state.radar || !state.detail || !state.masthead) {
              throw new Error(`Live B60 mismatch ${JSON.stringify(state)}`);
            }
            if (failed.length) throw new Error(`Live local asset failures ${failed.join(' | ')}`);
            await browser.close();
            console.log(`LIVE PASS ${base}/ ${base}/b60/`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node "${RUNNER_TEMP}/padiem-lab-live.cjs"
