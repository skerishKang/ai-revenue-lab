name: Prepare B11 Complete 465
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/prepare-b11-complete-465.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'ops/prepare-b11-complete-465'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_MAIN: 1f54f55a127ca00aab92887b98e9324ac74a2061
      AUTHORITY: 282cd9757d820ba3c496a083c1bea72fd18f1045
      TARGET_BRANCH: feat/b11-language-learning-magazine-complete-465
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - name: Materialize approved B11 UI plus existing UX
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          git fetch origin "$AUTHORITY"
          git switch -c "$TARGET_BRANCH"
          git checkout "$AUTHORITY" -- reference/business-11-language-learning-magazine-v1
          test -f reference/business-11-language-learning-magazine-v1/index.html
          test -f reference/business-11-language-learning-magazine-v1/ux.html
          if git status --short | awk '{print $2}' | grep -Ev '^reference/business-11-language-learning-magazine-v1/' ; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reference/business-11-language-learning-magazine-v1
          git commit -m 'feat(b11): integrate approved language-magazine UI and learning UX'
          git push --force-with-lease origin "$TARGET_BRANCH"
          echo "B11_PREPARED_HEAD=$(git rev-parse HEAD)"
