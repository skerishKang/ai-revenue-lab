name: Validate B18 Complete 465
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'reference/business-18-personal-audio-channel-v1/**'
      - '.github/workflows/validate-b18-complete-465.yml'
permissions:
  contents: read
jobs:
  validate:
    if: github.event.pull_request.head.ref == 'feat/b18-personal-audio-channel-complete-465'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static contract
        shell: bash
        run: |
          set -euo pipefail
          node --check reference/business-18-personal-audio-channel-v1/app.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          base=Path('reference/business-18-personal-audio-channel-v1')
          for name in ('index.html','ux.html','guide.html'):
              HTMLParser().feed((base/name).read_text(encoding='utf-8'))
          index=(base/'index.html').read_text(encoding='utf-8')
          ux=(base/'ux.html').read_text(encoding='utf-8')
          guide=(base/'guide.html').read_text(encoding='utf-8')
          js=(base/'app.js').read_text(encoding='utf-8')
          for marker in ('나의 오디오 채널','data-state-target="today"','data-state-target="listening"','data-state-target="archive"','Synthetic reference'):
              assert marker in index, marker
          for marker in ('id="listen"','id="queue"','id="notes"','class="play"','data-save','id="noteList"','id="clear"','id="finish"','window.onpopstate'):
              assert marker in ux, marker
          for marker in ('GUIDE · 30 SECONDS','01 · EDITION','02 · QUEUE','03 · LISTEN','04 · MOMENTS','05 · NOTES','./ux.html#listen'):
              assert marker in guide, marker
          assert './guide.html' in js and 'dataset.firstUseGuide' in js
          for forbidden in ('fetch(', 'XMLHttpRequest', 'localStorage', 'document.cookie', 'serviceWorker'):
              assert forbidden not in ux+'\n'+guide+'\n'+js, forbidden
          for html in ('index.html','guide.html'):
              text=(base/html).read_text(encoding='utf-8')
              for rel in re.findall(r'(?:href|src)="(\./[^"?#]+)', text):
                  assert (base/rel[2:]).exists(), (html,rel)
          print('B18_STATIC_CONTRACT_PASS=1')
          PY
          git diff --check origin/main...HEAD -- 'reference/business-18-personal-audio-channel-v1/**'
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b18-browser && cd /tmp/b18-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.54.1
          npx playwright install chromium
      - name: Browser journey desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4176 --directory reference/business-18-personal-audio-channel-v1 >/tmp/b18-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4176/index.html >/dev/null && break; sleep 0.5; done
          cd /tmp/b18-browser
          node <<'JS'
          const { chromium } = require('playwright');
          async function assertNoOverflow(page,label){
            const diag=await page.evaluate(()=>{
              const de=document.documentElement, vw=de.clientWidth;
              const offenders=[...document.querySelectorAll('body *')].map((el)=>{
                const r=el.getBoundingClientRect();
                const cs=getComputedStyle(el);
                return {tag:el.tagName,id:el.id||'',cls:typeof el.className==='string'?el.className:'',left:+r.left.toFixed(1),right:+r.right.toFixed(1),width:+r.width.toFixed(1),display:cs.display,position:cs.position,overflowX:cs.overflowX,text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,70)};
              }).filter(x=>x.display!=='none'&&(x.right>vw+1||x.left<-1)).sort((a,b)=>Math.max(b.right-vw,-b.left)-Math.max(a.right-vw,-a.left)).slice(0,20);
              return {scrollWidth:de.scrollWidth,clientWidth:vw,offenders};
            });
            if(diag.scrollWidth>diag.clientWidth){
              console.error(`OVERFLOW_DIAG ${label} ${JSON.stringify(diag)}`);
              throw new Error(`${label}: overflow ${diag.scrollWidth}>${diag.clientWidth}`);
            }
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const vp of [{width:1440,height:1100,name:'desktop'},{width:390,height:844,name:'mobile'}]){
              const page=await browser.newPage({viewport:{width:vp.width,height:vp.height}});
              const errors=[];
              page.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`)});
              page.on('pageerror',e=>errors.push(`page:${e.message}`));
              await page.goto('http://127.0.0.1:4176/index.html',{waitUntil:'networkidle'});
              await page.locator('[data-first-use-guide]').waitFor({state:'visible'});
              await assertNoOverflow(page,`${vp.name}: root`);
              await page.locator('[data-first-use-guide]').click();
              await page.waitForURL(/guide\.html/);
              await assertNoOverflow(page,`${vp.name}: guide`);
              await page.getByRole('link',{name:'오늘 듣기 시작'}).click();
              await page.waitForURL(/ux\.html#listen/);
              await page.getByRole('button',{name:'재생 큐 열기'}).click();
              const plays=page.locator('.play');
              await plays.nth(0).click();
              let status=await page.locator('#queueStatus').textContent();
              if(!status || !status.includes('합성 재생 상태')) throw new Error(`${vp.name}: play state missing`);
              await plays.nth(0).click();
              status=await page.locator('#queueStatus').textContent();
              if(!status || !status.includes('멈췄습니다')) throw new Error(`${vp.name}: pause state missing`);
              const saves=page.locator('[data-save]');
              await saves.nth(0).click(); await saves.nth(1).click();
              await page.getByRole('button',{name:'남긴 장면 보기'}).click();
              const notes=page.locator('#noteList article');
              if(await notes.count()!==2) throw new Error(`${vp.name}: expected 2 saved moments`);
              await page.locator('#finish').click();
              status=await page.locator('#noteStatus').textContent();
              if(!status || !status.includes('오늘 듣기를 완료')) throw new Error(`${vp.name}: finish state missing`);
              await assertNoOverflow(page,`${vp.name}: ux`);
              if(errors.length) throw new Error(`${vp.name}: ${errors.join(' | ')}`);
              await page.close();
            }
            await browser.close();
            console.log('B18_BROWSER_JOURNEY_PASS=1');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
