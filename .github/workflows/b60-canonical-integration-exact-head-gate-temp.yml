name: B60 Canonical Integration Exact Head Gate Temp

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  canonical-exact-heads:
    if: github.event.pull_request.number == 678
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout gate carrier
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout PR 662 exact head
        uses: actions/checkout@v4
        with:
          ref: 696ec4fa04d27271426cd5103e9c775799471323
          path: gates/pr662
          persist-credentials: false
      - name: Verify PR 662 visual mirror
        shell: bash
        run: |
          set -euo pipefail
          cd gates/pr662
          test "$(git rev-parse HEAD)" = "696ec4fa04d27271426cd5103e9c775799471323"
          for f in gesture-touch.webp woman-alone.webp woman-close.webp woman-connection.webp woman-field.webp; do
            test -s "apps/portfolio-console/ai-api/assets/$f"
            cmp "apps/portfolio-console/ai-api/assets/$f" "reference/business-60-ai-api-v1/assets/$f"
          done
          cmp apps/portfolio-console/ai-api/cinematic-polish-final.css reference/business-60-ai-api-v1/cinematic-polish-final.css
          echo "PR662_EXACT_HEAD=PASS"

      - name: Checkout PR 666 exact head
        uses: actions/checkout@v4
        with:
          ref: 5cd08d678d75ba8e4588d4cc886d5b2aecf8c1c5
          path: gates/pr666
          persist-credentials: false
      - name: Verify PR 666 IA shell
        shell: bash
        run: |
          set -euo pipefail
          cd gates/pr666
          test "$(git rev-parse HEAD)" = "5cd08d678d75ba8e4588d4cc886d5b2aecf8c1c5"
          node --check apps/portfolio-console/ai-api/product-v9-ia.js
          node --check reference/business-60-ai-api-v1/product-v9-ia.js
          cmp apps/portfolio-console/ai-api/product-v9-ia.js reference/business-60-ai-api-v1/product-v9-ia.js
          cmp apps/portfolio-console/ai-api/product-v9-ia.css reference/business-60-ai-api-v1/product-v9-ia.css
          grep -E "Discover|Providers|Models|Connect|Watch" apps/portfolio-console/ai-api/product-v9-ia.js >/dev/null
          echo "PR666_EXACT_HEAD=PASS"

      - name: Checkout PR 668 exact head
        uses: actions/checkout@v4
        with:
          ref: a055dd25a2767bb98d5936a95754b8fa05036fbe
          path: gates/pr668
          persist-credentials: false
      - name: Verify PR 668 compare and handoff
        shell: bash
        run: |
          set -euo pipefail
          cd gates/pr668
          test "$(git rev-parse HEAD)" = "a055dd25a2767bb98d5936a95754b8fa05036fbe"
          node --check apps/portfolio-console/ai-api/product-v10-route-compare.js
          node --check apps/portfolio-console/ai-api/data/execution-handoff-v10.js
          cmp apps/portfolio-console/ai-api/product-v10-route-compare.js reference/business-60-ai-api-v1/product-v10-route-compare.js
          cmp apps/portfolio-console/ai-api/data/execution-handoff-v10.js reference/business-60-ai-api-v1/data/execution-handoff-v10.js
          grep -F "openrouter:openrouter/free" apps/portfolio-console/ai-api/data/execution-handoff-v10.js >/dev/null
          ! grep -Ei "type=['\"]password|api[-_ ]?key.*input" apps/portfolio-console/ai-api/index.html
          echo "PR668_EXACT_HEAD=PASS"

      - name: Checkout PR 670 exact head
        uses: actions/checkout@v4
        with:
          ref: 04dffb24fb1a0c9d4e61e4eb5c28fa26ada6e2f8
          path: gates/pr670
          persist-credentials: false
      - name: Verify PR 670 route detail
        shell: bash
        run: |
          set -euo pipefail
          cd gates/pr670
          test "$(git rev-parse HEAD)" = "04dffb24fb1a0c9d4e61e4eb5c28fa26ada6e2f8"
          node --check apps/portfolio-console/ai-api/product-v11-route-detail.js
          node --check reference/business-60-ai-api-v1/product-v11-route-detail.js
          cmp apps/portfolio-console/ai-api/product-v11-route-detail.js reference/business-60-ai-api-v1/product-v11-route-detail.js
          grep -F "route=" apps/portfolio-console/ai-api/product-v11-route-detail.js >/dev/null
          echo "PR670_EXACT_HEAD=PASS"

      - name: Checkout PR 672 exact head
        uses: actions/checkout@v4
        with:
          ref: e80aeb0204fad50faba4a35499bb73ab1589fdcd
          path: gates/pr672
          persist-credentials: false
      - name: Verify PR 672 Watch
        shell: bash
        run: |
          set -euo pipefail
          cd gates/pr672
          test "$(git rev-parse HEAD)" = "e80aeb0204fad50faba4a35499bb73ab1589fdcd"
          node --check apps/portfolio-console/ai-api/product-v12-watch.js
          node --check apps/portfolio-console/ai-api/product-v7.js
          cmp apps/portfolio-console/ai-api/product-v12-watch.js reference/business-60-ai-api-v1/product-v12-watch.js
          cmp apps/portfolio-console/ai-api/product-v12-watch.css reference/business-60-ai-api-v1/product-v12-watch.css
          grep -F '.ux4-saved-list,.ux4-changes,.ux4-empty{grid-column:1/-1}' apps/portfolio-console/ai-api/product-v12-watch.css >/dev/null
          grep -F 'b60.ai-api.watchlist.v1' apps/portfolio-console/ai-api/product-v12-watch.js >/dev/null
          echo "PR672_EXACT_HEAD=PASS"

      - name: Checkout PR 676 exact head
        uses: actions/checkout@v4
        with:
          ref: e4596a1d329cf3593695365bfdd30c775d5fdaa1
          path: gates/pr676
          persist-credentials: false
      - name: Verify PR 676 data truth
        shell: bash
        run: |
          set -euo pipefail
          cd gates/pr676
          test "$(git rev-parse HEAD)" = "e4596a1d329cf3593695365bfdd30c775d5fdaa1"
          cmp apps/portfolio-console/ai-api/data/access-signals.js reference/business-60-ai-api-v1/data/access-signals.js
          grep -F "Varies by routed provider" apps/portfolio-console/ai-api/data/access-signals.js >/dev/null
          ! grep -F '$1.40/M input · $4.40/M output' apps/portfolio-console/ai-api/data/access-signals.js
          node --check apps/portfolio-console/ai-api/data/access-signals.js
          echo "PR676_EXACT_HEAD=PASS"

      - name: Checkout PR 655 exact head
        uses: actions/checkout@v4
        with:
          ref: 2a9877db178155ddee7b4de62b04c88be4d0f508
          path: gates/pr655
          persist-credentials: false
      - name: Verify PR 655 collector truth boundary
        shell: bash
        run: |
          set -euo pipefail
          cd gates/pr655
          test "$(git rev-parse HEAD)" = "2a9877db178155ddee7b4de62b04c88be4d0f508"
          node --test reference/business-60-ai-api-v1/collector/intake-core.test.cjs
          grep -F "PARTIALLY_VERIFIED_OFFICIAL_WEB" reference/business-60-ai-api-v1/collector/intake-core.cjs >/dev/null
          grep -F "carriedForwardFields" reference/business-60-ai-api-v1/collector/intake-core.cjs >/dev/null
          ! grep -R "state:.*VERIFIED_OFFICIAL_WEB" reference/business-60-ai-api-v1/collector/run-intake.cjs reference/business-60-ai-api-v1/collector/source-manifest.cjs
          echo "PR655_EXACT_HEAD=PASS"

      - name: Summarize canonical gate
        shell: bash
        run: |
          echo "B60_CANONICAL_EXACT_HEAD_GATE=PASS"
          echo "PR662=696ec4fa04d27271426cd5103e9c775799471323"
          echo "PR666=5cd08d678d75ba8e4588d4cc886d5b2aecf8c1c5"
          echo "PR668=a055dd25a2767bb98d5936a95754b8fa05036fbe"
          echo "PR670=04dffb24fb1a0c9d4e61e4eb5c28fa26ada6e2f8"
          echo "PR672=e80aeb0204fad50faba4a35499bb73ab1589fdcd"
          echo "PR676=e4596a1d329cf3593695365bfdd30c775d5fdaa1"
          echo "PR655=2a9877db178155ddee7b4de62b04c88be4d0f508"
