name: Prepare B10 Complete 465
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/prepare-b10-complete-465.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'ops/deploy-b1-b2-guides-465'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_MAIN: d3f6ec2c5656ab2cad62e8b4e5dad0f6bd10f751
      AUTHORITY: ea40906005366b6356904ad10a93981d823b0f63
      TARGET_BRANCH: feat/b10-fan-magazine-complete-465
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - name: Materialize approved B10 UI plus existing UX
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          git fetch origin "$AUTHORITY"
          git switch -c "$TARGET_BRANCH"
          git checkout "$AUTHORITY" -- reference/business-10-fan-magazine-v1
          test -f reference/business-10-fan-magazine-v1/index.html
          test -f reference/business-10-fan-magazine-v1/ux.html
          if git status --short | awk '{print $2}' | grep -Ev '^reference/business-10-fan-magazine-v1/' ; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reference/business-10-fan-magazine-v1
          git commit -m 'feat(b10): integrate approved fan-magazine UI and browsing UX'
          git push --force-with-lease origin "$TARGET_BRANCH"
          echo "B10_PREPARED_HEAD=$(git rev-parse HEAD)"
