name: B19 Korean Memory Rhythm QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'reference/business-19-personal-memory-book-v1/**'
      - '.github/workflows/b19-korean-memory-rhythm-qa-20260811.yml'

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Diff hygiene
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          grep -q 'memory-binding-v2-type-polish.css' reference/business-19-personal-memory-book-v1/index.html
          grep -q 'memory-binding-v2-type-polish.css' reference/business-19-personal-memory-book-v1/guide.html
          test -z "$(git diff --name-only origin/main...HEAD -- reference/business-19-personal-memory-book-v1/ux.html)"
          if git diff origin/main...HEAD | grep -q 'OWNER_UI_APPROVED=true'; then exit 1; fi

      - name: Install browser QA
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Serve B19
        run: |
          python3 -m http.server 4173 --directory reference/business-19-personal-memory-book-v1 >/tmp/b19-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/b19-http.log; exit 1

      - name: Browser visual and reading journey QA
        run: |
          mkdir -p /tmp/b19-evidence
          cat > /tmp/b19-qa.cjs <<'NODE'
          const { chromium }=require(process.cwd()+'/node_modules/playwright');
          const fs=require('fs');
          const base='http://127.0.0.1:4173';
          const surfaces=[['root','/index.html'],['ux','/ux.html'],['guide','/guide.html']];
          const viewports={desktop:{width:1440,height:1100},mobile:{width:390,height:844}};
          const failures=[],results=[];
          (async()=>{const browser=await chromium.launch({headless:true});
            for(const [mode,viewport] of Object.entries(viewports)){const context=await browser.newContext({viewport,deviceScaleFactor:1});
              for(const [name,path] of surfaces){const page=await context.newPage(),errors=[];
                page.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`)}); page.on('pageerror',e=>errors.push(`page:${e.message}`)); page.on('requestfailed',r=>errors.push(`request:${r.url()} ${r.failure()?.errorText||''}`));
                const response=await page.goto(base+path,{waitUntil:'networkidle'}); if(!response||!response.ok())failures.push(`${mode}/${name}: bad HTTP`);
                const m=await page.evaluate(()=>{const root=document.documentElement,body=document.body,h1=document.querySelector('h1'),top=document.querySelector('.mb-topbar'); const hs=h1?getComputedStyle(h1):null,hr=h1?.getBoundingClientRect(),tr=top?.getBoundingClientRect(); const f=hs?parseFloat(hs.fontSize):NaN,l=hs?parseFloat(hs.lineHeight):NaN; const ch=document.querySelector('.mb-chapters')?.getBoundingClientRect(),pg=document.querySelector('.mb-page')?.getBoundingClientRect(),ev=document.querySelector('.mb-evidence')?.getBoundingClientRect(); return {viewportWidth:innerWidth,viewportHeight:innerHeight,overflowX:Math.max(root.scrollWidth,body.scrollWidth)-innerWidth,pageHeight:root.scrollHeight,h1Text:h1?.innerText||'',h1Font:f,h1Line:l,h1Ratio:Number.isFinite(f)&&f>0&&Number.isFinite(l)?l/f:null,h1Top:hr?.top??null,h1Bottom:hr?.bottom??null,topbarBottom:tr?.bottom??null,chaptersTop:ch?.top??null,pageTop:pg?.top??null,evidenceTop:ev?.top??null};});
                if(m.overflowX>1)failures.push(`${mode}/${name}: overflow ${m.overflowX}`); if(errors.length)failures.push(`${mode}/${name}: ${errors.join(' | ')}`); if(m.h1Top!==null&&m.topbarBottom!==null&&m.h1Top<m.topbarBottom-2)failures.push(`${mode}/${name}: H1 intersects chrome`); if(/[가-힣]/.test(m.h1Text)&&m.h1Ratio!==null&&m.h1Ratio<1.0)failures.push(`${mode}/${name}: Korean H1 ratio ${m.h1Ratio}`); if((name==='root'||name==='guide')&&m.h1Ratio!==null&&m.h1Ratio<1.03)failures.push(`${mode}/${name}: polished H1 ratio ${m.h1Ratio} < 1.03`); if(mode==='mobile'&&name==='ux'&&!(m.chaptersTop<m.pageTop&&m.pageTop<m.evidenceTop))failures.push('mobile/ux: route → page → evidence order mismatch');
                await page.screenshot({path:`/tmp/b19-evidence/${mode}-${name}.png`,fullPage:false}); await page.screenshot({path:`/tmp/b19-evidence/${mode}-${name}-full.png`,fullPage:true}); results.push({mode,name,metrics:m,errors}); await page.close();}
              const page=await context.newPage(); await page.goto(base+'/ux.html',{waitUntil:'networkidle'}); await page.locator('#cover [data-go="morning"]').click(); await page.locator('#morning [data-mark]').click(); await page.locator('#morning [data-go="table"]').click(); await page.locator('#table [data-mark]').click(); await page.locator('#table [data-go="sources"]').click(); if(!(await page.locator('#sources').evaluate(el=>el.classList.contains('active'))))failures.push(`${mode}/journey: provenance did not open`); await page.locator('#sources [data-go="marked"]').click(); if(await page.locator('#markedList .mb-marked-line').count()!==2)failures.push(`${mode}/journey: expected 2 marked lines`); await page.locator('#finish').click(); if(!((await page.locator('#finishStatus').innerText()).includes('2개 문장')))failures.push(`${mode}/journey: completion count mismatch`); await page.screenshot({path:`/tmp/b19-evidence/${mode}-ux-finished-full.png`,fullPage:true}); await page.reload({waitUntil:'networkidle'}); if(await page.locator('.mb-marked-line').count())failures.push(`${mode}/journey: reload retained marks`); await page.close(); await context.close();}
            await browser.close(); fs.writeFileSync('/tmp/b19-evidence/metrics.json',JSON.stringify({results,failures},null,2)); console.log(JSON.stringify({results,failures},null,2)); if(failures.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/b19-qa.cjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b19-korean-memory-rhythm-evidence-${{ github.run_attempt }}
          path: /tmp/b19-evidence
          if-no-files-found: error
          retention-days: 7
