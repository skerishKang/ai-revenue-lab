name: B62 Unified Browser QA

# One PR workflow run instead of 16; names of the original 16 QA jobs remain intact.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: b62-unified-browser-qa-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      accessibility_browser_qa: ${{ steps.classify.outputs.accessibility_browser_qa }}
      auth_history_browser_qa: ${{ steps.classify.outputs.auth_history_browser_qa }}
      browser_qa: ${{ steps.classify.outputs.browser_qa }}
      conversation_delete_browser_qa: ${{ steps.classify.outputs.conversation_delete_browser_qa }}
      conversation_export_browser_qa: ${{ steps.classify.outputs.conversation_export_browser_qa }}
      deep_research_browser_qa: ${{ steps.classify.outputs.deep_research_browser_qa }}
      document_browser_qa: ${{ steps.classify.outputs.document_browser_qa }}
      error_retry_browser_qa: ${{ steps.classify.outputs.error_retry_browser_qa }}
      image_browser_qa: ${{ steps.classify.outputs.image_browser_qa }}
      mobile_touch_target_qa: ${{ steps.classify.outputs.mobile_touch_target_qa }}
      project_delete_browser_qa: ${{ steps.classify.outputs.project_delete_browser_qa }}
      project_files_browser_qa: ${{ steps.classify.outputs.project_files_browser_qa }}
      projects_browser_qa: ${{ steps.classify.outputs.projects_browser_qa }}
      saved_outputs_browser_qa: ${{ steps.classify.outputs.saved_outputs_browser_qa }}
      structured_answer_browser_qa: ${{ steps.classify.outputs.structured_answer_browser_qa }}
      web_search_browser_qa: ${{ steps.classify.outputs.web_search_browser_qa }}
    steps:
      - uses: actions/checkout@v4
      - name: Regression check for QA path ownership
        run: python -m unittest discover -s .github/tests -p test_b62_browser_qa_unified.py -v
      - name: Select jobs for changed PR paths
        id: classify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/b62_browser_qa_path_plan.py

  accessibility-browser-qa:
    needs: plan
    if: ${{ needs.plan.outputs.accessibility_browser_qa == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PADIEM_CHAT_RUNTIME_MODE: mock
      PADIEM_CHAT_LIVE_ENABLED: 'false'
      PADIEM_CHAT_WEB_PROVIDER: off
      B62_A11Y_QA_BASE_URL: http://127.0.0.1:8773
      B62_A11Y_QA_OUT_DIR: ../../.tmp/b62-accessibility-browser-qa
    defaults:
      run:
        working-directory: apps/padiem-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: apps/padiem-chat/uv.lock
      - name: Resolve B62
        run: uv sync --extra dev
      # Full B62 unit regression already runs in b62-padiem-chat-ci.yml for
      # every apps/padiem-chat/** PR change. Keep this lane browser-specific.
      - name: Install pinned Playwright
        run: uv pip install 'playwright==1.55.0'
      # Share the pinned browser across independent B62 QA workflows.
      # Cache keys pin the Playwright release to prevent binary drift.
      - name: Cache pinned Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: b62-playwright-1.55.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install Chromium runtime
        run: uv run playwright install --with-deps chromium
      - name: Start mock Padiem Chat
        run: |
          set -euo pipefail
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8773 > /tmp/b62-a11y-browser-server.log 2>&1 &
          echo $! > /tmp/b62-a11y-browser-server.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8773/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/b62-a11y-browser-server.log
          exit 1
      - name: Desktop and mobile accessibility QA
        run: uv run python ../../.github/scripts/b62_accessibility_browser_qa.py
      - name: All-theme small-type accessibility QA
        run: uv run python ../../.github/scripts/b62_small_type_accessibility_qa.py
      - name: All-theme product confirmation dialog QA
        run: uv run python ../../.github/scripts/b62_confirm_dialog_browser_qa.py
      - name: Print QA report
        if: always()
        run: |
          if [ -f ../../.tmp/b62-accessibility-browser-qa/report.json ]; then
            cat ../../.tmp/b62-accessibility-browser-qa/report.json
          fi
          if [ -f ../../.tmp/b62-accessibility-browser-qa/small-type-accessibility-report.json ]; then
            cat ../../.tmp/b62-accessibility-browser-qa/small-type-accessibility-report.json
          fi
          if [ -f ../../.tmp/b62-accessibility-browser-qa/confirm-dialog-report.json ]; then
            cat ../../.tmp/b62-accessibility-browser-qa/confirm-dialog-report.json
          fi
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b62-accessibility-browser-qa
          path: .tmp/b62-accessibility-browser-qa
          if-no-files-found: error
          retention-days: 14

  auth-history-browser-qa:
    needs: plan
    if: ${{ needs.plan.outputs.auth_history_browser_qa == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/padiem-chat
    env:
      PADIEM_CHAT_RUNTIME_MODE: mock
      PADIEM_CHAT_LIVE_ENABLED: "false"
      PADIEM_CHAT_WEB_PROVIDER: off
      B62_AUTH_HISTORY_QA_BASE_URL: http://127.0.0.1:8769
      B62_AUTH_HISTORY_QA_OUT_DIR: ../../.tmp/b62-auth-history-browser-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: apps/padiem-chat/uv.lock
      - name: Resolve B62
        run: uv sync --extra dev
      - name: Run auth/history and account-session contract tests
        run: uv run pytest -q tests/test_auth_history.py tests/test_b62_1816_account_session_presentation.py
      - name: Install pinned Playwright
        run: uv pip install 'playwright==1.55.0'
      # Share the pinned browser across independent B62 QA workflows.
      # Cache keys pin the Playwright release to prevent binary drift.
      - name: Cache pinned Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: b62-playwright-1.55.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install Chromium runtime
        run: uv run playwright install --with-deps chromium
      - name: Start mock Padiem Chat
        run: |
          set -euo pipefail
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8769 > /tmp/b62-auth-history-server.log 2>&1 &
          echo $! > /tmp/b62-auth-history-server.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8769/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/b62-auth-history-server.log
          exit 1
      - name: Desktop and mobile authenticated history QA
        run: uv run python ../../.github/scripts/b62_auth_history_browser_qa.py
      - name: Account and session presentation QA
        run: |
          set -euo pipefail

          # Keep the fast, already-stable cases parallel. Expired-session probes
          # mutate the same account presentation surface through two browser
          # projection layers and are intentionally serialized so a failing
          # Chromium process cannot poison sibling Playwright pipes or hide the
          # primary diagnostic behind xargs/EPIPE noise.
          stable_cases_file="$(mktemp)"
          for theme in light dark cinematic padiem-home padiem-glass; do
            for viewport in desktop mobile; do
              for account_case in signed unavailable; do
                printf '%s %s %s\n' "$theme" "$viewport" "$account_case" >> "$stable_cases_file"
              done
            done
          done

          xargs -r -P 4 -n 3 bash -c '
            set -euo pipefail
            theme="$1"
            viewport="$2"
            account_case="$3"
            echo "RUN_ACCOUNT_SESSION_CASE=${theme}-${viewport}-${account_case}"
            timeout 30s uv run python ../../.github/scripts/b62_account_session_browser_qa.py \
              --theme "$theme" \
              --viewport "$viewport" \
              --case "$account_case"
          ' _ < "$stable_cases_file"

          for theme in light dark cinematic padiem-home padiem-glass; do
            for viewport in desktop mobile; do
              echo "RUN_ACCOUNT_SESSION_CASE=${theme}-${viewport}-expired"
              timeout 30s uv run python ../../.github/scripts/b62_account_session_browser_qa.py \
                --theme "$theme" \
                --viewport "$viewport" \
                --case expired
            done
          done

          timeout 30s uv run python ../../.github/scripts/b62_account_session_browser_qa.py \
            --theme light \
            --viewport desktop \
            --case english-expired
      - name: Print QA reports
        if: always()
        run: |
          if [ -f ../../.tmp/b62-auth-history-browser-qa/report.json ]; then
            cat ../../.tmp/b62-auth-history-browser-qa/report.json
          fi
          for report in ../../.tmp/b62-auth-history-browser-qa/account-session-*.json; do
            if [ -f "$report" ]; then
              echo "=== $report ==="
              cat "$report"
            fi
          done
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b62-auth-history-browser-qa
          path: .tmp/b62-auth-history-browser-qa
          if-no-files-found: error
          retention-days: 14

