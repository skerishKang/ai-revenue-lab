      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b62-structured-answer-browser-qa
          path: .tmp/b62-structured-answer-browser-qa
          if-no-files-found: error
          retention-days: 14

  web-search-browser-qa:
    needs: plan
    if: ${{ needs.plan.outputs.web_search_browser_qa == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/padiem-chat
    env:
      PADIEM_CHAT_RUNTIME_MODE: mock
      PADIEM_CHAT_LIVE_ENABLED: "false"
      PADIEM_CHAT_WEB_PROVIDER: mock
      B62_WEB_QA_BASE_URL: http://127.0.0.1:8766
      B62_WEB_QA_OUT_DIR: ../../.tmp/b62-web-search-browser-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: apps/padiem-chat/uv.lock
      - name: Resolve B62
        run: uv sync --extra dev
      - name: Install pinned Playwright
        run: uv pip install 'playwright==1.55.0'
      # Share the pinned browser across independent B62 QA workflows.
      # Cache keys pin the Playwright release to prevent binary drift.
      - name: Cache pinned Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: b62-playwright-1.55.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install Chromium runtime
        run: uv run playwright install --with-deps chromium
      - name: Start mock-web Padiem Chat
        run: |
          set -euo pipefail
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8766 > /tmp/b62-web-browser-server.log 2>&1 &
          echo $! > /tmp/b62-web-browser-server.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8766/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/b62-web-browser-server.log
          exit 1
      - name: Desktop and mobile mock web-search QA
        run: uv run python ../../.github/scripts/b62_web_search_browser_qa.py
      - name: Print QA report
        if: always()
        run: |
          if [ -f ../../.tmp/b62-web-search-browser-qa/report.json ]; then
            cat ../../.tmp/b62-web-search-browser-qa/report.json
          fi
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b62-web-search-browser-qa
          path: .tmp/b62-web-search-browser-qa
          if-no-files-found: error
          retention-days: 14
