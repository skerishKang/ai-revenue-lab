name: B60 UX667 Observer Fix Temp

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 668 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/b60-ux2-route-compare-handoff-667
          fetch-depth: 1
      - name: Narrow observer and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            apps/portfolio-console/ai-api/product-v10-route-compare.js \
            reference/business-60-ai-api-v1/product-v10-route-compare.js; do
            python3 - "$f" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          text = p.read_text()
          old = "observer.observe(grid, { childList: true, subtree: true });"
          new = "observer.observe(grid, { childList: true });"
          if old not in text:
              raise SystemExit(f"expected observer clause missing in {p}")
          p.write_text(text.replace(old, new, 1))
          PY
          done
          git rm .github/workflows/b60-ux667-observer-fix-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/portfolio-console/ai-api/product-v10-route-compare.js reference/business-60-ai-api-v1/product-v10-route-compare.js
          git commit -m "fix(b60): bound UX2 render observer"
          git push origin HEAD:feat/b60-ux2-route-compare-handoff-667
