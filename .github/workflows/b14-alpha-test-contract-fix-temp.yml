name: B14 Alpha test contract fix temporary

on:
  pull_request:
    paths:
      - '.github/workflows/b14-alpha-test-contract-fix-temp.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out B14 Alpha branch
        uses: actions/checkout@v4
        with:
          ref: feat/business-14-owner-tryable-alpha-1
          fetch-depth: 1

      - name: Align stale tests with dependency-free startup contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/korean-ai-platform/tests/test_alpha1.py')
          text = path.read_text(encoding='utf-8')

          old_network = '''        for f in glob.glob(os.path.join(test_dir, "test_*.py")):\n            if os.path.basename(f) == this_file:\n                continue  # self-references in this file's assertions are not network usage\n            with open(f, encoding="utf-8") as fh:\n                content = fh.read()\n            # No real network clients used at runtime in tests\n            assert "urllib.request.urlopen(" not in content, f"{f} uses urllib"\n            assert "requests.get(" not in content, f"{f} uses requests.get"\n            assert "httpx.Client(" not in content, f"{f} uses httpx.Client"\n            assert "http.client" not in content, f"{f} uses http.client"\n'''
          new_network = '''        for f in glob.glob(os.path.join(test_dir, "test_*.py")):\n            basename = os.path.basename(f)\n            if basename == this_file:\n                continue  # self-references in this file's assertions are not network usage\n            with open(f, encoding="utf-8") as fh:\n                content = fh.read()\n            if basename == "test_owner_startup_command.py":\n                # This regression intentionally probes the subprocess over loopback only.\n                # Keep the exception narrow so it can never become an upstream-network test.\n                assert "http://127.0.0.1:" in content\n                assert "https://" not in content\n                assert "openrouter.ai" not in content\n                assert "requests." not in content\n                assert "httpx." not in content\n                continue\n            # All other tests remain transport-mocked/network-free.\n            assert "urllib.request.urlopen(" not in content, f"{f} uses urllib"\n            assert "requests.get(" not in content, f"{f} uses requests.get"\n            assert "httpx.Client(" not in content, f"{f} uses httpx.Client"\n            assert "http.client" not in content, f"{f} uses http.client"\n'''
          if text.count(old_network) != 1:
              raise SystemExit(f'network guard block expected once, got {text.count(old_network)}')
          text = text.replace(old_network, new_network)

          old_command = '        assert "python3 -m uvicorn app.main:app --env-file .env --host 127.0.0.1 --port 8000" in text\n'
          new_command = '''        assert "python3 -m uvicorn app.main:app --host 127.0.0.1 --port 8000" in text\n        assert "python3 -m uvicorn app.main:app --env-file .env" not in text\n        assert "app.main` loads working-directory `.env`" in text\n'''
          if text.count(old_command) != 1:
              raise SystemExit(f'startup command assertion expected once, got {text.count(old_command)}')
          path.write_text(text.replace(old_command, new_command), encoding='utf-8')
          PY

          git rm .github/workflows/b14-alpha-test-contract-fix-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/korean-ai-platform/tests/test_alpha1.py
          git diff --cached --check
          git commit -m "test(B14): align Alpha startup and loopback contracts"
          git push origin HEAD:feat/business-14-owner-tryable-alpha-1
