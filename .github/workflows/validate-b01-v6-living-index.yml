name: Validate B01 V7 Collectible Glass

on:
  pull_request:
    paths:
      - 'apps/personal-edition/**'
      - '.github/workflows/validate-b01-v6-living-index.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-b01-v6-living-index-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  browser:
    name: Collectible Glass exact-head browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/personal-edition
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # #3989: swap the hosted Azure archive before the font and Playwright OS
      # dependency apt downloads so a slow mirror cannot consume the job timeout.
      - name: Select Ubuntu archive before font installation
        shell: bash
        run: bash ../../.github/scripts/b62_playwright_apt_mirror_3989.sh

      - name: Install Korean fonts and Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Resolve the installed Playwright version
        id: playwright-version
        shell: bash
        run: echo "version=$(python -m playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: playwright-browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the Python Playwright release this lane resolves
          # from its own lock, so a browser build can never be reused across releases.
          key: pw-chromium-py-${{ steps.playwright-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Chromium system libraries
        shell: bash
        run: python -m playwright install-deps chromium

      - name: Install Chromium browser
        if: steps.playwright-browser-cache.outputs.cache-hit != 'true'
        shell: bash
        run: python -m playwright install chromium

      - name: Run V7 Collectible Glass browser gate
        run: python -m pytest tests/test_ui_v6_living_index_613.py -q

      - name: Check changed-source whitespace
        working-directory: ${{ github.workspace }}
        run: git diff --check

      - name: Upload exact-head V7 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-v7-collectible-glass-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/b01-v7-collectible-glass/
          if-no-files-found: error
          retention-days: 7
