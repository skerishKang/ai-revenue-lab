name: Deploy Business 5 Neighbor Market to Cloudflare Pages

on:
  push:
    branches:
      - feat/business-05-static-demo-106
    paths:
      - reference/business-05-neighbor-market-v2/demo/**
      - .github/workflows/deploy-neighbor-market-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-neighbor-market-pages
  cancel-in-progress: true

env:
  PROJECT_NAME: ai-revenue-neighbor-market
  PAGES_DIRECTORY: reference/business-05-neighbor-market-v2/demo
  PRODUCTION_BRANCH: feat/business-05-static-demo-106

jobs:
  deploy:
    name: Create project and deploy static demo
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify deployment credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }

      - name: Create Cloudflare Pages project when missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          projects_json="$(npx --yes wrangler@4 pages project list --json)"
          if printf '%s' "$projects_json" | jq -e --arg name "$PROJECT_NAME" 'any(.[]; .name == $name)' >/dev/null; then
            echo "Cloudflare Pages project already exists: $PROJECT_NAME"
          else
            npx --yes wrangler@4 pages project create "$PROJECT_NAME" \
              --production-branch="$PRODUCTION_BRANCH"
          fi

      - name: Deploy Neighbor Market demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PAGES_DIRECTORY/index.html"
          npx --yes wrangler@4 pages deploy "$PAGES_DIRECTORY" \
            --project-name="$PROJECT_NAME" \
            --branch="$PRODUCTION_BRANCH" \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="deploy Business 5 Neighbor Market demo"

      - name: Verify public deployment
        shell: bash
        run: |
          set -euo pipefail
          url="https://${PROJECT_NAME}.pages.dev/"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location \
              --retry 2 --retry-delay 2 \
              --output /tmp/neighbor-market.html "$url"; then
              grep -q "우리단지 이웃가게" /tmp/neighbor-market.html
              echo "Verified $url"
              exit 0
            fi
            sleep 5
          done
          echo "Deployment could not be verified at $url" >&2
          exit 1
