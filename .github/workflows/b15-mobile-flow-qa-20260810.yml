name: B15 Mobile Verification Flow QA 20260810

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'reference/business-15-global-ai-newsroom-v1/**'
      - '.github/workflows/b15-mobile-flow-qa-20260810.yml'

permissions:
  contents: read

jobs:
  qa:
    if: github.event.pull_request.head.ref == 'fix/b15-mobile-claim-source-order-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Diff and static contract checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          test -f reference/business-15-global-ai-newsroom-v1/index.html
          test -f reference/business-15-global-ai-newsroom-v1/ux.html
          test -f reference/business-15-global-ai-newsroom-v1/guide.html
          grep -q 'CLAIM → SOURCES → COMPARE → BRIEF → REVIEW' reference/business-15-global-ai-newsroom-v1/styles/verification-desk-v2.css
          grep -q '\.vn-canvas{display:contents}' reference/business-15-global-ai-newsroom-v1/styles/verification-desk-v2-polish.css

      - name: Start exact branch static site
        shell: bash
        run: |
          set -euo pipefail
          cd reference/business-15-global-ai-newsroom-v1
          nohup python -m http.server 8150 --bind 127.0.0.1 >/tmp/b15-http.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8150/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/b15-http.log
          exit 1

      - name: Install browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p /tmp/b15-browser /tmp/b15-qa-evidence
          cd /tmp/b15-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium

      - name: Desktop and mobile browser QA
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/b15-browser
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs'), path = require('path');
          const base='http://127.0.0.1:8150';
          const cases=[
            {name:'desktop',width:1440,height:1100},
            {name:'mobile',width:390,height:844},
          ];
          const surfaces=[['root','/index.html'],['ux','/ux.html'],['guide','/guide.html']];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const results=[];
            for(const c of cases){
              for(const [name,route] of surfaces){
                const ctx=await browser.newContext({viewport:{width:c.width,height:c.height}});
                const p=await ctx.newPage();
                const consoleErrors=[],pageErrors=[],failed=[];
                p.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
                p.on('pageerror',e=>pageErrors.push(e.message));
                p.on('response',r=>{if(r.status()>=400) failed.push(`${r.status()} ${r.url()}`)});
                const resp=await p.goto(base+route,{waitUntil:'networkidle',timeout:45000});
                await p.evaluate(()=>document.fonts.ready); await p.waitForTimeout(300);
                const common=await p.evaluate(()=>({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,scrollHeight:document.documentElement.scrollHeight}));
                let flow=null;
                if(name==='ux'){
                  flow=await p.evaluate(()=>{
                    const rect=s=>{const r=document.querySelector(s).getBoundingClientRect();return{top:r.top,bottom:r.bottom,height:r.height}};
                    const canvas=document.querySelector('.vn-canvas');
                    return {
                      workDisplay:getComputedStyle(document.querySelector('.vn-work')).display,
                      canvasDisplay:getComputedStyle(canvas).display,
                      claimLabel:rect('.vn-canvas>.vn-label'),
                      claimTitle:rect('.vn-canvas>h1'),
                      claimCard:rect('.vn-canvas>.vn-claim-card'),
                      rail:rect('.vn-rail'),
                      compare:rect('.vn-canvas>.vn-compare'),
                      brief:rect('.vn-canvas>.vn-brief'),
                      inspector:rect('.vn-inspector')
                    };
                  });
                }
                const problems=[];
                if(!resp||resp.status()!==200) problems.push('status');
                if(common.overflow>1) problems.push(`overflow ${common.overflow}`);
                if(consoleErrors.length||pageErrors.length||failed.length) problems.push('runtime');
                if(name==='ux'&&c.name==='desktop'){
                  if(flow.workDisplay!=='grid') problems.push(`desktop work display ${flow.workDisplay}`);
                  if(flow.canvasDisplay==='contents') problems.push('desktop canvas unexpectedly contents');
                  if(Math.abs(flow.rail.top-flow.claimLabel.top)>90) problems.push('desktop three-column alignment shifted');
                }
                if(name==='ux'&&c.name==='mobile'){
                  if(flow.workDisplay!=='flex') problems.push(`mobile work display ${flow.workDisplay}`);
                  if(flow.canvasDisplay!=='contents') problems.push(`mobile canvas display ${flow.canvasDisplay}`);
                  if(!(flow.claimLabel.top<flow.claimTitle.top&&flow.claimTitle.top<flow.claimCard.top&&flow.claimCard.bottom<=flow.rail.top+2&&flow.rail.bottom<=flow.compare.top+2&&flow.compare.bottom<=flow.brief.top+2&&flow.brief.bottom<=flow.inspector.top+2)) problems.push('mobile numbered flow order incorrect');
                  if(flow.rail.top>844) problems.push(`sources pushed below first viewport ${flow.rail.top}`);
                }
                await p.screenshot({path:path.join('/tmp/b15-qa-evidence',`${c.name}-${name}.png`),fullPage:false});
                await p.screenshot({path:path.join('/tmp/b15-qa-evidence',`${c.name}-${name}-full.png`),fullPage:true});
                results.push({viewport:c.name,name,status:resp?resp.status():0,consoleErrors,pageErrors,failed,problems,...common,flow});
                await ctx.close();
              }
            }
            await browser.close();
            const bad=results.filter(r=>r.problems.length);
            fs.writeFileSync('/tmp/b15-qa-evidence/results.json',JSON.stringify({results,bad},null,2));
            console.log(JSON.stringify({count:results.length,bad,results},null,2));
            if(bad.length) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b15-mobile-flow-qa-${{ github.run_number }}
          path: /tmp/b15-qa-evidence
          if-no-files-found: error
          retention-days: 7
