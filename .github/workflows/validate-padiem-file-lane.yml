name: Validate COM2 File Lane
on:
  pull_request:
    paths:
      - 'apps/padiem-file-lane/**'
      # #6265 retroactive guard: the file lane declares the shared Core as a
      # file:// dependency in its pyproject, so any Core source change is a
      # file-lane surface change. The per-file entries below stay for their
      # contract comments; the glob covers every module the partial list
      # would miss.
      - 'packages/padiem-ai-core/**'
      - 'packages/padiem-ai-core/padiem_ai_core/document_normalization.py'
      - 'packages/padiem-ai-core/padiem_ai_core/pdf_markdown.py'
      - 'packages/padiem-ai-core/padiem_ai_core/document_semantics.py'
      - '.github/workflows/validate-padiem-file-lane.yml'
      - '.github/tests/test_ci_reverse_dependency_paths.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: file-lane-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/padiem-file-lane
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.5'
      - name: Install exact dependencies
        run: uv sync --frozen --group dev --extra windows
      - name: Offline upload, parser, ownership and startup contracts
        run: uv run --frozen pytest -q
      - name: Compile service
        run: uv run --frozen python -m compileall -q src
      # #6265: the reverse-dependency trigger contract — every app CI that
      # depends on a shared monorepo package triggers on that package's whole
      # source tree. Runs after the app suite; uses the plain interpreter so
      # it does not depend on the uv project environment.
      - name: Test the reverse-dependency trigger contract
        # The job default working-directory is the file-lane app; run the
        # contract from the repo root with -I so the bare runner needs no
        # importable package (the repo checkout is not a Python package).
        working-directory: ${{ github.workspace }}
        run: python -I .github/tests/test_ci_reverse_dependency_paths.py
