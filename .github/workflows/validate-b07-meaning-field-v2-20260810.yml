name: Validate B07 Meaning Field V2 20260810

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'reference/business-07-personal-meaning-map-v1/**'
      - '.github/workflows/validate-b07-meaning-field-v2-20260810.yml'

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'design/b07-personal-meaning-field-v2-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Static product contract
        shell: bash
        run: |
          set -euo pipefail
          node --check reference/business-07-personal-meaning-map-v1/scripts/meaning-field-v2.js
          python3 - <<'PY'
          from pathlib import Path
          base=Path('reference/business-07-personal-meaning-map-v1')
          root=(base/'index.html').read_text(encoding='utf-8')
          ux=(base/'ux.html').read_text(encoding='utf-8')
          guide=(base/'guide.html').read_text(encoding='utf-8')
          css=(base/'styles/meaning-field-v2.css').read_text(encoding='utf-8')
          js=(base/'scripts/meaning-field-v2.js').read_text(encoding='utf-8')
          for text in (root,ux,guide):
              assert 'meaning-field-v2.css' in text
              assert '.svg' not in text.lower()
              assert 'Phase 1 Visual Reference' not in text
              assert 'UI Only' not in text and 'UI_ONLY' not in text
          for marker in ('30초 사용법','의미 지도','직접 연결'):
              assert marker in root and marker in ux and marker in guide, marker
          for marker in ('MEMORY → SIGNAL → CONNECT → REVIEW → REFRAME','.pm-field-stage','.pm-workspace','.pm-guide-hero'):
              assert marker in css, marker
          assert 'data-meaning-node' in root and 'data-meaning-core' in root
          assert 'selected=new Set()' in ux
          assert 'replace' not in js.lower() or 'replacewith' not in js.lower()
          for forbidden in ('fetch(', 'XMLHttpRequest', 'localStorage', 'document.cookie', 'serviceWorker'):
              assert forbidden not in root+'\n'+ux+'\n'+guide+'\n'+js, forbidden
          print('B07_MEANING_FIELD_STATIC_PASS=1')
          PY
          git diff --check origin/main...HEAD -- 'reference/business-07-personal-meaning-map-v1/**'
      - name: Install Chromium and Korean fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p /tmp/b07-browser
          cd /tmp/b07-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.54.1
          npx playwright install chromium
      - name: Browser product journey and screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b07-evidence
          python3 -m http.server 4187 --directory reference/business-07-personal-meaning-map-v1 >/tmp/b07-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4187/index.html >/dev/null && break; sleep .5; done
          cd /tmp/b07-browser
          node <<'JS'
          const { chromium } = require('playwright');
          const path=require('path');
          const fs=require('fs');
          const out='/tmp/b07-evidence';
          async function assertClean(page,label){
            const d=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,svg:[...document.images].filter(i=>/\.svg(?:[?#]|$)/i.test(i.getAttribute('src')||'')).length,text:document.body.innerText}));
            if(d.sw>d.cw+1) throw new Error(`${label}: overflow ${d.sw}>${d.cw}`);
            if(d.svg) throw new Error(`${label}: SVG artwork still visible ${d.svg}`);
            if(/PHASE 1|UI ONLY|VISUAL REFERENCE/i.test(d.text)) throw new Error(`${label}: old reference chrome visible`);
            return d;
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const manifest={};
            for(const vp of [{name:'desktop',width:1440,height:1100},{name:'mobile',width:390,height:844}]){
              const root=await browser.newPage({viewport:{width:vp.width,height:vp.height}});const rootErr=[];root.on('console',m=>{if(m.type()==='error')rootErr.push(m.text())});root.on('pageerror',e=>rootErr.push(e.message));
              await root.goto('http://127.0.0.1:4187/index.html',{waitUntil:'networkidle'});
              await root.locator('[data-meaning-node]').first().waitFor({state:'visible'});
              const before=await root.locator('[data-meaning-core] strong').innerText();
              await root.locator('[data-meaning-node="person"]').click();
              const after=await root.locator('[data-meaning-core] strong').innerText();
              if(before===after || after!=='서윤') throw new Error(`${vp.name}: root node interaction failed`);
              manifest[`${vp.name}-root`]=await assertClean(root,`${vp.name}:root`);
              if(rootErr.length) throw new Error(`${vp.name}: root errors ${rootErr.join(' | ')}`);
              await root.screenshot({path:path.join(out,`b07-root-${vp.name}.png`),fullPage:true});await root.close();

              const guide=await browser.newPage({viewport:{width:vp.width,height:vp.height}});await guide.goto('http://127.0.0.1:4187/guide.html',{waitUntil:'networkidle'});const gt=await guide.locator('body').innerText();if(!gt.includes('GUIDE · 30 SECONDS')||!gt.includes('Meaning Field 시작하기'))throw new Error(`${vp.name}: guide markers missing`);manifest[`${vp.name}-guide`]=await assertClean(guide,`${vp.name}:guide`);await guide.screenshot({path:path.join(out,`b07-guide-${vp.name}.png`),fullPage:true});await guide.close();

              const ux=await browser.newPage({viewport:{width:vp.width,height:vp.height}});const uxErr=[];ux.on('console',m=>{if(m.type()==='error')uxErr.push(m.text())});ux.on('pageerror',e=>uxErr.push(e.message));await ux.goto('http://127.0.0.1:4187/ux.html',{waitUntil:'networkidle'});
              const memories=ux.locator('.pm-memory');await memories.nth(0).click();await memories.nth(3).click();if(await ux.locator('#connect').isDisabled())throw new Error(`${vp.name}: connect not enabled`);await ux.locator('#connect').click();if(!(await ux.locator('#summary').getAttribute('class')).includes('show'))throw new Error(`${vp.name}: summary not shown`);if(!(await ux.locator('#map').getAttribute('class')).includes('has-link'))throw new Error(`${vp.name}: connection visualization missing`);await ux.locator('#undo').click();if((await ux.locator('#summary').getAttribute('class')).includes('show'))throw new Error(`${vp.name}: undo failed`);await ux.locator('#reset').click();if((await memories.nth(0).getAttribute('aria-pressed'))!=='false')throw new Error(`${vp.name}: reset failed`);manifest[`${vp.name}-ux`]=await assertClean(ux,`${vp.name}:ux`);if(uxErr.length)throw new Error(`${vp.name}: ux errors ${uxErr.join(' | ')}`);await ux.screenshot({path:path.join(out,`b07-ux-${vp.name}.png`),fullPage:true});await ux.close();
            }
            fs.writeFileSync(path.join(out,'manifest.json'),JSON.stringify(manifest,null,2));await browser.close();console.log('B07_MEANING_FIELD_BROWSER_PASS=1');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b07-meaning-field-v2-20260810
          path: /tmp/b07-evidence
          retention-days: 7
          if-no-files-found: warn
