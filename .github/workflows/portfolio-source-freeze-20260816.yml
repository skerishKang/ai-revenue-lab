name: Freeze corrected portfolio preview source 2026-08-16

on:
  push:
    branches:
      - portfolio/first-complete-20260816
    paths:
      - .github/workflows/portfolio-source-freeze-20260816.yml

permissions:
  contents: write

jobs:
  freeze-deploy-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_DIR: portfolio/first-complete
      PUBLIC_URL: https://ai-revenue-final-portfolio.pages.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio/first-complete-20260816
          fetch-depth: 1

      - name: Install Korean fonts and Chromium
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          fc-cache -f >/dev/null
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium >/dev/null

      - name: Capture fixed previews and DOM audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE}/${SOURCE_DIR}/previews"
          mkdir -p "${GITHUB_WORKSPACE}/${SOURCE_DIR}/previews"
          cat >/tmp/pw/capture.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'fs';
          import path from 'path';
          const root=path.join(process.env.GITHUB_WORKSPACE,'portfolio/first-complete');
          const out=path.join(root,'previews');
          const targets={
            b01:'https://ai-revenue-personal-edition.pages.dev',
            b02:'https://ai-revenue-living-travel.pages.dev',
            b04:'https://ai-revenue-living-learning.pages.dev',
            b05:'https://danjion.pages.dev',
            b06:'https://06-world-feed.pages.dev',
            b07:'https://07-personal-meaning-map.pages.dev',
            b08:'https://08-family-newspaper.pages.dev',
            b09:'https://09-personalized-childrens-story.pages.dev',
            b10:'https://10-fan-magazine.pages.dev',
            b11:'https://11-language-learning-magazine.pages.dev',
            b12:'https://12-creator-mini-media.pages.dev',
            b13:'https://ai-revenue-personal-video-archive.pages.dev',
            b15:'https://15-global-ai-newsroom.pages.dev'
          };
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1440,height:900},locale:'ko-KR'});
          const result={};
          for(const [id,url] of Object.entries(targets)){
            const p=await ctx.newPage();
            await p.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForTimeout(1800);
            result[id]=await p.evaluate(()=>{
              const rect=el=>{const r=el.getBoundingClientRect();return {w:Math.round(r.width),h:Math.round(r.height)}};
              const svgs=[...document.querySelectorAll('svg')];
              const svgImgs=[...document.images].filter(i=>/\.svg(?:[?#]|$)|^data:image\/svg/i.test(i.currentSrc||i.src||''));
              const rasters=[...document.images].filter(i=>/\.(?:png|jpe?g|webp|avif|gif)(?:[?#]|$)|^data:image\/(?:png|jpe?g|webp|avif|gif)/i.test(i.currentSrc||i.src||''));
              const bgSvg=[...document.querySelectorAll('body *')].filter(el=>/\.svg|data:image\/svg/i.test(getComputedStyle(el).backgroundImage||''));
              const largeSvgs=svgs.map((el,idx)=>({idx,...rect(el),aria:el.getAttribute('aria-label')||'',title:el.querySelector('title')?.textContent?.trim()?.slice(0,100)||''})).filter(v=>v.w>=180&&v.h>=100);
              const largeSvgImgs=svgImgs.map((el,idx)=>({idx,...rect(el),alt:el.alt||'',src:(el.currentSrc||el.src||'').slice(0,180)})).filter(v=>v.w>=180&&v.h>=100);
              const largeRasters=rasters.map((el,idx)=>({idx,...rect(el),alt:el.alt||'',src:(el.currentSrc||el.src||'').slice(0,180)})).filter(v=>v.w>=180&&v.h>=100);
              const text=document.body.innerText||'';
              return {
                title:document.title,
                svg_count:svgs.length,
                large_svg_count:largeSvgs.length,
                svg_img_count:svgImgs.length,
                large_svg_img_count:largeSvgImgs.length,
                bg_svg_count:bgSvg.length,
                canvas_count:document.querySelectorAll('canvas').length,
                raster_img_count:rasters.length,
                large_raster_img_count:largeRasters.length,
                korean_text_chars:(text.match(/[가-힣]/g)||[]).length,
                replacement_chars:(text.match(/�/g)||[]).length,
                large_svgs:largeSvgs.slice(0,20),
                large_svg_imgs:largeSvgImgs.slice(0,20),
                large_raster_imgs:largeRasters.slice(0,20)
              };
            });
            result[id].url=url;
            if(id!=='b09') await p.screenshot({path:path.join(out,`${id}.jpg`),type:'jpeg',quality:86,fullPage:false});
            await p.close();
          }
          await browser.close();
          fs.writeFileSync(path.join(root,'LIVE_SURFACE_AUDIT.json'),JSON.stringify(result,null,2));
          NODE
          cd /tmp/pw
          node capture.mjs

      - name: Patch first-complete source and generate audit report
        shell: python
        run: |
          from pathlib import Path
          import json,re
          root=Path('portfolio/first-complete')
          html=root/'index.html'
          text=html.read_text(encoding='utf-8')
          # Remove an older committed remediation script if rerun manually.
          text=re.sub(r'\n?<script data-source-frozen-previews="20260816">.*?</script>','',text,flags=re.S)
          mapping={k:f'previews/{k}.jpg' for k in ['b01','b02','b04','b05','b06','b07','b08','b10','b11','b12','b13','b15']}
          patch=f'''<script data-source-frozen-previews="20260816">
          (()=>{{
            const shots={json.dumps(mapping,separators=(',',':'))};
            for(const [id,src] of Object.entries(shots)){{
              const article=document.getElementById(id);if(!article)continue;
              const viewport=article.querySelector('.preview .viewport');if(!viewport)continue;
              const img=document.createElement('img');img.src=src;img.alt=id.toUpperCase()+' product preview';
              img.style.cssText='width:100%;height:100%;display:block;object-fit:cover;object-position:top;background:#0e0e0e';
              viewport.replaceChildren(img);article.querySelector('.preview-loading')?.remove();
            }}
            const b09=document.getElementById('b09');
            if(b09){{const viewport=b09.querySelector('.preview .viewport');if(viewport)viewport.innerHTML=`<div style="height:100%;display:flex;flex-direction:column;justify-content:center;padding:34px;background:radial-gradient(circle at 72% 28%,rgba(235,116,73,.16),transparent 34%),#0d0d0d;color:#f4f0e8;font-family:inherit"><div style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#e88b69;margin-bottom:14px">B09 · INTEGRATION BLOCKER</div><div style="font-size:28px;line-height:1.05;font-weight:650;max-width:520px">최신 clean-master 방향은 승인됐지만,<br>public Pages는 최종 화면이 아닙니다.</div><div style="font-size:13px;line-height:1.65;color:#aaa;margin-top:16px;max-width:560px">기존 벡터/구형 story surface를 포트폴리오 대표 이미지로 사용하지 않습니다. clean-master PNG byte integration 완료 후 실제 최종 화면으로 교체합니다.</div></div>`;b09.querySelector('.preview-loading')?.remove();}}
          }})();
          </script>'''
          text=text.replace('</body>',patch+'\n</body>')
          html.write_text(text,encoding='utf-8')

          audit=json.loads((root/'LIVE_SURFACE_AUDIT.json').read_text(encoding='utf-8'))
          names={'b01':'Personal Edition','b02':'Living Travel','b04':'Living Learning','b05':'DanjiOn','b06':'World Feed','b07':'Personal Meaning Map','b08':'Family Newspaper','b09':'Personalized Children’s Story','b10':'Fan Magazine','b11':'Language Learning Magazine','b12':'Creator Mini-Media','b13':'Personal Video Archive','b15':'Global AI Newsroom'}
          rows=[]
          for bid in sorted(audit):
              d=audit[bid]
              signal=d['large_svg_count']+d['large_svg_img_count']+d['bg_svg_count']
              if bid=='b09': verdict='BLOCKED PUBLIC SURFACE — excluded from portfolio preview'
              elif bid=='b07': verdict='FUNCTIONAL VECTOR ALLOWED — semantic geometry is product evidence'
              elif signal==0: verdict='NO LARGE SVG SIGNAL'
              elif d['large_raster_img_count']>0: verdict='MIXED SVG + RASTER — SVG presence alone is not a Material Authority failure'
              else: verdict='VECTOR-DOMINANT SIGNAL — visual/authority review required'
              rows.append((bid.upper(),names[bid],d['svg_count'],d['large_svg_count'],d['svg_img_count'],d['large_svg_img_count'],d['bg_svg_count'],d['canvas_count'],d['raster_img_count'],d['large_raster_img_count'],d['korean_text_chars'],d['replacement_chars'],verdict))
          md=['# Portfolio Public Surface Audit — 2026-08-16','',
              'This audit was generated from fresh Chromium loads of the public product surfaces after installing `fonts-noto-cjk` on the capture runner.','',
              'Important: SVG presence is not itself a failure. Utility icons and functional visualizations are allowed. Material Authority fails only when a real subject such as a person, place, artwork, video subject, or product is being substituted by vector/CSS illustration.','',
              '|Business|Surface|SVG|Large SVG|SVG img|Large SVG img|CSS SVG bg|Canvas|Raster img|Large raster|Korean chars|Replacement chars|Machine triage|',
              '|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---|']
          for r in rows: md.append('|'+ '|'.join(map(str,r)) +'|')
          md += ['', '## Authority interpretation','',
                 '- **B07**: functional semantic geometry is explicitly allowed by the portfolio Material Authority rule; SVG/geometry here is not treated as subject substitution.','- **B09**: the current public Pages surface is pre-clean-master/blocker evidence and is deliberately excluded from the portfolio preview. The portfolio shows an integration-blocker panel until clean-master PNG byte integration is complete.','- A `MIXED SVG + RASTER` row is not automatically a failure. It is a DOM signal for human semantic review. Existing PASS/FREEZE products are not reopened solely because an SVG icon, chart, mask, logo, or functional diagram exists.','- Korean `□□` seen in the prior portfolio screenshots originated in the Linux screenshot capture environment. The frozen preview assets in `previews/` were recaptured after installing Noto CJK fonts.','']
          (root/'PREVIEW_AUDIT_20260816.md').write_text('\n'.join(md),encoding='utf-8')
          print('SOURCE_PATCH_AND_AUDIT_REPORT=PASS')

      - name: Commit reproducible first-complete source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/first-complete/index.html portfolio/first-complete/previews portfolio/first-complete/LIVE_SURFACE_AUDIT.json portfolio/first-complete/PREVIEW_AUDIT_20260816.md
          git commit -m "portfolio: freeze corrected product previews and SVG audit"
          git push origin HEAD:portfolio/first-complete-20260816

      - name: Deploy frozen first-complete source
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy "${SOURCE_DIR}" \
            --project-name ai-revenue-final-portfolio \
            --branch main \
            --commit-message "Frozen first-complete portfolio previews and SVG audit" \
            --commit-dirty=false

      - name: Verify source-frozen production and screenshots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import time,urllib.request
          u='https://ai-revenue-final-portfolio.pages.dev/'
          for _ in range(30):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'portfolio-final-qa/1.0'}),timeout=15) as r:t=r.read().decode('utf-8','replace')
                  if 'data-source-frozen-previews="20260816"' in t and 'previews/b13.jpg' in t and 'B09 · INTEGRATION BLOCKER' in t: break
              except Exception: pass
              time.sleep(2)
          else: raise SystemExit('frozen source not visible in production')
          print('FROZEN_PRODUCTION_QA=PASS')
          PY
          cd /tmp/pw
          npx playwright screenshot --browser=chromium --viewport-size="1440,1100" --full-page "${PUBLIC_URL}" "${GITHUB_WORKSPACE}/portfolio-frozen-desktop.png"
          npx playwright screenshot --browser=chromium --viewport-size="390,844" --full-page "${PUBLIC_URL}" "${GITHUB_WORKSPACE}/portfolio-frozen-mobile.png"

      - name: Upload frozen QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-source-freeze-20260816
          path: |
            portfolio-frozen-desktop.png
            portfolio-frozen-mobile.png
            portfolio/first-complete/PREVIEW_AUDIT_20260816.md
            portfolio/first-complete/LIVE_SURFACE_AUDIT.json
          if-no-files-found: error

      - name: Remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin portfolio/first-complete-20260816
          git reset --hard origin/portfolio/first-complete-20260816
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/portfolio-source-freeze-20260816.yml
          git commit -m "portfolio: remove one-time source-freeze workflow"
          git push origin HEAD:portfolio/first-complete-20260816
