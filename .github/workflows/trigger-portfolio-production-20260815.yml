name: Retry Portfolio canonical production 2026-08-15

on:
  push:
    branches:
      - agent/trigger-portfolio-production-20260815
    paths:
      - .github/workflows/trigger-portfolio-production-20260815.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: ai-revenue-portfolio-console
      EXPECTED_MAIN_SHA: 8df3ace6dbfb58e121bcc39070f38ba40ee251be
    steps:
      - name: Verify exact GitHub main source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          persist-credentials: false

      - name: Validate reviewed link source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          grep -Fq 'ai-revenue-final-b07' apps/portfolio-console/review-surfaces-396.js
          grep -Fq 'ai-revenue-final-b08' apps/portfolio-console/review-surfaces-396.js
          grep -Fq 'ai-revenue-final-b09' apps/portfolio-console/review-surfaces-396.js
          grep -Fq 'ai-revenue-final-b11' apps/portfolio-console/review-surfaces-396.js

      - name: Read canonical production deployment
        id: canonical
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}" \
            -o /tmp/project.json
          id="$(jq -r '.result.canonical_deployment.id' /tmp/project.json)"
          env="$(jq -r '.result.canonical_deployment.environment' /tmp/project.json)"
          commit="$(jq -r '.result.canonical_deployment.deployment_trigger.metadata.commit_hash // empty' /tmp/project.json)"
          test -n "$id"
          test "$env" = "production"
          test "$commit" = "$EXPECTED_MAIN_SHA"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Retrying canonical production deployment $id at $commit"

      - name: Retry canonical production deployment
        id: retry
        shell: bash
        run: |
          set -euo pipefail
          canonical_id="${{ steps.canonical.outputs.id }}"
          status="$(curl --silent --show-error --output /tmp/retry.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments/${canonical_id}/retry")"
          echo "HTTP=$status"
          cat /tmp/retry.json | jq '{success, errors, messages, result:(.result | if . == null then null else {id,url,environment,deployment_trigger,latest_stage} end)}'
          test "$status" = "200"
          test "$(jq -r '.success' /tmp/retry.json)" = "true"
          id="$(jq -r '.result.id' /tmp/retry.json)"
          test -n "$id"
          test "$id" != "null"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Wait for retried production deployment
        shell: bash
        run: |
          set -euo pipefail
          id="${{ steps.retry.outputs.id }}"
          ok=0
          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments/${id}" \
              -o /tmp/status.json
            environment="$(jq -r '.result.environment' /tmp/status.json)"
            stage="$(jq -r '.result.latest_stage.status' /tmp/status.json)"
            commit="$(jq -r '.result.deployment_trigger.metadata.commit_hash // empty' /tmp/status.json)"
            branch="$(jq -r '.result.deployment_trigger.metadata.branch // empty' /tmp/status.json)"
            echo "attempt=$attempt environment=$environment stage=$stage branch=$branch commit=$commit"
            if [ "$stage" = "success" ]; then
              test "$environment" = "production"
              test "$branch" = "main"
              test "$commit" = "$EXPECTED_MAIN_SHA"
              ok=1
              break
            fi
            if [ "$stage" = "failure" ] || [ "$stage" = "canceled" ]; then
              jq '{success,result:{environment,deployment_trigger,latest_stage,stages,skip_reason}}' /tmp/status.json
              exit 1
            fi
            sleep 5
          done
          test "$ok" = "1"

      - name: Verify canonical Portfolio alias
        shell: bash
        run: |
          set -euo pipefail
          url="https://${PROJECT_NAME}.pages.dev/review-surfaces-396.js?retry=20260815"
          ok=0
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 "$url" -o /tmp/live.js; then
              if grep -Fq 'ai-revenue-final-b07' /tmp/live.js \
                && grep -Fq 'ai-revenue-final-b08' /tmp/live.js \
                && grep -Fq 'ai-revenue-final-b09' /tmp/live.js \
                && grep -Fq 'ai-revenue-final-b11' /tmp/live.js; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" = "1"
          echo "Canonical Portfolio alias updated: https://${PROJECT_NAME}.pages.dev/" >> "$GITHUB_STEP_SUMMARY"
