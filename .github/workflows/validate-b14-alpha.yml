name: Validate B14 Alpha

on:
  pull_request:
    paths:
      - 'apps/korean-ai-platform/**'
      # B14 is the final execution authority for product-tier routes: a tier declared in the
      # shared contract but absent from (or retired in) the B14 catalog is a live routing
      # failure, and only this suite catches it. Named exactly, not the whole control-plane
      # package, so the heaviest B14 gate still does not run on unrelated edits.
      - 'packages/padiem-control-plane/padiem_control_plane/product_tier_routes.py'
      - '.github/scripts/b14_model_registration_ci_plan.py'
      - '.github/workflows/validate-b14-alpha.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-b14-alpha-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Exact-head gate: product tests remain network-free except the documented
# localhost-only startup regression, which never reaches an upstream provider.
jobs:
  registry-ci-plan:
    name: B14 changeset classifier (fail-closed)
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.classify.outputs.lane }}
    steps:
      - uses: actions/checkout@v4
      - name: Test CI lane fail-closed rules
        run: python -m unittest discover -s .github/tests -p test_b14_model_registration_ci_plan.py -q
      - name: Classify exact PR changes
        id: classify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/b14_model_registration_ci_plan.py

  alpha-model-registry-contract:
    name: B14 fast model registration contract
    needs: registry-ci-plan
    if: ${{ needs.registry-ci-plan.outputs.lane == 'model_registration_only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/korean-ai-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: apps/korean-ai-platform/uv.lock
      - name: Exact locked dependencies
        run: uv sync --group dev --frozen
      - name: B14 model registry + credential isolation + pilot contracts
        run: |
          uv run python -m pytest -q             tests/test_b14_model_registry_file.py             tests/test_registered_routes_truth.py             tests/test_b14_native_parameters.py             tests/test_worker.py             tests/test_*_onboarding.py tests/test_*_registration.py

  alpha:
    name: Locked Alpha contract
    if: always()
    needs: [registry-ci-plan, alpha-full-suite, alpha-model-registry-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce selected B14 lane
        env:
          LANE: ${{ needs.registry-ci-plan.outputs.lane }}
          PLAN_RESULT: ${{ needs.registry-ci-plan.result }}
          FULL_RESULT: ${{ needs.alpha-full-suite.result }}
          QUICK_RESULT: ${{ needs.alpha-model-registry-contract.result }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          if [ "$LANE" = model_registration_only ]; then
            test "$QUICK_RESULT" = success
            test "$FULL_RESULT" = skipped
            echo 'B14_CI_MODE=MODEL_REGISTRATION_ONLY'
          else
            test "$FULL_RESULT" = success
            test "$QUICK_RESULT" = skipped
            echo 'B14_CI_MODE=FULL'
          fi

  alpha-full-suite:
    name: Locked Alpha full suite
    needs: registry-ci-plan
    if: ${{ needs.registry-ci-plan.outputs.lane != 'model_registration_only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/korean-ai-platform
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install exact locked dependencies
        run: uv sync --group dev --frozen

      - name: Install Chromium
        run: uv run playwright install chromium

      # Same complete pytest discovery as both previous steps, now executed
      # exactly once under their stronger warning-as-error contract. A passing
      # strict run has exercised every test and rejected all uncaught warnings.
      # Other smoke, browser, startup and live-readiness gates stay separate.
      - name: Run full tests with warning-strict enforcement
        env:
          PYTHONWARNINGS: error
        run: uv run pytest -q

      - name: Compile app and tests
        run: uv run python -m compileall -q app tests

      - name: Execute documented owner startup regression
        run: uv run pytest -q tests/test_owner_startup_command.py

      - name: Run real Chromium mock user journeys
        run: uv run python browser_tests/alpha1_start_screen_smoke.py

      - name: Verify platform live readiness never executes chat without a credential
        env:
          PADIEM_SENSENOVA_API_KEY: ''
          PADIEM_POOLSIDE_API_KEY: ''
          B14_PROVIDER_MODE: live
        shell: bash
        run: |
          set -euo pipefail
          output="$(uv run python -c "from app.pilot.platform_secrets import any_platform_secret_present, live_ready; \
            print('PLATFORM_SECRET_PRESENT=' + str(int(any_platform_secret_present()))); \
            print('LIVE_READY=' + str(live_ready()))")"
          printf '%s\n' "${output}"
          printf '%s\n' "${output}" | grep -q '^PLATFORM_SECRET_PRESENT=0$'
