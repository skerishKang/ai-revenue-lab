name: Validate B14 Alpha

on:
  pull_request:
    paths:
      - 'apps/korean-ai-platform/**'
      - '.github/workflows/validate-b14-alpha.yml'
  workflow_dispatch:

permissions:
  contents: read

# Exact-head gate: product tests remain network-free except the documented
# localhost-only startup regression, which never reaches an upstream provider.
jobs:
  alpha:
    name: Locked Alpha contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/korean-ai-platform
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install exact locked dependencies
        run: uv sync --group dev --frozen

      - name: Install Chromium
        run: uv run playwright install chromium

      - name: Run full tests
        run: uv run pytest -q

      - name: Run warning-strict tests
        env:
          PYTHONWARNINGS: error
        run: uv run pytest -q

      - name: Compile app and tests
        run: uv run python -m compileall -q app tests

      - name: Execute documented owner startup regression
        run: uv run pytest -q tests/test_owner_startup_command.py

      - name: Run real Chromium mock user journeys
        run: uv run python browser_tests/alpha1_start_screen_smoke.py

      - name: Verify platform live readiness never executes chat without a credential
        env:
          PADIEM_SENSENOVA_API_KEY: ''
          PADIEM_POOLSIDE_API_KEY: ''
          B14_PROVIDER_MODE: live
        shell: bash
        run: |
          set -euo pipefail
          output="$(uv run python -c "from app.pilot.platform_secrets import any_platform_secret_present, live_ready; \
            print('PLATFORM_SECRET_PRESENT=' + str(int(any_platform_secret_present()))); \
            print('LIVE_READY=' + str(live_ready()))")"
          printf '%s\n' "${output}"
          printf '%s\n' "${output}" | grep -q '^PLATFORM_SECRET_PRESENT=0$'
