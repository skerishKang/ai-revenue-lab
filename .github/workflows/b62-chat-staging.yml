name: B62 Chat staging

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed full source commit SHA
        required: true
        type: string
      mode:
        description: Dry run or deploy the isolated staging Worker
        required: true
        type: choice
        options: [dry-run, deploy]

permissions:
  contents: read

jobs:
  staging-dry-run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: padiem-chat-staging
    steps:
      - name: Validate full source SHA
        env:
          TARGET_SHA: ${{ inputs.source_sha }}
        run: '[[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.13.5'
      - name: Verify isolated targets and generate staging config
        working-directory: apps/padiem-chat
        env:
          STAGING_CHAT_D1_ID: e064ac35-6e45-4fd8-9a2c-c3ae6583c964
          STAGING_CHAT_ORIGIN: ${{ vars.STAGING_CHAT_ORIGIN }}
          STAGING_QUEUE_ORIGIN: ${{ vars.STAGING_QUEUE_ORIGIN }}
        run: python scripts/staging_config.py .staging.generated.json
      - name: Build staging Worker without uploading
        working-directory: apps/padiem-chat
        run: uvx --from 'workers-py>=1.16.2,<2' pywrangler deploy --config .staging.generated.json --dry-run --outdir "$RUNNER_TEMP/staging-worker"
      - name: Check staging account and exact D1 identity
        if: inputs.mode == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_STAGING_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 d1 list --json > "$RUNNER_TEMP/staging-d1.json"
          python apps/padiem-chat/scripts/staging_verify.py d1 "$RUNNER_TEMP/staging-d1.json"
          npx --yes wrangler@4 deployments list --name padiem-chat-staging --json > "$RUNNER_TEMP/staging-before.json"
          version="$(python apps/padiem-chat/scripts/staging_verify.py active "$RUNNER_TEMP/staging-before.json")"
          npx --yes wrangler@4 versions view "$version" --name padiem-chat-staging --json > "$RUNNER_TEMP/staging-before-version.json"
          python apps/padiem-chat/scripts/staging_verify.py bindings "$RUNNER_TEMP/staging-before-version.json"
      - name: Deploy staging Worker
        if: inputs.mode == 'deploy'
        working-directory: apps/padiem-chat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_STAGING_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          uvx --from 'workers-py>=1.16.2,<2' pywrangler deploy --config .staging.generated.json --keep-vars > "$RUNNER_TEMP/staging-deploy.log" 2>&1 || { echo 'Staging deployment failed'; exit 1; }
      - name: Verify the serving version and bindings
        if: inputs.mode == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_STAGING_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deployments list --name padiem-chat-staging --json > "$RUNNER_TEMP/staging-deployments.json"
          version="$(python apps/padiem-chat/scripts/staging_verify.py active "$RUNNER_TEMP/staging-deployments.json")"
          npx --yes wrangler@4 versions view "$version" --name padiem-chat-staging --json > "$RUNNER_TEMP/staging-version.json"
          python apps/padiem-chat/scripts/staging_verify.py bindings "$RUNNER_TEMP/staging-version.json"
          echo "Staging version: $version"

# The environment must use a token scoped exclusively to the staging Worker and
# its D1; do not reuse the production deployment token. This PR remains draft
# until token scope, deployed-binding checks, and actual Worker health pass.
