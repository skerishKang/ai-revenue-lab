name: B33 Live Research Memory Audit 20260811
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/b33-live-research-memory-audit-20260811.yml']
permissions: {contents: read}
jobs:
  audit:
    if: github.event.pull_request.head.ref == 'ops/b33-live-research-memory-audit-20260811'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAIN_SHA: a631122888d30c5a8a62f4b27e192967da331898
      REGISTRY_SHA: c034ccae74d038bb3c5517c62e3c290db5bffc2a
      SOURCE_DIR: reference/business-33-research-memory-v1
      CANONICAL: https://33-research-memory.pages.dev
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}

      - name: Discover actual live source authority
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git ls-remote https://github.com/skerishKang/ai-revenue-lab.git refs/heads/main | cut -f1)
          test "$latest" = "$MAIN_SHA"
          test -z "$(git ls-tree -r --name-only "$MAIN_SHA" -- "$SOURCE_DIR")"
          mkdir -p /tmp/live /tmp/evidence
          paths=(index.html ux.html styles/main.css scripts/review.js)
          : > /tmp/evidence/authority.txt
          for rel in "${paths[@]}"; do
            safe=$(echo "$rel" | tr '/' '_')
            url="$CANONICAL/$rel?authority=$(date +%s%N)"
            code=$(curl -L -sS --max-time 20 -H 'Cache-Control: no-cache' -o "/tmp/live/$safe" -w '%{http_code}' "$url")
            test "$code" = 200
            live_sha=$(sha256sum "/tmp/live/$safe" | cut -d' ' -f1)
            echo "LIVE $rel sha256=$live_sha bytes=$(wc -c < /tmp/live/$safe)" | tee -a /tmp/evidence/authority.txt
            if git cat-file -e "$REGISTRY_SHA:$SOURCE_DIR/$rel" 2>/dev/null; then
              git show "$REGISTRY_SHA:$SOURCE_DIR/$rel" > "/tmp/registry-$safe"
              registry_sha=$(sha256sum "/tmp/registry-$safe" | cut -d' ' -f1)
              echo "REGISTRY $rel sha256=$registry_sha match=$([[ "$registry_sha" == "$live_sha" ]] && echo yes || echo no)" | tee -a /tmp/evidence/authority.txt
            else
              echo "REGISTRY $rel absent" | tee -a /tmp/evidence/authority.txt
            fi
            matches=0
            while read -r commit; do
              [[ -z "$commit" ]] && continue
              if git cat-file -e "$commit:$SOURCE_DIR/$rel" 2>/dev/null; then
                git show "$commit:$SOURCE_DIR/$rel" > /tmp/candidate
                candidate_sha=$(sha256sum /tmp/candidate | cut -d' ' -f1)
                if [[ "$candidate_sha" == "$live_sha" ]]; then
                  matches=$((matches+1))
                  echo "MATCH $rel commit=$commit subject=$(git log -1 --format=%s "$commit")" | tee -a /tmp/evidence/authority.txt
                  git branch -r --contains "$commit" | sed 's/^/  REF /' | head -20 | tee -a /tmp/evidence/authority.txt || true
                fi
              fi
            done < <(git log --all --format=%H -- "$SOURCE_DIR/$rel" | awk '!seen[$0]++')
            echo "MATCH_COUNT $rel $matches" | tee -a /tmp/evidence/authority.txt
          done
          echo '--- LIVE INDEX HEAD ---' >> /tmp/evidence/authority.txt
          head -c 1600 /tmp/live/index.html | tr '\n' ' ' >> /tmp/evidence/authority.txt || true
          echo >> /tmp/evidence/authority.txt
          echo '--- LIVE UX HEAD ---' >> /tmp/evidence/authority.txt
          head -c 1600 /tmp/live/ux.html | tr '\n' ' ' >> /tmp/evidence/authority.txt || true
          echo >> /tmp/evidence/authority.txt
          cat /tmp/evidence/authority.txt

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Browser UI states and UX journey
        shell: bash
        run: |
          cat >/tmp/audit.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const fs = require('fs');
          const base = 'https://33-research-memory.pages.dev';
          const viewports = { desktop:{width:1440,height:1100}, mobile:{width:390,height:844} };
          const failures=[], results=[];
          async function shot(p,n){ await p.screenshot({path:`/tmp/evidence/${n}.png`}); await p.screenshot({path:`/tmp/evidence/${n}-full.png`,fullPage:true}); }
          function num(v){ return Number.isFinite(v) ? v : null; }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [mode,viewport] of Object.entries(viewports)){
              const context=await browser.newContext({viewport,deviceScaleFactor:1});
              let page=await context.newPage(), errors=[];
              page.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`)});
              page.on('pageerror',e=>errors.push(`page:${e.message}`));
              page.on('requestfailed',r=>errors.push(`request:${r.url()} ${r.failure()?.errorText||''}`));
              let response=await page.goto(base+'/index.html?visual='+Date.now(),{waitUntil:'networkidle'});
              if(!response||!response.ok()) failures.push(`${mode}/root bad HTTP`);
              const rootMetrics=await page.evaluate(()=>{
                const de=document.documentElement,b=document.body,h=document.querySelector('.site-header h1'),s=h?getComputedStyle(h):null;
                const f=s?parseFloat(s.fontSize):NaN,l=s?parseFloat(s.lineHeight):NaN;
                return {overflowX:Math.max(de.scrollWidth,b.scrollWidth)-innerWidth,pageHeight:de.scrollHeight,h1Text:h?.innerText||'',h1Font:f,h1Line:l,h1Ratio:Number.isFinite(f)&&f&&Number.isFinite(l)?l/f:null,tabs:document.querySelectorAll('[data-state-control]').length,title:document.title};
              });
              if(rootMetrics.overflowX>1) failures.push(`${mode}/root overflow ${rootMetrics.overflowX}`);
              if(/[가-힣]/.test(rootMetrics.h1Text)&&rootMetrics.h1Ratio!==null&&rootMetrics.h1Ratio<1) failures.push(`${mode}/root Korean H1 ratio ${rootMetrics.h1Ratio}`);
              if(errors.length) failures.push(`${mode}/root ${errors.join(' | ')}`);
              await shot(page,`${mode}-root-initial`);
              const stateNames=['question','literature','notes','equation','review','mobile'];
              const stateMetrics={};
              if(rootMetrics.tabs===7){
                for(const st of stateNames){
                  await page.locator(`[data-state-control="${st}"]`).click();
                  const d=await page.evaluate(st=>{const panel=document.querySelector(`[data-state="${st}"]`),h=panel?.querySelector('h2'),s=h?getComputedStyle(h):null,f=s?parseFloat(s.fontSize):NaN,l=s?parseFloat(s.lineHeight):NaN;return{hidden:panel?.hidden??null,text:h?.innerText||'',font:f,line:l,ratio:Number.isFinite(f)&&f&&Number.isFinite(l)?l/f:null}},st);
                  if(d.hidden===true) failures.push(`${mode}/root ${st} stayed hidden`);
                  if(/[가-힣]/.test(d.text)&&d.ratio!==null&&d.ratio<1) failures.push(`${mode}/root ${st} Korean H2 ratio ${d.ratio}`);
                  stateMetrics[st]=d;
                  if(['question','equation','review','mobile'].includes(st)) await shot(page,`${mode}-root-${st}`);
                }
                await page.locator('[data-state-control="review"]').click();
                const replay=page.locator('[data-motion-replay]');
                if(await replay.count()===1){
                  await replay.click();
                  await page.waitForFunction(()=>document.querySelector('[data-memory-trace]')?.dataset.motionState==='complete',{timeout:4000});
                  const status=(await page.locator('[data-motion-status]').innerText()).trim();
                  if(!status.includes('HUMAN-REVIEWED RESEARCH MEMORY')) failures.push(`${mode}/root replay status mismatch`);
                } else failures.push(`${mode}/root expected replay control`);
              }
              await page.close();

              page=await context.newPage(); errors=[];
              page.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`)});
              page.on('pageerror',e=>errors.push(`page:${e.message}`));
              page.on('requestfailed',r=>errors.push(`request:${r.url()} ${r.failure()?.errorText||''}`));
              response=await page.goto(base+'/ux.html?visual='+Date.now(),{waitUntil:'networkidle'});
              if(!response||!response.ok()) failures.push(`${mode}/ux bad HTTP`);
              const uxMetrics=await page.evaluate(()=>{
                const de=document.documentElement,b=document.body,h=document.querySelector('.view.active h1'),s=h?getComputedStyle(h):null,f=s?parseFloat(s.fontSize):NaN,l=s?parseFloat(s.lineHeight):NaN;
                const head=document.querySelector('.head')?.getBoundingClientRect(),nav=document.querySelector('.nav')?.getBoundingClientRect(),view=document.querySelector('.view.active')?.getBoundingClientRect();
                return {overflowX:Math.max(de.scrollWidth,b.scrollWidth)-innerWidth,pageHeight:de.scrollHeight,h1Text:h?.innerText||'',h1Font:f,h1Line:l,h1Ratio:Number.isFinite(f)&&f&&Number.isFinite(l)?l/f:null,headBottom:head?.bottom??null,navTop:nav?.top??null,navBottom:nav?.bottom??null,viewTop:view?.top??null,title:document.title};
              });
              if(uxMetrics.overflowX>1) failures.push(`${mode}/ux overflow ${uxMetrics.overflowX}`);
              if(/[가-힣]/.test(uxMetrics.h1Text)&&uxMetrics.h1Ratio!==null&&uxMetrics.h1Ratio<1) failures.push(`${mode}/ux Korean H1 ratio ${uxMetrics.h1Ratio}`);
              if(errors.length) failures.push(`${mode}/ux ${errors.join(' | ')}`);
              await shot(page,`${mode}-ux-initial`);
              const hasFlow=await page.locator('[data-go="sources"]').count();
              if(hasFlow===1){
                await page.locator('[data-go="sources"]').click();
                await page.locator('[data-source="A"]').click();
                await page.locator('[data-source="C"]').click();
                if(!((await page.locator('#sourceStatus').innerText()).includes('2개'))) failures.push(`${mode}/ux source count mismatch`);
                await shot(page,`${mode}-ux-sources`);
                await page.locator('[data-go="claims"]').click();
                await page.locator('[data-claim="reject"]').click();
                await page.locator('[data-claim="accept"]').click();
                if(!((await page.locator('#claimStatus').innerText()).includes('메모 후보'))) failures.push(`${mode}/ux claim verdict mismatch`);
                await shot(page,`${mode}-ux-claims`);
                await page.locator('#makeNote').click();
                if(!(await page.locator('#note').evaluate(el=>el.classList.contains('active')))) failures.push(`${mode}/ux note did not open`);
                if(!((await page.locator('#noteText').innerText()).includes('2개 합성 자료'))) failures.push(`${mode}/ux note source count missing`);
                await page.locator('#finish').click();
                if(!((await page.locator('#finishStatus').innerText()).includes('실제 논문'))) failures.push(`${mode}/ux finish disclaimer mismatch`);
                await shot(page,`${mode}-ux-note-finished`);
                await page.reload({waitUntil:'networkidle'});
                if((await page.locator('#noteText').innerText()).includes('2개 합성 자료')) failures.push(`${mode}/ux reload retained session`);
              } else failures.push(`${mode}/ux expected evidence-to-note flow missing`);
              results.push({mode,rootMetrics,stateMetrics,uxMetrics});
              await page.close(); await context.close();
            }
            await browser.close();
            fs.writeFileSync('/tmp/evidence/metrics.json',JSON.stringify({mainSha:'a631122888d30c5a8a62f4b27e192967da331898',registrySha:'c034ccae74d038bb3c5517c62e3c290db5bffc2a',results,failures},null,2));
            console.log(JSON.stringify({results,failures},null,2));
            if(failures.length) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/audit.cjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b33-live-research-memory-audit-evidence-${{ github.run_attempt }}
          path: /tmp/evidence
          if-no-files-found: error
          retention-days: 7
