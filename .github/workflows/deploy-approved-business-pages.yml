name: Deploy approved Business UI pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-approved-business-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-approved-business-pages
  cancel-in-progress: false

jobs:
  deploy-business-09:
    name: Deploy Business 9 approved UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: ai-revenue-business-09-childrens-story
      APPROVED_SHA: ef53c4979df2707014d6a9f9ffb5df7387eb128b
      APPROVED_BRANCH: feat/business-09-personalized-childrens-story-ui
      SOURCE_DIR: reference/business-09-personalized-childrens-story-v1
    steps:
      - name: Check required credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }

      - name: Check out approved UI exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_SHA }}
          fetch-depth: 1
          sparse-checkout: ${{ env.SOURCE_DIR }}
          sparse-checkout-cone-mode: false

      - name: Verify approved source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${APPROVED_SHA}"
          test -f "${SOURCE_DIR}/index.html"

      - name: Create dedicated Pages project if missing
        shell: bash
        run: |
          set -euo pipefail
          projects_json="$(npx --yes wrangler@4 pages project list --json)"
          if ! jq -e --arg name "${PROJECT_NAME}" '.[] | select(.name == $name)' <<<"${projects_json}" >/dev/null; then
            npx --yes wrangler@4 pages project create "${PROJECT_NAME}" --production-branch "${APPROVED_BRANCH}"
          fi

      - name: Deploy approved static UI
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy "${SOURCE_DIR}" \
            --project-name "${PROJECT_NAME}" \
            --branch "${APPROVED_BRANCH}" \
            --commit-hash "${APPROVED_SHA}" \
            --commit-message "Business 9 UI_APPROVED exact head" \
            --commit-dirty=false

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "## Business 9 · Personalized Children's Story"
            echo
            echo "- UI verdict: UI_APPROVED"
            echo "- Exact deployed SHA: \`${APPROVED_SHA}\`"
            echo "- Pages project: \`${PROJECT_NAME}\`"
            echo "- URL: https://${PROJECT_NAME}.pages.dev"
          } >> "${GITHUB_STEP_SUMMARY}"
