name: B06 V4 Entry Typography Polish QA 20260810

on:
  push:
    branches:
      - 'design/b06-world-feed-workspace-v4-20260810'
    paths:
      - 'reference/business-06-world-feed-v1/**'
      - '.github/workflows/b06-v4-entry-polish-qa-20260810.yml'
  pull_request:
    paths:
      - 'reference/business-06-world-feed-v1/**'
      - '.github/workflows/b06-v4-entry-polish-qa-20260810.yml'

permissions:
  contents: read

jobs:
  entry-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static polish contract
        run: |
          set -euo pipefail
          grep -q 'workspace-v4-polish.css' reference/business-06-world-feed-v1/index.html
          grep -q '.wf-v4-entry h1' reference/business-06-world-feed-v1/styles/workspace-v4-polish.css
      - name: Install isolated Playwright
        run: |
          set -euo pipefail
          mkdir -p /tmp/b06-entry-polish-pw && cd /tmp/b06-entry-polish-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          python3 -m http.server 4173 --directory reference/business-06-world-feed-v1 >/tmp/b06-entry-polish-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/b06-entry-polish-http.log; exit 1
      - name: Capture entry desktop mobile reduced motion
        env:
          NODE_PATH: /tmp/b06-entry-polish-pw/node_modules
        run: |
          set -euo pipefail
          rm -rf /tmp/b06-entry-polish-evidence && mkdir -p /tmp/b06-entry-polish-evidence
          cat >/tmp/b06-entry-polish.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const assert = require('assert');
          const base = 'http://127.0.0.1:4173/index.html';
          async function one(browser,name,viewport,reducedMotion='no-preference'){
            const context=await browser.newContext({viewport,reducedMotion});
            const page=await context.newPage(); const errors=[]; const bad=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text());});
            page.on('response',r=>{if(r.status()>=400) bad.push(`${r.status()} ${r.url()}`);});
            await page.goto(base,{waitUntil:'networkidle',timeout:45000});
            await page.waitForSelector('#view-feed:not([hidden]) .wf-v4-entry',{state:'visible'});
            await page.waitForFunction(()=>{const i=document.querySelector('.wf-v4-entry-photo');return i?.complete&&i.naturalWidth>300;});
            await page.evaluate(()=>document.fonts.ready);
            const m=await page.locator('#wf-v4-title').evaluate(el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return {left:r.left,right:r.right,width:r.width,height:r.height,fontSize:parseFloat(s.fontSize),lineHeight:parseFloat(s.lineHeight),text:el.innerText};});
            assert.ok(m.left>=12,`${name}: left ${m.left}`); assert.ok(m.right<=viewport.width-12,`${name}: right ${m.right}`);
            assert.ok(m.lineHeight/m.fontSize>=.98,`${name}: line-height ${m.lineHeight}/${m.fontSize}`);
            assert.ok(m.fontSize<=(viewport.width<=700?60:105),`${name}: font ${m.fontSize}`);
            assert.equal(await page.evaluate(()=>document.querySelector('.review-shell')?.dataset.route),'feed');
            assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth-innerWidth)<=1);
            assert.deepEqual(errors,[]); assert.deepEqual(bad,[]);
            await page.screenshot({path:`/tmp/b06-entry-polish-evidence/${name}-entry.png`,fullPage:false});
            await context.close(); return m;
          }
          (async()=>{const b=await chromium.launch({headless:true}); const out={}; out.desktop=await one(b,'desktop-1440x1100',{width:1440,height:1100});out.mobile=await one(b,'mobile-390x844',{width:390,height:844});out.reduced=await one(b,'reduced-1440x1100',{width:1440,height:1100},'reduce');fs.writeFileSync('/tmp/b06-entry-polish-evidence/results.json',JSON.stringify(out,null,2));await b.close();})().catch(e=>{fs.writeFileSync('/tmp/b06-entry-polish-evidence/error.txt',String(e.stack||e));throw e;});
          NODE
          node /tmp/b06-entry-polish.cjs
      - name: Upload entry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b06-v4-entry-polish-evidence-${{ github.run_number }}
          path: /tmp/b06-entry-polish-evidence
          if-no-files-found: error
