name: Portfolio preview remediation 2026-08-16

on:
  push:
    branches:
      - portfolio/first-complete-20260816
    paths:
      - .github/workflows/portfolio-preview-remediation-20260816.yml

permissions:
  contents: read

concurrency:
  group: portfolio-preview-remediation-20260816
  cancel-in-progress: false

jobs:
  audit-fix-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: ai-revenue-final-portfolio
      SOURCE_DIR: portfolio/first-complete
      PUBLIC_URL: https://ai-revenue-final-portfolio.pages.dev
    steps:
      - uses: actions/checkout@v4

      - name: Install Korean fonts and browser runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          fc-cache -f >/dev/null
          fc-match 'Noto Sans CJK KR' | head -1
          mkdir -p /tmp/portfolio-pw
          cd /tmp/portfolio-pw
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium >/dev/null

      - name: Audit live product surfaces and capture font-correct previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/${SOURCE_DIR}/previews-fixed"
          cat >/tmp/portfolio-pw/audit.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'fs';
          import path from 'path';

          const out = path.join(process.env.GITHUB_WORKSPACE, 'portfolio/first-complete/previews-fixed');
          const targets = {
            b01:'https://ai-revenue-personal-edition.pages.dev',
            b02:'https://ai-revenue-living-travel.pages.dev',
            b04:'https://ai-revenue-living-learning.pages.dev',
            b05:'https://danjion.pages.dev',
            b06:'https://06-world-feed.pages.dev',
            b07:'https://07-personal-meaning-map.pages.dev',
            b08:'https://08-family-newspaper.pages.dev',
            b09:'https://09-personalized-childrens-story.pages.dev',
            b10:'https://10-fan-magazine.pages.dev',
            b11:'https://11-language-learning-magazine.pages.dev',
            b12:'https://12-creator-mini-media.pages.dev',
            b13:'https://ai-revenue-personal-video-archive.pages.dev',
            b15:'https://15-global-ai-newsroom.pages.dev'
          };

          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:1440,height:900}, deviceScaleFactor:1, locale:'ko-KR'});
          const results = {};
          const failures = [];

          for (const [id,url] of Object.entries(targets)) {
            const page = await context.newPage();
            try {
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(1800);
              const audit = await page.evaluate(() => {
                const box = el => {
                  const r = el.getBoundingClientRect();
                  return {w:Math.round(r.width),h:Math.round(r.height),x:Math.round(r.x),y:Math.round(r.y)};
                };
                const svgs = [...document.querySelectorAll('svg')];
                const svgImgs = [...document.images].filter(i => /\.svg(?:[?#]|$)|^data:image\/svg/i.test(i.currentSrc || i.src || ''));
                const rasterImgs = [...document.images].filter(i => /\.(?:png|jpe?g|webp|avif|gif)(?:[?#]|$)|^data:image\/(?:png|jpe?g|webp|avif|gif)/i.test(i.currentSrc || i.src || ''));
                const all = [...document.querySelectorAll('body *')];
                const bgSvg = all.filter(el => {
                  const bg = getComputedStyle(el).backgroundImage || '';
                  return /\.svg|data:image\/svg/i.test(bg);
                });
                const largeSvgs = svgs.map((el,idx)=>({idx,...box(el),aria:el.getAttribute('aria-label')||'',role:el.getAttribute('role')||'',title:el.querySelector('title')?.textContent?.trim()?.slice(0,120)||''})).filter(v=>v.w>=180 && v.h>=100);
                const largeSvgImgs = svgImgs.map((el,idx)=>({idx,...box(el),alt:el.alt||'',src:(el.currentSrc||el.src||'').slice(0,180)})).filter(v=>v.w>=180 && v.h>=100);
                const largeRasterImgs = rasterImgs.map((el,idx)=>({idx,...box(el),alt:el.alt||'',src:(el.currentSrc||el.src||'').slice(0,180)})).filter(v=>v.w>=180 && v.h>=100);
                const text = document.body.innerText || '';
                const koreanChars = (text.match(/[가-힣]/g)||[]).length;
                const replacementChars = (text.match(/�/g)||[]).length;
                return {
                  title: document.title,
                  svg_count: svgs.length,
                  large_svg_count: largeSvgs.length,
                  svg_img_count: svgImgs.length,
                  large_svg_img_count: largeSvgImgs.length,
                  bg_svg_count: bgSvg.length,
                  canvas_count: document.querySelectorAll('canvas').length,
                  raster_img_count: rasterImgs.length,
                  large_raster_img_count: largeRasterImgs.length,
                  korean_text_chars: koreanChars,
                  replacement_chars: replacementChars,
                  large_svgs: largeSvgs.slice(0,20),
                  large_svg_imgs: largeSvgImgs.slice(0,20),
                  large_raster_imgs: largeRasterImgs.slice(0,20),
                  body_sample: text.replace(/\s+/g,' ').trim().slice(0,500)
                };
              });
              results[id] = {url,...audit};
              await page.screenshot({path:path.join(out,`${id}.jpg`),type:'jpeg',quality:86,fullPage:false});
              console.log(`AUDIT=${id} `+JSON.stringify(audit));
            } catch (e) {
              failures.push(`${id}:${e.message}`);
              console.log(`AUDIT=${id}:FAIL ${e.message}`);
            } finally { await page.close(); }
          }
          await browser.close();
          fs.writeFileSync(path.join(out,'live-surface-audit.json'), JSON.stringify(results,null,2));
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          NODE
          cd /tmp/portfolio-pw
          node audit.mjs

      - name: Build corrected portfolio deployment bundle
        shell: python
        run: |
          from pathlib import Path
          import json
          p=Path('portfolio/first-complete/index.html')
          text=p.read_text(encoding='utf-8')
          mapping={k:f'previews-fixed/{k}.jpg' for k in ['b01','b02','b04','b05','b06','b07','b08','b10','b11','b12','b13','b15']}
          # B09 is deliberately excluded from screenshot mapping because its public page is pre-clean-master blocker evidence.
          patch=f'''<script data-portfolio-preview-remediation="20260816">
          (()=>{{
            const shots={json.dumps(mapping,separators=(',',':'))};
            for(const [id,src] of Object.entries(shots)){{
              const article=document.getElementById(id); if(!article) continue;
              const viewport=article.querySelector('.preview .viewport'); if(!viewport) continue;
              const img=document.createElement('img');
              img.src=src; img.alt=id.toUpperCase()+' approved/public product preview';
              img.style.cssText='width:100%;height:100%;display:block;object-fit:cover;object-position:top;background:#0e0e0e';
              viewport.replaceChildren(img);
              const loading=article.querySelector('.preview-loading'); if(loading) loading.remove();
            }}
            const b09=document.getElementById('b09');
            if(b09){{
              const viewport=b09.querySelector('.preview .viewport');
              if(viewport){{
                viewport.innerHTML=`<div style="height:100%;display:flex;flex-direction:column;justify-content:center;padding:34px;background:radial-gradient(circle at 72% 28%,rgba(235,116,73,.16),transparent 34%),#0d0d0d;color:#f4f0e8;font-family:inherit"><div style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#e88b69;margin-bottom:14px">B09 · INTEGRATION BLOCKER</div><div style="font-size:28px;line-height:1.05;font-weight:650;max-width:520px">최신 clean-master 방향은 승인됐지만,<br>public Pages는 최종 화면이 아닙니다.</div><div style="font-size:13px;line-height:1.65;color:#aaa;margin-top:16px;max-width:560px">기존 벡터/구형 story surface를 포트폴리오 대표 이미지로 사용하지 않습니다. clean-master PNG byte integration 완료 후 실제 최종 화면으로 교체합니다.</div></div>`;
              }}
              const loading=b09.querySelector('.preview-loading'); if(loading) loading.remove();
            }}
          }})();
          </script>'''
          text=text.replace('</body>',patch+'\n</body>')
          p.write_text(text,encoding='utf-8')
          audit=Path('portfolio/first-complete/previews-fixed/live-surface-audit.json')
          if not audit.exists(): raise SystemExit('audit json missing')
          data=json.loads(audit.read_text(encoding='utf-8'))
          if set(data)!={'b01','b02','b04','b05','b06','b07','b08','b09','b10','b11','b12','b13','b15'}:
              raise SystemExit('audit target set mismatch')
          print('CORRECTED_BUNDLE=PASS')

      - name: Deploy corrected portfolio only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy "${SOURCE_DIR}" \
            --project-name "${PROJECT_NAME}" \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "Portfolio preview remediation: Korean fonts + SVG audit + B09 evidence" \
            --commit-dirty=true

      - name: Verify corrected production
        shell: python
        run: |
          import time, urllib.request
          url='https://ai-revenue-final-portfolio.pages.dev/'
          last=''
          for _ in range(30):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'portfolio-qa/2.0'}),timeout=15) as r:
                      last=r.read().decode('utf-8','replace')
                  if 'data-portfolio-preview-remediation="20260816"' in last and 'previews-fixed/b01.jpg' in last:
                      break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit('corrected production not visible')
          required=['previews-fixed/b13.jpg','B09 · INTEGRATION BLOCKER','public Pages는 최종 화면이 아닙니다.','OWNER ADOPTED · V4','DESIGN COMPLETE · CANDIDATE']
          missing=[x for x in required if x not in last]
          if missing: raise SystemExit(f'missing corrected markers: {missing}')
          print('CORRECTED_PRODUCTION_QA=PASS')

      - name: Capture final corrected desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/portfolio-pw
          npx playwright screenshot --browser=chromium --viewport-size="1440,1100" --full-page "${PUBLIC_URL}" "${GITHUB_WORKSPACE}/portfolio-remediated-desktop.png"
          npx playwright screenshot --browser=chromium --viewport-size="390,844" --full-page "${PUBLIC_URL}" "${GITHUB_WORKSPACE}/portfolio-remediated-mobile.png"
          test -s "${GITHUB_WORKSPACE}/portfolio-remediated-desktop.png"
          test -s "${GITHUB_WORKSPACE}/portfolio-remediated-mobile.png"
          echo 'REMEDIATED_SCREENSHOT_QA=PASS'

      - name: Upload remediation evidence
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-preview-remediation-20260816
          path: |
            portfolio-remediated-desktop.png
            portfolio-remediated-mobile.png
            portfolio/first-complete/previews-fixed/*.jpg
            portfolio/first-complete/previews-fixed/live-surface-audit.json
          if-no-files-found: error
