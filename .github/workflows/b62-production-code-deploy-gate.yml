          payload=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          if payload.get("success") is not True or not isinstance(payload.get("result"),dict):
              raise SystemExit("D1_SETTINGS_INVALID")
          bindings=payload["result"].get("bindings")
          if not isinstance(bindings,list):
              raise SystemExit("D1_BINDINGS_INVALID")
          matching=[b for b in bindings if isinstance(b,dict)
                    and b.get("name")==sys.argv[2] and b.get("type")=="d1"]
          if len(matching)!=1:
