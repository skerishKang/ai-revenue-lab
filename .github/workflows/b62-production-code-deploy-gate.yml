          db_id=matching[0].get("id")
          if not isinstance(db_id,str) or re.fullmatch(r"[0-9a-fA-F-]{32,36}",db_id) is None:
              raise SystemExit("D1_BINDING_ID_INVALID")
          print(db_id)
