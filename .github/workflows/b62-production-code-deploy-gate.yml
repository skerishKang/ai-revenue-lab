          echo "RECOVERY_SNAPSHOT=${recovery_snapshot}" >> "${GITHUB_ENV}"
          echo 'P01_SSE_RECOVERY_IMMUTABLE_SNAPSHOT=AVAILABLE'
          echo 'SECRET_VALUES_READ=0'

