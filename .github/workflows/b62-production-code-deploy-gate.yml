name: B62 Production Code Deploy Gate

on:
  pull_request:
    paths:
      - ".github/workflows/b62-production-code-deploy-gate.yml"
      - ".github/scripts/b62_cloudflare_production_deploy_config.py"
      - ".github/scripts/b62_repo_binding_authority.py"
      - ".github/tests/fixtures/b62_served_binding_inventory_20261026.json"
      - ".github/tests/test_b62_observability_deploy_contract.py"
      - ".github/scripts/b62_connector_broker_additive_preflight.py"
      - ".github/tests/test_b62_connector_broker_additive_preflight.py"
      - ".github/scripts/b62_connector_broker_served_version_readonly.py"
      - ".github/scripts/connector_bundle_fingerprint.py"
      - ".github/tests/test_connector_bundle_fingerprint.py"
      - ".github/tests/test_b62_connector_broker_served_version_readonly.py"
      - ".github/scripts/b62_connector_identity_served_version_readonly.py"
      - ".github/tests/test_b62_connector_identity_served_version_readonly.py"
      - ".github/scripts/b62_connector_identity_activation_readonly.py"
      - ".github/tests/test_b62_connector_identity_activation_readonly.py"
      - "packages/padiem-control-plane/local_agent_broker_worker.py"
      - "packages/padiem-control-plane/canonical_broker_pairing_rpc.py"
      - "packages/padiem-control-plane/wrangler.local-agent-broker.jsonc"
      - "packages/padiem-control-plane/identity_authority_worker.py"
      - "packages/padiem-control-plane/canonical_connector_enrollment_consent_rpc.py"
      - "packages/padiem-control-plane/wrangler.identity-authority.jsonc"
      - ".github/scripts/b62_web_secrets_store_contract.py"
      - ".github/tests/test_b62_repo_binding_authority.py"
      - ".github/scripts/b62_cloudflare_rollback_deployment_request.py"
      - ".github/tests/test_b62_cloudflare_rollback_deployment_request.py"
      - ".github/scripts/b62_rollback_recorded_version_guard.py"
      - ".github/tests/test_b62_rollback_recovered_latest_and_active_bindings.py"
      - ".github/scripts/b62_public_origin_504_guard.py"
      - ".github/scripts/b62_cloudflare_504_readonly_get.sh"
      - ".github/tests/test_b62_cloudflare_504_readonly_get.py"
      - ".github/tests/test_b62_public_origin_504_gate.py"
      - ".github/scripts/b62_binding_state_guard.py"
      - ".github/scripts/b62_p01_sse_snapshot_off_recovery.py"
      - ".github/tests/test_b62_p01_sse_snapshot_off_recovery.py"
      - ".github/scripts/b62_served_version_secret_guard.py"
      - ".github/scripts/cloudflare_served_version_cli.py"
      - ".github/scripts/cloudflare_served_version_lineage.py"
      - ".github/tests/test_cloudflare_served_version_lineage.py"
      - ".github/scripts/b62_code_deploy_served_preflight.py"
      - ".github/scripts/b62_sse_served_config_drift_guard.py"
      - ".github/tests/test_b62_sse_served_config_drift_guard.py"
      - ".github/tests/test_b62_code_deploy_served_preflight.py"
      - ".github/scripts/b62_claw_live_config_activation.py"
      - ".github/scripts/b62_d1_migration_008_schema.py"
      # #5034: the inbox list/mark-read routes read claw_task_alert, so migration
      # 010 must be live and schema-verified before inbox code is uploaded.
      - ".github/scripts/b62_d1_migration_010_schema.py"
      - "apps/padiem-chat/migrations/010_claw_task_alert.sql"
      - ".github/scripts/b62_d1_migration_040_schema.py"
      - ".github/tests/test_b62_d1_migration_040_gate.py"
      - "apps/padiem-chat/migrations/040_claw_web_xlsx_p01_decision_release.sql"
      # #4316/#4657: deploy must NOT precede 041 and 042 D1 schema.
      - ".github/scripts/b62_d1_migration_041_042_schema.py"
      - ".github/tests/test_b62_d1_migration_041_042_gate.py"
      - "packages/padiem-conversation-ui/**"
      - "scripts/sync_shared_conversation_composer.py"
      - "scripts/sync_shared_conversation_scroll.py"
      - "scripts/sync_shared_answer_copy.py"
      - "apps/padiem-chat/static/shared-conversation-composer.js"
      - "apps/padiem-chat/static/shared-conversation-scroll.js"
      - "apps/padiem-chat/static/shared-answer-copy.js"
      - "apps/padiem-chat/migrations/041_b66_ai_conversation.sql"
      - "apps/padiem-chat/migrations/042_conversation_product_scope.sql"
      # #4672: B66 durable paid-call claim must exist before Worker upload.
      - ".github/scripts/b62_d1_migration_044_schema.py"
      - ".github/tests/test_b62_d1_migration_044_gate.py"
      - "apps/padiem-chat/migrations/044_b66_ai_turn_attempt.sql"
      # #4139: the terminal lane writes kind/command_text, so 048 must be live
      # before this code is uploaded.
      - ".github/scripts/b62_d1_migration_048_schema.py"
      - ".github/tests/test_b62_d1_migration_048_gate.py"
      - "apps/padiem-chat/migrations/048_oracle_mesh_command.sql"
      # #5015: the model lane re-feeds termination/exit_code, so 049 must be
      # live before this code is uploaded.
      - ".github/scripts/b62_d1_migration_049_schema.py"
      - ".github/tests/test_b62_d1_migration_049_gate.py"
      - "apps/padiem-chat/migrations/049_oracle_mesh_command_result_meta.sql"
      # #5015: the selection restore reads/writes claw_pc_device_selection, so
      # 054 must be live before this code is uploaded.
      - ".github/scripts/b62_d1_migration_054_schema.py"
      - ".github/tests/test_b62_d1_migration_054_gate.py"
      - "apps/padiem-chat/migrations/054_claw_pc_device_selection.sql"
      - ".github/workflows/b62-claw-d1-migration-054-gate.yml"
      # #5441: the lost-password reset routes read and write the two additive
      # reset tables, so 062 must be live before this code is uploaded.
      - ".github/scripts/b62_d1_migration_062_schema.py"
      - ".github/scripts/b62_d1_migration_065_schema.py"
      - "apps/padiem-chat/migrations/065_claw_push_subscriptions.sql"
      - ".github/tests/test_b62_d1_migration_062_gate.py"
      - "apps/padiem-chat/migrations/062_password_reset.sql"
      - ".github/workflows/b62-d1-migration-062-gate.yml"
      - ".github/tests/test_b62_binding_state_guard.py"
      - ".github/scripts/b62_owner_d1_release_preflight.py"
      - ".github/tests/test_b62_owner_d1_release_preflight.py"
      # #5223: the reviewed Worker binding baseline and its comparison.
      - ".github/scripts/b62_binding_baseline.py"
      - ".github/tests/test_b62_binding_baseline.py"
      - ".github/binding_baselines/**"
      - ".github/workflows/b54-owner-d1-controlled-connection.yml"
      - ".github/scripts/b62_owner_d1_release_transaction.py"
      - ".github/tests/test_b62_owner_d1_release_transaction.py"
      - "docs/operations/OWNER_P01_D1_PROTECTED_RELEASE_RUNBOOK.md"
      - ".github/tests/test_b62_deploy_prereq_rollback_contracts.py"
      - ".github/tests/test_b62_served_version_secret_guard.py"
      - "apps/padiem-chat/tests/test_b62_production_deploy_config.py"
      - "apps/padiem-chat/wrangler.toml"
  workflow_dispatch:
    inputs:
      mode:
        description: "B62 production code deploy gate mode"
        required: true
        type: choice
        default: repository_preflight
        options:
          - repository_preflight
          - cloudflare_readonly
          - owner_d1_release_preflight
          - deploy_production_code
          - recover_p01_sse_off
          - rollback_production_code
      target_sha:
        description: "Exact current main SHA"
        required: true
        type: string
      confirmation:
        description: "Exact mutation confirmation phrase"
        required: false
        default: ""
        type: string
      allow_binding_removal:
        description: "Explicitly permit removal of repository-absent bindings or set_var null removals"
        required: false
        type: boolean
        default: false
      set_var:
        description: "Private JSON object: explicit variable overrides; null removes only with allow_binding_removal"
        required: false
        type: string
        default: "{}"
      previous_version_id:
        description: "Recorded previous production version id (rollback mode)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # PR source-contract checks must not evict a queued protected Production
  # workflow_dispatch. Production runs retain one shared serial group.
  group: b62-production-code-deploy-gate-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

env:
  B62_WORKER: padiem-chat
  IDENTITY_WORKER: padiem-control-plane-identity
  IDENTITY_BINDING: IDENTITY_AUTHORITY_SERVICE
  B14_WORKER: ai-revenue-korean-ai-platform
  B62_PUBLIC_BASE_URL: https://chat.padiem.net
  P01_ENGINE_WORKER: padiem-ai-engine
  WORKSPACE_R2_BUCKET: padiem-workspace-files
  D1_BINDING: PADIEM_CHAT_DB
  TARGET_SHA: ${{ inputs.target_sha }}

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR exact head
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact dispatch SHA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact current main for dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repository wrangler config must stay mock-only
        shell: bash
        run: python .github/scripts/b62_cloudflare_mock_config_guard.py apps/padiem-chat/wrangler.toml

      - name: Prove Cloudflare rollback deployment request shape
        shell: bash
        run: python .github/tests/test_b62_cloudflare_rollback_deployment_request.py

      - name: Test 504-only public-origin proof with negative controls
        shell: bash
        run: python .github/tests/test_b62_public_origin_504_gate.py

      - name: Validate B62 Cloudflare read-only 504 retry contract
        shell: bash
        run: |
          bash -n .github/scripts/b62_cloudflare_504_readonly_get.sh
          python .github/tests/test_b62_cloudflare_504_readonly_get.py

      - name: Run served-version secret set guard regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest
          python -m pytest .github/tests/test_b62_served_version_secret_guard.py -q
          echo "B62_SERVED_VERSION_SECRET_GUARD_TESTS=PASS"
          echo "PRODUCTION_MUTATION=0"

      - name: Verify Workers Logs deploy metadata contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest .github/tests/test_b62_observability_deploy_contract.py -q
          echo "B62_OBSERVABILITY_DEPLOY_CONTRACT=PASS"
          echo "PRODUCTION_MUTATION=0"

      - name: Verify repository binding authority and private variable controls
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python -m pytest .github/tests/test_b62_repo_binding_authority.py -q
          echo "B62_WEB_SECRETS_STORE_SOURCE_GUARD=PASS"
          echo "PRODUCTION_MUTATION=0"

      - name: Validate new-main upload-vs-served release preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest .github/tests/test_b62_code_deploy_served_preflight.py -q
          echo "NEW_MAIN_DEPLOY_PREFLIGHT_TESTS=PASS"
          echo "PRODUCTION_MUTATION=0"

      - name: Block unaccepted SSE setting drift before B62 code deploy
        shell: bash
        run: python .github/tests/test_b62_sse_served_config_drift_guard.py

      - name: Reject unsafe one-incident SSE snapshot recovery mutations
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest .github/tests/test_b62_p01_sse_snapshot_off_recovery.py -q
          echo 'P01_SSE_SNAPSHOT_RECOVERY_TESTS=PASS'
          echo 'PRODUCTION_MUTATION=0'
      # #4522: the merged B62 P01 code reads the additive receipt `released_at`
      # column, so the live D1 schema probe below is a hard predeploy
      # prerequisite. This contract tests the schema classifier and the exact
      # probe ordering; it never reads production credentials.
      - name: Validate migration 040 predeploy schema guard contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest .github/tests/test_b62_d1_migration_040_gate.py -q
          echo "MIGRATION_040_PREDEPLOY_GUARD_TESTS=PASS"
          echo "PRODUCTION_MUTATION=0"

      - name: Validate 041 and 042 B66/Chat product-scope read-only deploy gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest .github/tests/test_b62_d1_migration_041_042_gate.py -q
          echo "MIGRATION_041_042_PREDEPLOY_GUARD_TESTS=PASS"
          echo "PRODUCTION_MUTATION=0"

      - name: Validate B66 044 durable attempt production D1 predeploy schema guard
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest .github/tests/test_b62_d1_migration_044_gate.py -q
          echo "MIGRATION_044_PREDEPLOY_GUARD_TESTS=PASS"
          echo "PRODUCTION_MUTATION=0"

      - name: Validate #4139 048 command dispatch production D1 predeploy schema guard
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest .github/tests/test_b62_d1_migration_048_gate.py -q
          echo "MIGRATION_048_PREDEPLOY_GUARD_TESTS=PASS"
          echo "PRODUCTION_MUTATION=0"

      - name: Validate #5015 049 result-meta production D1 predeploy schema guard
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest .github/tests/test_b62_d1_migration_049_gate.py -q
          echo "MIGRATION_049_PREDEPLOY_GUARD_TESTS=PASS"
          echo "PRODUCTION_MUTATION=0"

      - name: Validate #5015 054 preferred-PC selection production D1 predeploy schema guard
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest .github/tests/test_b62_d1_migration_054_gate.py -q
          echo "MIGRATION_054_PREDEPLOY_GUARD_TESTS=PASS"
          echo "PRODUCTION_MUTATION=0"

      - name: Validate #5441 062 lost-password reset production D1 predeploy schema guard
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest .github/tests/test_b62_d1_migration_062_gate.py -q
          echo "MIGRATION_062_PREDEPLOY_GUARD_TESTS=PASS"
          echo "PRODUCTION_MUTATION=0"

      # PR-only CI: this contract tests the separate manual Owner D1 release.
      # It NEVER dispatches apply/rollback or reads production credentials.
      - name: Owner D1 protected release contract regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pytest pyyaml
          python3 -m pytest \
            .github/tests/test_b62_owner_d1_release_transaction.py \
            .github/tests/test_b62_owner_d1_release_preflight.py \
            .github/tests/test_b62_binding_baseline.py \
            .github/tests/test_b62_binding_state_guard.py -q
          echo "OWNER_D1_PROTECTED_RELEASE_SOURCE_CI=PASS"
          echo "PRODUCTION_MUTATION=0"

      - name: Enforce Connector Broker state RPC and additive preservation regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s .github/tests -p test_b62_connector_broker_additive_preflight.py -q
          # The repository declaration against the reviewed baseline, printed once
          # and named as repo-vs-baseline: this is not a production diff. No Cloudflare
          # call, no binding value, name and type only.
          python - <<'PY'
          import json, sys, tomllib
          from pathlib import Path
          sys.path.insert(0, ".github/scripts")
          from b62_binding_baseline import load_baseline
          from b62_repo_binding_authority import inventory
          repo = inventory(tomllib.loads(Path("apps/padiem-chat/wrangler.toml").read_text(encoding="utf-8")))
          declared = {name: {"name": name, "type": entry["type"]} for name, entry in repo.items()}
          base = {name: {"name": name, "type": kind} for name, kind in load_baseline("padiem-chat").items()}
          added = sorted(declared.keys() - base.keys())
          removed = sorted(base.keys() - declared.keys())
          changed = sorted(n for n in base.keys() & declared.keys() if base[n]["type"] != declared[n]["type"])
          print("B62_REPO_VS_BASELINE_DIFF_COUNTS=" + json.dumps({"added": len(added), "changed": len(changed), "removed": len(removed)}, sort_keys=True))
          PY
          echo "CONNECTOR_BROKER_PRESERVATION_SOURCE=PASS"
          echo "PRODUCTION_MUTATION=0"

      - name: Enforce Broker served-version read-only evidence parser regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s .github/tests -p test_b62_connector_broker_served_version_readonly.py -q
          echo "BROKER_SERVED_VERSION_PARSER=PASS_SOURCE_ONLY"
          echo "PRODUCTION_MUTATION=0"

      - name: Enforce Identity Connector live activation parser (no network)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s .github/tests -p test_b62_connector_identity_activation_readonly.py -q
          echo "IDENTITY_CONNECTOR_ACTIVATION_PARSER=PASS_SOURCE_ONLY"
          echo "PRODUCTION_MUTATION=0"

      - name: Enforce Identity served-version readback parser contract (no network)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s .github/tests -p test_b62_connector_identity_served_version_readonly.py -q
          echo "IDENTITY_SERVED_VERSION_PARSER=PASS_SOURCE_ONLY"
          echo "PRODUCTION_MUTATION=0"

      - name: Verify Connector build fingerprint is local evidence only
        shell: bash
        run: |
          python -m unittest discover -s .github/tests -p test_connector_bundle_fingerprint.py -q
          echo "CONNECTOR_DRY_RUN_FINGERPRINT_TESTS=PASS"
          echo "SERVED_SOURCE_PARITY_ATTESTED=NO"
          echo "PRODUCTION_MUTATION=0"

      - name: Gate source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_shared_conversation_composer.py --check
          python3 scripts/sync_shared_conversation_scroll.py --check
          python3 scripts/sync_shared_answer_copy.py --check
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/b62-production-code-deploy-gate.yml").read_text(encoding="utf-8")
          generator = Path(".github/scripts/b62_cloudflare_production_deploy_config.py").read_text(encoding="utf-8")
          binding_guard = Path(".github/scripts/b62_binding_state_guard.py").read_text(encoding="utf-8")
          served_guard = Path(".github/scripts/b62_served_version_secret_guard.py").read_text(encoding="utf-8")

          assert "DEPLOY_B62_PRODUCTION_CODE_FROM_EXACT_MAIN" in workflow
          assert "ROLLBACK_B62_PRODUCTION_CODE_TO_RECORDED_VERSION" in workflow
          assert workflow.count("environment: " + "production") == 2
          assert 'test "${GITHUB_REF}" = "refs/heads/main"' in workflow
          assert "PREMUTATION_EXACT_MAIN_SHA=PASS" in workflow
          assert "if: failure()" in workflow
          assert 'B62_PRODUCTION_CODE_AUTO_ROLLBACK=EXECUTED' in workflow
          assert '"percentage": 100' in workflow
          assert "authentication_required" in workflow
          assert "connector_ticket_origin_rejected" in workflow
          assert "B62_PRODUCTION_SMOKE=PASS" in workflow
          # #5895 item 4: one real chat turn on the promoted version, and it stays
          # AFTER the auto-rollback guard so a failed proof cannot roll back.
          assert "Post-deploy real chat" in workflow
          assert ".github/scripts/post_deploy_real_chat_smoke.py --lane chat" in workflow
          # 2026-10-28: the signed-in session proof, also after the rollback guard.
          assert "Post-deploy signed-in session check" in workflow
          assert ".github/scripts/post_deploy_signed_in_smoke.py" in workflow
          assert workflow.rindex("Auto-rollback to recorded version on any failed step") < \
              workflow.rindex("Post-deploy signed-in session check")
          assert workflow.rindex("Auto-rollback to recorded version on any failed step") < \
              workflow.rindex("Post-deploy real chat")
          assert "PRODUCTION_MUTATION=0" in workflow
          assert "PADIEM_CHAT_PUBLIC_BASE_URL: https://chat.padiem.net" in workflow or \
              "B62_PUBLIC_BASE_URL: https://chat.padiem.net" in workflow
          assert "python .github/scripts/b62_binding_state_guard.py" in workflow
          # #5223: the live binding set is compared with the reviewed
          # name+type baseline before any deploy mutation, so an unreviewed
          # binding change fails closed instead of rotting the expectation.
          assert "b62_binding_baseline.py" in workflow
          assert "B62_BINDING_BASELINE=PASS" in workflow
          assert "B62_BINDING_BASELINE_VALUES_EMITTED=0" in workflow
          assert ".github/binding_baselines/**" in workflow
          assert "INJECTED_EXPECTED_" + "ONLY" not in workflow
          assert "test \"${public_state}\" = \"expected\"" in workflow
          assert "B62_DEPLOY_LIVE_PREREQ=VERIFIED" in workflow
          assert "deploy-prereq" in workflow
          assert "B62_D1_MIGRATION_008_SCHEMA=EXACT" in workflow
          # #4522: the additive receipt `released_at` column is a hard predeploy
          # prerequisite for the merged P01 code, probed schema-only before the
          # upload/activate mutation.
          assert "B62_D1_MIGRATION_040_SCHEMA=EXACT" in workflow
          assert "MIGRATION_040_PREDEPLOY=EXACT" in workflow
          assert "RELEASED_AT_PRESENT=PASS" in workflow
          assert "b62_d1_migration_040_schema.py" in workflow
          assert "B62_D1_SCHEMA_041_042=EXACT" in workflow
          assert "MIGRATION_041_042_PREDEPLOY=EXACT" in workflow
          assert "b62_d1_migration_041_042_schema.py" in workflow
          assert "B62_D1_SCHEMA_044=EXACT" in workflow
          assert "MIGRATION_044_PREDEPLOY=EXACT" in workflow
          assert "b62_d1_migration_044_schema.py" in workflow
          # #4139: the terminal lane's additive columns are a hard predeploy
          # prerequisite too; the upload must stop on a 048-less database.
          assert "B62_D1_MIGRATION_048_SCHEMA=EXACT" in workflow
          assert "MIGRATION_048_PREDEPLOY=EXACT" in workflow
          assert "b62_d1_migration_048_schema.py" in workflow
          # #5015: the 049 result-meta columns are a hard predeploy
          # prerequisite too; the upload must stop on a 049-less database.
          assert "B62_D1_MIGRATION_049_SCHEMA=EXACT" in workflow
          assert "MIGRATION_049_PREDEPLOY=EXACT" in workflow
          assert "b62_d1_migration_049_schema.py" in workflow
          # #5015: the preferred-PC selection table is a hard predeploy
          # prerequisite too; the upload must stop on a 054-less database.
          assert "B62_D1_MIGRATION_054_SCHEMA=EXACT" in workflow
          assert "MIGRATION_054_PREDEPLOY=EXACT" in workflow
          assert "b62_d1_migration_054_schema.py" in workflow
          # #5441: the lost-password reset tables are a hard predeploy
          # prerequisite too; the upload must stop on a 062-less database.
          assert "B62_D1_MIGRATION_062_SCHEMA=EXACT" in workflow
          assert "MIGRATION_062_PREDEPLOY=EXACT" in workflow
          assert "b62_d1_migration_062_schema.py" in workflow
          # #5034: inbox routes read claw_task_alert; 010 must be EXACT predeploy.
          assert "B62_D1_MIGRATION_010_SCHEMA=EXACT" in workflow
          assert "MIGRATION_010_PREDEPLOY=EXACT" in workflow
          assert "b62_d1_migration_010_schema.py" in workflow
          assert "claw_pc_device_selection" in workflow
          assert "PRAGMA table_info(claw_web_xlsx_p01_decision_receipts)" in workflow
          assert "APPLICATION_ROW_READ=0" in workflow
          assert "STATE_ADOPTION_REQUIRED" in workflow
          assert "STATE_ADOPTION_PERFORMED" in workflow
          assert "STATE_ADOPTION_UPLOADS" in workflow
          assert "last updated via the script API" in workflow
          assert "Aborting the upload operation because of conflicts" in workflow

          # #3523: preserve single-version/100%-traffic canonical active evidence.
          # Strict readonly still proves latest==active; new exact-main deploys
          # accept a pre-existing unactivated upload but pin both IDs before mutation.
          readonly_job = workflow.split("\n  cloudflare-readonly:", 1)[1].split("\n  deploy-production-code:", 1)[0]
          assert "cloudflare_served_version_cli.py resolve-active" in readonly_job
          assert ".result.deployments[0].versions[0].version_id" not in readonly_job
          assert ".result.deployments[0].versions[0].percentage" not in readonly_job
          # #2898: the latest==active equality authority is the canonical lineage
          # primitive. It publishes LATEST_VERSION_EQUALS_ACTIVE_VERSION itself and
          # fails closed by exit code, so the workflow must not restate the
          # comparison (INLINE_LATEST_ACTIVE_TEST=0) nor manufacture the PASS marker
          # (SELF_ASSERTED_PASS_MARKER=0), and the primitive must run before the
          # ACTIVE_VERSION publication it evidences.
          assert 'test "${latest}" = "${active}"' not in readonly_job
          assert "cloudflare_served_version_lineage.py" in readonly_job
          assert "b62_code_deploy_served_preflight.py" in readonly_job
          assert 'if [ "$' + '{{ inputs.mode }}' + '" = "deploy_production_code" ]; then' in readonly_job
          assert 'echo "latest_version=${latest}" >> "${GITHUB_OUTPUT}"' in readonly_job
          assert 'echo "LATEST_VERSION_EQUALS_ACTIVE_VERSION' not in readonly_job
          assert 'echo "active_version=${active}" >> "${GITHUB_OUTPUT}"' in readonly_job
          assert 'echo "ACTIVE_VERSION=${active}"' in readonly_job
          assert readonly_job.index("cloudflare_served_version_lineage.py") < readonly_job.index('echo "ACTIVE_VERSION=${active}"')
          assert "B62_CODE_DEPLOY_READONLY=PASS" in readonly_job

          # #2898 blocker fix: the readonly job runs the checked-in canonical lineage
          # primitive, and a job workspace is not shared between jobs, so the job must
          # check out the exact dispatch source read-only, before it invokes it.
          assert "actions/checkout@v4" in readonly_job
          assert "ref: $" + "{{ inputs.target_sha }}" in readonly_job
          assert "persist-credentials: false" in readonly_job
          assert readonly_job.index("actions/checkout@v4") < readonly_job.index(
              "cloudflare_served_version_lineage.py"
          )

          # The canonical lineage primitive is a shared authority: a change to it must
          # retrigger this consumer gate's natural PR CI.
          trigger_paths = workflow.split("on:", 1)[1].split("workflow_dispatch:", 1)[0]
          assert ".github/scripts/cloudflare_served_version_cli.py" in trigger_paths
          assert ".github/scripts/cloudflare_served_version_lineage.py" in trigger_paths

          assert "unsupported live binding type" in generator
          assert "SECRET_VALUES_READ=0" in generator
          assert "SECRET_VALUES_EMITTED=0" in generator
          assert "duplicate binding names" in generator
          assert "production_plan" in generator
          assert "allow_binding_removal" in generator
          assert "--dispatch-event" in workflow
          assert "inputs." + "set_var" not in workflow
          assert "tomllib" in generator
          assert "verify_mutation_zero" in generator

          assert "bucket_name" in binding_guard
          assert "jurisdiction" in binding_guard
          assert "environment" in binding_guard
          assert "unsupported binding type" in binding_guard
          assert "duplicate binding names" in binding_guard
          assert "SECRET_VALUES_READ=0" in binding_guard

          assert "python .github/scripts/b62_served_version_secret_guard.py capture" in workflow
          assert "b62-served-secret-set-before.json" in workflow
          assert "PREDEPLOY_SERVED_VERSION_IDENTIFIED=PASS" in workflow
          assert "POSTDEPLOY_SERVED_VERSION_IDENTIFIED=PASS" in workflow
          capture_pos = workflow.rindex("b62_served_version_secret_guard.py capture")
          deploy_pos = workflow.rindex("- name: Deploy production code preserving the full binding set")
          verify_pos = workflow.rindex("--verify-served")
          assert capture_pos < deploy_pos < verify_pos
          assert "ambiguous active deployment" in served_guard
          assert "duplicate binding names" in served_guard
          assert "type drift" in served_guard
          assert "missing pre-existing secret" in served_guard
          assert "PADIEM_CHAT_QUOTA_SALT" in served_guard
          assert "P01_ENGINE_CREDENTIAL" in served_guard
          assert "served version id is missing" in served_guard
          assert "SECRET_VALUES_READ=0" in served_guard
          assert "SECRET_VALUES_EMITTED=0" in served_guard
          assert "SETTINGS_PLANE_ONLY_ACCEPTANCE=NO" in served_guard
          assert '"text"' not in served_guard
          print("B62_SERVED_VERSION_SECRET_GUARD_SOURCE=PASS")
          print("B62_PRODUCTION_CODE_GATE_SOURCE=PASS")
          print("PRODUCTION_MUTATION=0")
          PY

  cloudflare-readonly:
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'repository_preflight' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      active_version: ${{ steps.audit.outputs.active_version }}
      latest_version: ${{ steps.audit.outputs.latest_version }}
      public_base_url_state: ${{ steps.audit.outputs.public_base_url_state }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Passed as an environment value rather than interpolated into the command, so a
      # dispatch input can never become shell text; the guard then refuses any id that
      # is not a canonical version UUID.
      PREVIOUS_VERSION_ID_INPUT: ${{ inputs.previous_version_id }}
    steps:
      # #2898: this job invokes the checked-in canonical lineage primitive, and a job
      # workspace is not shared between jobs, so it must check out the exact dispatch
      # source itself. Read-only: no credential persistence, no write permission.
      - name: Checkout exact dispatch source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check canonical shared Chat/Claw/B66 UI copy bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_shared_conversation_composer.py --check
          test -f apps/padiem-chat/static/shared-conversation-scroll.js
          python3 scripts/sync_shared_conversation_scroll.py --check
          test -f apps/padiem-chat/static/shared-answer-copy.js
          python3 scripts/sync_shared_answer_copy.py --check

      - name: Read-only deployed state audit
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${B62_WORKER}"

          settings="${RUNNER_TEMP}/b62-settings-readonly.json"
          bash .github/scripts/b62_cloudflare_504_readonly_get.sh "${api}/settings" "${settings}"
          jq -e '.success == true and (.result.bindings | type == "array")' "${settings}" >/dev/null
          jq -c '.result.observability | {enabled, head_sampling_rate, logs: (.logs | {enabled, invocation_logs, head_sampling_rate})}' "${settings}" | sed 's/^/B62_LIVE_OBSERVABILITY=/'

          # #4194: live override may retain 20s although source default is
          # 600s. This is read-only; warn without blocking unrelated releases
          # or silently rewriting an Owner-authoritative production binding.
          python3 .github/scripts/b62_stream_model_timeout_readback.py \
            --settings "${settings}"

          deployments="${RUNNER_TEMP}/b62-deployments-readonly.json"
          bash .github/scripts/b62_cloudflare_504_readonly_get.sh "${api}/deployments" "${deployments}"
          active="$(python3 .github/scripts/cloudflare_served_version_cli.py resolve-active --deployments "${deployments}")"
          test -n "${active}"

          versions="${RUNNER_TEMP}/b62-versions-readonly.json"
          bash .github/scripts/b62_cloudflare_504_readonly_get.sh "${api}/versions?page=1&per_page=1" "${versions}"
          latest="$(jq -r '.result.items[0].id // empty' "${versions}")"
          # For read-only audit preserve the canonical latest==active guard.
          # For exact-main NEW code deploy validate both IDs, tolerate an uploaded
          # undeployed version, then recheck both IDs unchanged before mutation.
          if [ "${{ inputs.mode }}" = "deploy_production_code" ]; then
            # New exact-main code deploys may supersede an unactivated upload.
            # Validate both IDs, then lock both again before mutation below.
            python3 .github/scripts/b62_code_deploy_served_preflight.py \
              --active-version="$active" \
              --latest-version="$latest"
          elif [ "${{ inputs.mode }}" = "recover_p01_sse_off" ]; then
            python3 .github/scripts/b62_code_deploy_served_preflight.py \
              --active-version="$active" \
              --latest-version="$latest"
          elif [ "${{ inputs.mode }}" = "rollback_production_code" ]; then
            # A refused post-deploy audit restores traffic to the recorded version but
            # leaves the refused upload as the newest one, so latest != active is the
            # scar of the failure a rollback is here to confirm. Refusing on it would
            # lock the only read that proves the scar is inert, so the mismatch is
            # warned and the recorded id is validated against served history instead.
            python3 .github/scripts/b62_rollback_recorded_version_guard.py \
              --deployments "${deployments}" \
              --newest-upload-version="${latest}" \
              --previous-version-id="${PREVIOUS_VERSION_ID_INPUT}"
          else
            # Preserve canonical strict lineage for all normal read-only modes.
            python3 .github/scripts/cloudflare_served_version_lineage.py \
              --active-version="${active}" \
              --latest-version="${latest}"
          fi
          echo "latest_version=${latest}" >> "${GITHUB_OUTPUT}"
          echo "active_version=${active}" >> "${GITHUB_OUTPUT}"
          echo "ACTIVE_VERSION=${active}"

          # #3936 partial-rollback safety: script-level settings may inherit
          # SSE=true while the active served Worker is the earlier SSE-OFF version.
          served_detail="${RUNNER_TEMP}/b62-active-served-settings-preflight.json"
          bash .github/scripts/b62_cloudflare_504_readonly_get.sh "${api}/versions/${active}" "${served_detail}"
          # Read-only Grafana binding readiness. Emit booleans only.
          python3 - "${settings}" "${served_detail}" <<'PY'
          import json
          import sys
          checks = {
              "ENDPOINT": ("PADIEM_GRAFANA_OTLP_ENDPOINT", "plain_text", "text",
                           "https://otlp-gateway-prod-ap-northeast-0.grafana.net/otlp/v1/logs"),
              "USERNAME": ("PADIEM_GRAFANA_OTLP_USERNAME", "plain_text", "text", "1876517"),
              "SECRET_BINDING": ("PADIEM_GRAFANA_OTLP_TOKEN", "secrets_store_secret", "store_id",
                                 "f0b09ca04a7b43248154c773704a5616"),
          }
          for plane, filepath in (("SETTINGS", sys.argv[1]), ("SERVED", sys.argv[2])):
              doc = json.load(open(filepath, encoding="utf-8"))
              result = doc.get("result", {})
              bindings = (result.get("bindings") if plane == "SETTINGS" else
                          result.get("resources", {}).get("bindings"))
              if isinstance(bindings, dict):
                  bindings = [{**v, "name": k} for k, v in bindings.items() if isinstance(v, dict)]
              if not isinstance(bindings, list):
                  bindings = []
              for label, (name, kind, field, value) in checks.items():
                  found = [x for x in bindings if isinstance(x, dict) and x.get("name") == name]
                  exact = len(found) == 1 and found[0].get("type") == kind and found[0].get(field) == value
                  if label == "SECRET_BINDING" and exact:
                      exact = found[0].get("secret_name") == name
                  print(f"B62_GRAFANA_{plane}_{label}={'EXACT' if exact else 'ABSENT_OR_DRIFT'}")
          print("B62_GRAFANA_METADATA_READONLY=YES")
          PY
          if [ "${{ inputs.mode }}" = "recover_p01_sse_off" ]; then
            python .github/scripts/b62_p01_sse_snapshot_off_recovery.py candidate \
              --settings "${settings}" --served-version "${served_detail}"
          else
            python .github/scripts/b62_sse_served_config_drift_guard.py \
              --settings "${settings}" --served-version "${served_detail}"
          fi

          jq -e --arg name "${IDENTITY_BINDING}" --arg service "${IDENTITY_WORKER}" \
            '[.result.bindings[] | select(.name == $name)] as $b |
             ($b | length) == 1 and $b[0].type == "service" and $b[0].service == $service' "${settings}" >/dev/null
          echo "IDENTITY_BINDING=PRESENT_EXPECTED"
          jq -e --arg name "B14_SERVICE" --arg service "${B14_WORKER}" \
            '[.result.bindings[] | select(.name == $name)] as $b |
             ($b | length) == 1 and $b[0].service == $service' "${settings}" >/dev/null
          jq -e '[.result.bindings[] | select(.type == "d1" and .name == "PADIEM_CHAT_DB")] | length == 1' "${settings}" >/dev/null
          jq -e '[.result.bindings[] | select(.type == "assets" and .name == "ASSETS")] | length == 1' "${settings}" >/dev/null
          jq -e --arg name "${IDENTITY_BINDING}" '[.result.bindings[] | .name] | length == (unique | length)' "${settings}" >/dev/null

          public_state="$(python - "${settings}" "${B62_PUBLIC_BASE_URL}" <<'PY'
          import json
          import sys

          bindings = json.load(open(sys.argv[1], encoding="utf-8"))["result"]["bindings"]
          current = [b.get("text") for b in bindings if b.get("name") == "PADIEM_CHAT_PUBLIC_BASE_URL"]
          if not current:
              print("absent")
          elif current == [sys.argv[2]]:
              print("expected")
          else:
              print("drift")
          PY
          )"
          echo "public_base_url_state=${public_state}" >> "${GITHUB_OUTPUT}"
          echo "PADIEM_CHAT_PUBLIC_BASE_URL_STATE=${public_state}"
          test "${public_state}" = "expected"

          # An absent Custom Domain in the generated wrangler config made
          # strict upload protection must never silently detach chat.padiem.net.
          domain_before="${RUNNER_TEMP}/b62-custom-domain-before.json"
          bash .github/scripts/b62_cloudflare_504_readonly_get.sh \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=chat.padiem.net" \
            "${domain_before}"
          jq -e --arg host "chat.padiem.net" --arg service "${B62_WORKER}" \
            '.success == true and
             ([.result[] | select(.hostname == $host)] | length == 1) and
             ([.result[] | select(.hostname == $host and .service == $service and .zone_name == "padiem.net" and .enabled == true and .previews_enabled == false)] | length == 1)' \
            "${domain_before}" >/dev/null
          echo "B62_CANONICAL_CUSTOM_DOMAIN=ATTACHED_EXPECTED"

          subdomain="${RUNNER_TEMP}/b62-subdomain-readonly.json"
          subdomain_status="$(curl -sS "${auth[@]}" "${api}/subdomain" -o "${subdomain}" -w '%{http_code}' || true)"
          workers_health="${RUNNER_TEMP}/b62-workers-dev-health-readonly.json"
          workers_status="$(curl -sS --connect-timeout 8 --max-time 15 "https://${B62_WORKER}.charliekant.workers.dev/health" -o "${workers_health}" -w '%{http_code}' || true)"
          custom_health="${RUNNER_TEMP}/b62-custom-health-readonly.json"
          custom_status="$(curl -sS --connect-timeout 8 --max-time 15 "${B62_PUBLIC_BASE_URL}/health" -o "${custom_health}" -w '%{http_code}' || true)"
          python .github/scripts/b62_public_origin_504_guard.py \
            --metadata-status "${subdomain_status}" --metadata-body "${subdomain}" \
            --workers-status "${workers_status}" --workers-body "${workers_health}" \
            --custom-status "${custom_status}" --custom-body "${custom_health}"
          echo "B62_PUBLIC_ORIGIN=CHAT_PADIEM_NET"

          # #4139: Oracle Mesh lane presence readback. Names, kinds and the
          # non-secret execution mode only — the channel secret value and the
          # raw ownership map are never printed. A missing account pin or a
          # missing binding is reported as a state, never repaired here.
          python3 - "${settings}" <<'PY'
          import json
          import sys

          bindings = json.load(open(sys.argv[1], encoding="utf-8"))["result"]["bindings"]
          texts = {b.get("name"): b.get("text") for b in bindings
                   if isinstance(b, dict) and b.get("type") == "plain_text"}
          mode = texts.get("ORACLE_MESH_EXECUTION_MODE")
          print("ORACLE_MESH_EXECUTION_MODE=" + (mode if mode in ("mesh", "native", "off") else "absent"))
          raw_map = texts.get("ORACLE_MESH_OWNERSHIP_MAP")
          if not isinstance(raw_map, str) or not raw_map:
              print("ORACLE_MESH_OWNERSHIP_MAP_PLAINTEXT=absent")
          else:
              try:
                  rows = json.loads(raw_map)
              except ValueError:
                  rows = None
              if not isinstance(rows, list) or not rows:
                  print("ORACLE_MESH_OWNERSHIP_MAP=malformed")
              else:
                  pinned = sum(1 for r in rows
                               if isinstance(r, dict) and isinstance(r.get("account_ref"), str)
                               and bool(r["account_ref"]))
                  print("ORACLE_MESH_OWNERSHIP_MAP=present rows=%d pinned=%d" % (len(rows), pinned))
          secret = [b.get("type") for b in bindings
                    if isinstance(b, dict) and b.get("name") == "ORACLE_MESH_CHANNEL_SECRET"]
          print("ORACLE_MESH_CHANNEL_SECRET_BINDING=" + (secret[0] if len(secret) == 1 else "absent"))
          owner_map = [b.get("type") for b in bindings
                       if isinstance(b, dict) and b.get("name") == "ORACLE_MESH_OWNERSHIP_MAP"]
          print("ORACLE_MESH_OWNERSHIP_MAP_BINDING=" + (owner_map[0] if len(owner_map) == 1 else "absent"))
          PY

          echo "B62_CODE_DEPLOY_READONLY=PASS"
          echo "PRODUCTION_MUTATION=0"

      # #5223: the live binding set must match the reviewed name+type
      # baseline. The Owner D1 release path used to pin the binding set with
      # a magic count, so every later reviewed additive install blocked it
      # with an opaque count mismatch. Comparing by name and type keeps the
      # expectation reviewable, and running it here means a binding change
      # that nobody reviewed fails closed BEFORE any deploy mutation.
      #
      # Scope: this gate's credential is deliberately locked to the B62
      # Worker (#3930), so it proves the B62 baseline only. The Owner D1
      # preparation proves both Workers' baselines on its own approved reads.
      - name: Prove the live binding set matches the reviewed baseline
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts"

          chat_settings="${RUNNER_TEMP}/baseline-chat-settings.json"
          chat_served="${RUNNER_TEMP}/baseline-chat-served-version.json"
          active="${{ steps.audit.outputs.active_version }}"
          test -n "${active}"
          bash .github/scripts/b62_cloudflare_504_readonly_get.sh "${api}/${B62_WORKER}/settings" "${chat_settings}"
          bash .github/scripts/b62_cloudflare_504_readonly_get.sh "${api}/${B62_WORKER}/versions/${active}" "${chat_served}"
          # The reviewed baseline is proved against the version that is answering
          # requests. GET /settings follows the newest upload, so a deploy that served
          # a version and then refused it leaves that plane describing bindings no
          # traffic ever ran; proving against it would either block every later
          # release or teach the next generated config to carry that residue forward.
          if [ "${{ inputs.mode }}" = "rollback_production_code" ]; then
            # A rollback goes back to the bindings the version being returned to
            # already carried, so the deploy-time baseline cannot be the gate here
            # - the set it compares is precisely what the rollback is leaving
            # behind. On 2026-10-28 this step blocked the gate's own rollback with
            # BINDING_SET_DRIFT while Chat was answering 500 on every signed-in
            # path, and the CTO had to run `wrangler rollback` to
            # 2fb11b2b-606c-44c8-a5ff-d66c6b53dc53 by hand at 11:50.
            # The comparison still runs, because the residue of the version being
            # left is worth reading - it decides nothing. That the target exists
            # and is a recorded version is proved by the rollback job, against the
            # Worker's own version history, and this does not touch it.
            if python3 .github/scripts/b62_binding_baseline.py \
              --worker "${B62_WORKER}" --payload "${chat_served}"; then
              echo "B62_ROLLBACK_LEAVING_VERSION_BINDINGS=MATCHES_BASELINE"
            else
              echo "B62_ROLLBACK_LEAVING_VERSION_BINDINGS=RESIDUE_NOTED"
            fi
            if python3 .github/scripts/b62_binding_baseline.py \
              --worker "${B62_WORKER}" --payload "${chat_settings}" \
              > "${RUNNER_TEMP}/b62-baseline-settings-plane.txt" 2>&1; then
              echo "B62_SETTINGS_PLANE_MATCHES_BASELINE=PASS"
            else
              # Bounded: the settings plane is compared, never echoed.
              echo "B62_SETTINGS_PLANE_BINDING_RESIDUE=PRESENT"
            fi

            echo "B62_BINDING_BASELINE=PASS"
            echo "B62_BINDING_BASELINE_VALUES_EMITTED=0"
            echo "B62_BINDING_BASELINE_WORKERS=${B62_WORKER}"
            echo "PRODUCTION_MUTATION=0"
          fi

  deploy-production-code:
    needs: [source-contract, cloudflare-readonly]
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'deploy_production_code' || inputs.mode == 'recover_p01_sse_off') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
      actions: read
    env:
      P01_SSE_RECOVERY_OFF: ${{ inputs.mode == 'recover_p01_sse_off' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      READONLY_ACTIVE_VERSION: ${{ needs.cloudflare-readonly.outputs.active_version }}
      READONLY_LATEST_VERSION: ${{ needs.cloudflare-readonly.outputs.latest_version }}
      PUBLIC_BASE_URL_STATE: ${{ needs.cloudflare-readonly.outputs.public_base_url_state }}
      CONFIRMATION: ${{ inputs.confirmation }}
      ALLOW_BINDING_REMOVAL: ${{ inputs.allow_binding_removal }}
    steps:
      - name: Require explicit production code deploy authorization
        shell: bash
        run: |
          set -euo pipefail
          if [ "${P01_SSE_RECOVERY_OFF}" = "true" ]; then
            test "${CONFIRMATION}" = "RECOVER_B62_P01_SSE_OFF_FROM_PINNED_SNAPSHOT"
            echo "SSE_RECOVERY_OFF_OWNER_AUTHORIZED=PASS"
            echo "RECOVERY_MUTATES_ONLY_UNACCEPTED_SSE_FLAG=REMOVE"
          else
            test "${CONFIRMATION}" = "DEPLOY_B62_PRODUCTION_CODE_FROM_EXACT_MAIN"
          fi
      - name: Checkout exact approved main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      # #5895: a pull request merged while this run was starting used to break
      # it, even when nothing in Chat had moved. The target now has to be
      # current for the paths this gate ships: an ancestor of main whose
      # apps/padiem-chat content is unchanged. A moved app path still fails.
      - name: Reconfirm exact main immediately before mutation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "${GITHUB_SHA}" = "${TARGET_SHA}"
          git fetch --no-tags --depth=1 origin main
          if ! test "$(git rev-parse origin/main)" = "${TARGET_SHA}"; then
            # #5895: main moved ahead while this run was starting. A target that
            # is an ancestor of main still ships, as long as nothing under
            # apps/padiem-chat moved between the two -- that directory is the whole
            # surface this gate deploys. A moved path stops the run exactly as an
            # unequal SHA did before, so a stale release is never waved through.
            python3 .github/scripts/main_currency_guard.py --target "${TARGET_SHA}" --path apps/padiem-chat --path packages
          fi
          echo "PREMUTATION_EXACT_MAIN_SHA=PASS"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
