name: B01 V5 Human Review Raster Cleanup 2026-08-11
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/b01-v5-review-raster-fix-20260811.yml'
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --quiet pillow
      - name: Rebuild review photo with all source handwriting defocused
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://images.pexels.com/photos/5582874/pexels-photo-5582874.jpeg?cs=srgb&dl=pexels-thirdman-5582874.jpg&fm=jpg' -o /tmp/review.jpg
          cat > /tmp/fix.py <<'PY'
          from PIL import Image,ImageEnhance,ImageFilter,ImageDraw
          from pathlib import Path
          im=Image.open('/tmp/review.jpg').convert('RGB')
          tw,th=1500,980; w,h=im.size; s=max(tw/w,th/h); nw,nh=round(w*s),round(h*s)
          im=im.resize((nw,nh),Image.Resampling.LANCZOS)
          left=max(0,min(nw-tw,round((nw-tw)*.54))); top=max(0,min(nh-th,round((nh-th)*.42)))
          im=im.crop((left,top,left+tw,top+th))
          im=ImageEnhance.Color(im).enhance(.62); im=ImageEnhance.Contrast(im).enhance(1.08)
          paper=Image.new('RGB',im.size,(242,238,228)); im=Image.blend(im,paper,.04)
          # Source photo contains handwriting/print. Remove legibility while preserving hands/paper as evidence.
          for box,r in [((0,0,1500,250),15),((470,80,1060,470),14),((0,490,1500,980),2.8)]:
              region=im.crop(box).filter(ImageFilter.GaussianBlur(r)); im.paste(region,box)
          ov=Image.new('RGBA',im.size,(0,0,0,0)); d=ImageDraw.Draw(ov); coral=(183,70,45,215)
          d.line([(120,770),(520,752)],fill=coral,width=7); d.ellipse((1090,655,1218,783),outline=coral,width=7)
          im=Image.alpha_composite(im.convert('RGBA'),ov).convert('RGB')
          out=Path('apps/personal-edition/static/images/v5/human-proof-review.webp')
          im.save(out,'WEBP',quality=82,method=6)
          print(out,out.stat().st_size)
          PY
          python /tmp/fix.py
      - name: Commit corrected review image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/personal-edition/static/images/v5/human-proof-review.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'assets(B01): remove readable source text from review raster'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
