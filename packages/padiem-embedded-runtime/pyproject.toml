[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "padiem-embedded-runtime"
version = "0.1.0"
description = "Browser-safe embedded shell boundary contracts for Padiem host products (IP-SIDECAR)"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["padiem_embedded_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
