[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "padiem-control-plane"
version = "0.1.0"
description = "Product-neutral identity, entitlement, usage-ledger, and billing-foundation contracts for Padiem"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["padiem_control_plane*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
