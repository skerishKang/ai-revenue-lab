[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "padiem-control-plane"
version = "0.1.0"
description = "Product-neutral identity, entitlement, usage-ledger, and billing-foundation contracts for Padiem"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  # com2_identity_rpc_ingress.py (the COM2 CPython ingress adapter, production
  # code inside this package) is built on starlette; its contract test imports
  # the module, so the test environment must provide it.
  "starlette>=0.37,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["padiem_control_plane*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
