[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "padiem-ai-core"
version = "0.6.0"
description = "Shared product-neutral AI runtime contracts and bounded capabilities for Padiem products"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
tools = [
  "jsonschema>=4.23,<5",
]
dev = [
  "pytest>=8,<10",
  "jsonschema>=4.23,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["padiem_ai_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]