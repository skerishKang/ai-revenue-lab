{% extends "base.html" %}
{% block title %}{{ t("page_new_topic") }} — Personal Video Archive{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ t("page_new_topic") }}</h1>
</div>

<form method="post" action="{{ lp }}/topics" class="form">
    <div class="form-group">
        <label for="name">{{ t("form_topic_name") }}</label>
        <input type="text" id="name" name="name" required maxlength="120"
               placeholder="{{ t('form_topic_name_ph') }}">
    </div>
    <div class="form-group">
        <label for="intent">{{ t("form_intent") }}</label>
        <textarea id="intent" name="intent" required rows="4" maxlength="2000"
                  placeholder="{{ t('form_intent_ph') }}"></textarea>
        <p class="help-text">{{ t("form_intent_help") }}</p>
    </div>
    <button type="submit" class="btn btn-primary">{{ t("action_generate_rules") }}</button>
</form>
{% endblock %}
