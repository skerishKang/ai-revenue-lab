<nav class="filters" aria-label="{{ t('form_viewing_state') }}">
    {% for fs in feed_states %}
    <a href="{{ lp }}/topics/{{ topic_id }}?state={{ fs }}"
       class="filter-chip {% if fs == current_state_filter %}active{% endif %}"
       data-state="{{ fs }}"
       {% if fs == current_state_filter %}aria-current="page"{% endif %}>
        {{ t("state_" + fs) }}
    </a>
    {% endfor %}
</nav>
