[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "padiem-parliament-rules"
version = "0.1.0"
description = "Content-rule authority for the PADIEM Parliament AI: country x institution tier x document kind, sourced from #6014 to #6026. Contract and data only; no runtime wiring, no engine, no RAG."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["parliament_rules*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
