
  <main id="main" class="section">

      <div class="media-grid" id="mediaGrid"></div>

          <button class="lightbox-close" id="lightboxClose" type="button" aria-label="크게 보기 닫기">×</button>
        </div>
        <div class="lightbox-body">
          <button class="lightbox-nav lightbox-prev" id="lightboxPrev" type="button" aria-label="이전 사진">←</button>

        </div>
        <div class="lightbox-foot">
          <h2 id="lightboxTitle"></h2>
          <p class="source-note lightbox-source" id="lightboxSource" hidden></p>

      </dialog>

      <section class="media-more" aria-labelledby="mediaMoreTitle">

        <ul class="link-list" id="mediaMore"></ul>
      </section>
      <div class="media-video">
        <video controls preload="metadata" poster="https://media.padiem.net/councillor/miraen/hero/poster-2025-v1.jpg">

        <p class="source-note">영상: 의원실 제공 자료</p>
