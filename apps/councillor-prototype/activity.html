
  <main id="main" class="section">
    <div class="section-inner">
      <p class="section-eyebrow">기록</p>
      <h1 class="section-title">의정활동</h1>
      <p class="section-lead">공식 기록에 근거한 의정활동 목록입니다.</p>
      <p class="activity-status" id="activityStatus" role="status" hidden></p>
      <div class="activity-toolbar">
        <input type="search" id="activitySearch" placeholder="활동 검색..." aria-label="의정활동 검색" />
        <select id="activityFilter" aria-label="분류 필터">
          <option value="all">전체</option>
          <option value="의회">의회</option>
          <option value="본회의">본회의</option>
          <option value="위원회">위원회</option>
          <option value="당선">당선</option>
          <option value="기념식">기념식</option>
          <option value="5분발언">5분발언</option>
          <option value="토론회">토론회</option>
        </select>
      </div>
      <p class="activity-legend" id="activityLegend" aria-label="분류 설명"></p>
      <h2 id="combinedActivityHeading" hidden>의정활동 검색 결과</h2>
      <ul class="activity-list" id="activityList" aria-live="polite"></ul>
      <div class="activity-detail" id="activityDetail" hidden>
        <button class="back-btn" id="activityBack" type="button">← 목록으로</button>
        <h2 id="detailTitle" tabindex="-1"></h2>
        <p class="detail-date" id="detailDate"></p>
        <div class="detail-body" id="detailBody"></div>
        <div class="activity-terms" id="detailTerms" hidden></div>
        <a class="detail-link" id="detailLink" href="#" target="_blank" rel="noopener">공식 페이지 보기</a>
        <button class="share-btn" id="activityShare" type="button" hidden>공유하기</button>
        <p class="share-status" id="shareStatus" role="status" aria-live="polite" hidden></p>
      </div>
      <section id="combinedPolicy" class="combined-policy" hidden aria-labelledby="combinedPolicyTitle">
        <h2 id="combinedPolicyTitle">정책자료 검색 결과</h2>
        <ul id="combinedPolicyList" class="activity-list" aria-live="polite"></ul>
      </section>
      <p class="source-note">출처: 전남광주통합특별시의회·광주광역시의회 공식 페이지, 중앙선거관리위원회 공개 자료</p>
    </div>
  </main>
