{% extends "base.html" %}
{% block title %}편집 메모 완료 — Personal Edition{% endblock %}
{% block content %}
{% set _base = _link_prefix if _link_prefix is defined else '/p/' ~ participant.id %}
<div class="thanks-page">
  <h1>편집 메모가 다음 호에 전달되었습니다.</h1>
  <p>에디션 #{{ edition_number }}에 대한 피드백을 보내주셔서 감사합니다.</p>
  <div class="thanks-actions">
    <a href="{{ _base }}/" class="btn btn-primary">홈으로 돌아가기</a>
    <a href="{{ _base }}/history/" class="btn btn-secondary">기록 보기</a>
  </div>
</div>
{% endblock %}
