[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "padiem-chat"
version = "0.2.0"
description = "Padiem Chat Business 62 runtime"
requires-python = ">=3.11"
dependencies = [
  "starlette>=0.37,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
  # #5023: the Calendar contracts validate explicit timezone identifiers
  # against the real IANA database (a shape-valid but nonexistent zone such as
  # "Mars/Olympus" must be refused at write time). The Worker runtime ships no
  # system tz database -- Pyodide has no /usr/share/zoneinfo -- so `zoneinfo`
  # raises ZoneInfoNotFoundError for every real zone there and the Calendar
  # routes surface it as HTTP 400 `invalid_timezone`. The database therefore
  # has to be part of the Worker's vendored dependency set, not only the
  # dev/test one.
  "tzdata>=2025.1,<2028",
  "padiem-ai-core[documents] @ file://${PROJECT_ROOT}/../../packages/padiem-ai-core",
  "padiem-ai-engine-client @ file://${PROJECT_ROOT}/../padiem-ai-engine/clients/python",
  "padiem-control-plane @ file://${PROJECT_ROOT}/../../packages/padiem-control-plane",
  "korean-ai-code-agent @ file://${PROJECT_ROOT}/../korean-ai-code-agent",
]

[project.optional-dependencies]
dev = [
  "cryptography>=42,<47",
  "PyMuPDF==1.26.3",
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "workers-py>=1.16.2,<2",
  "workers-runtime-sdk>=1.6.3",
]

[tool.pywrangler]
allow-build = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "byok_direct: product -> customer provider directly, without B14",
    "b14_managed: product -> B14 managed route/selection/fallback boundary",
    "no_model: no model or engine execution boundary",
    "mock: model or engine response substituted; logic contract only, not live E2E",
]
#4070: Report the slowest pytest phases in CI without changing test selection.
# The complete existing suite still runs; no hard-coded test count.
addopts = "--durations=50 --durations-min=0.2"
