[project]
name = "padiem-chat"
version = "0.1.0"
description = "Padiem Chat Business 62 runtime"
requires-python = ">=3.11"
dependencies = [
  "starlette>=0.37,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
