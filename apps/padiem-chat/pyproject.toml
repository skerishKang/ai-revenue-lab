[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "padiem-chat"
version = "0.2.0"
description = "Padiem Chat Business 62 runtime"
requires-python = ">=3.11"
dependencies = [
  "starlette>=0.37,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
  "pypdf>=6.16.2,<7",
  "openpyxl>=3.1,<4",
  "padiem-ai-core @ file://${PROJECT_ROOT}/../../packages/padiem-ai-core",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "workers-py>=1.16.2,<2",
  "workers-runtime-sdk>=1.6.3",
]

[tool.pywrangler]
allow-build = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
