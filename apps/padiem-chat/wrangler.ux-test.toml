# B62-1090-010 TEST-ONLY candidate.
#
# Upload with `wrangler versions upload` only. This config must never be used
# with `wrangler deploy`. The candidate is placed beside the current Production
# version at 0% and reached only through a Cloudflare version override.
# Existing vars/secrets are inherited; the Poolside Secrets Store binding is
# intentionally not redeclared here.

name = "padiem-chat"
main = "worker_ux_test.py"
compatibility_date = "2026-08-25"
compatibility_flags = ["python_workers"]
workers_dev = true
keep_vars = true

[assets]
directory = "static"
binding = "ASSETS"

[vars]
PADIEM_CHAT_TEST_TASK_ID = "B62-1090-PADIEM-CHAT-DIRECT-POOLSIDE-CONTROLLED-PRODUCTION-010"

[[services]]
binding = "B14_SERVICE"
service = "ai-revenue-korean-ai-platform"
environment = "production"

[[d1_databases]]
binding = "PADIEM_CHAT_DB"
database_id = "702bb62b-36f5-41a0-973f-c4f663ee01e6"
