<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Padiem Chat</title>
  <meta name="description" content="누구나 바로 사용할 수 있는 파디엠의 기본 AI 인터페이스" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./attachments.css" />
  <link rel="stylesheet" href="./history.css" />
  <style>[hidden] { display: none !important; }</style>
</head>
<body>
  <div class="app-shell" data-state="home">
    <aside class="sidebar" id="sidebar" aria-label="주요 메뉴">
      <div class="brand-row">
        <button class="mobile-close" id="mobileClose" aria-label="메뉴 닫기">×</button>
        <a class="brand" href="./" aria-label="Padiem Chat 홈"><span class="brand-mark" aria-hidden="true">P</span><span>Padiem Chat</span></a>
      </div>
      <button class="new-chat" id="newChatButton" type="button"><span aria-hidden="true">＋</span><span>새 채팅</span></button>
      <nav class="side-nav" aria-label="채팅 메뉴">
        <button class="side-item" type="button" disabled aria-disabled="true"><span class="side-icon" aria-hidden="true">⌕</span><span>검색</span><span class="mini-badge">준비 중</span></button>
        <button class="side-item" type="button" disabled aria-disabled="true"><span class="side-icon" aria-hidden="true">▦</span><span>프로젝트</span><span class="mini-badge">준비 중</span></button>
      </nav>
      <section class="recent-section" id="historySection" aria-labelledby="historyTitle" hidden>
        <h2 id="historyTitle">최근 대화</h2>
        <div id="historyList"></div>
        <p class="history-empty" id="historyEmpty" hidden>저장된 대화가 없습니다.</p>
      </section>
      <section class="recent-section" aria-labelledby="recentTitle">
        <h2 id="recentTitle">추천 질문</h2>
        <button class="recent-item" type="button" data-prompt="AI를 아주 쉽게 설명해줘" data-skill="explain">AI를 쉽게 설명해줘</button>
        <button class="recent-item" type="button" data-prompt="3박 4일 제주도 가족 여행 계획을 짜줘" data-skill="plan">제주도 여행 계획</button>
        <button class="recent-item" type="button" data-prompt="오늘 저녁 메뉴를 세 가지 추천해줘" data-skill="brainstorm">저녁 메뉴 추천</button>
      </section>
      <div class="sidebar-footer"><span class="preview-dot" aria-hidden="true"></span><span>자동 추천으로 답변합니다</span></div>
    </aside>
    <div class="sidebar-scrim" id="sidebarScrim" hidden></div>
    <main class="main-panel">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="메뉴 열기">☰</button>
        <div class="model-pill" aria-label="현재 모델 선택"><span class="status-spark" aria-hidden="true">✦</span><span>자동 추천</span></div>
        <div class="account-controls">
          <span class="account-name" id="accountName" hidden></span>
          <button class="login-button" id="loginButton" type="button" disabled aria-disabled="true" title="로그인 기능이 설정되지 않았습니다">로그인</button>
        </div>
      </header>
      <section class="conversation" aria-live="polite">
        <div class="empty-state" id="emptyState">
          <p class="eyebrow">PADIEM AI</p>
          <h1>안녕하세요.<br />무엇을 도와드릴까요?</h1>
          <p class="empty-copy">궁금한 것을 평소 말하듯 편하게 물어보세요. 어떤 AI를 쓸지는 파디엠이 자동으로 고릅니다.</p>
          <div class="starter-grid" aria-label="추천 질문">
            <button type="button" class="starter" data-prompt="AI를 처음 쓰는 사람에게 AI가 뭔지 아주 쉽게 설명해줘" data-skill="explain"><span class="starter-icon" aria-hidden="true">☺</span><span><strong>쉽게 설명해줘</strong><small>어려운 내용도 쉬운 말로</small></span></button>
            <button type="button" class="starter" data-prompt="이번 주말 가족과 집 근처에서 할 만한 일을 추천해줘" data-skill="plan"><span class="starter-icon" aria-hidden="true">⌂</span><span><strong>생활 도움</strong><small>일상 질문과 계획 세우기</small></span></button>
            <button type="button" class="starter" disabled aria-disabled="true"><span class="starter-icon" aria-hidden="true">▤</span><span><strong>문서 요약</strong><small>PDF·문서 파일 · 다음 단계</small></span></button>
            <button type="button" class="starter" disabled aria-disabled="true"><span class="starter-icon" aria-hidden="true">⌕</span><span><strong>웹에서 찾아줘</strong><small>웹 검색 · 준비 중</small></span></button>
          </div>
        </div>
        <div class="message-list" id="messageList" hidden></div>
      </section>
      <section class="composer-wrap" aria-label="메시지 작성">
        <form class="composer" id="composerForm">
          <div class="attachment-tray" id="attachmentTray" hidden>
            <div class="attachment-preview">
              <img id="attachmentThumb" alt="선택한 사진 미리보기" />
              <div class="attachment-copy"><strong id="attachmentName"></strong><small id="attachmentSize"></small></div>
              <button id="removeAttachment" class="attachment-remove" type="button" aria-label="첨부 사진 제거">×</button>
            </div>
          </div>
          <label for="messageInput" class="sr-only">메시지 입력</label>
          <textarea id="messageInput" rows="1" placeholder="무엇이든 물어보세요" autocomplete="off" maxlength="8000"></textarea>
          <div class="composer-actions">
            <div class="composer-tools">
              <input id="imageFileInput" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" hidden />
              <button type="button" class="tool-button" id="imageAttachButton" title="JPEG, PNG, WebP 사진 한 장을 첨부합니다"><span aria-hidden="true">＋</span><span>사진</span></button>
              <button type="button" class="tool-button" disabled aria-disabled="true" title="웹 검색은 준비 중입니다"><span aria-hidden="true">⌕</span><span>웹 검색</span></button>
            </div>
            <button class="send-button" id="sendButton" type="submit" aria-label="메시지 보내기" disabled><span aria-hidden="true">↑</span></button>
          </div>
        </form>
        <p class="composer-note" id="runtimeNote">일반 질문과 JPEG·PNG·WebP 사진 1장 첨부를 지원합니다. 로그인은 설정된 환경에서 최근 대화를 저장합니다.</p>
      </section>
    </main>
  </div>
  <template id="userMessageTemplate"><article class="message user-message"><div class="message-bubble"></div></article></template>
  <template id="assistantMessageTemplate"><article class="message assistant-message"><div class="assistant-avatar" aria-hidden="true">P</div><div class="assistant-body"><div class="assistant-meta"><span>Padiem Chat</span><span class="demo-label" data-runtime-label>답변 준비 중</span></div><div class="assistant-content"></div></div></article></template>
  <script src="./app.js"></script>
</body>
</html>
