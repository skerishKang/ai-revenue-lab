name = "padiem-com2-backup"
main = "worker.py"
compatibility_date = "2026-08-25"
# ``python_workers`` selects the Python runtime. ``disable_python_external_sdk``
# makes ``from workers import ...`` resolve to the runtime-provided SDK: plain
# ``wrangler deploy`` failed validation with ``ModuleNotFoundError: workers``
# without it (the external SDK is only provisioned by the workers-py toolchain).
compatibility_flags = ["python_workers", "disable_python_external_sdk"]
# No workers.dev or preview URL. The only ingress is the dedicated custom
# domain below, and every route on it requires the bearer token.
workers_dev = false
preview_urls = false

# Single-purpose ingress for the COM2 transfer client. A dedicated hostname
# keeps the endpoint isolated from the Chat/Engine routes on the same zone.
# No existing route is replaced.
routes = [
  { pattern = "com2-backup.padiem.net", custom_domain = true }
]

# Fail-closed deployment gate. This file keeps it OFF. Only an Owner-authorized
# release may flip it; committing "true" here is not a deployment decision.
[vars]
COM2_BACKUP_ENABLED = "false"

# Reuse the existing private R2 bucket and its existing access boundary. No new
# bucket is created and no lifecycle/retention rule is declared. Backups live
# under the isolated ``com2-backup/v1/`` key prefix. If the Owner later decides a
# dedicated bucket is required, only ``bucket_name`` changes; the Worker code and
# route contract stay the same.
[[r2_buckets]]
binding = "COM2_BACKUP_BUCKET"
bucket_name = "padiem-workspace-files"

# The bearer token is NOT declared here. After an authorized deployment:
#   wrangler secret put COM2_BACKUP_WRITE_TOKEN
# Never commit, log or print its value. The Worker resolves it from the binding
# and fails closed (503 backup_token_unavailable) when it is absent.
