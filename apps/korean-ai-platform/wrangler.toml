name = "ai-revenue-korean-ai-platform"
main = "worker.py"
compatibility_date = "2026-07-25"
compatibility_flags = ["python_workers"]
workers_dev = true

[assets]
directory = "static"
binding = "ASSETS"

[vars]
# The canonical B14 deployment is explicitly live. Provider credentials are
# never stored in this file: BYOK keys arrive per-request, and platform-owned
# provider secrets (when re-enabled) are resolved through Worker bindings.
# The vestigial Poolside Secrets Store binding was removed in #1961 — the
# store item no longer exists, and its authorization check (error 10021)
# blocked every gated deploy while Poolside is unreachable from the catalog.
B14_PROVIDER_MODE = "live"
