name = "ai-revenue-korean-ai-platform"
main = "worker.py"
# Wrangler bundling: include the single canonical B14 JSON verbatim.
find_additional_modules = true
preserve_file_names = true

compatibility_date = "2026-07-25"
compatibility_flags = ["python_workers"]
workers_dev = true

# #3554 owner-approved B14 504 forensics (2026-10-10): persist bounded Worker
# invocation logs, safe provider timeout phase and overall gateway deadline.
# 100% sampling is intentional while this low-traffic diagnostic is open;
# review pricing/retention and reduce sampling once the incident is resolved.
# Never log provider credentials, customer documents or response bodies.
[observability]
enabled = true
head_sampling_rate = 1

[assets]
directory = "static"
binding = "ASSETS"

[vars]
# The canonical B14 deployment is explicitly live. Provider credential values
# are never stored in this file. BYOK keys arrive per-request; platform-owned
# credentials are resolved through named Worker bindings.
B14_PROVIDER_MODE = "live"

# Owner correction #3209: reuse the existing Kilo credential already held in
# the account Secrets Store. Only binding metadata is committed; the value never
# enters source, logs, browser responses, Chat, Claw, or Legal.
[[secrets_store_secrets]]
binding = "PADIEM_B14_CREDENTIAL_08"
store_id = "f0b09ca04a7b43248154c773704a5616"
secret_name = "PADIEM_B14_CREDENTIAL_08"

# #2571 owner-approved B.AI account secret projection. The Secrets Store value
# remains account-managed; only the binding metadata is committed here.
[[secrets_store_secrets]]
binding = "PADIEM_B14_CREDENTIAL_03"
store_id = "f0b09ca04a7b43248154c773704a5616"
secret_name = "PADIEM_B14_CREDENTIAL_03"

# Owner decision 2026-09-18: Agnes plus-pool credential projection. The Secrets
