[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "korean-ai-platform"
version = "0.2.0"
description = "Korean AI Platform (Business 14) — API Provider Phase 0 Demo"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.45,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "uvicorn>=0.32,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "workers-py==1.16.2",
    "workers-runtime-sdk>=1.6.3",
    "playwright>=1.50,<2",
]

[tool.pywrangler]
allow-build = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:Using .httpx. with .starlette.testclient",
    "ignore:Setting per-request cookies",
    "ignore:The `route` decorator is deprecated:DeprecationWarning",
    # TestClient/anyio portal and asyncio Proactor/Selector self-pipe sockets are
    # closed by GC at nondeterministic points; under PYTHONWARNINGS=error their
    # ResourceWarnings surface inside an unrelated later test. Narrowly scoped to
    # the resource types; product code performs no real network I/O in tests.
    "ignore:unclosed <socket.socket:ResourceWarning",
    "ignore:unclosed event loop:ResourceWarning",
]
