[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "korean-ai-platform"
version = "0.2.0"
description = "Korean AI Platform (Business 14) — API Provider Phase 0 Demo"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.45,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "uvicorn>=0.32,<1",
    "pytest>=8.3,<9",
    "workers-py>=1.15.0",
    "workers-runtime-sdk>=1.6.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
