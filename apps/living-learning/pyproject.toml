[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "living-learning"
version = "0.1.0"
description = "Living Learning — recurring 10-minute learning sessions for Korean adult AI/Python beginners"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.28,<1",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
]
firebase = [
    "firebase-admin>=6.5",
]
modal = [
    "modal>=0.62",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"*" = ["../migrations_postgres/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]