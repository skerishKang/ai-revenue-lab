<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Living Travel - Operator Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
    <div class="card">
        <h1>Operator Login</h1>
        <p class="subtitle">Enter the operator secret to access the dashboard.</p>
        {% if error %}
        <div class="alert alert-error">{{error}}</div>
        {% endif %}
        <form method="post" action="/operator/login">
            <input type="hidden" name="csrf_token" value="{{csrf_token}}">
            <label for="secret">Operator Secret</label>
            <input type="password" id="secret" name="secret" required autocomplete="off">
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
    </div>
</body>
</html>
