[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "living-travel"
version = "0.2.0"
description = "Living Travel — personalized travel publication service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.18",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.28,<1",
    "build>=1.2",
    "playwright>=1.55,<2",
]
firebase = [
    "firebase-admin>=6.5",
]
modal = [
    "modal>=0.62",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "migrations*"]
exclude = ["tests*", "pages-preview*"]

[tool.setuptools.package-data]
migrations = ["*.sql"]
"migrations.postgresql" = ["*.sql"]