<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Living Travel — Editorial Desk</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div class="preview-banner">UI Preview · Synthetic data · No persistence</div>

  <div class="operator-login-page">
    <div class="operator-login-card">
      <h1>Editorial Desk</h1>
      <p class="subtitle" style="text-align: center; font-size: 0.9rem;">
        Living Travel 운영자 전용 워크스페이스
      </p>

      <div class="notice" style="text-align: left;">
        <strong>Synthetic Preview</strong><br>
        이 화면은 제품 검토용 가상 데이터로 구성되며 실제 인증을 수행하지 않습니다.
      </div>

      <form method="post" action="#" onsubmit="return false;">
        <input type="hidden" name="csrf_token" value="preview-csrf-token">
        <label for="secret">Operator Secret</label>
        <input type="password" id="secret" name="secret" required autocomplete="off"
               value="preview-operator-secret">
        <p class="small" style="margin-top: -0.5rem; margin-bottom: 1rem;">
          ※ 정적 프리뷰: 실제 인증 없이 <a href="dashboard.html">대시보드</a>로 이동합니다.
        </p>
        <a href="dashboard.html" class="btn btn-primary" style="width: 100%; justify-content: center;">Login</a>
      </form>

      <div style="text-align: center; margin-top: 1rem;">
        <a href="../index.html" class="hero-operator-link">← Preview Home</a>
      </div>
    </div>
  </div>
</body>
</html>
