<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Living Travel — Editorial Desk</title>
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/v2.css">
  <link rel="stylesheet" href="../assets/operator-v2.css">
</head>
<body class="lt-v2 lt-operator">
  <span class="lt-sr-only">Synthetic Preview</span>

  <main class="lt-op-login">
    <section class="lt-op-login-context">
      <a href="../index.html" class="lt-op-brand" style="position:absolute;top:1.5rem;left:1.5rem;"><span>LT</span>Living Travel</a>
      <div class="lt-op-eyebrow" style="color:var(--lt-lime);">Editorial control desk</div>
      <h1>여행을<br>발행하기 전.</h1>
      <p>여행자의 취향, 생성된 동선, 출처와 편집 결과를 한 번에 보고 발행 여부를 판단하는 운영자 워크스페이스입니다.</p>
    </section>

    <section class="lt-op-login-form">
      <div class="lt-op-eyebrow">Operator access</div>
      <h2>Editorial Desk</h2>
      <p class="lt-op-deck" style="margin-bottom:.5rem;">정적 검토 화면에서는 실제 인증을 수행하지 않습니다.</p>
      <form method="post" action="#" onsubmit="return false;">
        <input type="hidden" name="csrf_token" value="preview-csrf-token">
        <label for="secret">Operator Secret</label>
        <input type="password" id="secret" name="secret" required autocomplete="off" value="preview-operator-secret">
        <a href="dashboard.html" class="btn btn-primary">Login <span aria-hidden="true">→</span></a>
      </form>
      <p class="lt-qa-note" style="margin-top:1rem;">Preview fixture · 실제 backend/database 변경 없음</p>
    </section>
  </main>
</body>
</html>
