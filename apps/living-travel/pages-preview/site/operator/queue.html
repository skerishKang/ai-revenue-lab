<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Living Travel — 운영자 대기열</title>
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/demo.css">
</head>
<body>
  <div class="demo-banner">Demo · Synthetic data · No booking</div>

  <nav class="operator-nav">
    <a href="../operator/queue.html" class="brand">◈ Living Travel · 운영자</a>
    <div class="nav-links">
      <a href="../operator/queue.html" class="active" style="color:var(--ink);">검토 대기</a>
      <a href="../demo/intro.html">데모로 돌아가기</a>
    </div>
  </nav>

  <main class="operator-main">
    <div class="operator-desk-header">
      <h1>검토 대기열</h1>
      <span class="operator-desk-summary">1건의 검토 대기</span>
    </div>

    <div class="operator-section" style="margin-top:1.5rem;">
      <div class="operator-queue-item">
        <div class="operator-queue-info">
          <span class="operator-queue-edition">부산 2박 3일 — 1판</span>
          <span class="operator-queue-traveler">여행자 B-014</span>
          <span class="operator-queue-meta">
            Demo fixture · 12 sources · 골목/음식/바다 관심
          </span>
        </div>
        <div class="operator-queue-actions">
          <span class="badge badge-pending">pending_review</span>
          <a href="../operator/review.html" class="btn btn-sm btn-primary">검토</a>
        </div>
      </div>
    </div>

    <div class="notice" style="margin-top:2rem;">
      <strong>Demo mode</strong><br>
      이 화면은 데모용 합성 데이터입니다. 실제 운영자 대시보드가 아닙니다.
    </div>
  </main>
</body>
</html>
