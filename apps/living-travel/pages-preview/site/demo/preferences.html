<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Living Travel — 여행 취향 설정</title>
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/demo.css">
</head>
<body>
  <div class="demo-banner">Demo · Synthetic data · No booking</div>

  <div class="demo-pref-page">
    <div class="demo-pref-container">
      <h1>여행 취향을 알려주세요</h1>
      <p class="subtitle">선택한 내용으로 개인 여행판을 만듭니다. 데모에서는 고정된 부산 여행 시나리오를 사용합니다.</p>

      <form method="get" action="generation.html" onsubmit="return simulateGeneration(event)">

        <div class="demo-pref-group">
          <label class="group-label">목적지</label>
          <div class="demo-pref-options">
            <button type="button" class="demo-pref-option selected" onclick="togglePref(this)" disabled>부산</button>
          </div>
        </div>

        <div class="demo-pref-group">
          <label class="group-label">여행 기간</label>
          <div class="demo-pref-options">
            <button type="button" class="demo-pref-option selected" onclick="togglePref(this)" disabled>2박 3일</button>
          </div>
        </div>

        <div class="demo-pref-group">
          <label class="group-label">여행 속도</label>
          <div class="demo-pref-options">
            <button type="button" class="demo-pref-option selected" onclick="togglePref(this)">천천히</button>
            <button type="button" class="demo-pref-option" onclick="togglePref(this)">보통</button>
            <button type="button" class="demo-pref-option" onclick="togglePref(this)">빠르게</button>
          </div>
        </div>

        <div class="demo-pref-group">
          <label class="group-label">관심사 (중복 선택)</label>
          <div class="demo-pref-options">
            <button type="button" class="demo-pref-option selected" onclick="togglePref(this)">골목 탐방</button>
            <button type="button" class="demo-pref-option selected" onclick="togglePref(this)">현지 음식</button>
            <button type="button" class="demo-pref-option selected" onclick="togglePref(this)">바다</button>
            <button type="button" class="demo-pref-option" onclick="togglePref(this)">카페</button>
            <button type="button" class="demo-pref-option" onclick="togglePref(this)">문화/역사</button>
            <button type="button" class="demo-pref-option" onclick="togglePref(this)">자연/공원</button>
          </div>
        </div>

        <div class="demo-pref-group">
          <label class="group-label">피하고 싶은 것 (중복 선택)</label>
          <div class="demo-pref-options">
            <button type="button" class="demo-pref-option selected" onclick="togglePref(this)">유명 관광지</button>
            <button type="button" class="demo-pref-option" onclick="togglePref(this)">번화가</button>
            <button type="button" class="demo-pref-option selected" onclick="togglePref(this)">사람 많은 곳</button>
            <button type="button" class="demo-pref-option" onclick="togglePref(this)">야간 활동</button>
          </div>
        </div>

        <div class="demo-pref-group">
          <label class="group-label">원하는 분위기</label>
          <div class="demo-pref-options">
            <button type="button" class="demo-pref-option selected" onclick="togglePref(this)">조용한</button>
            <button type="button" class="demo-pref-option" onclick="togglePref(this)">활기찬</button>
            <button type="button" class="demo-pref-option" onclick="togglePref(this)">로컬 감성</button>
            <button type="button" class="demo-pref-option" onclick="togglePref(this)">힐링</button>
          </div>
        </div>

        <div class="notice" style="margin-top:2rem;">
          <strong>Demo mode</strong><br>
          선택한 취향은 데모 시나리오에 반영됩니다. 실제 AI 처리는 이루어지지 않습니다.
        </div>

        <button type="submit" class="btn btn-accent" style="width:100%;padding:0.75rem;margin-top:1.5rem;font-size:1rem;">
          이 취향으로 여행판 만들기
        </button>
      </form>
    </div>
  </div>

  <script>
  function togglePref(el) {
    if (el.disabled) return;
    el.classList.toggle('selected');
  }

  function simulateGeneration(e) {
    e.preventDefault();
    window.location.href = 'generation.html';
  }
  </script>
</body>
</html>
