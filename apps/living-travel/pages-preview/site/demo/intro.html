<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Living Travel — 인터랙티브 데모</title>
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/demo.css">
</head>
<body>
  <div class="demo-banner">Demo · Synthetic data · No booking</div>

  <section class="demo-hero" style="background:none;position:relative;">
    <img src="../assets/images/busan-hero.webp" alt="부산 해안과 도심의 합성 데모 이미지" width="1200" height="600" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">
    <div style="position:absolute;inset:0;background:linear-gradient(135deg, rgba(26,60,52,0.7) 0%, rgba(58,122,114,0.4) 50%, rgba(198,106,74,0.3) 100%);pointer-events:none;"></div>
    <div class="demo-hero-content">
      <h1 class="demo-hero-brand">
        Living
        <span class="demo-hero-brand-accent">Travel</span>
      </h1>
      <p class="demo-hero-tagline">
        내 취향을 담아 만들고,<br>
        피드백에 따라 다시 편집되는 개인 여행판
      </p>
      <p class="demo-hero-desc">
        3분 동안 클릭으로 경험하는 Living Travel 콘셉트 데모입니다.<br>
        실제 AI 호출이나 데이터 저장은 이루어지지 않습니다.
      </p>
      <div class="demo-hero-actions">
        <a href="preferences.html" class="btn btn-primary" style="background:var(--terracotta);border-color:var(--terracotta);font-size:1rem;padding:0.75rem 2rem;">내 여행판 시작하기</a>
        <a href="../index.html" class="btn btn-outline" style="color:rgba(255,255,255,0.7);border-color:rgba(255,255,255,0.3);">기존 프리뷰로 돌아가기</a>
      </div>
    </div>
  </section>
</body>
</html>
