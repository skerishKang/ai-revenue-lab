<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Living Travel — 다음 여행판의 방향</title>
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/demo.css">
  <link rel="stylesheet" href="../assets/v2.css">
  <link rel="stylesheet" href="../assets/v2-feedback-refine.css">
</head>
<body class="lt-v2">
  <span class="lt-sr-only">Demo · Synthetic data · No booking</span>

  <nav class="lt-nav" aria-label="Living Travel">
    <a class="lt-brand" href="traveler-home.html"><span class="lt-brand-dot">LT</span>Living Travel</a>
    <div class="lt-nav-links"><a href="edition.html">Edition #01</a></div>
  </nav>

  <main class="lt-feedback-shell">
    <aside class="lt-feedback-context">
      <div class="lt-step-label" style="color:var(--lt-lime);">04 / Recut the trip</div>
      <h1>다음 판의<br>리듬을 바꿔 주세요.</h1>
      <p>좋아요/싫어요가 아니라, 이동량과 장소의 성격을 어떻게 바꿀지 알려주는 편집 브리프입니다.</p>
      <div class="lt-feedback-route">
        <div><strong>현재 하루 장소 수</strong><span>4–5</span></div>
        <div><strong>관광지 비중</strong><span>HIGH</span></div>
        <div><strong>동네 체류</strong><span>MED</span></div>
        <div><strong>걷는 시간</strong><span>HIGH</span></div>
      </div>
    </aside>

    <section class="lt-feedback-panel">
      <div class="lt-section-code">Editorial brief</div>
      <h2>무엇을 덜고,<br>무엇을 더할까요?</h2>
      <p class="lt-pref-deck">선택 결과는 다음 여행판의 장소 수·동선·체류시간·콘텐츠 강조점에 반영됩니다.</p>

      <form method="get" action="comparison.html" onsubmit="return submitFeedback(event)">
        <div class="lt-feedback-grid">
          <label><input type="checkbox" id="fb-slower" checked> 더 천천히 · 장소 수 줄이기</label>
          <label><input type="checkbox" id="fb-less-tourist" checked> 유명 관광지 비중 줄이기</label>
          <label><input type="checkbox" id="fb-more-food"> 현지 음식에 더 오래 머물기</label>
          <label><input type="checkbox" id="fb-less-walk"> 긴 걷기 일정 줄이기</label>
          <label><input type="checkbox" id="fb-quieter" checked> 조용한 생활권 늘리기</label>
          <label><input type="checkbox" id="fb-sea"> 바다 체류시간 늘리기</label>
        </div>

        <label for="freeText" class="lt-section-code" style="display:block;margin-bottom:.7rem;">One more direction</label>
        <textarea id="freeText" rows="4" placeholder="예: 더 조용하고 느린 동네 중심으로 바꿔 주세요." maxlength="200" oninput="updateCharCount()"></textarea>
        <div class="char-counter"><span id="charCount">0</span>/200</div>

        <div class="lt-feedback-submit">
          <button type="submit" class="btn btn-accent">다음 여행판에 반영하기 <span aria-hidden="true">→</span></button>
        </div>
      </form>
    </section>
  </main>

  <script>
  function updateCharCount() {
    var el = document.getElementById('freeText');
    var count = document.getElementById('charCount');
    if (el.value.length > 200) el.value = el.value.substring(0, 200);
    count.textContent = el.value.length;
  }
  function submitFeedback(e) {
    e.preventDefault();
    window.location.href = 'comparison.html';
    return false;
  }
  </script>
</body>
</html>
