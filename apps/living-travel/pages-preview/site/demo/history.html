<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Living Travel — 여행판 기록</title>
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/demo.css">
</head>
<body>
  <div class="demo-banner">Demo · Synthetic data · No booking</div>

  <nav class="navbar traveler-nav">
    <a href="traveler-home.html" class="brand">Living Travel</a>
    <div class="nav-links">
      <a href="traveler-home.html">내 여행</a>
      <a href="history.html" class="active">지난 기록</a>
      <a href="../index.html">홈</a>
    </div>
  </nav>

  <main class="container" style="max-width:var(--max-reading);">
    <div class="archive-header">
      <h1>여행판 기록</h1>
      <p class="meta">여행자 B-014 · 부산 2박 3일</p>
    </div>

    <div class="demo-history-timeline">
      <div class="demo-history-item feedback-applied">
        <div class="demo-history-dot"></div>
        <div class="dashboard-current-card">
          <div class="edition-entry-header" style="display:flex;align-items:baseline;gap:0.75rem;padding:1.25rem 1.25rem 0;">
            <span class="edition-entry-number">#2</span>
            <span class="badge badge-published">발행됨</span>
            <span class="badge badge-info" style="margin-left:0.25rem;">피드백 반영</span>
          </div>
          <div class="edition-entry-body" style="padding:0.5rem 1.25rem 1.25rem;">
            <div class="edition-entry-destination">부산: 골목에 머물다, 개인적인 하루</div>
            <div class="edition-entry-meta">
              <span>2026. 7. 24. 발행</span>
            </div>
            <div class="feedback-summary" style="margin:0.5rem 0 0;">
              <strong>반영한 피드백</strong><br>
              더 천천히 · 유명 관광지 줄이기 · 조용한 장소 늘리기
            </div>
          </div>
          <div style="padding:0 1.25rem 1.25rem;">
            <a href="edition-2.html" class="btn btn-sm btn-accent">2판 읽기</a>
          </div>
        </div>
      </div>

      <div class="demo-history-item">
        <div class="demo-history-dot"></div>
        <div class="dashboard-current-card">
          <div class="edition-entry-header" style="display:flex;align-items:baseline;gap:0.75rem;padding:1.25rem 1.25rem 0;">
            <span class="edition-entry-number">#1</span>
            <span class="badge badge-published">발행됨</span>
          </div>
          <div class="edition-entry-body" style="padding:0.5rem 1.25rem 1.25rem;">
            <div class="edition-entry-destination">부산: 골목과 바다, 그리고 조용한 아침</div>
            <div class="edition-entry-meta">
              <span>2026. 7. 24. 발행</span>
            </div>
            <div class="edition-entry-meta" style="margin-top:0.25rem;">
              <span class="badge badge-info">의견 있음</span>
            </div>
          </div>
          <div style="padding:0 1.25rem 1.25rem;">
            <a href="edition.html" class="btn btn-sm btn-outline">1판 읽기</a>
            <a href="comparison.html" class="btn btn-sm btn-outline" style="margin-left:0.5rem;">변화 비교</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>Living Travel — Interactive Concept Demo</p>
  </footer>
</body>
</html>
