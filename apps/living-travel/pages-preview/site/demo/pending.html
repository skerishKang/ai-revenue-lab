<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Living Travel — 검토 대기</title>
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/demo.css">
  <link rel="stylesheet" href="../assets/b2-v2-457.css">
  <link rel="stylesheet" href="../assets/b2-shell-20260810.css">
</head>
<body class="lt-v2">
  <div class="demo-banner">Demo · Synthetic data · No booking</div>
  <header class="lt-topbar">
    <a class="lt-wordmark" href="traveler-home.html">Living Travel</a>
    <nav class="lt-nav" aria-label="여행자 메뉴">
      <a href="traveler-home.html">Current trip</a>
      <a href="history.html">Archive</a>
      <a href="feedback.html">Feedback</a>
    </nav>
  </header>

  <div class="demo-pending-page">
    <div class="demo-pending-card">
      <span class="demo-pending-icon">📋</span>
      <h1>여행판 검토 대기 중</h1>
      <p class="subtitle" style="margin-bottom:1.5rem;">
        운영자가 여행판을 검토하고 있습니다.
      </p>

      <div style="text-align:left;margin-bottom:1.5rem;">
        <div class="preferences-grid" style="grid-template-columns:1fr 1fr;">
          <div class="preference-item"><label>여행자</label><span class="value">여행자 B-014</span></div>
          <div class="preference-item"><label>목적지</label><span class="value">부산</span></div>
          <div class="preference-item"><label>기간</label><span class="value">2박 3일</span></div>
          <div class="preference-item"><label>속도</label><span class="value">천천히</span></div>
          <div class="preference-item"><label>관심사</label><span class="value">골목 · 현지 음식 · 바다</span></div>
          <div class="preference-item"><label>분위기</label><span class="value">조용한 · 로컬 감성</span></div>
        </div>
      </div>

      <div class="notice" style="margin-bottom:1.5rem;">
        <strong>Demo 진행</strong><br>
        데모에서는 검토 결과가 미리 구성된 시나리오로 진행됩니다. 운영자 화면에서 '발행'을 선택하면 다음 단계로 넘어갑니다.
      </div>

      <div style="display:flex;gap:0.75rem;flex-direction:column;">
        <a href="traveler-home.html" class="btn btn-accent" style="width:100%;padding:0.7rem;">검토 완료 상태 보기</a>
        <a href="../operator/queue.html" class="btn btn-outline" style="width:100%;">운영자 대기열 보기</a>
      </div>
    </div>
  </div>
<script src="../assets/b2-shell-20260810.js"></script>
</body>
</html>
