<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="noindex" />
  <title>PADIEM 의원3종</title>
  <link rel="icon" href="data:," />
  <!--
    PADIEM 의원3종 독립 진입점.

    * Chat/Claw 화면과 별도 진입점이며, 임미란 의원 홈페이지(별도 래퍼)와도 다른 사용자 진입이다.
    * 이 앱은 자체 AI 엔진·라우터·인증·저장을 두지 않는다. 생성은 기존 PADIEM 공용 계약
      (POST /api/chat, B14 라우터)을, 저장은 기존 프로젝트 파일 계약(/api/projects/{pid}/files)을,
      로그인은 기존 세션 계약(POST /api/auth/password/login, GET /api/auth/status)을 그대로 사용한다.
    * 로그인이 필요하면 이 화면 안에서 한다. PADIEM Chat 홈페이지로 이동시키지 않는다.
      Google 로그인은 제공자 왕복이 끝나면 이 화면으로 돌아온다(서명된 상태값의 허용 목록으로만 판정).
    * 미로그인 상태에서는 설명만 보이고, 도구 빌더는 붙지 않는다(fail-closed).
  -->
  <link rel="stylesheet" href="/padiem-themes.css" />
  <link rel="stylesheet" href="./static/council-app.css" />
</head>
<body class="council-body">
  <a class="council-skip" href="#councilMain">본문 바로가기</a>
  <header class="council-topbar">
    <div class="council-brand">
      <!-- 글로벌 시안의 표장 그대로: 임의의 추상 주두 실루엣이며 어떤 기관의 표장·로고도 묘사하지 않는다. -->
      <span class="council-brand-mark" aria-hidden="true">
        <svg viewBox="0 0 30 30" focusable="false"><path d="M4 25h22M5 22h20M7 12h16M6 12l9-7 9 7M9 12v10M13 12v10M17 12v10M21 12v10" /></svg>
      </span>
      <span class="council-brand-name">PADIEM 의원3종</span>
    </div>
    <div class="council-topbar-actions">
      <span class="council-badge" id="councilAuthBadge">확인 중…</span>
      <label class="council-country" for="councilCountry">콘텐츠 언어
        <select id="councilCountry" name="country" aria-label="콘텐츠 언어(국가)">
          <option value="kr">한국어</option>
          <option value="us">English (US)</option>
          <option value="uk">English (UK)</option>
          <option value="fr">Français</option>
        </select>
      </label>
      <button type="button" class="council-badge-action" id="councilAuthAction" hidden>로그인</button>
    </div>
  </header>
  <main id="councilMain">
    <h1 class="council-title">의원실 업무 도구 3종</h1>
    <section class="council-auth" id="councilAuthPanel" hidden aria-labelledby="councilAuthTitle">
      <h2 id="councilAuthTitle">PADIEM 로그인</h2>
      <p class="council-auth-lead">
        의원3종은 기존 PADIEM 계정으로 사용합니다. 계정을 새로 만들지 않고, 이 화면에서 로그인한 뒤
        선택한 업무에 바로 이어집니다.
      </p>
      <form id="councilLoginForm" class="council-form council-auth-form">
        <label>이메일
          <input name="identifier" type="email" autocomplete="username" required />
        </label>
        <label>비밀번호
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <div class="council-form-actions">
          <button type="submit" class="council-login">로그인</button>
        </div>
      </form>
      <p class="council-auth-alt" id="councilGoogleRow" hidden>
        <a class="council-google" id="councilGoogleLogin"
           href="/auth/google/start?return_to=%2Fapps%2Fcouncil%2F">Google로 로그인</a>
      </p>
      <p class="council-auth-status" id="councilAuthStatus" role="status" aria-live="polite" hidden></p>
    </section>
    <nav class="council-menu" aria-label="의원3종 기능 선택">
      <section class="council-card" id="council-speech" data-tool="speech" aria-labelledby="councilSpeechTitle">
        <span class="council-card-icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" focusable="false"><path d="M7 5h13a3 3 0 0 1 3 3v16a3 3 0 0 1-3 3H7z" /><path d="M11 11h8M11 15h8M11 19h5" /></svg>
        </span>
        <h2 id="councilSpeechTitle">축사·인사말</h2>
        <p>행사 정보를 입력하면 축사·인사말 초안을 준비합니다.</p>
        <button type="button" class="council-card-select" data-tool="speech"
                aria-controls="councilSpeechBody" aria-expanded="false">열기</button>
        <div class="council-card-body" id="councilSpeechBody" hidden></div>
      </section>
      <section class="council-card" id="council-sns" data-tool="sns" aria-labelledby="councilSnsTitle">
        <span class="council-card-icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" focusable="false"><path d="M5 13v6a2 2 0 0 0 2 2h3l8 5V6l-8 5H7a2 2 0 0 0-2 2z" /><path d="M23 11a6 6 0 0 1 0 10" /></svg>
        </span>
        <h2 id="councilSnsTitle">SNS 홍보</h2>
        <p>행사 소식을 블로그·페이스북·인스타그램 게시글 초안으로 준비합니다.</p>
        <button type="button" class="council-card-select" data-tool="sns"
                aria-controls="councilSnsBody" aria-expanded="false">열기</button>
        <div class="council-card-body" id="councilSnsBody" hidden></div>
      </section>
      <section class="council-card" id="council-meeting" data-tool="meeting" aria-labelledby="councilMeetingTitle">
        <span class="council-card-icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" focusable="false"><path d="M6 5h16a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H6z" /><path d="M11 11h9M11 15h9M11 19h6" /></svg>
        </span>
        <h2 id="councilMeetingTitle">회의정리·활동집</h2>
        <p>회의 내용을 요약·기록으로 남기고, 선택한 기록으로 활동집 초안을 만듭니다.</p>
        <button type="button" class="council-card-select" data-tool="meeting"
                aria-controls="councilMeetingBody" aria-expanded="false">열기</button>
        <div class="council-card-body" id="councilMeetingBody" hidden></div>
      </section>
    </nav>
  </main>
  <script src="./static/council-app.js" defer></script>
</body>
</html>
