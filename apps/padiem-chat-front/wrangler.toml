name = "padiem-chat-front"
main = "worker.mjs"
compatibility_date = "2026-10-01"
# No workers.dev and no preview URLs: the only way in is the custom domain the
# cutover moves here (see the 비공개 운영 기록(거버넌스 폴더, 같은 상대 경로), CHAT_COM2_FRONT_RUNBOOK.md).
workers_dev = false
preview_urls = false

# Nothing is deployed by this file beyond the assets binding and the proxy.
# The 2026-11-08 cutover moved the chat.padiem.net Custom Domain here
# (docs/operations/CHAT_PADIEM_NET_REQUEST_TOPOLOGY_20261108.md); keeping the
# route declared pins it on every front deploy, so a Python Worker deploy can
# never silently re-claim the public hostname again (the 2026-11-09 accident).
routes = [{ pattern = "chat.padiem.net", custom_domain = true }]

[assets]
directory = "../padiem-chat/static"
binding = "ASSETS"

# PADIEM_COM2_EDGE_SECRET is supplied separately as a Worker secret.
[vars]
FRONT_ORIGIN = "https://chat-com2.padiem.net"
# "static" → 503 maintenance page; "service" → padiem-chat Python Worker.
FALLBACK_MODE = "static"
# COM2 is canonical for writes; never send them to the Python fallback.
COM2_CANONICAL = "writes"
HEALTH_TTL_MS = "10000"
UPSTREAM_TIMEOUT_MS = "8000"
# Normal API reads can wait through COM2 load without affecting host health.
API_READ_TIMEOUT_MS = "30000"
# Fixed ceiling (#6460 4-2, set 2026-11-03 from the live measurement): the
# slowest normal orchestration answer on the server was 11.2s (median 10.9s,
# zero 504s). 60s leaves room for one Free-tier retry of that work while still
# failing a genuinely stuck turn.
ORCHESTRATION_TIMEOUT_MS = "60000"
# The login write waits on the same host work as the callback (OAuth exchange,
# JWKS verification, canonical identity RPC). Measured on the host: 52 events
# over 3 days where the identity RPC alone ran past the 5s live window and the
# front answered a cookie-less 504 while the session was created right after.
AUTH_WRITE_TIMEOUT_MS = "30000"
# Voice STT writes (live-token mint, file transcription) wait on the STT
# Worker's own bounded upstream budget plus the host→Chat-Worker RPC. Measured
# on the host: 5.7-7.6s for a healthy mint — the generic 8s window cut a 200
# answer at 7.6s (#7293). Same rule as the login write: 30s, configurable.
VOICE_STT_WRITE_TIMEOUT_MS = "30000"

# Read-path fallback target. Declared here so the binding exists in both modes;
# static mode simply never calls it.
[[services]]
binding = "CHAT_WORKER"
service = "padiem-chat"
