name = "padiem-ai-engine"
main = "worker_identity.py"
compatibility_date = "2026-08-27"
compatibility_flags = ["python_workers"]
workers_dev = false

[[services]]
binding = "B14_SERVICE"
service = "ai-revenue-korean-ai-platform"

[[services]]
binding = "CONTROL_PLANE_IDENTITY"
service = "padiem-control-plane-identity"

# #2216: canonical Google OAuth credential authority remains Control Plane.
# Engine receives only short-lived access leases over this private Service
# Binding; long-lived refresh credentials never enter Engine composition.
[[services]]
binding = "CONTROL_PLANE_GOOGLE_OAUTH"
service = "padiem-google-oauth-state"

# WO-8 PR-B (#1235 A9): durable idempotency + identity-bound continuation
# authority. Both bindings point at the SAME provisioned database
# (padiem-engine, database_id below; provision evidence: CI run 34042827563,
# recorded on #1621). App code never provisions schema; migrations 0001+0002
# are applied by the D1 provision gate.
[[d1_databases]]
binding = "ENGINE_IDEMPOTENCY"
database_name = "padiem-engine"
database_id = "6b77ad02-bc27-488f-bb97-6325f6750cba"

[[d1_databases]]
binding = "ENGINE_CONTINUATION"
database_name = "padiem-engine"
database_id = "6b77ad02-bc27-488f-bb97-6325f6750cba"

# WO-10 PR-C2 (D28): OAuth connector grant references only.
# Same provisioned database as ENGINE_IDEMPOTENCY/ENGINE_CONTINUATION.
# Schema 0003 applied by the D1 provision gate. Credential material is never
# stored in this D1 binding; canonical Google OAuth credentials stay in CP.
[[d1_databases]]
binding = "ENGINE_CONNECTOR_GRANTS"
database_name = "padiem-engine"
database_id = "6b77ad02-bc27-488f-bb97-6325f6750cba"

# #2182 S5: trusted multimodal image byte retention for the att_* resolver.
# Same provisioned database as the other Engine D1 bindings. Schema 0004
# (0004_engine_attachment_images.sql, #2152) is applied by the D1 provision
# gate; app code never creates or mutates it. This declares the repo-owned
# binding only - it does not provision, migrate or activate storage.
[[d1_databases]]
binding = "ENGINE_IMAGE_STORE"
database_name = "padiem-engine"
database_id = "6b77ad02-bc27-488f-bb97-6325f6750cba"
