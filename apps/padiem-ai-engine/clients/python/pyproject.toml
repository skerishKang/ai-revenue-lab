[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "padiem-ai-engine-client"
version = "0.1.0"
description = "Trusted first-party Python client for the internal Padiem AI Engine"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["padiem_ai_engine_client*"]
