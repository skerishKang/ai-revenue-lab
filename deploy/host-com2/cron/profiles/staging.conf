# Staging profile — COM2 Chat scheduled lane.
# Values are paths and ports only. Never put a secret value in this file.
PROFILE=staging
UNIT_NAME=padiem-chat-cron-staging
APP_ROOT=/opt/padiem/chat-staging
DATA_ROOT=/mnt/d/padiem/chat-staging
ENV_FILE=/opt/padiem/chat-staging/.env
SERVICE_USER=padiem-chat
QUEUE_ORIGIN=http://127.0.0.1:8830
START_TIMEOUT=300
# Must be supplied at install time; a staging period may differ from production.
CRON_SCHEDULE=
