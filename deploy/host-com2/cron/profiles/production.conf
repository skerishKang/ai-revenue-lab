# Production profile — COM2 Chat scheduled lane.
# Values are paths and ports only. Never put a secret value in this file.
PROFILE=production
UNIT_NAME=padiem-chat-cron-com2
APP_ROOT=/opt/padiem/chat-com2
DATA_ROOT=/mnt/d/padiem/chat-com2
ENV_FILE=/opt/padiem/chat-com2/.env
SERVICE_USER=padiem-chat
QUEUE_ORIGIN=http://127.0.0.1:8797
START_TIMEOUT=600
# MUST equal the deployed Cloudflare cron trigger (not declared in wrangler.toml;
# read it from the dashboard at cutover). Install refuses while this is empty.
CRON_SCHEDULE=
